name: DPRO CHAT B Medical Product Duplicate Copy Cleanup

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dpro-chat-b-${{ github.repository }}
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Repository guard
        shell: bash
        run: |
          if [ "$GITHUB_REPOSITORY" != "dpromstk2000-lab/dpro-line-systems-site" ]; then
            echo "Wrong repository: expected dpromstk2000-lab/dpro-line-systems-site, got $GITHUB_REPOSITORY" >&2
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clean duplicated MEDICAL Product wording
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path("systems/medical.html")
          if not p.exists():
              raise SystemExit("systems/medical.html not found")

          s = p.read_text(encoding="utf-8")
          before = s

          runtime_hook = 'data-tutorial-r6="MEDICAL-R6-V1.0-20260830"'
          if runtime_hook not in s:
              raise SystemExit("MEDICAL R6 runtime hook missing before cleanup")

          s = s.replace("公開公開デモ", "公開デモ")

          if "公開公開デモ" in s:
              raise SystemExit("duplicate public-demo wording remains")

          for forbidden in [
              "PRODUCT SITE",
              "CORE",
              "Feature Flag",
              "Server-side Security",
              "SALES ROUTE",
              "PUBLIC DEMO",
              "REAL CUSTOMER LIVE",
              "LIVE DEMO",
              "Supabase",
              "Cloudflare",
              "Worker",
              "LIFF",
              "GO LIVE",
          ]:
              if forbidden in s:
                  raise SystemExit(f"internal token unexpectedly present: {forbidden}")

          for required in [
              "医療機関向け製品紹介",
              "DPRO MEDICALの特長",
              "公開デモ",
              "5つの連携画面",
              "6つの診療パターン",
              "設計と安全な運用",
              "必要な機能を医院ごとに設定",
              "認証と権限管理",
          ]:
              if required not in s:
                  raise SystemExit(f"expected finalized wording missing: {required}")

          if runtime_hook not in s:
              raise SystemExit("MEDICAL R6 runtime hook lost")

          for required_url in [
              "https://dpromstk2000-lab.github.io/dpro-medical-standard/medical-public-demo.html",
              "https://dpro-shop.com/systems/medical",
              "../flyer-medical.html",
              "../systems.html",
          ]:
              if required_url not in s:
                  raise SystemExit(f"required URL missing: {required_url}")

          if s != before:
              p.write_text(s, encoding="utf-8")

          print("MEDICAL PRODUCT DUPLICATE COPY CLEANUP:", "CHANGED" if s != before else "ALREADY_OK")
          PY

      - name: Static copy and runtime QA
        shell: bash
        run: |
          ! grep -q '公開公開デモ' systems/medical.html
          grep -q '公開デモ' systems/medical.html
          grep -q 'data-tutorial-r6="MEDICAL-R6-V1.0-20260830"' systems/medical.html
          grep -q 'https://dpromstk2000-lab.github.io/dpro-medical-standard/medical-public-demo.html' systems/medical.html
          echo 'MEDICAL PRODUCT duplicate copy QA: PASS'

      - name: Commit forward-only fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm --ignore-unmatch ".github/workflows/dpro-chat-b-medical-product-duplicate-copy-cleanup.yml"
          git add "systems/medical.html"
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Clean CHAT B MEDICAL product duplicate wording"
          git push
