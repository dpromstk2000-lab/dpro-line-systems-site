name: WELFARE_EQUIPMENT Tutorial R6 Product Site + LIVE QA + FINAL LOCK Candidate

on:
  push:
    paths:
      - '.github/workflows/welfare-equipment-tutorial-r6-product-site-live-qa.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: welfare-equipment-tutorial-r6-product-site-live-qa
  cancel-in-progress: false

jobs:
  r6-product-site-live-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout newest Product Site main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Forward to newest Product Site main and verify R5 source
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          echo "PRODUCT_SITE_BEFORE=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

          rm -rf /tmp/dpro-welfare-equipment-line
          git clone --quiet https://github.com/dpromstk2000-lab/dpro-welfare-equipment-line.git /tmp/dpro-welfare-equipment-line
          INDUSTRY_HEAD=$(git -C /tmp/dpro-welfare-equipment-line rev-parse HEAD)
          git -C /tmp/dpro-welfare-equipment-line merge-base --is-ancestor 1be35ccc5163aac31288cefbfd6bcd323c3294c6 HEAD
          test -s /tmp/dpro-welfare-equipment-line/manuals/R5_MANUAL_QA_EVIDENCE.txt
          grep -q 'RESULT: PASS' /tmp/dpro-welfare-equipment-line/manuals/R5_MANUAL_QA_EVIDENCE.txt
          grep -q 'R3/R4 anchors: PASS' /tmp/dpro-welfare-equipment-line/manuals/R5_MANUAL_QA_EVIDENCE.txt
          grep -q 'Tutorial businessMutation: 0' /tmp/dpro-welfare-equipment-line/manuals/R5_MANUAL_QA_EVIDENCE.txt
          test -s /tmp/dpro-welfare-equipment-line/manuals/DPRO_TUTORIAL_WELFARE_EQUIPMENT_QUICK_START_V1.0.pdf
          test -s /tmp/dpro-welfare-equipment-line/manuals/DPRO_TUTORIAL_WELFARE_EQUIPMENT_DETAILED_MANUAL_V1.0.pdf
          test -s /tmp/dpro-welfare-equipment-line/manuals/DPRO_TUTORIAL_WELFARE_EQUIPMENT_QUICK_START_V1.0.png
          test -s /tmp/dpro-welfare-equipment-line/manuals/DPRO_TUTORIAL_WELFARE_EQUIPMENT_DETAILED_MANUAL_V1.0.png
          grep -q 'href="tutorial.css"' /tmp/dpro-welfare-equipment-line/guide-center.html
          grep -q 'src="tutorial.js"' /tmp/dpro-welfare-equipment-line/guide-center.html
          grep -q 'id="guide-resume"' /tmp/dpro-welfare-equipment-line/guide-center.html
          grep -q 'id="guide-replay"' /tmp/dpro-welfare-equipment-line/guide-center.html
          for f in member.html planning.html staff-login.html operations.html; do
            grep -q 'href="tutorial.css"' "/tmp/dpro-welfare-equipment-line/$f"
            grep -q 'src="tutorial.js"' "/tmp/dpro-welfare-equipment-line/$f"
          done
          echo "INDUSTRY_HEAD=$INDUSTRY_HEAD" >> "$GITHUB_ENV"

      - name: Patch WELFARE_EQUIPMENT Product Site tutorial section
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          page = Path('systems/welfare-equipment.html')
          mirror = Path('systems/welfare-equipment.html.txt')
          if not page.exists():
              raise SystemExit('Product Site target missing: systems/welfare-equipment.html')
          html = page.read_text(encoding='utf-8')

          marker = 'data-welfare-equipment-tutorial-r6="1"'
          css_marker = '/* WELFARE_EQUIPMENT TUTORIAL R6 */'
          guide = 'https://dpromstk2000-lab.github.io/dpro-welfare-equipment-line/guide-center.html'
          quick = 'https://dpromstk2000-lab.github.io/dpro-welfare-equipment-line/manuals/DPRO_TUTORIAL_WELFARE_EQUIPMENT_QUICK_START_V1.0.pdf'
          detail = 'https://dpromstk2000-lab.github.io/dpro-welfare-equipment-line/manuals/DPRO_TUTORIAL_WELFARE_EQUIPMENT_DETAILED_MANUAL_V1.0.pdf'
          quick_png = 'https://dpromstk2000-lab.github.io/dpro-welfare-equipment-line/manuals/DPRO_TUTORIAL_WELFARE_EQUIPMENT_QUICK_START_V1.0.png'
          detail_png = 'https://dpromstk2000-lab.github.io/dpro-welfare-equipment-line/manuals/DPRO_TUTORIAL_WELFARE_EQUIPMENT_DETAILED_MANUAL_V1.0.png'

          css = r'''
          /* WELFARE_EQUIPMENT TUTORIAL R6 */
          .ps-tutorial-r6{background:linear-gradient(180deg,#f4fbfb,#fff)}
          .ps-tutorial-r6__grid{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:1.15rem;align-items:stretch}
          .ps-tutorial-r6__panel{padding:1.2rem;border:1px solid var(--ps-line);border-radius:1.2rem;background:#fff;box-shadow:var(--dpro-shadow-sm)}
          .ps-tutorial-r6__panel h3{margin:0 0 .45rem;color:var(--ps-deep);font-size:1.18rem}
          .ps-tutorial-r6__panel p{margin:.35rem 0;color:var(--dpro-warm-gray-600)}
          .ps-tutorial-r6__actions{display:flex;flex-wrap:wrap;gap:.55rem;margin-top:1rem}
          .ps-tutorial-r6__actions .dpro-button{width:auto;min-height:44px}
          .ps-tutorial-r6__hint{margin-top:.8rem;padding:.75rem .85rem;border-left:4px solid var(--ps-gold);background:var(--ps-pale);font-size:.88rem}
          .ps-tutorial-r6__manuals{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.85rem}
          .ps-tutorial-r6__manual{display:flex;min-width:0;flex-direction:column;overflow:hidden;border:1px solid var(--ps-line);border-radius:1rem;background:#fff;text-decoration:none}
          .ps-tutorial-r6__manual img{display:block;width:100%;aspect-ratio:210/297;object-fit:cover;object-position:top;background:#f2f5f3;border-bottom:1px solid var(--ps-line)}
          .ps-tutorial-r6__manual-copy{display:block;padding:.9rem}
          .ps-tutorial-r6__manual-copy strong{display:block;color:var(--ps-deep)}
          .ps-tutorial-r6__manual-copy span{display:block;margin-top:.2rem;color:var(--dpro-warm-gray-600);font-size:.82rem}
          .ps-tutorial-r6 a:focus-visible{outline:3px solid #ff9f1a;outline-offset:3px}
          @media(max-width:980px){.ps-tutorial-r6__grid{grid-template-columns:1fr}}
          @media(max-width:640px){.ps-tutorial-r6__actions{display:grid;grid-template-columns:1fr}.ps-tutorial-r6__actions .dpro-button{width:100%}}
          @media(max-width:390px){.ps-tutorial-r6__manuals{grid-template-columns:1fr}}
          '''

          section = f'''<section class="dpro-section ps-tutorial-r6" id="tutorial" {marker} aria-labelledby="tutorial-title"><div class="dpro-container"><div class="ps-section-heading"><p class="ps-kicker">GUIDE &amp; PRINT MANUALS</p><h2 id="tutorial-title">初めてでも、画面を見ながら進められます。</h2><p>Guide CenterとFirst10で福祉用具の操作の流れを確認し、印刷用のQuick Start・詳細マニュアルもそのまま利用できます。</p></div><div class="ps-tutorial-r6__grid"><div class="ps-tutorial-r6__panel"><h3>Guide Center / First10</h3><p>利用者・家族、福祉用具専門相談員、配送・設置、事務・請求、管理者の操作ガイドを役割別にまとめています。</p><div class="ps-tutorial-r6__actions" aria-label="First10入口"><a class="dpro-button dpro-button--primary" href="{guide}#start" target="_blank" rel="noopener" data-r6-link="guide">Guide Centerを開く</a><a class="dpro-button dpro-button--secondary" href="{guide}#start" target="_blank" rel="noopener" data-r6-link="first10-start">First10 開始</a><a class="dpro-button dpro-button--secondary" href="{guide}#start" target="_blank" rel="noopener" data-r6-link="first10-resume">First10 再開</a><a class="dpro-button dpro-button--secondary" href="{guide}#start" target="_blank" rel="noopener" data-r6-link="first10-replay">First10 最初から</a></div><p class="ps-tutorial-r6__hint"><strong>安全設計：</strong>Tutorialは相談送信・計画保存・契約確定・配送完了・請求締め・入金登録などの業務更新を自動実行しません。</p></div><div class="ps-tutorial-r6__manuals" aria-label="印刷マニュアル"><a class="ps-tutorial-r6__manual" href="{quick}" target="_blank" rel="noopener" data-r6-link="quick-pdf"><img src="{quick_png}" alt="福祉用具 Quick Start マニュアル表紙" loading="lazy"><span class="ps-tutorial-r6__manual-copy"><strong>10分 Quick Start</strong><span>A4縦PDF。まず全体の流れを確認したい方向け。</span></span></a><a class="ps-tutorial-r6__manual" href="{detail}" target="_blank" rel="noopener" data-r6-link="detail-pdf"><img src="{detail_png}" alt="福祉用具 詳細操作マニュアル表紙" loading="lazy"><span class="ps-tutorial-r6__manual-copy"><strong>詳細操作マニュアル</strong><span>A4縦PDF。役割別の操作・安全確認・FAQを保存版として掲載。</span></span></a></div></div></div></section>'''

          if marker not in html:
              if css_marker not in html:
                  if '</style>' not in html:
                      raise SystemExit('R6 patch FAIL: </style> not found')
                  html = html.replace('</style>', css + '\n</style>', 1)
              pos = html.find('id="connected"')
              if pos < 0:
                  raise SystemExit('R6 patch FAIL: connected section not found')
              start = html.rfind('<section', 0, pos)
              if start < 0:
                  raise SystemExit('R6 patch FAIL: connected section start not found')
              html = html[:start] + section + html[start:]

          assert html.count(marker) == 1, html.count(marker)
          assert html.count(css_marker) == 1, html.count(css_marker)
          for required in (guide, quick, detail, quick_png, detail_png):
              assert required in html, required
          page.write_text(html, encoding='utf-8')
          if mirror.exists():
              mirror.write_text(html, encoding='utf-8')
          PY

          grep -q 'data-welfare-equipment-tutorial-r6="1"' systems/welfare-equipment.html
          if test -f systems/welfare-equipment.html.txt; then cmp -s systems/welfare-equipment.html systems/welfare-equipment.html.txt; fi

      - name: Commit Product Site tutorial integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add systems/welfare-equipment.html
          if test -f systems/welfare-equipment.html.txt; then git add systems/welfare-equipment.html.txt; fi
          if git diff --cached --quiet; then
            echo 'Product Site Tutorial section already current.'
          else
            git commit -m 'Add WELFARE_EQUIPMENT Tutorial R6 guide and manuals [skip actions]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
          PRODUCT_CONTENT_HEAD=$(git rev-parse HEAD)
          echo "PRODUCT_CONTENT_HEAD=$PRODUCT_CONTENT_HEAD" >> "$GITHUB_ENV"

      - name: Wait until Product Site Pages contains R6 marker
        shell: bash
        run: |
          set -euo pipefail
          URL='https://dpromstk2000-lab.github.io/dpro-line-systems-site/systems/welfare-equipment.html'
          ok=0
          for i in $(seq 1 60); do
            body=$(curl -fsSL --retry 2 --connect-timeout 10 "${URL}?r=${GITHUB_RUN_ID}-${i}" || true)
            if printf '%s' "$body" | grep -q 'data-welfare-equipment-tutorial-r6="1"'; then ok=1; break; fi
            sleep 5
          done
          test "$ok" -eq 1
          echo 'Product Site Pages R6 marker: PASS'

      - name: Setup Node and Playwright
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run R6 browser LIVE QA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .r6tmp/screens
          cat > .r6tmp/r6-live-qa.mjs <<'JS'
          import { chromium, request } from 'playwright';
          import fs from 'fs';

          const PRODUCT='https://dpromstk2000-lab.github.io/dpro-line-systems-site/systems/welfare-equipment.html';
          const INDUSTRY='https://dpromstk2000-lab.github.io/dpro-welfare-equipment-line/';
          const GUIDE=INDUSTRY+'guide-center.html';
          const MEMBER=INDUSTRY+'member.html';
          const QUICK=INDUSTRY+'manuals/DPRO_TUTORIAL_WELFARE_EQUIPMENT_QUICK_START_V1.0.pdf';
          const DETAIL=INDUSTRY+'manuals/DPRO_TUTORIAL_WELFARE_EQUIPMENT_DETAILED_MANUAL_V1.0.pdf';
          const QUICK_PNG=INDUSTRY+'manuals/DPRO_TUTORIAL_WELFARE_EQUIPMENT_QUICK_START_V1.0.png';
          const DETAIL_PNG=INDUSTRY+'manuals/DPRO_TUTORIAL_WELFARE_EQUIPMENT_DETAILED_MANUAL_V1.0.png';

          const api=await request.newContext();
          const http={};
          for (const u of [INDUSTRY,GUIDE,MEMBER,QUICK,DETAIL,QUICK_PNG,DETAIL_PNG,PRODUCT]) {
            const r=await api.get(u,{timeout:60000});
            http[u]=r.status();
            if(r.status()>=400) throw new Error(`HTTP ${r.status()} ${u}`);
          }
          await api.dispose();

          const browser=await chromium.launch({headless:true});
          const productResults=[];
          const guideResults=[];
          const mutations=[];
          const viewports=[['1440',1440,900],['1024',1024,768],['390',390,844],['320',320,720]];

          for (const [name,width,height] of viewports) {
            const context=await browser.newContext({viewport:{width,height},deviceScaleFactor:1});
            const page=await context.newPage();
            const errors=[];
            page.on('console',m=>{if(m.type()==='error')errors.push(m.text())});
            page.on('pageerror',e=>errors.push(String(e)));
            page.on('request',r=>{const m=r.method().toUpperCase();if(!['GET','HEAD','OPTIONS'].includes(m))mutations.push({page:'product-'+name,method:m,url:r.url()})});
            const resp=await page.goto(PRODUCT+'?r='+Date.now(),{waitUntil:'domcontentloaded',timeout:60000});
            if(!resp||resp.status()>=400) throw new Error(`Product ${name} HTTP ${resp?.status()}`);
            const root=page.locator('[data-welfare-equipment-tutorial-r6="1"]');
            if(await root.count()!==1) throw new Error(`R6 marker missing ${name}`);
            await root.scrollIntoViewIfNeeded();
            await page.waitForTimeout(1200);
            const result=await root.evaluate(el=>{
              const links=[...el.querySelectorAll('a')].map(a=>({key:a.dataset.r6Link||'',href:a.href,text:(a.textContent||'').trim()}));
              const imgs=[...el.querySelectorAll('img')].map(i=>({src:i.src,complete:i.complete,naturalWidth:i.naturalWidth,alt:i.alt}));
              const d=document.documentElement;
              return {links,imgs,sectionScrollWidth:el.scrollWidth,sectionClientWidth:el.clientWidth,scrollWidth:d.scrollWidth,clientWidth:d.clientWidth};
            });
            const keys=new Set(result.links.map(x=>x.key));
            for(const k of ['guide','first10-start','first10-resume','first10-replay','quick-pdf','detail-pdf']) if(!keys.has(k)) throw new Error(`missing link ${k}`);
            const guideHrefs=result.links.filter(x=>['guide','first10-start','first10-resume','first10-replay'].includes(x.key)).map(x=>x.href);
            if(guideHrefs.some(x=>x!==GUIDE+'#start')) throw new Error(`Guide/First10 href mismatch ${JSON.stringify(guideHrefs)}`);
            if(result.links.find(x=>x.key==='quick-pdf')?.href!==QUICK) throw new Error('Quick PDF href mismatch');
            if(result.links.find(x=>x.key==='detail-pdf')?.href!==DETAIL) throw new Error('Detail PDF href mismatch');
            for(const im of result.imgs) if(!im.complete||im.naturalWidth<100||!im.alt) throw new Error(`preview image invalid ${JSON.stringify(im)}`);
            if((width===390||width===320)&&(result.scrollWidth>result.clientWidth+1||result.sectionScrollWidth>result.sectionClientWidth+1)) throw new Error(`horizontal overflow ${name}: ${JSON.stringify(result)}`);
            const focusLink=root.locator('a').first();
            await focusLink.focus();
            const focus=await focusLink.evaluate(el=>{const s=getComputedStyle(el);return {outlineStyle:s.outlineStyle,outlineWidth:s.outlineWidth}});
            if(focus.outlineStyle==='none'||focus.outlineWidth==='0px') throw new Error(`focus not visible ${name}`);
            if(errors.length) throw new Error(`Product console/page errors ${name}: ${JSON.stringify(errors)}`);
            await page.screenshot({path:`.r6tmp/screens/product-${name}.png`,fullPage:false});
            productResults.push({name,width,height,result,focus,errors});
            await context.close();
          }

          for (const [name,width,height] of viewports) {
            const context=await browser.newContext({viewport:{width,height},deviceScaleFactor:1});
            const page=await context.newPage();
            const errors=[]; const localMut=[];
            page.on('console',m=>{if(m.type()==='error')errors.push(m.text())});
            page.on('pageerror',e=>errors.push(String(e)));
            page.on('request',r=>{const m=r.method().toUpperCase();if(!['GET','HEAD','OPTIONS'].includes(m)){localMut.push({method:m,url:r.url()});mutations.push({page:'guide-'+name,method:m,url:r.url()})}});
            const resp=await page.goto(GUIDE+'?r='+Date.now(),{waitUntil:'domcontentloaded',timeout:60000});
            if(!resp||resp.status()>=400) throw new Error(`Guide ${name} HTTP ${resp?.status()}`);
            await page.waitForTimeout(800);
            for(const id of ['#guide-first10-primary','#guide-resume','#guide-replay']) if(await page.locator(id).count()!==1) throw new Error(`First10 control missing ${id}`);
            await page.locator('#guide-replay').click();
            await page.waitForTimeout(500);
            const dims=await page.evaluate(()=>({scrollWidth:document.documentElement.scrollWidth,clientWidth:document.documentElement.clientWidth}));
            if((width===390||width===320)&&dims.scrollWidth>dims.clientWidth+1) throw new Error(`Guide overflow ${name}`);
            if(errors.length) throw new Error(`Guide console/page errors ${name}: ${JSON.stringify(errors)}`);
            if(localMut.length) throw new Error(`Guide business mutation detected ${JSON.stringify(localMut)}`);
            guideResults.push({name,width,height,dims,errors,mutations:localMut});
            await context.close();
          }

          await browser.close();
          if(mutations.length) throw new Error(`BUSINESS_MUTATION ${JSON.stringify(mutations)}`);
          fs.writeFileSync('.r6tmp/r6-browser-qa.json',JSON.stringify({http,productResults,guideResults,businessMutation:0},null,2));
          console.log('R6 BROWSER LIVE QA PASS');
          console.log('VIEWPORTS PASS: 1440 / 1024 / 390 / 320');
          console.log('R3/R4 FIRST10 GUIDE REGRESSION PASS');
          console.log('BUSINESS MUTATION = 0');
          JS
          node .r6tmp/r6-live-qa.mjs

      - name: Re-download public manuals and verify PDF render QR and SHA256
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update >/dev/null
          sudo apt-get install -y poppler-utils zbar-tools >/dev/null
          mkdir -p .r6tmp/manuals
          BASE='https://dpromstk2000-lab.github.io/dpro-welfare-equipment-line/manuals'
          curl -fsSL --retry 5 "$BASE/DPRO_TUTORIAL_WELFARE_EQUIPMENT_QUICK_START_V1.0.pdf" -o .r6tmp/manuals/quick.pdf
          curl -fsSL --retry 5 "$BASE/DPRO_TUTORIAL_WELFARE_EQUIPMENT_DETAILED_MANUAL_V1.0.pdf" -o .r6tmp/manuals/detail.pdf
          curl -fsSL --retry 5 "$BASE/DPRO_TUTORIAL_WELFARE_EQUIPMENT_QUICK_START_V1.0.png" -o .r6tmp/manuals/quick.png
          curl -fsSL --retry 5 "$BASE/DPRO_TUTORIAL_WELFARE_EQUIPMENT_DETAILED_MANUAL_V1.0.png" -o .r6tmp/manuals/detail.png
          curl -fsSL --retry 5 'https://raw.githubusercontent.com/dpromstk2000-lab/dpro-welfare-equipment-line/main/manuals/R5_MANUAL_QA_EVIDENCE.txt' -o .r6tmp/manuals/source-evidence.txt
          pdftoppm -png -r 200 .r6tmp/manuals/quick.pdf .r6tmp/manuals/quick-page >/dev/null 2>&1
          pdftoppm -png -r 200 .r6tmp/manuals/detail.pdf .r6tmp/manuals/detail-page >/dev/null 2>&1

          python - <<'PY'
          from pathlib import Path
          import hashlib, json, subprocess, re
          root=Path('.r6tmp/manuals')
          guide='https://dpromstk2000-lab.github.io/dpro-welfare-equipment-line/guide-center.html'
          member='https://dpromstk2000-lab.github.io/dpro-welfare-equipment-line/member.html'

          def decoded(prefix):
              vals=set()
              for p in sorted(root.glob(prefix+'-*.png')):
                  r=subprocess.run(['zbarimg','--quiet','--raw',str(p)],text=True,capture_output=True)
                  if r.returncode==0:
                      vals.update(x.strip() for x in r.stdout.splitlines() if x.strip())
              return sorted(vals)

          q=decoded('quick-page')
          d=decoded('detail-page')
          assert q==sorted([guide,member]), q
          assert d==[guide], d

          def pdfinfo(name):
              out=subprocess.check_output(['pdfinfo',str(root/name)],text=True)
              pages=int(re.search(r'^Pages:\s+(\d+)',out,re.M).group(1))
              size=re.search(r'^Page size:\s+(.+)$',out,re.M).group(1)
              return pages,size
          qp,qs=pdfinfo('quick.pdf'); dp,ds=pdfinfo('detail.pdf')
          assert qp==2 and dp==9, (qp,dp)
          assert ('594' in qs or 'A4' in qs) and ('594' in ds or 'A4' in ds), (qs,ds)
          for p in root.glob('*-page-*.png'):
              assert p.stat().st_size>10000, p

          files={
            'DPRO_TUTORIAL_WELFARE_EQUIPMENT_QUICK_START_V1.0.pdf':'quick.pdf',
            'DPRO_TUTORIAL_WELFARE_EQUIPMENT_DETAILED_MANUAL_V1.0.pdf':'detail.pdf',
            'DPRO_TUTORIAL_WELFARE_EQUIPMENT_QUICK_START_V1.0.png':'quick.png',
            'DPRO_TUTORIAL_WELFARE_EQUIPMENT_DETAILED_MANUAL_V1.0.png':'detail.png',
          }
          local={fn:hashlib.sha256((root/localname).read_bytes()).hexdigest() for fn,localname in files.items()}
          source=(root/'source-evidence.txt').read_text(encoding='utf-8')
          for fn,h in local.items():
              assert f'{h}  {fn}' in source, (fn,h)
          Path('.r6tmp/r6-pdf-qr-qa.json').write_text(json.dumps({'qr':{'quick':q,'detail':d},'sha256':local,'pages':{'quick':qp,'detail':dp},'pageSize':{'quick':qs,'detail':ds}},ensure_ascii=False,indent=2),encoding='utf-8')
          print('R6 PUBLIC PDF RENDER PASS')
          print('R6 PUBLIC PDF QR EXACT-MATCH PASS',q,d)
          print('R6 MANUAL SHA256 LIVE MATCH PASS')
          PY

      - name: Re-fetch final heads and write R6 evidence
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git pull --rebase origin main
          INDUSTRY_HEAD_FINAL=$(git ls-remote https://github.com/dpromstk2000-lab/dpro-welfare-equipment-line.git refs/heads/main | awk '{print $1}')
          test "$INDUSTRY_HEAD_FINAL" = "$INDUSTRY_HEAD"
