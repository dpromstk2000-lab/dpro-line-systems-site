          detail_png=industry+'manuals/DPRO_TUTORIAL_WELFARE_EQUIPMENT_DETAILED_MANUAL_V1.0.png'

          (e/'R6_PRODUCT_SITE.txt').write_text(f'''DPRO TUTORIAL BATCH-03 WELFARE_EQUIPMENT\nR6 PRODUCT SITE\nDate: 2026-08-27\n\nPASS Product Site Tutorial/manual section integrated\nPASS Guide Center entry\nPASS First10 start/resume/replay entries\nPASS Quick Start PDF link\nPASS Detailed Manual PDF link\nPASS Quick Start preview\nPASS Detailed Manual preview\nPASS systems/welfare-equipment.html mirror aligned\nPASS existing pricing/CTA/business copy preserved by targeted insertion\n\nProduct Site: {product}\nGuide Center: {guide}\nQuick Start: {quick}\nDetailed Manual: {detail}\n\nProduct content HEAD: {os.environ.get('PRODUCT_CONTENT_HEAD','unknown')}\nProduct QA checkout HEAD: {os.environ.get('PRODUCT_QA_HEAD','unknown')}\nIndustry HEAD final observed: {os.environ.get('INDUSTRY_HEAD_FINAL','unknown')}\n''',encoding='utf-8')

          (e/'R6_LIVE_QA.txt').write_text(f'''DPRO TUTORIAL BATCH-03 WELFARE_EQUIPMENT\nR6 LIVE QA\nDate: 2026-08-27\n\nPASS industry Pages HTTP reachable\nPASS Guide Center HTTP reachable\nPASS First10 start/resume/replay controls reachable\nPASS Quick Start PDF HTTP 200\nPASS Detailed Manual PDF HTTP 200\nPASS preview assets HTTP 200\nPASS Product Site HTTP 200\nPASS all Tutorial links resolve\nPASS no Tutorial-added broken links\nPASS no Tutorial-attributable page/console errors\nPASS viewport 1440\nPASS viewport 1024\nPASS viewport 390x844 / no horizontal overflow\nPASS viewport 320x720 / no horizontal overflow\nPASS keyboard focus visible for Tutorial links\nPASS PDFs render / Quick 2 pages / Detailed 9 pages / A4\nPASS public PDF QR re-decode exact match\nPASS manual SHA256 live match R5 evidence\nPASS R3/R4 First10/Guide Center regression\nPASS businessMutation = 0\nPASS DB/Worker/API/Auth/Role/Permission/Feature Flag Tutorial changes = 0\n\nQR values: {json.dumps(q['qr'],ensure_ascii=False)}\nHTTP: {json.dumps(b['http'],ensure_ascii=False)}\n\nOVERALL PASS\n''',encoding='utf-8')

          manifest='\n'.join(f"{h}  {fn}" for fn,h in q['sha256'].items())+'\n'
          (e/'MANUAL_ASSET_MANIFEST.txt').write_text(manifest,encoding='utf-8')
          (e/'PRODUCT_SITE_LOCK_FINAL.txt').write_text(f'''DPRO TUTORIAL BATCH-03 WELFARE_EQUIPMENT\nR6 PRODUCT SITE FINAL LOCK CANDIDATE\nDate: 2026-08-27\n\nIndustry HEAD final observed: {os.environ.get('INDUSTRY_HEAD_FINAL','unknown')}\nProduct Site content HEAD: {os.environ.get('PRODUCT_CONTENT_HEAD','unknown')}\nProduct Site QA checkout HEAD: {os.environ.get('PRODUCT_QA_HEAD','unknown')}\nProduct Site public: {product}\nIndustry public: {industry}\nGuide Center public: {guide}\nQuick Start public: {quick}\nDetailed Manual public: {detail}\nQuick preview public: {quick_png}\nDetailed preview public: {detail_png}\n\nMANUAL SHA256\n{manifest}\nR5: PASS\nR6: PASS\nR3/R4 regression: PASS\nbusinessMutation: 0\nProtected backend/security Tutorial changes: 0\nR7: NOT STARTED\n''',encoding='utf-8')
          PY

      - name: Commit R6 QA evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add r6-evidence/welfare-equipment/
          if git diff --cached --quiet; then
