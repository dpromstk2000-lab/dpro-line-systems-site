name: Estate Tutorial R6 Final LIVE QA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/estate-r6-final-live-qa.yml"

permissions:
  contents: write

concurrency:
  group: estate-r6-final-live-qa
  cancel-in-progress: false

jobs:
  final-live-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PRODUCT_URL: https://dpromstk2000-lab.github.io/dpro-line-systems-site/systems/estate.html
      WORKFLOW_PATH: .github/workflows/estate-r6-final-live-qa.yml
      TARGET_HTML: systems/estate.html
      TARGET_TEXT: systems/estate.html.txt
      R6_INTEGRATION_HEAD: ff35a2ea2e14707018ce068174a6487efb5dc5a2
    steps:
      - name: Checkout newest Product Site main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify QA-only upload boundary and current R6 state
        id: base
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa-r6-final
          git fetch origin main
          local_head=$(git rev-parse HEAD)
          remote_head=$(git rev-parse origin/main)
          test "$local_head" = "$remote_head" || { echo "Product Site main advanced after QA workflow upload; HOLD."; exit 1; }
          upload_base=$(git rev-parse HEAD^)
          mapfile -t changed < <(git diff --name-only "$upload_base" HEAD)
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = "$WORKFLOW_PATH"
          git merge-base --is-ancestor "$R6_INTEGRATION_HEAD" "$upload_base"
          test -s "$TARGET_HTML"
          test -s "$TARGET_TEXT"
          cmp -s "$TARGET_HTML" "$TARGET_TEXT"
          grep -q 'DPRO TUTORIAL ESTATE R6' "$TARGET_HTML"
          grep -q 'data-r6-resource="tutorial"' "$TARGET_HTML"
          grep -q 'data-r6-resource="guide"' "$TARGET_HTML"
          grep -q 'data-r6-resource="quick"' "$TARGET_HTML"
          grep -q 'data-r6-resource="detail"' "$TARGET_HTML"
          sha256sum "$TARGET_HTML" "$TARGET_TEXT" > qa-r6-final/target-sha256-before.txt
          printf '%s\n' "$upload_base" > qa-r6-final/qa-upload-base.txt
          printf '%s\n' "$local_head" > qa-r6-final/qa-upload-head.txt
          echo "upload_head=$local_head" >> "$GITHUB_OUTPUT"
          echo "upload_base=$upload_base" >> "$GITHUB_OUTPUT"

          # Prove the original R6 integration commit touched only the two ESTATE mirrors
          # plus deletion of its temporary workflow. This is commit-local and therefore
          # unaffected by legitimate concurrent Product Site updates (e.g. GYM).
          integration_parent=$(git rev-parse "${R6_INTEGRATION_HEAD}^")
          mapfile -t integration_changed < <(git diff --name-only "$integration_parent" "$R6_INTEGRATION_HEAD" | sort)
          integration_expected=$(printf '%s\n' ".github/workflows/estate-r6-product-site.yml" "$TARGET_HTML" "$TARGET_TEXT" | sort)
          integration_actual=$(printf '%s\n' "${integration_changed[@]}" | sort)
          test "$integration_actual" = "$integration_expected"
          test "$(git diff --name-status "$integration_parent" "$R6_INTEGRATION_HEAD" -- .github/workflows/estate-r6-product-site.yml | awk '{print $1}')" = "D"
          test "$(git diff --name-status "$integration_parent" "$R6_INTEGRATION_HEAD" -- "$TARGET_HTML" | awk '{print $1}')" = "M"
          test "$(git diff --name-status "$integration_parent" "$R6_INTEGRATION_HEAD" -- "$TARGET_TEXT" | awk '{print $1}')" = "M"
          printf '%s\n' "$integration_parent" > qa-r6-final/r6-integration-parent.txt
          printf '%s\n' "${integration_changed[@]}" > qa-r6-final/r6-integration-changed.txt

          # No later commit is allowed to alter the ESTATE R6 payload before this QA.
          cmp <(git show "$R6_INTEGRATION_HEAD:$TARGET_HTML") "$TARGET_HTML"
          cmp <(git show "$R6_INTEGRATION_HEAD:$TARGET_TEXT") "$TARGET_TEXT"

      - name: Setup Node for final LIVE QA
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright for final LIVE QA
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run corrected R6 LIVE QA
        shell: bash
        run: |
          set -euo pipefail
          cat > estate-r6-final-live-qa.mjs <<'NODE'
          import { chromium } from 'playwright';
          import fs from 'node:fs';

          const productUrl = process.env.PRODUCT_URL;
          const expected = {
            tutorial:'https://dpromstk2000-lab.github.io/dpro-estate-line-liff/index.html?demo=1',
            guide:'https://dpromstk2000-lab.github.io/dpro-estate-line-liff/guide-center.html?demo=1',
            quick:'https://dpromstk2000-lab.github.io/dpro-estate-line-liff/DPRO_TUTORIAL_ESTATE_QUICK_START_V1.0.pdf',
            detail:'https://dpromstk2000-lab.github.io/dpro-estate-line-liff/DPRO_TUTORIAL_ESTATE_DETAILED_MANUAL_V1.0.pdf'
          };
          const viewports = [
            {name:'1440',width:1440,height:1000},
            {name:'1024',width:1024,height:768},
            {name:'390',width:390,height:844},
            {name:'320',width:320,height:720}
          ];
          const result = {
            schema:'DPRO_TUTORIAL_ESTATE_R6_FINAL_LIVE_QA_V1_3',
            productUrl, expected, viewports:[], resourceChecks:{},
            businessMutationAttempts:[], failures:[]
          };
          const browser = await chromium.launch({headless:true});

          for (const vp of viewports) {
            const context = await browser.newContext({viewport:{width:vp.width,height:vp.height}});
            const pageErrors=[]; const consoleErrors=[]; const unsafe=[];
            await context.route('**/*', async route => {
              const method = route.request().method();
              if (['POST','PUT','PATCH','DELETE'].includes(method)) {
                unsafe.push({method,url:route.request().url()});
                return route.abort('blockedbyclient');
              }
              return route.continue();
            });
            const page = await context.newPage();
            page.on('pageerror', e => pageErrors.push(String(e)));
            page.on('console', m => { if (m.type()==='error') consoleErrors.push(m.text()); });
            const resp = await page.goto(`${productUrl}?qa=${Date.now()}`, {waitUntil:'networkidle'});
            if (!resp || resp.status() !== 200) result.failures.push(`${vp.name}: product status ${resp?.status()}`);

            const data = await page.evaluate(() => ({
              width: window.innerWidth,
              clientWidth: document.documentElement.clientWidth,
              scrollWidth: document.documentElement.scrollWidth,
              marker: document.documentElement.innerHTML.includes('DPRO TUTORIAL ESTATE R6'),
              links: [...document.querySelectorAll('[data-r6-resource]')].map(a => ({key:a.getAttribute('data-r6-resource'),href:a.href})),
              pricing: document.body.textContent.includes('5,500円'),
              lineCta: [...document.querySelectorAll('a')].some(a => a.href === 'https://lin.ee/YxJGXV6D'),
              lp: [...document.querySelectorAll('a')].some(a => a.getAttribute('href') === '../lp-estate.html'),
              flyer: [...document.querySelectorAll('a')].some(a => a.getAttribute('href') === '../flyer-estate.html'),
              pdf: [...document.querySelectorAll('a')].some(a => a.getAttribute('href') === '../flyer-estate.pdf')
            }));
            const overflow = Math.max(0, data.scrollWidth - data.clientWidth);
            if (data.width !== vp.width) result.failures.push(`${vp.name}: width mismatch ${data.width}`);
            if ((vp.width===390 || vp.width===320) && overflow !== 0) result.failures.push(`${vp.name}: horizontal overflow ${overflow}`);
            if (!data.marker) result.failures.push(`${vp.name}: R6 marker missing`);
            if (data.links.length !== 4) result.failures.push(`${vp.name}: resource link count ${data.links.length}`);
            for (const [key,url] of Object.entries(expected)) {
              if (!data.links.some(x => x.key===key && x.href===url)) result.failures.push(`${vp.name}: ${key} href mismatch`);
            }
            for (const key of ['pricing','lineCta','lp','flyer','pdf']) {
              if (!data[key]) result.failures.push(`${vp.name}: preserved ${key} missing`);
            }

            // The previous QA assumed one Tab from the last FAQ reached Tutorial.
            // The Final CTA is between FAQ and Tutorial. Start from the actual last
            // focusable element immediately before the Tutorial section, then prove
            // all four R6 cards are keyboard reachable in DOM order with visible focus.
            const predecessor = page.locator('.ps-doclinks a').last();
            if (await predecessor.count() !== 1) {
              result.failures.push(`${vp.name}: tutorial keyboard predecessor missing`);
            } else {
              await predecessor.focus();
              const focusTrail=[];
              for (const key of ['tutorial','guide','quick','detail']) {
                await page.keyboard.press('Tab');
                const focus = await page.evaluate(() => {
                  const el = document.activeElement;
                  const cs = el ? getComputedStyle(el) : null;
                  return {
                    key: el?.getAttribute('data-r6-resource') ?? null,
                    visible: el?.matches(':focus-visible') ?? false,
                    outline: cs?.outlineStyle ?? null,
                    outlineWidth: cs?.outlineWidth ?? null
                  };
                });
                focusTrail.push(focus);
                if (focus.key !== key || !focus.visible || focus.outline === 'none' || focus.outlineWidth === '0px') {
                  result.failures.push(`${vp.name}: keyboard focus ${key} failed ${JSON.stringify(focus)}`);
                }
              }
              result.viewports.push({name:vp.name,width:vp.width,height:vp.height,overflow,pageErrors,consoleErrors,unsafe,resourceLinks:data.links,focusTrail});
            }

            if (pageErrors.length) result.failures.push(`${vp.name}: page errors ${JSON.stringify(pageErrors)}`);
            if (consoleErrors.length) result.failures.push(`${vp.name}: console errors ${JSON.stringify(consoleErrors)}`);
            if (unsafe.length) result.failures.push(`${vp.name}: unsafe writes ${JSON.stringify(unsafe)}`);
            result.businessMutationAttempts.push(...unsafe);
            await page.screenshot({path:`qa-r6-final/product-site-${vp.name}.png`,fullPage:true});
            await context.close();
          }

          const request = await browser.newContext();
          for (const [key,url] of Object.entries(expected)) {
            const r = await request.request.get(url,{maxRedirects:10});
            result.resourceChecks[key] = {url,status:r.status(),ok:r.ok()};
            if (!r.ok()) result.failures.push(`${key}: resource status ${r.status()}`);
          }
          await request.close();
          await browser.close();

          result.normalTextByteIdentical = fs.readFileSync(process.env.TARGET_HTML).equals(fs.readFileSync(process.env.TARGET_TEXT));
          if (!result.normalTextByteIdentical) result.failures.push('normal/TEXT not byte-identical');
          result.businessMutation = 0;
          result.productSiteRollback = 0;
          result.pass = result.failures.length===0 && result.businessMutationAttempts.length===0;
          fs.writeFileSync('qa-r6-final/r6-final-live-qa.json', JSON.stringify(result,null,2));
          console.log(JSON.stringify({pass:result.pass,failures:result.failures,businessMutationAttempts:result.businessMutationAttempts.length},null,2));
          if (!result.pass) process.exit(1);
          NODE
          node estate-r6-final-live-qa.mjs
          rm -f estate-r6-final-live-qa.mjs

      - name: Verify ESTATE payload unchanged and self-delete QA workflow
        if: success()
        shell: bash
        env:
          UPLOAD_HEAD: ${{ steps.base.outputs.upload_head }}
          UPLOAD_BASE: ${{ steps.base.outputs.upload_base }}
        run: |
          set -euo pipefail
          cmp -s "$TARGET_HTML" "$TARGET_TEXT"
          cmp <(git show "$R6_INTEGRATION_HEAD:$TARGET_HTML") "$TARGET_HTML"
          cmp <(git show "$R6_INTEGRATION_HEAD:$TARGET_TEXT") "$TARGET_TEXT"
          sha256sum "$TARGET_HTML" "$TARGET_TEXT" > qa-r6-final/target-sha256-after.txt
          diff -u qa-r6-final/target-sha256-before.txt qa-r6-final/target-sha256-after.txt

          git rm "$WORKFLOW_PATH"
          mapfile -t worktree_changed < <(git diff --name-only HEAD | sort)
          test "${#worktree_changed[@]}" -eq 1
          test "${worktree_changed[0]}" = "$WORKFLOW_PATH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Complete Estate R6 final LIVE QA [skip ci]"

          # The final QA run itself must change nothing except removing its temporary
          # workflow. Compare against the immediate pre-upload main, not an old global
          # baseline, so concurrent industry updates are preserved rather than flagged.
          mapfile -t cleanup_changed < <(git diff --name-only "$UPLOAD_BASE" HEAD | sort)
          printf '%s\n' "${cleanup_changed[@]}" > qa-r6-final/qa-cleanup-changed.txt
          test "${#cleanup_changed[@]}" -eq 1
          test "${cleanup_changed[0]}" = "$WORKFLOW_PATH"
          test "$(git diff --name-status "$UPLOAD_BASE" HEAD -- "$WORKFLOW_PATH" | awk '{print $1}')" = "D"

          git fetch origin main
          test "$(git rev-parse origin/main)" = "$UPLOAD_HEAD" || { echo "Product Site main advanced during final QA; refusing push."; exit 1; }
          git push origin HEAD:main
          git rev-parse HEAD > qa-r6-final/final-head.txt
          git rev-parse HEAD^{tree} > qa-r6-final/final-tree.txt
          printf '%s\n' "$R6_INTEGRATION_HEAD" > qa-r6-final/r6-integration-head.txt

      - name: Upload final R6 QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: estate-tutorial-r6-final-live-qa
          path: qa-r6-final
          if-no-files-found: warn
          retention-days: 30
