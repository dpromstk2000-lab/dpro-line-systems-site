name: HAIR Tutorial R6 Product Site

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/hair-r6-product-site.yml"

permissions:
  contents: write

concurrency:
  group: hair-tutorial-r6-product-site
  cancel-in-progress: false

jobs:
  r6-product-site:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TARGET_HTML: systems/hair-salon.html
      TARGET_TEXT: systems/hair-salon.html.txt
      WORKFLOW_PATH: .github/workflows/hair-r6-product-site.yml
      PRODUCT_URL: https://dpromstk2000-lab.github.io/dpro-line-systems-site/systems/hair-salon.html
      TUTORIAL_URL: https://dpromstk2000-lab.github.io/dpro-hair-salon-line/owner.html?tutorial=restart
      GUIDE_URL: https://dpromstk2000-lab.github.io/dpro-hair-salon-line/guide-center.html
      QUICK_URL: https://dpromstk2000-lab.github.io/dpro-hair-salon-line/DPRO_TUTORIAL_HAIR_QUICK_START_V1.0.pdf
      DETAIL_URL: https://dpromstk2000-lab.github.io/dpro-hair-salon-line/DPRO_TUTORIAL_HAIR_DETAILED_MANUAL_V1.0.pdf
      START_OBSERVED_PRODUCT_HEAD: 6bae91af90c9a250c50cdfee55c9ba870741085f
      R6_LIVE_MARKER: DPRO TUTORIAL HAIR R6 LINKSET V1.0-20260829

    steps:
      - name: Checkout newest Product Site main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Forward-only preflight immediately before write
        id: preflight
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa-r6
          git fetch origin main
          local_head="$(git rev-parse HEAD)"
          remote_head="$(git rev-parse origin/main)"
          test "$local_head" = "$remote_head" || { echo "Product Site main advanced after workflow upload. HOLD." >&2; exit 1; }

          upload_base="$(git rev-parse HEAD^)"
          upload_base_tree="$(git rev-parse "${upload_base}^{tree}")"
          mapfile -t upload_changed < <(git diff --name-only "$upload_base" HEAD)
          test "${#upload_changed[@]}" -eq 1
          test "${upload_changed[0]}" = "$WORKFLOW_PATH"

          git merge-base --is-ancestor "$START_OBSERVED_PRODUCT_HEAD" "$upload_base" || {
            echo "Observed Product Site head is not an ancestor of newest upload base. HOLD." >&2
            exit 1
          }

          test -s "$TARGET_HTML"
          test -s "$TARGET_TEXT"
          cmp -s "$TARGET_HTML" "$TARGET_TEXT"
          grep -q 'DPRO TUTORIAL HAIR R6 PRODUCT SITE START' "$TARGET_HTML"
          ! grep -q "$R6_LIVE_MARKER" "$TARGET_HTML"

          sha256sum "$TARGET_HTML" "$TARGET_TEXT" > qa-r6/target-sha256-before.txt
          printf '%s\n' "$upload_base" > qa-r6/product-site-head-before-r6.txt
          printf '%s\n' "$upload_base_tree" > qa-r6/product-site-tree-before-r6.txt

          echo "upload_base=$upload_base" >> "$GITHUB_OUTPUT"
          echo "upload_base_tree=$upload_base_tree" >> "$GITHUB_OUTPUT"

      - name: Normalize HAIR Tutorial resource links in target mirrors only
        shell: bash
        run: |
          set -euo pipefail

          cat > /tmp/hair-r6-patch.py <<'PY'
          from pathlib import Path
          import os, re

          target = Path(os.environ["TARGET_HTML"])
          text = target.read_text(encoding="utf-8")

          live_marker = os.environ["R6_LIVE_MARKER"]
          if live_marker in text:
              raise SystemExit("R6 live marker already exists")
          if "DPRO TUTORIAL HAIR R6 PRODUCT SITE START" not in text:
              raise SystemExit("existing HAIR tutorial section marker missing")

          # Make keyboard focus explicitly visible for the R6 resource links.
          css_anchor = '.ps-tutorial-link:hover{border-color:var(--dpro-green);background:var(--dpro-soft-green)}'
          css_focus = css_anchor + '\n.ps-tutorial-link:focus-visible{outline:3px solid #16845b;outline-offset:3px}'
          if css_anchor not in text:
              raise SystemExit("tutorial link CSS anchor missing")
          if ':focus-visible' not in text[text.find('/* DPRO TUTORIAL HAIR R6 PRODUCT SITE START */'):text.find('/* DPRO TUTORIAL HAIR R6 PRODUCT SITE END */')]:
              text = text.replace(css_anchor, css_focus, 1)

          # Add a unique post-R6 deployment marker immediately before the existing section.
          section_anchor = '<section aria-labelledby="tutorial-title" class="dpro-section ps-tutorial-section"'
          if text.count(section_anchor) != 1:
              raise SystemExit("tutorial section anchor mismatch")
          text = text.replace(section_anchor, f'<!-- {live_marker} -->\n' + section_anchor, 1)

          # STEP 01: add the actual Tutorial Start link.
          step1_old = (
            '<article class="ps-tutorial-card"><span class="ps-tutorial-step">STEP 01 / FIRST 10 MINUTES</span>'
            '<h3>まずは「最初の10分」</h3>'
            '<p>Owner PCの画面内チュートリアルで、今日の確認・予約・顧客・カルテ・再来店フォローまで、最初に覚える操作を順番に確認します。</p>'
            '<span class="ps-tutorial-note">初回操作を画面内で案内</span></article>'
          )
          step1_new = (
            '<article class="ps-tutorial-card"><span class="ps-tutorial-step">STEP 01 / FIRST 10 MINUTES</span>'
            '<h3>まずは「最初の10分」</h3>'
            '<p>Owner PCの画面内チュートリアルで、今日の確認・予約・顧客・カルテ・再来店フォローまで、最初に覚える操作を順番に確認します。</p>'
            '<div class="ps-tutorial-links">'
            f'<a class="ps-tutorial-link" data-r6-resource="tutorial" href="{os.environ["TUTORIAL_URL"]}" rel="noopener" target="_blank">Tutorial Start｜最初の10分を開始</a>'
            '</div></article>'
          )
          if step1_old not in text:
              raise SystemExit("STEP 01 source block mismatch")
          text = text.replace(step1_old, step1_new, 1)

          # STEP 02: keep the Guide Center but mark it as the canonical R6 resource.
          guide_old = (
            '<a class="ps-tutorial-link" href="https://dpromstk2000-lab.github.io/dpro-hair-salon-line/guide-center.html" '
            'rel="noopener" target="_blank">オンライン操作ガイドを開く</a>'
          )
          guide_new = (
            f'<a class="ps-tutorial-link" data-r6-resource="guide" href="{os.environ["GUIDE_URL"]}" '
            'rel="noopener" target="_blank">Guide Center｜オンライン操作ガイド</a>'
          )
          if guide_old not in text:
              raise SystemExit("Guide source link mismatch")
          text = text.replace(guide_old, guide_new, 1)

          # STEP 03: replace stale Product-Site asset paths with the actual R5-published PDFs.
          quick_old = (
            '<a class="ps-tutorial-link" href="../assets/pdfs/dpro-hair-tutorial-quick-start-v1.0.pdf" '
            'rel="noopener" target="_blank">Quick Start｜最初に使う10ページ</a>'
          )
          quick_new = (
            f'<a class="ps-tutorial-link" data-r6-resource="quick" href="{os.environ["QUICK_URL"]}" '
            'rel="noopener" target="_blank">Quick Start PDF｜1ページで確認</a>'
          )
          detail_old = (
            '<a class="ps-tutorial-link" href="../assets/pdfs/dpro-hair-tutorial-detailed-manual-v1.0.pdf" '
            'rel="noopener" target="_blank">Detailed Manual｜詳しい操作25ページ</a>'
          )
          detail_new = (
            f'<a class="ps-tutorial-link" data-r6-resource="detail" href="{os.environ["DETAIL_URL"]}" '
            'rel="noopener" target="_blank">Detailed Manual PDF｜詳しい操作を確認</a>'
          )
          if quick_old not in text:
              raise SystemExit("Quick Start source link mismatch")
          if detail_old not in text:
              raise SystemExit("Detailed Manual source link mismatch")
          text = text.replace(quick_old, quick_new, 1)
          text = text.replace(detail_old, detail_new, 1)

          target.write_text(text, encoding="utf-8")
          PY

          python /tmp/hair-r6-patch.py
          cp "$TARGET_HTML" "$TARGET_TEXT"

          cmp -s "$TARGET_HTML" "$TARGET_TEXT"
          grep -q "$R6_LIVE_MARKER" "$TARGET_HTML"
          test "$(grep -o 'data-r6-resource="' "$TARGET_HTML" | wc -l)" -eq 4
          grep -q 'data-r6-resource="tutorial"' "$TARGET_HTML"
          grep -q 'data-r6-resource="guide"' "$TARGET_HTML"
          grep -q 'data-r6-resource="quick"' "$TARGET_HTML"
          grep -q 'data-r6-resource="detail"' "$TARGET_HTML"

          grep -Fq "$TUTORIAL_URL" "$TARGET_HTML"
          grep -Fq "$GUIDE_URL" "$TARGET_HTML"
          grep -Fq "$QUICK_URL" "$TARGET_HTML"
          grep -Fq "$DETAIL_URL" "$TARGET_HTML"

          ! grep -q '../assets/pdfs/dpro-hair-tutorial-quick-start-v1.0.pdf' "$TARGET_HTML"
          ! grep -q '../assets/pdfs/dpro-hair-tutorial-detailed-manual-v1.0.pdf' "$TARGET_HTML"

          grep -q '5,500円' "$TARGET_HTML"
          grep -q 'https://lin.ee/YxJGXV6D' "$TARGET_HTML"
          grep -q 'https://dpromstk2000-lab.github.io/dpro-hair-salon-line/demo-guide.html' "$TARGET_HTML"
          grep -q '../lp-hair.html' "$TARGET_HTML"
          grep -q '../flyer-hair.html' "$TARGET_HTML"
          grep -q '../flyer-hair.pdf' "$TARGET_HTML"
          grep -q '../systems-data.js' "$TARGET_HTML"
          grep -q '../dpro-v3.js' "$TARGET_HTML"

      - name: Commit forward-only R6 integration and self-remove workflow
        id: integrate
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" || {
            echo "Product Site main advanced during R6 preparation. HOLD." >&2
            exit 1
          }

          git add "$TARGET_HTML" "$TARGET_TEXT"
          git rm "$WORKFLOW_PATH"

          mapfile -t changed < <(git diff --cached --name-only | sort)
          expected="$(printf '%s\n' "$WORKFLOW_PATH" "$TARGET_HTML" "$TARGET_TEXT" | sort)"
          actual="$(printf '%s\n' "${changed[@]}" | sort)"
          test "$actual" = "$expected"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Integrate HAIR Tutorial R6 Product Site [skip ci]"

          integration_head="$(git rev-parse HEAD)"
          integration_tree="$(git rev-parse HEAD^{tree})"

          git merge-base --is-ancestor "${{ steps.preflight.outputs.upload_base }}" "$integration_head"
          git push origin HEAD:main

          printf '%s\n' "$integration_head" > qa-r6/r6-integration-head.txt
          printf '%s\n' "$integration_tree" > qa-r6/r6-integration-tree.txt
          git diff-tree --no-commit-id --name-status -r "$integration_head" > qa-r6/r6-integration-commit-changed.txt
          git diff --name-status "${{ steps.preflight.outputs.upload_base }}" "$integration_head" > qa-r6/r6-net-changed-files.txt

          echo "integration_head=$integration_head" >> "$GITHUB_OUTPUT"
          echo "integration_tree=$integration_tree" >> "$GITHUB_OUTPUT"

      - name: Wait for Product Site Pages deployment
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 48); do
            if curl -fsSL "$PRODUCT_URL?qa=${{ steps.integrate.outputs.integration_head }}-$i" | grep -q "$R6_LIVE_MARKER"; then
              exit 0
            fi
            sleep 10
          done
          echo "HAIR R6 linkset marker did not appear on Product Site GitHub Pages." >&2
          exit 1

      - name: Setup Node for exact-width LIVE QA
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run R6 exact-width LIVE QA
        shell: bash
        env:
          R6_INTEGRATION_HEAD: ${{ steps.integrate.outputs.integration_head }}
          R6_INTEGRATION_TREE: ${{ steps.integrate.outputs.integration_tree }}
          R6_UPLOAD_BASE: ${{ steps.preflight.outputs.upload_base }}
          R6_UPLOAD_BASE_TREE: ${{ steps.preflight.outputs.upload_base_tree }}
        run: |
          set -euo pipefail

          git fetch origin main
          final_head="$(git rev-parse origin/main)"
          final_tree="$(git rev-parse "origin/main^{tree}")"
          git merge-base --is-ancestor "$R6_INTEGRATION_HEAD" "$final_head" || {
            echo "Integration commit is not an ancestor of current main. Rollback detected." >&2
            exit 1
          }

          git show "$R6_INTEGRATION_HEAD:$TARGET_HTML" > /tmp/r6-integration.html
          git show "origin/main:$TARGET_HTML" > /tmp/r6-current.html
          cmp -s /tmp/r6-integration.html /tmp/r6-current.html

          git show "origin/main:$TARGET_TEXT" > /tmp/r6-current.txt
          cmp -s /tmp/r6-current.html /tmp/r6-current.txt

          printf '%s\n' "$final_head" > qa-r6/product-site-final-head.txt
          printf '%s\n' "$final_tree" > qa-r6/product-site-final-tree.txt

          cat > /tmp/hair-r6-live-qa.mjs <<'NODE'
          import { chromium } from 'playwright';
          import fs from 'node:fs';

          const productUrl=process.env.PRODUCT_URL;
          const expected={
            tutorial:process.env.TUTORIAL_URL,
            guide:process.env.GUIDE_URL,
            quick:process.env.QUICK_URL,
            detail:process.env.DETAIL_URL
          };
          const marker=process.env.R6_LIVE_MARKER;
          const viewports=[
            {name:'1440',width:1440,height:1000},
            {name:'1024',width:1024,height:768},
            {name:'390',width:390,height:844},
            {name:'320',width:320,height:720}
          ];

          const result={
            schema:'DPRO_TUTORIAL_HAIR_R6_PRODUCT_SITE_LIVE_QA_V1.0',
            productUrl,expected,marker,
            integrationHead:process.env.R6_INTEGRATION_HEAD,
            integrationTree:process.env.R6_INTEGRATION_TREE,
            uploadBase:process.env.R6_UPLOAD_BASE,
            uploadBaseTree:process.env.R6_UPLOAD_BASE_TREE,
            viewports:[],resourceChecks:{},
            businessMutationAttempts:[],failures:[],
            productSiteRollback:0,businessMutation:0
          };

          const browser=await chromium.launch({headless:true});

          const requestContext=await browser.newContext();
          const requestPage=await requestContext.newPage();
          for(const [key,url] of Object.entries(expected)){
            try{
              const resp=await requestPage.request.get(url,{timeout:30000});
              const ct=String(resp.headers()['content-type']||'');
              const ok=resp.status()===200 && (!['quick','detail'].includes(key) || ct.toLowerCase().includes('pdf'));
              result.resourceChecks[key]={url,status:resp.status(),contentType:ct,ok};
              if(!ok) result.failures.push(`resource ${key}: status=${resp.status()} content-type=${ct}`);
            }catch(e){
              result.resourceChecks[key]={url,error:String(e),ok:false};
              result.failures.push(`resource ${key}: ${String(e)}`);
            }
          }
          await requestContext.close();

          for(const vp of viewports){
            const context=await browser.newContext({viewport:{width:vp.width,height:vp.height}});
            const unsafe=[],pageErrors=[],consoleErrors=[];
            await context.route('**/*',async route=>{
              const method=route.request().method();
              if(['POST','PUT','PATCH','DELETE'].includes(method)){
                const rec={viewport:vp.name,method,url:route.request().url()};
                unsafe.push(rec);result.businessMutationAttempts.push(rec);
                return route.abort('blockedbyclient');
              }
              return route.continue();
            });

            const page=await context.newPage();
            page.on('pageerror',e=>pageErrors.push(String(e)));
            page.on('console',m=>{if(m.type()==='error')consoleErrors.push({text:m.text(),location:m.location()});});

            const resp=await page.goto(`${productUrl}?qa=${Date.now()}-${vp.name}`,{waitUntil:'networkidle',timeout:45000});
            if(!resp || resp.status()!==200) result.failures.push(`${vp.name}: product status ${resp?.status()}`);

            const data=await page.evaluate((marker)=>({
              innerWidth:window.innerWidth,
              documentScrollWidth:document.documentElement.scrollWidth,
              bodyScrollWidth:document.body.scrollWidth,
              marker:document.documentElement.innerHTML.includes(marker),
              links:[...document.querySelectorAll('[data-r6-resource]')].map(a=>({key:a.getAttribute('data-r6-resource'),href:a.href,text:(a.textContent||'').trim()})),
              pricing:(document.body.textContent||'').includes('5,500円'),
              lineCta:[...document.querySelectorAll('a')].some(a=>a.href==='https://lin.ee/YxJGXV6D'),
              demo:[...document.querySelectorAll('a')].some(a=>a.href==='https://dpromstk2000-lab.github.io/dpro-hair-salon-line/demo-guide.html'),
              lp:[...document.querySelectorAll('a')].some(a=>a.getAttribute('href')==='../lp-hair.html'),
              flyerHtml:[...document.querySelectorAll('a')].some(a=>a.getAttribute('href')==='../flyer-hair.html'),
              flyerPdf:[...document.querySelectorAll('a')].some(a=>a.getAttribute('href')==='../flyer-hair.pdf'),
              systemsData:[...document.scripts].some(s=>s.getAttribute('src')==='../systems-data.js'),
              sharedJs:[...document.scripts].some(s=>s.getAttribute('src')==='../dpro-v3.js')
            }),marker);

            if(!data.marker) result.failures.push(`${vp.name}: R6 marker missing`);
            const map=Object.fromEntries(data.links.map(x=>[x.key,x.href]));
            for(const [key,url] of Object.entries(expected)){
              if(map[key]!==url) result.failures.push(`${vp.name}: ${key} link mismatch: ${map[key]}`);
            }
            if(data.links.length!==4) result.failures.push(`${vp.name}: resource link count ${data.links.length}`);

            if(!data.pricing) result.failures.push(`${vp.name}: pricing regression`);
            if(!data.lineCta) result.failures.push(`${vp.name}: LINE CTA regression`);
            if(!data.demo) result.failures.push(`${vp.name}: DEMO regression`);
            if(!data.lp) result.failures.push(`${vp.name}: LP regression`);
            if(!data.flyerHtml) result.failures.push(`${vp.name}: flyer HTML regression`);
            if(!data.flyerPdf) result.failures.push(`${vp.name}: flyer PDF regression`);
            if(!data.systemsData || !data.sharedJs) result.failures.push(`${vp.name}: shared asset regression`);

            const overflow={
              innerWidth:data.innerWidth,
              documentScrollWidth:data.documentScrollWidth,
              bodyScrollWidth:data.bodyScrollWidth,
              documentOverflow:Math.max(0,data.documentScrollWidth-data.innerWidth),
              bodyOverflow:Math.max(0,data.bodyScrollWidth-data.innerWidth)
            };
            if(vp.width<=390 && (overflow.documentOverflow!==0 || overflow.bodyOverflow!==0)){
              result.failures.push(`${vp.name}: mobile overflow`);
            }

            await page.locator('body').focus();
            let focusVisible=false,focusRecord=null;
            for(let i=0;i<120;i++){
              await page.keyboard.press('Tab');
              const fr=await page.evaluate(()=>{
                const a=document.activeElement;
                if(!a || !a.matches?.('[data-r6-resource]')) return null;
                const r=a.getBoundingClientRect();
                const style=getComputedStyle(a);
                return {
                  key:a.getAttribute('data-r6-resource'),
                  left:r.left,top:r.top,right:r.right,bottom:r.bottom,width:r.width,height:r.height,
                  innerWidth:window.innerWidth,innerHeight:window.innerHeight,
                  focusVisible:a.matches(':focus-visible'),
                  outlineStyle:style.outlineStyle,
                  outlineWidth:style.outlineWidth
                };
              });
              if(fr){
                focusRecord=fr;
                focusVisible=fr.width>0&&fr.height>0&&fr.left>=-1&&fr.right<=fr.innerWidth+1&&fr.top>=-1&&fr.bottom<=fr.innerHeight+1&&fr.focusVisible&&fr.outlineStyle!=='none';
                break;
              }
            }
            if(!focusVisible) result.failures.push(`${vp.name}: keyboard focus not visibly outlined`);

            const tutorialConsole=consoleErrors.filter(e=>String(e.location?.url||'').includes('/systems/hair-salon.html'));
            if(pageErrors.length) result.failures.push(`${vp.name}: pageerror ${pageErrors.join(' | ')}`);
            if(tutorialConsole.length) result.failures.push(`${vp.name}: Tutorial integration console error`);
            if(unsafe.length) result.failures.push(`${vp.name}: unsafe write attempts ${unsafe.length}`);

            result.viewports.push({viewport:vp,data,overflow,focusVisible,focusRecord,pageErrors,consoleErrors,tutorialConsole,unsafe});
            await context.close();
          }

          await browser.close();

          if(result.businessMutationAttempts.length) result.businessMutation='BLOCKED_UNSAFE_ATTEMPT_PRESENT';
          result.forwardOnly=true;
          result.pass=result.failures.length===0&&result.businessMutationAttempts.length===0&&result.businessMutation===0&&result.productSiteRollback===0;

          fs.writeFileSync('qa-r6/hair-r6-live-qa.json',JSON.stringify(result,null,2));
          console.log(JSON.stringify({pass:result.pass,failures:result.failures,resources:result.resourceChecks,businessMutation:result.businessMutation,productSiteRollback:result.productSiteRollback},null,2));
          if(!result.pass) process.exit(1);
          NODE

          node /tmp/hair-r6-live-qa.mjs

      - name: Record final changed-file manifest
        shell: bash
        env:
          R6_INTEGRATION_HEAD: ${{ steps.integrate.outputs.integration_head }}
          R6_UPLOAD_BASE: ${{ steps.preflight.outputs.upload_base }}
        run: |
          set -euo pipefail

          git diff --name-status "$R6_UPLOAD_BASE" "$R6_INTEGRATION_HEAD" > qa-r6/r6-net-changed-files-final.txt
          grep -q $'M\tsystems/hair-salon.html' qa-r6/r6-net-changed-files-final.txt
          grep -q $'M\tsystems/hair-salon.html.txt' qa-r6/r6-net-changed-files-final.txt
          test "$(wc -l < qa-r6/r6-net-changed-files-final.txt)" -eq 2

          git show "origin/main:$TARGET_HTML" > /tmp/r6-final-html
          git show "origin/main:$TARGET_TEXT" > /tmp/r6-final-text
          cmp -s /tmp/r6-final-html /tmp/r6-final-text
          sha256sum /tmp/r6-final-html /tmp/r6-final-text > qa-r6/target-sha256-after.txt

      - name: Upload R6 QA evidence
        uses: actions/upload-artifact@v4
        with:
          name: hair-r6-product-site-evidence
          path: qa-r6
          if-no-files-found: error
