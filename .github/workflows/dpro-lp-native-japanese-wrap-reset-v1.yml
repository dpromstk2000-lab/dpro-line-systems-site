name: DPRO LP Native Japanese Wrap Reset V1.0

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/dpro-lp-native-japanese-wrap-reset-v1.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dpro-lp-native-japanese-wrap-reset-v1
  cancel-in-progress: false

jobs:
  repair:
    name: Reset common wrap layer and verify all 50 LPs
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout current Product Site
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Guard protected Product state
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object systems-data.js)" = "e676cb5a559c3f89bdd9e86f3074756df8479dfa" || {
            echo "BLOCKER: systems-data.js changed after MEDICAL flyer integration"
            exit 1
          }
          test "$(git hash-object lp-hair.html)" = "baf040122e6c1086b2af77e4eb8eaf0f5bf8f352" || {
            echo "BLOCKER: HAIR V1.3 baseline changed"
            exit 1
          }
          test -f flyer-medical.html
          test -f flyer-medical.pdf
          grep -Fq 'flyerHtml: "flyer-medical.html"' systems-data.js
          grep -Fq 'DPRO LIVE DEMO ALL49 CENTRAL OVERRIDES START' systems-data.js
          grep -Fq 'DPRO LIVE DEMO ALL49 CENTRAL OVERRIDES END' systems-data.js
          grep -Fq 'DPRO LP HAIR WRAP FIX V1.3 CENTRAL' lp-hair.html
          echo "PASS: MEDICAL, HAIR V1.3 and ALL49 protected state present"

      - name: Install browser QA
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 --silent
          npx playwright install --with-deps chromium
          node -e "console.log('PLAYWRIGHT=' + require.resolve('playwright'))"

      - name: Create valid audit runner
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64
          Path('dpro-lp-native-wrap-audit.js').write_bytes(base64.b64decode(''))
          PY
          node --check dpro-lp-native-wrap-audit.js

      - name: Start local Product Site
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/dpro-lp-http.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8765/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/dpro-lp-http.log || true
          exit 1

      - name: Baseline render audit
        shell: bash
        run: |
          set -euo pipefail
          node dpro-lp-native-wrap-audit.js before /tmp/LP_WRAP_BEFORE.json

      - name: Disable generic mutation layer on LP pages only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re,json,subprocess

          pages=sorted(Path('.').glob('lp-*.html'))
          if len(pages)!=50:
              raise SystemExit(f'BLOCKER: expected 50 LPs, found {len(pages)}')

          css_re=re.compile(
              r'<link\b[^>]*href=["\']japanese-wrap-v1\.css\?v=[^"\']+["\'][^>]*>\s*',
              flags=re.I
          )
          js_re=re.compile(
              r'<script\b[^>]*src=["\']japanese-wrap-v1\.js\?v=[^"\']+["\'][^>]*>\s*</script>\s*',
              flags=re.I
          )
          marker='<!-- DPRO LP NATIVE JAPANESE WRAP V1.0: generic runtime wrap disabled; page-native CSS controls wrapping. -->'

          changed=[]
          active_before={}
          for p in pages:
              before=p.read_text(encoding='utf-8')
              css_hits=len(css_re.findall(before))
              js_hits=len(js_re.findall(before))
              if css_hits!=js_hits:
                  raise SystemExit(f'BLOCKER: {p.name} mismatched wrap CSS/JS refs {css_hits}/{js_hits}')
              active_before[p.name]=css_hits
              if not css_hits:
                  continue
              if css_hits!=1:
                  raise SystemExit(f'BLOCKER: {p.name} expected one active pair, got {css_hits}')
              after=css_re.sub(marker+'\n',before,count=1)
              after=js_re.sub('',after,count=1)
              if after==before:
                  raise SystemExit(f'BLOCKER: {p.name} did not change')
              p.write_text(after,encoding='utf-8',newline='\n')
              changed.append(p.name)

          # Widespread common-layer deployment is the premise for this reset.
          if len(changed)<35:
              raise SystemExit(f'BLOCKER: only {len(changed)} LPs had active generic wrap; expected widespread deployment')

          # HAIR V1.3 already disabled the generic layer and must remain byte-identical.
          hair=subprocess.check_output(['git','hash-object','lp-hair.html'],text=True).strip()
          if hair!='baf040122e6c1086b2af77e4eb8eaf0f5bf8f352':
              raise SystemExit('BLOCKER: HAIR V1.3 changed during common reset')

          Path('/tmp/lp-native-wrap-reset.json').write_text(
              json.dumps({
                  'version':'V1.0',
                  'lp_pages':len(pages),
                  'changed_count':len(changed),
                  'changed':changed,
                  'already_native':[p.name for p in pages if not active_before[p.name]]
              },ensure_ascii=False,indent=2),
              encoding='utf-8'
          )
          print(Path('/tmp/lp-native-wrap-reset.json').read_text(encoding='utf-8'))
          PY

      - name: Verify scope before post-fix audit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object systems-data.js)" = "e676cb5a559c3f89bdd9e86f3074756df8479dfa"
          test "$(git hash-object lp-hair.html)" = "baf040122e6c1086b2af77e4eb8eaf0f5bf8f352"
          test "$(git hash-object japanese-wrap-v1.css)" = "e7bb782631735d8297a9c7144587e78cccca860f"
          test "$(git hash-object japanese-wrap-v1.js)" = "3003d4145ed05970ec609181fc42f98fe511dd32"
          python3 - <<'PY'
          from pathlib import Path
          import re,subprocess
          changed=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          illegal={p for p in changed if not re.fullmatch(r'lp-[a-z0-9-]+\.html',p)}
          if illegal:
              raise SystemExit(f'BLOCKER: non-LP files changed before audit: {sorted(illegal)}')
          print('PASS: only LP HTML files changed',len(changed))
          PY

      - name: Post-reset render audit
        shell: bash
        run: |
          set -euo pipefail
          node dpro-lp-native-wrap-audit.js after /tmp/LP_WRAP_AFTER.json

      - name: Compare before and after
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json

          before=json.loads(Path('/tmp/LP_WRAP_BEFORE.json').read_text(encoding='utf-8'))
          after=json.loads(Path('/tmp/LP_WRAP_AFTER.json').read_text(encoding='utf-8'))
          reset=json.loads(Path('/tmp/lp-native-wrap-reset.json').read_text(encoding='utf-8'))
          b=before['summary']; a=after['summary']

          if b['pages']!=50 or a['pages']!=50 or b['checks']!=150 or a['checks']!=150:
              raise SystemExit('BLOCKER: incomplete 50 LP × 3 viewport audit matrix')
          if b['auditErrors'] or a['auditErrors'] or b['loadErrors'] or a['loadErrors']:
              raise SystemExit('BLOCKER: invalid browser audit')
          if a['highChecks']>b['highChecks']:
              raise SystemExit(f"BLOCKER: HIGH checks worsened {b['highChecks']} -> {a['highChecks']}")
          if a['overflowChecks']>b['overflowChecks']:
              raise SystemExit(f"BLOCKER: overflow worsened {b['overflowChecks']} -> {a['overflowChecks']}")

          summary={
              'version':'DPRO LP NATIVE JAPANESE WRAP RESET V1.0',
              'changed_lp_count':reset['changed_count'],
              'before':b,
              'after':a,
              'residual_high_pages':after['highPages']
          }
          Path('qa/LP_NATIVE_WRAP_RESET_V1.0_BEFORE.json').write_text(
              json.dumps(before,ensure_ascii=False,indent=2),encoding='utf-8'
          )
          Path('qa/LP_NATIVE_WRAP_RESET_V1.0_AFTER.json').write_text(
              json.dumps(after,ensure_ascii=False,indent=2),encoding='utf-8'
          )

          lines=[
              '# DPRO LP NATIVE JAPANESE WRAP RESET V1.0',
              '',
              f"- Changed LPs: {reset['changed_count']} / 50",
              f"- Before HIGH pages: {b['highPages']}",
              f"- After HIGH pages: {a['highPages']}",
              f"- Before HIGH checks: {b['highChecks']} / 150",
              f"- After HIGH checks: {a['highChecks']} / 150",
              f"- Before overflow checks: {b['overflowChecks']}",
              f"- After overflow checks: {a['overflowChecks']}",
              f"- Audit errors: {a['auditErrors']}",
              f"- Load errors: {a['loadErrors']}",
              '',
              '## Residual HIGH pages',
              ''
          ]
          if after['highPages']:
              lines += [f'- {x}' for x in after['highPages']]
          else:
              lines += ['- NONE']
          lines += [
              '',
              '## Policy',
              '',
              '- Root LP pages no longer use the generic Japanese DOM mutation layer.',
              '- Each LP uses its own native HTML/CSS wrapping.',
              '- Shared japanese-wrap-v1.css/js files remain unchanged for non-LP Product pages.',
              '- HAIR V1.3 remains byte-identical.',
              '- systems-data.js / ALL49 LIVE DEMO routing remains unchanged.'
          ]
          Path('qa/LP_NATIVE_WRAP_RESET_V1.0_SUMMARY.md').write_text(
              '\n'.join(lines)+'\n',encoding='utf-8'
          )
          print('\n'.join(lines))
          PY

      - name: Final protected-state QA
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test "$(git hash-object systems-data.js)" = "e676cb5a559c3f89bdd9e86f3074756df8479dfa"
          test "$(git hash-object lp-hair.html)" = "baf040122e6c1086b2af77e4eb8eaf0f5bf8f352"
          grep -Fq 'flyerHtml: "flyer-medical.html"' systems-data.js
          grep -Fq 'DPRO LIVE DEMO ALL49 CENTRAL OVERRIDES START' systems-data.js
          grep -Fq 'DPRO LIVE DEMO ALL49 CENTRAL OVERRIDES END' systems-data.js
          echo "PASS: protected Product state unchanged"

      - name: Commit common-layer reset and QA report
        shell: bash
        run: |
          set -euo pipefail
          rm -f dpro-lp-native-wrap-audit.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lp-*.html qa/LP_NATIVE_WRAP_RESET_V1.0_BEFORE.json qa/LP_NATIVE_WRAP_RESET_V1.0_AFTER.json qa/LP_NATIVE_WRAP_RESET_V1.0_SUMMARY.md
          git rm --ignore-unmatch ".github/workflows/dpro-lp-native-japanese-wrap-reset-v1.yml"
          git commit -m "Reset LP Japanese wrapping to native layout V1.0"
          git push origin HEAD:main
