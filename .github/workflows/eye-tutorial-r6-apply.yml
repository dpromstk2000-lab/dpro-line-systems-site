name: Apply EYE Tutorial R6

on:
  push:
    paths:
      - ".github/workflows/eye-tutorial-r6-apply.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: eye-tutorial-r6-apply
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply EYE tutorial Product Site support
        shell: python
        run: |
          from pathlib import Path
          import base64, hashlib, sys

          html_path = Path("systems/eye-salon.html")
          txt_path = Path("systems/eye-salon.html.txt")
          pdf_dir = Path("assets/pdfs")
          pdf_dir.mkdir(parents=True, exist_ok=True)

          if not html_path.exists():
              raise SystemExit("STOP: systems/eye-salon.html not found")

          html = html_path.read_text(encoding="utf-8")

          required = [
              "EYE SALON / LASH &amp; BROW",
              "LIVE DEMO",
              "LINE相談",
              "5,500円",
              "3,300円",
              "1,100円",
              "../lp-eye.html",
              "../flyer-eye.html",
              "../flyer-eye.pdf",
          ]
          for marker in required:
              if marker not in html:
                  raise SystemExit("STOP: existing sales marker missing: " + marker)

          forbidden_medical = ["眼科", "医療予約", "患者管理", "診療予約"]
          for marker in forbidden_medical:
              if marker in html:
                  raise SystemExit("STOP: medical positioning detected: " + marker)

          section = '<section class="dpro-section master-section" data-master-section="tutorial" id="tutorial-support" aria-labelledby="tutorial-support-title" style="background:linear-gradient(135deg,#f7fbf9,#eef8f3);border-top:1px solid #d9e7e0;border-bottom:1px solid #d9e7e0"><div class="dpro-container"><div class="ps-section-heading"><p class="ps-kicker">AFTER CONTRACT SUPPORT</p><h2 id="tutorial-support-title">契約後すぐ、迷わず始められる。</h2><p>最初の10分ガイド、いつでも検索できるGuide Center、印刷できる2種類のPDFマニュアルを用意しています。PC・スマートフォンで確認でき、印刷して店舗にも置けます。</p></div><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:1rem"><article class="dpro-card ps-card-copy"><span class="ps-number">01</span><h3>最初の10分</h3><p>契約後にまず覚える操作を、実画面上のガイドで順番に確認できます。</p><p style="margin-top:.8rem"><a class="dpro-button dpro-button--secondary" href="https://dpromstk2000-lab.github.io/dpro-eye-salon-line/owner.html?dpro_tutorial=1&amp;dpro_role=SALON_ADMIN_OPERATOR" target="_blank" rel="noopener">最初の10分を見る</a></p></article><article class="dpro-card ps-card-copy"><span class="ps-number">02</span><h3>Guide Center</h3><p>予約、店舗iPad、カルテ、再来店、店舗設定などを必要な時に検索できます。</p><p style="margin-top:.8rem"><a class="dpro-button dpro-button--secondary" href="https://dpromstk2000-lab.github.io/dpro-eye-salon-line/dpro-guide-center.html?dpro_role=SALON_ADMIN_OPERATOR" target="_blank" rel="noopener">Guide Centerを開く</a></p></article><article class="dpro-card ps-card-copy"><span class="ps-number">03</span><h3>Quick Start PDF</h3><p>最初の10分と毎日の基本操作をA4で確認。印刷してすぐ店舗に置けます。</p><p style="margin-top:.8rem"><a class="dpro-button dpro-button--secondary" href="../assets/pdfs/dpro-eye-tutorial-quick-start-v1.0.pdf" target="_blank" rel="noopener">Quick Start PDF</a></p></article><article class="dpro-card ps-card-copy"><span class="ps-number">04</span><h3>Detailed Manual PDF</h3><p>全8カテゴリ、32記事、15FAQをまとめた詳細版。PCでも印刷でも確認できます。</p><p style="margin-top:.8rem"><a class="dpro-button dpro-button--secondary" href="../assets/pdfs/dpro-eye-tutorial-detailed-manual-v1.0.pdf" target="_blank" rel="noopener">詳細マニュアルPDF</a></p></article></div><p class="ps-connected-note" style="margin-top:1.2rem"><strong>説明を受け直さなくても、店舗で確認できます。</strong> 実画面ガイド・検索ガイド・印刷マニュアルを使い分けて、必要な時に必要な操作を確認できます。</p></div></section>'
          if 'id="tutorial-support"' not in html:
              if "</main>" not in html:
                  raise SystemExit("STOP: closing </main> not found")
              html = html.replace("</main>", section + "</main>", 1)

          for marker in required:
              if marker not in html:
                  raise SystemExit("STOP: sales marker lost after patch: " + marker)

          tutorial_required = [
              'id="tutorial-support"',
              "最初の10分を見る",
              "Guide Centerを開く",
              "dpro-eye-tutorial-quick-start-v1.0.pdf",
              "dpro-eye-tutorial-detailed-manual-v1.0.pdf",
          ]
          for marker in tutorial_required:
              if marker not in html:
                  raise SystemExit("STOP: tutorial marker missing: " + marker)

          html_path.write_text(html, encoding="utf-8", newline="\n")
          txt_path.write_text(html, encoding="utf-8", newline="\n")

          q = base64.b64decode('')
          d = base64.b64decode('')
          qpath = pdf_dir / "dpro-eye-tutorial-quick-start-v1.0.pdf"
          dpath = pdf_dir / "dpro-eye-tutorial-detailed-manual-v1.0.pdf"
          qpath.write_bytes(q)
          dpath.write_bytes(d)

          assert hashlib.sha256(q).hexdigest() == "65282f2a3588b8668befe8dee60adb73676b5806493da9350964e26ab76cfe9c"
          assert hashlib.sha256(d).hexdigest() == "8774c101c3b105e1aed8a28cdc6800d50cede5772a90d206e1b4e4c6d9a9685f"
          assert html_path.read_bytes() == txt_path.read_bytes()

          print("PASS: EYE R6 files generated")
          print("Quick SHA256: 65282f2a3588b8668befe8dee60adb73676b5806493da9350964e26ab76cfe9c")
          print("Detailed SHA256: 8774c101c3b105e1aed8a28cdc6800d50cede5772a90d206e1b4e4c6d9a9685f")

      - name: Commit R6 files
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             systems/eye-salon.html             systems/eye-salon.html.txt             assets/pdfs/dpro-eye-tutorial-quick-start-v1.0.pdf             assets/pdfs/dpro-eye-tutorial-detailed-manual-v1.0.pdf
          if git diff --cached --quiet; then
            echo "No changes needed."
            exit 0
          fi
          git commit -m "Add EYE tutorial support to product site [run ${{ github.run_id }}]"
          git push origin HEAD:main
