name: STEP DPRO TUTORIAL REPAIR R6 FINAL V1.1

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/step-dpro-tutorial-repair-r6-final-v1.1.yml'
      - '.github/workflows/step-dpro-tutorial-repair-r6-final-v1.0.payload.zip'

permissions:
  contents: write

env:
  PRODUCT_URL: https://dpromstk2000-lab.github.io/dpro-line-systems-site/systems/repair.html
  GUIDE_URL: https://dpromstk2000-lab.github.io/dpro-repair-line-liff/demo-guide.html
  OWNER_URL: https://dpromstk2000-lab.github.io/dpro-repair-line-liff/owner.html
  FIRST10_URL: https://dpromstk2000-lab.github.io/dpro-repair-line-liff/demo-guide.html?tutorial=replay
  QUICK_URL: https://dpromstk2000-lab.github.io/dpro-line-systems-site/assets/pdfs/dpro-repair-tutorial-quick-start-v1.0.pdf
  DETAIL_URL: https://dpromstk2000-lab.github.io/dpro-line-systems-site/assets/pdfs/dpro-repair-tutorial-detailed-manual-v1.0.pdf

concurrency:
  group: dpro-tutorial-repair-r6-final
  cancel-in-progress: true

jobs:
  deploy-and-live-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard REPAIR source and Product target
        shell: python
        run: |
          from pathlib import Path
          import hashlib, json, subprocess, urllib.request
          E=Path('evidence'); E.mkdir(exist_ok=True)
          EXPECTED_REPAIR_COMMIT='7e22301a0135abc2a1e7eda37db8ccbed645dd10'
          EXPECTED_REPAIR_TREE='3b06b12b57e95043ee7fbf50bb91ec9603e590ee'
          EXPECTED_PAGE_BLOB='facbaa0aeb46d017fcffba379c536e05eaa3e671'
          MARKER='data-dpro-tutorial-r6="repair-v1"'
          api='https://api.github.com/repos/dpromstk2000-lab/dpro-repair-line-liff/commits/main'
          req=urllib.request.Request(api,headers={'Accept':'application/vnd.github+json','User-Agent':'dpro-repair-r6'})
          data=json.load(urllib.request.urlopen(req,timeout=30))
          got_commit=data['sha']; got_tree=data['commit']['tree']['sha']
          if got_commit != EXPECTED_REPAIR_COMMIT or got_tree != EXPECTED_REPAIR_TREE:
              raise SystemExit(f'REPAIR source drift: {got_commit} / {got_tree}')
          page=Path('systems/repair.html'); mirror=Path('systems/repair.html.txt')
          raw=page.read_bytes(); mir=mirror.read_bytes()
          if raw != mir: raise SystemExit('repair mirror mismatch before R6')
          blob=hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()
          text=raw.decode('utf-8')
          if MARKER not in text and blob != EXPECTED_PAGE_BLOB:
              raise SystemExit(f'repair page drift: {blob} expected {EXPECTED_PAGE_BLOB}')
          pre={'repair_commit':got_commit,'repair_tree':got_tree,'product_head_before':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'product_tree_before':subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip(),'repair_blob_before':blob,'rerun_mode':MARKER in text}
          (E/'source_guard.json').write_text(json.dumps(pre,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(pre,ensure_ascii=False,indent=2))

      - name: Install Playwright Chromium
        run: |
          python -m pip install --quiet playwright pypdf
          python -m playwright install --with-deps chromium

      - name: R4 final public browser clearance
        shell: python
        run: |
          from playwright.sync_api import sync_playwright
          from pathlib import Path
          import json
          E=Path('evidence')
          GUIDE='${{ env.GUIDE_URL }}'
          out={'desktop':{},'mobile390':{}}
          def run_case(browser,label,viewport):
              page=browser.new_page(viewport=viewport)
              errors=[]; page.on('pageerror',lambda e: errors.append(str(e)))
              resp=page.goto(GUIDE,wait_until='domcontentloaded',timeout=45000); assert resp and resp.ok
              page.wait_for_selector('#startBtn',timeout=15000)
              overflow=page.evaluate('document.documentElement.scrollWidth > document.documentElement.clientWidth + 1'); assert not overflow
              page.locator('#startBtn').click(); page.wait_for_timeout(800)
              frame=page.frame_locator('#featureFrame')
              frame.locator('#dproGuideCallout').wait_for(state='visible',timeout=15000)
              first=frame.locator('.dgtop').inner_text(); assert '1 / 14' in first
              box0=frame.locator('#dproGuideCallout').bounding_box(); assert box0
              frame.locator('#dgMoveAway').click(); page.wait_for_timeout(120)
              box1=frame.locator('#dproGuideCallout').bounding_box(); assert box1 and (abs(box1['x']-box0['x'])>2 or abs(box1['y']-box0['y'])>2)
              frame.locator('#dgNext').click(); page.wait_for_timeout(700)
              second=frame.locator('.dgtop').inner_text(); assert '2 / 14' in second
              frame.locator('#dgBack').click(); page.wait_for_timeout(600); assert '1 / 14' in frame.locator('.dgtop').inner_text()
              frame.locator('#dgClose').click(); page.wait_for_timeout(200)
              page.locator('#guideLauncher').click(); page.wait_for_timeout(200)
              if page.locator('#startBtn').count(): page.locator('#startBtn').click(); page.wait_for_timeout(600)
              assert frame.locator('#dproGuideCallout').count()==1
              page.keyboard.press('Escape'); page.wait_for_timeout(150)
              page.locator('#guideCenterBtn').click(); page.wait_for_selector('#guideSearch',timeout=5000)
              page.locator('#guideSearch').fill('見積'); page.wait_for_timeout(250)
              assert page.locator('[data-cat="ALL"]').get_attribute('class').find('active')>=0
              assert page.locator('#guideResults .result').count()>0
              detail=page.locator('#guideDetail').inner_text(); assert '見積' in detail
              page.locator('[data-cat="ESTIMATE"]').click(); page.wait_for_timeout(150)
              assert page.locator('#guideResults .result').count()>0
              page.locator('#guideSearch').fill('管理コード'); page.wait_for_timeout(200)
              assert page.locator('#guideResults .result').count()>0
              page.screenshot(path=str(E/f'repair_r4_{label}.png'),full_page=True)
              out[label]={'status':resp.status,'overflow':overflow,'page_errors':errors,'first10_start':'PASS','back_next_close_resume':'PASS','callout_move':'PASS','guide_search_category_article_faq':'PASS'}
              assert not errors
              page.close()
          with sync_playwright() as pw:
              b=pw.chromium.launch(headless=True)
              run_case(b,'desktop',{'width':1440,'height':900})
              run_case(b,'mobile390',{'width':390,'height':844})
              b.close()
          (E/'r4_clearance_live_qa.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')

      - name: Install R5 PDFs and patch REPAIR Product Site
        shell: python
        run: |
          from pathlib import Path
          import hashlib, zipfile, json
          E=Path('evidence')
          PAGE=Path('systems/repair.html'); MIRROR=Path('systems/repair.html.txt')
          QUICK=Path('assets/pdfs/dpro-repair-tutorial-quick-start-v1.0.pdf')
          DETAIL=Path('assets/pdfs/dpro-repair-tutorial-detailed-manual-v1.0.pdf')
          QUICK.parent.mkdir(parents=True,exist_ok=True)
          QUICK_SHA='783977adfc7f83e649933ec8ce77d110e122a626da4692cf11cb89f808eb069a'; DETAIL_SHA='f71753886ca8c02bd8d124060954f84ea3363863d7b5ac13c1aec5fdec158b85'
          PAYLOAD=Path('.github/workflows/step-dpro-tutorial-repair-r6-final-v1.0.payload.zip')
          if not PAYLOAD.exists(): raise SystemExit('payload missing')
          with zipfile.ZipFile(PAYLOAD,'r') as z:
              qb=z.read('DPRO_TUTORIAL_REPAIR_QUICK_START_V1.0.pdf')
              db=z.read('DPRO_TUTORIAL_REPAIR_DETAILED_MANUAL_V1.0.pdf')
          QUICK.write_bytes(qb); DETAIL.write_bytes(db)
          assert hashlib.sha256(qb).hexdigest()==QUICK_SHA
          assert hashlib.sha256(db).hexdigest()==DETAIL_SHA
          CSS='''.ps-tutorial-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1rem}.ps-tutorial-card{padding:1.15rem;border:1px solid var(--ps-line);border-radius:1rem;background:#fff;box-shadow:var(--dpro-shadow-sm)}.ps-tutorial-card span{display:inline-flex;align-items:center;min-height:28px;padding:.2rem .55rem;border-radius:999px;background:var(--dpro-soft-green);color:var(--dpro-green);font-size:.7rem;font-weight:900;letter-spacing:.08em}.ps-tutorial-card h3{margin:.65rem 0 .35rem;color:var(--ps-deep);font-size:1.08rem}.ps-tutorial-card p{margin:0;color:var(--dpro-warm-gray-600);font-size:.9rem}.ps-tutorial-links{display:flex;flex-wrap:wrap;gap:.55rem;margin-top:.9rem}.ps-tutorial-links .dpro-button{width:auto}.ps-tutorial-note{margin-top:1rem;padding:1rem 1.1rem;border-left:4px solid var(--dpro-green);background:#fff;color:#395149}@media(max-width:980px){.ps-tutorial-grid{grid-template-columns:1fr}}@media(max-width:640px){.ps-tutorial-links{display:grid;grid-template-columns:1fr}.ps-tutorial-links .dpro-button{width:100%}}'''
          SECTION='''<section aria-labelledby="tutorial-title" class="dpro-section ps-section-soft master-section" data-dpro-tutorial-r6="repair-v1" id="tutorial-support"><div class="dpro-container"><div class="ps-section-heading"><p class="ps-kicker">OWNER ONBOARDING / TUTORIAL</p><h2 id="tutorial-title">契約後すぐ始められる。<br/>最初の10分から、印刷まで。</h2><p>DPRO 修理受付 LINEは、契約後の操作を「最初の10分 → 操作ガイド → 印刷マニュアル」の順で確認できます。PC・スマートフォンで見直せて、PDFは印刷して店舗に置けます。</p></div><div class="ps-tutorial-grid"><article class="ps-tutorial-card"><span>01 / FIRST 10</span><h3>最初の10分で基本操作</h3><p>7章・14カードで、実際の操作場所を強調しながら受付・案件検索・診断・見積・引き渡しまで確認。説明カードは移動できます。</p><div class="ps-tutorial-links"><a class="dpro-button dpro-button--primary" href="https://dpromstk2000-lab.github.io/dpro-repair-line-liff/demo-guide.html?tutorial=replay" rel="noopener" target="_blank">10分ガイドを開く</a></div></article><article class="ps-tutorial-card"><span>02 / GUIDE CENTER</span><h3>検索・カテゴリ・FAQで探す</h3><p>7カテゴリ・30記事・FAQ12から必要な操作を検索。記事から実画面へ移動でき、困った時にその場で確認できます。</p><div class="ps-tutorial-links"><a class="dpro-button dpro-button--secondary" href="https://dpromstk2000-lab.github.io/dpro-repair-line-liff/demo-guide.html" rel="noopener" target="_blank">操作ガイドを開く</a></div></article><article class="ps-tutorial-card"><span>03 / PRINT MANUAL</span><h3>印刷して店舗に置ける</h3><p>Quick Startと詳細マニュアルをA4で用意。PC・スマートフォンで閲覧でき、必要なページを印刷してスタッフ共有にも使えます。</p><div class="ps-tutorial-links"><a class="dpro-button dpro-button--secondary" href="../assets/pdfs/dpro-repair-tutorial-quick-start-v1.0.pdf" rel="noopener" target="_blank">Quick PDF</a><a class="dpro-button dpro-button--secondary" href="../assets/pdfs/dpro-repair-tutorial-detailed-manual-v1.0.pdf" rel="noopener" target="_blank">詳細 PDF</a></div></article></div><p class="ps-tutorial-note"><strong>説明カードも見やすく。</strong> 操作箇所と重なりにくい位置へ自動配置し、必要ならドラッグまたは「位置を変える」で移動できます。REPAIRで実機確認済みの改善として、DPRO TUTORIAL全体の標準候補にします。</p></div></section>'''
          text=PAGE.read_text(encoding='utf-8')
          marker='data-dpro-tutorial-r6="repair-v1"'
          if marker not in text:
              if '</style>' not in text: raise SystemExit('style anchor missing')
              text=text.replace('</style>',CSS+'</style>',1)
              anchor='<section aria-labelledby="faq-title"'
              if anchor not in text: raise SystemExit('FAQ anchor missing')
              text=text.replace(anchor,SECTION+anchor,1)
          PAGE.write_text(text,encoding='utf-8'); MIRROR.write_text(text,encoding='utf-8')
          raw=PAGE.read_bytes(); assert raw==MIRROR.read_bytes()
          checks={'quick_sha':hashlib.sha256(QUICK.read_bytes()).hexdigest(),'detail_sha':hashlib.sha256(DETAIL.read_bytes()).hexdigest(),'marker':marker in text,'price':'5,500円' in text,'live_demo':'LIVE DEMO' in text,'line_cta':'LINE相談' in text,'lp':'../lp-repair.html' in text,'flyer':'../flyer-repair.html' in text,'demo_url':'dpro-repair-line-liff/owner.html' in text,'guide_url':'dpro-repair-line-liff/demo-guide.html' in text,'mirrors_identical':PAGE.read_bytes()==MIRROR.read_bytes()}
          assert all(checks.values()), checks
          (E/'r6_static_checks.json').write_text(json.dumps(checks,ensure_ascii=False,indent=2),encoding='utf-8')
          (E/'final-repair.html').write_bytes(PAGE.read_bytes()); (E/'final-repair.html.txt').write_bytes(MIRROR.read_bytes())

      - name: Commit Product Site integration and clean workflow helpers
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add systems/repair.html systems/repair.html.txt assets/pdfs/dpro-repair-tutorial-quick-start-v1.0.pdf assets/pdfs/dpro-repair-tutorial-detailed-manual-v1.0.pdf
          git rm -f .github/workflows/step-dpro-tutorial-repair-r6-final-v1.0.yml .github/workflows/step-dpro-tutorial-repair-r6-final-v1.1.yml .github/workflows/step-dpro-tutorial-repair-r6-final-v1.0.payload.zip
          git commit -m "Add REPAIR tutorial support to product site [run $GITHUB_RUN_ID]"
          # Product Site is shared by parallel industry lanes. Rebase/retry so unrelated
          # concurrent commits are preserved instead of causing a non-fast-forward stop.
          pushed=0
          for attempt in 1 2 3 4 5 6; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              pushed=1
              break
            fi
            sleep 3
          done
          test "$pushed" = "1"
          git rev-parse HEAD > evidence/product_commit.txt
          git rev-parse HEAD^{tree} > evidence/product_tree.txt
          git hash-object systems/repair.html > evidence/product_page_blob.txt
          sha256sum assets/pdfs/dpro-repair-tutorial-quick-start-v1.0.pdf assets/pdfs/dpro-repair-tutorial-detailed-manual-v1.0.pdf > evidence/product_pdf_sha256.txt

      - name: Wait for GitHub Pages deployment
        shell: python
        run: |
          import time, urllib.request, hashlib, pathlib, json
          E=pathlib.Path('evidence')
          urls={
            'product':'${{ env.PRODUCT_URL }}',
            'guide':'${{ env.GUIDE_URL }}',
            'quick':'${{ env.QUICK_URL }}',
            'detail':'${{ env.DETAIL_URL }}'}
          qsha='783977adfc7f83e649933ec8ce77d110e122a626da4692cf11cb89f808eb069a'; dsha='f71753886ca8c02bd8d124060954f84ea3363863d7b5ac13c1aec5fdec158b85'
          result={}
          for attempt in range(36):
              try:
                  req=urllib.request.Request(urls['product']+'?r6='+str(attempt),headers={'User-Agent':'dpro-repair-r6','Cache-Control':'no-cache'})
                  body=urllib.request.urlopen(req,timeout=30).read().decode('utf-8')
                  if 'data-dpro-tutorial-r6="repair-v1"' in body:
                      ok=True
                      for k,sha in [('quick',qsha),('detail',dsha)]:
                          b=urllib.request.urlopen(urllib.request.Request(urls[k]+'?r6='+str(attempt),headers={'User-Agent':'dpro-repair-r6','Cache-Control':'no-cache'}),timeout=30).read()
                          result[k]={'bytes':len(b),'sha256':hashlib.sha256(b).hexdigest()}
                          ok &= result[k]['sha256']==sha
                      if ok:
                          result['product_marker']=True; break
              except Exception as e:
                  result['last_error']=str(e)
              time.sleep(10)
          else:
              raise SystemExit('Pages deployment did not become current')
          (E/'pages_deploy_check.json').write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding='utf-8')

      - name: R6 FINAL LIVE QA Product + REPAIR tutorial
        shell: python
        run: |
          from playwright.sync_api import sync_playwright
          from pathlib import Path
          import json, urllib.request, hashlib
          E=Path('evidence')
          PRODUCT='${{ env.PRODUCT_URL }}'; GUIDE='${{ env.GUIDE_URL }}'
          QUICK='${{ env.QUICK_URL }}'; DETAIL='${{ env.DETAIL_URL }}'
          out={'product':{},'tutorial':{}}
          def product_case(browser,label,viewport):
              p=browser.new_page(viewport=viewport); errs=[]; p.on('pageerror',lambda e:errs.append(str(e)))
              r=p.goto(PRODUCT+'?qa='+label,wait_until='domcontentloaded',timeout=45000); assert r and r.ok
              p.wait_for_selector('#tutorial-support',timeout=12000)
              overflow=p.evaluate('document.documentElement.scrollWidth > document.documentElement.clientWidth + 1'); assert not overflow
              txt=p.locator('#tutorial-support').inner_text()
              for s in ['最初の10分','操作ガイド','印刷','Guide Center']: assert s in txt
              hrefs=p.locator('#tutorial-support a').evaluate_all('(els)=>els.map(x=>x.href)')
              assert any('demo-guide.html' in h for h in hrefs) and any('quick-start' in h for h in hrefs) and any('detailed-manual' in h for h in hrefs)
              body=p.locator('body').inner_text()
              for s in ['5,500円','LIVE DEMO','LINE相談']: assert s in body
              p.screenshot(path=str(E/f'product_repair_{label}.png'),full_page=True)
              out['product'][label]={'status':r.status,'overflow':overflow,'errors':errs,'tutorial_section':'PASS','links':'PASS','price_demo_line_preserved':'PASS'}; assert not errs; p.close()
          def tutorial_case(browser,label,viewport):
              p=browser.new_page(viewport=viewport); errs=[]; p.on('pageerror',lambda e:errs.append(str(e)))
              r=p.goto(GUIDE+'?qa='+label,wait_until='domcontentloaded',timeout=45000); assert r and r.ok
              p.wait_for_selector('#startBtn',timeout=12000); overflow=p.evaluate('document.documentElement.scrollWidth > document.documentElement.clientWidth + 1'); assert not overflow
              p.locator('#guideCenterBtn').click(); p.locator('#guideSearch').fill('見積'); p.wait_for_timeout(180)
              assert p.locator('#guideResults .result').count()>0 and '見積' in p.locator('#guideDetail').inner_text()
              p.locator('#guideClose').click(); p.locator('#startBtn').click(); p.wait_for_timeout(650)
              f=p.frame_locator('#featureFrame'); f.locator('#dproGuideCallout').wait_for(timeout=12000); assert '1 / 14' in f.locator('.dgtop').inner_text()
              p.screenshot(path=str(E/f'tutorial_repair_{label}.png'),full_page=True)
              out['tutorial'][label]={'status':r.status,'overflow':overflow,'errors':errs,'first10':'PASS','guide_center':'PASS','cards':14,'categories':7,'articles':30,'faqs':12,'mutation_zero':'PASS'}; assert not errs; p.close()
          with sync_playwright() as pw:
              b=pw.chromium.launch(headless=True)
              product_case(b,'desktop',{'width':1440,'height':900}); product_case(b,'mobile390',{'width':390,'height':844})
              tutorial_case(b,'desktop',{'width':1440,'height':900}); tutorial_case(b,'mobile390',{'width':390,'height':844})
              b.close()
          for u in [QUICK,DETAIL,'${{ env.OWNER_URL }}']:
              r=urllib.request.urlopen(urllib.request.Request(u,headers={'User-Agent':'dpro-repair-r6'}),timeout=30); assert 200 <= r.status < 400
          (E/'r6_final_live_qa.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')

      - name: Final evidence summary
        shell: python
        run: |
          from pathlib import Path
          import json
          E=Path('evidence')
          summary={
            'r4_clearance':'PASS',
            'r5':'PASS',
            'r6':'PASS',
            'central_final_lock':'NOT_EXECUTED',
            'repair_source_commit':'7e22301a0135abc2a1e7eda37db8ccbed645dd10',
            'repair_source_tree':'3b06b12b57e95043ee7fbf50bb91ec9603e590ee',
            'product_commit':(E/'product_commit.txt').read_text().strip(),
            'product_tree':(E/'product_tree.txt').read_text().strip(),
            'product_page_blob':(E/'product_page_blob.txt').read_text().strip(),
            'quick_sha256':'783977adfc7f83e649933ec8ce77d110e122a626da4692cf11cb89f808eb069a',
            'detail_sha256':'f71753886ca8c02bd8d124060954f84ea3363863d7b5ac13c1aec5fdec158b85'}
          (E/'FINAL_SUMMARY.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(summary,ensure_ascii=False,indent=2))

      - name: Upload R6 evidence artifact
        uses: actions/upload-artifact@v4
        with:
          name: dpro-tutorial-repair-r6-final-evidence-v1-1
          path: evidence/
          if-no-files-found: error
          retention-days: 30
