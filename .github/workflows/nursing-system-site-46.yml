name: Add home nursing system as product 46

on:
  push:
    paths:
      - ".github/workflows/nursing-system-site-46.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  add-product:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add product 46
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64

          script_path = Path("script.js")
          text = script_path.read_text(encoding="utf-8")

          if "systems/home-nursing.html" in text:
              raise SystemExit("訪問看護はすでにscript.jsへ登録されています。")

          old_marker = "// STEP SITE-SODAN-1 / 45 PRODUCTS / PRESERVE ALL 44 PRODUCTS / 20260731"
          new_marker = "// STEP SITE-NURSING-46 / 46 PRODUCTS / PRESERVE ALL 45 PRODUCTS / 20260731"
          if old_marker not in text:
              raise SystemExit("45番目反映後のscript.jsではありません。処理を停止しました。")
          text = text.replace(old_marker, new_marker, 1)

          if "const productCount = 45;" not in text:
              raise SystemExit("productCount=45が見つかりません。")
          text = text.replace("const productCount = 45;", "const productCount = 46;", 1)

          description_anchor = '  appendDescription("教育・生活サービス", "相談支援事業所");'
          if description_anchor not in text:
              raise SystemExit("相談支援事業所のカテゴリ説明位置が見つかりません。")
          text = text.replace(
              description_anchor,
              description_anchor + '\n  appendDescription("教育・生活サービス", "訪問看護ステーション");',
              1
          )

          products_start = text.index("  const products = [")
          products_end = text.index("\n  ];", products_start)
          nursing_product = ''',
              [
                "systems/home-nursing.html",
                "HN",
                "catalog-live-home-nursing",
                "訪問看護ステーション実画面プレビュー",
                "https://dpromstk2000-lab.github.io/dpro-home-nursing-line/owner.html?v=NURSING-11",
                "教育・生活サービス",
                "訪問看護ステーション",
                "新規相談・訪問予定・スタッフ配置・訪問開始終了・家族報告・LINE連携・家族連絡。"
              ]'''
          text = text[:products_end] + nursing_product + text[products_end:]

          category_anchor = '      "相談支援事業所",\n      "宿泊・民泊",'
          if category_anchor not in text:
              raise SystemExit("教育・生活サービスのカテゴリ一覧位置が見つかりません。")
          text = text.replace(
              category_anchor,
              '      "相談支援事業所",\n      "訪問看護ステーション",\n      "宿泊・民泊",',
              1
          )

          required = [
              "const productCount = 46;",
              'appendDescription("教育・生活サービス", "訪問看護ステーション");',
              '"systems/home-nursing.html"',
              '"訪問看護ステーション"',
              "// STEP SITE-NURSING-46 / 46 PRODUCTS / PRESERVE ALL 45 PRODUCTS / 20260731"
          ]
          missing = [item for item in required if item not in text]
          if missing:
              raise SystemExit(f"script.js更新検査に失敗しました: {missing}")

          script_path.write_text(text, encoding="utf-8", newline="\n")

          page_b64 = ""
          page_bytes = base64.b64decode(page_b64)
          page_path = Path("systems/home-nursing.html")
          page_path.parent.mkdir(parents=True, exist_ok=True)
          page_path.write_bytes(page_bytes)

          page_text = page_bytes.decode("utf-8")
          page_required = [
              "STEP NURSING-SYSTEM-SITE-46",
              "DPRO 訪問看護ステーション LINE",
              "NURSING-11",
              "45項目で一括検査",
              "電子カルテ"
          ]
          page_missing = [item for item in page_required if item not in page_text]
          if page_missing:
              raise SystemExit(f"専用ページ検査に失敗しました: {page_missing}")

          print("productCount=46")
          print("home-nursing catalog card=OK")
          print("home-nursing product page=OK")
          PY

      - name: Remove temporary workflow
        run: rm -f .github/workflows/nursing-system-site-46.yml

      - name: Commit product 46
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Add home nursing system as product 46"
          git push
