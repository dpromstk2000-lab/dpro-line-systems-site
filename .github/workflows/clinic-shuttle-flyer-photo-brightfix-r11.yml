name: DPRO Clinic Shuttle Flyer Photo Brightfix R11

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/clinic-shuttle-flyer-photo-brightfix-r11.yml"
      - ".github/workflows/clinic-shuttle-flyer-photo-brightfix-r11.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dpro-clinic-shuttle-flyer-photo-brightfix-r11
  cancel-in-progress: false

jobs:
  flyer-photo-brightfix-r11:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout PRODUCT
        uses: actions/checkout@v4
        with:
          fetch-depth: 4

      - name: Guard R10 PRODUCT
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "a4817f9c222b13e93fa49105b543cd3ab5ee4785" || { echo "PRODUCT parent drift"; exit 1; }

      - name: Patch flyer photo, brighten tone, and fix bottom crop
        run: python .github/workflows/clinic-shuttle-flyer-photo-brightfix-r11.py patch

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install QA dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright pymupdf opencv-python-headless zxing-cpp numpy
          python -m playwright install --with-deps chromium

      - name: Build updated flyer PDF and screen evidence
        run: python .github/workflows/clinic-shuttle-flyer-photo-brightfix-r11.py build

      - name: Verify updated PDF and decode QR
        run: python .github/workflows/clinic-shuttle-flyer-photo-brightfix-r11.py pdfqa

      - name: Commit flyer and evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flyer-clinic-shuttle.html flyer-clinic-shuttle.pdf assets/clinic-shuttle-next
          git commit -m "Brighten clinic shuttle flyer and replace hero photo"
          git push origin main

      - name: Public flyer QA
        run: python .github/workflows/clinic-shuttle-flyer-photo-brightfix-r11.py publicqa

      - name: Commit public flyer QA evidence
        shell: bash
        run: |
          set -euo pipefail
          git add assets/clinic-shuttle-next
          git commit -m "Verify bright clinic shuttle flyer R11"
          git push origin main

      - name: Remove R11 one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin main
          git rm -f .github/workflows/clinic-shuttle-flyer-photo-brightfix-r11.yml .github/workflows/clinic-shuttle-flyer-photo-brightfix-r11.py
          git commit -m "Remove completed clinic shuttle flyer brightfix workflow"
          git push origin main
