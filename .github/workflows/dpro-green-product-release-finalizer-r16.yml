          # Copy required evidence flat at ZIP root.
          for name in [
            'FINAL_RELEASE_1_OF_4.json',
            'FINAL_RELEASE_2_OF_4.json',
            'FINAL_RELEASE_3_OF_4.json',
            'FINAL_RELEASE_4_OF_4.json',
            'HUMAN_ACCEPTANCE.json',
            'HISTORY_PRESERVATION_QA.json',
            'OPEN_DEFECT_REGISTER.json',
            'PRODUCT_RELEASE_LOCK.txt',
            'FINAL_RELEASE_4_OF_4_RESULT.txt',
            'PRODUCT_RELEASE_EVIDENCE.json',
            'PRODUCT_RELEASE_MANIFEST.json'
          ]:
              shutil.copy2(finaldir/name,root/name)

          (root/'FACT_LOCK.json').write_text(json.dumps(fact,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          (root/'PUBLIC_SURFACE_MATRIX.json').write_text(json.dumps(surface,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          (root/'DEPLOY_ATTESTATION.json').write_text(json.dumps(deploy,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          (root/'PRODUCT_RELEASE_RETURN.json').write_text(json.dumps(ret,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          (root/'00_START_HERE.txt').write_text(
            'DPRO GREEN PRODUCT RELEASE COMPLETE RETURN R2\n'
            'SYSTEM: FINAL LOCK PROTECTED\n'
            'BRUSHUP: 4/4 PASS\n'
            'HUMAN ACCEPTANCE: PASS\n'
