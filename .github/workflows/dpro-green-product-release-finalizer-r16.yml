              'official_pages_run_id':36155555287,
              'product_candidate_head':candidate_head,
              'product_candidate_pages_run_id':candidate_pages,
              'product_lock_head':lock_head,
              'product_lock_pages_run_id':lock_pages,
              'system_final_lock_head':'6e359937a28e32380e0c4b2e3cd5ca5fbcbbab59',
              'control_center_head':'ceb417ba71eb1532cd28e4049bc7d7bf84714c1f'
            }
          }

          assert ret['initial_publish']['pass']
          assert all(v['pass'] for v in ret['brushup'].values())
          assert ret['human_acceptance']['pass']
          assert ret['history_preservation']['pass']
          assert all(v['pass'] for v in ret['final_release'].values())
