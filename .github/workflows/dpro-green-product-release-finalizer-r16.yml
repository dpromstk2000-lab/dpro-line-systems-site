            f'PRODUCT_RELEASE_COMPLETE: PASS\n'
            f'PRODUCT LOCK HEAD: {lock_head}\n'
            f'OFFICIAL HEAD: 0031e9c8eacc81529df5244403afab71c5077514\n'
            f'SYSTEM FINAL LOCK: 6e359937a28e32380e0c4b2e3cd5ca5fbcbbab59\n'
            f'LOCK PAGES RUN: {lock_pages}\n'
            f'OPEN BLOCKER/HIGH: 0\n',
            encoding='utf-8'
          )

          # Hash manifest for the final return packet.
          lines=[]
          for p in sorted(root.iterdir()):
              if p.is_file() and p.name!='SHA256SUMS.txt':
                  lines.append(f"{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.name}")
          (root/'SHA256SUMS.txt').write_text('\n'.join(lines)+'\n',encoding='utf-8')

          # Flat ZIP: files only at root.
          zip_name=Path('DPRO_GREEN_PRODUCT_RELEASE_COMPLETE_RETURN_R2_20260926.zip')
          with zipfile.ZipFile(zip_name,'w',compression=zipfile.ZIP_DEFLATED) as z:
