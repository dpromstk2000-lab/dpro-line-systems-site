name: DPRO GREEN PRODUCT RELEASE FINALIZER R16

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/dpro-green-product-release-finalizer-r16.yml"

permissions:
  contents: write
  actions: read

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RELEASE_ID: GREEN-PR-V12-20260925-R1
      PRODUCT_DEV_ID: c9d11f3a-de31-4efe-8dc5-fc4a20d18725
      SYSTEM_CODE: GREEN
      RELEASE_MASTER_VERSION: DPRO_PRODUCT_RELEASE_MASTER_V1.2
      RELEASE_MASTER_REVISION: 20260921-HISTORY-PRESERVATION-R1

      SYSTEM_LOCK_HEAD: 6e359937a28e32380e0c4b2e3cd5ca5fbcbbab59
      PREFINAL_PRODUCT_HEAD: d3a4c1aec4b81a1a8e48b16f3d16fa39ea512e32
      OFFICIAL_FINAL_HEAD: 0031e9c8eacc81529df5244403afab71c5077514
      CONTROL_CENTER_HEAD: ceb417ba71eb1532cd28e4049bc7d7bf84714c1f

      R15_HUMAN_REVIEW_RUN_ID: "36158038282"
      R14_OFFICIAL_WORKFLOW_RUN_ID: "36155535712"
      R14_OFFICIAL_PAGES_RUN_ID: "36155555287"

      HUMAN_APPROVAL_PHRASE: HUMAN ACCEPTANCE OK
      HUMAN_APPROVER: DPRO Owner
      HUMAN_APPROVED_AT: 2026-09-26T01:01:00+09:00

      RELEASE_CANDIDATE_MARKER: GREEN-PRODUCT-RELEASE-R16-CANDIDATE-20260926
      OFFICIAL_R14_MARKER: GREEN-OFFICIAL-LOCAL-SCREEN-R14-20260925
      FINAL_DIR: assets/green-rental-next/release-v12/final-r16

      SYSTEM_API: https://dpro-green-rental-line-api.dpromstk2000.workers.dev
      OFFICIAL_URL: https://dpro-shop.com/systems/green-rental
      PRODUCT_URL: https://dpromstk2000-lab.github.io/dpro-line-systems-site/systems/green-rental.html
      LP_URL: https://dpromstk2000-lab.github.io/dpro-line-systems-site/systems/green-rental-lp-v12.html
      FLYER_HTML_URL: https://dpromstk2000-lab.github.io/dpro-line-systems-site/flyer-green-rental.html
      FLYER_PDF_URL: https://dpromstk2000-lab.github.io/dpro-line-systems-site/flyer-green-rental.pdf
      OPERATION_PDF_URL: https://dpromstk2000-lab.github.io/dpro-line-systems-site/assets/green-rental-next/DPRO_GREEN_RENTAL_OPERATION_EXPERIENCE_SHEET_V1.0.pdf
      QUICK_START_URL: https://dpromstk2000-lab.github.io/dpro-line-systems-site/assets/pdfs/dpro-green-rental-tutorial-quick-start-v1.0.pdf
      DETAILED_MANUAL_URL: https://dpromstk2000-lab.github.io/dpro-line-systems-site/assets/pdfs/dpro-green-rental-tutorial-detailed-manual-v1.0.pdf
      LINE_URL: https://lin.ee/YxJGXV6D

      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout PRODUCT repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard pre-final baselines and upload scope
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$FINAL_DIR" finalizer-r16/{screens,pdf-renders,raw,evidence} return-r2

          parent="$(git rev-parse HEAD^)"
          test "$parent" = "$PREFINAL_PRODUCT_HEAD"

          changed="$(git diff-tree --no-commit-id --name-only -r HEAD)"
          test "$changed" = ".github/workflows/dpro-green-product-release-finalizer-r16.yml"

          system_head="$(git ls-remote https://github.com/dpromstk2000-lab/dpro-green-rental-line.git refs/heads/main | awk '{print $1}')"
          official_head="$(git ls-remote https://github.com/dpromstk2000-lab/dpro-shop-official-site.git refs/heads/main | awk '{print $1}')"
          control_head="$(git ls-remote https://github.com/dpromstk2000-lab/dpro-shop-control-center.git refs/heads/main | awk '{print $1}')"

          test "$system_head" = "$SYSTEM_LOCK_HEAD"
          test "$official_head" = "$OFFICIAL_FINAL_HEAD"
          test "$control_head" = "$CONTROL_CENTER_HEAD"

          echo "$system_head" > finalizer-r16/raw/system-head-before.txt
          echo "$official_head" > finalizer-r16/raw/official-head-before.txt
          echo "$control_head" > finalizer-r16/raw/control-center-head-before.txt
          echo "$(git rev-parse HEAD)" > finalizer-r16/raw/finalizer-upload-head.txt

          echo "PRE-FINAL BASELINES: PASS"
          echo "SYSTEM FINAL LOCK: PROTECTED"

      - name: Install finalizer dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils zbar-tools jq >/dev/null
          npm install --no-audit --no-fund --silent playwright@1.55.0
          npx playwright install --with-deps chromium >/dev/null

      - name: Capture history preservation BEFORE
        shell: bash
        run: |
          set -euo pipefail

          member_login="$(curl -fsS -H 'content-type: application/json' \
            -d '{"mode":"demo","facilityCode":"dpro_green_rental_demo","token":"GREEN-DEMO","customerNumber":"DEMO-GREEN-001"}' \
            "$SYSTEM_API/api/member/login")"

          member_token="$(printf '%s' "$member_login" | jq -r '.data.sessionToken // empty')"
          test -n "$member_token"

          curl -fsS -H "Authorization: Bearer $member_token" \
            "$SYSTEM_API/api/member/overview" \
            > finalizer-r16/raw/member-overview-before.json

          jq -e '.ok == true' finalizer-r16/raw/member-overview-before.json >/dev/null
          echo "HISTORY BEFORE SNAPSHOT: PASS"

      - name: FINAL RELEASE 1 of 4 - FACT scope price role SEO
        shell: bash
        run: |
          set -euo pipefail

          curl -fsSL "${OFFICIAL_URL}?final=f1" -o finalizer-r16/raw/official-f1.html
          curl -fsSL "${PRODUCT_URL}?final=f1" -o finalizer-r16/raw/product-f1.html
          curl -fsSL "${LP_URL}?final=f1" -o finalizer-r16/raw/lp-f1.html
          curl -fsSL https://dpro-shop.com/404.html -o finalizer-r16/raw/official-404.html
          curl -fsSL https://dpro-shop.com/sitemap.xml -o finalizer-r16/raw/official-sitemap.xml
          curl -fsSL https://dpromstk2000-lab.github.io/dpro-line-systems-site/sitemap.xml \
            -o finalizer-r16/raw/product-sitemap.xml

          python3 - <<'PY'
          from pathlib import Path
          import json,re

          fact=json.loads(Path('assets/green-rental-next/release-v12/FACT_LOCK.json').read_text(encoding='utf-8'))
          O=Path('finalizer-r16/raw/official-f1.html').read_text(errors='ignore')
          P=Path('finalizer-r16/raw/product-f1.html').read_text(errors='ignore')
          L=Path('finalizer-r16/raw/lp-f1.html').read_text(errors='ignore')

          assert fact['locked'] is True
          assert fact['release_id']=='GREEN-PR-V12-20260925-R1'
          assert fact['product_dev_id']=='c9d11f3a-de31-4efe-8dc5-fc4a20d18725'
          assert fact['system_code']=='GREEN'
          assert fact['system_final_lock_head']=='6e359937a28e32380e0c4b2e3cd5ca5fbcbbab59'
          assert fact['product_count']==55
          assert fact['prices_tax_included']['line_build_initial']==77000
          assert fact['prices_tax_included']['dpro_initial']==33000
          assert fact['prices_tax_included']['dpro_operation_monthly']==1100
          assert fact['prices_tax_included']['integrated_monthly']==5500
          assert fact['flyer_master_id']=='DPRO A4 FLYER MASTER V2.0'
          assert fact['lp_master_id']=='DPRO-LP-MASTER-V1.4'
          assert fact['history_preservation']['assessed'] is True
          assert fact['history_preservation']['applicable'] is True

          checks={
            'official_release':'GREEN-PR-V12-20260925-R1' in O,
            'official_r14':'GREEN-OFFICIAL-LOCAL-SCREEN-R14-20260925' in O,
            'official_same_origin_screens':'/assets/green-rental-next/screens/' in O,
            'official_no_external_green_screens':'https://dpromstk2000-lab.github.io/dpro-line-systems-site/assets/green-rental-next/screens/' not in O,
            'official_price':'33,000' in O and '1,100' in O and '5,500' in O,
            'product_release':'GREEN-PR-V12-20260925-R1' in P,
            'product_price':'33,000' in P and '5,500' in P,
            'product_lp_path':'green-rental-lp-v12.html' in P,
            'lp_release':'GREEN-PR-V12-20260925-R1' in L,
            'line_all':all('https://lin.ee/YxJGXV6D' in x for x in [O,P,L]),
            'official_count_55':'55システム' in Path('finalizer-r16/raw/official-404.html').read_text(errors='ignore'),
            'official_sitemap':'green-rental' in Path('finalizer-r16/raw/official-sitemap.xml').read_text(errors='ignore'),
            'product_sitemap_lp':'systems/green-rental-lp-v12.html' in Path('finalizer-r16/raw/product-sitemap.xml').read_text(errors='ignore'),
          }
          bad={k:v for k,v in checks.items() if not v}
          if bad: raise SystemExit('FINAL RELEASE 1/4 FAIL '+repr(bad))

          out={
            'schema':'DPRO-GREEN-FINAL-RELEASE-1-OF-4-R16',
            'pass':True,
            'gate':'FACT / SCOPE / PRICE / ROLE / SEO',
            'fact_lock_snapshot':fact,
            'checks':checks,
            'evidence':['FACT_LOCK.json','official-f1.html','product-f1.html','lp-f1.html','sitemaps','404 scan']
          }
          Path('finalizer-r16/evidence/FINAL_RELEASE_1_OF_4.json').write_text(
              json.dumps(out,ensure_ascii=False,indent=2)+'\n',encoding='utf-8'
          )
          print('FINAL RELEASE 1/4: PASS')
          PY

      - name: FINAL RELEASE 2 of 4 - WEB exact sales journey
        shell: bash
        run: |
          set -euo pipefail

          cat > .green-final-f2.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'fs';

          const surfaces=[
            ['official',process.env.OFFICIAL_URL],
            ['product',process.env.PRODUCT_URL],
            ['lp',process.env.LP_URL]
          ];
          const widths=[390,768,1440];

          const requiredRoles=new Set([
            'official-nav-line',
            'official-hero-demo-modal',
            'official-hero-demo-tab',
            'official-hero-line',
            'official-final-line',
            'official-final-demo',
            'product-nav-line',
            'product-hero-demo',
            'product-hero-line',
            'product-demo-tab',
            'product-guide',
            'product-quick-start',
            'product-detailed-manual',
            'product-official',
            'product-lp',
            'product-flyer-html',
            'product-flyer-pdf',
            'product-operation-sheet',
            'lp-hero-demo',
            'lp-hero-line',
            'lp-final-line',
            'lp-final-product'
          ]);

          const browser=await chromium.launch({headless:true});
          const evidence={
            schema:'DPRO-GREEN-FINAL-RELEASE-2-OF-4-R16',
            pass:false,
            gate:'WEB / EXACT SALES JOURNEY',
            viewports:{},
            ctas:[]
          };

          for(const [surface,url] of surfaces){
            evidence.viewports[surface]={};
            for(const width of widths){
              const page=await browser.newPage({viewport:{width,height:1000},deviceScaleFactor:1});
              const errors=[];
              page.on('console',m=>{ if(m.type()==='error') errors.push(m.text()); });

              const resp=await page.goto(`${url}?final=f2-${width}`,{
                waitUntil:'networkidle',
                timeout:90000
              });
              if(!resp || !resp.ok()) throw new Error(`${surface} HTTP ${resp?.status()}`);

              const metrics=await page.evaluate(()=>({
                scrollWidth:document.documentElement.scrollWidth,
                clientWidth:document.documentElement.clientWidth,
                title:document.title
              }));
              if(metrics.scrollWidth>metrics.clientWidth+3){
                throw new Error(`${surface} ${width}px overflow ${JSON.stringify(metrics)}`);
              }

              if(surface==='official'){
                await page.waitForFunction(()=>{
                  const imgs=[...document.querySelectorAll('img.green-screen-shot')];
                  return imgs.length>=6 && imgs.every(img=>
                    img.complete && img.naturalWidth>=900 && img.naturalHeight>=600
                  );
                },null,{timeout:90000});

                const imgs=await page.locator('img.green-screen-shot').evaluateAll(nodes=>nodes.map(img=>({
                  src:img.currentSrc||img.src,
                  loading:img.loading,
                  naturalWidth:img.naturalWidth,
                  naturalHeight:img.naturalHeight
                })));
                if(imgs.some(x=>new URL(x.src).hostname!=='dpro-shop.com')) throw new Error('official external real-screen URL remains');
                if(imgs.some(x=>x.loading==='lazy')) throw new Error('official real-screen lazy remains');
              }

              if(width===1440){
                const rows=await page.locator('[data-product-code="GREEN"][data-cta-role]').evaluateAll(els=>els.map(el=>({
                  role:el.getAttribute('data-cta-role'),
                  href:el.href||null,
                  text:(el.textContent||'').trim().replace(/\s+/g,' ')
                })));
                evidence.ctas.push(...rows.map(r=>({surface,...r})));
              }

              await page.screenshot({
                path:`finalizer-r16/screens/f2-${surface}-${width}.png`,
                fullPage:true
              });
              evidence.viewports[surface][width]={...metrics,status:resp.status(),console_error_count:errors.length};
              await page.close();
            }
          }

          const roles=new Set(evidence.ctas.map(x=>x.role).filter(Boolean));
          const missing=[...requiredRoles].filter(x=>!roles.has(x));
          if(missing.length) throw new Error('missing exact CTA roles: '+missing.join(', '));

          for(const cta of evidence.ctas){
            if(cta.role==='official-hero-demo-modal'){
              if(cta.href!==null) throw new Error('modal CTA unexpectedly has href');
              continue;
            }
            if(!cta.href) throw new Error(`CTA href missing: ${cta.role}`);
            if(['official-nav-line','official-hero-line','official-final-line','product-nav-line','product-hero-line','lp-hero-line','lp-final-line'].includes(cta.role)){
              if(cta.href!=='https://lin.ee/YxJGXV6D') throw new Error(`LINE mismatch ${cta.role}: ${cta.href}`);
            }
          }

          evidence.pass=true;
          fs.writeFileSync('finalizer-r16/evidence/FINAL_RELEASE_2_OF_4.json',JSON.stringify(evidence,null,2)+'\n');
          console.log('FINAL RELEASE 2/4: PASS');
          await browser.close();
          JS

          node .green-final-f2.mjs
          rm -f .green-final-f2.mjs

      - name: FINAL RELEASE 3 of 4 - PRINT visual PDF QR and HUMAN ACCEPTANCE
        shell: bash
        run: |
          set -euo pipefail

          test "$HUMAN_APPROVAL_PHRASE" = "HUMAN ACCEPTANCE OK"

          curl -fsSL --retry 5 --retry-delay 3 "$FLYER_PDF_URL" \
            -o finalizer-r16/raw/flyer.pdf
          curl -fsSL --retry 5 --retry-delay 3 "$OPERATION_PDF_URL" \
            -o finalizer-r16/raw/operation.pdf

          pdfinfo finalizer-r16/raw/flyer.pdf > finalizer-r16/raw/flyer-pdfinfo.txt
          pdfinfo finalizer-r16/raw/operation.pdf > finalizer-r16/raw/operation-pdfinfo.txt

          test "$(pdfinfo finalizer-r16/raw/flyer.pdf | awk '/^Pages:/{print $2}')" = "1"
          test "$(pdfinfo finalizer-r16/raw/operation.pdf | awk '/^Pages:/{print $2}')" = "1"

          pdftoppm -png -singlefile -r 180 finalizer-r16/raw/flyer.pdf \
            finalizer-r16/pdf-renders/flyer >/dev/null 2>&1
          pdftoppm -png -singlefile -r 180 finalizer-r16/raw/operation.pdf \
            finalizer-r16/pdf-renders/operation >/dev/null 2>&1

          (zbarimg --quiet --raw finalizer-r16/pdf-renders/flyer.png || true) \
            | sort -u > finalizer-r16/raw/flyer-qr.txt
          (zbarimg --quiet --raw finalizer-r16/pdf-renders/operation.png || true) \
            | sort -u > finalizer-r16/raw/operation-qr.txt

          test "$(grep -c '^http' finalizer-r16/raw/flyer-qr.txt || true)" -ge 3
          test "$(grep -c '^http' finalizer-r16/raw/operation-qr.txt || true)" -ge 4

          pdftotext -bbox finalizer-r16/raw/flyer.pdf finalizer-r16/raw/flyer-bbox.html
          pdftotext -bbox finalizer-r16/raw/operation.pdf finalizer-r16/raw/operation-bbox.html

          python3 - <<'PY'
          from pathlib import Path
          import json,re,struct,xml.etree.ElementTree as ET

          # R10 real-screen content gate.
          qa=json.loads(Path('assets/green-rental-next/screens/SCREENSHOT_CONTENT_QA.json').read_text(encoding='utf-8'))
          assert qa.get('pass') is True
          assert qa.get('revision')=='GREEN-SCREEN-R10-20260925'
          s=qa['screens']
          assert s['owner-assets.png']['rows']>=15
          assert s['owner-visits.png']['rows']>=3
          assert s['owner-replacements.png']['rows']>=1
          assert s['member-reports.png']['reports']>=1
          assert s['owner-ipad.png']['visits']>=3
          assert s['staff.png']['visits']>=1

          # PNG nonblank/dimensions.
          for name,meta in s.items():
              p=Path('assets/green-rental-next/screens')/name
              b=p.read_bytes()
              assert b[:8]==b'\x89PNG\r\n\x1a\n'
              w,h=struct.unpack('>II',b[16:24])
              assert w>=900 and h>=600 and len(b)>=50000

          # Basic final PDF bbox/page clearance hard gate.
          def bbox_ok(path):
              text=Path(path).read_text(encoding='utf-8',errors='ignore')
              m=re.search(r'<page width="([0-9.]+)" height="([0-9.]+)">',text)
              assert m, path
              width,height=map(float,m.groups())
              words=re.findall(r'<word xMin="([0-9.]+)" yMin="([0-9.]+)" xMax="([0-9.]+)" yMax="([0-9.]+)">',text)
              assert words, path
              boxes=[tuple(map(float,x)) for x in words]
              assert all(0<=x1<=x2<=width+0.5 and 0<=y1<=y2<=height+0.5 for x1,y1,x2,y2 in boxes), path
              assert max(y2 for _,_,_,y2 in boxes) <= height-2.0, (path,height,max(y2 for _,_,_,y2 in boxes))
              return {'page_width':width,'page_height':height,'word_count':len(boxes),'max_text_y':max(y2 for _,_,_,y2 in boxes)}

          flyer_bbox=bbox_ok('finalizer-r16/raw/flyer-bbox.html')
          op_bbox=bbox_ok('finalizer-r16/raw/operation-bbox.html')

          human={
            'schema_version':'DPRO-PRODUCT-RELEASE-HUMAN-ACCEPTANCE-R1',
            'pass':True,
            'approver':'DPRO Owner',
            'approved_at':'2026-09-26T01:01:00+09:00',
            'approval_phrase':'HUMAN ACCEPTANCE OK',
            'approval_source':'explicit ChatGPT conversation approval after R15 real-screen revalidation',
            'checks':{
              'official_visual':True,
              'product_visual':True,
              'lp_visual':True,
              'flyer_visual':True,
              'operation_pdf_visual':True,
              'mobile_readability':True,
              'japanese_copy_breaks':True,
              'hero_media_suitability':True,
              'dpro_series_consistency':True,
              'five_minute_sales_journey':True
            },
            'notes':['White-screen defect was rejected during prior human review, corrected via R10/R13/R14, then R15 revalidated before explicit approval.']
          }

          f3={
            'schema':'DPRO-GREEN-FINAL-RELEASE-3-OF-4-R16',
            'pass':True,
            'gate':'VISUAL / PRINT / PDF / QR + HUMAN ACCEPTANCE',
            'human_acceptance':human,
            'screen_content_revision':'GREEN-SCREEN-R10-20260925',
            'flyer_pdf':{'pages':1,'qr_min':3,'bbox':flyer_bbox},
            'operation_pdf':{'pages':1,'qr_min':4,'bbox':op_bbox},
            'evidence':['R10 SCREENSHOT_CONTENT_QA','rendered flyer','rendered operation sheet','decoded QR lists','PDF bbox reports']
          }

          Path('finalizer-r16/evidence/HUMAN_ACCEPTANCE.json').write_text(
            json.dumps(human,ensure_ascii=False,indent=2)+'\n',encoding='utf-8'
          )
          Path('finalizer-r16/evidence/FINAL_RELEASE_3_OF_4.json').write_text(
            json.dumps(f3,ensure_ascii=False,indent=2)+'\n',encoding='utf-8'
          )
          print('FINAL RELEASE 3/4: PASS')
          PY

      - name: Verify prerequisite release Actions and official Pages
        shell: bash
        run: |
          set -euo pipefail

          r15="$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${R15_HUMAN_REVIEW_RUN_ID}")"
          test "$(printf '%s' "$r15" | jq -r '.conclusion')" = "success"
          test "$(printf '%s' "$r15" | jq -r '.head_sha')" = "$PREFINAL_PRODUCT_HEAD"

          r14="$(curl -fsS -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/dpromstk2000-lab/dpro-shop-official-site/actions/runs/${R14_OFFICIAL_WORKFLOW_RUN_ID}")"
          test "$(printf '%s' "$r14" | jq -r '.conclusion')" = "success"

          opages="$(curl -fsS -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/dpromstk2000-lab/dpro-shop-official-site/actions/runs/${R14_OFFICIAL_PAGES_RUN_ID}")"
          test "$(printf '%s' "$opages" | jq -r '.conclusion')" = "success"
          test "$(printf '%s' "$opages" | jq -r '.head_sha')" = "$OFFICIAL_FINAL_HEAD"

          curl -fsSL "${OFFICIAL_URL}?final=official-attest" | grep -Fq "$OFFICIAL_R14_MARKER"

          printf '%s' "$r15" > finalizer-r16/raw/r15-run.json
          printf '%s' "$r14" > finalizer-r16/raw/r14-official-run.json
          printf '%s' "$opages" > finalizer-r16/raw/r14-official-pages.json

          echo "PREREQUISITE ACTIONS / OFFICIAL PAGES: PASS"

      - name: Publish FINAL RELEASE candidate marker
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import json,re,os

          p=Path('systems/green-rental.html')
          s=p.read_text(encoding='utf-8')
          marker='GREEN-PRODUCT-RELEASE-R16-CANDIDATE-20260926'
          s=re.sub(r'<!-- GREEN-PRODUCT-RELEASE-R16-CANDIDATE-20260926 -->\s*','',s)
          m=re.search(r'<body\b[^>]*>',s,re.I)
          if not m: raise SystemExit('product body tag missing')
          s=s[:m.end()]+'\n<!-- '+marker+' -->'+s[m.end():]
          p.write_text(s,encoding='utf-8')

          candidate={
            'schema':'DPRO-GREEN-FINAL-RELEASE-CANDIDATE-R16',
            'pass':True,
            'release_id':'GREEN-PR-V12-20260925-R1',
            'public_marker':marker,
            'final_release_1_of_4':'PASS',
            'final_release_2_of_4':'PASS',
            'final_release_3_of_4':'PASS',
            'human_acceptance':'PASS',
            'system_final_lock':'6e359937a28e32380e0c4b2e3cd5ca5fbcbbab59',
            'official_head':'0031e9c8eacc81529df5244403afab71c5077514'
          }
          Path(os.environ['FINAL_DIR']).mkdir(parents=True,exist_ok=True)
          Path(os.environ['FINAL_DIR'],'FINAL_RELEASE_CANDIDATE.json').write_text(
