name: DPRO MEDICAL PRODUCT SITE V1.2.1 HOTFIX

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/dpro-medical-product-site-v1.2.1-hotfix.yml"

permissions:
  contents: write

jobs:
  hotfix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply V1.2.1 hotfix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, json, re

          js = base64.b64decode("").decode("utf-8")
          Path("systems-data.js").write_text(js, encoding="utf-8")

          # Bust the PRODUCT SITE data cache.
          for filename in ("index.html", "systems.html"):
              p = Path(filename)
              text = p.read_text(encoding="utf-8")
              text = re.sub(
                  r'systems-data\.js\?v=[^"\']+',
                  'systems-data.js?v=20260818-medical-v121',
                  text
              )
              p.write_text(text, encoding="utf-8")

          # Fix the blank white CTA button on DPRO MEDICAL.
          medical = Path("systems/medical.html")
          text = medical.read_text(encoding="utf-8")
          old = '.btn{display:inline-flex;min-height:52px;align-items:center;justify-content:center;padding:0 18px;border-radius:13px;text-decoration:none;font-weight:950;border:1px solid var(--line);background:#fff;box-shadow:0 4px 16px rgba(25,58,82,.05)}'
          new = '.btn{display:inline-flex;min-height:52px;align-items:center;justify-content:center;padding:0 18px;border-radius:13px;text-decoration:none;font-weight:950;border:1px solid var(--line);background:#fff;color:var(--ink);box-shadow:0 4px 16px rgba(25,58,82,.05)}'
          if old not in text:
              raise SystemExit("QA FAILED: DPRO MEDICAL base button rule not found")
          text = text.replace(old, new, 1)
          text = text.replace(
              "DPRO MEDICAL / PRODUCT SITE V1.2 / PUBLIC DEMO SALES FINAL V1.1",
              "DPRO MEDICAL / PRODUCT SITE V1.2.1 / PUBLIC DEMO SALES FINAL V1.1"
          )
          medical.write_text(text, encoding="utf-8")

          # Append a small post-render SEO guard to the local PRODUCT JS.
          product = Path("product-v3.6.js")
          ptext = product.read_text(encoding="utf-8")
          marker = "DPRO PRODUCT 51 SEO GUARD V1.2.1"
          if marker not in ptext:
              ptext += r"""

/* DPRO PRODUCT 51 SEO GUARD V1.2.1 */
(() => {
  "use strict";
  const patch = () => {
    document.querySelectorAll('script[type="application/ld+json"]').forEach(script => {
      try {
        const data = JSON.parse(script.textContent || "");
        const visit = node => {
          if (!node || typeof node !== "object") return;
          if (typeof node.name === "string") {
            node.name = node.name
              .replaceAll("DPRO LINE SYSTEMS 50製品", "DPRO LINE SYSTEMS 51製品")
              .replaceAll("50システム", "51システム");
          }
          if (node.numberOfItems === 50) node.numberOfItems = 51;
          Object.values(node).forEach(value => {
            if (Array.isArray(value)) value.forEach(visit);
            else if (value && typeof value === "object") visit(value);
          });
        };
        visit(data);
        script.textContent = JSON.stringify(data);
      } catch (_) {}
    });
  };
  patch();
  document.addEventListener("DOMContentLoaded", patch, {once:true});
  window.setTimeout(patch, 700);
})();
"""
              product.write_text(ptext, encoding="utf-8")

          # Bust PRODUCT JS cache as well.
          for filename in ("index.html", "systems.html"):
              p = Path(filename)
              text = p.read_text(encoding="utf-8")
              text = re.sub(
                  r'product-v3\.6\.js\?v=[^"\']+',
                  'product-v3.6.js?v=3.6.8-medical-v121',
                  text
              )
              p.write_text(text, encoding="utf-8")

          # Static QA.
          assert "window.__DPRO_MEDICAL_51_BOOT__" in Path("systems-data.js").read_text(encoding="utf-8")
          assert 'systems-data.js?v=20260818-medical-v121' in Path("index.html").read_text(encoding="utf-8")
          assert 'systems-data.js?v=20260818-medical-v121' in Path("systems.html").read_text(encoding="utf-8")
          assert "color:var(--ink)" in medical.read_text(encoding="utf-8")
          assert "PRODUCT SITE V1.2.1" in medical.read_text(encoding="utf-8")
          assert marker in product.read_text(encoding="utf-8")
          print("QA PASS: PRODUCT SITE V1.2.1 HOTFIX")
          PY

      - name: Commit hotfix
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add systems-data.js index.html systems.html systems/medical.html product-v3.6.js
          git commit -m "DPRO MEDICAL PRODUCT SITE V1.2.1 hotfix"
          git push
