name: CENTRAL batch register products 53-54
on:
  push:
    paths:
      - .github/workflows/central-batch-53-54.yml
permissions:
  contents: write
jobs:
  register:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Register canonical products 53 and 54
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess, json

          DATA=Path('systems-data.js')
          data=DATA.read_text(encoding='utf-8')
          assert 'CANONICAL 52 PRODUCT DATA' in data
          assert '"code": "LANDSCAPE_EXTERIOR"' not in data
          assert '"code": "DPRO_PEST_ENV"' not in data

          entries = r'''  ,{
            "code": "LANDSCAPE_EXTERIOR",
            "assetSlug": "landscape-exterior",
            "name": "造園・外構",
            "category": "home_building",
            "systemPage": "systems/landscape-exterior.html",
            "lpUrl": "https://dpromstk2000-lab.github.io/dpro-landscape-exterior-standard/lp.html",
            "flyerHtml": "systems/landscape-exterior.html#documents",
            "flyerPdf": "https://dpromstk2000-lab.github.io/dpro-landscape-exterior-standard/DPRO_LANDSCAPE_EXTERIOR_A4_FLYER_V1.0_20260902.pdf",
            "demoUrl": "https://dpromstk2000-lab.github.io/dpro-landscape-exterior-standard/",
            "status": "AVAILABLE",
            "verificationStatus": "VERIFIED",
            "tagline": "写真相談から現調・見積・施工・Before→After完了承認・季節アフターまでを、一つの現場カルテでつなぐ。",
            "summary": "造園・外構向けに、写真相談、現地調査、見積、施工予定、担当者、作業前後写真、進捗、完了承認、季節フォローまでを案件単位でまとめるDPROシステム。",
            "targets": ["造園会社","外構・エクステリア事業者","庭・植栽メンテナンス事業者"],
            "features": ["写真相談・現地調査","見積・案件管理","施工予定・担当者管理","Before→After写真","完了承認","季節フォロー・再依頼"],
            "previewAsset": "systems/landscape-exterior.html",
            "experienceScreens": []
          },
          {
            "code": "DPRO_PEST_ENV",
            "assetSlug": "pest-env",
            "name": "ペストコントロール／環境衛生サービス",
            "category": "education_life",
            "systemPage": "systems/pest-env.html",
            "lpUrl": "https://dpromstk2000-lab.github.io/dpro-pest-env-line/lp.html",
            "flyerHtml": "systems/pest-env.html#documents",
            "flyerPdf": "https://dpromstk2000-lab.github.io/dpro-pest-env-line/DPRO_PEST_ENV_A4_FLYER_FINAL_V1.1_G8.pdf",
            "demoUrl": "https://dpromstk2000-lab.github.io/dpro-pest-env-line/demo-prepare.html?demo=1",
            "status": "AVAILABLE",
            "verificationStatus": "VERIFIED",
            "tagline": "最初の相談写真から、調査・施工・報告・次回点検までをEvidence Chainで一つにつなぐ。",
            "summary": "害虫・害獣の単発相談から飲食店・施設・管理物件の定期防除まで、受付、写真、現地調査、施工、安全確認、報告、再訪・次回点検を一つの現場カルテで管理するDPROシステム。",
            "targets": ["ペストコントロール事業者","害虫・害獣駆除事業者","環境衛生・定期防除事業者"],
            "features": ["WEB・LINE相談受付","写真・PDF Evidence","現地調査・施工記録","Field Map・Trap PIN","薬剤・安全確認","報告・再訪・定期点検"],
            "previewAsset": "systems/pest-env.html",
            "experienceScreens": []
          }
          '''
          pos=data.rfind('\n]);')
          assert pos>0
          data=data[:pos]+entries+data[pos:]
          data=data.replace('CANONICAL 52 PRODUCT DATA','CANONICAL 54 PRODUCT DATA')
          data=data.replace('CANONICAL SOURCE: 52 products','CANONICAL SOURCE: 54 products')
          data=data.replace('All 52 product records are statically defined','All 54 product records are statically defined')
          data=data.replace(' * DPRO 訪問マッサージ・鍼灸 is product #52.\n', ' * DPRO 訪問マッサージ・鍼灸 is product #52.\n * DPRO 造園・外構 is product #53.\n * DPRO ペストコントロール／環境衛生サービス is product #54.\n')
          DATA.write_text(data,encoding='utf-8')

          def normalize_file(p):
            s=p.read_text(encoding='utf-8')
            s=s.replace('52の業種','54の業種').replace('52製品','54製品').replace('52システム','54システム')
            s=s.replace('52件を表示中','54件を表示中')
            s=s.replace('52 OFFICIAL GUIDES','54 OFFICIAL GUIDES')
            s=s.replace('"numberOfItems":52','"numberOfItems":54')
            s=re.sub(r'((?:data-p36-count|data-p36-visible)[^>]*>)52(<)',r'\g<1>54\2',s)
            return s
          for p in Path('.').rglob('*.html'):
            if '.github' not in p.parts:
              p.write_text(normalize_file(p),encoding='utf-8')

          rt=Path('product-v3.6.js')
          s=rt.read_text(encoding='utf-8')
          s=s.replace('CANONICAL 52 RUNTIME','CANONICAL 54 RUNTIME')
          s=s.replace('CANONICAL SOURCE: 52 products','CANONICAL SOURCE: 54 products')
          s=s.replace("const count = DATA().systems.length || 52;","const count = DATA().systems.length || 54;")
          s=s.replace("name:'DPRO LINE SYSTEMS 52製品'","name:'DPRO LINE SYSTEMS 54製品'")
          if "LANDSCAPE_EXTERIOR:'landscape-exterior'" not in s:
            assert "VISIT_AHAKI:'visit-ahaki'" in s
            s=s.replace("VISIT_AHAKI:'visit-ahaki'","VISIT_AHAKI:'visit-ahaki', LANDSCAPE_EXTERIOR:'landscape-exterior', DPRO_PEST_ENV:'pest-env'")
          rt.write_text(s,encoding='utf-8')

          def product_page(no,slug,name,eyebrow,lead,demo,official,lp,guide,quick,manual,flyer,features):
            cards=''.join(f'<li>{x}</li>' for x in features)
            return f'''<!DOCTYPE html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="description" content="DPRO {name}。{lead}"><meta name="robots" content="index,follow,max-image-preview:large"><link rel="canonical" href="https://dpromstk2000-lab.github.io/dpro-line-systems-site/systems/{slug}.html"><title>DPRO {name}｜DPRO LINE SYSTEMS</title><link rel="stylesheet" href="../dpro-v3.css?v=3.5"><link rel="stylesheet" href="../product-v3.6.css?v=3.6"></head><body class="product-v36"><header class="p36-header"><div class="p36-header__inner"><a class="p36-brand" href="../index.html"><span class="p36-brand__mark">D</span><span><strong>DPRO LINE SYSTEMS</strong><small>PRODUCT SITE</small></span></a><nav class="p36-nav"><a href="../systems.html">システム一覧</a><a class="p36-nav__official" href="{official}" target="_blank" rel="noopener">DPRO SHOP ↗</a></nav></div></header><main><section class="p36-section"><div class="p36-shell"><p class="p36-eyebrow">PRODUCT {no} / {eyebrow}</p><h1>DPRO {name}</h1><p class="p36-lead">{lead}</p><div class="p36-actions"><a class="p36-btn p36-btn--demo" href="{demo}" target="_blank" rel="noopener">LIVE DEMOを触る ↗</a><a class="p36-btn p36-btn--official" href="{official}" target="_blank" rel="noopener">公式説明を見る ↗</a></div></div></section><section class="p36-section p36-section--soft"><div class="p36-shell"><header class="p36-section__head"><p class="p36-eyebrow">CORE VALUE</p><h2>この業種の流れを、一つにつなぐ。</h2></header><ul>{cards}</ul></div></section><section class="p36-section" id="documents"><div class="p36-shell"><header class="p36-section__head"><p class="p36-eyebrow">GUIDE & DOCUMENTS</p><h2>導入前に、実物と資料を確認。</h2></header><div class="p36-actions"><a class="p36-btn p36-btn--product" href="{guide}" target="_blank" rel="noopener">Guide ↗</a><a class="p36-btn p36-btn--product" href="{quick}" target="_blank" rel="noopener">Quick Start PDF ↗</a><a class="p36-btn p36-btn--product" href="{manual}" target="_blank" rel="noopener">Detailed Manual PDF ↗</a><a class="p36-btn p36-btn--product" href="{flyer}" target="_blank" rel="noopener">A4チラシ ↗</a><a class="p36-btn p36-btn--official" href="{lp}" target="_blank" rel="noopener">詳しいLP ↗</a></div></div></section></main><footer class="p36-footer"><div class="p36-shell"><p>DPRO LINE SYSTEMS / PRODUCT {no}</p></div></footer></body></html>'''

          Path('systems/landscape-exterior.html').write_text(product_page(53,'landscape-exterior','造園・外構','LANDSCAPE / EXTERIOR','写真相談・現調・見積・施工・Before→After完了承認・季節アフターまでを、一つの現場カルテでつなぎます。','https://dpromstk2000-lab.github.io/dpro-landscape-exterior-standard/','https://dpro-shop.com/systems/landscape-exterior','https://dpromstk2000-lab.github.io/dpro-landscape-exterior-standard/lp.html','https://dpromstk2000-lab.github.io/dpro-landscape-exterior-standard/guide-center.html','https://dpromstk2000-lab.github.io/dpro-landscape-exterior-standard/DPRO_LANDSCAPE_EXTERIOR_QUICK_START_V1.0_20260902.pdf','https://dpromstk2000-lab.github.io/dpro-landscape-exterior-standard/DPRO_LANDSCAPE_EXTERIOR_DETAILED_MANUAL_V1.0_20260902.pdf','https://dpromstk2000-lab.github.io/dpro-landscape-exterior-standard/DPRO_LANDSCAPE_EXTERIOR_A4_FLYER_V1.0_20260902.pdf',['写真相談・現地調査','見積・案件管理','施工予定・担当者管理','Before→After写真・完了承認','季節フォロー・再依頼']),encoding='utf-8')
          Path('systems/pest-env.html').write_text(product_page(54,'pest-env','ペストコントロール／環境衛生サービス','PEST CONTROL / ENVIRONMENT','害虫・害獣の単発相談から定期防除まで、相談写真・調査・施工・安全確認・報告・次回点検をEvidence Chainでつなぎます。','https://dpromstk2000-lab.github.io/dpro-pest-env-line/demo-prepare.html?demo=1','https://dpro-shop.com/systems/pest-env','https://dpromstk2000-lab.github.io/dpro-pest-env-line/lp.html','https://dpromstk2000-lab.github.io/dpro-pest-env-line/guide-center.html','https://dpromstk2000-lab.github.io/dpro-pest-env-line/DPRO_PEST_ENV_QUICK_START_FINAL_V1.1_G8.pdf','https://dpromstk2000-lab.github.io/dpro-pest-env-line/DPRO_PEST_ENV_DETAILED_MANUAL_FINAL_V1.1_G8.pdf','https://dpromstk2000-lab.github.io/dpro-pest-env-line/DPRO_PEST_ENV_A4_FLYER_FINAL_V1.1_G8.pdf',['WEB・LINE相談受付','写真・PDF Evidence','現地調査・施工・薬剤記録','Field Map・Trap PIN','報告・再訪・定期点検']),encoding='utf-8')

          sm=Path('sitemap.xml'); sx=sm.read_text(encoding='utf-8')
          assert 'systems/landscape-exterior.html' not in sx and 'systems/pest-env.html' not in sx
          add='  <url><loc>https://dpromstk2000-lab.github.io/dpro-line-systems-site/systems/landscape-exterior.html</loc><lastmod>2026-09-03</lastmod></url>\n  <url><loc>https://dpromstk2000-lab.github.io/dpro-line-systems-site/systems/pest-env.html</loc><lastmod>2026-09-03</lastmod></url>\n'
          sx=sx.replace('</urlset>',add+'</urlset>'); sm.write_text(sx,encoding='utf-8')

          node=r'''const fs=require('fs'),vm=require('vm');const c={console};c.window=c;vm.createContext(c);vm.runInContext(fs.readFileSync('systems-data.js','utf8'),c);const d=c.DPROSystemsData;process.stdout.write(JSON.stringify({count:d.systems.length,codes:d.systems.map(x=>x.code),a:d.getByCode('LANDSCAPE_EXTERIOR'),b:d.getByCode('DPRO_PEST_ENV')}));'''
          out=json.loads(subprocess.check_output(['node','-e',node],text=True))
          assert out['count']==54 and len(set(out['codes']))==54
          assert out['codes'][-2:]==['LANDSCAPE_EXTERIOR','DPRO_PEST_ENV']
          assert out['a']['systemPage']=='systems/landscape-exterior.html'
          assert out['b']['systemPage']=='systems/pest-env.html'
          for fn in ['index.html','systems.html']:
            t=Path(fn).read_text(encoding='utf-8')
            assert '52製品' not in t and '52システム' not in t and '52の業種' not in t
            assert '54' in t
          assert '"numberOfItems":54' in Path('systems.html').read_text(encoding='utf-8')
          assert Path('sitemap.xml').read_text().count('landscape-exterior.html')==1
          assert Path('sitemap.xml').read_text().count('pest-env.html')==1
          subprocess.check_call(['node','--check','systems-data.js'])
          subprocess.check_call(['node','--check','product-v3.6.js'])
          print('CENTRAL_PRODUCT_BATCH_53_54_QA=PASS count=54 unique=54 #53=LANDSCAPE_EXTERIOR #54=DPRO_PEST_ENV')
          PY
      - name: Commit canonical 54 product catalog
        shell: bash
        run: |
          rm -f .github/workflows/central-batch-53-54.yml
          git config user.name "DPRO SYSTEM FACTORY"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "CENTRAL register products 53-54 and canonicalize catalog 54"
          git push
