name: DPRO CHAT B Product Medical Copy Fix

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dpro-chat-b-${{ github.repository }}
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Repository guard
        shell: bash
        run: |
          if [ "$GITHUB_REPOSITORY" != "dpromstk2000-lab/dpro-line-systems-site" ]; then
            echo "Wrong repository: expected dpromstk2000-lab/dpro-line-systems-site, got $GITHUB_REPOSITORY" >&2
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch DPRO MEDICAL customer-facing copy
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('systems/medical.html'); s=p.read_text(encoding='utf-8'); before=s
          replacements=[
            ('DPRO MEDICAL / PRODUCT SITE V1.2.1','DPRO MEDICAL / 製品紹介'),
            ('ONE CORE · ONE CONTRACT · MULTI PRESET','患者・受付・医院運用をひとつにつなぐ'),
            ('PUBLIC DEMO SALES FINAL V1.1','公開デモ'),
            ('6診療PRESET','6つの診療パターン'),
            ('ONE CORE','共通基盤'),
            ('ONE CONTRACT','一貫した運用'),
            ('MULTI PRESET','複数の診療パターン'),
            ('医療CORE','情報基盤'),
            ('PRESET変更','診療パターン変更'),
            ('PRESET','診療パターン'),
          ]
          for old,new in replacements: s=s.replace(old,new)
          for token in ['DPRO MEDICAL / PRODUCT SITE V1.2.1','PUBLIC DEMO SALES FINAL V1.1','ONE CORE','ONE CONTRACT','MULTI PRESET','PRESET']:
              if token in s: raise SystemExit(f'systems/medical.html: forbidden public token remains: {token}')
          for hook in ['data-tutorial-r6="MEDICAL-R6-V1.0-20260830"','medical-public-demo.html','DPRO_TUTORIAL_MEDICAL_QUICK_START_V1.0.pdf','DPRO_TUTORIAL_MEDICAL_DETAILED_MANUAL_V1.0.pdf']:
              if hook not in s: raise SystemExit(f'systems/medical.html: runtime/resource hook lost: {hook}')
          if s!=before: p.write_text(s,encoding='utf-8')

          d=Path('systems-data.js'); t=d.read_text(encoding='utf-8'); tb=t
          replacements=[
            ('予約・WEB問診・来院受付・院内進行・医院管理・医院HPまでを、一つの医療COREにつなぐ。','予約・WEB問診・来院受付・院内進行・医院管理・医院HPまでを、ひとつの情報基盤につなぐ。'),
            ('医療機関向けに、患者スマホ、予約、WEB問診、受付、待ち状況、院内進行、医院管理PC、受付iPad、スタッフ画面、医院HPをONE CORE / ONE CONTRACTでまとめるDPROシステム。','医療機関向けに、患者スマホ、予約、WEB問診、受付、待ち状況、院内進行、医院管理PC、受付iPad、スタッフ画面、医院HPをひとつの流れでまとめるDPROシステム。'),
            ('医院HP・6診療PRESET','医院HP・6つの診療パターン'),
          ]
          for old,new in replacements:
              if old in t: t=t.replace(old,new)
              elif new not in t: raise SystemExit(f'systems-data.js: expected MEDICAL catalog marker missing: {old}')
          if t!=tb: d.write_text(t,encoding='utf-8')
          print('MEDICAL product copy patch: PASS')
          PY

      - name: Static safety QA
        shell: bash
        run: |
          ! grep -q 'PRODUCT SITE V1.2.1' systems/medical.html
          ! grep -q 'PUBLIC DEMO SALES FINAL' systems/medical.html
          ! grep -q 'ONE CORE' systems/medical.html
          ! grep -q 'MULTI PRESET' systems/medical.html
          grep -q '患者・受付・医院運用をひとつにつなぐ' systems/medical.html
          grep -q 'ひとつの情報基盤につなぐ' systems-data.js
          echo 'PRODUCT MEDICAL CHAT B static QA: PASS'

      - name: Commit forward-only fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm --ignore-unmatch ".github/workflows/dpro-chat-b-product-medical-copy.yml"
          git add "systems/medical.html" "systems-data.js"
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Fix CHAT B DPRO MEDICAL customer-facing release terminology"
          git push
