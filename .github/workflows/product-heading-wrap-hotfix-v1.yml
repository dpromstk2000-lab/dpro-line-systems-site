name: PRODUCT one-heading wrap hotfix V1.3

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/product-heading-wrap-hotfix-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: product-one-heading-wrap-hotfix-v13
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout PRODUCT
        uses: actions/checkout@v4
        with:
          fetch-depth: 3

      - name: Apply desktop-safe three-line heading fix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          product = Path('product-v3.6.js')
          index = Path('index.html')

          old_h2 = (
              '.p36-vet-hp h2{margin:0;font-size:clamp(32px,4.6vw,58px);'
              'line-height:1.15;letter-spacing:-.055em}'
          )
          new_h2 = (
              '.p36-vet-hp h2{margin:0;font-size:clamp(32px,3.4vw,48px);'
              'line-height:1.15;letter-spacing:-.055em}'
          )

          old_css = (
              r'/* DPRO PRODUCT VET HP TITLE WRAP FIX V1.2 */\n'
              '@media(max-width:980px){'
              '.p36-vet-hp h2 .p36-vet-hp__title-line,'
              '.p36-vet-hp h2 em > span{'
              'display:block!important;'
              'white-space:nowrap!important;'
              'word-break:keep-all!important;'
              'overflow-wrap:normal!important;'
              'text-wrap:nowrap!important'
              '}'
              '}'
          )
          new_css = (
              r'/* DPRO PRODUCT VET HP TITLE WRAP FIX V1.3 */\n'
              '.p36-vet-hp h2 .p36-vet-hp__title-line,'
              '.p36-vet-hp h2 em > span{'
              'display:block!important;'
              'white-space:nowrap!important;'
              'word-break:keep-all!important;'
              'overflow-wrap:normal!important;'
              'text-wrap:nowrap!important'
              '}'
          )

          title = (
              '<h2 class="p36-vet-hp__title-locked" data-dpro-jp-wrap-v1="1">'
              '<span class="p36-vet-hp__title-line">ホームページから、</span>'
              '<em><span>受付システムまで</span><span>一続きで体験。</span></em></h2>'
          )

          old_ref = '<script src="product-v3.6.js?v=3.6.5-vet-title-lock"></script>'
          new_ref = '<script src="product-v3.6.js?v=3.6.6-vet-title-fit"></script>'

          psrc = product.read_text(encoding='utf-8')
          isrc = index.read_text(encoding='utf-8')

          marker = '/* DPRO PRODUCT VET HP TITLE WRAP FIX V1.3 */'
          already = (
              marker in psrc and
              new_h2 in psrc and
              new_css in psrc and
              title in psrc and
              new_ref in isrc
          )

          if already:
              print('V1.3 already applied')
          else:
              checks = {
                  'old_h2': psrc.count(old_h2),
                  'old_css': psrc.count(old_css),
                  'title': psrc.count(title),
                  'old_ref': isrc.count(old_ref),
              }
              expected = {
                  'old_h2': 1,
                  'old_css': 1,
                  'title': 1,
                  'old_ref': 1,
              }
              if checks != expected:
                  raise SystemExit(f'Current PRODUCT baseline differs: {checks}')

              psrc = psrc.replace(old_h2, new_h2, 1)
              psrc = psrc.replace(old_css, new_css, 1)
              isrc = isrc.replace(old_ref, new_ref, 1)

              product.write_text(psrc, encoding='utf-8')
              index.write_text(isrc, encoding='utf-8')

          final_product = product.read_text(encoding='utf-8')
          final_index = index.read_text(encoding='utf-8')

          must = [
              marker,
              new_h2,
              new_css,
              title,
          ]
          for item in must:
              if final_product.count(item) != 1:
                  raise SystemExit('Final V1.3 structure invalid')

          if final_index.count(new_ref) != 1:
              raise SystemExit('Final cache-bust reference invalid')

          print('HEADING_LINES=ホームページから、 / 受付システムまで / 一続きで体験。')
          print('NOWRAP_SCOPE=ALL_WIDTHS')
          print('DESKTOP_MAX_FONT=48px')
          PY

      - name: Static safety QA
        shell: bash
        run: |
          set -euo pipefail
          node --check product-v3.6.js
          git diff --check

          changed="$(git diff --name-only)"
          bad="$(printf '%s\n' "$changed" | grep -Ev '^(product-v3\.6\.js|index\.html)$' || true)"
          if [ -n "$bad" ]; then
            echo "Unexpected changed files:"
            printf '%s\n' "$bad"
            exit 1
          fi

          grep -Fq 'DPRO PRODUCT VET HP TITLE WRAP FIX V1.3' product-v3.6.js
          grep -Fq 'font-size:clamp(32px,3.4vw,48px)' product-v3.6.js
          grep -Fq '<span class="p36-vet-hp__title-line">ホームページから、</span>' product-v3.6.js
          grep -Fq '<em><span>受付システムまで</span><span>一続きで体験。</span></em>' product-v3.6.js
          grep -Fq 'product-v3.6.js?v=3.6.6-vet-title-fit' index.html

          echo 'STATIC_QA=PASS'

      - name: Commit V1.3
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet -- product-v3.6.js index.html; then
            echo 'V1.3 already applied; commit skipped.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add product-v3.6.js index.html
          git commit -m 'Fix PRODUCT VET HP heading fit at desktop widths'
          git push origin HEAD:main

      - name: Wait for public Pages
        shell: bash
        run: |
          set -euo pipefail

          JS_URL="https://dpromstk2000-lab.github.io/dpro-line-systems-site/product-v3.6.js?run=$GITHUB_RUN_ID"
          INDEX_URL="https://dpromstk2000-lab.github.io/dpro-line-systems-site/?run=$GITHUB_RUN_ID"

          ready=0
          for i in $(seq 1 72); do
            js="$(curl -fsSL "$JS_URL" 2>/dev/null || true)"
            html="$(curl -fsSL "$INDEX_URL" 2>/dev/null || true)"

            if [[ "$js" == *'DPRO PRODUCT VET HP TITLE WRAP FIX V1.3'* && \
                  "$js" == *'font-size:clamp(32px,3.4vw,48px)'* && \
                  "$html" == *'product-v3.6.js?v=3.6.6-vet-title-fit'* ]]; then
              ready=1
              break
            fi
            sleep 5
          done

          if [ "$ready" != '1' ]; then
            echo 'Pages propagation timed out.'
            exit 1
          fi

          echo 'PUBLIC_QA=PASS'
          echo 'FINAL=ホームページから、 / 受付システムまで / 一続きで体験。'
