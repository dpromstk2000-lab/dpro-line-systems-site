name: TAX R6 Corrected PDF Revalidation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tax-r6-product-site-live-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  R6_CONTENT_COMMIT: 6f5cd452712bfd57965601105b3a345281cd6eb8
  PRODUCT_URL: https://dpromstk2000-lab.github.io/dpro-line-systems-site/systems/tax-accounting.html
  TUTORIAL_URL: https://dpromstk2000-lab.github.io/dpro-tax-accounting-line-liff/index.html
  GUIDE_URL: https://dpromstk2000-lab.github.io/dpro-tax-accounting-line-liff/guide-center.html
  QUICK_PDF_URL: https://dpromstk2000-lab.github.io/dpro-tax-accounting-line-liff/DPRO_TUTORIAL_TAX_QUICK_START_V1.0.pdf
  DETAIL_PDF_URL: https://dpromstk2000-lab.github.io/dpro-tax-accounting-line-liff/DPRO_TUTORIAL_TAX_DETAILED_MANUAL_V1.0.pdf
  QUICK_PDF_SHA256: 39f61e289e839a15b4cb4804f0fef4a798b23c51dc5066fa55ecc58d01c7f07a
  DETAIL_PDF_SHA256: eacfd38f42c4c1f9e37e447f8b782e791d8282b635ae077f8c14a680a6fb4797

jobs:
  corrected-r6-revalidation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Re-lock current Product Site source read-only
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git merge --ff-only origin/main
          git merge-base --is-ancestor "$R6_CONTENT_COMMIT" HEAD
          cmp -s systems/tax-accounting.html systems/tax-accounting.html.txt
          HTML_BLOB="$(git rev-parse HEAD:systems/tax-accounting.html)"
          TEXT_BLOB="$(git rev-parse HEAD:systems/tax-accounting.html.txt)"
          test "$HTML_BLOB" = "$TEXT_BLOB"
          python - <<'PY'
          from pathlib import Path
          s=Path('systems/tax-accounting.html').read_text(encoding='utf-8')
          for key in ['tutorial-start','guide-center','quick-start-pdf','detailed-manual-pdf']:
              assert f'data-tutorial-resource="{key}"' in s, key
          for token in [
              '3つまとめて、月額5,500円（税込）。',
              'https://lin.ee/YxJGXV6D',
              '../lp-tax.html','../flyer-tax.html','../flyer-tax.pdf'
          ]:
              assert token in s, token
          PY
          mkdir -p qa
          {
            echo "PREVERIFY_HEAD=$(git rev-parse HEAD)"
            echo "PREVERIFY_TREE=$(git rev-parse HEAD^{tree})"
            echo "HTML_BLOB=$HTML_BLOB"
            echo "TEXT_BLOB=$TEXT_BLOB"
            echo "HTML_TEXT_BYTE_IDENTICAL=PASS"
            echo "R6_CONTENT_ANCESTOR=PASS"
            echo "FORWARD_ONLY=PASS"
            echo "PRODUCT_SITE_MUTATION=0"
            echo "BUSINESS_MUTATION=0"
          } | tee qa/R6_CORRECTED_SOURCE_LOCK.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright Chromium
        shell: bash
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Exact current public R6 corrected revalidation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa/screenshots
          cat > qa/r6-corrected.mjs <<'JS'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          import { chromium } from 'playwright';

          const env=process.env;
          const PRODUCT=env.PRODUCT_URL;
          const RESOURCES=[
            {key:'tutorial-start',url:env.TUTORIAL_URL},
            {key:'guide-center',url:env.GUIDE_URL},
            {key:'quick-start-pdf',url:env.QUICK_PDF_URL,sha:env.QUICK_PDF_SHA256},
            {key:'detailed-manual-pdf',url:env.DETAIL_PDF_URL,sha:env.DETAIL_PDF_SHA256}
          ];
          const VIEWPORTS=[
            {name:'1440x1000',width:1440,height:1000},
            {name:'1024x768',width:1024,height:768},
            {name:'390x844',width:390,height:844},
            {name:'320x720',width:320,height:720}
          ];
          const WRITE_METHODS=new Set(['POST','PUT','PATCH','DELETE']);
          const assert=(v,m)=>{if(!v)throw new Error(m)};
          const sha256=b=>crypto.createHash('sha256').update(b).digest('hex');
          const noCache=url=>url+(url.includes('?')?'&':'?')+'r6corrected='+Date.now();

          const result={
            system:'TAX',stage:'R6_CORRECTED_REVALIDATION',
            standard:'DPRO TUTORIAL STANDARD V1.1',
            product_url:PRODUCT,link_http:{},link_hashes:{},viewports:[],
            gates:{
              R6_CONTENT_ANCESTOR:'PASS',
              FORWARD_ONLY:'PASS',
              PRODUCT_SITE_MUTATION:0,
              HTML_TEXT_BYTE_IDENTICAL:'PASS',
              TUTORIAL_START_LINK:'PASS',
              GUIDE_CENTER_LINK:'PASS',
              QUICK_START_PDF_LINK:'PASS',
              DETAILED_MANUAL_PDF_LINK:'PASS',
              ALL_4_LINKS_PUBLIC_REACHABLE:'PASS',
              KEYBOARD_FOCUS_VISIBLE:'PASS',
              TUTORIAL_ATTRIBUTABLE_PAGEERROR:0,
              TUTORIAL_ATTRIBUTABLE_CONSOLE_ERROR:0,
              UNSAFE_WRITE_REQUEST:0,
              BUSINESS_MUTATION:0,
              PRODUCT_SITE_REGRESSION:0,
              PRODUCT_SITE_ROLLBACK:0,
              R7:'NOT_AUTHORIZED_NOT_EXECUTED'
            },
            verdict:'R6_HOLD'
          };

          for(const x of RESOURCES){
            const r=await fetch(noCache(x.url),{cache:'no-store'});
            result.link_http[x.key]=r.status;
            assert(r.ok,`${x.key}: HTTP ${r.status}`);
            if(x.sha){
              const h=sha256(Buffer.from(await r.arrayBuffer()));
              result.link_hashes[x.key]=h;
              assert(h===x.sha,`${x.key}: hash mismatch ${h}`);
            }
          }

          const browser=await chromium.launch({headless:true});
          try{
            for(const vp of VIEWPORTS){
              const context=await browser.newContext({viewport:{width:vp.width,height:vp.height},hasTouch:vp.width<=390});
              const page=await context.newPage();
              const pageErrors=[],consoleErrors=[],writes=[];
              page.on('pageerror',e=>pageErrors.push(String(e?.message||e)));
              page.on('console',m=>{if(m.type()==='error')consoleErrors.push(`${m.location()?.url||''} ${m.text()}`)});
              page.on('request',req=>{if(WRITE_METHODS.has(req.method().toUpperCase()))writes.push({method:req.method(),url:req.url()})});

              const resp=await page.goto(noCache(PRODUCT),{waitUntil:'domcontentloaded',timeout:45000});
              assert(resp?.ok(),`${vp.name}: product HTTP ${resp?.status()}`);
              await page.locator('#tutorial-guide').waitFor({state:'visible',timeout:15000});

              assert((await page.locator('text=3つまとめて、月額5,500円（税込）。').count())>=1,`${vp.name}: price regression`);
              assert((await page.locator('a[href="https://lin.ee/YxJGXV6D"]').count())>=1,`${vp.name}: LINE CTA regression`);
              assert((await page.locator('a[href="../lp-tax.html"]').count())===1,`${vp.name}: LP regression`);
              assert((await page.locator('a[href="../flyer-tax.html"]').count())===1,`${vp.name}: flyer HTML regression`);
              assert((await page.locator('a[href="../flyer-tax.pdf"]').count())===1,`${vp.name}: flyer PDF regression`);

              const seen=[];
              for(const x of RESOURCES){
                const loc=page.locator(`[data-tutorial-resource="${x.key}"]`);
                assert(await loc.count()===1,`${vp.name}: ${x.key} count`);
                assert(await loc.isVisible(),`${vp.name}: ${x.key} invisible`);
                assert(await loc.getAttribute('href')===x.url,`${vp.name}: ${x.key} href`);
                await loc.focus();
                const f=await loc.evaluate(el=>{const s=getComputedStyle(el);return {style:s.outlineStyle,width:s.outlineWidth,offset:s.outlineOffset}});
                assert(f.style!=='none'&&f.width!=='0px',`${vp.name}: ${x.key} focus invisible`);
                seen.push({key:x.key,focus:f});
              }

              const overflow=await page.evaluate(()=>({
                innerWidth:innerWidth,
                documentElementScrollWidth:document.documentElement.scrollWidth,
                bodyScrollWidth:document.body.scrollWidth,
                positiveOverflow:Math.max(0,document.documentElement.scrollWidth-innerWidth,document.body.scrollWidth-innerWidth)
              }));
              if(vp.width===390||vp.width===320)assert(overflow.positiveOverflow===0,`${vp.name}: overflow ${overflow.positiveOverflow}`);
              assert(pageErrors.length===0,`${vp.name}: pageerror ${JSON.stringify(pageErrors)}`);
              assert(consoleErrors.length===0,`${vp.name}: console ${JSON.stringify(consoleErrors)}`);
              assert(writes.length===0,`${vp.name}: unsafe write ${JSON.stringify(writes)}`);

              await page.screenshot({path:`qa/screenshots/r6-corrected-${vp.name}.png`,fullPage:true});
              result.viewports.push({viewport:vp.name,resources:seen,overflow,pageerror:0,console_error:0,unsafe_write_request:0,business_mutation:0,product_site_regression:0});
              result.gates[vp.name]='PASS';
              if(vp.width===390)result.gates['390_POSITIVE_HORIZONTAL_OVERFLOW']=overflow.positiveOverflow;
              if(vp.width===320)result.gates['320_POSITIVE_HORIZONTAL_OVERFLOW']=overflow.positiveOverflow;
              await context.close();
            }
            result.verdict='R6_CORRECTED_FULL_PASS';
          }finally{
            await browser.close();
            fs.writeFileSync('qa/R6_CORRECTED_LIVE_QA_EVIDENCE.json',JSON.stringify(result,null,2));
            console.log(JSON.stringify(result,null,2));
          }
          JS
          node qa/r6-corrected.mjs

      - name: Upload corrected R6 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TAX-R6-CORRECTED-LIVE-QA-EVIDENCE
          path: qa/
          if-no-files-found: warn
