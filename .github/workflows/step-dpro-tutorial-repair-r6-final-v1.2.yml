name: STEP DPRO TUTORIAL REPAIR R6 FINAL V1.2

on:
  push:
    paths:
      - '.github/workflows/step-dpro-tutorial-repair-r6-final-v1.2.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dpro-tutorial-repair-r6-final
  cancel-in-progress: true

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install browser QA
        run: |
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium

      - name: Verify source and prepare R5/R6
        shell: python
        run: |
          from pathlib import Path
          import hashlib, json, urllib.request, zipfile
          E=Path('evidence'); E.mkdir(exist_ok=True)
          # REPAIR tutorial source must remain the R4-clearance source.
          u='https://api.github.com/repos/dpromstk2000-lab/dpro-repair-line-liff/commits/main'
          req=urllib.request.Request(u,headers={'Accept':'application/vnd.github+json','User-Agent':'dpro-repair-r6-v12'})
          d=json.load(urllib.request.urlopen(req,timeout=30))
          assert d['sha']=='7e22301a0135abc2a1e7eda37db8ccbed645dd10', d['sha']
          assert d['commit']['tree']['sha']=='3b06b12b57e95043ee7fbf50bb91ec9603e590ee'
          page=Path('systems/repair.html'); mirror=Path('systems/repair.html.txt')
          assert page.read_bytes()==mirror.read_bytes()
          payload=Path('.github/workflows/step-dpro-tutorial-repair-r6-final-v1.0.payload.zip')
          assert payload.exists()
          with zipfile.ZipFile(payload) as z:
              qb=z.read('DPRO_TUTORIAL_REPAIR_QUICK_START_V1.0.pdf')
              db=z.read('DPRO_TUTORIAL_REPAIR_DETAILED_MANUAL_V1.0.pdf')
          qsha=hashlib.sha256(qb).hexdigest(); dsha=hashlib.sha256(db).hexdigest()
          assert qsha=='783977adfc7f83e649933ec8ce77d110e122a626da4692cf11cb89f808eb069a'
          assert dsha=='f71753886ca8c02bd8d124060954f84ea3363863d7b5ac13c1aec5fdec158b85'
          out=Path('assets/pdfs'); out.mkdir(parents=True,exist_ok=True)
          (out/'dpro-repair-tutorial-quick-start-v1.0.pdf').write_bytes(qb)
          (out/'dpro-repair-tutorial-detailed-manual-v1.0.pdf').write_bytes(db)
          text=page.read_text(encoding='utf-8')
          marker='data-dpro-tutorial-r6="repair-v1"'
          css='''.ps-tutorial-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1rem}.ps-tutorial-card{padding:1.15rem;border:1px solid var(--ps-line);border-radius:1rem;background:#fff;box-shadow:var(--dpro-shadow-sm)}.ps-tutorial-card span{display:inline-flex;padding:.2rem .55rem;border-radius:999px;background:var(--dpro-soft-green);color:var(--dpro-green);font-size:.7rem;font-weight:900}.ps-tutorial-card h3{margin:.65rem 0 .35rem;color:var(--ps-deep)}.ps-tutorial-card p{margin:0;color:var(--dpro-warm-gray-600)}.ps-tutorial-links{display:flex;flex-wrap:wrap;gap:.55rem;margin-top:.9rem}.ps-tutorial-links .dpro-button{width:auto}.ps-tutorial-note{margin-top:1rem;padding:1rem 1.1rem;border-left:4px solid var(--dpro-green);background:#fff;color:#395149}@media(max-width:980px){.ps-tutorial-grid{grid-template-columns:1fr}}@media(max-width:640px){.ps-tutorial-links{display:grid;grid-template-columns:1fr}.ps-tutorial-links .dpro-button{width:100%}}'''
          section='''<section aria-labelledby="tutorial-title" class="dpro-section ps-section-soft master-section" data-dpro-tutorial-r6="repair-v1" id="tutorial-support"><div class="dpro-container"><div class="ps-section-heading"><p class="ps-kicker">OWNER ONBOARDING / TUTORIAL</p><h2 id="tutorial-title">契約後すぐ始められる。<br/>最初の10分から、印刷まで。</h2><p>DPRO 修理受付 LINEは「最初の10分 → 操作ガイド → 印刷マニュアル」の順で確認できます。PC・スマートフォンで見直せ、PDFは店舗で印刷できます。</p></div><div class="ps-tutorial-grid"><article class="ps-tutorial-card"><span>01 / FIRST 10</span><h3>最初の10分で基本操作</h3><p>7章・14カード。実際の操作場所を強調し、説明カードはドラッグまたは「位置を変える」で移動できます。</p><div class="ps-tutorial-links"><a class="dpro-button dpro-button--primary" href="https://dpromstk2000-lab.github.io/dpro-repair-line-liff/demo-guide.html?tutorial=replay" target="_blank" rel="noopener">10分ガイドを開く</a></div></article><article class="ps-tutorial-card"><span>02 / GUIDE CENTER</span><h3>検索・カテゴリ・FAQで探す</h3><p>7カテゴリ・30記事・FAQ12から必要な操作を検索し、記事から実画面へ移動できます。</p><div class="ps-tutorial-links"><a class="dpro-button dpro-button--secondary" href="https://dpromstk2000-lab.github.io/dpro-repair-line-liff/demo-guide.html" target="_blank" rel="noopener">操作ガイドを開く</a></div></article><article class="ps-tutorial-card"><span>03 / PRINT MANUAL</span><h3>印刷して店舗に置ける</h3><p>Quick Startと詳細マニュアルをA4で用意。PCでも確認でき、必要なページを印刷して共有できます。</p><div class="ps-tutorial-links"><a class="dpro-button dpro-button--secondary" href="../assets/pdfs/dpro-repair-tutorial-quick-start-v1.0.pdf" target="_blank" rel="noopener">Quick PDF</a><a class="dpro-button dpro-button--secondary" href="../assets/pdfs/dpro-repair-tutorial-detailed-manual-v1.0.pdf" target="_blank" rel="noopener">詳細 PDF</a></div></article></div><p class="ps-tutorial-note"><strong>REPAIR実機確認済み改善：</strong>説明カードは対象と重なりにくい位置へ自動配置し、ドラッグと「位置を変える」に対応。DPRO TUTORIAL全カードへの標準展開候補としてCENTRALへ返却します。</p></div></section>'''
          if marker not in text:
              assert '</style>' in text
              text=text.replace('</style>',css+'</style>',1)
              anchor='<section aria-labelledby="faq-title"'
              assert anchor in text
              text=text.replace(anchor,section+anchor,1)
          page.write_text(text,encoding='utf-8'); mirror.write_text(text,encoding='utf-8')
          assert page.read_bytes()==mirror.read_bytes()
          assert marker in text and '5,500円' in text and 'LIVE DEMO' in text and 'LINE相談' in text
          (E/'precommit.json').write_text(json.dumps({'repair_source_commit':d['sha'],'repair_source_tree':d['commit']['tree']['sha'],'quick_sha256':qsha,'detail_sha256':dsha,'marker':True},ensure_ascii=False,indent=2),encoding='utf-8')

      - name: Commit Product Site integration safely
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add systems/repair.html systems/repair.html.txt assets/pdfs/dpro-repair-tutorial-quick-start-v1.0.pdf assets/pdfs/dpro-repair-tutorial-detailed-manual-v1.0.pdf
          git rm -f .github/workflows/step-dpro-tutorial-repair-r6-final-v1.0.yml .github/workflows/step-dpro-tutorial-repair-r6-final-v1.1.yml .github/workflows/step-dpro-tutorial-repair-r6-final-v1.2.yml .github/workflows/step-dpro-tutorial-repair-r6-final-v1.0.payload.zip
          git commit -m "Add REPAIR tutorial support to product site [run $GITHUB_RUN_ID]"
          for attempt in 1 2 3 4 5 6 7 8; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then break; fi
            git rebase --abort || true
            sleep 3
            test "$attempt" != "8"
          done
          git rev-parse HEAD > evidence/product_commit.txt
          git rev-parse HEAD^{tree} > evidence/product_tree.txt
          git hash-object systems/repair.html > evidence/product_page_blob.txt

      - name: Wait for GitHub Pages
        shell: python
        run: |
          import hashlib,json,time,urllib.request
          from pathlib import Path
          E=Path('evidence')
          product='https://dpromstk2000-lab.github.io/dpro-line-systems-site/systems/repair.html'
          quick='https://dpromstk2000-lab.github.io/dpro-line-systems-site/assets/pdfs/dpro-repair-tutorial-quick-start-v1.0.pdf'
          detail='https://dpromstk2000-lab.github.io/dpro-line-systems-site/assets/pdfs/dpro-repair-tutorial-detailed-manual-v1.0.pdf'
          qsha='783977adfc7f83e649933ec8ce77d110e122a626da4692cf11cb89f808eb069a'; dsha='f71753886ca8c02bd8d124060954f84ea3363863d7b5ac13c1aec5fdec158b85'
          for i in range(48):
              try:
                  h={'User-Agent':'dpro-repair-r6-v12','Cache-Control':'no-cache'}
                  body=urllib.request.urlopen(urllib.request.Request(product+'?v12='+str(i),headers=h),timeout=30).read().decode('utf-8')
                  qb=urllib.request.urlopen(urllib.request.Request(quick+'?v12='+str(i),headers=h),timeout=30).read()
                  db=urllib.request.urlopen(urllib.request.Request(detail+'?v12='+str(i),headers=h),timeout=30).read()
                  if 'data-dpro-tutorial-r6="repair-v1"' in body and hashlib.sha256(qb).hexdigest()==qsha and hashlib.sha256(db).hexdigest()==dsha:
                      (E/'pages.json').write_text(json.dumps({'product':200,'marker':True,'quick_sha256':qsha,'detail_sha256':dsha},indent=2),encoding='utf-8'); break
              except Exception:
                  pass
              time.sleep(10)
          else: raise SystemExit('Pages did not become current')

      - name: FINAL LIVE QA desktop and 390
        shell: python
        run: |
          from pathlib import Path
          import json,urllib.request
          from playwright.sync_api import sync_playwright
          E=Path('evidence')
          PRODUCT='https://dpromstk2000-lab.github.io/dpro-line-systems-site/systems/repair.html'
          GUIDE='https://dpromstk2000-lab.github.io/dpro-repair-line-liff/demo-guide.html'
          out={}
          with sync_playwright() as pw:
              b=pw.chromium.launch(headless=True)
              for label,vp in [('desktop',{'width':1440,'height':900}),('mobile390',{'width':390,'height':844})]:
                  p=b.new_page(viewport=vp); errs=[]; p.on('pageerror',lambda e:errs.append(str(e)))
                  r=p.goto(PRODUCT+'?qa='+label,wait_until='domcontentloaded',timeout=45000); assert r and r.ok
                  p.wait_for_selector('#tutorial-support',timeout=12000)
                  assert not p.evaluate('document.documentElement.scrollWidth > document.documentElement.clientWidth + 1')
                  t=p.locator('#tutorial-support').inner_text(); assert all(x in t for x in ['最初の10分','操作ガイド','印刷'])
                  assert all(x in p.locator('body').inner_text() for x in ['5,500円','LIVE DEMO','LINE相談'])
                  p.screenshot(path=str(E/f'product_{label}.png'),full_page=True); assert not errs; p.close()
                  p=b.new_page(viewport=vp); errs=[]; p.on('pageerror',lambda e:errs.append(str(e)))
                  r=p.goto(GUIDE+'?qa='+label,wait_until='domcontentloaded',timeout=45000); assert r and r.ok
                  p.wait_for_selector('#startBtn',timeout=12000); assert not p.evaluate('document.documentElement.scrollWidth > document.documentElement.clientWidth + 1')
                  p.locator('#guideCenterBtn').click(); p.locator('#guideSearch').fill('見積'); p.wait_for_timeout(220)
                  assert p.locator('#guideResults .result').count()>0 and '見積' in p.locator('#guideDetail').inner_text()
                  p.locator('#guideClose').click(); p.locator('#startBtn').click(); p.wait_for_timeout(800)
                  f=p.frame_locator('#featureFrame'); f.locator('#dproGuideCallout').wait_for(timeout=12000)
                  assert '1 / 14' in f.locator('.dgtop').inner_text(); assert f.locator('#dgMoveAway').count()==1
                  f.locator('#dgNext').click(); p.wait_for_timeout(650); assert '2 / 14' in f.locator('.dgtop').inner_text()
                  f.locator('#dgBack').click(); p.wait_for_timeout(600); assert '1 / 14' in f.locator('.dgtop').inner_text()
                  p.screenshot(path=str(E/f'tutorial_{label}.png'),full_page=True); assert not errs; p.close()
                  out[label]={'product':'PASS','tutorial':'PASS','overflow':False,'page_errors':[]}
              b.close()
          for u in ['https://dpromstk2000-lab.github.io/dpro-line-systems-site/assets/pdfs/dpro-repair-tutorial-quick-start-v1.0.pdf','https://dpromstk2000-lab.github.io/dpro-line-systems-site/assets/pdfs/dpro-repair-tutorial-detailed-manual-v1.0.pdf','https://dpromstk2000-lab.github.io/dpro-repair-line-liff/owner.html']:
              r=urllib.request.urlopen(urllib.request.Request(u,headers={'User-Agent':'dpro-repair-r6-v12'}),timeout=30); assert 200<=r.status<400
          (E/'r6_final_live_qa.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')

      - name: Build final summary
        shell: python
        run: |
          from pathlib import Path
          import json
          E=Path('evidence')
          s={'r4_clearance':'PASS','r5':'PASS','r6':'PASS','central_final_lock':'NOT_EXECUTED','repair_source_commit':'7e22301a0135abc2a1e7eda37db8ccbed645dd10','repair_source_tree':'3b06b12b57e95043ee7fbf50bb91ec9603e590ee','product_commit':(E/'product_commit.txt').read_text().strip(),'product_tree':(E/'product_tree.txt').read_text().strip(),'product_page_blob':(E/'product_page_blob.txt').read_text().strip(),'quick_sha256':'783977adfc7f83e649933ec8ce77d110e122a626da4692cf11cb89f808eb069a','detail_sha256':'f71753886ca8c02bd8d124060954f84ea3363863d7b5ac13c1aec5fdec158b85'}
          (E/'FINAL_SUMMARY.json').write_text(json.dumps(s,ensure_ascii=False,indent=2),encoding='utf-8')

      - uses: actions/upload-artifact@v4
        with:
          name: dpro-tutorial-repair-r6-final-evidence-v1-2
          path: evidence/
          retention-days: 30
          if-no-files-found: error
