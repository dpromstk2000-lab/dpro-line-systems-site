name: PRODUCT customer copy brushup V1.3

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/product-customer-copy-brushup-v1.yml'

permissions:
  contents: write

jobs:
  brushup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rewrite all 50 registered product pages
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          from collections import Counter

          DATA = Path("systems-data.js")
          PET = Path("systems/pet-care.html")

          data = DATA.read_text(encoding="utf-8")
          registered = list(dict.fromkeys(
              re.findall(r'"systemPage"\s*:\s*"([^"]+\.html)"', data)
          ))

          print("REGISTERED SYSTEM PAGES:", len(registered))
          if len(registered) != 50:
              raise SystemExit(f"Expected exactly 50 registered product pages, found {len(registered)}")

          paths = [Path(p) for p in registered]
          missing = [str(p) for p in paths if not p.exists()]
          if missing:
              raise SystemExit("Missing registered product pages:\n" + "\n".join(missing))

          def link_targets(html: str):
              """Protect real navigation/demo targets, not URLs hidden inside internal notes."""
              result = []
              for attr in ("href", "src", "data-src", "action", "formaction"):
                  result += re.findall(
                      rf'\b{attr}\s*=\s*["\']([^"\']+)["\']',
                      html, flags=re.I
                  )
              return Counter(result)

          def function_names(html: str):
              return Counter(re.findall(
                  r'data-function-name\s*=\s*["\']([^"\']+)["\']',
                  html, flags=re.I
              ))

          def price_strings(html: str):
              return Counter(re.findall(r'(?:\d{1,3}(?:,\d{3})+|\d+)円', html))

          def stash_nonvisible(html: str):
              saved = []
              pattern = re.compile(
                  r'<!--.*?-->|<script\b.*?</script>|<style\b.*?</style>',
                  flags=re.S | re.I
              )
              def repl(m):
                  token = f"___DPRO_STASH_{len(saved)}___"
                  saved.append(m.group(0))
                  return token
              return pattern.sub(repl, html), saved

          def restore_nonvisible(html: str, saved):
              for i, value in enumerate(saved):
                  html = html.replace(f"___DPRO_STASH_{i}___", value)
              return html

          def clean_text(value: str) -> str:
              # Whole-sentence rewrites first so the result sounds natural to customers.
              exact = {
                  "初期表示では実画面を読み込みません。操作を試す時だけSTART PACKAGEで確認済みの正式DEMOを起動します。":
                      "ボタンを押すと、実際のデモ画面を操作できます。",
                  "START PACKAGEとsystems-data.jsでVERIFIEDになっている正式DEMOだけを表示します。初期表示では読み込みません。":
                      "実際のデモ画面で、操作の流れをご確認いただけます。",
                  "START PACKAGEで固定された正式DEMOを必要時だけ読み込めます。":
                      "このページのLIVE DEMOから、実際の画面と操作感をご確認いただけます。",
                  "「LIVE画面を読み込む」を押した時だけ、確認済みの正式DEMOを表示します。初期iframeは0本です。":
                      "実際のデモ画面で、操作の流れをご確認いただけます。",
                  "「LIVE画面を読み込む」を押した時だけ、CENTRAL確認済みの正式DEMO URLを表示します。":
                      "実際のデモ画面で、操作の流れをご確認いただけます。",
                  "「LIVE画面を読み込む」を押した時だけ正式DEMOを表示するため、ページ初期表示を重くしません。":
                      "実際のデモ画面で、操作の流れをご確認いただけます。",
                  "「LIVE画面を読み込む」を押した時だけDEMOを表示します。ページ初期表示ではiframeを読み込みません。":
                      "実際のデモ画面で、操作の流れをご確認いただけます。",
                  "いいえ。初期表示のiframeは0本で、操作を試す時だけ読み込む構成です。":
                      "LIVE DEMOのボタンから、必要な時に実画面を開けます。",
                  "いいえ。初期iframeは0で、LIVE画面のボタンを押した時だけ読み込みます。":
                      "LIVE DEMOのボタンから、必要な時に実画面を開けます。",
                  "初期iframe 0 / click-to-load":
                      "ボタンから実画面を確認",
                  "製品ページはMOBILE FIRSTで構成し、390pxを基準に1列で読みやすく、主要タップ領域を確保しています。":
                      "はい。スマートフォンでも読みやすく、主要な操作をしやすい画面設計です。",
                  "FOUNDATIONで固定された6機能を、正式実装・LP・A4の事実範囲で掲載しています。":
                      "この業種で使う主な6機能を、実際の運用に沿って分かりやすくご紹介します。",
                  "下記6項目はDPRO V3 FOUNDATIONのVERIFIED固定マッピングと一致させています。":
                      "この業種で使う主な6機能を、実際の運用に沿って分かりやすくご紹介します。",
                  "DPRO V3 FOUNDATIONのVERIFIED固定マッピングと一致させています。":
                      "実際の運用に沿って、主な機能を分かりやすくご紹介します。",
                  "以下はCENTRAL LOCKEDの正式6機能です。推測の機能は追加していません。":
                      "この業種で使う主な6機能をご紹介します。",
                  "ここではsystems-data.jsのVERIFIED固定マッピングをそのまま使用しています。":
                      "",
                  "正式URLだけを使用。必要時だけ実画面を読み込みます。":
                      "ボタンを押すと、実際のデモ画面を操作できます。",
                  "正式確認済みの公開DEMOを、必要な時だけ読み込みます。":
                      "ボタンを押すと、実際の公開デモを操作できます。",
                  "はい。このページのLIVE PRODUCT EXPERIENCEから正式確認済みの公開DEMOを開けます。":
                      "はい。このページのLIVE DEMOから、実際の公開デモをご確認いただけます。",
                  "ページを開いた時にDEMO画面は自動読込されますか？":
                      "実際の画面はどこから確認できますか？",
                  "ページを開いた時にDEMOを大量読み込みしますか？":
                      "実際の画面はどこから確認できますか？",
                  "営業LPやA4資料も確認できますか？":
                      "詳しい資料も確認できますか？",
                  "はい。ページ下部の関連資料から営業LP、A4 HTML、A4 PDFへ移動できます。":
                      "はい。ページ下部から、詳しい紹介ページやA4チラシ、PDF資料をご確認いただけます。",
                  "ページ表示を重くしない、必要時ロード":
                      "ボタンから実画面を確認",
                  "AVAILABLE / VERIFIED":
                      "LIVE DEMO 公開中",
                  "OFFICIAL PRODUCT SITE":
                      "PRODUCT SITE",
                  "FINAL CTA":
                      "NEXT STEP",
              }
              for before, after in exact.items():
                  value = value.replace(before, after)

              # Natural phrasing for generated function descriptions.
              value = re.sub(
                  r"「([^」]+)」に関する情報を、必要な時に確認しやすい形でまとめます。",
                  r"\1を、必要な時にすぐ確認できるよう整理します。",
                  value
              )
              value = re.sub(
                  r"「([^」]+)」を業種専用の運用として扱い、予約・受付の確認先をまとめます。",
                  r"\1をDPROでまとめて確認し、予約・受付をスムーズに進められます。",
                  value
              )
              value = re.sub(
                  r"「([^」]+)」をDPROの業種専用システム内で扱い、確認先をまとめます。",
                  r"\1をDPROでまとめて確認し、必要な対応へつなげられます。",
                  value
              )
              value = re.sub(
                  r"「([^」]+)」を現場の確認項目として扱い、状況を追いやすくします。",
                  r"\1の状況を確認しやすくし、次の対応を判断しやすくします。",
                  value
              )

              # Public vocabulary cleanup. No \b word-boundaries: Japanese text can
              # sit immediately next to ASCII words and Python treats both as \w.
              replacements = [
                  ("CENTRAL LOCKED", ""),
                  ("CENTRAL確認済み", ""),
                  ("CENTRAL", ""),
                  ("START PACKAGE", "デモ"),
                  ("systems-data.jsのVERIFIED固定マッピング", "製品の機能構成"),
                  ("systems-data.js", "製品情報"),
                  ("DPRO V3 FOUNDATION", "DPRO"),
                  ("FOUNDATION", "DPRO"),
                  ("VERIFIED LIVE DEMO", "LIVE DEMO"),
                  ("VERIFIED LIVE", "LIVE DEMO"),
                  ("VERIFIED DEMO", "LIVE DEMO"),
                  ("VERIFIED", "公開中"),
                  ("正式確認済みの", "公開中の"),
                  ("確認済みの正式LIVE DEMO", "LIVE DEMO"),
                  ("確認済みの正式DEMO", "実際のデモ画面"),
                  ("正式LIVE DEMO", "LIVE DEMO"),
                  ("正式DEMO URL", "公開デモ"),
                  ("正式DEMO画面", "デモ画面"),
                  ("正式DEMO", "LIVE DEMO"),
                  ("正式URL", "公開デモ"),
                  ("正式実装", "現在の対応内容"),
                  ("正式ページ", "製品ページ"),
                  ("正式な6機能", "主な6機能"),
                  ("正式6機能", "主な6機能"),
                  ("正式機能", "主な機能"),
                  ("MOBILE FIRST", "スマートフォン対応"),
                  ("390px", "スマートフォン"),
                  ("初期iframe", "初期読み込み"),
                  ("iframe", "デモ画面"),
                  ("営業前system-check", "営業前の動作確認"),
                  ("system-check", "動作確認"),
                  ("demo_prepare", "デモ準備"),
                  ("production_guard", "本番保護"),
                  ("SYSTEM CODE", "製品名"),
                  ("営業LPを見る", "詳しい紹介を見る"),
                  ("営業LP", "詳しい紹介ページ"),
                  ("A4チラシHTML", "A4チラシ"),
                  ("A4 HTML", "A4チラシ"),
                  ("A4 PDF", "PDF資料"),
                  ("固定導線", "リンク"),
                  ("LIVE画面を読み込む", "実画面を開く"),
                  ("事実範囲", "掲載内容"),
                  ("推測の機能は追加していません。", ""),
              ]
              for before, after in replacements:
                  value = value.replace(before, after)

              # Repair phrases after token cleanup.
              repairs = [
                  ("初期表示のデモ画面は0本", "ページ表示時は実画面を読み込みません"),
                  ("初期デモ画面は0本", "ページ表示時は実画面を読み込みません"),
                  ("初期デモ画面は0", "ページ表示時は実画面を読み込みません"),
                  ("初期読み込み 0 / click-to-load", "ボタンから実画面を確認"),
                  ("ページ初期表示ではデモ画面を読み込みません", "ページ表示時は実画面を読み込まず、必要な時に開けます"),
                  ("デモ画面を読み込みません。", "実画面は必要な時に開けます。"),
                  ("DPROで固定された6機能", "この業種で使う主な6機能"),
                  ("DPROで固定された", "DPROで整理した"),
                  ("公開中 LIVE DEMO", "LIVE DEMO"),
                  ("LIVE LIVE DEMO", "LIVE DEMO"),
                  ("LIVE DEMO DEMO", "LIVE DEMO"),
              ]
              for before, after in repairs:
                  value = value.replace(before, after)

              value = re.sub(r"\s+([。、！？])", r"\1", value)
              value = re.sub(r"。{2,}", "。", value)
              value = re.sub(r"[ \t]{2,}", " ", value)
              return value.strip()

          def clean_text_attributes(html: str) -> str:
              # Search-result / accessibility text only. URL attributes are never touched.
              meta_keys = {
                  "description", "og:title", "og:description",
                  "twitter:title", "twitter:description"
              }

              def meta_repl(m):
                  tag = m.group(0)
                  key = re.search(
                      r'(?:name|property)\s*=\s*["\']([^"\']+)["\']',
                      tag, flags=re.I
                  )
                  if not key or key.group(1).lower() not in meta_keys:
                      return tag

                  def content_repl(cm):
                      quote = cm.group(1)
                      return f'content={quote}{clean_text(cm.group(2))}{quote}'

                  return re.sub(
                      r'content\s*=\s*(["\'])(.*?)\1',
                      content_repl, tag, count=1, flags=re.I | re.S
                  )

              html = re.sub(r'<meta\b[^>]*>', meta_repl, html, flags=re.I | re.S)

              def attr_repl(m):
                  return f'{m.group(1)}={m.group(2)}{clean_text(m.group(3))}{m.group(2)}'

              return re.sub(
                  r'\b(aria-label|title|data-title)\s*=\s*(["\'])(.*?)\2',
                  attr_repl, html, flags=re.I | re.S
              )

          def rewrite(html: str) -> str:
              work, saved = stash_nonvisible(html)

              # Visible text nodes only.
              work = re.sub(
                  r">([^<>]+)<",
                  lambda m: ">" + clean_text(m.group(1)) + "<",
                  work
              )

              # Remove escaped internal marker that could render on-page.
              work = re.sub(
                  r"\s*&lt;!--\s*DPRO_V3_CANONICAL:.*?--&gt;\s*",
                  "\n", work, flags=re.S
              )

              # Remove only artificial line break inside a LIVE/DEMO title.
              work = re.sub(
                  r'(<div class="ps-live-copy">.*?<h3>.*?)<br\s*/?>(.*?(?:LIVE DEMO|公開DEMO|デモ画面).*?</h3>)',
                  r"\1 \2",
                  work, flags=re.S
              )

              work = restore_nonvisible(work, saved)
              return clean_text_attributes(work)

          def customer_surface(html: str) -> str:
              """Visible text + customer-facing text attributes/meta, excluding code/CSS."""
              s = re.sub(r"<!--.*?-->", " ", html, flags=re.S)
              s = re.sub(r"<script\b.*?</script>", " ", s, flags=re.S | re.I)
              s = re.sub(r"<style\b.*?</style>", " ", s, flags=re.S | re.I)

              attrs = []
              attrs += re.findall(
                  r'\b(?:aria-label|title|data-title)\s*=\s*["\']([^"\']*)["\']',
                  s, flags=re.I
              )
              for tag in re.findall(r'<meta\b[^>]*>', s, flags=re.I | re.S):
                  key = re.search(
                      r'(?:name|property)\s*=\s*["\']([^"\']+)["\']',
                      tag, flags=re.I
                  )
                  if key and key.group(1).lower() in {
                      "description", "og:title", "og:description",
                      "twitter:title", "twitter:description"
                  }:
                      cm = re.search(r'content\s*=\s*["\']([^"\']*)["\']', tag, flags=re.I)
                      if cm:
                          attrs.append(cm.group(1))

              visible = re.sub(r"<[^>]+>", " ", s)
              visible = visible.replace("&lt;", "<").replace("&gt;", ">").replace("&amp;", "&")
              return re.sub(r"\s+", " ", visible + " " + " ".join(attrs)).strip()

          banned_customer_terms = [
              "CENTRAL",
              "VERIFIED",
              "START PACKAGE",
              "FOUNDATION",
              "固定マッピング",
              "systems-data.js",
              "iframe",
              "MOBILE FIRST",
              "390px",
              "system-check",
              "demo_prepare",
              "production_guard",
              "SYSTEM CODE",
              "正式DEMO",
              "正式LIVE DEMO",
              "正式URL",
              "正式機能",
              "営業LP",
              "A4 HTML",
              "A4 PDF",
              "固定導線",
              "DPRO_V3_CANONICAL:",
          ]

          changed = []
          unchanged = []
          failures = []
          pet_seen = False

          for path in paths:
              before = path.read_text(encoding="utf-8")

              if path == PET:
                  pet_seen = True
                  print("PROTECTED:", path)
                  continue

              before_links = link_targets(before)
              before_functions = function_names(before)
              before_prices = price_strings(before)

              after = rewrite(before)

              if link_targets(after) != before_links:
                  failures.append(f"{path}: href/src/data-src target changed")
              if function_names(after) != before_functions:
                  failures.append(f"{path}: data-function-name changed")
              if price_strings(after) != before_prices:
                  failures.append(f"{path}: price strings changed")

              remaining = [
                  term for term in banned_customer_terms
                  if term in customer_surface(after)
              ]
              if remaining:
                  failures.append(f"{path}: internal wording remains customer-visible: {remaining}")

              if after != before:
                  path.write_text(after, encoding="utf-8")
                  changed.append(path)
              else:
                  unchanged.append(path)

              mirror = Path(str(path) + ".txt")
              if mirror.exists():
                  mirror_before = mirror.read_text(encoding="utf-8")
                  mirror_after = rewrite(mirror_before)
                  if mirror_after != mirror_before:
                      mirror.write_text(mirror_after, encoding="utf-8")

          if not pet_seen:
              failures.append("PET CARE was not found/protected")

          print("REGISTERED:", len(paths))
          print("PROTECTED PET CARE:", 1 if pet_seen else 0)
          print("REVIEWED OTHER PRODUCTS:", len(paths) - (1 if pet_seen else 0))
          print("CHANGED:", len(changed))
          print("ALREADY CLEAN / UNCHANGED:", len(unchanged))

          if failures:
              print("\nVALIDATION FAIL")
              for f in failures:
                  print(" -", f)
              raise SystemExit(1)

          Path("/tmp/dpro-product-pages.txt").write_text(
              "\n".join(str(p) for p in paths),
              encoding="utf-8"
          )
          print("\nCUSTOMER COPY VALIDATION PASS")
          PY

      - name: Cross-page static QA
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          paths = [
              Path(x)
              for x in Path("/tmp/dpro-product-pages.txt").read_text(encoding="utf-8").splitlines()
              if x
          ]
          assert len(paths) == 50, f"Expected 50 product pages, got {len(paths)}"

          checked = 0
          for p in paths:
              s = p.read_text(encoding="utf-8")
              assert "<html" in s.lower(), f"{p}: HTML root missing"
              assert "</html>" in s.lower(), f"{p}: HTML closing missing"
              assert "5,500円" in s or p.name == "pet-care.html", f"{p}: expected monthly price missing"
              checked += 1

          print(f"CROSS-PAGE STATIC QA PASS: {checked} / 50")
          PY

      - name: Commit successful brushup and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git rm -f .github/workflows/product-customer-copy-brushup-v1.yml

          git add systems/*.html
          git add systems/*.html.txt 2>/dev/null || true

          git status --short

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Brush up PRODUCT customer-facing copy across all 50 products"
          git push origin HEAD:main
