name: PRODUCT customer copy brushup V1.1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/product-customer-copy-brushup-v1.yml'

permissions:
  contents: write

jobs:
  brushup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rewrite all registered product pages
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          from collections import Counter

          DATA = Path("systems-data.js")
          WORKFLOW = Path(".github/workflows/product-customer-copy-brushup-v1.yml")
          PET = Path("systems/pet-care.html")

          if not DATA.exists():
              raise SystemExit("systems-data.js not found")

          data = DATA.read_text(encoding="utf-8")
          registered = re.findall(r'"systemPage"\s*:\s*"([^"]+\.html)"', data)
          registered = list(dict.fromkeys(registered))

          print("REGISTERED SYSTEM PAGES:", len(registered))
          if len(registered) != 50:
              raise SystemExit(f"Expected exactly 50 registered system pages, found {len(registered)}")

          paths = [Path(p) for p in registered]
          missing = [str(p) for p in paths if not p.exists()]
          if missing:
              raise SystemExit("Missing registered product pages:\n" + "\n".join(missing))

          def urls(html: str):
              return Counter(re.findall(r'https?://[^"\'<>\s]+', html))

          def function_names(html: str):
              return Counter(re.findall(r'data-function-name=["\']([^"\']+)["\']', html))

          def prices(html: str):
              return Counter(re.findall(r'(?:\d{1,3}(?:,\d{3})+|\d+)円', html))

          def stash_nonvisible(html: str):
              saved = []
              pattern = re.compile(
                  r'<!--.*?-->|<script\b.*?</script>|<style\b.*?</style>',
                  re.S | re.I
              )
              def repl(m):
                  key = f"___DPRO_STASH_{len(saved)}___"
                  saved.append(m.group(0))
                  return key
              return pattern.sub(repl, html), saved

          def restore_nonvisible(html: str, saved):
              for i, value in enumerate(saved):
                  html = html.replace(f"___DPRO_STASH_{i}___", value)
              return html

          def clean_customer_text(value: str) -> str:
              # Longer / specific phrases first.
              exact = [
                  (
                      "START PACKAGEとsystems-data.jsでVERIFIEDになっている正式DEMOだけを表示します。初期表示では読み込みません。",
                      "実際のデモ画面で、操作の流れをご確認いただけます。"
                  ),
                  (
                      "START PACKAGEで固定された正式DEMOを必要時だけ読み込めます。",
                      "このページのLIVE DEMOから、実際の画面と操作感をご確認いただけます。"
                  ),
                  (
                      "「LIVE画面を読み込む」を押した時だけ、確認済みの正式DEMOを表示します。初期iframeは0本です。",
                      "実際のデモ画面で、操作の流れをご確認いただけます。"
                  ),
                  (
                      "「LIVE画面を読み込む」を押した時だけ、CENTRAL確認済みの正式DEMO URLを表示します。",
                      "実際のデモ画面で、操作の流れをご確認いただけます。"
                  ),
                  (
                      "いいえ。初期表示のiframeは0本で、操作を試す時だけ読み込む構成です。",
                      "このページのLIVE DEMOから、実際の画面を開いて操作感をご確認いただけます。"
                  ),
                  (
                      "ここではsystems-data.jsのVERIFIED固定マッピングをそのまま使用しています。",
                      ""
                  ),
                  (
                      "下記6項目はDPRO V3 FOUNDATIONのVERIFIED固定マッピングと一致させています。",
                      "この業種で使う主な6機能を、実際の運用に沿って分かりやすくご紹介します。"
                  ),
                  (
                      "DPRO V3 FOUNDATIONのVERIFIED固定マッピングと一致させています。",
                      "実際の運用に沿って、主な機能を分かりやすくご紹介します。"
                  ),
                  (
                      "以下はCENTRAL LOCKEDの正式6機能です。推測の機能は追加していません。",
                      "この業種で使う主な6機能をご紹介します。"
                  ),
                  (
                      "推測の機能は追加していません。",
                      ""
                  ),
                  (
                      "必要時だけ正式DEMO画面を読み込みます。",
                      "ボタンを押すと、実際のデモ画面を操作できます。"
                  ),
                  (
                      "必要時だけ正式DEMOを読み込みます。",
                      "ボタンを押すと、実際のデモ画面を操作できます。"
                  ),
                  (
                      "ページを開いた時にDEMO画面は自動読込されますか？",
                      "実際の画面はどこから確認できますか？"
                  ),
                  (
                      "営業LPやA4資料も確認できますか？",
                      "詳しい資料も確認できますか？"
                  ),
                  (
                      "はい。ページ下部の関連資料から営業LP、A4 HTML、A4 PDFへ移動できます。",
                      "はい。ページ下部から、詳しい紹介ページやA4チラシ、PDF資料をご確認いただけます。"
                  ),
                  (
                      "このページのVERIFIED LIVE DEMOで、実際の画面と操作感を確認します。",
                      "このページのLIVE DEMOで、実際の画面と操作感をご確認いただけます。"
                  ),
              ]
              for a, b in exact:
                  value = value.replace(a, b)

              # Common customer-facing vocabulary.
              rules = [
                  (r"CENTRAL確認済みの", ""),
                  (r"CENTRAL LOCKEDの", ""),
                  (r"確認済みの正式LIVE DEMO", "LIVE DEMO"),
                  (r"確認済みの正式DEMO", "実際のデモ画面"),
                  (r"確認済みLIVE DEMO", "LIVE DEMO"),
                  (r"VERIFIED LIVE DEMO", "LIVE DEMO"),
                  (r"VERIFIED DEMO", "LIVE DEMO"),
                  (r"正式LIVE DEMO", "LIVE DEMO"),
                  (r"正式DEMO URL", "デモ画面"),
                  (r"正式DEMO画面", "デモ画面"),
                  (r"正式DEMO", "デモ画面"),
                  (r"正式な(\d+)機能", r"主な\1機能"),
                  (r"(\d+)つの正式機能", r"\1つの主な機能"),
                  (r"正式(\d+)機能", r"主な\1機能"),
                  (r"正式機能", "主な機能"),
                  (r"営業LPを見る", "詳しい紹介を見る"),
                  (r"営業LP", "詳しい紹介ページ"),
                  (r"A4 HTML", "A4チラシ"),
                  (r"A4 PDF", "PDF資料"),
                  (r"LIVE画面を読み込む", "実画面を開く"),
                  (r"正式ページ", "製品ページ"),
                  (r"正式実装", "対応内容"),
                  (r"導入仕様", "導入内容"),
                  (r"MOBILE FIRST", "スマホ対応"),
              ]
              for pat, rep in rules:
                  value = re.sub(pat, rep, value)

              # Repetitive generated function descriptions.
              value = re.sub(
                  r"「([^」]+)」に関する情報を、必要な時に確認しやすい形でまとめます。",
                  r"\1を、必要な時にすぐ確認できるよう整理します。",
                  value
              )
              value = re.sub(
                  r"「([^」]+)」を業種専用の運用として扱い、予約・受付の確認先をまとめます。",
                  r"\1をDPROでまとめて確認し、予約・受付をスムーズに進められます。",
                  value
              )
              value = re.sub(
                  r"「([^」]+)」をDPROの業種専用システム内で扱い、確認先をまとめます。",
                  r"\1をDPROでまとめて確認し、必要な対応へつなげられます。",
                  value
              )
              value = re.sub(
                  r"「([^」]+)」を現場の確認項目として扱い、状況を追いやすくします。",
                  r"\1の状況を確認しやすくし、次の対応を判断しやすくします。",
                  value
              )

              value = re.sub(r"\s+([。、])", r"\1", value)
              value = re.sub(r"。{2,}", "。", value)
              return value

          def rewrite_visible_text(html: str) -> str:
              work, saved = stash_nonvisible(html)

              # Only text between tags. Attribute values / URLs / data contracts stay untouched.
              def repl(m):
                  return ">" + clean_customer_text(m.group(1)) + "<"

              work = re.sub(r">([^<>]+)<", repl, work)

              # Remove an escaped internal marker that could otherwise render to customers.
              work = re.sub(
                  r"\s*&lt;!--\s*DPRO_V3_CANONICAL:.*?--&gt;\s*",
                  "\n",
                  work,
                  flags=re.S
              )

              # Common LIVE heading: remove a forced break only when it splits the DEMO title.
              work = re.sub(
                  r'(<div class="ps-live-copy">.*?<h3>.*?)<br\s*/?>(.*?(?:LIVE DEMO|デモ画面).*?</h3>)',
                  r"\1 \2",
                  work,
                  flags=re.S
              )

              return restore_nonvisible(work, saved)

          def visible_text(html: str) -> str:
              s = re.sub(r"<!--.*?-->", " ", html, flags=re.S)
              s = re.sub(r"<script\b.*?</script>", " ", s, flags=re.S | re.I)
              s = re.sub(r"<style\b.*?</style>", " ", s, flags=re.S | re.I)
              s = re.sub(r"<[^>]+>", " ", s)
              s = s.replace("&lt;", "<").replace("&gt;", ">").replace("&amp;", "&")
              return re.sub(r"\s+", " ", s).strip()

          # Internal vocabulary that must not be visible to customers after the pass.
          banned_visible = [
              "CENTRAL LOCKED",
              "CENTRAL確認済み",
              "DPRO V3 FOUNDATION",
              "VERIFIED固定マッピング",
              "systems-data.jsのVERIFIED",
              "START PACKAGE",
              "初期iframe",
              "MOBILE FIRST",
              "390px",
              "推測の機能",
              "DPRO_V3_CANONICAL:",
          ]

          changed = []
          unchanged = []
          failures = []
          pet_seen = False

          for path in paths:
              before = path.read_text(encoding="utf-8")

              if path == PET:
                  pet_seen = True
                  print("PROTECTED:", path)
                  continue

              before_urls = urls(before)
              before_functions = function_names(before)
              before_prices = prices(before)

              after = rewrite_visible_text(before)

              # Contract guards.
              if urls(after) != before_urls:
                  failures.append(f"{path}: URL set changed")
              if function_names(after) != before_functions:
                  failures.append(f"{path}: data-function-name changed")
              if prices(after) != before_prices:
                  failures.append(f"{path}: price strings changed")

              vt = visible_text(after)
              remain = [term for term in banned_visible if term in vt]
              if remain:
                  failures.append(f"{path}: internal wording remains visible: {remain}")

              if after != before:
                  marker = "<!-- DPRO CUSTOMER COPY BRUSHUP V1.1 / 2026-08-16 -->"
                  if marker not in after:
                      after = after.replace("</head>", marker + "\n</head>", 1)
                  path.write_text(after, encoding="utf-8")
                  changed.append(path)
              else:
                  unchanged.append(path)

              # Keep recovery mirror aligned when present.
              mirror = Path(str(path) + ".txt")
              if mirror.exists():
                  m_before = mirror.read_text(encoding="utf-8")
                  m_after = rewrite_visible_text(m_before)
                  if m_after != m_before:
                      marker = "<!-- DPRO CUSTOMER COPY BRUSHUP V1.1 / 2026-08-16 -->"
                      if marker not in m_after:
                          m_after = m_after.replace("</head>", marker + "\n</head>", 1)
                      mirror.write_text(m_after, encoding="utf-8")

          if not pet_seen:
              failures.append("PET CARE registered page was not found/protected")

          print("REGISTERED:", len(paths))
          print("PROTECTED PET CARE:", 1 if pet_seen else 0)
          print("REVIEWED OTHER PRODUCTS:", len(paths) - (1 if pet_seen else 0))
          print("CHANGED:", len(changed))
          print("ALREADY CLEAN / UNCHANGED:", len(unchanged))

          if failures:
              print("\nVALIDATION FAIL")
              for failure in failures:
                  print(" -", failure)
              raise SystemExit(1)

          Path("/tmp/dpro-product-pages.txt").write_text(
              "\n".join(str(p) for p in paths), encoding="utf-8"
          )
          print("\nCUSTOMER COPY VALIDATION PASS")
          PY

      - name: Cross-page static QA
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          paths = [
              Path(x) for x in
              Path("/tmp/dpro-product-pages.txt").read_text(encoding="utf-8").splitlines()
              if x
          ]

          assert len(paths) == 50, f"Expected 50 product pages, got {len(paths)}"

          for p in paths:
              s = p.read_text(encoding="utf-8")
              assert "<html" in s.lower(), f"{p}: HTML root missing"
              assert "</html>" in s.lower(), f"{p}: HTML closing missing"

              if p.name != "pet-care.html":
                  # Main customer product pages should retain common dependencies where present.
                  if "dpro-v3.js" not in s:
                      raise AssertionError(f"{p}: dpro-v3.js reference missing")
                  if "systems-data.js" not in s:
                      raise AssertionError(f"{p}: systems-data.js reference missing")

          print("CROSS-PAGE STATIC QA PASS: 50 / 50")
          PY

      - name: Commit successful brushup and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Remove the one-shot workflow only after both QA stages pass.
          git rm -f .github/workflows/product-customer-copy-brushup-v1.yml

          git add systems/*.html
          git add systems/*.html.txt 2>/dev/null || true

          git status --short

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Brush up PRODUCT customer-facing copy across all 50 products"
          git push origin HEAD:main
