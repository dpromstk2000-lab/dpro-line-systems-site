name: DPRO Tutorial SHIHO R6 Browser QA Recovery1

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/dpro-tutorial-shiho-r6-browser-qa-recovery1.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: dpro-tutorial-shiho-r6-recovery1
  cancel-in-progress: true

env:
  PRODUCT_PUBLISH_HEAD: 73e2c4b9287437c436c55a665777e48d16fc194b
  INDUSTRY_BASE_HEAD: a4f93021992d24857e36193a3773756fab5227ee
  INDUSTRY_REPO: dpromstk2000-lab/dpro-shiho-inheritance-line-liff
  INDUSTRY_BASE: https://dpromstk2000-lab.github.io/dpro-shiho-inheritance-line-liff
  PRODUCT_PAGE: https://dpromstk2000-lab.github.io/dpro-line-systems-site/systems/shiho.html
  QUICK_PDF: SHIHO_R5_QUICK_START.pdf
  DETAIL_PDF: SHIHO_R5_DETAILED_MANUAL.pdf
  QUICK_PNG: SHIHO_R5_QUICK_START_p01.png
  DETAIL_PNG: SHIHO_R5_DETAILED_MANUAL_p01.png
  QUICK_PDF_SHA256: 4f82841636d302679492b1d272e0cb43fce22a0edca24c95b548b143cb02190e
  DETAIL_PDF_SHA256: 2a6685e8faaa308008736d37ea827a9c8bf5fc7237490cb7dd8b2ca5cc2c8ea5
  QUICK_PNG_SHA256: cd8cb46cc652b41ac54bc4c1c654d22da4d62d1ba08507d1bda1794348604c3d
  DETAIL_PNG_SHA256: 8ef8dc88284e0c56edf7cf6190bc7d5b6a97e294437bce715aa88edd1cb24148

jobs:
  recovery-browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify forward-only and Batch-04 preservation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa-r6 central-return
          git merge-base --is-ancestor "$PRODUCT_PUBLISH_HEAD" HEAD
          git rev-parse HEAD | tee qa-r6/product-site-current-head.txt
          git rev-parse HEAD^{tree} | tee qa-r6/product-site-current-tree.txt
          python - <<'PY'
          from pathlib import Path
          checks={
            'systems/shiho.html':['DPRO_TUTORIAL_SHIHO_R6','SHIHO_R5_QUICK_START.pdf','SHIHO_R5_DETAILED_MANUAL.pdf','dpro-shiho-inheritance-line-liff/guide-center.html?demo=1'],
            'systems/cosmetics.html':['dpro-cosmetics-line-liff/guide-center.html'],
            'systems/flower-shop.html':['dpro-flower-line-liff/guide-center.html'],
            'systems/yakiniku.html':['data-dpro-tutorial-r6="1"'],
            'systems/chosashi.html':['DPRO_TUTORIAL_CHOSASHI_R6'],
          }
          lines=[]
          for p,needles in checks.items():
            t=Path(p).read_text(encoding='utf-8')
            missing=[x for x in needles if x not in t]
            if missing: raise SystemExit(f'{p}: missing {missing}')
            lines.append(f'{p}: PASS')
          Path('qa-r6/static-preservation.txt').write_text('\n'.join(lines)+'\nBUSINESS_MUTATION=0\nR7=NOT_STARTED\n',encoding='utf-8')
          PY

      - name: Verify SHIHO source continuity and locked assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os,urllib.request
          from pathlib import Path
          repo=os.environ['INDUSTRY_REPO']; base=os.environ['INDUSTRY_BASE_HEAD']
          headers={'Accept':'application/vnd.github+json','Authorization':'Bearer '+os.environ['GH_TOKEN'],'User-Agent':'DPRO-SHIHO-R6-RECOVERY'}
          def j(url):
            with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=40) as r:return json.load(r)
          cur=j(f'https://api.github.com/repos/{repo}/commits/main')
          head=cur['sha']; tree=cur['commit']['tree']['sha']
          Path('qa-r6/industry-head-final.txt').write_text(head+'\n')
          Path('qa-r6/industry-tree-final.txt').write_text(tree+'\n')
          core=['guide-center.html','tutorial.js','tutorial.css','index.html','member.html','owner.html','staff.html','owner-ipad.html','system-check.html','demo-guide.html']
          for p in core:
            old=j(f'https://api.github.com/repos/{repo}/contents/{p}?ref={base}')['sha']
            new=j(f'https://api.github.com/repos/{repo}/contents/{p}?ref={head}')['sha']
            if old!=new: raise SystemExit(f'SHIHO source drift {p}: {old}->{new}')
          cmp=j(f'https://api.github.com/repos/{repo}/compare/{base}...{head}')
          allowed={os.environ['QUICK_PDF'],os.environ['DETAIL_PDF'],os.environ['QUICK_PNG'],os.environ['DETAIL_PNG']}
          changed={f['filename'] for f in cmp.get('files',[])}
          if changed!=allowed: raise SystemExit(f'Unexpected SHIHO forward diff: {sorted(changed)}')
          for name,key in [(os.environ['QUICK_PDF'],'QUICK_PDF_SHA256'),(os.environ['DETAIL_PDF'],'DETAIL_PDF_SHA256'),(os.environ['QUICK_PNG'],'QUICK_PNG_SHA256'),(os.environ['DETAIL_PNG'],'DETAIL_PNG_SHA256')]:
            url=f'https://raw.githubusercontent.com/{repo}/main/{name}'
            with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'DPRO-SHIHO-R6-RECOVERY'}),timeout=90) as r:data=r.read()
            got=hashlib.sha256(data).hexdigest()
            if got!=os.environ[key]: raise SystemExit(f'Hash mismatch {name}: {got}')
          Path('qa-r6/industry-continuity.txt').write_text('SOURCE_DRIFT=0\nLOCKED_ASSETS=PASS\nBUSINESS_MUTATION=0\n')
          PY

      - name: Wait for exact-head Pages success
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,time,urllib.request
          from pathlib import Path
          repo=os.environ['GITHUB_REPOSITORY']; head=os.environ['GITHUB_SHA']
          headers={'Accept':'application/vnd.github+json','Authorization':'Bearer '+os.environ['GH_TOKEN'],'User-Agent':'DPRO-SHIHO-R6-RECOVERY'}
          found=None
          for _ in range(72):
            url=f'https://api.github.com/repos/{repo}/actions/runs?head_sha={head}&per_page=100'
            with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=40) as r:data=json.load(r)
            for run in data.get('workflow_runs',[]):
              if run.get('name')=='pages build and deployment' and run.get('status')=='completed':
                if run.get('conclusion')!='success': raise SystemExit('Pages failed '+str(run.get('html_url')))
                found=run; break
            if found: break
            time.sleep(10)
          if not found: raise SystemExit('Exact-head Pages success not observed')
          Path('qa-r6/pages-exact-head.txt').write_text(f"RUN_ID={found['id']}\nHEAD={head}\nCONCLUSION=success\nURL={found['html_url']}\n")
          PY

      - name: Public LIVE and manual QA
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,os,time,urllib.request
          from pathlib import Path
          ua={'User-Agent':'DPRO-SHIHO-R6-RECOVERY'}; product=os.environ['PRODUCT_PAGE']; base=os.environ['INDUSTRY_BASE']
          html=''
          for _ in range(60):
            try:
              with urllib.request.urlopen(urllib.request.Request(product,headers=ua),timeout=40) as r: html=r.read().decode('utf-8','replace')
              if all(x in html for x in ['DPRO_TUTORIAL_SHIHO_R6','SHIHO_R5_QUICK_START.pdf','SHIHO_R5_DETAILED_MANUAL.pdf']): break
            except Exception: pass
            time.sleep(5)
          else: raise SystemExit('Published Product Site markers missing')
          urls=[base+'/guide-center.html?demo=1',base+'/demo-guide.html?demo=1&tutorial=start',base+'/member.html?demo=1',base+'/staff.html?demo=1',base+'/owner.html?demo=1',base+'/owner-ipad.html?demo=1',base+'/system-check.html?demo=1']
          lines=[]
          for u in urls:
            with urllib.request.urlopen(urllib.request.Request(u,headers=ua),timeout=60) as r:
              body=r.read(2048)
              if r.status!=200 or not body: raise SystemExit(f'LIVE URL failed {u}')
              lines.append(f'PASS {r.status} {u}')
          for name,key in [(os.environ['QUICK_PDF'],'QUICK_PDF_SHA256'),(os.environ['DETAIL_PDF'],'DETAIL_PDF_SHA256'),(os.environ['QUICK_PNG'],'QUICK_PNG_SHA256'),(os.environ['DETAIL_PNG'],'DETAIL_PNG_SHA256')]:
            u=base+'/'+name
            with urllib.request.urlopen(urllib.request.Request(u,headers=ua),timeout=90) as r:data=r.read()
            got=hashlib.sha256(data).hexdigest()
            if got!=os.environ[key]: raise SystemExit(f'Published hash mismatch {name}')
            lines.append(f'PASS SHA256={got} {u}')
          Path('qa-r6/live-qa.txt').write_text('\n'.join(lines)+'\n')
          PY

      - name: Browser QA 1440 1024 390 320
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 --no-save >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null
          node - <<'JS'
          const { chromium } = require('playwright');
          const fs = require('fs');
          (async()=>{
            const url=process.env.PRODUCT_PAGE;
            const sizes=[[1440,900],[1024,900],[390,844],[320,720]];
            const b=await chromium.launch({headless:true});
            const lines=[];
            for (const [width,height] of sizes){
              const page=await b.newPage({viewport:{width,height}});
              const pageErrors=[];
              page.on('pageerror',e=>pageErrors.push(String(e)));
              await page.goto(url,{waitUntil:'domcontentloaded',timeout:90000});
              await page.waitForTimeout(1200);
              const r=await page.evaluate(()=>({marker:document.documentElement.innerHTML.includes('DPRO_TUTORIAL_SHIHO_R6'),scrollWidth:document.documentElement.scrollWidth,innerWidth:window.innerWidth}));
              if(!r.marker) throw new Error(`marker missing ${width}`);
              if(r.scrollWidth>r.innerWidth) throw new Error(`overflow ${width}: ${r.scrollWidth}>${r.innerWidth}`);
              if(pageErrors.length) throw new Error(`pageerror ${width}: ${pageErrors.join(' | ')}`);
              lines.push(`${width}x${height} PASS scrollWidth=${r.scrollWidth} innerWidth=${r.innerWidth} pageErrors=0`);
              await page.close();
            }
            await b.close();
            fs.writeFileSync('qa-r6/browser-qa.txt',lines.join('\n')+'\n');
          })().catch(e=>{console.error(e);process.exit(1)});
          JS

      - name: Build CENTRAL RETURN
        shell: bash
        run: |
          set -euo pipefail
          cp qa-r6/* central-return/
          cat > central-return/STATUS.txt <<EOF
          DPRO TUTORIAL BATCH04 SHIHO R6
          CENTRAL CANDIDATE=PASS
          STANDARD=V1.1
          FORWARD_ONLY=PASS
          PRODUCT_SITE_ROLLBACK=0
          BUSINESS_MUTATION=0
          R7=NOT_STARTED
          PRODUCT_PUBLISH_HEAD=$PRODUCT_PUBLISH_HEAD
          PRODUCT_SITE_CURRENT_HEAD=$GITHUB_SHA
          EOF
          cat > central-return/00_START_HERE.txt <<'EOF'
          SHIHO R6 Recovery1 completed after a QA-runner module-resolution failure.
          The original failure was not a Product Site or SHIHO product defect.
          CENTRAL should verify STATUS.txt, browser-qa.txt, live-qa.txt and pages-exact-head.txt.
          EOF
          cat > central-return/NEXT_ACTION.txt <<'EOF'
          CENTRAL: if every evidence file is PASS, accept SHIHO R6 and lock Batch-04 R6=5/5.
          Do not start R7.
          EOF
          zip -qr DPRO_TUTORIAL_BATCH04_SHIHO_R6_CENTRAL_RETURN_V1.1_20260827.zip central-return

      - name: Upload CENTRAL RETURN
        uses: actions/upload-artifact@v4
        with:
          name: DPRO_TUTORIAL_BATCH04_SHIHO_R6_CENTRAL_RETURN_V1.1_20260827
          path: DPRO_TUTORIAL_BATCH04_SHIHO_R6_CENTRAL_RETURN_V1.1_20260827.zip
          if-no-files-found: error
