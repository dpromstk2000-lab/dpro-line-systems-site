name: DPRO LP Native Wrap Final Audit V1.1

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/dpro-lp-native-wrap-final-audit-v1-1.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dpro-lp-native-wrap-final-audit-v1-1
  cancel-in-progress: false

jobs:
  audit:
    name: Render and visually stage all 50 LPs
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout current Product Site
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Guard reset state
        shell: bash
        run: |
          set -euo pipefail
          test -f qa/LP_NATIVE_WRAP_RESET_V1.0_SUMMARY.md
          grep -Fq 'Changed LPs: 48 / 50' qa/LP_NATIVE_WRAP_RESET_V1.0_SUMMARY.md
          grep -Fq 'DPRO LP HAIR WRAP FIX V1.3 CENTRAL' lp-hair.html
          grep -Fq 'flyerHtml: "flyer-medical.html"' systems-data.js
          grep -Fq 'DPRO LIVE DEMO ALL49 CENTRAL OVERRIDES START' systems-data.js
          echo "PASS: native wrap reset + HAIR + MEDICAL + ALL49 present"

      - name: Install Chromium QA
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 --silent
          npx playwright install --with-deps chromium
          python3 -m pip install --quiet pillow
          node -e "console.log(require.resolve('playwright'))"

      - name: Create audit runner
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64
          Path('dpro-lp-final-audit-v11.js').write_bytes(base64.b64decode(''))
          PY
          node --check dpro-lp-final-audit-v11.js

      - name: Start local Product Site
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/dpro-http.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8765/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/dpro-http.log || true
          exit 1

      - name: Audit 50 LP x 3 viewport
        shell: bash
        run: |
          set -euo pipefail
          node dpro-lp-final-audit-v11.js
          cat qa/lp-native-wrap-final-v1.1/SUMMARY.md

      - name: Build 5 desktop hero contact sheets
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image,ImageOps,ImageDraw,ImageFont

          src=Path('qa/lp-native-wrap-final-v1.1/hero')
          out=Path('qa/lp-native-wrap-final-v1.1/contact-sheets')
          out.mkdir(parents=True,exist_ok=True)
          files=sorted(src.glob('*.png'))
          if len(files)!=50:
              raise SystemExit(f'Expected 50 desktop screenshots, found {len(files)}')

          W,H=520,390
          LABEL=34
          COLS,ROWS=2,5
          for group in range(5):
              canvas=Image.new('RGB',(COLS*W,ROWS*(H+LABEL)),'white')
              draw=ImageDraw.Draw(canvas)
              batch=files[group*10:(group+1)*10]
              for i,p in enumerate(batch):
                  im=Image.open(p).convert('RGB')
                  im=ImageOps.fit(im,(W,H),method=Image.Resampling.LANCZOS,centering=(0.5,0.0))
                  x=(i%COLS)*W
                  y=(i//COLS)*(H+LABEL)
                  canvas.paste(im,(x,y))
                  draw.rectangle([x,y+H,x+W,y+H+LABEL],fill='white')
                  draw.text((x+8,y+H+8),p.stem,fill='black')
              canvas.save(out/f'LP_HERO_CONTACT_{group+1}.jpg',quality=78,optimize=True)
          print('PASS: 5 contact sheets created')
          PY

      - name: Validate final audit
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json
          d=json.loads(Path('qa/lp-native-wrap-final-v1.1/AUDIT.json').read_text(encoding='utf-8'))
          s=d['summary']
          if s['pages']!=50 or s['checks']!=150:
              raise SystemExit('BLOCKER: incomplete audit matrix')
          if s['loadErrors'] or s['auditErrors'] or s['elementAuditErrors']:
              raise SystemExit(f'BLOCKER: invalid audit errors {s}')
          sheets=list(Path('qa/lp-native-wrap-final-v1.1/contact-sheets').glob('*.jpg'))
          if len(sheets)!=5:
              raise SystemExit('BLOCKER: contact sheets missing')
          print('PASS: valid 50 LP render audit and visual contact sheets')
          PY

      - name: Publish audit for CENTRAL inspection
        shell: bash
        run: |
          set -euo pipefail
          rm -f dpro-lp-final-audit-v11.js
          rm -rf qa/lp-native-wrap-final-v1.1/hero
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add qa/lp-native-wrap-final-v1.1/AUDIT.json
          git add qa/lp-native-wrap-final-v1.1/SUMMARY.md
          git add qa/lp-native-wrap-final-v1.1/contact-sheets/*.jpg
          git rm --ignore-unmatch ".github/workflows/dpro-lp-native-wrap-final-audit-v1-1.yml"
          git commit -m "Publish DPRO LP native wrap final audit V1.1"
          git push origin HEAD:main
