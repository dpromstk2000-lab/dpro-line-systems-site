name: DPRO MEDICAL Flyer Master Conformance V1.2

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/dpro-medical-flyer-master-conformance-v1-2.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dpro-medical-flyer-master-conformance-v1-2
  cancel-in-progress: false

jobs:
  deploy:
    name: Replace MEDICAL flyer with Master Format V1.2
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout current Product Site
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Guard current locked sources
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object flyer-medical.html)" = "0df83eeb821db58608aa6b2275074cf66d530c40" || {
            echo "BLOCKER: flyer-medical.html baseline changed"; exit 1;
          }
          test "$(git hash-object flyer-medical.pdf)" = "e5c29634dd93dc70e7246c77a2c70fee62526c4a" || {
            echo "BLOCKER: flyer-medical.pdf baseline changed"; exit 1;
          }
          test "$(git hash-object systems-data.js)" = "e676cb5a559c3f89bdd9e86f3074756df8479dfa" || {
            echo "BLOCKER: systems-data.js protected state changed"; exit 1;
          }
          test "$(git hash-object systems/medical.html)" = "0d820fff2078ebb457a35c720306dbef42a0b83a" || {
            echo "BLOCKER: systems/medical.html protected state changed"; exit 1;
          }
          grep -Fq 'flyerHtml: "flyer-medical.html"' systems-data.js
          grep -Fq 'flyerPdf: "flyer-medical.pdf"' systems-data.js
          grep -Fq '../flyer-medical.html' systems/medical.html
          grep -Fq '../flyer-medical.pdf' systems/medical.html
          echo "PASS: MEDICAL flyer routes and protected Product state present"

      - name: Install Master Format V1.2 flyer
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64

          Path('flyer-medical.html').write_bytes(base64.b64decode(''))
          Path('flyer-medical.pdf').write_bytes(base64.b64decode(''))

          html=Path('flyer-medical.html').read_text(encoding='utf-8')
          required=[
            'DPRO MEDICAL A4 FLYER V1.2 / MASTER FORMAT CONFORMANCE',
            'A4で印刷 / PDF保存',
            '医院運用の毎日を、6つの強みで整理。',
            '入口は自由。管理は、ひとつ。',
            '料金は医院構成に合わせてご案内',
            'LINEで相談する。',
            '詳しく見る。',
            '30秒、実際に触る。',
            'https://lin.ee/YxJGXV6D',
            'https://dpro-shop.com/systems/medical',
            'https://dpromstk2000-lab.github.io/dpro-medical-standard/medical-public-demo.html'
          ]
          for x in required:
              if x not in html:
                  raise SystemExit(f'BLOCKER: missing V1.2 content: {x}')

          if html.count('data:image/png;base64,') != 3:
              raise SystemExit('BLOCKER: expected exactly 3 embedded QR images')

          if Path('flyer-medical.pdf').stat().st_size < 200000:
              raise SystemExit('BLOCKER: V1.2 PDF unexpectedly small')

          print('PASS: Master Format V1.2 HTML/PDF installed')
          PY

      - name: Final scope and route QA
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test "$(git hash-object systems-data.js)" = "e676cb5a559c3f89bdd9e86f3074756df8479dfa"
          test "$(git hash-object systems/medical.html)" = "0d820fff2078ebb457a35c720306dbef42a0b83a"

          python3 - <<'PY'
          import subprocess
          changed=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          expected={'flyer-medical.html','flyer-medical.pdf'}
          if changed != expected:
              raise SystemExit(f'BLOCKER unexpected changed files: {sorted(changed)}')
          print('PASS: only MEDICAL flyer HTML/PDF changed')
          PY

          grep -Fq 'flyerHtml: "flyer-medical.html"' systems-data.js
          grep -Fq 'flyerPdf: "flyer-medical.pdf"' systems-data.js
          grep -Fq '../flyer-medical.html' systems/medical.html
          grep -Fq '../flyer-medical.pdf' systems/medical.html
          echo "PASS: Product Site flyer routes preserved"

      - name: Commit V1.2
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flyer-medical.html flyer-medical.pdf
          git rm --ignore-unmatch ".github/workflows/dpro-medical-flyer-master-conformance-v1-2.yml"
          git commit -m "Conform DPRO MEDICAL flyer to A4 sales master V1.2"
          git push origin HEAD:main
