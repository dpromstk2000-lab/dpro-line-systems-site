name: STAY R6 Product Site Integration + FULL LIVE QA V1.1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/stay-r6-product-site-v11.yml'

permissions:
  contents: write

jobs:
  integrate-and-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch newest Product Site main prewrite
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          git merge-base --is-ancestor 1f5fcd309fa3f75276c68a3cf03a4b9c59d1fa36 HEAD
          PRE_HEAD="$(git rev-parse HEAD)"
          PRE_TREE="$(git rev-parse HEAD^{tree})"
          HTML_BLOB="$(git hash-object systems/stay.html)"
          MIRROR_BLOB="$(git hash-object systems/stay.html.txt)"
          test "$HTML_BLOB" = "$MIRROR_BLOB"
          test "$(cmp -s systems/stay.html systems/stay.html.txt; echo $?)" = "0"
          ! grep -q 'DPRO TUTORIAL STAY R6' systems/stay.html
          cp systems/stay.html "$RUNNER_TEMP/stay-before.html"
          printf '%s\n' "$PRE_HEAD" > "$RUNNER_TEMP/pre-head.txt"
          printf '%s\n' "$PRE_TREE" > "$RUNNER_TEMP/pre-tree.txt"
          printf '%s\n' "$HTML_BLOB" > "$RUNNER_TEMP/pre-html-blob.txt"

      - name: Verify all 4 STAY resources by real HTTP before write
        shell: bash
        run: |
          set -euo pipefail
          urls=(
            'https://dpromstk2000-lab.github.io/dpro-stay-line/demo-guide.html'
            'https://dpromstk2000-lab.github.io/dpro-stay-line/demo-guide.html'
            'https://dpromstk2000-lab.github.io/dpro-stay-line/DPRO_TUTORIAL_STAY_QUICK_START_V1.0.pdf'
            'https://dpromstk2000-lab.github.io/dpro-stay-line/DPRO_TUTORIAL_STAY_DETAILED_MANUAL_V1.0.pdf'
          )
          for u in "${urls[@]}"; do
            code="$(curl -L --retry 6 --retry-delay 5 --retry-all-errors -sS -o /tmp/r6-resource -w '%{http_code}' "$u")"
            test "$code" = "200"
            test -s /tmp/r6-resource
          done

      - name: Integrate STAY Tutorial resources into target only
        shell: python
        run: |
          from pathlib import Path
          html=Path("systems/stay.html")
          mirror=Path("systems/stay.html.txt")
          before=html.read_text(encoding="utf-8")
          assert before.encode("utf-8")==mirror.read_bytes()
          marker="<!-- DPRO TUTORIAL STAY R6 -->"
          assert marker not in before
          needle="</main><footer"
          assert needle in before
          section='''<!-- DPRO TUTORIAL STAY R6 -->
          <section id="stay-tutorial-manuals" class="dpro-section ps-section-soft r6-tutorial-section" aria-labelledby="stay-tutorial-title">
            <style>
              .r6-tutorial-section [data-r6-tutorial-resources]{margin-top:1rem}
              .r6-tutorial-section [data-r6-resource]:focus-visible{outline:3px solid #0b7a55;outline-offset:4px;box-shadow:0 0 0 4px rgba(11,122,85,.16)}
              .r6-tutorial-section .r6-resource-note{margin:1rem 0 0;padding:1rem 1.1rem;border-left:4px solid var(--dpro-green);background:#fff;color:#395149}
            </style>
            <div class="dpro-container">
              <div class="ps-section-heading">
                <p class="ps-kicker">TUTORIAL &amp; MANUAL</p>
                <h2 id="stay-tutorial-title">操作ガイドと印刷マニュアル</h2>
                <p>公開デモのFirst10 / Guide Centerと、A4印刷マニュアルを利用できます。Tutorialは案内とハイライト専用で、予約・到着・清掃・問い合わせ・忘れ物などの業務データを作成・変更しません。</p>
              </div>
              <div class="ps-target-grid" data-r6-tutorial-resources>
                <article class="dpro-card ps-card-copy">
                  <h3>Tutorial Start</h3>
                  <p>公開操作ガイドを開き、Guide Centerの「開始」からFirst10をSTEP 1から確認します。</p>
                  <div class="ps-actions"><a class="dpro-button dpro-button--primary" data-r6-resource="tutorial-start" href="https://dpromstk2000-lab.github.io/dpro-stay-line/demo-guide.html" target="_blank" rel="noopener">操作ガイドを開く</a></div>
                </article>
                <article class="dpro-card ps-card-copy">
                  <h3>Guide Center</h3>
                  <p>同じ公開操作ガイドで、First10全10項目とStart / Resume / Replayを確認できます。</p>
                  <div class="ps-actions"><a class="dpro-button dpro-button--secondary" data-r6-resource="guide-center" href="https://dpromstk2000-lab.github.io/dpro-stay-line/demo-guide.html" target="_blank" rel="noopener">Guide Centerを開く</a></div>
                </article>
                <article class="dpro-card ps-card-copy">
                  <h3>Quick Start PDF</h3>
                  <p>A4縦1ページ。初回説明用の要点、操作方法、安全ルール、公開Tutorial QRを掲載しています。</p>
                  <div class="ps-actions"><a class="dpro-button dpro-button--secondary" data-r6-resource="quick-start-pdf" href="https://dpromstk2000-lab.github.io/dpro-stay-line/DPRO_TUTORIAL_STAY_QUICK_START_V1.0.pdf" target="_blank" rel="noopener">Quick Start PDF</a></div>
                </article>
                <article class="dpro-card ps-card-copy">
                  <h3>Detailed Manual PDF</h3>
                  <p>A4縦6ページ。First10全10ステップ、Guide Center、キーボード・ドラッグ・再開、安全境界をまとめています。</p>
                  <div class="ps-actions"><a class="dpro-button dpro-button--secondary" data-r6-resource="detailed-manual-pdf" href="https://dpromstk2000-lab.github.io/dpro-stay-line/DPRO_TUTORIAL_STAY_DETAILED_MANUAL_V1.0.pdf" target="_blank" rel="noopener">Detailed Manual PDF</a></div>
                </article>
              </div>
              <p class="r6-resource-note">案内専用 / business mutation 0。Tutorialは保存・削除・承認・送信・認証・ステータス変更などの業務操作を自動実行しません。</p>
            </div>
          </section>
          <!-- /DPRO TUTORIAL STAY R6 -->'''
          after=before.replace(needle,section+needle,1)
          html.write_text(after,encoding="utf-8",newline="")
          mirror.write_bytes(html.read_bytes())

      - name: Static R6 target-scope and regression QA
        shell: python
        run: |
          from pathlib import Path
          import os, subprocess
          h=Path("systems/stay.html").read_bytes()
          t=Path("systems/stay.html.txt").read_bytes()
          assert h==t
          s=h.decode("utf-8")
          assert s.count("DPRO TUTORIAL STAY R6")==2
          assert s.count('data-r6-resource=')==4
          assert s.count('href="https://dpromstk2000-lab.github.io/dpro-stay-line/demo-guide.html"')==2
          assert "DPRO_TUTORIAL_STAY_QUICK_START_V1.0.pdf" in s
          assert "DPRO_TUTORIAL_STAY_DETAILED_MANUAL_V1.0.pdf" in s
          changed=subprocess.check_output(["git","diff","--name-only"],text=True).splitlines()
          assert set(changed)=={"systems/stay.html","systems/stay.html.txt"}, changed
          before=(Path(os.environ["RUNNER_TEMP"])/"stay-before.html").read_text(encoding="utf-8")
          start="<!-- DPRO TUTORIAL STAY R6 -->"
          end="<!-- /DPRO TUTORIAL STAY R6 -->"
          i=s.index(start); j=s.index(end)+len(end)
          stripped=s[:i]+s[j:]
          assert stripped==before
          assert "5,500円" in s
          assert 'href="https://lin.ee/YxJGXV6D"' in s
          assert 'dpro-stay-line/owner.html?demo=1' in s

      - name: Commit R6 integration forward-only
        shell: bash
        run: |
          set -euo pipefail
          PRE_HEAD="$(cat "$RUNNER_TEMP/pre-head.txt")"
          git fetch origin main
          CURRENT_REMOTE="$(git rev-parse origin/main)"
          if [ "$CURRENT_REMOTE" != "$PRE_HEAD" ]; then
            echo "Product Site main advanced during this run; refusing stale write." >&2
            echo "PRE_HEAD=$PRE_HEAD" >&2
            echo "CURRENT_REMOTE=$CURRENT_REMOTE" >&2
            exit 42
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add systems/stay.html systems/stay.html.txt
          git commit -m "STAY R6 integrate Tutorial and manual resources"
          git push origin HEAD:main
          POST_HEAD="$(git rev-parse HEAD)"
          git merge-base --is-ancestor "$PRE_HEAD" "$POST_HEAD"
          printf '%s\n' "$POST_HEAD" > "$RUNNER_TEMP/post-head.txt"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright outside repository
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/stay-r6-qa"
          cd "$RUNNER_TEMP/stay-r6-qa"
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 --no-save
          npx playwright install --with-deps chromium

