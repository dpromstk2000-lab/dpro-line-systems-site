name: DPRO MEDICAL PRODUCT SITE V1.2 APPLY

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/dpro-medical-product-site-v1.2-apply.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply DPRO MEDICAL PRODUCT SITE V1.2
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64

          medical_b64 = ""
          Path("systems").mkdir(parents=True, exist_ok=True)
          Path("systems/medical.html").write_bytes(base64.b64decode(medical_b64))

          replacements = [
              ("DPRO LINE SYSTEMS。50の業種専用システム", "DPRO LINE SYSTEMS。51の業種専用システム"),
              ("DPRO LINE SYSTEMS｜50の業種別システム", "DPRO LINE SYSTEMS｜51の業種別システム"),
              ("50のDPROシステム", "51のDPROシステム"),
              ("50システム一覧", "51システム一覧"),
              ("50の完成DPROシステム", "51の完成DPROシステム"),
              ("50の業種別DPROシステム", "51の業種別DPROシステム"),
              ("50の業種別システム", "51の業種別システム"),
              ("50の業種専用DPROシステム", "51の業種専用DPROシステム"),
              ("data-p36-count>50<", "data-p36-count>51<"),
              ("data-p36-visible>50<", "data-p36-visible>51<"),
              ("<b>50</b> 業種別システム", "<b>51</b> 業種別システム"),
              ("50製品データを読み込み中", "51製品データを読み込み中"),
              ("50システムをすべて見る", "51システムをすべて見る"),
              ('"numberOfItems":50', '"numberOfItems":51'),
              ('"dateModified":"2026-08-14"', '"dateModified":"2026-08-18"'),
              ("systems-data.js?v=20260814-stage2", "systems-data.js?v=20260818-medical-v12"),
          ]

          for filename in ("index.html", "systems.html"):
              p = Path(filename)
              text = p.read_text(encoding="utf-8")
              for old, new in replacements:
                  text = text.replace(old, new)
              p.write_text(text, encoding="utf-8")

          checks = {
              "systems/medical.html": [
                  "PRODUCT SITE V1.2",
                  "30秒LIVE DEMO",
                  "PUBLIC DEMO SALES FINAL V1.1",
                  "https://dpromstk2000-lab.github.io/dpro-medical-standard/medical-public-demo.html",
              ],
              "index.html": [
                  "51の業種専用DPROシステム",
                  "51システムをすべて見る",
              ],
              "systems.html": [
                  "51システム一覧",
                  '"numberOfItems":51',
                  "51製品データを読み込み中",
              ],
          }
          for filename, needles in checks.items():
              text = Path(filename).read_text(encoding="utf-8")
              missing = [n for n in needles if n not in text]
              if missing:
                  raise SystemExit(f"QA FAILED {filename} missing={missing}")

          print("QA PASS: DPRO MEDICAL PRODUCT SITE V1.2")
          PY

      - name: Commit changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add systems/medical.html index.html systems.html
          git commit -m "DPRO MEDICAL PRODUCT SITE V1.2"
          git push
