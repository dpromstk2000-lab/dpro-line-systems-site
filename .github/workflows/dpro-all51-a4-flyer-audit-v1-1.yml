name: DPRO ALL51 A4 Flyer Audit V1.1

on:
  push:
    paths:
      - '.github/workflows/dpro-all51-a4-flyer-audit-v1-1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install PDF and image tools
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          python -m pip install --upgrade pip
          python -m pip install Pillow opencv-python-headless pypdf

      - name: Audit all 51 A4 flyer pairs
        shell: bash
        run: |
          set -euo pipefail
          rm -rf qa/all51-a4-flyer-audit-v1-1
          mkdir -p qa/all51-a4-flyer-audit-v1-1/renders qa/all51-a4-flyer-audit-v1-1/bottom-crops

          python - <<'PY'
          import re, csv, json, subprocess, math
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFont
          from pypdf import PdfReader
          import cv2

          ROOT = Path('.')
          OUT = Path('qa/all51-a4-flyer-audit-v1-1')
          REND = OUT / 'renders'
          BOTTOM = OUT / 'bottom-crops'
          EXPECTED = 51

          pdfs = sorted(ROOT.glob('flyer-*.pdf'))
          htmls = sorted(ROOT.glob('flyer-*.html'))
          pdf_stems = {p.stem for p in pdfs}
          html_stems = {p.stem for p in htmls}
          stems = sorted(pdf_stems | html_stems)

          def run(cmd):
              return subprocess.run(cmd, text=True, capture_output=True, check=False)

          def pdf_info(pdf_path):
              try:
                  reader = PdfReader(str(pdf_path))
                  pages = len(reader.pages)
                  if pages < 1:
                      return pages, 0.0, 0.0
                  page = reader.pages[0]
                  return pages, float(page.mediabox.width), float(page.mediabox.height)
              except Exception:
                  return -1, 0.0, 0.0

          def is_a4_portrait(w, h):
              return bool(w and h and h > w and abs(w - 595.28) <= 8 and abs(h - 841.89) <= 8)

          def qr_values(image_path):
              image = cv2.imread(str(image_path))
              if image is None:
                  return []
              det = cv2.QRCodeDetector()
              vals = []
              try:
                  ok, decoded, _, _ = det.detectAndDecodeMulti(image)
                  if ok and decoded:
                      vals.extend(v.strip() for v in decoded if v and v.strip())
              except Exception:
                  pass
              if not vals:
                  try:
                      value, _, _ = det.detectAndDecode(image)
                      if value and value.strip():
                          vals.append(value.strip())
                  except Exception:
                      pass
              return list(dict.fromkeys(vals))

          rows = []
          for stem in stems:
              pdf = ROOT / f'{stem}.pdf'
              html = ROOT / f'{stem}.html'
              pages, w, h = (-1, 0.0, 0.0)
              a4 = render_ok = html_a4 = False
              fixed_height_risk = absolute_footer_risk = False
              qr = []

              if html.exists():
                  text = html.read_text(encoding='utf-8', errors='ignore')
                  html_a4 = bool(
                      re.search(r'@page\s*\{[^}]*size\s*:\s*A4\s+portrait', text, re.I | re.S)
                      or ('width:210mm' in text and ('height:297mm' in text or 'min-height:297mm' in text))
                  )
                  fixed_height_risk = bool(
                      re.search(r'(?:\.sheet|\.page)\s*\{[^}]*height\s*:\s*297mm[^}]*overflow\s*:\s*hidden', text, re.I | re.S)
                  )
                  absolute_footer_risk = bool(
                      re.search(r'\.footer\s*\{[^}]*position\s*:\s*absolute[^}]*bottom\s*:\s*0', text, re.I | re.S)
                  )

              if pdf.exists():
                  pages, w, h = pdf_info(pdf)
                  a4 = is_a4_portrait(w, h)
                  png = REND / f'{stem}.png'
                  p = run(['pdftoppm','-f','1','-singlefile','-r','180','-png',str(pdf),str(png.with_suffix(''))])
                  render_ok = p.returncode == 0 and png.exists() and png.stat().st_size > 0

                  if render_ok:
                      qr = qr_values(png)
                      if not qr:
                          hi = OUT / f'_qr_{stem}.png'
                          p2 = run(['pdftoppm','-f','1','-singlefile','-r','300','-png',str(pdf),str(hi.with_suffix(''))])
                          if p2.returncode == 0 and hi.exists():
                              qr = qr_values(hi)
                              hi.unlink(missing_ok=True)

                      im = Image.open(png).convert('RGB')
                      y0 = int(im.height * 0.64)
                      im.crop((0, y0, im.width, im.height)).save(BOTTOM / f'{stem}.jpg', quality=90)

              fail = []
              if not html.exists() or not pdf.exists(): fail.append('pair-missing')
              if pages != 1: fail.append(f'pdf-pages={pages}')
              if not a4: fail.append('not-a4-portrait')
              if not render_ok: fail.append('render-failed')

              status = 'FAIL' if fail else 'PASS'
              notes = list(fail)
              if not html_a4: notes.append('html-a4-declaration-unclear')
              if not qr: notes.append('qr-machine-decode-zero')
              if fixed_height_risk and absolute_footer_risk:
                  notes.append('fixed-height+absolute-footer-risk')

              rows.append({
                  'flyer': stem,
                  'html_exists': html.exists(),
                  'pdf_exists': pdf.exists(),
                  'pdf_pages': pages,
                  'page_width_pt': round(w,2),
                  'page_height_pt': round(h,2),
                  'a4_portrait': a4,
                  'render_ok': render_ok,
                  'html_a4': html_a4,
                  'fixed_height_risk': fixed_height_risk,
                  'absolute_footer_risk': absolute_footer_risk,
                  'qr_decoded_count': len(qr),
                  'qr_values': ' | '.join(qr),
                  'auto_status': status,
                  'notes': '; '.join(notes),
              })

          fields = list(rows[0].keys())
          with (OUT/'AUDIT.csv').open('w',encoding='utf-8-sig',newline='') as f:
              wri = csv.DictWriter(f, fieldnames=fields)
              wri.writeheader(); wri.writerows(rows)

          (OUT/'AUDIT.json').write_text(json.dumps(rows,ensure_ascii=False,indent=2),encoding='utf-8')

          def sheets(paths, prefix, thumb, cols, rows_per):
              paths = [p for p in paths if p.exists()]
              per = cols * rows_per
              font = ImageFont.load_default()
              for si in range(math.ceil(len(paths)/per)):
                  batch = paths[si*per:(si+1)*per]
                  cw,ch = thumb[0]+24, thumb[1]+48
                  sh = Image.new('RGB',(cw*cols,ch*rows_per),'white')
                  d = ImageDraw.Draw(sh)
                  for i,p in enumerate(batch):
                      im = Image.open(p).convert('RGB')
                      im.thumbnail(thumb)
                      c=i%cols; r=i//cols
                      x=c*cw+(cw-im.width)//2; y=r*ch+4
                      sh.paste(im,(x,y))
                      d.text((c*cw+8,r*ch+thumb[1]+10),p.stem.replace('flyer-',''),fill='black',font=font)
                  sh.save(OUT/f'{prefix}_{si+1:02d}.jpg',quality=91)

          sheets([REND/f'{s}.png' for s in stems],'CONTACT_FULL',(350,495),5,2)
          sheets([BOTTOM/f'{s}.jpg' for s in stems],'CONTACT_BOTTOM',(350,195),5,5)

          fails=[r for r in rows if r['auto_status']=='FAIL']
          risks=[r for r in rows if r['fixed_height_risk'] and r['absolute_footer_risk']]
          qr0=[r for r in rows if r['qr_decoded_count']==0]

          summary=[
              '# DPRO ALL51 A4 FLYER AUDIT V1.1','',
              f'- flyer stems discovered: {len(stems)}',
              f'- HTML count: {len(htmls)}',
              f'- PDF count: {len(pdfs)}',
              f'- expected: {EXPECTED}',
              f'- AUTO PASS: {sum(r["auto_status"]=="PASS" for r in rows)}',
              f'- AUTO FAIL: {len(fails)}',
              f'- fixed-height + absolute-footer structural risk: {len(risks)}',
              f'- QR machine-decode zero: {len(qr0)}','',
              '## AUTO FAIL'
          ]
          summary += [f'- {r["flyer"]}: {r["notes"]}' for r in fails] or ['- NONE']
          summary += ['', '## STRUCTURAL OVERLAP RISK']
          summary += [f'- {r["flyer"]}' for r in risks] or ['- NONE']
          summary += ['', '## QR MACHINE-DECODE ZERO']
          summary += [f'- {r["flyer"]}' for r in qr0] or ['- NONE']
          summary += [
              '',
              'AUTO PASS means pair/A4/page-count/render integrity passed.',
              'Structural-risk entries are not automatically defective.',
              'Final visual verdict requires CONTACT_FULL and CONTACT_BOTTOM review.'
          ]
          (OUT/'SUMMARY.md').write_text('\n'.join(summary)+'\n',encoding='utf-8')
          print((OUT/'SUMMARY.md').read_text(encoding='utf-8'))

          if len(stems)!=EXPECTED or len(htmls)!=EXPECTED or len(pdfs)!=EXPECTED or fails:
              raise SystemExit(2)
          PY

      - name: Commit QA report to repository
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add qa/all51-a4-flyer-audit-v1-1
          if git diff --cached --quiet; then
            echo "No QA changes to commit."
          else
            git commit -m "Add ALL51 A4 flyer visual audit V1.1"
            git push origin HEAD:main
          fi
        continue-on-error: true

      - name: Upload audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DPRO_ALL51_A4_FLYER_AUDIT_V1.1
          path: qa/all51-a4-flyer-audit-v1-1/
          if-no-files-found: error
          retention-days: 14
