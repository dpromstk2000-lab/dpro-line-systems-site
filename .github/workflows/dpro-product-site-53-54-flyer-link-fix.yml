name: DPRO Product Site 53-54 Flyer Link Fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dpro-product-site-53-54-flyer-link-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dpro-product-site-53-54-flyer-link-fix
  cancel-in-progress: false

jobs:
  fix_flyer_links:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Drift guard
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object systems-data.js)" = "7b0c6e56a653e2114449b7b69ad9476a91603c75"
          echo "SYSTEMS_DATA_DRIFT=NONE"

      - name: Fix #53 and #54 flyer destinations
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('systems-data.js')
          s=p.read_text(encoding='utf-8')
          replacements={
            '"flyerHtml": "systems/landscape-exterior.html#documents"':
            '"flyerHtml": "https://dpromstk2000-lab.github.io/dpro-landscape-exterior-standard/a4-flyer.html"',
            '"flyerPdf": "https://dpromstk2000-lab.github.io/dpro-landscape-exterior-standard/DPRO_LANDSCAPE_EXTERIOR_A4_FLYER_V1.0_20260902.pdf"':
            '"flyerPdf": "https://dpromstk2000-lab.github.io/dpro-landscape-exterior-standard/DPRO_LANDSCAPE_EXTERIOR_A4_FLYER_MASTER_V2.0_20260904.pdf"',
            '"flyerHtml": "systems/pest-env.html#documents"':
            '"flyerHtml": "https://dpromstk2000-lab.github.io/dpro-pest-env-line/a4-flyer.html"',
          }
          for old,new in replacements.items():
              assert s.count(old)==1, old
              s=s.replace(old,new)
          p.write_text(s,encoding='utf-8')
          print('FLYER_LINK_PATCH=APPLIED')
          PY

      - name: Blocking QA
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '"flyerHtml": "https://dpromstk2000-lab.github.io/dpro-landscape-exterior-standard/a4-flyer.html"' systems-data.js
          grep -Fq '"flyerPdf": "https://dpromstk2000-lab.github.io/dpro-landscape-exterior-standard/DPRO_LANDSCAPE_EXTERIOR_A4_FLYER_MASTER_V2.0_20260904.pdf"' systems-data.js
          grep -Fq '"flyerHtml": "https://dpromstk2000-lab.github.io/dpro-pest-env-line/a4-flyer.html"' systems-data.js
          ! grep -Fq '"flyerHtml": "systems/landscape-exterior.html#documents"' systems-data.js
          ! grep -Fq '"flyerHtml": "systems/pest-env.html#documents"' systems-data.js
          node --check systems-data.js
          node --check product-v3.6.js
          echo "PRODUCT_53_FLYER=DIRECT_A4"
          echo "PRODUCT_54_FLYER=DIRECT_A4"

      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "DPRO CENTRAL"
          git config user.email "actions@users.noreply.github.com"
          git add systems-data.js
          git commit -m "fix: point products 53-54 to actual A4 flyers"
          git push origin HEAD:main

      - name: Remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin main
          git rm .github/workflows/dpro-product-site-53-54-flyer-link-fix.yml
          git commit -m "chore: remove temporary flyer link repair workflow"
          git push origin HEAD:main

      - name: Summary
        run: |
          echo "DPRO PRODUCT SITE FLYER LINK FIX=PASS"
          echo "#53=a4-flyer.html"
          echo "#54=a4-flyer.html"
