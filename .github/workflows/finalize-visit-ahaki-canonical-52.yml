name: Finalize DPRO PRODUCT SITE Canonical 52 Source V1.4
on:
  push:
    paths:
      - .github/workflows/finalize-visit-ahaki-canonical-52.yml
permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Staticize canonical 52 catalog and run regression QA
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, re, subprocess

          def node_catalog(path):
              js = r"""
          const fs=require('fs'), vm=require('vm');
          const ctx={console}; ctx.window=ctx; vm.createContext(ctx);
          vm.runInContext(fs.readFileSync(process.argv[1],'utf8'),ctx,{filename:process.argv[1]});
          if(!ctx.DPROSystemsData) throw new Error('DPROSystemsData unavailable');
          process.stdout.write(JSON.stringify({
            categories: ctx.DPROSystemsData.categories,
            systems: ctx.DPROSystemsData.systems,
            systemCount: ctx.DPROSystemsData.systemCount
          }));
          """
              return json.loads(subprocess.check_output(['node','-e',js,path], text=True))

          before = node_catalog('systems-data.js')
          systems = before['systems']
          categories = before['categories']

          assert len(systems) == 52, f"expected current 52, got {len(systems)}"
          assert len({x['code'] for x in systems}) == 52, "duplicate system code"
          assert any(x['code']=='MEDICAL' for x in systems), "MEDICAL missing"
          assert any(x['code']=='VISIT_AHAKI' for x in systems), "VISIT_AHAKI missing"
          old51 = [x for x in systems if x['code'] != 'VISIT_AHAKI']
          assert len(old51) == 51

          categories_json = json.dumps(categories, ensure_ascii=False, indent=2)
          systems_json = json.dumps(systems, ensure_ascii=False, indent=2)

          source = (
              "/* DPRO PRODUCT SITE V3.0 — CANONICAL 52 PRODUCT DATA\\n"
              " * CANONICAL SOURCE: 52 products / 2026-09-03\\n"
              " * DPRO 訪問マッサージ・鍼灸 is product #52.\\n"
              " * All 52 product records are statically defined in this file.\\n"
              " * No external 50/51-product runtime and no runtime catalog augmentation.\\n"
              " */\\n"
              "(function (global) {\\n"
              '  "use strict";\\n\\n'
              "  function deepFreeze(value) {\\n"
              '    if (!value || typeof value !== "object" || Object.isFrozen(value)) return value;\\n'
              "    Object.keys(value).forEach((key) => deepFreeze(value[key]));\\n"
              "    return Object.freeze(value);\\n"
              "  }\\n\\n"
              f"  const categories = deepFreeze({categories_json});\\n"
              f"  const systems = deepFreeze({systems_json});\\n"
              '  const byCode = new Map(systems.map(item => [String(item.code || "").toUpperCase(), item]));\\n\\n'
              "  global.DPROSystemsData = Object.freeze({\\n"
              "    categories,\\n"
              "    systems,\\n"
              "    systemCount: systems.length,\\n"
              "    getByCode(code) {\\n"
              '      return byCode.get(String(code == null ? "" : code).trim().toUpperCase()) || null;\\n'
              "    },\\n"
              "    getByCategory(category) {\\n"
              '      const key = String(category || "").trim();\\n'
              "      return systems.filter(item => item.category === key);\\n"
              "    }\\n"
              "  });\\n"
              '})(typeof window !== "undefined" ? window : globalThis);\\n'
          )
          Path('systems-data.js').write_text(source, encoding='utf-8')

          replacements = [
              ('51の業種別DPROシステム','52の業種別DPROシステム'),
              ('51の業種専用DPROシステム','52の業種専用DPROシステム'),
              ('51の業種別システム','52の業種別システム'),
              ('51件の業種別の導入例','52件の業種別の導入例'),
              ('51製品データを読み込み中','52製品データを読み込み中'),
              ('51システムをすべて見る','52システムをすべて見る'),
              ('51システム一覧','52システム一覧'),
              ('51の完成','52の完成'),
              ('51システム','52システム'),
              ('51製品','52製品'),
          ]
          def norm(s):
              for a,b in replacements:
                  s=s.replace(a,b)
              s=s.replace('<b>51</b> 業種別完成システム','<b>52</b> 業種別完成システム')
              # Canonical product-count normalization for all remaining central-copy forms.
              s=re.sub(r'51(?=(?:の?業種|製品|システム|件))','52',s)
              s=re.sub(r'(data-p36-visible[^>]*>)51(<)',r'\g<1>52\2',s)
              s=re.sub(r'(data-p36-count[^>]*>)51(<)',r'\g<1>52\2',s)
              return s

          def patch_jsonld(m):
              try:
                  obj=json.loads(m.group(2))
              except Exception:
                  return m.group(0)
              def walk(x):
                  if isinstance(x,dict):
                      for k,v in list(x.items()):
                          if k=='numberOfItems' and v in (50,51):
                              x[k]=52
                          elif isinstance(v,str):
                              x[k]=norm(v)
                          else:
                              walk(v)
                  elif isinstance(x,list):
                      for v in x:
                          walk(v)
              walk(obj)
              return m.group(1)+json.dumps(obj,ensure_ascii=False,separators=(',',':'))+m.group(3)

          for p in Path('.').rglob('*.html'):
              if '.github' in p.parts:
                  continue
              s=norm(p.read_text(encoding='utf-8'))
              s=re.sub(r'(<script type="application/ld\+json">)(.*?)(</script>)',patch_jsonld,s,flags=re.S)
              s=re.sub(r'systems-data\.js\?v=[^"]+','systems-data.js?v=20260903-canonical52',s)
              p.write_text(s,encoding='utf-8')

          from urllib.parse import urljoin
          base='https://dpromstk2000-lab.github.io/dpro-line-systems-site/'
          rels=['','systems.html','proposal.html','dpro-system.html']
          rels += [x.get('systemPage') for x in systems if x.get('systemPage')]
          seen=[]
          for r in rels:
              if r not in seen:
                  seen.append(r)
          lines=['<?xml version="1.0" encoding="UTF-8"?>',
                 '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">']
          for r in seen:
              url=base if r=='' else urljoin(base,r)
              lines.append(f'  <url><loc>{url}</loc><lastmod>2026-09-03</lastmod></url>')
          lines.append('</urlset>')
          Path('sitemap.xml').write_text('\n'.join(lines)+'\n',encoding='utf-8')

          idx=Path('index.html').read_text(encoding='utf-8')
          hub=Path('systems.html').read_text(encoding='utf-8')
          for name,s in [('index',idx),('systems',hub)]:
              assert '51の業種' not in s, f'{name}: stale 51業種'
              assert '51製品' not in s, f'{name}: stale 51製品'
              assert '51システム' not in s, f'{name}: stale 51システム'
              assert not re.search(r'51(?=(?:の?業種|製品|システム|件))', s), f'{name}: stale canonical product-count token'
          assert '<b>51</b> 業種別完成システム' not in idx
          assert re.search(r'data-p36-count[^>]*>52<',idx)
          assert re.search(r'data-p36-count[^>]*>52<',hub)
          assert re.search(r'data-p36-visible[^>]*>52<',hub)
          assert '"numberOfItems":52' in hub
          assert 'systems-data.js?v=20260903-canonical52' in idx or 'systems-data.js?v=20260903-canonical52' in hub
          assert 'systems/visit-ahaki.html' in Path('sitemap.xml').read_text(encoding='utf-8')

          subprocess.check_call(['node','--check','systems-data.js'])
          after=node_catalog('systems-data.js')
          assert after['systemCount']==52
          assert len(after['systems'])==52
          assert len({x['code'] for x in after['systems']})==52
          assert after['categories']==categories
          assert after['systems']==systems, 'staticization altered catalog records'
          after_by={x['code']:x for x in after['systems']}
          for old in old51:
              assert after_by.get(old['code'])==old, f"changed old product {old['code']}"
          src=Path('systems-data.js').read_text(encoding='utf-8')
          assert 'function addMedical' not in src
          assert 'function addVisitAhaki' not in src
          assert 'cdn.jsdelivr.net/gh/dpromstk2000-lab/dpro-line-systems-site@' not in src
          assert 'CANONICAL 52 PRODUCT DATA' in src
          med=sum(1 for x in systems if x.get('category')=='medical_pet')
          assert sum(1 for x in after['systems'] if x.get('category')=='medical_pet')==med

          print(f'PRODUCT_CANONICAL_52_FINAL_QA=PASS systems=52 medical_pet={med} old51_preserved=51/51 static_catalog=52')
          PY

      - name: Commit finalized canonical source
        shell: bash
        run: |
          rm -f .github/workflows/finalize-visit-ahaki-canonical-52.yml
          git config user.name "DPRO SYSTEM FACTORY"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Finalize DPRO PRODUCT SITE canonical 52 static catalog"
          git push
