name: DPRO Clinic Shuttle Flyer Master V2 R10

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/clinic-shuttle-flyer-master-v2-r10.yml"
      - ".github/workflows/clinic-shuttle-flyer-master-v2-r10.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dpro-clinic-shuttle-flyer-master-v2-r10
  cancel-in-progress: false

jobs:
  flyer-master-v2-r10:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout PRODUCT
        uses: actions/checkout@v4
        with:
          fetch-depth: 4

      - name: Guard PRODUCT SYSTEM FINAL LOCK and OFFICIAL
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "0167283f4918b7603b0287228dfd832c55da4ea4" || { echo "PRODUCT parent drift"; exit 1; }
          SYSTEM_HEAD="$(git ls-remote https://github.com/dpromstk2000-lab/dpro-clinic-shuttle-line.git refs/heads/main | awk '{print $1}')"
          test "$SYSTEM_HEAD" = "3fc09f4b5c6781d6038dc280de5c58752ce60b51" || { echo "SYSTEM FINAL LOCK drift"; exit 1; }
          OFFICIAL_HEAD="$(git ls-remote https://github.com/dpromstk2000-lab/dpro-shop-official-site.git refs/heads/main | awk '{print $1}')"
          test "$OFFICIAL_HEAD" = "b92a4d6444375aefc481db267d626c5a712164a5" || { echo "OFFICIAL head drift"; exit 1; }

      - name: Replace clinic shuttle flyer with A4 MASTER V2.0
        run: python .github/workflows/clinic-shuttle-flyer-master-v2-r10.py patch

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install flyer QA dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright pymupdf opencv-python-headless zxing-cpp numpy
          python -m playwright install --with-deps chromium

      - name: Build A4 PDF and screen evidence
        run: python .github/workflows/clinic-shuttle-flyer-master-v2-r10.py build

      - name: Verify final PDF and decode all QR codes
        run: python .github/workflows/clinic-shuttle-flyer-master-v2-r10.py pdfqa

      - name: Commit flyer HTML PDF and local QA evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flyer-clinic-shuttle.html flyer-clinic-shuttle.pdf assets/clinic-shuttle-next
          git commit -m "Replace clinic shuttle flyer with DPRO A4 MASTER V2"
          git push origin main

      - name: Public flyer QA
        run: python .github/workflows/clinic-shuttle-flyer-master-v2-r10.py publicqa

      - name: Commit public flyer QA evidence
        shell: bash
        run: |
          set -euo pipefail
          git add assets/clinic-shuttle-next
          git commit -m "Verify clinic shuttle A4 MASTER V2 flyer"
          git push origin main

      - name: Remove R10 one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin main
          git rm -f .github/workflows/clinic-shuttle-flyer-master-v2-r10.yml .github/workflows/clinic-shuttle-flyer-master-v2-r10.py
          git commit -m "Remove completed clinic shuttle flyer workflow"
          git push origin main
