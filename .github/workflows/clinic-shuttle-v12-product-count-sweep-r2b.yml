name: DPRO Clinic Shuttle V1.2 Product Count Sweep R2B

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/clinic-shuttle-v12-product-count-sweep-r2b.yml"
      - ".github/workflows/clinic-shuttle-v12-product-count-sweep-r2b.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dpro-clinic-shuttle-v12-product-count-sweep-r2b
  cancel-in-progress: false

jobs:
  product-count-sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout PRODUCT
        uses: actions/checkout@v4
        with:
          fetch-depth: 5

      - name: Guard PRODUCT and SYSTEM FINAL LOCK
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "f79c170776d6354166eb9dcc10468f971964a25d" || {
            echo "PRODUCT drift before R2B"; exit 1;
          }
          SYSTEM_HEAD="$(git ls-remote https://github.com/dpromstk2000-lab/dpro-clinic-shuttle-line.git refs/heads/main | awk '{print $1}')"
          test "$SYSTEM_HEAD" = "3fc09f4b5c6781d6038dc280de5c58752ce60b51" || {
            echo "SYSTEM FINAL LOCK drift: $SYSTEM_HEAD"; exit 1;
          }

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Preserve runner
        run: cp .github/workflows/clinic-shuttle-v12-product-count-sweep-r2b.py /tmp/clinic-shuttle-v12-r2b.py

      - name: Sweep public PRODUCT count facts to 55
        run: python /tmp/clinic-shuttle-v12-r2b.py patch

      - name: Commit count sweep and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- '*.html' '*.js' '*.css' '*.xml'
          git rm -f \
            .github/workflows/clinic-shuttle-v12-product-count-sweep-r2b.yml \
            .github/workflows/clinic-shuttle-v12-product-count-sweep-r2b.py
          git commit -m "Normalize PRODUCT public count facts to 55"
          FINAL_HEAD="$(git rev-parse HEAD)"
          echo "FINAL_PRODUCT_HEAD=$FINAL_HEAD" >> "$GITHUB_ENV"
          git push origin main

      - name: Install browser QA
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Verify PRODUCT Pages and public 55 facts
        run: python /tmp/clinic-shuttle-v12-r2b.py publicqa

      - name: Upload R2B evidence
        uses: actions/upload-artifact@v4
        with:
          name: clinic-shuttle-v12-product-count-sweep-r2b-evidence
          path: release-evidence-v12/
          if-no-files-found: error
          retention-days: 30
