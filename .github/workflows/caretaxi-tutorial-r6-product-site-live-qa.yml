name: CARETAXI Tutorial R6 Product Site + LIVE QA + FINAL LOCK Candidate

on:
  push:
    paths:
      - '.github/workflows/caretaxi-tutorial-r6-product-site-live-qa.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: caretaxi-tutorial-r6-product-site-live-qa
  cancel-in-progress: false

jobs:
  r6-product-site-live-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout newest Product Site main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Forward to newest main and verify R5 source
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          echo "PRODUCT_SITE_BEFORE=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

          rm -rf /tmp/dpro-caretaxi-line
          git clone --quiet https://github.com/dpromstk2000-lab/dpro-caretaxi-line.git /tmp/dpro-caretaxi-line
          git -C /tmp/dpro-caretaxi-line fetch origin main
          git -C /tmp/dpro-caretaxi-line reset --hard origin/main
          INDUSTRY_HEAD=$(git -C /tmp/dpro-caretaxi-line rev-parse HEAD)
          git -C /tmp/dpro-caretaxi-line merge-base --is-ancestor e41efd34ba791509486a561deb924563b243fc5b HEAD
          test -s /tmp/dpro-caretaxi-line/manuals/R5_QA.txt
          grep -q 'OVERALL PASS' /tmp/dpro-caretaxi-line/manuals/R5_QA.txt
          test -s /tmp/dpro-caretaxi-line/manuals/MANUAL_ASSET_MANIFEST.txt
          grep -q '29e3ed6fdaed2444bc1b1fbcbd34d68fcfe935b8d658112e8e13e812ca1d9413' /tmp/dpro-caretaxi-line/manuals/MANUAL_ASSET_MANIFEST.txt
          grep -q '81be7e2e0384844f936c2114017c26c7f1617e18375cf466286cf814151c5e54' /tmp/dpro-caretaxi-line/manuals/MANUAL_ASSET_MANIFEST.txt
          echo "INDUSTRY_HEAD=$INDUSTRY_HEAD" >> "$GITHUB_ENV"

      - name: Verify existing R6 Product Site integration
        shell: bash
        run: |
          set -euo pipefail
          test -s systems/caretaxi.html
          grep -q 'data-caretaxi-tutorial-r6="1"' systems/caretaxi.html
          test "$(grep -o 'data-caretaxi-tutorial-r6="1"' systems/caretaxi.html | wc -l)" -eq 1
          grep -q '/dpro-caretaxi-line/guide-center.html#start' systems/caretaxi.html
          grep -q 'DPRO_TUTORIAL_CARETAXI_QUICK_START_V1.0.pdf' systems/caretaxi.html
          grep -q 'DPRO_TUTORIAL_CARETAXI_DETAILED_MANUAL_V1.0.pdf' systems/caretaxi.html
          grep -q '5,500円' systems/caretaxi.html
          grep -q 'https://lin.ee/YxJGXV6D' systems/caretaxi.html
          grep -q 'owner-ipad.html?demo=1' systems/caretaxi.html
          if test -f systems/caretaxi.html.txt; then cmp -s systems/caretaxi.html systems/caretaxi.html.txt; fi
          echo 'Existing R6 Product Site integration: PASS'

      - name: Wait until Product Site Pages contains R6 marker
        shell: bash
        run: |
          set -euo pipefail
          URL='https://dpromstk2000-lab.github.io/dpro-line-systems-site/systems/caretaxi.html'
          ok=0
          for i in $(seq 1 60); do
            body=$(curl -fsSL --retry 2 --connect-timeout 10 "${URL}?r=${GITHUB_RUN_ID}-${i}" || true)
            if printf '%s' "$body" | grep -q 'data-caretaxi-tutorial-r6="1"'; then ok=1; break; fi
            sleep 5
          done
          test "$ok" -eq 1
          echo 'Product Site Pages R6 marker: PASS'

      - name: Setup Node and Playwright
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run corrected R6 browser LIVE QA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .r6tmp/screens
          cat > .r6tmp/r6-live-qa.mjs <<'JS'
          import { chromium, request } from 'playwright';
          import fs from 'fs';

          const PRODUCT='https://dpromstk2000-lab.github.io/dpro-line-systems-site/systems/caretaxi.html';
          const INDUSTRY='https://dpromstk2000-lab.github.io/dpro-caretaxi-line/';
          const GUIDE=INDUSTRY+'guide-center.html';
          const GUIDE_START=GUIDE+'#start';
          const QUICK=INDUSTRY+'manuals/DPRO_TUTORIAL_CARETAXI_QUICK_START_V1.0.pdf';
          const DETAIL=INDUSTRY+'manuals/DPRO_TUTORIAL_CARETAXI_DETAILED_MANUAL_V1.0.pdf';
          const QUICK_PNG=INDUSTRY+'manuals/DPRO_TUTORIAL_CARETAXI_QUICK_START_V1.0.png';
          const DETAIL_PNG=INDUSTRY+'manuals/DPRO_TUTORIAL_CARETAXI_DETAILED_MANUAL_V1.0.png';

          const api=await request.newContext();
          const http={};
          for (const u of [INDUSTRY,GUIDE,QUICK,DETAIL,QUICK_PNG,DETAIL_PNG,PRODUCT]) {
            const r=await api.get(u,{timeout:60000});
            http[u]=r.status();
            if(r.status()>=400) throw new Error(`HTTP ${r.status()} ${u}`);
          }
          await api.dispose();

          async function waitTutorialImages(root) {
            const images=root.locator('img');
            const count=await images.count();
            if(count!==2) throw new Error(`tutorial preview image count ${count}`);
            for(let i=0;i<count;i++) {
              const im=images.nth(i);
              await im.scrollIntoViewIfNeeded();
              await im.evaluate(el => {
                if(el.complete && el.naturalWidth>=100) return true;
                return new Promise((resolve,reject) => {
                  const timer=setTimeout(()=>reject(new Error(`image load timeout: ${el.src}`)),15000);
                  const done=()=>{clearTimeout(timer);resolve(true)};
                  const fail=()=>{clearTimeout(timer);reject(new Error(`image load error: ${el.src}`))};
                  el.addEventListener('load',done,{once:true});
                  el.addEventListener('error',fail,{once:true});
                });
              });
            }
            await root.scrollIntoViewIfNeeded();
          }

          const browser=await chromium.launch({headless:true});
          const productResults=[];
          const guideResults=[];
          const mutations=[];

          for (const [name,width,height] of [['1440',1440,900],['1024',1024,768],['390',390,844],['320',320,720]]) {
            const context=await browser.newContext({viewport:{width,height},deviceScaleFactor:1});
            const page=await context.newPage();
            const errors=[];
            page.on('console',m=>{if(m.type()==='error')errors.push(m.text())});
            page.on('pageerror',e=>errors.push(String(e)));
            page.on('request',r=>{const m=r.method().toUpperCase();if(!['GET','HEAD','OPTIONS'].includes(m))mutations.push({page:'product-'+name,method:m,url:r.url()})});

            const resp=await page.goto(PRODUCT+'?r='+Date.now(),{waitUntil:'domcontentloaded',timeout:60000});
            if(!resp||resp.status()>=400) throw new Error(`Product ${name} HTTP ${resp?.status()}`);
            await page.waitForTimeout(700);

            const root=page.locator('[data-caretaxi-tutorial-r6="1"]');
            if(await root.count()!==1) throw new Error(`R6 marker count invalid ${name}`);
            await root.scrollIntoViewIfNeeded();
            await waitTutorialImages(root);
            await page.waitForTimeout(250);

            const result=await root.evaluate(el=>{
              const links=[...el.querySelectorAll('a')].map(a=>({key:a.dataset.r6Link||'',href:a.href,text:(a.textContent||'').trim()}));
              const imgs=[...el.querySelectorAll('img')].map(i=>({src:i.src,complete:i.complete,naturalWidth:i.naturalWidth,alt:i.alt,loading:i.loading}));
              const d=document.documentElement;
              return {links,imgs,scrollWidth:d.scrollWidth,clientWidth:d.clientWidth};
            });

            const linkMap=Object.fromEntries(result.links.map(x=>[x.key,x.href]));
            const expectedLinks={
              guide:GUIDE_START,
              'first10-start':GUIDE_START,
              'first10-resume':GUIDE_START,
              'first10-replay':GUIDE_START,
              'quick-pdf':QUICK,
              'detail-pdf':DETAIL
            };
            for(const [k,v] of Object.entries(expectedLinks)) {
              if(linkMap[k]!==v) throw new Error(`link mismatch ${name} ${k}: ${linkMap[k]} != ${v}`);
            }
            const imgSrcs=new Set(result.imgs.map(x=>x.src));
            if(!imgSrcs.has(QUICK_PNG)||!imgSrcs.has(DETAIL_PNG)) throw new Error(`preview src mismatch ${name}`);
            for(const im of result.imgs) if(!im.complete||im.naturalWidth<100||!im.alt) throw new Error(`preview image invalid ${JSON.stringify(im)}`);
            if((width===390||width===320)&&result.scrollWidth>result.clientWidth+1) throw new Error(`horizontal overflow ${name}: ${result.scrollWidth}/${result.clientWidth}`);

            const focusLink=root.locator('a').first();
            await focusLink.focus();
            await page.keyboard.press('Shift+Tab');
            await page.keyboard.press('Tab');
            const focus=await focusLink.evaluate(el=>{const s=getComputedStyle(el);return {active:document.activeElement===el,outlineStyle:s.outlineStyle,outlineWidth:s.outlineWidth,outlineColor:s.outlineColor}});
            if(!focus.active||focus.outlineStyle==='none'||focus.outlineWidth==='0px') throw new Error(`keyboard focus not visible ${name} ${JSON.stringify(focus)}`);
            if(errors.length) throw new Error(`console/page errors ${name}: ${JSON.stringify(errors)}`);

            await page.screenshot({path:`.r6tmp/screens/product-${name}.png`,fullPage:false});
            productResults.push({name,width,height,result,focus,errors});
            await context.close();
          }

          for (const [name,width,height] of [['1440',1440,900],['390',390,844],['320',320,720]]) {
            const context=await browser.newContext({viewport:{width,height},deviceScaleFactor:1});
            const page=await context.newPage();
            const errors=[]; const localMut=[];
            page.on('console',m=>{if(m.type()==='error')errors.push(m.text())});
            page.on('pageerror',e=>errors.push(String(e)));
            page.on('request',r=>{const m=r.method().toUpperCase();if(!['GET','HEAD','OPTIONS'].includes(m)){localMut.push({method:m,url:r.url()});mutations.push({page:'guide-'+name,method:m,url:r.url()})}});

            const resp=await page.goto(GUIDE,{waitUntil:'domcontentloaded',timeout:60000});
            if(!resp||resp.status()>=400) throw new Error(`Guide ${name} HTTP ${resp?.status()}`);
            await page.waitForTimeout(800);
            for(const id of ['#first10Resume','#first10Replay']) if(await page.locator(id).count()!==1) throw new Error(`First10 control missing ${id}`);
            await page.locator('#first10Replay').click();
            await page.waitForTimeout(700);

            const dims=await page.evaluate(()=>({scrollWidth:document.documentElement.scrollWidth,clientWidth:document.documentElement.clientWidth}));
            if((width===390||width===320)&&dims.scrollWidth>dims.clientWidth+1) throw new Error(`Guide overflow ${name}: ${dims.scrollWidth}/${dims.clientWidth}`);
            if(errors.length) throw new Error(`Guide console/page errors ${name}: ${JSON.stringify(errors)}`);
            if(localMut.length) throw new Error(`Guide business mutation detected ${JSON.stringify(localMut)}`);
            guideResults.push({name,width,height,dims,errors,mutations:localMut});
            await context.close();
          }

          await browser.close();
          if(mutations.length) throw new Error(`BUSINESS_MUTATION ${JSON.stringify(mutations)}`);
          fs.writeFileSync('.r6tmp/r6-browser-qa.json',JSON.stringify({http,productResults,guideResults,businessMutation:0},null,2));
          console.log('R6 BROWSER LIVE QA PASS');
          console.log('VIEWPORTS PASS: 1440 / 1024 / 390 / 320');
          console.log('R3/R4 FIRST10 GUIDE REGRESSION PASS');
          console.log('BUSINESS MUTATION = 0');
          JS
          node .r6tmp/r6-live-qa.mjs

      - name: Setup Python PDF and QR QA
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PDF and QR QA dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libzbar0
          python -m pip install --upgrade pip
          python -m pip install PyMuPDF pillow pyzbar

      - name: Re-download public manuals and verify PDF QR exact match
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .r6tmp/manuals
          curl -fsSL --retry 3 -o .r6tmp/manuals/quick.pdf 'https://dpromstk2000-lab.github.io/dpro-caretaxi-line/manuals/DPRO_TUTORIAL_CARETAXI_QUICK_START_V1.0.pdf'
          curl -fsSL --retry 3 -o .r6tmp/manuals/detail.pdf 'https://dpromstk2000-lab.github.io/dpro-caretaxi-line/manuals/DPRO_TUTORIAL_CARETAXI_DETAILED_MANUAL_V1.0.pdf'
          curl -fsSL --retry 3 -o .r6tmp/manuals/quick.png 'https://dpromstk2000-lab.github.io/dpro-caretaxi-line/manuals/DPRO_TUTORIAL_CARETAXI_QUICK_START_V1.0.png'
          curl -fsSL --retry 3 -o .r6tmp/manuals/detail.png 'https://dpromstk2000-lab.github.io/dpro-caretaxi-line/manuals/DPRO_TUTORIAL_CARETAXI_DETAILED_MANUAL_V1.0.png'

          printf '%s  %s\n' '29e3ed6fdaed2444bc1b1fbcbd34d68fcfe935b8d658112e8e13e812ca1d9413' '.r6tmp/manuals/quick.pdf' | sha256sum -c -
          printf '%s  %s\n' '81be7e2e0384844f936c2114017c26c7f1617e18375cf466286cf814151c5e54' '.r6tmp/manuals/detail.pdf' | sha256sum -c -
          printf '%s  %s\n' 'ad2a49de59bd933d8e9b66f2ff14e656d6c4b944155b26808b426789f874c693' '.r6tmp/manuals/quick.png' | sha256sum -c -
          printf '%s  %s\n' '10e002ccffb44eca300975226e4e9a3873f7a58979fc952858a1f485f4d9357b' '.r6tmp/manuals/detail.png' | sha256sum -c -

          python - <<'PY'
          from pathlib import Path
          import json
          import fitz
          from PIL import Image
          from pyzbar.pyzbar import decode

          root=Path('.r6tmp/manuals')
          tmp=Path('.r6tmp/qr-render')
          tmp.mkdir(parents=True,exist_ok=True)
          GUIDE='https://dpromstk2000-lab.github.io/dpro-caretaxi-line/guide-center.html'
          DEMO='https://dpromstk2000-lab.github.io/dpro-caretaxi-line/demo-guide.html'
          results={}

          for name,expected_min,required in [
              ('quick.pdf',2,{GUIDE}),
              ('detail.pdf',7,{GUIDE,DEMO}),
          ]:
              doc=fitz.open(root/name)
              assert len(doc)>=expected_min,(name,len(doc))
              values=set()
              for i,page in enumerate(doc):
                  r=page.rect
                  assert r.height>r.width,(name,i,r)
                  assert abs(r.width-595.276)<2 and abs(r.height-841.89)<2,(name,i,r)
                  pix=page.get_pixmap(matrix=fitz.Matrix(2.0,2.0),alpha=False)
                  out=tmp/f'{name}-{i+1:02d}.png'
                  pix.save(out)
                  for code in decode(Image.open(out)):
                      try: values.add(code.data.decode('utf-8'))
                      except Exception: pass
              doc.close()
              assert required.issubset(values),(name,required,values)
              results[name]={'pages':len(fitz.open(root/name)),'qr_values':sorted(values),'required':sorted(required),'status':'PASS'}

          Path('.r6tmp/r6-manual-qa.json').write_text(json.dumps(results,ensure_ascii=False,indent=2),encoding='utf-8')
          print('R6 PUBLIC PDF/QR QA PASS')
          print(json.dumps(results,ensure_ascii=False,indent=2))
          PY

      - name: Re-fetch final heads and write R6 evidence
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git pull --rebase origin main
          grep -q 'data-caretaxi-tutorial-r6="1"' systems/caretaxi.html
          if test -f systems/caretaxi.html.txt; then cmp -s systems/caretaxi.html systems/caretaxi.html.txt; fi

          git -C /tmp/dpro-caretaxi-line fetch origin main
          git -C /tmp/dpro-caretaxi-line reset --hard origin/main
          FINAL_INDUSTRY_HEAD=$(git -C /tmp/dpro-caretaxi-line rev-parse HEAD)
          PRODUCT_HEAD_BEFORE_EVIDENCE=$(git rev-parse HEAD)
          mkdir -p tutorial/r6/caretaxi
          cp .r6tmp/r6-browser-qa.json tutorial/r6/caretaxi/R6_BROWSER_LIVE_QA.json
          cp .r6tmp/r6-manual-qa.json tutorial/r6/caretaxi/R6_PUBLIC_MANUAL_QA.json

          cat > tutorial/r6/caretaxi/R6_PRODUCT_SITE_LIVE_QA.txt <<EOF
          DPRO TUTORIAL BATCH-03 CARETAXI
          R6 PRODUCT SITE + LIVE QA
          Date: 2026-08-27

          RESULT
          PASS Product Site R6 Tutorial section published
          PASS Product Site Pages R6 marker
          PASS Guide Center / First10 links
          PASS Quick Start PDF link
          PASS Detailed Manual PDF link
          PASS Quick / Detailed preview images after lazy-load wait
          PASS 1440 / 1024 / 390 / 320 viewport QA
          PASS 390 / 320 horizontal overflow = 0
          PASS focus visible
          PASS console/page errors = 0
          PASS R3/R4 First10 regression
          PASS public PDF SHA256 exact match to R5
          PASS public PDF rendered QR exact match
          PASS businessMutation = 0
          PASS DB/Worker/API/Auth/Role/Permission/Feature Flag Tutorial changes = 0

          PUBLIC URL
          https://dpromstk2000-lab.github.io/dpro-line-systems-site/systems/caretaxi.html

          GUIDE URL
          https://dpromstk2000-lab.github.io/dpro-caretaxi-line/guide-center.html

          SOURCE
          industry HEAD: ${FINAL_INDUSTRY_HEAD}
          Product Site HEAD before evidence: ${PRODUCT_HEAD_BEFORE_EVIDENCE}

          OVERALL PASS
          EOF

          cat > tutorial/r6/caretaxi/R6_FINAL_LOCK_CANDIDATE.txt <<EOF
          DPRO TUTORIAL BATCH-03 CARETAXI
          R6 FINAL LOCK CANDIDATE
          Date: 2026-08-27

          STATUS: FINAL LOCK CANDIDATE
          R5 PRINT MANUALS: PASS
          R6 PRODUCT SITE: PASS
          R6 LIVE QA: PASS
          BUSINESS MUTATION: 0
          EXISTING BUSINESS UI/PRICE/CTA: PRESERVED
          R7: NOT STARTED / DO NOT START

          INDUSTRY HEAD: ${FINAL_INDUSTRY_HEAD}
          PRODUCT SITE HEAD BEFORE EVIDENCE: ${PRODUCT_HEAD_BEFORE_EVIDENCE}
          EOF

          echo "FINAL_INDUSTRY_HEAD=$FINAL_INDUSTRY_HEAD" >> "$GITHUB_ENV"
          echo "PRODUCT_HEAD_BEFORE_EVIDENCE=$PRODUCT_HEAD_BEFORE_EVIDENCE" >> "$GITHUB_ENV"

      - name: Commit R6 QA evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tutorial/r6/caretaxi/
          if git diff --cached --quiet; then
            echo 'R6 evidence already current.'
          else
            git commit -m 'Add CARETAXI Tutorial R6 LIVE QA evidence [skip actions]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
          FINAL_PRODUCT_HEAD=$(git rev-parse HEAD)
          echo "FINAL_PRODUCT_HEAD=$FINAL_PRODUCT_HEAD" >> "$GITHUB_ENV"

      - name: R6 FINAL LOCK candidate summary
        shell: bash
        run: |
          set -euo pipefail
          echo '## CARETAXI Tutorial R6' >> "$GITHUB_STEP_SUMMARY"
          echo '- R5 Print Manuals: PASS' >> "$GITHUB_STEP_SUMMARY"
          echo '- R6 Product Site publish: PASS' >> "$GITHUB_STEP_SUMMARY"
          echo '- R6 browser LIVE QA 1440/1024/390/320: PASS' >> "$GITHUB_STEP_SUMMARY"
          echo '- lazy-loaded manual previews: PASS after explicit viewport/load wait' >> "$GITHUB_STEP_SUMMARY"
          echo '- public PDF SHA256 + QR exact-match: PASS' >> "$GITHUB_STEP_SUMMARY"
          echo '- R3/R4 First10 regression: PASS' >> "$GITHUB_STEP_SUMMARY"
          echo '- businessMutation: 0' >> "$GITHUB_STEP_SUMMARY"
          echo "- CARETAXI HEAD: ${FINAL_INDUSTRY_HEAD}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Product Site final HEAD: ${FINAL_PRODUCT_HEAD}" >> "$GITHUB_STEP_SUMMARY"
          echo '- FINAL LOCK: CANDIDATE' >> "$GITHUB_STEP_SUMMARY"
          echo '- R7: NOT STARTED' >> "$GITHUB_STEP_SUMMARY"
