name: STEP GYM-NEXT-11B-PRODUCT-SITE-CLEANUP-R3 - Complete Ledger

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/GYM-NEXT-11B-PRODUCT-SITE-CLEANUP-R3.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: gym-next-11b-product-site-cleanup-r3
  cancel-in-progress: false

env:
  WORKFLOW_FILE: .github/workflows/GYM-NEXT-11B-PRODUCT-SITE-CLEANUP-R3.yml
  STALE_WORKFLOW_FILE_R1: .github/workflows/GYM-NEXT-11B-PRODUCT-SITE-CLEANUP.yml
  STALE_WORKFLOW_FILE_R2: .github/workflows/GYM-NEXT-11B-PRODUCT-SITE-CLEANUP-R2.yml
  PRODUCT_PAGE: systems/gym.html
  COMPLETION_YML: dpro-next/gym/GYM-NEXT-COMPLETE.yml
  COMPLETION_MD: dpro-next/gym/GYM-NEXT-COMPLETE.md
  BACKUP_TAG: backup-product-site-before-gym-next-11b-20260726
  PRODUCT_SITE_BASE: https://dpromstk2000-lab.github.io/dpro-line-systems-site
  SOURCE_LEDGER_RAW: https://raw.githubusercontent.com/dpromstk2000-lab/liff-gym-demo/main/dpro-next/gym/next-ledger.yml
  EXPECTED_PRODUCT_COMMIT: e52e93902aad4ecf7a9c49a1492ed7162767efcd
  EXPECTED_PRODUCT_PAGE_BLOB: 4691b35ebf48b61efe820a87cbc91eee040eac43
  EXPECTED_OLD_PRODUCT_PAGE_BLOB: e29c23ab246d13c6179b34bf6f0a27331101b2d1
  EXPECTED_COMPLETION_YML_BLOB: ae50bc278cea0017240950658791a50fe560fbf8
  EXPECTED_COMPLETION_MD_BLOB: 802b1969245f08c4c3b4de3ba967493cb0a53254
  EXPECTED_SOURCE_DELIVERY_COMMIT: 548e6f8548db82e13cfdecf6bc952624b3d24926
  EXPECTED_PDF_SHA256: 0581ba706fed52de0c508548faaf9b2ab0f65aded36796dd9c0d96949bc0fc8f
  EXPECTED_PNG_SHA256: d27b5fd48dec81cf1099c8a37b8d6e59cb5a0eb0bf191727e66feb3120ceb103
  FAILED_R1_RUN_URL: https://github.com/dpromstk2000-lab/dpro-line-systems-site/actions/runs/30187172268
  FAILED_R2_RUN_URL: https://github.com/dpromstk2000-lab/dpro-line-systems-site/actions/runs/30187402729

jobs:
  complete-ledger:
    name: Verify published cleanup and complete final record
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout product site with complete history
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install YAML validator
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check \
            pyyaml==6.0.2

      - name: Configure Git identity
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "DPRO NEXT Actions"
          git config user.email "actions@users.noreply.github.com"

      - name: Confirm committed product cleanup and safe upload
        shell: bash
        run: |
          set -euo pipefail

          [[ "${GITHUB_REPOSITORY}" == "dpromstk2000-lab/dpro-line-systems-site" ]] || {
            echo "::error::This YML must run in dpromstk2000-lab/dpro-line-systems-site."
            exit 1
          }

          test -f "${WORKFLOW_FILE}"
          test -f "${STALE_WORKFLOW_FILE_R1}"
          test -f "${STALE_WORKFLOW_FILE_R2}"
          test -f "${PRODUCT_PAGE}"
          test -f "${COMPLETION_YML}"
          test -f "${COMPLETION_MD}"

          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            UPLOAD_PARENT_SHA="$(git rev-parse "${GITHUB_SHA}^")"
            UNEXPECTED="$(
              git diff --name-only "${UPLOAD_PARENT_SHA}" "${GITHUB_SHA}" |
                grep -v -F -x "${WORKFLOW_FILE}" |
                sed '/^$/d' || true
            )"
            [[ -z "${UNEXPECTED}" ]] || {
              echo "::error::Upload commit must contain only ${WORKFLOW_FILE}."
              echo "${UNEXPECTED}"
              exit 1
            }
          else
            UPLOAD_PARENT_SHA="$(git rev-parse HEAD)"
          fi

          [[ "${UPLOAD_PARENT_SHA}" == "${EXPECTED_PRODUCT_COMMIT}" ]] || {
            echo "::error::Expected the committed NEXT-11B product cleanup."
            echo "Expected: ${EXPECTED_PRODUCT_COMMIT}"
            echo "Actual:   ${UPLOAD_PARENT_SHA}"
            exit 1
          }

          [[ "$(git hash-object "${PRODUCT_PAGE}")" == "${EXPECTED_PRODUCT_PAGE_BLOB}" ]]
          [[ "$(git hash-object "${COMPLETION_YML}")" == "${EXPECTED_COMPLETION_YML_BLOB}" ]]
          [[ "$(git hash-object "${COMPLETION_MD}")" == "${EXPECTED_COMPLETION_MD_BLOB}" ]]

          git fetch --tags --force
          git show-ref --tags --verify --quiet "refs/tags/${BACKUP_TAG}"
          BACKUP_COMMIT="$(git rev-list -n 1 "${BACKUP_TAG}")"
          git merge-base --is-ancestor \
            "${BACKUP_COMMIT}" \
            "${EXPECTED_PRODUCT_COMMIT}"

          OLD_PRODUCT_BLOB="$(
            git show "${BACKUP_COMMIT}:${PRODUCT_PAGE}" |
              git hash-object --stdin
          )"
          [[ "${OLD_PRODUCT_BLOB}" == "${EXPECTED_OLD_PRODUCT_PAGE_BLOB}" ]] || {
            echo "::error::Backup tag does not preserve the inspected old product page."
            exit 1
          }

          mkdir -p /tmp/gym-next-11b-r3/source
          curl --fail --location --silent --show-error \
            --retry 5 --retry-delay 2 --max-time 45 \
            -o /tmp/gym-next-11b-r3/source/next-ledger.yml \
            "${SOURCE_LEDGER_RAW}?run=${GITHUB_RUN_ID}"

          CURRENT_STEP="$(
            sed -n 's/^current_step:[[:space:]]*//p' \
              /tmp/gym-next-11b-r3/source/next-ledger.yml |
              head -n 1 | tr -d '"\r'
          )"
          NEXT_STEP="$(
            sed -n 's/^next_step:[[:space:]]*//p' \
              /tmp/gym-next-11b-r3/source/next-ledger.yml |
              head -n 1 | tr -d '"\r'
          )"
          RESULT="$(
            sed -n 's/^result:[[:space:]]*//p' \
              /tmp/gym-next-11b-r3/source/next-ledger.yml |
              head -n 1 | tr -d '"\r'
          )"
          DELIVERY_COMMIT="$(
            sed -n 's/^delivery_commit_sha:[[:space:]]*//p' \
              /tmp/gym-next-11b-r3/source/next-ledger.yml |
              head -n 1 | tr -d '"\r'
          )"

          [[ "${CURRENT_STEP}" == "GYM-NEXT-11A-COMPLETE" ]]
          [[ "${NEXT_STEP}" == "GYM-NEXT-11B-PRODUCT-SITE-CLEANUP" ]]
          [[ "${RESULT}" == "OK" ]]
          [[ "${DELIVERY_COMMIT}" == "${EXPECTED_SOURCE_DELIVERY_COMMIT}" ]]

          grep -Fq 'owner_facing_screen_count: 5' \
            /tmp/gym-next-11b-r3/source/next-ledger.yml
          grep -Fq 'owner_facing_qr_count: 5' \
            /tmp/gym-next-11b-r3/source/next-ledger.yml
          grep -Fq 'qr_exact_url_match_count: 5' \
            /tmp/gym-next-11b-r3/source/next-ledger.yml
          grep -Fq 'system_check_exposed: false' \
            /tmp/gym-next-11b-r3/source/next-ledger.yml
          grep -Fq 'system_check_html_preserved: true' \
            /tmp/gym-next-11b-r3/source/next-ledger.yml

          echo "BACKUP_COMMIT=${BACKUP_COMMIT}" >> "$GITHUB_ENV"
          echo "RUN_URL=https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >> "$GITHUB_ENV"

      - name: Verify cleaned product HTML and unchanged shared files
        shell: bash
        run: |
          set -euo pipefail

          STYLE_BLOB="$(git hash-object styles.css)"
          SCRIPT_BLOB="$(git hash-object script.js)"
          CATALOG_BLOB="$(git hash-object systems.html)"

          git diff --quiet
          git diff --cached --quiet

          grep -Fq '<!-- STEP GYM-NEXT-11B / OWNER MATERIAL CLEANUP COMPLETE / 20260726 -->' \
            "${PRODUCT_PAGE}"
          grep -Fq 'data-dpro-next-step="GYM-NEXT-11B"' "${PRODUCT_PAGE}"
          grep -Fq 'GYM NEXT-11 COMPLETE' "${PRODUCT_PAGE}"
          grep -Fq '実画面 5画面' "${PRODUCT_PAGE}"
          grep -Fq 'QR読取 5 / 5' "${PRODUCT_PAGE}"
          grep -Fq 'URL完全一致 5 / 5' "${PRODUCT_PAGE}"
          grep -Fq '>5画面をWebで見る<' "${PRODUCT_PAGE}"
          grep -Fq 'PC管理・継続フォロー' "${PRODUCT_PAGE}"

          if grep -Eqi 'system-check|system check|営業前' "${PRODUCT_PAGE}"; then
            echo "::error::Product page still exposes owner-facing system-check."
            exit 1
          fi

          python3 <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import json
          import re

          class Parser(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.ids = []

              def handle_starttag(self, tag, attrs):
                  data = dict(attrs)
                  if data.get("id"):
                      self.ids.append(data["id"])

              def handle_startendtag(self, tag, attrs):
                  self.handle_starttag(tag, attrs)

          path = Path("systems/gym.html")
          html = path.read_text(encoding="utf-8")
          parser = Parser()
          parser.feed(html)

          duplicates = sorted({
              value
              for value in parser.ids
              if parser.ids.count(value) > 1
          })
          assert not duplicates, duplicates
          assert html.count(
              'class="product-feature reveal"'
          ) == 7
          assert html.count(
              'data-dpro-next-step="GYM-NEXT-11B"'
          ) == 1
          assert not re.search(r"[ \t]+$", html, flags=re.M)
          assert html.endswith("\n")
          assert not html.endswith("\n\n")

          Path(
              "/tmp/gym-next-11b-r3/html-validation.json"
          ).write_text(
              json.dumps(
                  {
                      "ok": True,
                      "step": "GYM-NEXT-11B-R3",
                      "product_page_blob": (
                          "4691b35ebf48b61efe820a87cbc91eee040eac43"
                      ),
                      "feature_card_count": 7,
                      "owner_facing_screen_count": 5,
                      "owner_facing_qr_count": 5,
                      "system_check_owner_facing": False,
                      "duplicate_ids": duplicates,
                  },
                  ensure_ascii=False,
                  indent=2,
              ) + "\n",
              encoding="utf-8",
          )
          PY

          [[ "$(git hash-object styles.css)" == "${STYLE_BLOB}" ]]
          [[ "$(git hash-object script.js)" == "${SCRIPT_BLOB}" ]]
          [[ "$(git hash-object systems.html)" == "${CATALOG_BLOB}" ]]

      - name: Verify published cleaned product page
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/gym-next-11b-r3/public
          PUBLIC_FILE=/tmp/gym-next-11b-r3/public/gym.html

          for attempt in $(seq 1 36); do
            HTTP_CODE="$(
              curl --location --silent --show-error \
                --connect-timeout 15 \
                --max-time 30 \
                --header 'Cache-Control: no-cache' \
                --header 'Pragma: no-cache' \
                --output "${PUBLIC_FILE}" \
                --write-out '%{http_code}' \
                "${PRODUCT_SITE_BASE}/systems/gym.html?v=${EXPECTED_PRODUCT_COMMIT}-${GITHUB_RUN_ID}-${attempt}" || true
            )"

            MARKER="old-or-empty"
            if [[ -s "${PUBLIC_FILE}" ]] &&
               grep -Fq 'data-dpro-next-step="GYM-NEXT-11B"' "${PUBLIC_FILE}" &&
               grep -Fq '実画面 5画面' "${PUBLIC_FILE}" &&
               grep -Fq 'QR読取 5 / 5' "${PUBLIC_FILE}" &&
               ! grep -Eqi 'system-check|system check|営業前' "${PUBLIC_FILE}"; then
              MARKER="clean-five-screen"
            fi

            echo "Attempt ${attempt}/36: HTTP ${HTTP_CODE}, marker=${MARKER}"

            if [[ "${MARKER}" == "clean-five-screen" ]]; then
              break
            fi

            if [[ "${attempt}" == "36" ]]; then
              echo "::error::Published cleaned product page could not be verified."
              exit 1
            fi
            sleep 10
          done

          grep -Fq 'URL完全一致 5 / 5' "${PUBLIC_FILE}"
          grep -Fq '>5画面をWebで見る<' "${PUBLIC_FILE}"
          grep -Fq 'GYM NEXT-11 COMPLETE' "${PUBLIC_FILE}"
          grep -Fq 'PC管理・継続フォロー' "${PUBLIC_FILE}"

          PUBLIC_BYTES="$(wc -c < "${PUBLIC_FILE}" | tr -d ' ')"
          [[ "${PUBLIC_BYTES}" -le 120000 ]]
          echo "PUBLIC_BYTES=${PUBLIC_BYTES}" >> "$GITHUB_ENV"

      - name: Update completion record with Python YAML validation
        shell: bash
        run: |
          set -euo pipefail
          COMPLETED_AT="$(TZ=Asia/Tokyo date '+%Y-%m-%dT%H:%M:%S%z')"
          export COMPLETED_AT

          python3 <<'PY'
          from pathlib import Path
          import os
          import yaml

          yml_path = Path(
              "dpro-next/gym/GYM-NEXT-COMPLETE.yml"
          )
          data = yaml.safe_load(
              yml_path.read_text(encoding="utf-8")
          )
          assert isinstance(data, dict)

          data["schema_version"] = 2
          data["result"] = "DPRO-NEXT-COMPLETE"
          data["logical_step"] = "GYM-NEXT-11"
          data["completed_step"] = (
              "GYM-NEXT-11B-PRODUCT-SITE-CLEANUP"
          )
          data["completed_at"] = os.environ["COMPLETED_AT"]
          data["product_commit_sha"] = (
              "e52e93902aad4ecf7a9c49a1492ed7162767efcd"
          )
          data["product_page_blob"] = (
              "4691b35ebf48b61efe820a87cbc91eee040eac43"
          )
          data["backup_tag"] = (
              "backup-product-site-before-gym-next-11b-20260726"
          )
          data["workflow_run_url"] = os.environ["RUN_URL"]

          public_urls = data.setdefault("public_urls", {})
          public_urls.pop("system_check", None)

          data["operation_sheet"] = {
              "owner_facing_only": True,
              "actual_screen_count": 5,
              "qr_count": 5,
              "source_qr_decoded_count": 5,
              "rendered_qr_decoded_count": 5,
              "exact_url_match_count": 5,
              "system_check_exposed": False,
              "pdf_sha256": (
                  "0581ba706fed52de0c508548faaf9b2ab"
                  "0f65aded36796dd9c0d96949bc0fc8f"
              ),
              "png_sha256": (
                  "d27b5fd48dec81cf1099c8a37b8d6e59"
                  "cb5a0eb0bf191727e66feb3120ceb103"
              ),
          }

          product_site = data.setdefault("product_site", {})
          product_site.update({
              "operation_sheet_section": True,
              "operation_sheet_screen_count": 5,
              "staff_role_feature": True,
              "integrated_system_check_feature": False,
              "owner_facing_system_check_removed": True,
              "owner_facing_system_check_link_removed": True,
              "owner_facing_system_check_copy_removed": True,
          })

          data["maintenance_scope"] = {
              "system_check_html_preserved_in_source_system": True,
              "system_check_role": "DPRO導入・保守担当専用",
              "system_check_owner_facing": False,
              "product_site_link_exposed": False,
          }

          checks = data.setdefault("checks", {})
          checks.update({
              "source_next_11a": "OK",
              "source_owner_facing_screen_count": "5",
              "source_owner_facing_qr_count": "5",
              "source_system_check_exposed": "FALSE",
              "product_owner_system_check_removed": "OK",
              "product_owner_system_check_link_removed": "OK",
              "product_owner_system_check_copy_removed": "OK",
              "product_operation_sheet_five_screens": "OK",
              "github_pages_product": "OK",
              "public_file_budget": "OK",
              "python_yaml_validation": "OK",
          })

          data["owner_facing_correction"] = {
              "reason": (
                  "system-checkはオーナー向け機能ではなく、"
                  "DPRO導入・保守担当専用"
              ),
              "source_step": "GYM-NEXT-11A-COMPLETE",
              "product_step": (
                  "GYM-NEXT-11B-PRODUCT-SITE-CLEANUP"
              ),
              "workflow_revision": "R3",
              "operation_sheet_changed_from": 6,
              "operation_sheet_changed_to": 5,
              "system_check_runtime_deleted": False,
              "system_check_product_reference_removed": True,
          }

          recovery = data.setdefault("recovery", {})
          failed_revisions = recovery.setdefault(
              "failed_workflow_revisions", []
          )
          for revision in (
              "GYM-NEXT-11B-R1",
              "GYM-NEXT-11B-R2",
          ):
              if revision not in failed_revisions:
                  failed_revisions.append(revision)

          failed_urls = recovery.setdefault(
              "failed_run_urls", []
          )
          for failed_url in (
              "https://github.com/dpromstk2000-lab/"
              "dpro-line-systems-site/actions/runs/30187172268",
              "https://github.com/dpromstk2000-lab/"
              "dpro-line-systems-site/actions/runs/30187402729",
          ):
              if failed_url not in failed_urls:
                  failed_urls.append(failed_url)

          recovery["failure_reason_gym_next_11b_r1"] = (
              "削除済みを示す内部コメント自身を禁止文字として誤検出"
          )
          recovery["failure_reason_gym_next_11b_r2"] = (
              "Ruby PsychがYAML日時をTime型として安全制限で拒否"
          )
          recovery["gym_next_11b_r3_fix"] = (
              "公開済み製品ページを固定検査し、"
              "PyYAML safe_loadで完成台帳のみ更新"
          )
          recovery["product_page_reedited_in_r3"] = False

          data["next_step"] = None

          yml_path.write_text(
              yaml.safe_dump(
                  data,
                  allow_unicode=True,
                  sort_keys=False,
              ),
              encoding="utf-8",
              newline="\n",
          )

          validated = yaml.safe_load(
              yml_path.read_text(encoding="utf-8")
          )
          assert isinstance(validated, dict)
          assert validated["schema_version"] == 2
          assert validated["result"] == "DPRO-NEXT-COMPLETE"
          assert validated["completed_step"] == (
              "GYM-NEXT-11B-PRODUCT-SITE-CLEANUP"
          )
          assert validated["operation_sheet"][
              "actual_screen_count"
          ] == 5
          assert validated["operation_sheet"][
              "system_check_exposed"
          ] is False
          assert validated["product_site"][
              "integrated_system_check_feature"
          ] is False
          assert validated["maintenance_scope"][
              "system_check_owner_facing"
          ] is False
          assert validated["next_step"] is None
          PY

          cat > "${COMPLETION_MD}" <<EOF
          # DPRO パーソナルジム LINE｜DPRO NEXT COMPLETE

          - 結果: DPRO-NEXT-COMPLETE
          - 最終STEP: GYM-NEXT-11B-PRODUCT-SITE-CLEANUP
          - ワークフロー版: R3
          - 製品ページ: ${PRODUCT_SITE_BASE}/systems/gym.html
          - 製品一覧: ${PRODUCT_SITE_BASE}/systems.html
          - 操作体験シート: オーナー向け5画面
          - QR読取・URL一致: 5 / 5
          - system-checkのオーナー向け掲載: 削除済み
          - system-checkへの製品ページリンク: 削除済み
          - system-check.html本体: DPRO導入・保守担当専用として維持
          - スタッフ権限分離: 掲載済み
          - 製品ページ再編集: なし
          - Worker変更: なし
          - Supabase変更: なし
          - 完了日時: ${COMPLETED_AT}
          - Actions: ${RUN_URL}
          EOF

          python3 <<'PY'
          from pathlib import Path
          import yaml

          data = yaml.safe_load(
              Path(
                  "dpro-next/gym/GYM-NEXT-COMPLETE.yml"
              ).read_text(encoding="utf-8")
          )
          assert data["completed_step"] == (
              "GYM-NEXT-11B-PRODUCT-SITE-CLEANUP"
          )
          assert data["next_step"] is None
          PY

          grep -Fq 'actual_screen_count: 5' "${COMPLETION_YML}"
          grep -Fq 'qr_count: 5' "${COMPLETION_YML}"
          grep -Fq 'system_check_exposed: false' "${COMPLETION_YML}"
          grep -Fq 'integrated_system_check_feature: false' "${COMPLETION_YML}"
          grep -Fq 'product_site_link_exposed: false' "${COMPLETION_YML}"
          grep -Fq 'python_yaml_validation: OK' "${COMPLETION_YML}"
          grep -Fq 'next_step: null' "${COMPLETION_YML}"
          grep -Fq 'system-checkのオーナー向け掲載: 削除済み' "${COMPLETION_MD}"

      - name: Confirm completion-only change scope
        shell: bash
        run: |
          set -euo pipefail

          [[ "$(git hash-object "${PRODUCT_PAGE}")" == "${EXPECTED_PRODUCT_PAGE_BLOB}" ]]

          CHANGED="$(git diff --name-only | sort)"
          EXPECTED="$(
            printf '%s\n' \
              "${COMPLETION_MD}" \
              "${COMPLETION_YML}" |
              sort
          )"
          [[ "${CHANGED}" == "${EXPECTED}" ]] || {
            echo "::error::R3 must change only the completion records."
            echo "Actual:"
            echo "${CHANGED}"
            echo "Expected:"
            echo "${EXPECTED}"
            exit 1
          }

          git diff --check

      - name: Commit completion records and self-delete workflows
        shell: bash
        run: |
          set -euo pipefail

          git add "${COMPLETION_YML}" "${COMPLETION_MD}"

          if [[ -f "${STALE_WORKFLOW_FILE_R1}" ]]; then
            git rm "${STALE_WORKFLOW_FILE_R1}"
          fi
          if [[ -f "${STALE_WORKFLOW_FILE_R2}" ]]; then
            git rm "${STALE_WORKFLOW_FILE_R2}"
          fi
          git rm "${WORKFLOW_FILE}"

          git diff --cached --check
          git commit -m "Complete gym owner-facing product cleanup"
          FINAL_COMMIT_SHA="$(git rev-parse HEAD)"
          echo "FINAL_COMMIT_SHA=${FINAL_COMMIT_SHA}" >> "$GITHUB_ENV"
          git push origin HEAD:main

      - name: Verify final records after push
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin main
          [[ "$(git rev-parse origin/main)" == "${FINAL_COMMIT_SHA}" ]]

          python3 <<'PY'
          from pathlib import Path
          import yaml

          data = yaml.safe_load(
              Path(
                  "dpro-next/gym/GYM-NEXT-COMPLETE.yml"
              ).read_text(encoding="utf-8")
          )
          assert data["result"] == "DPRO-NEXT-COMPLETE"
          assert data["logical_step"] == "GYM-NEXT-11"
          assert data["completed_step"] == (
              "GYM-NEXT-11B-PRODUCT-SITE-CLEANUP"
          )
          assert data["operation_sheet"][
              "actual_screen_count"
          ] == 5
          assert data["operation_sheet"][
              "exact_url_match_count"
          ] == 5
          assert data["operation_sheet"][
              "system_check_exposed"
          ] is False
          assert data["maintenance_scope"][
              "system_check_html_preserved_in_source_system"
          ] is True
          assert data["next_step"] is None
          PY

          [[ ! -e "${STALE_WORKFLOW_FILE_R1}" ]]
          [[ ! -e "${STALE_WORKFLOW_FILE_R2}" ]]
          [[ ! -e "${WORKFLOW_FILE}" ]]
          [[ "$(git hash-object "${PRODUCT_PAGE}")" == "${EXPECTED_PRODUCT_PAGE_BLOB}" ]]

      - name: Upload completion artifact
        uses: actions/upload-artifact@v4
        with:
          name: GYM-NEXT-11B-R3-complete
          path: |
            dpro-next/gym/GYM-NEXT-COMPLETE.yml
            dpro-next/gym/GYM-NEXT-COMPLETE.md
            /tmp/gym-next-11b-r3/source/next-ledger.yml
            /tmp/gym-next-11b-r3/html-validation.json
            /tmp/gym-next-11b-r3/public/gym.html
          if-no-files-found: error
          retention-days: 30

      - name: STEP completion summary
        shell: bash
        run: |
          {
            echo "## GYM-NEXT-11B-R3 COMPLETE"
            echo ""
            echo "- Published product cleanup: verified"
            echo "- Product page re-edited in R3: false"
            echo "- Owner-facing operation sheet: 5 screens"
            echo "- Owner-facing QR exact match: 5 / 5"
            echo "- Product system-check feature card: removed"
            echo "- Product system-check link: removed"
            echo "- Product system-check copy: removed"
            echo "- Maintenance system-check.html: preserved"
            echo "- Completion YAML validation: Python safe_load OK"
            echo "- Worker change: false"
            echo "- Supabase change: false"
            echo "- Next STEP: none"
          } >> "$GITHUB_STEP_SUMMARY"
