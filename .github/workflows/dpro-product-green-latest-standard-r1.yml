name: DPRO PRODUCT GREEN Latest Standard R1

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply GREEN product-site latest standard
        shell: python
        env:
          PATCH_B64: ""
        run: |
          import os, base64
          code = base64.b64decode(os.environ["PATCH_B64"]).decode("utf-8")
          exec(compile(code, "product_green_latest_standard_r1.py", "exec"))
      - name: Validate
        shell: bash
        run: |
          grep -q 'id="connected-publishing"' systems/green-rental.html
          grep -q 'ブログ予約公開' systems/green-rental.html
          grep -q 'GREEN CONNECTED PUBLISHING R1' systems/green-rental.html
          grep -q 'HP・LINE・ブログ運用' systems-data.js
      - name: Remove installer workflow
        shell: bash
        run: rm -f .github/workflows/dpro-product-green-latest-standard-r1.yml
      - name: Commit and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "No changes to commit."; exit 0; fi
          git commit -m "Showcase GREEN HP LINE blog publishing standard"
          git push
