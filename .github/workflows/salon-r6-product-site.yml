name: SALON Tutorial R6 Product Site

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/salon-r6-product-site.yml"

permissions:
  contents: write

concurrency:
  group: salon-tutorial-r6-product-site
  cancel-in-progress: false

jobs:
  r6-product-site:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TARGET_HTML: systems/salon.html
      TARGET_TEXT: systems/salon.html.txt
      WORKFLOW_PATH: .github/workflows/salon-r6-product-site.yml
      PRODUCT_URL: https://dpromstk2000-lab.github.io/dpro-line-systems-site/systems/salon.html
      TUTORIAL_URL: https://dpromstk2000-lab.github.io/liff-salon-reserve/tutorial.html
      GUIDE_URL: https://dpromstk2000-lab.github.io/liff-salon-reserve/guide-center.html
      QUICK_URL: https://dpromstk2000-lab.github.io/liff-salon-reserve/DPRO_TUTORIAL_SALON_QUICK_START_V1.0.pdf
      DETAIL_URL: https://dpromstk2000-lab.github.io/liff-salon-reserve/DPRO_TUTORIAL_SALON_DETAILED_MANUAL_V1.0.pdf
      LIVE_DEMO_URL: https://dpromstk2000-lab.github.io/liff-salon-reserve/?embed_demo=1
      START_OBSERVED_PRODUCT_HEAD: 6bae91af90c9a250c50cdfee55c9ba870741085f

    steps:
      - name: Checkout newest Product Site main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Forward-only preflight immediately before write
        id: preflight
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa-r6
          git fetch origin main
          local_head="$(git rev-parse HEAD)"
          remote_head="$(git rev-parse origin/main)"
          test "$local_head" = "$remote_head" || { echo "Product Site main advanced after workflow upload. HOLD." >&2; exit 1; }

          upload_base="$(git rev-parse HEAD^)"
          upload_base_tree="$(git rev-parse "${upload_base}^{tree}")"
          mapfile -t upload_changed < <(git diff --name-only "$upload_base" HEAD)
          test "${#upload_changed[@]}" -eq 1
          test "${upload_changed[0]}" = "$WORKFLOW_PATH"

          git merge-base --is-ancestor "$START_OBSERVED_PRODUCT_HEAD" "$upload_base" || {
            echo "Observed Product Site head is not an ancestor of newest upload base. HOLD." >&2
            exit 1
          }

          test -s "$TARGET_HTML"
          test -s "$TARGET_TEXT"
          ! grep -q 'DPRO TUTORIAL SALON R6' "$TARGET_HTML"

          if cmp -s "$TARGET_HTML" "$TARGET_TEXT"; then
            printf 'SAME\n' > qa-r6/target-mirror-before.txt
          else
            printf 'DIFFERENT\n' > qa-r6/target-mirror-before.txt
          fi

          sha256sum "$TARGET_HTML" "$TARGET_TEXT" > qa-r6/target-sha256-before.txt
          printf '%s\n' "$upload_base" > qa-r6/product-site-head-before-r6.txt
          printf '%s\n' "$upload_base_tree" > qa-r6/product-site-tree-before-r6.txt

          echo "upload_base=$upload_base" >> "$GITHUB_OUTPUT"
          echo "upload_base_tree=$upload_base_tree" >> "$GITHUB_OUTPUT"

      - name: Integrate SALON Tutorial resources into target mirrors only
        shell: bash
        run: |
          set -euo pipefail

          cat > /tmp/salon-r6-patch.py <<'PY'
          from pathlib import Path
          import os

          target = Path(os.environ["TARGET_HTML"])
          text = target.read_text(encoding="utf-8")
          marker = "DPRO TUTORIAL SALON R6"
          if marker in text:
              raise SystemExit("R6 marker already exists")

          css = r'''
          /* DPRO TUTORIAL SALON R6 */
          .ps-tutorial-resources{background:linear-gradient(135deg,#f4faf7 0%,#fff8f5 100%)}
          .ps-tutorial-intro{max-width:840px;margin-bottom:1.2rem;color:var(--dpro-warm-gray-600)}
          .ps-tutorial-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.85rem}
          .ps-tutorial-card{display:flex;align-items:flex-start;gap:.85rem;min-height:126px;padding:1rem 1.05rem;border:1px solid var(--ps-line);border-radius:1rem;background:#fff;text-decoration:none;box-shadow:var(--dpro-shadow-sm)}
          .ps-tutorial-card:hover{border-color:#9cccb8;transform:translateY(-1px)}
          .ps-tutorial-card:focus-visible{outline:3px solid #16845b;outline-offset:3px}
          .ps-tutorial-card__no{flex:0 0 38px;width:38px;height:38px;display:grid;place-items:center;border-radius:11px;background:var(--dpro-soft-green);color:var(--dpro-green);font-size:.75rem;font-weight:900}
          .ps-tutorial-card strong{display:block;color:var(--ps-deep);font-size:1rem;line-height:1.35}
          .ps-tutorial-card small{display:block;margin-top:.35rem;color:var(--dpro-warm-gray-600);font-size:.82rem;line-height:1.55}
          .ps-tutorial-safe{margin:1rem 0 0;padding:.85rem 1rem;border-left:4px solid var(--dpro-green);background:#fff;color:#40554d;font-size:.86rem}
          @media(max-width:640px){.ps-tutorial-grid{grid-template-columns:1fr}.ps-tutorial-card{min-height:0}}
          '''

          section = f'''<!-- DPRO TUTORIAL SALON R6 -->
          <section aria-labelledby="tutorial-resources-title" class="dpro-section ps-tutorial-resources" id="tutorial-resources">
            <div class="dpro-container">
              <div class="ps-section-heading">
                <p class="ps-kicker">TUTORIAL &amp; GUIDE</p>
                <h2 id="tutorial-resources-title">操作を試す。ガイドで確認する。</h2>
                <p>美容サロン向けのFirst10チュートリアル、Guide Center、印刷用マニュアルをここから確認できます。</p>
              </div>
              <p class="ps-tutorial-intro">Tutorialはデモ・確認用の安全な操作ガイドです。予約の保存・キャンセル、手動予約の追加・削除、スタッフ勤務・状態、顧客データ、メニュー、営業時間、各種設定を自動変更しません。</p>
              <div class="ps-tutorial-grid">
                <a class="ps-tutorial-card" data-r6-resource="tutorial" href="{os.environ["TUTORIAL_URL"]}" rel="noopener" target="_blank">
                  <span class="ps-tutorial-card__no">01</span><span><strong>Tutorial Start</strong><small>First10をSTEP 1から確認。Start / Resume / Replay、ドラッグ、キーボード操作に対応。</small></span>
                </a>
                <a class="ps-tutorial-card" data-r6-resource="guide" href="{os.environ["GUIDE_URL"]}" rel="noopener" target="_blank">
                  <span class="ps-tutorial-card__no">02</span><span><strong>Guide Center</strong><small>Customer → Staff → Owner iPad → Owner PCの10ステップと進行状態を確認。</small></span>
                </a>
                <a class="ps-tutorial-card" data-r6-resource="quick" href="{os.environ["QUICK_URL"]}" rel="noopener" target="_blank">
                  <span class="ps-tutorial-card__no">03</span><span><strong>Quick Start PDF</strong><small>A4縦1ページ。入口、基本操作、安全なデモ範囲を短く確認。</small></span>
                </a>
                <a class="ps-tutorial-card" data-r6-resource="detail" href="{os.environ["DETAIL_URL"]}" rel="noopener" target="_blank">
                  <span class="ps-tutorial-card__no">04</span><span><strong>Detailed Manual PDF</strong><small>First10、画面移動、Resume、Guide Center、スマホ・キーボード操作を詳しく確認。</small></span>
                </a>
              </div>
              <p class="ps-tutorial-safe"><strong>安全境界:</strong> チュートリアルは製品紹介用のread-onlyガイドです。実際の予約確定・取消や業務設定変更は、通常の業務画面で利用者が明示的に行う操作です。</p>
            </div>
          </section>'''

          style_anchor = "</style>"
          body_anchor = '<section aria-labelledby="final-title"'
          if text.count(style_anchor) != 1:
              raise SystemExit("style anchor mismatch")
          if text.count(body_anchor) != 1:
              raise SystemExit("final CTA anchor mismatch")

          text = text.replace(style_anchor, css + "\n" + style_anchor, 1)
          text = text.replace(body_anchor, section + body_anchor, 1)
          target.write_text(text, encoding="utf-8")
          PY

          python /tmp/salon-r6-patch.py
          cp "$TARGET_HTML" "$TARGET_TEXT"

          cmp -s "$TARGET_HTML" "$TARGET_TEXT"
          grep -q 'DPRO TUTORIAL SALON R6' "$TARGET_HTML"
          grep -q 'data-r6-resource="tutorial"' "$TARGET_HTML"
          grep -q 'data-r6-resource="guide"' "$TARGET_HTML"
          grep -q 'data-r6-resource="quick"' "$TARGET_HTML"
          grep -q 'data-r6-resource="detail"' "$TARGET_HTML"

          grep -Fq "$TUTORIAL_URL" "$TARGET_HTML"
          grep -Fq "$GUIDE_URL" "$TARGET_HTML"
          grep -Fq "$QUICK_URL" "$TARGET_HTML"
          grep -Fq "$DETAIL_URL" "$TARGET_HTML"

          grep -q '5,500円' "$TARGET_HTML"
          grep -q 'https://lin.ee/YxJGXV6D' "$TARGET_HTML"
          grep -Fq "$LIVE_DEMO_URL" "$TARGET_HTML"
          grep -q '../lp-salon.html' "$TARGET_HTML"
          grep -q '../flyer-salon.html' "$TARGET_HTML"
          grep -q '../flyer-salon.pdf' "$TARGET_HTML"
          grep -q '../systems-data.js' "$TARGET_HTML"
          grep -q '../dpro-v3.js' "$TARGET_HTML"

      - name: Commit forward-only R6 integration and self-remove workflow
        id: integrate
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" || {
            echo "Product Site main advanced during R6 preparation. HOLD." >&2
            exit 1
          }

          git add "$TARGET_HTML" "$TARGET_TEXT"
          git rm "$WORKFLOW_PATH"

          mapfile -t changed < <(git diff --cached --name-only | sort)
          expected="$(printf '%s\n' "$WORKFLOW_PATH" "$TARGET_HTML" "$TARGET_TEXT" | sort)"
          actual="$(printf '%s\n' "${changed[@]}" | sort)"
          test "$actual" = "$expected"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Integrate SALON Tutorial R6 Product Site [skip ci]"

          integration_head="$(git rev-parse HEAD)"
          integration_tree="$(git rev-parse HEAD^{tree})"

          git merge-base --is-ancestor "${{ steps.preflight.outputs.upload_base }}" "$integration_head"
          git push origin HEAD:main

          printf '%s\n' "$integration_head" > qa-r6/r6-integration-head.txt
          printf '%s\n' "$integration_tree" > qa-r6/r6-integration-tree.txt
          git diff-tree --no-commit-id --name-status -r "$integration_head" > qa-r6/r6-integration-changed.txt

          echo "integration_head=$integration_head" >> "$GITHUB_OUTPUT"
          echo "integration_tree=$integration_tree" >> "$GITHUB_OUTPUT"

      - name: Wait for Product Site Pages deployment
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 48); do
            if curl -fsSL "$PRODUCT_URL?qa=${{ steps.integrate.outputs.integration_head }}-$i" | grep -q 'DPRO TUTORIAL SALON R6'; then
              exit 0
            fi
            sleep 10
          done
          echo "R6 marker did not appear on Product Site GitHub Pages." >&2
          exit 1

      - name: Setup Node for exact-width LIVE QA
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run R6 exact-width LIVE QA
        shell: bash
        env:
          R6_INTEGRATION_HEAD: ${{ steps.integrate.outputs.integration_head }}
          R6_INTEGRATION_TREE: ${{ steps.integrate.outputs.integration_tree }}
          R6_UPLOAD_BASE: ${{ steps.preflight.outputs.upload_base }}
          R6_UPLOAD_BASE_TREE: ${{ steps.preflight.outputs.upload_base_tree }}
        run: |
          set -euo pipefail

          git fetch origin main
          final_head="$(git rev-parse origin/main)"
          final_tree="$(git rev-parse "origin/main^{tree}")"
          git merge-base --is-ancestor "$R6_INTEGRATION_HEAD" "$final_head" || {
            echo "Integration commit is not an ancestor of current main. Rollback detected." >&2
            exit 1
          }

          git show "$R6_INTEGRATION_HEAD:$TARGET_HTML" > /tmp/r6-integration.html
          git show "origin/main:$TARGET_HTML" > /tmp/r6-current.html
          cmp -s /tmp/r6-integration.html /tmp/r6-current.html

          git show "origin/main:$TARGET_TEXT" > /tmp/r6-current.txt
          cmp -s /tmp/r6-current.html /tmp/r6-current.txt

          printf '%s\n' "$final_head" > qa-r6/product-site-final-head.txt
          printf '%s\n' "$final_tree" > qa-r6/product-site-final-tree.txt

          cat > /tmp/salon-r6-live-qa.mjs <<'NODE'
          import { chromium } from 'playwright';
          import fs from 'node:fs';

          const productUrl=process.env.PRODUCT_URL;
          const expected={
            tutorial:process.env.TUTORIAL_URL,
            guide:process.env.GUIDE_URL,
            quick:process.env.QUICK_URL,
            detail:process.env.DETAIL_URL
          };
          const viewports=[
            {name:'1440',width:1440,height:1000},
            {name:'1024',width:1024,height:768},
            {name:'390',width:390,height:844},
            {name:'320',width:320,height:720}
          ];

          const result={
            schema:'DPRO_TUTORIAL_SALON_R6_PRODUCT_SITE_LIVE_QA_V1.0',
            productUrl,expected,
            integrationHead:process.env.R6_INTEGRATION_HEAD,
            integrationTree:process.env.R6_INTEGRATION_TREE,
            uploadBase:process.env.R6_UPLOAD_BASE,
            uploadBaseTree:process.env.R6_UPLOAD_BASE_TREE,
            viewports:[],resourceChecks:{},
            businessMutationAttempts:[],failures:[],
            productSiteRollback:0,businessMutation:0
          };

          const browser=await chromium.launch({headless:true});

          const requestContext=await browser.newContext();
          const requestPage=await requestContext.newPage();
          for(const [key,url] of Object.entries(expected)){
            try{
              const resp=await requestPage.request.get(url,{timeout:30000});
              const ct=String(resp.headers()['content-type']||'');
              const isPdf=['quick','detail'].includes(key);
              const ok=resp.status()===200 && (isPdf ? ct.toLowerCase().includes('pdf') : ct.toLowerCase().includes('text/html'));
              result.resourceChecks[key]={url,status:resp.status(),contentType:ct,ok};
              if(!ok) result.failures.push(`resource ${key}: status=${resp.status()} content-type=${ct}`);
            }catch(e){
              result.resourceChecks[key]={url,error:String(e),ok:false};
              result.failures.push(`resource ${key}: ${String(e)}`);
            }
          }
          await requestContext.close();

          for(const vp of viewports){
            const context=await browser.newContext({viewport:{width:vp.width,height:vp.height}});
            const unsafe=[],pageErrors=[],consoleErrors=[];
            await context.route('**/*',async route=>{
              const method=route.request().method();
              if(['POST','PUT','PATCH','DELETE'].includes(method)){
                const rec={viewport:vp.name,method,url:route.request().url()};
                unsafe.push(rec);result.businessMutationAttempts.push(rec);
                return route.abort('blockedbyclient');
              }
              return route.continue();
            });

            const page=await context.newPage();
            page.on('pageerror',e=>pageErrors.push(String(e)));
            page.on('console',m=>{if(m.type()==='error')consoleErrors.push({text:m.text(),location:m.location()});});

            const resp=await page.goto(`${productUrl}?qa=${Date.now()}-${vp.name}`,{waitUntil:'networkidle',timeout:45000});
            if(!resp || resp.status()!==200) result.failures.push(`${vp.name}: product status ${resp?.status()}`);

            const data=await page.evaluate((liveDemoUrl)=>({
              innerWidth:window.innerWidth,
              documentScrollWidth:document.documentElement.scrollWidth,
              bodyScrollWidth:document.body.scrollWidth,
              marker:document.documentElement.innerHTML.includes('DPRO TUTORIAL SALON R6'),
              links:[...document.querySelectorAll('[data-r6-resource]')].map(a=>({key:a.getAttribute('data-r6-resource'),href:a.href,text:(a.textContent||'').trim()})),
              pricing:(document.body.textContent||'').includes('5,500円'),
              lineCta:[...document.querySelectorAll('a')].some(a=>a.href==='https://lin.ee/YxJGXV6D'),
              demo:[...document.querySelectorAll('a,button')].some(el=>el.href===liveDemoUrl || el.getAttribute('data-src')===liveDemoUrl),
              lp:[...document.querySelectorAll('a')].some(a=>a.getAttribute('href')==='../lp-salon.html'),
              flyerHtml:[...document.querySelectorAll('a')].some(a=>a.getAttribute('href')==='../flyer-salon.html'),
              flyerPdf:[...document.querySelectorAll('a')].some(a=>a.getAttribute('href')==='../flyer-salon.pdf'),
              systemsData:[...document.scripts].some(s=>s.getAttribute('src')==='../systems-data.js'),
              sharedJs:[...document.scripts].some(s=>s.getAttribute('src')==='../dpro-v3.js')
            }),process.env.LIVE_DEMO_URL);

            if(!data.marker) result.failures.push(`${vp.name}: R6 marker missing`);
            const map=Object.fromEntries(data.links.map(x=>[x.key,x.href]));
            for(const [key,url] of Object.entries(expected)){
              if(map[key]!==url) result.failures.push(`${vp.name}: ${key} link mismatch: ${map[key]}`);
            }
            if(data.links.length!==4) result.failures.push(`${vp.name}: resource link count ${data.links.length}`);

            if(!data.pricing) result.failures.push(`${vp.name}: pricing regression`);
            if(!data.lineCta) result.failures.push(`${vp.name}: LINE CTA regression`);
            if(!data.demo) result.failures.push(`${vp.name}: DEMO regression`);
            if(!data.lp) result.failures.push(`${vp.name}: LP regression`);
            if(!data.flyerHtml) result.failures.push(`${vp.name}: flyer HTML regression`);
            if(!data.flyerPdf) result.failures.push(`${vp.name}: flyer PDF regression`);
            if(!data.systemsData || !data.sharedJs) result.failures.push(`${vp.name}: shared asset regression`);

            const overflow={
              innerWidth:data.innerWidth,
              documentScrollWidth:data.documentScrollWidth,
              bodyScrollWidth:data.bodyScrollWidth,
              documentOverflow:Math.max(0,data.documentScrollWidth-data.innerWidth),
              bodyOverflow:Math.max(0,data.bodyScrollWidth-data.innerWidth)
            };
            if(vp.width<=390 && (overflow.documentOverflow!==0 || overflow.bodyOverflow!==0)){
              result.failures.push(`${vp.name}: mobile overflow`);
            }

            await page.locator('body').focus();
            let focusVisible=false,focusRecord=null;
            for(let i=0;i<100;i++){
              await page.keyboard.press('Tab');
              const fr=await page.evaluate(()=>{
                const a=document.activeElement;
                if(!a || !a.matches?.('[data-r6-resource]')) return null;
                const r=a.getBoundingClientRect();
                const cs=getComputedStyle(a);
                return {
                  key:a.getAttribute('data-r6-resource'),
                  left:r.left,top:r.top,right:r.right,bottom:r.bottom,width:r.width,height:r.height,
                  innerWidth:window.innerWidth,innerHeight:window.innerHeight,
                  outlineStyle:cs.outlineStyle,outlineWidth:cs.outlineWidth
                };
              });
              if(fr){
                focusRecord=fr;
                focusVisible=fr.width>0&&fr.height>0&&fr.left>=-1&&fr.right<=fr.innerWidth+1&&fr.top>=-1&&fr.bottom<=fr.innerHeight+1&&fr.outlineStyle!=='none'&&parseFloat(fr.outlineWidth)>0;
                break;
              }
            }
            if(!focusVisible) result.failures.push(`${vp.name}: keyboard focus not visible`);

            const tutorialConsole=consoleErrors.filter(e=>String(e.location?.url||'').includes('/systems/salon.html'));
            if(pageErrors.length) result.failures.push(`${vp.name}: pageerror ${pageErrors.join(' | ')}`);
            if(tutorialConsole.length) result.failures.push(`${vp.name}: Tutorial integration console error`);
            if(unsafe.length) result.failures.push(`${vp.name}: unsafe write attempts ${unsafe.length}`);

            result.viewports.push({viewport:vp,data,overflow,focusVisible,focusRecord,pageErrors,consoleErrors,tutorialConsole,unsafe});
            await context.close();
          }

          await browser.close();

          if(result.businessMutationAttempts.length) result.businessMutation='BLOCKED_UNSAFE_ATTEMPT_PRESENT';
          result.forwardOnly=true;
          result.pass=result.failures.length===0&&result.businessMutationAttempts.length===0&&result.businessMutation===0&&result.productSiteRollback===0;

          fs.writeFileSync('qa-r6/salon-r6-live-qa.json',JSON.stringify(result,null,2));
          console.log(JSON.stringify({pass:result.pass,failures:result.failures,resources:result.resourceChecks,businessMutation:result.businessMutation,productSiteRollback:result.productSiteRollback},null,2));
          if(!result.pass) process.exit(1);
          NODE

          node /tmp/salon-r6-live-qa.mjs

      - name: Record final changed-file manifest
        shell: bash
        env:
          R6_INTEGRATION_HEAD: ${{ steps.integrate.outputs.integration_head }}
        run: |
          set -euo pipefail
          parent="$(git rev-parse "${R6_INTEGRATION_HEAD}^")"
          git diff --name-status "$parent" "$R6_INTEGRATION_HEAD" > qa-r6/r6-changed-files.txt

          grep -q $'M\tsystems/salon.html' qa-r6/r6-changed-files.txt
          grep -q $'M\tsystems/salon.html.txt' qa-r6/r6-changed-files.txt
          grep -q $'D\t.github/workflows/salon-r6-product-site.yml' qa-r6/r6-changed-files.txt
          test "$(wc -l < qa-r6/r6-changed-files.txt)" -eq 3

          git show "origin/main:$TARGET_HTML" > /tmp/r6-final-html
          git show "origin/main:$TARGET_TEXT" > /tmp/r6-final-text
          cmp -s /tmp/r6-final-html /tmp/r6-final-text
          sha256sum /tmp/r6-final-html /tmp/r6-final-text > qa-r6/target-sha256-after.txt

      - name: Upload R6 QA evidence
        uses: actions/upload-artifact@v4
        with:
          name: salon-r6-product-site-evidence
          path: qa-r6
          if-no-files-found: error
