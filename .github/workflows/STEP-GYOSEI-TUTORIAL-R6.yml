name: DPRO GYOSEI Batch09 Tutorial R6 Product Site FINAL LIVE QA
# GYOSEI-R6-PRODUCT-SITE-V1.0-20260829

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dpro-gyosei-tutorial-r6-product-site
  cancel-in-progress: false

jobs:
  r6-product-site:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Product Site
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch newest Product Site main forward-only
        shell: bash
        run: |
          set -euo pipefail
          OBSERVED_BASELINE="fddeea6deb4df13948675cce6cc7f8397f9eb17b"

          git fetch origin main
          CURRENT_REMOTE="$(git rev-parse origin/main)"
          CURRENT_LOCAL="$(git rev-parse HEAD)"

          if [ "$CURRENT_LOCAL" != "$CURRENT_REMOTE" ]; then
            git merge --ff-only origin/main
          fi

          git merge-base --is-ancestor "$OBSERVED_BASELINE" HEAD

          PRE_HEAD="$(git rev-parse HEAD)"
          PRE_TREE="$(git rev-parse HEAD^{tree})"
          HTML_BLOB="$(git hash-object systems/gyosei.html)"
          MIRROR_BLOB="$(git hash-object systems/gyosei.html.txt)"

          test "$HTML_BLOB" = "$MIRROR_BLOB"
          cmp -s systems/gyosei.html systems/gyosei.html.txt
          ! grep -Fq 'GYOSEI-R6-TUTORIAL-RESOURCES-V1.0-20260829' systems/gyosei.html

          cp systems/gyosei.html "$RUNNER_TEMP/gyosei-before.html"
          cp systems/gyosei.html.txt "$RUNNER_TEMP/gyosei-before.html.txt"

          printf '%s\n' "$PRE_HEAD" > "$RUNNER_TEMP/pre-head.txt"
          printf '%s\n' "$PRE_TREE" > "$RUNNER_TEMP/pre-tree.txt"
          printf '%s\n' "$HTML_BLOB" > "$RUNNER_TEMP/pre-html-blob.txt"

          echo "R6_PRE_HEAD=$PRE_HEAD" >> "$GITHUB_ENV"
          echo "R6_PRE_TREE=$PRE_TREE" >> "$GITHUB_ENV"
          echo "R6_PRE_HTML_BLOB=$HTML_BLOB" >> "$GITHUB_ENV"

      - name: Verify R5 PASS and all 5 public GYOSEI resources before write
        shell: bash
        run: |
          set -euo pipefail

          APP_BASE="https://dpromstk2000-lab.github.io/dpro-gyosei-permit-line"
          TUTORIAL="$APP_BASE/tutorial.html"
          GUIDE="$APP_BASE/demo-guide.html"
          QUICK="$APP_BASE/manuals/DPRO_TUTORIAL_GYOSEI_QUICK_START_V1.0.pdf"
          DETAIL="$APP_BASE/manuals/DPRO_TUTORIAL_GYOSEI_DETAILED_MANUAL_V1.0.pdf"
          DEMO="$APP_BASE/"
          EVIDENCE="$APP_BASE/manuals/R5_MANUAL_QA_EVIDENCE.txt"

          fetch_retry () {
            local url="$1"
            local out="$2"
            local ok=0
            for i in $(seq 1 60); do
              sep='?'
              case "$url" in *\?*) sep='&' ;; esac
              code="$(curl -L --retry 2 --retry-delay 2 --retry-all-errors -sS -o "$out" -w '%{http_code}' "${url}${sep}r6pre=$GITHUB_SHA-$i" || true)"
              if [ "$code" = "200" ] && [ -s "$out" ]; then
                ok=1
                break
              fi
              sleep 5
            done
            test "$ok" = "1"
          }

          fetch_retry "$TUTORIAL" "$RUNNER_TEMP/tutorial-live.html"
          fetch_retry "$GUIDE" "$RUNNER_TEMP/guide-live.html"
          fetch_retry "$QUICK" "$RUNNER_TEMP/quick-live.pdf"
          fetch_retry "$DETAIL" "$RUNNER_TEMP/detail-live.pdf"
          fetch_retry "$DEMO" "$RUNNER_TEMP/demo-live.html"
          fetch_retry "$EVIDENCE" "$RUNNER_TEMP/r5-evidence-live.txt"

          head -c 5 "$RUNNER_TEMP/quick-live.pdf" | grep -Fq '%PDF-'
          head -c 5 "$RUNNER_TEMP/detail-live.pdf" | grep -Fq '%PDF-'

          grep -Fq 'R5_AUTOMATED_QA=PASS' "$RUNNER_TEMP/r5-evidence-live.txt"
          grep -Fq 'FIRST10_COUNT=10' "$RUNNER_TEMP/r5-evidence-live.txt"
          grep -Fq 'GUIDE_COUNT=10' "$RUNNER_TEMP/r5-evidence-live.txt"
          grep -Fq 'BUSINESS_MUTATION=0' "$RUNNER_TEMP/r5-evidence-live.txt"

          python - <<'PY'
          import os, re
          from pathlib import Path

          rt=Path(os.environ["RUNNER_TEMP"])
          tutorial=(rt/"tutorial-live.html").read_text(encoding="utf-8")
          guide=(rt/"guide-live.html").read_text(encoding="utf-8")

          tids=re.findall(r'id:"(GYOSEI-\d{2})"', tutorial)
          gids=re.findall(r'"id":"(GYOSEI-\d{2})"', guide)

          expected=[f"GYOSEI-{i:02d}" for i in range(1,11)]
          assert tids == expected, tids
          assert gids == expected, gids
          assert "GYOSEI-TUTORIAL-R3-V1.1-20260829" in tutorial
          assert "GYOSEI-GUIDE-R4-V1.0-20260829" in guide
          print("R5=PASS")
          print("FIRST10_COUNT=10")
          print("GUIDE_COUNT=10")
          PY

      - name: Integrate GYOSEI R6 resources into target only
        shell: python
        run: |
          from pathlib import Path

          html=Path("systems/gyosei.html")
          mirror=Path("systems/gyosei.html.txt")
          before=html.read_bytes()
          assert before == mirror.read_bytes()

          text=before.decode("utf-8")
          marker="<!-- GYOSEI-R6-TUTORIAL-RESOURCES-V1.0-20260829 -->"
          assert marker not in text
          needle="</main><footer"
          assert text.count(needle) == 1

          section='''<!-- GYOSEI-R6-TUTORIAL-RESOURCES-V1.0-20260829 -->
          <section id="tutorial-manuals" class="dpro-section ps-section-soft r6-gyosei-resources" aria-labelledby="tutorial-manuals-title">
            <style>
              .r6-gyosei-resources .r6-resource-head{display:flex;flex-wrap:wrap;align-items:center;gap:.7rem}
              .r6-gyosei-resources .r6-demo-badge{display:inline-flex;align-items:center;min-height:30px;padding:.22rem .7rem;border-radius:999px;background:var(--dpro-green);color:#fff;font-size:.78rem;font-weight:900;letter-spacing:.05em}
              .r6-gyosei-resources .r6-resource-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1rem;margin-top:1rem}
              .r6-gyosei-resources .r6-resource-card{display:flex;flex-direction:column;min-width:0}
              .r6-gyosei-resources .r6-resource-card p{flex:1}
              .r6-gyosei-resources [data-r6-resource]:focus-visible{outline:3px solid #0b7a55;outline-offset:4px;box-shadow:0 0 0 4px rgba(11,122,85,.16)}
              .r6-gyosei-resources .r6-resource-note{margin:1rem 0 0;padding:1rem 1.1rem;border-left:4px solid var(--dpro-green);background:#fff;color:#395149}
              @media(max-width:980px){.r6-gyosei-resources .r6-resource-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
              @media(max-width:640px){.r6-gyosei-resources .r6-resource-grid{grid-template-columns:1fr}.r6-gyosei-resources .ps-actions{display:block}.r6-gyosei-resources .ps-actions .dpro-button{width:100%}}
            </style>
            <div class="dpro-container">
              <div class="ps-section-heading">
                <div class="r6-resource-head">
                  <p class="ps-kicker">TUTORIAL &amp; MANUAL</p>
                  <span class="r6-demo-badge" data-r6-demo-label>Demo</span>
                </div>
                <h2 id="tutorial-manuals-title">操作ガイドと印刷マニュアル</h2>
                <p>First10全10項目、Guide Center、A4印刷マニュアル、公開デモをここから確認できます。Tutorialは案内・移動・ハイライト専用で、相談・予約・案件・書類・タスク・設定などの業務データを変更しません。</p>
              </div>

              <div class="r6-resource-grid" data-r6-resource-grid>
                <article class="dpro-card ps-card-copy r6-resource-card" data-r6-card="quick-start">
                  <h3>Quick Start</h3>
                  <p>A4縦1ページ。初回説明、Start / Resume / Replay、ドラッグ、キーボード、安全境界を短く確認できます。</p>
                  <div class="ps-actions"><a class="dpro-button dpro-button--secondary" data-r6-resource="quick-start" href="https://dpromstk2000-lab.github.io/dpro-gyosei-permit-line/manuals/DPRO_TUTORIAL_GYOSEI_QUICK_START_V1.0.pdf" target="_blank" rel="noopener">Quick Start PDF</a></div>
                </article>

                <article class="dpro-card ps-card-copy r6-resource-card" data-r6-card="detailed-manual">
                  <h3>Detailed Manual</h3>
                  <p>A4縦6ページ。First10全10ステップ、Guide Center、Resume / Replay、操作方法、安全境界をまとめています。</p>
                  <div class="ps-actions"><a class="dpro-button dpro-button--secondary" data-r6-resource="detailed-manual" href="https://dpromstk2000-lab.github.io/dpro-gyosei-permit-line/manuals/DPRO_TUTORIAL_GYOSEI_DETAILED_MANUAL_V1.0.pdf" target="_blank" rel="noopener">Detailed Manual PDF</a></div>
                </article>

                <article class="dpro-card ps-card-copy r6-resource-card" data-r6-card="tutorial">
                  <h3>Tutorial</h3>
                  <p>公開Tutorialを開き、First10を画面ハイライト付きで確認します。Close / Esc後もResumeできます。</p>
                  <div class="ps-actions"><a class="dpro-button dpro-button--primary" data-r6-resource="tutorial" href="https://dpromstk2000-lab.github.io/dpro-gyosei-permit-line/tutorial.html" target="_blank" rel="noopener">Tutorialを開く</a></div>
                </article>

                <article class="dpro-card ps-card-copy r6-resource-card" data-r6-card="guide-center">
                  <h3>Guide Center</h3>
                  <p>First10全10項目とStart / Resume / Replayを同じTutorial状態で確認できます。</p>
                  <div class="ps-actions"><a class="dpro-button dpro-button--secondary" data-r6-resource="guide-center" href="https://dpromstk2000-lab.github.io/dpro-gyosei-permit-line/demo-guide.html" target="_blank" rel="noopener">Guide Centerを開く</a></div>
                </article>

                <article class="dpro-card ps-card-copy r6-resource-card" data-r6-card="public-demo">
                  <h3>Public Demo</h3>
                  <p>行政書士・許認可申請システムの公開デモ入口です。実在する顧客・案件・書類情報は入力しないでください。</p>
                  <div class="ps-actions"><a class="dpro-button dpro-button--demo" data-r6-resource="public-demo" href="https://dpromstk2000-lab.github.io/dpro-gyosei-permit-line/" target="_blank" rel="noopener">Demoを開く</a></div>
                </article>
              </div>

              <p class="r6-resource-note">案内専用 / business mutation 0。Tutorial / Guide Centerは相談送信、予約登録、案件・書類・タスク更新、設定保存、DEMO PREPAREなどの業務操作を自動実行しません。</p>
            </div>
          </section>
          <!-- /GYOSEI-R6-TUTORIAL-RESOURCES-V1.0-20260829 -->'''

          after=text.replace(needle, section+needle, 1)
          html.write_bytes(after.encode("utf-8"))
          mirror.write_bytes(after.encode("utf-8"))

      - name: Static target-scope and preservation QA
        shell: python
        run: |
          from pathlib import Path
          import os, subprocess

          html=Path("systems/gyosei.html")
          mirror=Path("systems/gyosei.html.txt")
          data=html.read_bytes()
          assert data == mirror.read_bytes()
          s=data.decode("utf-8")

          marker="<!-- GYOSEI-R6-TUTORIAL-RESOURCES-V1.0-20260829 -->"
          end="<!-- /GYOSEI-R6-TUTORIAL-RESOURCES-V1.0-20260829 -->"
          assert s.count("GYOSEI-R6-TUTORIAL-RESOURCES-V1.0-20260829") == 2
          assert s.count('data-r6-resource="') == 5
          assert s.count('data-r6-card="') == 5
          assert 'data-r6-demo-label>Demo<' in s

          required={
            "quick-start":"https://dpromstk2000-lab.github.io/dpro-gyosei-permit-line/manuals/DPRO_TUTORIAL_GYOSEI_QUICK_START_V1.0.pdf",
            "detailed-manual":"https://dpromstk2000-lab.github.io/dpro-gyosei-permit-line/manuals/DPRO_TUTORIAL_GYOSEI_DETAILED_MANUAL_V1.0.pdf",
            "tutorial":"https://dpromstk2000-lab.github.io/dpro-gyosei-permit-line/tutorial.html",
            "guide-center":"https://dpromstk2000-lab.github.io/dpro-gyosei-permit-line/demo-guide.html",
            "public-demo":"https://dpromstk2000-lab.github.io/dpro-gyosei-permit-line/",
          }
          for key,url in required.items():
            assert f'data-r6-resource="{key}" href="{url}"' in s, (key,url)

          changed=subprocess.check_output(["git","diff","--name-only"], text=True).splitlines()
          assert set(changed) == {"systems/gyosei.html","systems/gyosei.html.txt"}, changed

          before=(Path(os.environ["RUNNER_TEMP"])/"gyosei-before.html").read_text(encoding="utf-8")
          i=s.index(marker)
          j=s.index(end)+len(end)
          stripped=s[:i]+s[j:]
          assert stripped == before

          assert "5,500円" in s
          assert 'href="https://lin.ee/YxJGXV6D"' in s
          assert 'id="live"' in s
          assert 'id="price"' in s
          assert "dpro-gyosei-permit-line/index.html?demo=1" in s
          assert 'data-system-code="GYOSEI"' in s

          print("TARGET_SCOPE=PASS")
          print("OTHER_PRODUCT_CONTENT_BYTE_PRESERVED=PASS")
          print("PRODUCT_REGRESSION_STATIC=PASS")

      - name: Commit R6 integration forward-only
        shell: bash
        run: |
          set -euo pipefail
          PRE_HEAD="$(cat "$RUNNER_TEMP/pre-head.txt")"

          git fetch origin main
          CURRENT_REMOTE="$(git rev-parse origin/main)"
          if [ "$CURRENT_REMOTE" != "$PRE_HEAD" ]; then
            echo "Product Site main advanced during R6 preparation; refusing stale write." >&2
            echo "PRE_HEAD=$PRE_HEAD" >&2
            echo "CURRENT_REMOTE=$CURRENT_REMOTE" >&2
            exit 42
          fi

          git config user.name "dpro-tutorial-qa-bot"
          git config user.email "actions@users.noreply.github.com"

          git add systems/gyosei.html systems/gyosei.html.txt
          mapfile -t cached < <(git diff --cached --name-only | sort)
          test "${#cached[@]}" -eq 2
          test "${cached[0]}" = "systems/gyosei.html"
          test "${cached[1]}" = "systems/gyosei.html.txt"

          git commit -m "GYOSEI R6 integrate Tutorial and manual resources [skip ci]"
          POST_HEAD="$(git rev-parse HEAD)"
          POST_TREE="$(git rev-parse HEAD^{tree})"

          git merge-base --is-ancestor "$PRE_HEAD" "$POST_HEAD"
          mapfile -t committed < <(git diff-tree --no-commit-id --name-only -r "$POST_HEAD" | sort)
          test "${#committed[@]}" -eq 2
          test "${committed[0]}" = "systems/gyosei.html"
          test "${committed[1]}" = "systems/gyosei.html.txt"

          git push origin HEAD:main

          printf '%s\n' "$POST_HEAD" > "$RUNNER_TEMP/post-head.txt"
          printf '%s\n' "$POST_TREE" > "$RUNNER_TEMP/post-tree.txt"
          echo "R6_POST_HEAD=$POST_HEAD" >> "$GITHUB_ENV"
          echo "R6_POST_TREE=$POST_TREE" >> "$GITHUB_ENV"

      - name: Install Playwright
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Wait for Product Site R6 deployment
        shell: bash
        run: |
          set -euo pipefail
          PAGE="https://dpromstk2000-lab.github.io/dpro-line-systems-site/systems/gyosei.html"
          tmp="$(mktemp)"
          trap 'rm -f "$tmp"' EXIT

          ok=0
          for i in $(seq 1 72); do
            code="$(curl -L -sS -o "$tmp" -w '%{http_code}' "$PAGE?r6=${R6_POST_HEAD}-$i" || true)"
            if [ "$code" = "200" ] && grep -Fq 'GYOSEI-R6-TUTORIAL-RESOURCES-V1.0-20260829' "$tmp"; then
              ok=1
              echo "R6 deployed on attempt $i"
              break
            fi
            sleep 5
          done
          test "$ok" = "1"

      - name: R6 exact four-width LIVE QA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/gyosei-r6-qa"
          cat > "$RUNNER_TEMP/gyosei-r6-qa/r6_qa.py" <<'PY'
          import os, json, itertools
          from pathlib import Path
          from playwright.sync_api import sync_playwright

          PAGE="https://dpromstk2000-lab.github.io/dpro-line-systems-site/systems/gyosei.html"
          RESOURCES={
            "quick-start":"https://dpromstk2000-lab.github.io/dpro-gyosei-permit-line/manuals/DPRO_TUTORIAL_GYOSEI_QUICK_START_V1.0.pdf",
            "detailed-manual":"https://dpromstk2000-lab.github.io/dpro-gyosei-permit-line/manuals/DPRO_TUTORIAL_GYOSEI_DETAILED_MANUAL_V1.0.pdf",
            "tutorial":"https://dpromstk2000-lab.github.io/dpro-gyosei-permit-line/tutorial.html",
            "guide-center":"https://dpromstk2000-lab.github.io/dpro-gyosei-permit-line/demo-guide.html",
            "public-demo":"https://dpromstk2000-lab.github.io/dpro-gyosei-permit-line/",
          }
          VIEWPORTS=[
            ("pc1440",1440,1000),
            ("tablet1024",1024,768),
            ("mobile390",390,844),
            ("mobile320",320,720),
          ]
          OUT=Path(os.environ["RUNNER_TEMP"])/"gyosei-r6-qa"
          screenshots=OUT/"screenshots"
          screenshots.mkdir(parents=True,exist_ok=True)

          report={
            "system":"GYOSEI",
            "batch":"09",
            "stage":"R6",
            "productPage":PAGE,
            "preHead":os.environ["R6_PRE_HEAD"],
            "preTree":os.environ["R6_PRE_TREE"],
            "postHead":os.environ["R6_POST_HEAD"],
            "postTree":os.environ["R6_POST_TREE"],
            "r5AppHead":"fa3f9af96c32c05e7f0d3c8281c006a0028efe7b",
            "r5Pass":True,
            "first10Count":10,
            "guideCount":10,
            "resources":RESOURCES,
            "resourceReachability":{},
            "viewports":[],
            "crossSystemEdit":0,
            "productRegression":0,
            "businessMutation":0,
            "unsafeWriteRequestCount":0,
            "ok":False,
          }

          with sync_playwright() as pw:
            browser=pw.chromium.launch(headless=True)

            request=pw.request.new_context(extra_http_headers={"Cache-Control":"no-cache"})
            for key,url in RESOURCES.items():
              resp=request.get(url, timeout=30000)
              body=resp.body()
              is_pdf=key in ("quick-start","detailed-manual")
              magic=(not is_pdf) or body.startswith(b"%PDF-")
              ok=(resp.status==200 and len(body)>0 and magic)
              report["resourceReachability"][key]={
                "status":resp.status,
                "bytes":len(body),
                "pdfMagic":magic if is_pdf else None,
                "ok":ok,
              }
              assert ok,(key,resp.status,len(body),body[:8])
            request.dispose()

            for name,width,height in VIEWPORTS:
              ctx=browser.new_context(viewport={"width":width,"height":height})
              page=ctx.new_page()
              unsafe=[]
              page_errors=[]
              console_errors=[]

              page.on("request",lambda r,arr=unsafe: arr.append({"method":r.method,"url":r.url}) if r.method not in ("GET","HEAD","OPTIONS") else None)
              page.on("pageerror",lambda e,arr=page_errors: arr.append(str(e)))
              page.on("console",lambda m,arr=console_errors: arr.append(m.text) if m.type=="error" else None)

              resp=page.goto(f"{PAGE}?r6={report['postHead']}-{name}",wait_until="networkidle",timeout=45000)
              assert resp and resp.status==200,(name,resp.status if resp else None)
              page.wait_for_function("()=>document.body.innerHTML.includes('GYOSEI-R6-TUTORIAL-RESOURCES-V1.0-20260829')",timeout=20000)

              demo_label=page.locator("[data-r6-demo-label]")
              assert demo_label.count()==1 and demo_label.is_visible(),name
              assert demo_label.inner_text().strip()=="Demo",demo_label.inner_text()

              grid=page.locator("[data-r6-resource-grid]")
              assert grid.count()==1 and grid.is_visible()
              cards=page.locator("[data-r6-card]")
              assert cards.count()==5,cards.count()

              links={}
              focus_ok=True
              clipped=[]
              for key,url in RESOURCES.items():
                loc=page.locator(f'[data-r6-resource="{key}"]')
                assert loc.count()==1 and loc.is_visible(),(name,key)
                href=loc.get_attribute("href")
                assert href==url,(name,key,href,url)
                loc.focus()
                focus_ok = focus_ok and page.evaluate("(el)=>document.activeElement===el",loc.element_handle())
                b=loc.bounding_box()
                assert b,(name,key)
                if b["x"] < -1 or b["x"]+b["width"] > width+1:
                  clipped.append(key)
                links[key]={"href":href,"visible":True}

              overflow=page.evaluate("()=>document.documentElement.scrollWidth>window.innerWidth+1")
              assert not overflow,(name,width,page.evaluate("()=>[document.documentElement.scrollWidth,window.innerWidth]"))
              assert not clipped,(name,clipped)

              rects=[]
              for i in range(cards.count()):
                r=cards.nth(i).bounding_box()
                assert r
                rects.append(r)
              overlap_pairs=[]
              for a,b in itertools.combinations(range(len(rects)),2):
                r1,r2=rects[a],rects[b]
                ox=max(0,min(r1["x"]+r1["width"],r2["x"]+r2["width"])-max(r1["x"],r2["x"]))
                oy=max(0,min(r1["y"]+r1["height"],r2["y"]+r2["height"])-max(r1["y"],r2["y"]))
                if ox*oy > 1:
                  overlap_pairs.append([a,b])
              assert not overlap_pairs,(name,overlap_pairs)

              body=page.locator("body").inner_text()
              regression={
                "price":"5,500円" in body,
                "line":page.locator('a[href="https://lin.ee/YxJGXV6D"]').count()>0,
                "live":page.locator("#live").count()==1,
                "priceSection":page.locator("#price").count()==1,
                "demoSource":page.locator('[data-src*="dpro-gyosei-permit-line/index.html?demo=1"]').count()>0,
                "systemCode":page.locator('body[data-system-code="GYOSEI"]').count()==1,
              }
              assert all(regression.values()),(name,regression)

              assert not unsafe,(name,unsafe)
              assert not page_errors,(name,page_errors)
              assert not console_errors,(name,console_errors)

              shot=screenshots/f"{name}.png"
              page.screenshot(path=str(shot),full_page=True)

              report["viewports"].append({
                "name":name,
                "width":width,
                "height":height,
                "status":resp.status,
                "demoVisible":True,
                "resourceCount":5,
                "links":links,
                "focusVisibleRecoverable":focus_ok,
                "overflow":overflow,
                "clipped":clipped,
                "overlapPairs":overlap_pairs,
                "regression":regression,
                "unsafeWriteRequests":unsafe,
                "pageErrors":page_errors,
                "consoleErrors":console_errors,
                "screenshot":str(shot),
                "ok":True,
              })
              ctx.close()

            browser.close()

          report["unsafeWriteRequestCount"]=sum(len(x["unsafeWriteRequests"]) for x in report["viewports"])
          report["ok"]=(
            report["r5Pass"]
            and report["first10Count"]==10
            and report["guideCount"]==10
            and len(report["resources"])==5
            and all(x["ok"] for x in report["resourceReachability"].values())
            and all(x["ok"] for x in report["viewports"])
            and report["crossSystemEdit"]==0
            and report["productRegression"]==0
            and report["businessMutation"]==0
            and report["unsafeWriteRequestCount"]==0
          )
          assert report["ok"],report

          (OUT/"r6-live-qa.json").write_text(json.dumps(report,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          (OUT/"SOURCE_LOCK_R6.txt").write_text(
            "\n".join([
              "SYSTEM=GYOSEI",
              "BATCH=09",
              "STAGE=R6",
              f"PRODUCT_SITE_PRE_HEAD={report['preHead']}",
              f"PRODUCT_SITE_PRE_TREE={report['preTree']}",
              f"PRODUCT_SITE_POST_HEAD={report['postHead']}",
              f"PRODUCT_SITE_POST_TREE={report['postTree']}",
              "R5_APP_HEAD=fa3f9af96c32c05e7f0d3c8281c006a0028efe7b",
              "R5=PASS",
              "FIRST10_COUNT=10",
              "GUIDE_COUNT=10",
              "RESOURCE_COUNT=5",
              "DEMO_VISIBLE=PASS",
              "EXACT_ROUTES_REACHABLE=PASS",
              "CROSS_SYSTEM_EDIT=0",
              "PRODUCT_REGRESSION=0",
              "BUSINESS_MUTATION=0",
              "UNSAFE_WRITE_REQUEST=0",
              "R6_LIVE_QA=PASS",
              "R7=NOT_AUTHORIZED_NOT_EXECUTED",
            ])+"\n",
            encoding="utf-8"
          )
          print(json.dumps(report,ensure_ascii=False,indent=2))
          PY

          python "$RUNNER_TEMP/gyosei-r6-qa/r6_qa.py"

      - name: Verify R6 commit scope against prewrite source
        shell: bash
        run: |
          set -euo pipefail
          PRE_HEAD="$R6_PRE_HEAD"
          POST_HEAD="$R6_POST_HEAD"

          git fetch origin main
          git merge-base --is-ancestor "$POST_HEAD" origin/main
          git merge-base --is-ancestor "$PRE_HEAD" "$POST_HEAD"

          mapfile -t changed < <(git diff --name-only "$PRE_HEAD" "$POST_HEAD" | sort)
          test "${#changed[@]}" -eq 2
          test "${changed[0]}" = "systems/gyosei.html"
          test "${changed[1]}" = "systems/gyosei.html.txt"

          cmp -s systems/gyosei.html systems/gyosei.html.txt
          echo "CROSS_SYSTEM_EDIT=0"
          echo "FORWARD_ONLY=PASS"

      - name: Upload R6 QA artifact
        uses: actions/upload-artifact@v4
        with:
          name: gyosei-r6-product-site-qa
          path: ${{ runner.temp }}/gyosei-r6-qa/
          if-no-files-found: error
          retention-days: 30

      - name: Enforce R6 FULL PASS
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path(os.environ["RUNNER_TEMP"])/"gyosei-r6-qa"/"r6-live-qa.json"
          r=json.loads(p.read_text(encoding="utf-8"))
          assert r["ok"] is True
          assert r["r5Pass"] is True
          assert r["first10Count"] == 10
          assert r["guideCount"] == 10
          assert len(r["resources"]) == 5
          assert len(r["viewports"]) == 4
          assert all(v["ok"] for v in r["viewports"])
          assert all(x["ok"] for x in r["resourceReachability"].values())
          assert r["crossSystemEdit"] == 0
          assert r["productRegression"] == 0
          assert r["businessMutation"] == 0
          assert r["unsafeWriteRequestCount"] == 0
          print("R6_AUTOMATED_FULL_PASS=TRUE")
          PY

      - name: Cleanup transient R6 workflow
        shell: bash
        run: |
          set -euo pipefail
          WORKFLOW=".github/workflows/STEP-GYOSEI-TUTORIAL-R6.yml"

          git fetch origin main
          git merge --ff-only origin/main
          git merge-base --is-ancestor "$R6_POST_HEAD" HEAD

          git config user.name "dpro-tutorial-qa-bot"
          git config user.email "actions@users.noreply.github.com"

          test -f "$WORKFLOW"
          git rm -f "$WORKFLOW"
          git commit -m "Complete GYOSEI Batch09 R6 Product Site LIVE QA [skip ci]"
          git push origin HEAD:main
