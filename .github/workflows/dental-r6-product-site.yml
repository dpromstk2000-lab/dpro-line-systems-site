name: DENTAL Tutorial R6 Product Site

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/dental-r6-product-site.yml"

permissions:
  contents: write

concurrency:
  group: dental-tutorial-r6-product-site
  cancel-in-progress: false

jobs:
  r6-product-site:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TARGET_HTML: systems/dental.html
      TARGET_TEXT: systems/dental.html.txt
      WORKFLOW_PATH: .github/workflows/dental-r6-product-site.yml
      PRODUCT_URL: https://dpromstk2000-lab.github.io/dpro-line-systems-site/systems/dental.html
      TUTORIAL_URL: https://dpromstk2000-lab.github.io/DEGITAL-QR/tutorial.html
      GUIDE_URL: https://dpromstk2000-lab.github.io/DEGITAL-QR/guide-center.html
      QUICK_URL: https://dpromstk2000-lab.github.io/DEGITAL-QR/DPRO_TUTORIAL_DENTAL_QUICK_START_V1.0.pdf
      DETAIL_URL: https://dpromstk2000-lab.github.io/DEGITAL-QR/DPRO_TUTORIAL_DENTAL_DETAILED_MANUAL_V1.0.pdf
      START_OBSERVED_PRODUCT_HEAD: 6bae91af90c9a250c50cdfee55c9ba870741085f
      R5_MANUAL_COMMIT: 298aed4226bf8cf89899285b7f9a0f9b6c705fa9
      R5_QA_RUN: "33228598841"

    steps:
      - name: Checkout newest Product Site main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Forward-only preflight immediately before write
        id: preflight
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa-r6
          git fetch origin main

          local_head="$(git rev-parse HEAD)"
          remote_head="$(git rev-parse origin/main)"
          test "$local_head" = "$remote_head" || {
            echo "Product Site main advanced after workflow upload. HOLD." >&2
            exit 1
          }

          upload_base="$(git rev-parse HEAD^)"
          upload_base_tree="$(git rev-parse "${upload_base}^{tree}")"
          mapfile -t upload_changed < <(git diff --name-only "$upload_base" HEAD)
          test "${#upload_changed[@]}" -eq 1
          test "${upload_changed[0]}" = "$WORKFLOW_PATH"

          git merge-base --is-ancestor "$START_OBSERVED_PRODUCT_HEAD" "$upload_base" || {
            echo "Observed Product Site head is not an ancestor of newest upload base. HOLD." >&2
            exit 1
          }

          test -s "$TARGET_HTML"
          test -s "$TARGET_TEXT"
          cmp -s "$TARGET_HTML" "$TARGET_TEXT"
          ! grep -q 'DPRO TUTORIAL DENTAL R6' "$TARGET_HTML"

          cp "$TARGET_HTML" /tmp/dental-r6-before.html
          sha256sum "$TARGET_HTML" "$TARGET_TEXT" > qa-r6/target-sha256-before.txt
          printf '%s\n' "$upload_base" > qa-r6/product-site-head-before-r6.txt
          printf '%s\n' "$upload_base_tree" > qa-r6/product-site-tree-before-r6.txt

          echo "upload_base=$upload_base" >> "$GITHUB_OUTPUT"
          echo "upload_base_tree=$upload_base_tree" >> "$GITHUB_OUTPUT"

      - name: Verify exact R5-published resources
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, urllib.request, json
          urls={
            "tutorial":os.environ["TUTORIAL_URL"],
            "guide":os.environ["GUIDE_URL"],
            "quick":os.environ["QUICK_URL"],
            "detail":os.environ["DETAIL_URL"],
          }
          out={}
          for name,url in urls.items():
            req=urllib.request.Request(url,headers={"User-Agent":"DPRO-R6-QA"})
            with urllib.request.urlopen(req,timeout=30) as r:
              code=r.status
            out[name]={"url":url,"status":code}
            if code!=200:
              raise SystemExit(f"{name} not reachable: HTTP {code}")
          with open("qa-r6/resource-status-before-write.json","w",encoding="utf-8") as f:
            json.dump(out,f,ensure_ascii=False,indent=2)
          PY

      - name: Integrate DENTAL Tutorial resources into target mirrors only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import os

          target=Path(os.environ["TARGET_HTML"])
          mirror=Path(os.environ["TARGET_TEXT"])
          text=target.read_text(encoding="utf-8")

          css_start="/* DPRO TUTORIAL DENTAL R6 CSS START */"
          css_end="/* DPRO TUTORIAL DENTAL R6 CSS END */"
          sec_start="<!-- DPRO TUTORIAL DENTAL R6 SECTION START -->"
          sec_end="<!-- DPRO TUTORIAL DENTAL R6 SECTION END -->"
          if any(m in text for m in (css_start,css_end,sec_start,sec_end)):
            raise SystemExit("DENTAL R6 marker already exists")

          css=f'''{css_start}
          .ps-tutorial-resources{{background:linear-gradient(135deg,#f4faf7 0%,#f8fbf9 55%,#fff 100%)}}
          .ps-tutorial-intro{{max-width:820px;margin:-.55rem 0 1.2rem;color:var(--dpro-warm-gray-600)}}
          .ps-tutorial-grid{{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.9rem}}
          .ps-tutorial-card{{display:flex;align-items:flex-start;gap:.85rem;min-width:0;min-height:126px;padding:1rem 1.05rem;border:1px solid var(--ps-line);border-radius:1rem;background:#fff;color:inherit;text-decoration:none;box-shadow:var(--dpro-shadow-sm);transition:transform .18s ease,border-color .18s ease}}
          .ps-tutorial-card:hover{{border-color:#94cdb5;transform:translateY(-1px)}}
          .ps-tutorial-card:focus-visible{{outline:3px solid #16845b;outline-offset:3px}}
          .ps-tutorial-card__no{{flex:0 0 40px;width:40px;height:40px;display:grid;place-items:center;border-radius:12px;background:var(--dpro-soft-green);color:var(--dpro-green);font-size:.76rem;font-weight:900}}
          .ps-tutorial-card strong{{display:block;color:var(--ps-deep);font-size:1rem;line-height:1.35}}
          .ps-tutorial-card small{{display:block;margin-top:.35rem;color:var(--dpro-warm-gray-600);font-size:.82rem;line-height:1.55}}
          .ps-tutorial-safe{{margin:1rem 0 0;padding:.85rem 1rem;border-left:4px solid var(--dpro-green);background:#fff;color:#40554d;font-size:.86rem}}
          @media(max-width:640px){{.ps-tutorial-grid{{grid-template-columns:1fr}}.ps-tutorial-card{{min-height:0}}}}
          {css_end}
          '''

          section=f'''{sec_start}
          <section aria-labelledby="tutorial-resources-title" class="dpro-section ps-tutorial-resources" id="tutorial-resources">
            <div class="dpro-container">
              <div class="ps-section-heading">
                <p class="ps-kicker">TUTORIAL &amp; GUIDE</p>
                <h2 id="tutorial-resources-title">操作を試す。ガイドで確認する。</h2>
                <p>歯科向けFirst10チュートリアル、Guide Center、印刷用マニュアルをここから確認できます。</p>
              </div>
              <p class="ps-tutorial-intro">Tutorialはデモ・確認用のRead Onlyガイドです。予約作成、急患申込、チェックイン、待ち状況変更、患者・家族データ変更、LINE連携、管理設定を自動実行しません。</p>
              <div class="ps-tutorial-grid">
                <a class="ps-tutorial-card" data-r6-resource="tutorial" href="{os.environ["TUTORIAL_URL"]}" rel="noopener" target="_blank">
                  <span class="ps-tutorial-card__no">01</span><span><strong>Tutorial Start</strong><small>First10をSTEP 1から開始。Start / Resume / Replayに対応。</small></span>
                </a>
                <a class="ps-tutorial-card" data-r6-resource="guide" href="{os.environ["GUIDE_URL"]}" rel="noopener" target="_blank">
                  <span class="ps-tutorial-card__no">02</span><span><strong>Guide Center</strong><small>First10の順序、対象画面、現在の進行状態を確認。</small></span>
                </a>
                <a class="ps-tutorial-card" data-r6-resource="quick" href="{os.environ["QUICK_URL"]}" rel="noopener" target="_blank">
                  <span class="ps-tutorial-card__no">03</span><span><strong>Quick Start PDF</strong><small>A4縦1ページ。入口、基本操作、安全なデモ範囲を短く確認。</small></span>
                </a>
                <a class="ps-tutorial-card" data-r6-resource="detail" href="{os.environ["DETAIL_URL"]}" rel="noopener" target="_blank">
                  <span class="ps-tutorial-card__no">04</span><span><strong>Detailed Manual PDF</strong><small>First10全10ステップ、Resume、Guide Center、モバイル・キーボード操作を確認。</small></span>
                </a>
              </div>
              <p class="ps-tutorial-safe"><strong>安全なデモ境界：</strong>実在する患者・家族・健康情報や認証情報を入力しないでください。Tutorial自体は業務データを書き換えません。</p>
            </div>
          </section>
          {sec_end}'''

          css_anchor="</style>"
          section_anchor='<section aria-labelledby="faq-title" class="dpro-section ps-section-soft master-section" data-master-section="11" id="faq">'
          if text.count(css_anchor)!=1:
            raise SystemExit(f"CSS anchor count {text.count(css_anchor)} != 1")
          if text.count(section_anchor)!=1:
            raise SystemExit(f"FAQ anchor count {text.count(section_anchor)} != 1")

          text=text.replace(css_anchor,css+"\n"+css_anchor,1)
          text=text.replace(section_anchor,section+"\n"+section_anchor,1)
          target.write_text(text,encoding="utf-8",newline="\n")
          mirror.write_bytes(target.read_bytes())
          PY

      - name: Static scope and regression gate
        shell: bash
        run: |
          set -euo pipefail
          cmp -s "$TARGET_HTML" "$TARGET_TEXT"
          git diff --check

          mapfile -t changed < <(git diff --name-only)
          test "${#changed[@]}" -eq 2
          test "${changed[0]}" = "$TARGET_HTML"
          test "${changed[1]}" = "$TARGET_TEXT"

          python - <<'PY'
          from pathlib import Path
          import os,re,json

          target=Path(os.environ["TARGET_HTML"])
          before=Path("/tmp/dental-r6-before.html").read_text(encoding="utf-8")
          after=target.read_text(encoding="utf-8")

          css_start="/* DPRO TUTORIAL DENTAL R6 CSS START */"
          css_end="/* DPRO TUTORIAL DENTAL R6 CSS END */"
          sec_start="<!-- DPRO TUTORIAL DENTAL R6 SECTION START -->"
          sec_end="<!-- DPRO TUTORIAL DENTAL R6 SECTION END -->"

          stripped=re.sub(re.escape(css_start)+r'.*?'+re.escape(css_end)+r'\n?', '', after, count=1, flags=re.S)
          stripped=re.sub(re.escape(sec_start)+r'.*?'+re.escape(sec_end)+r'\n?', '', stripped, count=1, flags=re.S)
          if stripped != before:
            raise SystemExit("Existing DENTAL Product Site content changed outside the authorized R6 insertion blocks")

          expected={
            "tutorial":os.environ["TUTORIAL_URL"],
            "guide":os.environ["GUIDE_URL"],
            "quick":os.environ["QUICK_URL"],
            "detail":os.environ["DETAIL_URL"],
          }
          for key,url in expected.items():
            needle=f'data-r6-resource="{key}" href="{url}"'
            if after.count(needle)!=1:
              raise SystemExit(f"Exact R6 link mismatch: {key}")

          preserved=[
            "5,500円",
            "https://lin.ee/YxJGXV6D",
            "https://dpromstk2000-lab.github.io/DEGITAL-QR/hybrid.html?t=demo-dental-patient-001",
            "../lp-dental.html",
            "../flyer-dental.html",
            "../flyer-dental.pdf",
            "../systems-data.js",
            "../dpro-v3.js",
          ]
          for s in preserved:
            if s not in after:
              raise SystemExit(f"Preserved Product Site item missing: {s}")

          evidence={
            "scope":["systems/dental.html","systems/dental.html.txt"],
            "mirrors_byte_identical":True,
            "existing_content_preserved_exactly_outside_r6_blocks":True,
            "exact_links":expected,
            "preserved_items":preserved,
          }
          Path("qa-r6/static-gate.json").write_text(json.dumps(evidence,ensure_ascii=False,indent=2),encoding="utf-8")
          PY

          sha256sum "$TARGET_HTML" "$TARGET_TEXT" > qa-r6/target-sha256-after-patch.txt
          git diff -- "$TARGET_HTML" > qa-r6/dental-r6-target.patch

      - name: Commit DENTAL target mirrors
        id: target_commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$TARGET_HTML" "$TARGET_TEXT"
          git diff --cached --quiet && { echo "No DENTAL R6 target changes to commit"; exit 1; }
          git commit -m "Integrate DENTAL Tutorial R6 Product Site"
          git push origin HEAD:main
          target_commit="$(git rev-parse HEAD)"
          target_tree="$(git rev-parse HEAD^{tree})"
          printf '%s\n' "$target_commit" > qa-r6/product-site-target-commit.txt
          printf '%s\n' "$target_tree" > qa-r6/product-site-target-tree.txt
          echo "target_commit=$target_commit" >> "$GITHUB_OUTPUT"
          echo "target_tree=$target_tree" >> "$GITHUB_OUTPUT"

      - name: Install isolated Playwright
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/dental-r6-pw
          cd /tmp/dental-r6-pw
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Wait for DENTAL R6 Product Site publish
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            if curl -L -fsS -H 'Cache-Control: no-cache' \
              "${PRODUCT_URL}?r6=${{ steps.target_commit.outputs.target_commit }}&n=${i}" \
              | grep -q 'DPRO TUTORIAL DENTAL R6 SECTION START'; then
              echo "DENTAL R6 Product Site is live."
              exit 0
            fi
            sleep 10
          done
          echo "DENTAL R6 Product Site marker was not observable on GitHub Pages." >&2
          exit 1

      - name: Run exact-width DENTAL R6 LIVE QA
        shell: bash
        env:
          NODE_PATH: /tmp/dental-r6-pw/node_modules
        run: |
          set -euo pipefail
          cat > /tmp/dental-r6-live-qa.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'node:fs';

          const PRODUCT=process.env.PRODUCT_URL;
          const expected={
            tutorial:process.env.TUTORIAL_URL,
            guide:process.env.GUIDE_URL,
            quick:process.env.QUICK_URL,
            detail:process.env.DETAIL_URL,
          };
          const specs=[
            {name:'desktop',width:1440,height:1000},
            {name:'tablet',width:1024,height:768},
            {name:'mobile390',width:390,height:844},
            {name:'mobile320',width:320,height:720},
          ];
          const report={
            schema:'DPRO_TUTORIAL_DENTAL_R6_PRODUCT_SITE_QA_V1_0',
            system:'DENTAL',stage:'R6',
            productUrl:PRODUCT,expectedLinks:expected,
            sourceHead:process.env.GITHUB_SHA||'',
            targetCommit:process.env.R6_TARGET_COMMIT||'',
            viewports:[],resourceStatus:{},unsafeWrites:[],
            businessMutation:0,productSiteRegression:0,failures:[],pass:false
          };

          const browser=await chromium.launch({headless:true});
          for(const spec of specs){
            const context=await browser.newContext({viewport:{width:spec.width,height:spec.height}});
            const page=await context.newPage();
            const row={...spec,pageErrors:[],consoleErrors:[],unsafeWrites:[],focus:{},failures:[]};
            const fail=m=>{row.failures.push(m);report.failures.push(`${spec.name}: ${m}`);};

            page.on('pageerror',e=>row.pageErrors.push(String(e?.stack||e?.message||e)));
            page.on('console',m=>{
              if(m.type()==='error'){
                const loc=m.location();
                row.consoleErrors.push({text:m.text(),url:loc?.url||'',line:loc?.lineNumber??null});
              }
            });
            page.on('request',req=>{
              if(!['GET','HEAD','OPTIONS'].includes(req.method())){
                const r={method:req.method(),url:req.url(),resourceType:req.resourceType()};
                row.unsafeWrites.push(r);report.unsafeWrites.push(r);
              }
            });

            await page.goto(`${PRODUCT}?r6qa=${spec.name}-${Date.now()}`,{waitUntil:'domcontentloaded',timeout:60000});
            await page.waitForTimeout(800);

            row.metrics=await page.evaluate(()=>({
              innerWidth,
              documentElementScrollWidth:document.documentElement.scrollWidth,
              bodyScrollWidth:document.body.scrollWidth,
              marker:document.documentElement.innerHTML.includes('DPRO TUTORIAL DENTAL R6 SECTION START'),
              r6Count:document.querySelectorAll('[data-r6-resource]').length,
              links:Object.fromEntries([...document.querySelectorAll('[data-r6-resource]')].map(a=>[a.dataset.r6Resource,a.href])),
              visible:Object.fromEntries([...document.querySelectorAll('[data-r6-resource]')].map(a=>{const r=a.getBoundingClientRect();return[a.dataset.r6Resource,r.width>0&&r.height>0]})),
              masterSections:document.querySelectorAll('.master-section').length,
              functions:!!document.querySelector('#functions'),
              live:!!document.querySelector('#live'),
              price:!!document.querySelector('#price'),
              faq:!!document.querySelector('#faq'),
              finalCta:!!document.querySelector('#final-cta'),
              priceText:document.body.textContent.includes('5,500円'),
              lineCta:!!document.querySelector('a[href="https://lin.ee/YxJGXV6D"]'),
              liveDemo:!!document.querySelector('a[href="https://dpromstk2000-lab.github.io/DEGITAL-QR/hybrid.html?t=demo-dental-patient-001"]'),
              lp:!!document.querySelector('a[href="../lp-dental.html"]'),
              flyer:!!document.querySelector('a[href="../flyer-dental.html"]'),
              flyerPdf:!!document.querySelector('a[href="../flyer-dental.pdf"]'),
              systemsData:!!document.querySelector('script[src="../systems-data.js"]'),
              dproV3:!!document.querySelector('script[src="../dpro-v3.js"]'),
              duplicateIds:(()=>{const ids=[...document.querySelectorAll('[id]')].map(x=>x.id);return ids.length-new Set(ids).size})(),
            }));

            if(row.metrics.innerWidth!==spec.width) fail(`innerWidth ${row.metrics.innerWidth} != ${spec.width}`);
            if(['mobile390','mobile320'].includes(spec.name)){
              if(row.metrics.documentElementScrollWidth>row.metrics.innerWidth) fail(`document overflow ${row.metrics.documentElementScrollWidth}>${row.metrics.innerWidth}`);
              if(row.metrics.bodyScrollWidth>row.metrics.innerWidth) fail(`body overflow ${row.metrics.bodyScrollWidth}>${row.metrics.innerWidth}`);
            }
            if(!row.metrics.marker||row.metrics.r6Count!==4) fail('R6 resource section missing or count != 4');
            for(const [k,u] of Object.entries(expected)){
              if(row.metrics.links[k]!==u) fail(`exact link mismatch ${k}`);
              if(row.metrics.visible[k]!==true) fail(`resource not visible ${k}`);
            }
            const regKeys=['functions','live','price','faq','finalCta','priceText','lineCta','liveDemo','lp','flyer','flyerPdf','systemsData','dproV3'];
            if(row.metrics.masterSections!==12) fail(`master section regression ${row.metrics.masterSections} != 12`);
            for(const k of regKeys) if(row.metrics[k]!==true) fail(`Product Site regression invariant failed: ${k}`);
            if(row.metrics.duplicateIds!==0) fail(`duplicate IDs ${row.metrics.duplicateIds}`);

            await page.evaluate(()=>document.activeElement?.blur());
            const found={};
            for(let i=0;i<120&&Object.keys(found).length<4;i++){
              await page.keyboard.press('Tab');
              const state=await page.evaluate(()=>{
                const e=document.activeElement;
                const key=e?.dataset?.r6Resource||'';
                if(!key)return null;
                const s=getComputedStyle(e),r=e.getBoundingClientRect();
                return {key,outlineStyle:s.outlineStyle,outlineWidth:parseFloat(s.outlineWidth||'0'),width:r.width,height:r.height};
              });
              if(state?.key&&!found[state.key]) found[state.key]=state;
            }
            row.focus=found;
            for(const k of Object.keys(expected)){
              const f=found[k];
              if(!f||f.outlineStyle==='none'||!(f.outlineWidth>0)||!(f.width>0&&f.height>0)) fail(`keyboard focus not visibly proven: ${k}`);
            }

            if(row.pageErrors.length) fail(`pageerror ${row.pageErrors.join(' | ')}`);
            if(row.consoleErrors.length) fail(`console error ${row.consoleErrors.map(x=>x.text).join(' | ')}`);
            if(row.unsafeWrites.length) fail(`unsafe writes ${row.unsafeWrites.length}`);

            row.pass=row.failures.length===0;
            report.viewports.push(row);
            await context.close();
          }
          await browser.close();

          for(const [name,url] of Object.entries(expected)){
            const r=await fetch(url,{method:'GET',redirect:'follow'});
            report.resourceStatus[name]={url,status:r.status,ok:r.ok};
            if(!r.ok) report.failures.push(`resource ${name} HTTP ${r.status}`);
          }

          report.businessMutation=report.unsafeWrites.length;
          report.productSiteRegression=report.failures.some(x=>x.includes('Product Site regression')||x.includes('master section regression')||x.includes('duplicate IDs'))?1:0;
          report.pass=report.failures.length===0&&report.businessMutation===0&&report.productSiteRegression===0&&report.viewports.every(v=>v.pass);
          report.completedAt=new Date().toISOString();
          fs.mkdirSync('qa-r6',{recursive:true});
          fs.writeFileSync('qa-r6/dental-r6-live-qa.json',JSON.stringify(report,null,2));
          console.log(JSON.stringify({
            pass:report.pass,
            viewports:report.viewports.map(v=>({name:v.name,pass:v.pass,width:v.metrics?.innerWidth,doc:v.metrics?.documentElementScrollWidth,body:v.metrics?.bodyScrollWidth,focus:Object.keys(v.focus||{}),pageErrors:v.pageErrors.length,consoleErrors:v.consoleErrors.length,unsafeWrites:v.unsafeWrites.length})),
            resources:report.resourceStatus,
            businessMutation:report.businessMutation,
            productSiteRegression:report.productSiteRegression,
            failures:report.failures
          },null,2));
          if(!report.pass)process.exit(1);
          JS
          R6_TARGET_COMMIT="${{ steps.target_commit.outputs.target_commit }}" node /tmp/dental-r6-live-qa.mjs

      - name: Remove temporary R6 workflow forward-only
        id: cleanup
        shell: bash
        run: |
          set -euo pipefail
          target_commit="${{ steps.target_commit.outputs.target_commit }}"
          upload_base="${{ steps.preflight.outputs.upload_base }}"
          upload_base_tree="${{ steps.preflight.outputs.upload_base_tree }}"

          git fetch origin main
          remote_head="$(git rev-parse origin/main)"
          git merge-base --is-ancestor "$target_commit" "$remote_head" || {
            echo "Target commit is no longer an ancestor of Product Site main. HOLD." >&2
            exit 1
          }

          git checkout -B dental-r6-cleanup origin/main
          test -f "$WORKFLOW_PATH"
          test -s "$TARGET_HTML"
          test -s "$TARGET_TEXT"
          cmp -s "$TARGET_HTML" "$TARGET_TEXT"
          grep -q 'DPRO TUTORIAL DENTAL R6 SECTION START' "$TARGET_HTML"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm "$WORKFLOW_PATH"
          git commit -m "Remove DENTAL R6 temporary QA workflow [skip ci]"
          git push origin HEAD:main

          final_head="$(git rev-parse HEAD)"
          final_tree="$(git rev-parse HEAD^{tree})"
          git merge-base --is-ancestor "$START_OBSERVED_PRODUCT_HEAD" "$final_head"
          git merge-base --is-ancestor "$target_commit" "$final_head"

          printf '%s\n' "$final_head" > qa-r6/product-site-final-head.txt
          printf '%s\n' "$final_tree" > qa-r6/product-site-final-tree.txt
          printf '%s\n' "$upload_base" > qa-r6/product-site-upload-base.txt
          printf '%s\n' "$upload_base_tree" > qa-r6/product-site-upload-base-tree.txt
          sha256sum "$TARGET_HTML" "$TARGET_TEXT" > qa-r6/target-sha256-final.txt
          git diff --name-status "$upload_base" "$final_head" > qa-r6/net-diff-from-upload-base.txt || true

          echo "final_head=$final_head" >> "$GITHUB_OUTPUT"
          echo "final_tree=$final_tree" >> "$GITHUB_OUTPUT"

      - name: Finalize R6 evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json,os

          p=Path("qa-r6/dental-r6-live-qa.json")
          d=json.loads(p.read_text(encoding="utf-8"))
          d.update({
            "r4_central":"ACCEPTED",
            "r5":"PASS",
            "r5QaRun":os.environ["R5_QA_RUN"],
            "r5ManualCommit":os.environ["R5_MANUAL_COMMIT"],
            "r6":"PASS",
            "first10Count":10,
            "businessMutation":0,
            "productSiteRollback":0,
            "forwardOnly":"PASS",
            "startObservedProductHead":os.environ["START_OBSERVED_PRODUCT_HEAD"],
            "uploadBase":Path("qa-r6/product-site-upload-base.txt").read_text().strip(),
            "uploadBaseTree":Path("qa-r6/product-site-upload-base-tree.txt").read_text().strip(),
            "targetCommit":Path("qa-r6/product-site-target-commit.txt").read_text().strip(),
            "targetTree":Path("qa-r6/product-site-target-tree.txt").read_text().strip(),
            "finalHead":Path("qa-r6/product-site-final-head.txt").read_text().strip(),
            "finalTree":Path("qa-r6/product-site-final-tree.txt").read_text().strip(),
            "changedFiles":["systems/dental.html","systems/dental.html.txt"],
            "normalTextByteIdentical":True,
            "r7":"NOT_AUTHORIZED_NOT_EXECUTED",
            "finalLock":"CENTRAL_DECISION_ONLY",
          })
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2),encoding="utf-8")
          PY

      - name: Upload DENTAL R6 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dental-r6-product-site-qa
          path: |
            qa-r6/
          if-no-files-found: warn
          retention-days: 90
