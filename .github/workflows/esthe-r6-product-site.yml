name: ESTHE Tutorial R6 Product Site

on:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/esthe-r6-product-site.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: esthe-r6-product-site
  cancel-in-progress: false

jobs:
  integrate-and-live-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TARGET_HTML: systems/esthe.html
      TARGET_TEXT: systems/esthe.html.txt
      WORKFLOW_PATH: .github/workflows/esthe-r6-product-site.yml
      PRODUCT_URL: https://dpromstk2000-lab.github.io/dpro-line-systems-site/systems/esthe.html
      OBSERVED_PRODUCT_HEAD: bbe1447136fb68af07ecc3cf2e910c4db5600893
      TUTORIAL_URL: https://dpromstk2000-lab.github.io/dpro-esthe-relax-line-liff/tutorial-start.html
      GUIDE_URL: https://dpromstk2000-lab.github.io/dpro-esthe-relax-line-liff/guide-center.html
      QUICK_URL: https://dpromstk2000-lab.github.io/dpro-esthe-relax-line-liff/manuals/DPRO_TUTORIAL_ESTHE_QUICK_START_V1.0.pdf
      DETAIL_URL: https://dpromstk2000-lab.github.io/dpro-esthe-relax-line-liff/manuals/DPRO_TUTORIAL_ESTHE_DETAILED_MANUAL_V1.0.pdf

    steps:
      - name: Checkout newest Product Site main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify upload boundary and newest forward-only base
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa-r6
          git fetch origin main
          local_head="$(git rev-parse HEAD)"
          remote_head="$(git rev-parse origin/main)"
          test "$local_head" = "$remote_head" || {
            echo "Product Site main advanced after workflow checkout; HOLD."
            exit 1
          }

          upload_base="$(git rev-parse HEAD^)"
          mapfile -t upload_changed < <(git diff --name-only "$upload_base" HEAD)
          test "${#upload_changed[@]}" -eq 1
          test "${upload_changed[0]}" = "$WORKFLOW_PATH"

          git merge-base --is-ancestor "$OBSERVED_PRODUCT_HEAD" "$upload_base"

          test -s "$TARGET_HTML"
          test -s "$TARGET_TEXT"
          cmp -s "$TARGET_HTML" "$TARGET_TEXT"

          grep -q '5,500円' "$TARGET_HTML"
          grep -q 'https://lin.ee/YxJGXV6D' "$TARGET_HTML"
          grep -q 'index-brush.html?v=esthe-next-10b' "$TARGET_HTML"
          grep -q '../lp-esthe.html' "$TARGET_HTML"
          grep -q '../flyer-esthe.html' "$TARGET_HTML"
          grep -q '../flyer-esthe.pdf' "$TARGET_HTML"

          if grep -q 'DPRO TUTORIAL ESTHE R6' "$TARGET_HTML"; then
            echo "R6 marker already exists; refusing duplicate insertion."
            exit 1
          fi

          printf '%s\n' "$upload_base" > qa-r6/product-base-head.txt
          git rev-parse "$upload_base^{tree}" > qa-r6/product-base-tree.txt
          sha256sum "$TARGET_HTML" "$TARGET_TEXT" > qa-r6/target-sha256-before.txt

          echo "UPLOAD_HEAD=$local_head" >> "$GITHUB_ENV"
          echo "PRODUCT_BASE_HEAD=$upload_base" >> "$GITHUB_ENV"
          echo "PRODUCT_BASE_TREE=$(git rev-parse "$upload_base^{tree}")" >> "$GITHUB_ENV"

      - name: Verify published R5 destinations
        shell: bash
        run: |
          set -euo pipefail
          for url in "$TUTORIAL_URL" "$GUIDE_URL" "$QUICK_URL" "$DETAIL_URL"; do
            code="$(curl -L -sS -o /tmp/r6-resource.bin -w '%{http_code}' "$url")"
            test "$code" = "200" || {
              echo "R5 resource not reachable: $url HTTP $code"
              exit 1
            }
            echo "$code  $url"
          done

      - name: Re-fetch main immediately before write
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" || {
            echo "Product Site main changed immediately before R6 write; HOLD."
            exit 1
          }

      - name: Integrate ESTHE Tutorial resources into target mirrors only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import os

          html_path = Path(os.environ["TARGET_HTML"])
          text_path = Path(os.environ["TARGET_TEXT"])

          original = html_path.read_text(encoding="utf-8")
          mirror = text_path.read_text(encoding="utf-8")
          if original != mirror:
              raise SystemExit("normal/TEXT were not byte-identical before R6")

          marker = "DPRO TUTORIAL ESTHE R6"
          if marker in original:
              raise SystemExit("duplicate R6 marker")

          anchor = '<section aria-labelledby="final-title" class="dpro-section ps-final master-section"'
          if original.count(anchor) != 1:
              raise SystemExit(f"final CTA anchor count != 1: {original.count(anchor)}")

          tutorial = os.environ["TUTORIAL_URL"]
          guide = os.environ["GUIDE_URL"]
          quick = os.environ["QUICK_URL"]
          detail = os.environ["DETAIL_URL"]

          section = f'''<!-- {marker} -->
          <section aria-labelledby="tutorial-resources-title" class="dpro-section ps-section-soft" id="tutorial-resources">
            <div class="dpro-container">
              <div class="ps-section-heading">
                <p class="ps-kicker">TUTORIAL &amp; MANUAL</p>
                <h2 id="tutorial-resources-title">操作ガイド・印刷マニュアル</h2>
                <p>10ステップのTutorial、Guide Center、印刷用Quick Startと詳細マニュアルを、ここからいつでも確認できます。</p>
              </div>
              <div aria-label="チュートリアルと操作資料" class="ps-doclinks">
                <a data-r6-resource="tutorial" href="{tutorial}" rel="noopener" target="_blank">Tutorial Start｜10ステップを開始</a>
                <a data-r6-resource="guide" href="{guide}" rel="noopener" target="_blank">Guide Center｜操作ガイドを見る</a>
                <a data-r6-resource="quick" href="{quick}" rel="noopener" target="_blank">Quick Start PDF｜1ページ版</a>
                <a data-r6-resource="detail" href="{detail}" rel="noopener" target="_blank">Detailed Manual PDF｜詳細版</a>
              </div>
            </div>
          </section>'''

          updated = original.replace(anchor, section + anchor, 1)

          for key, expected in {
              "tutorial": tutorial,
              "guide": guide,
              "quick": quick,
              "detail": detail,
          }.items():
              token = f'data-r6-resource="{key}" href="{expected}"'
              if updated.count(token) != 1:
                  raise SystemExit(f"resource token mismatch: {key}")

          html_path.write_text(updated, encoding="utf-8", newline="")
          text_path.write_text(updated, encoding="utf-8", newline="")
          PY

          cmp -s "$TARGET_HTML" "$TARGET_TEXT"
          grep -q 'DPRO TUTORIAL ESTHE R6' "$TARGET_HTML"
          grep -q 'data-r6-resource="tutorial"' "$TARGET_HTML"
          grep -q 'data-r6-resource="guide"' "$TARGET_HTML"
          grep -q 'data-r6-resource="quick"' "$TARGET_HTML"
          grep -q 'data-r6-resource="detail"' "$TARGET_HTML"

          mapfile -t changed < <(git diff --name-only | sort)
          expected="$(printf '%s\n' "$TARGET_HTML" "$TARGET_TEXT" | sort)"
          actual="$(printf '%s\n' "${changed[@]}" | sort)"
          test "$actual" = "$expected"

          sha256sum "$TARGET_HTML" "$TARGET_TEXT" > qa-r6/target-sha256-after.txt

      - name: Commit target pair and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "DPRO Tutorial Actions"
          git config user.email "actions@users.noreply.github.com"

          git add "$TARGET_HTML" "$TARGET_TEXT"
          git rm "$WORKFLOW_PATH"

          git commit -m "DPRO ESTHE Tutorial R6: integrate Product Site resources"

          mapfile -t final_changed < <(git diff --name-only "$PRODUCT_BASE_HEAD" HEAD | sort)
          expected="$(printf '%s\n' "$TARGET_HTML" "$TARGET_TEXT" | sort)"
          actual="$(printf '%s\n' "${final_changed[@]}" | sort)"
          test "$actual" = "$expected"

          cmp -s "$TARGET_HTML" "$TARGET_TEXT"

          git fetch origin main
          test "$(git rev-parse HEAD^)" = "$(git rev-parse origin/main)" || {
            echo "Product Site main advanced before push; HOLD to preserve concurrent changes."
            exit 1
          }

          git push origin HEAD:main

          final_head="$(git rev-parse HEAD)"
          final_tree="$(git rev-parse HEAD^{tree})"
          printf '%s\n' "$final_head" > qa-r6/product-final-head.txt
          printf '%s\n' "$final_tree" > qa-r6/product-final-tree.txt
          printf '%s\n' "${final_changed[@]}" > qa-r6/r6-changed-files.txt

          echo "R6_FINAL_HEAD=$final_head" >> "$GITHUB_ENV"
          echo "R6_FINAL_TREE=$final_tree" >> "$GITHUB_ENV"

      - name: Wait for Product Site Pages marker
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 90); do
            if curl -fsSL "${PRODUCT_URL}?r6=${R6_FINAL_HEAD}-${i}" -o /tmp/esthe-product-live.html &&
               grep -q 'DPRO TUTORIAL ESTHE R6' /tmp/esthe-product-live.html; then
              echo "Product Site R6 marker ready"
              exit 0
            fi
            sleep 5
          done
          echo "Product Site R6 marker not ready" >&2
          exit 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null

      - name: Run mandatory R6 LIVE QA
        shell: bash
        run: |
          set -euo pipefail
          cat > esthe-r6-live-qa.mjs <<'NODE'
          import { chromium } from 'playwright';
          import fs from 'node:fs';

          const productUrl = process.env.PRODUCT_URL;
          const expected = {
            tutorial: process.env.TUTORIAL_URL,
            guide: process.env.GUIDE_URL,
            quick: process.env.QUICK_URL,
            detail: process.env.DETAIL_URL,
          };
          const viewports = [
            {name:'1440', width:1440, height:1000},
            {name:'1024', width:1024, height:768},
            {name:'390', width:390, height:844},
            {name:'320', width:320, height:720},
          ];

          const result = {
            schema: 'DPRO_TUTORIAL_ESTHE_R6_LIVE_QA_V1_0',
            checkedAt: new Date().toISOString(),
            productUrl,
            expected,
            productBaseHead: process.env.PRODUCT_BASE_HEAD,
            productBaseTree: process.env.PRODUCT_BASE_TREE,
            finalHead: process.env.R6_FINAL_HEAD,
            finalTree: process.env.R6_FINAL_TREE,
            viewports: [],
            resourceChecks: {},
            failures: [],
            businessMutationAttempts: [],
            productSiteRollback: 0,
            businessMutation: 0,
          };

          const fail = (message) => result.failures.push(message);
          const browser = await chromium.launch({headless:true});

          for (const vp of viewports) {
            const context = await browser.newContext({viewport:{width:vp.width,height:vp.height}});
            const pageErrors = [];
            const consoleErrors = [];
            const unsafe = [];

            await context.route('**/*', async route => {
              const method = route.request().method();
              if (['POST','PUT','PATCH','DELETE'].includes(method)) {
                const item = {method, url:route.request().url()};
                unsafe.push(item);
                result.businessMutationAttempts.push(item);
                return route.abort('blockedbyclient');
              }
              return route.continue();
            });

            const page = await context.newPage();
            page.on('pageerror', e => pageErrors.push(String(e)));
            page.on('console', m => { if (m.type() === 'error') consoleErrors.push(m.text()); });

            const response = await page.goto(`${productUrl}?qa=${Date.now()}-${vp.name}`, {waitUntil:'networkidle'});
            if (!response || response.status() !== 200) fail(`${vp.name}: product HTTP ${response?.status()}`);

            const metrics = await page.evaluate(() => {
              const links = [...document.querySelectorAll('[data-r6-resource]')]
                .map(a => ({key:a.getAttribute('data-r6-resource'), href:a.href, rawHref:a.getAttribute('href')}));
              return {
                innerWidth: window.innerWidth,
                documentScrollWidth: document.documentElement.scrollWidth,
                bodyScrollWidth: document.body.scrollWidth,
                marker: document.documentElement.innerHTML.includes('DPRO TUTORIAL ESTHE R6'),
                links,
                masterSections: document.querySelectorAll('.master-section').length,
                price: document.body.textContent.includes('5,500円'),
                lineCta: [...document.querySelectorAll('a')].some(a => a.href === 'https://lin.ee/YxJGXV6D'),
                liveDemo: [...document.querySelectorAll('a')].some(a => a.href === 'https://dpromstk2000-lab.github.io/dpro-esthe-relax-line-liff/index-brush.html?v=esthe-next-10b'),
                lp: [...document.querySelectorAll('a')].some(a => a.getAttribute('href') === '../lp-esthe.html'),
                flyerHtml: [...document.querySelectorAll('a')].some(a => a.getAttribute('href') === '../flyer-esthe.html'),
                flyerPdf: [...document.querySelectorAll('a')].some(a => a.getAttribute('href') === '../flyer-esthe.pdf'),
                dproShop: [...document.querySelectorAll('a')].some(a => a.href === 'https://dpro-shop.com/'),
              };
            });

            if (metrics.innerWidth !== vp.width) fail(`${vp.name}: innerWidth ${metrics.innerWidth} != ${vp.width}`);
            if (!metrics.marker) fail(`${vp.name}: R6 marker missing`);
            if (metrics.links.length !== 4) fail(`${vp.name}: resource link count ${metrics.links.length} != 4`);
            for (const [key,url] of Object.entries(expected)) {
              const found = metrics.links.find(x => x.key === key);
              if (!found || found.href !== url) fail(`${vp.name}: ${key} href mismatch ${found?.href}`);
            }

            if (vp.width <= 390) {
              if (metrics.documentScrollWidth > metrics.innerWidth) {
                fail(`${vp.name}: document overflow ${metrics.documentScrollWidth} > ${metrics.innerWidth}`);
              }
              if (metrics.bodyScrollWidth > metrics.innerWidth) {
                fail(`${vp.name}: body overflow ${metrics.bodyScrollWidth} > ${metrics.innerWidth}`);
              }
            }

            if (!metrics.price) fail(`${vp.name}: price regression`);
            if (!metrics.lineCta) fail(`${vp.name}: LINE CTA regression`);
            if (!metrics.liveDemo) fail(`${vp.name}: DEMO regression`);
            if (!metrics.lp) fail(`${vp.name}: LP regression`);
            if (!metrics.flyerHtml || !metrics.flyerPdf) fail(`${vp.name}: A4 sales material regression`);
            if (!metrics.dproShop) fail(`${vp.name}: DPRO SHOP regression`);
            if (metrics.masterSections !== 12) fail(`${vp.name}: master section count changed ${metrics.masterSections}`);

            await page.evaluate(() => {
              window.scrollTo(0,0);
              document.body.setAttribute('tabindex','-1');
              document.body.focus();
            });

            let focus = null;
            for (let i=0; i<100; i++) {
              await page.keyboard.press('Tab');
              focus = await page.evaluate(() => {
                const el = document.activeElement;
                if (!el) return null;
                const key = el.getAttribute?.('data-r6-resource');
                if (!key) return null;
                const style = getComputedStyle(el);
                return {
                  key,
                  focusVisible: el.matches(':focus-visible'),
                  outlineStyle: style.outlineStyle,
                  outlineWidth: style.outlineWidth,
                  boxShadow: style.boxShadow,
                };
              });
              if (focus) break;
            }

            if (!focus) {
              fail(`${vp.name}: keyboard could not reach R6 resource links`);
            } else {
              const outlineVisible = focus.outlineStyle !== 'none' && parseFloat(focus.outlineWidth || '0') > 0;
              const shadowVisible = focus.boxShadow && focus.boxShadow !== 'none';
              if (!focus.focusVisible || (!outlineVisible && !shadowVisible)) {
                fail(`${vp.name}: keyboard focus not visibly indicated ${JSON.stringify(focus)}`);
              }
            }

            if (pageErrors.length) fail(`${vp.name}: pageerror ${pageErrors.join(' | ')}`);
            if (consoleErrors.length) fail(`${vp.name}: console error ${consoleErrors.join(' | ')}`);
            if (unsafe.length) fail(`${vp.name}: unsafe writes ${JSON.stringify(unsafe)}`);

            await page.screenshot({path:`qa-r6/esthe-r6-${vp.name}.png`, fullPage:true});

            result.viewports.push({
              viewport: vp,
              metrics,
              focus,
              pageErrors,
              consoleErrors,
              unsafe,
            });

            await context.close();
          }

          const requestContext = await browser.newContext();
          for (const [key,url] of Object.entries(expected)) {
            const response = await requestContext.request.get(url, {failOnStatusCode:false});
            const contentType = response.headers()['content-type'] || '';
            const size = (await response.body()).length;
            result.resourceChecks[key] = {url, status:response.status(), contentType, size};
            if (response.status() !== 200) fail(`resource ${key}: HTTP ${response.status()}`);
            if ((key === 'quick' || key === 'detail') && !contentType.toLowerCase().includes('pdf')) {
              fail(`resource ${key}: content-type ${contentType}`);
            }
            if (size < 500) fail(`resource ${key}: suspiciously small response ${size}`);
          }
          await requestContext.close();
          await browser.close();

          if (result.businessMutationAttempts.length) result.businessMutation = result.businessMutationAttempts.length;
          result.pass = result.failures.length === 0 &&
                        result.businessMutation === 0 &&
                        result.productSiteRollback === 0;

          fs.writeFileSync('qa-r6/R6_QA_EVIDENCE.json', JSON.stringify(result, null, 2));
          console.log(JSON.stringify(result, null, 2));
          if (!result.pass) process.exit(1);
          NODE

          node esthe-r6-live-qa.mjs

      - name: Verify final git scope after LIVE QA
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$R6_FINAL_HEAD"
          cmp -s "$TARGET_HTML" "$TARGET_TEXT"
          mapfile -t final_changed < <(git diff --name-only "$PRODUCT_BASE_HEAD" "$R6_FINAL_HEAD" | sort)
          expected="$(printf '%s\n' "$TARGET_HTML" "$TARGET_TEXT" | sort)"
          actual="$(printf '%s\n' "${final_changed[@]}" | sort)"
          test "$actual" = "$expected"
          echo "PRODUCT_SITE_ROLLBACK=0" > qa-r6/R6_GIT_GATE.txt
          echo "FORWARD_ONLY=PASS" >> qa-r6/R6_GIT_GATE.txt
          echo "BUSINESS_MUTATION=0" >> qa-r6/R6_GIT_GATE.txt
          echo "NORMAL_TEXT_IDENTICAL=PASS" >> qa-r6/R6_GIT_GATE.txt
          echo "R6_FINAL_HEAD=$R6_FINAL_HEAD" >> qa-r6/R6_GIT_GATE.txt
          echo "R6_FINAL_TREE=$R6_FINAL_TREE" >> qa-r6/R6_GIT_GATE.txt
          sha256sum "$TARGET_HTML" "$TARGET_TEXT" > qa-r6/target-sha256-final.txt

      - name: Upload R6 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: esthe-r6-product-site-evidence
          path: qa-r6/
          if-no-files-found: error
          compression-level: 6
