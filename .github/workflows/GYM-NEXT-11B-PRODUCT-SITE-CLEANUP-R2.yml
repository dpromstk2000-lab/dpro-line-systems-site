name: STEP GYM-NEXT-11B-PRODUCT-SITE-CLEANUP-R2 - Fix Cleanup Marker

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/GYM-NEXT-11B-PRODUCT-SITE-CLEANUP-R2.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: gym-next-11b-product-site-cleanup-r2
  cancel-in-progress: false

env:
  WORKFLOW_FILE: .github/workflows/GYM-NEXT-11B-PRODUCT-SITE-CLEANUP-R2.yml
  STALE_WORKFLOW_FILE_R1: .github/workflows/GYM-NEXT-11B-PRODUCT-SITE-CLEANUP.yml
  PRODUCT_PAGE: systems/gym.html
  COMPLETION_YML: dpro-next/gym/GYM-NEXT-COMPLETE.yml
  COMPLETION_MD: dpro-next/gym/GYM-NEXT-COMPLETE.md
  BACKUP_TAG: backup-product-site-before-gym-next-11b-20260726
  PRODUCT_SITE_BASE: https://dpromstk2000-lab.github.io/dpro-line-systems-site
  GYM_BASE: https://dpromstk2000-lab.github.io/liff-gym-demo
  SOURCE_LEDGER_RAW: https://raw.githubusercontent.com/dpromstk2000-lab/liff-gym-demo/main/dpro-next/gym/next-ledger.yml
  SOURCE_QR_REPORT: https://dpromstk2000-lab.github.io/liff-gym-demo/deliverables/gym-next-10/operation-sheet-qr-check.json
  SOURCE_OPERATION_HTML: https://dpromstk2000-lab.github.io/liff-gym-demo/deliverables/gym-next-10/operation-sheet.html
  PDF_URL: https://dpromstk2000-lab.github.io/liff-gym-demo/deliverables/gym-next-10/DPRO_GYM_NEXT_operation_experience_sheet_20260726.pdf
  PNG_URL: https://dpromstk2000-lab.github.io/liff-gym-demo/deliverables/gym-next-10/DPRO_GYM_NEXT_operation_experience_sheet_20260726.png
  EXPECTED_PRODUCT_PAGE_BLOB: e29c23ab246d13c6179b34bf6f0a27331101b2d1
  EXPECTED_COMPLETION_YML_BLOB: ae50bc278cea0017240950658791a50fe560fbf8
  EXPECTED_COMPLETION_MD_BLOB: 802b1969245f08c4c3b4de3ba967493cb0a53254
  EXPECTED_PDF_SHA256: 0581ba706fed52de0c508548faaf9b2ab0f65aded36796dd9c0d96949bc0fc8f
  EXPECTED_PNG_SHA256: d27b5fd48dec81cf1099c8a37b8d6e59cb5a0eb0bf191727e66feb3120ceb103
  EXPECTED_SOURCE_DELIVERY_COMMIT: 548e6f8548db82e13cfdecf6bc952624b3d24926
  FAILED_R1_RUN_URL: https://github.com/dpromstk2000-lab/dpro-line-systems-site/actions/runs/30187172268

jobs:
  clean-product-page:
    name: Publish five-screen owner-facing product page
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout product site with complete history
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Configure Git identity
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "DPRO NEXT Actions"
          git config user.email "actions@users.noreply.github.com"

      - name: Confirm source completion and safe upload
        shell: bash
        run: |
          set -euo pipefail

          [[ "${GITHUB_REPOSITORY}" == "dpromstk2000-lab/dpro-line-systems-site" ]] || {
            echo "::error::This YML must run in dpromstk2000-lab/dpro-line-systems-site."
            exit 1
          }

          test -f "${WORKFLOW_FILE}"
          test -f "${STALE_WORKFLOW_FILE_R1}"
          test -f "${PRODUCT_PAGE}"
          test -f "${COMPLETION_YML}"
          test -f "${COMPLETION_MD}"

          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            UPLOAD_PARENT_SHA="$(git rev-parse "${GITHUB_SHA}^")"
            UNEXPECTED="$(
              git diff --name-only "${UPLOAD_PARENT_SHA}" "${GITHUB_SHA}" |
                grep -v -F -x "${WORKFLOW_FILE}" |
                sed '/^$/d' || true
            )"
            [[ -z "${UNEXPECTED}" ]] || {
              echo "::error::Upload commit must contain only ${WORKFLOW_FILE}."
              echo "${UNEXPECTED}"
              exit 1
            }
          else
            UPLOAD_PARENT_SHA="$(git rev-parse HEAD)"
          fi

          STEP_BASE_SHA="${UPLOAD_PARENT_SHA}"
          for _ in $(seq 1 20); do
            CHANGED="$(
              git diff-tree --no-commit-id --name-only -r                 "${STEP_BASE_SHA}" |
                sed '/^$/d' || true
            )"
            NON_WORKFLOW="$(
              printf '%s\n' "${CHANGED}" |
                grep -v -E '^\.github/workflows/GYM-NEXT-11B-PRODUCT-SITE-CLEANUP(-R2)?\.yml$' |
                sed '/^$/d' || true
            )"
            CLEANUP_WORKFLOW="$(
              printf '%s\n' "${CHANGED}" |
                grep -E '^\.github/workflows/GYM-NEXT-11B-PRODUCT-SITE-CLEANUP(-R2)?\.yml$' |
                sed '/^$/d' || true
            )"

            if [[ -n "${CLEANUP_WORKFLOW}" && -z "${NON_WORKFLOW}" ]]; then
              STEP_BASE_SHA="$(git rev-parse "${STEP_BASE_SHA}^")"
              continue
            fi
            break
          done

          mkdir -p /tmp/gym-next-11b/source
          curl --fail --location --silent --show-error \
            --retry 5 --retry-delay 2 --max-time 45 \
            -o /tmp/gym-next-11b/source/next-ledger.yml \
            "${SOURCE_LEDGER_RAW}?run=${GITHUB_RUN_ID}"

          CURRENT_STEP="$(
            sed -n 's/^current_step:[[:space:]]*//p' \
              /tmp/gym-next-11b/source/next-ledger.yml |
              head -n 1 | tr -d '"\r'
          )"
          NEXT_STEP="$(
            sed -n 's/^next_step:[[:space:]]*//p' \
              /tmp/gym-next-11b/source/next-ledger.yml |
              head -n 1 | tr -d '"\r'
          )"
          RESULT="$(
            sed -n 's/^result:[[:space:]]*//p' \
              /tmp/gym-next-11b/source/next-ledger.yml |
              head -n 1 | tr -d '"\r'
          )"
          DELIVERY_COMMIT="$(
            sed -n 's/^delivery_commit_sha:[[:space:]]*//p' \
              /tmp/gym-next-11b/source/next-ledger.yml |
              head -n 1 | tr -d '"\r'
          )"

          [[ "${CURRENT_STEP}" == "GYM-NEXT-11A-COMPLETE" ]] || {
            echo "::error::Expected GYM-NEXT-11A-COMPLETE, got ${CURRENT_STEP}."
            exit 1
          }
          [[ "${NEXT_STEP}" == "GYM-NEXT-11B-PRODUCT-SITE-CLEANUP" ]] || {
            echo "::error::Expected GYM-NEXT-11B-PRODUCT-SITE-CLEANUP, got ${NEXT_STEP}."
            exit 1
          }
          [[ "${RESULT}" == "OK" ]] || {
            echo "::error::Source GYM-NEXT-11A result is not OK."
            exit 1
          }
          [[ "${DELIVERY_COMMIT}" == "${EXPECTED_SOURCE_DELIVERY_COMMIT}" ]] || {
            echo "::error::Unexpected source delivery commit."
            exit 1
          }

          grep -Fq 'owner_facing_screen_count: 5' \
            /tmp/gym-next-11b/source/next-ledger.yml
          grep -Fq 'owner_facing_qr_count: 5' \
            /tmp/gym-next-11b/source/next-ledger.yml
          grep -Fq 'qr_exact_url_match_count: 5' \
            /tmp/gym-next-11b/source/next-ledger.yml
          grep -Fq 'system_check_exposed: false' \
            /tmp/gym-next-11b/source/next-ledger.yml
          grep -Fq 'system_check_html_preserved: true' \
            /tmp/gym-next-11b/source/next-ledger.yml
          grep -Fq 'product_site_update_pending: true' \
            /tmp/gym-next-11b/source/next-ledger.yml

          echo "STEP_BASE_SHA=${STEP_BASE_SHA}" >> "$GITHUB_ENV"
          echo "UPLOAD_PARENT_SHA=${UPLOAD_PARENT_SHA}" >> "$GITHUB_ENV"
          echo "RUN_URL=https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >> "$GITHUB_ENV"

      - name: Protect product site before cleanup
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force

          if git show-ref --tags --verify --quiet "refs/tags/${BACKUP_TAG}"; then
            EXISTING="$(git rev-list -n 1 "${BACKUP_TAG}")"
            [[ "${EXISTING}" == "${STEP_BASE_SHA}" ]] || {
              echo "::error::Backup tag points to another commit."
              exit 1
            }
          else
            git tag -a "${BACKUP_TAG}" "${STEP_BASE_SHA}" \
              -m "Before removing owner-facing gym system-check references"
            git push origin "refs/tags/${BACKUP_TAG}"
          fi

      - name: Verify inspected product-site baselines
        shell: bash
        run: |
          set -euo pipefail

          check_blob() {
            local path="$1"
            local expected="$2"
            local actual
            actual="$(git hash-object "${path}")"
            [[ "${actual}" == "${expected}" ]] || {
              echo "::error::${path} differs from inspected baseline."
              echo "Expected: ${expected}"
              echo "Actual:   ${actual}"
              exit 1
            }
          }

          check_blob "${PRODUCT_PAGE}" "${EXPECTED_PRODUCT_PAGE_BLOB}"
          check_blob "${COMPLETION_YML}" "${EXPECTED_COMPLETION_YML_BLOB}"
          check_blob "${COMPLETION_MD}" "${EXPECTED_COMPLETION_MD_BLOB}"

          STYLE_BLOB="$(git hash-object styles.css)"
          SCRIPT_BLOB="$(git hash-object script.js)"
          CATALOG_BLOB="$(git hash-object systems.html)"

          echo "STYLE_BLOB=${STYLE_BLOB}" >> "$GITHUB_ENV"
          echo "SCRIPT_BLOB=${SCRIPT_BLOB}" >> "$GITHUB_ENV"
          echo "CATALOG_BLOB=${CATALOG_BLOB}" >> "$GITHUB_ENV"

          grep -Fq '営業前統合system-check' "${PRODUCT_PAGE}"
          grep -Fq '<h3>営業前system-check</h3>' "${PRODUCT_PAGE}"
          grep -Fq '>6画面をWebで見る<' "${PRODUCT_PAGE}"
          grep -Fq '>system-checkを開く<' "${PRODUCT_PAGE}"
          grep -Fq '実画面 6画面' "${PRODUCT_PAGE}"
          grep -Fq 'QR読取 6 / 6' "${PRODUCT_PAGE}"
          grep -Fq 'URL完全一致 6 / 6' "${PRODUCT_PAGE}"
          grep -Fq '営業前system-check: 掲載済み' "${COMPLETION_MD}"

      - name: Verify published five-screen source assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/gym-next-11b/assets

          curl --fail --location --silent --show-error \
            --retry 5 --retry-delay 2 --max-time 45 \
            -o /tmp/gym-next-11b/assets/operation-sheet.html \
            "${SOURCE_OPERATION_HTML}?verify=${GITHUB_RUN_ID}"

          curl --fail --location --silent --show-error \
            --retry 5 --retry-delay 2 --max-time 45 \
            -o /tmp/gym-next-11b/assets/qr-report.json \
            "${SOURCE_QR_REPORT}?verify=${GITHUB_RUN_ID}"

          curl --fail --location --silent --show-error \
            --retry 5 --retry-delay 2 --max-time 60 \
            -o /tmp/gym-next-11b/assets/sheet.pdf \
            "${PDF_URL}?verify=${GITHUB_RUN_ID}"

          curl --fail --location --silent --show-error \
            --retry 5 --retry-delay 2 --max-time 60 \
            -o /tmp/gym-next-11b/assets/sheet.png \
            "${PNG_URL}?verify=${GITHUB_RUN_ID}"

          grep -Fq 'data-owner-facing-screen-count="5"' \
            /tmp/gym-next-11b/assets/operation-sheet.html
          if grep -Eqi 'system-check|system check|営業前.*チェック' \
               /tmp/gym-next-11b/assets/operation-sheet.html; then
            echo "::error::Published operation sheet still exposes system-check."
            exit 1
          fi

          grep -Fq '"expected_count": 5' \
            /tmp/gym-next-11b/assets/qr-report.json
          grep -Fq '"source_qr_decoded_count": 5' \
            /tmp/gym-next-11b/assets/qr-report.json
          grep -Fq '"decoded_count": 5' \
            /tmp/gym-next-11b/assets/qr-report.json
          grep -Fq '"exact_url_match_count": 5' \
            /tmp/gym-next-11b/assets/qr-report.json

          [[ "$(sha256sum /tmp/gym-next-11b/assets/sheet.pdf | awk '{print $1}')" == "${EXPECTED_PDF_SHA256}" ]]
          [[ "$(sha256sum /tmp/gym-next-11b/assets/sheet.png | awk '{print $1}')" == "${EXPECTED_PNG_SHA256}" ]]

      - name: Remove owner-facing system-check references
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path

          path = Path("systems/gym.html")
          html = path.read_text(encoding="utf-8")

          def replace_once(old, new, label):
              global html
              count = html.count(old)
              if count != 1:
                  raise SystemExit(
                      f"{label}: expected 1 match, found {count}"
                  )
              html = html.replace(old, new, 1)

          replace_once(
              "<!-- STEP GYM-NEXT-10B / DPRO NEXT COMPLETE / 20260726 -->",
              "<!-- STEP GYM-NEXT-11B / OWNER MATERIAL CLEANUP COMPLETE / 20260726 -->",
              "step marker",
          )
          replace_once(
              "30分枠・電話番号正規化・重複防止に加え、セッション完了時の回数減算、スタッフ権限分離、URL認証拒否、営業前統合system-checkまで検査済みです。",
              "30分枠・電話番号正規化・重複防止に加え、セッション完了時の回数減算、スタッフ権限分離、URL経由の認証情報を受け付けない安全設計まで検査済みです。",
              "hero safety note",
          )
          replace_once(
              "予約・会員・回数券・相談・来店進行・施設設定・営業前確認を一つにつなぎます。",
              "予約・会員・回数券・相談・来店進行・施設設定・スタッフ受付を一つにつなぎます。",
              "feature introduction",
          )
          replace_once(
              '<article class="product-feature reveal"><span>08</span><h3>営業前system-check</h3><p>DB、認証、重複防止、役割分離、セキュリティ、応答性能を一括検査します。</p></article>',
              "",
              "system-check feature card",
          )
          replace_once(
              "<li>営業前デモ準備・操作履歴</li>",
              "<li>体験・入会管理・操作履歴</li>",
              "owner PC list",
          )
          replace_once(
              'data-dpro-next-step="GYM-NEXT-10B"',
              'data-dpro-next-step="GYM-NEXT-11B"',
              "operation section marker",
          )
          replace_once(
              "GYM NEXT-10 COMPLETE",
              "GYM NEXT-11 COMPLETE",
              "completion badge",
          )
          replace_once(
              "6つの実画面を、<br>QR付き1枚資料で確認。",
              "5つの実画面を、<br>QR付き1枚資料で確認。",
              "operation heading",
          )
          replace_once(
              "無料体験予約、会員マイページ、PC管理、iPad受付、スタッフ画面、営業前system-checkを実画面スクリーンショットで掲載しています。",
              "無料体験予約、会員マイページ、PC管理・継続フォロー、iPad受付、スタッフ画面を実画面スクリーンショットで掲載しています。",
              "operation description",
          )
          replace_once(
              "<span>実画面 6画面</span>",
              "<span>実画面 5画面</span>",
              "screen count",
          )
          replace_once(
              "<span>QR読取 6 / 6</span>",
              "<span>QR読取 5 / 5</span>",
              "QR count",
          )
          replace_once(
              "<span>URL完全一致 6 / 6</span>",
              "<span>URL完全一致 5 / 5</span>",
              "URL count",
          )
          replace_once(
              ">6画面をWebで見る<",
              ">5画面をWebで見る<",
              "Web action label",
          )
          replace_once(
              '<a class="button button-secondary" href="https://dpromstk2000-lab.github.io/liff-gym-demo/system-check.html?demo=1&amp;v=gym-next-10" target="_blank" rel="noopener">system-checkを開く</a>',
              "",
              "system-check action",
          )
          replace_once(
              "DPRO_GYM_NEXT_operation_experience_sheet_20260726.png?v=gym-next-10b",
              "DPRO_GYM_NEXT_operation_experience_sheet_20260726.png?v=gym-next-11b",
              "operation preview cache key",
          )
          replace_once(
              "DPRO NEXT完成済みの予約・会員・PC管理・iPad受付・スタッフ・system-checkをご案内します。",
              "DPRO NEXT完成済みの予約・会員・PC管理・継続フォロー・iPad受付・スタッフ画面をご案内します。",
              "contact copy",
          )

          forbidden = [
              "system-check",
              "system check",
              "営業前確認",
              "営業前デモ準備",
              "実画面 6画面",
              "QR読取 6 / 6",
              "URL完全一致 6 / 6",
              ">6画面をWebで見る<",
          ]
          lower = html.lower()
          for marker in forbidden:
              target = marker.lower()
              if target in lower:
                  raise SystemExit(
                      f"Owner-facing forbidden marker remains: {marker}"
                  )

          required = [
              "STEP GYM-NEXT-11B",
              "GYM NEXT-11 COMPLETE",
              "実画面 5画面",
              "QR読取 5 / 5",
              "URL完全一致 5 / 5",
              ">5画面をWebで見る<",
              "スタッフ権限分離",
              "PC管理・継続フォロー",
          ]
          for marker in required:
              if marker not in html:
                  raise SystemExit(
                      f"Required owner-facing marker is missing: {marker}"
                  )

          assert html.count(
              'class="product-feature reveal"'
          ) == 7
          assert html.count(
              'data-dpro-next-step="GYM-NEXT-11B"'
          ) == 1

          path.write_text(
              html,
              encoding="utf-8",
              newline="\n",
          )
          PY

      - name: Validate HTML JavaScript and change scope
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/gym-next-11b

          python3 <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import json
          import re

          class Parser(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.ids = []
                  self.links = []

              def handle_starttag(self, tag, attrs):
                  data = dict(attrs)
                  if data.get("id"):
                      self.ids.append(data["id"])
                  if tag == "a" and data.get("href"):
                      self.links.append(data["href"])

              def handle_startendtag(self, tag, attrs):
                  self.handle_starttag(tag, attrs)

          path = Path("systems/gym.html")
          html = path.read_text(encoding="utf-8")
          parser = Parser()
          parser.feed(html)

          duplicates = sorted({
              value
              for value in parser.ids
              if parser.ids.count(value) > 1
          })
          assert not duplicates, duplicates
          assert not re.search(r"[ \t]+$", html, flags=re.M)
          assert html.endswith("\n")
          assert not html.endswith("\n\n")
          assert "system-check" not in html.lower()
          assert "system check" not in html.lower()
          assert "営業前" not in html
          assert html.count(
              'class="product-feature reveal"'
          ) == 7
          assert html.count(
              'data-dpro-next-step="GYM-NEXT-11B"'
          ) == 1

          report = {
              "ok": True,
              "step": "GYM-NEXT-11B",
              "owner_facing_screen_count": 5,
              "owner_facing_qr_count": 5,
              "system_check_owner_facing": False,
              "feature_card_count": 7,
              "duplicate_ids": duplicates,
              "link_count": len(parser.links),
              "bytes": len(html.encode("utf-8")),
          }
          Path(
              "/tmp/gym-next-11b/html-validation.json"
          ).write_text(
              json.dumps(
                  report,
                  ensure_ascii=False,
                  indent=2,
              ) + "\n",
              encoding="utf-8",
          )
          PY

          node --check script.js

          [[ "$(git hash-object styles.css)" == "${STYLE_BLOB}" ]]
          [[ "$(git hash-object script.js)" == "${SCRIPT_BLOB}" ]]
          [[ "$(git hash-object systems.html)" == "${CATALOG_BLOB}" ]]

          CHANGED="$(git diff --name-only | sort)"
          [[ "${CHANGED}" == "${PRODUCT_PAGE}" ]] || {
            echo "::error::Unexpected files changed before product commit."
            echo "${CHANGED}"
            exit 1
          }

          git diff --check

      - name: Commit cleaned product page
        shell: bash
        run: |
          set -euo pipefail
          git add "${PRODUCT_PAGE}"
          git diff --cached --check
          git commit -m "Remove owner-facing gym system-check references"

          PRODUCT_COMMIT_SHA="$(git rev-parse HEAD)"
          PRODUCT_PAGE_BLOB="$(git hash-object "${PRODUCT_PAGE}")"

          echo "PRODUCT_COMMIT_SHA=${PRODUCT_COMMIT_SHA}" >> "$GITHUB_ENV"
          echo "PRODUCT_PAGE_BLOB=${PRODUCT_PAGE_BLOB}" >> "$GITHUB_ENV"

          git push origin HEAD:main

      - name: Wait for GitHub Pages and verify cleaned product page
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/gym-next-11b/public
          PUBLIC_FILE=/tmp/gym-next-11b/public/gym.html

          for attempt in $(seq 1 72); do
            HTTP_CODE="$(
              curl --location --silent --show-error \
                --connect-timeout 15 \
                --max-time 30 \
                --header 'Cache-Control: no-cache' \
                --header 'Pragma: no-cache' \
                --output "${PUBLIC_FILE}" \
                --write-out '%{http_code}' \
                "${PRODUCT_SITE_BASE}/systems/gym.html?v=${PRODUCT_COMMIT_SHA}-${GITHUB_RUN_ID}-${attempt}" || true
            )"

            MARKER="old-or-empty"
            if [[ -s "${PUBLIC_FILE}" ]] &&
               grep -Fq 'data-dpro-next-step="GYM-NEXT-11B"' "${PUBLIC_FILE}" &&
               grep -Fq '実画面 5画面' "${PUBLIC_FILE}" &&
               grep -Fq 'QR読取 5 / 5' "${PUBLIC_FILE}" &&
               ! grep -Eqi 'system-check|system check|営業前' "${PUBLIC_FILE}"; then
              MARKER="clean-five-screen"
            fi

            echo "Attempt ${attempt}/72: HTTP ${HTTP_CODE}, marker=${MARKER}"

            if [[ "${MARKER}" == "clean-five-screen" ]]; then
              break
            fi

            if [[ "${attempt}" == "72" ]]; then
              echo "::error::Cleaned gym product page did not reach GitHub Pages within 12 minutes."
              exit 1
            fi
            sleep 10
          done

          grep -Fq 'URL完全一致 5 / 5' "${PUBLIC_FILE}"
          grep -Fq '>5画面をWebで見る<' "${PUBLIC_FILE}"
          grep -Fq 'GYM NEXT-11 COMPLETE' "${PUBLIC_FILE}"
          grep -Fq 'PC管理・継続フォロー' "${PUBLIC_FILE}"

          PUBLIC_BYTES="$(wc -c < "${PUBLIC_FILE}" | tr -d ' ')"
          [[ "${PUBLIC_BYTES}" -le 120000 ]] || {
            echo "::error::Published gym.html exceeds 120KB."
            exit 1
          }
          echo "PUBLIC_BYTES=${PUBLIC_BYTES}" >> "$GITHUB_ENV"

      - name: Update final completion record and self-delete
        shell: bash
        run: |
          set -euo pipefail
          COMPLETED_AT="$(TZ=Asia/Tokyo date '+%Y-%m-%dT%H:%M:%S%z')"
          export COMPLETED_AT

          python3 <<'PY'
          from pathlib import Path
          import os
          import yaml

          yml_path = Path(
              "dpro-next/gym/GYM-NEXT-COMPLETE.yml"
          )
          data = yaml.safe_load(
              yml_path.read_text(encoding="utf-8")
          )

          data["schema_version"] = 2
          data["result"] = "DPRO-NEXT-COMPLETE"
          data["logical_step"] = "GYM-NEXT-11"
          data["completed_step"] = (
              "GYM-NEXT-11B-PRODUCT-SITE-CLEANUP"
          )
          data["completed_at"] = os.environ["COMPLETED_AT"]
          data["product_commit_sha"] = os.environ[
              "PRODUCT_COMMIT_SHA"
          ]
          data["product_page_blob"] = os.environ[
              "PRODUCT_PAGE_BLOB"
          ]
          data["backup_tag"] = (
              "backup-product-site-before-gym-next-11b-20260726"
          )
          data["workflow_run_url"] = os.environ["RUN_URL"]

          public_urls = data.setdefault("public_urls", {})
          public_urls.pop("system_check", None)

          data["operation_sheet"] = {
              "owner_facing_only": True,
              "actual_screen_count": 5,
              "qr_count": 5,
              "source_qr_decoded_count": 5,
              "rendered_qr_decoded_count": 5,
              "exact_url_match_count": 5,
              "system_check_exposed": False,
              "pdf_sha256": (
                  "0581ba706fed52de0c508548faaf9b2ab"
                  "0f65aded36796dd9c0d96949bc0fc8f"
              ),
              "png_sha256": (
                  "d27b5fd48dec81cf1099c8a37b8d6e59"
                  "cb5a0eb0bf191727e66feb3120ceb103"
              ),
          }

          product_site = data.setdefault("product_site", {})
          product_site["operation_sheet_section"] = True
          product_site["operation_sheet_screen_count"] = 5
          product_site["staff_role_feature"] = True
          product_site["integrated_system_check_feature"] = False
          product_site["owner_facing_system_check_removed"] = True
          product_site["owner_facing_system_check_link_removed"] = True
          product_site["owner_facing_system_check_copy_removed"] = True

          data["maintenance_scope"] = {
              "system_check_html_preserved_in_source_system": True,
              "system_check_role": "DPRO導入・保守担当専用",
              "system_check_owner_facing": False,
              "product_site_link_exposed": False,
          }

          checks = data.setdefault("checks", {})
          checks.update({
              "source_next_11a": "OK",
              "source_owner_facing_screen_count": "5",
              "source_owner_facing_qr_count": "5",
              "source_system_check_exposed": "FALSE",
              "product_owner_system_check_removed": "OK",
              "product_owner_system_check_link_removed": "OK",
              "product_owner_system_check_copy_removed": "OK",
              "product_operation_sheet_five_screens": "OK",
              "github_pages_product": "OK",
              "public_file_budget": "OK",
          })

          correction = data.setdefault(
              "owner_facing_correction", {}
          )
          correction.update({
              "reason": (
                  "system-checkはオーナー向け機能ではなく、"
                  "DPRO導入・保守担当専用"
              ),
              "source_step": "GYM-NEXT-11A-COMPLETE",
              "product_step": (
                  "GYM-NEXT-11B-PRODUCT-SITE-CLEANUP"
              ),
              "workflow_revision": "R2",
              "operation_sheet_changed_from": 6,
              "operation_sheet_changed_to": 5,
              "system_check_runtime_deleted": False,
              "system_check_product_reference_removed": True,
          })

          recovery = data.setdefault("recovery", {})
          failed_revisions = recovery.setdefault(
              "failed_workflow_revisions", []
          )
          if "GYM-NEXT-11B-R1" not in failed_revisions:
              failed_revisions.append("GYM-NEXT-11B-R1")
          failed_urls = recovery.setdefault("failed_run_urls", [])
          failed_url = (
              "https://github.com/dpromstk2000-lab/"
              "dpro-line-systems-site/actions/runs/30187172268"
          )
          if failed_url not in failed_urls:
              failed_urls.append(failed_url)
          recovery["failure_reason_gym_next_11b_r1"] = (
              "削除済みを示す内部コメント自身にsystem-checkを含め、"
              "禁止文字検査で誤検出した"
          )
          recovery["gym_next_11b_r2_fix"] = (
              "内部コメントをOWNER MATERIAL CLEANUP COMPLETEへ変更"
          )
          recovery["workflow_only_history_traversal"] = True

          data["next_step"] = None

          yml_path.write_text(
              yaml.safe_dump(
                  data,
                  allow_unicode=True,
                  sort_keys=False,
              ),
              encoding="utf-8",
              newline="\n",
          )
          PY

          cat > "${COMPLETION_MD}" <<EOF
          # DPRO パーソナルジム LINE｜DPRO NEXT COMPLETE

          - 結果: DPRO-NEXT-COMPLETE
          - 最終STEP: GYM-NEXT-11B-PRODUCT-SITE-CLEANUP
