          - スタッフ権限分離: 掲載済み
          - Worker変更: なし
          - Supabase変更: なし
          - 完了日時: ${COMPLETED_AT}
          - Actions: ${RUN_URL}
          EOF

          ruby -e "require 'yaml'; YAML.load_file('${COMPLETION_YML}', aliases: true)"

          grep -Fq 'actual_screen_count: 5' "${COMPLETION_YML}"
          grep -Fq 'qr_count: 5' "${COMPLETION_YML}"
          grep -Fq 'system_check_exposed: false' "${COMPLETION_YML}"
          grep -Fq 'integrated_system_check_feature: false' "${COMPLETION_YML}"
          grep -Fq 'product_site_link_exposed: false' "${COMPLETION_YML}"
          grep -Fq 'next_step:' "${COMPLETION_YML}"
          grep -Fq 'system-checkのオーナー向け掲載: 削除済み' "${COMPLETION_MD}"

          git add "${COMPLETION_YML}" "${COMPLETION_MD}"

          if [[ -f "${STALE_WORKFLOW_FILE_R1}" ]]; then
            git rm "${STALE_WORKFLOW_FILE_R1}"
          fi
          git rm "${WORKFLOW_FILE}"

          git diff --cached --check
          git commit -m "Record gym owner-facing product cleanup"
          git push origin HEAD:main

      - name: Upload completion artifact
        uses: actions/upload-artifact@v4
        with:
          name: GYM-NEXT-11B-R2-product-site-cleanup-complete
          path: |
            dpro-next/gym/GYM-NEXT-COMPLETE.yml
            dpro-next/gym/GYM-NEXT-COMPLETE.md
            /tmp/gym-next-11b/source/next-ledger.yml
            /tmp/gym-next-11b/assets/qr-report.json
            /tmp/gym-next-11b/html-validation.json
            /tmp/gym-next-11b/public/gym.html
          if-no-files-found: error
          retention-days: 30

      - name: STEP completion summary
        shell: bash
        run: |
          {
            echo "## GYM-NEXT-11B-R2 COMPLETE"
            echo ""
            echo "- R1 false-positive marker check: fixed"
            echo "- Workflow-only history traversal: verified"
            echo "- Owner-facing operation sheet: 5 screens"
