name: DPRO LANDSCAPE PRODUCT R1
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/dpro-landscape-product-r1.yml']
permissions:
  contents: write
concurrency:
  group: landscape-product-r1
  cancel-in-progress: false
jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install QA tools
        run: |
          python -m pip install beautifulsoup4
      - name: Patch and verify
        run: |
          python - <<'PYCODE'
          from pathlib import Path
          import re,json
          from bs4 import BeautifulSoup
          base='https://dpromstk2000-lab.github.io/dpro-landscape-exterior-standard/';p=Path('systems/landscape-exterior.html');s=p.read_text();assert '造園・外構' in s
          s=s.replace('"'+base+'"','"'+base+'demo-guide.html"').replace(base+'DPRO_LANDSCAPE_EXTERIOR_A4_FLYER_V1.0_20260902.pdf',base+'a4-flyer.html').replace(base+'DPRO_LANDSCAPE_EXTERIOR_QUICK_START_V1.0_20260902.pdf',base+'DPRO_LANDSCAPE_EXTERIOR_QUICK_START_MASTER_V1.2.2_20260905.pdf').replace(base+'DPRO_LANDSCAPE_EXTERIOR_DETAILED_MANUAL_V1.0_20260902.pdf',base+'DPRO_LANDSCAPE_EXTERIOR_DETAILED_MANUAL_MASTER_V1.2.2_20260905.pdf')
          block='<section id="landscape-role-demo-r1" style="padding:32px 20px;background:#eef8f3;color:#163e31"><div style="max-width:1150px;margin:auto"><h2>役割別の実画面を体験</h2><p>登録不要。ブラウザ内の架空データで操作できます。</p><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:12px">'+''.join('<a style="display:block;background:white;padding:18px;border:1px solid #b9d9ca;border-radius:12px;color:#125b46;font-weight:bold;text-decoration:none" href="'+base+f+'" target="_blank" rel="noopener">'+n+' ↗</a>' for f,n in [('index.html','写真相談受付'),('customer.html','お客様マイページ'),('staff.html','現場スタッフ'),('owner.html','管理者PC'),('a4-flyer.html','A4チラシ・印刷')])+'</div></div></section>'
          if 'id="landscape-role-demo-r1"' not in s:s=s.replace('</main>',block+'</main>',1)
          assert '5,500円' in s and base+'demo-guide.html' in s and base+'a4-flyer.html' in s;p.write_text(s)
          for name in ['systems-data.js']:
           p=Path(name)
           if not p.exists():continue
           t=p.read_text();a=t.index('"code": "LANDSCAPE_EXTERIOR"');b=t.find('"code":',a+10);b=len(t) if b<0 else b;part=t[a:b];part=part.replace('"demoUrl": "'+base+'"','"demoUrl": "'+base+'demo-guide.html"');part=part.replace('DPRO_LANDSCAPE_EXTERIOR_A4_FLYER_MASTER_V2.0_20260904.pdf','DPRO_LANDSCAPE_EXTERIOR_A4_FLYER_MASTER_V2.1_20261127.pdf');assert base+'demo-guide.html' in part;t=t[:a]+part+t[b:];p.write_text(t)
          assert BeautifulSoup(s,'html.parser').select_one('#landscape-role-demo-r1');print(json.dumps({'product_role_links':5,'demo_guide':base+'demo-guide.html','legacy_pdf_links_updated':True,'scope':'LANDSCAPE_EXTERIOR only'},ensure_ascii=False))

          PYCODE
      - name: Commit verified files only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- systems/landscape-exterior.html systems-data.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'DPRO LANDSCAPE PRODUCT R1'
          git push origin HEAD:main
