      - name: Static QA gates
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          targets = ["index.html", "systems.html", "proposal.html", "dpro-system.html"]
          combined = "\n".join(Path(p).read_text(encoding="utf-8") for p in targets)

          stale_patterns = [
              r"50システム",
              r"50製品",
              r"data-p36-count>50",
              r"data-p36-proposal-visible>50",
              r'"numberOfItems":50',
          ]
          for pat in stale_patterns:
              if re.search(pat, combined):
                  raise SystemExit(f"QA FAIL: stale count remains: {pat}")

          required = {
              "index.html": ["51", "公開LIVE DEMO", "DPRO SHOP", "業種から"],
              "systems.html": ["51", "公開LIVE DEMO", "DPRO SHOP", "業種から"],
              "proposal.html": ["51", "公開LIVE DEMO", "DPRO SHOP", "業種から"],
              "dpro-system.html": ["51", "公開LIVE DEMO", "DPRO SHOP", "業種"],
          }
          for path, needles in required.items():
              text = Path(path).read_text(encoding="utf-8")
              for needle in needles:
                  if needle not in text:
                      raise SystemExit(f"QA FAIL: {path} missing {needle}")

          # Protected routing references must remain present and unedited by this workflow.
          for path in ["index.html", "systems.html", "proposal.html", "dpro-system.html"]:
              text = Path(path).read_text(encoding="utf-8")
              if "systems-data.js" not in text:
                  raise SystemExit(f"QA FAIL: {path} lost systems-data.js reference")

          print("STATIC CONTENT QA: PASS")
          PY

          git diff --check

          changed="$(git diff --name-only | sort)"
          printf '%s\n' "$changed"
          allowed="$(printf '%s\n' dpro-system.html index.html product-v3.6.css proposal.html systems.html | sort)"
          if [ "$changed" != "$allowed" ]; then
            echo "QA FAIL: unexpected changed-file set"
            echo "EXPECTED:"
            printf '%s\n' "$allowed"
            echo "ACTUAL:"
            printf '%s\n' "$changed"
            exit 1
          fi

          # FINAL LOCK guard: these files must not be modified.
          for protected in systems-data.js demo-guide.html product-v3.6.js; do
            if git diff --name-only -- "$protected" | grep -q .; then
              echo "QA FAIL: protected file changed: $protected"
              exit 1
            fi
          done

          echo "FINAL LOCK FILE GUARD: PASS"

