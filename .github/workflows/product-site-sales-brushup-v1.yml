          def replace_once(path, old, new, label):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              if new in text:
                  print(f"SKIP already applied: {label}")
                  return
              if old not in text:
                  raise SystemExit(f"ANCHOR NOT FOUND [{label}] in {path}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")
              print(f"APPLY: {label}")

