name: DPRO GREEN PRODUCT RELEASE V1.2 HUMAN REVIEW PREP

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/dpro-green-product-release-v1-2-human-review-prep.yml"

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RELEASE_ID: GREEN-PR-V12-20260925-R1
      SYSTEM_LOCK_HEAD: 6e359937a28e32380e0c4b2e3cd5ca5fbcbbab59
      SYSTEM_API: https://dpro-green-rental-line-api.dpromstk2000.workers.dev
      SYSTEM_BASE: https://dpromstk2000-lab.github.io/dpro-green-rental-line
      OFFICIAL_URL: https://dpro-shop.com/systems/green-rental
      OFFICIAL_GITHUB: https://dpromstk2000-lab.github.io/dpro-shop-official-site/systems/green-rental.html
      PRODUCT_URL: https://dpromstk2000-lab.github.io/dpro-line-systems-site/systems/green-rental.html
      LP_URL: https://dpromstk2000-lab.github.io/dpro-line-systems-site/lp-green-rental.html
      FLYER_HTML_URL: https://dpromstk2000-lab.github.io/dpro-line-systems-site/flyer-green-rental.html
      FLYER_PDF_URL: https://dpromstk2000-lab.github.io/dpro-line-systems-site/flyer-green-rental.pdf
      OPERATION_PDF_URL: https://dpromstk2000-lab.github.io/dpro-line-systems-site/assets/green-rental-next/DPRO_GREEN_RENTAL_OPERATION_EXPERIENCE_SHEET_V1.0.pdf

    steps:
      - name: Checkout PRODUCT evidence source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install audit dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils zbar-tools jq >/dev/null
          npm install --no-audit --no-fund --silent playwright@1.55.0
          npx playwright install --with-deps chromium >/dev/null
          mkdir -p human-review/{screens,pdf-renders,evidence,raw}

      - name: Wait for all public release markers
        shell: bash
        run: |
          set -euo pipefail
          wait_marker(){
            local url="$1" marker="$2" name="$3"
            for i in $(seq 1 30); do
              body="$(curl -fsSL --retry 2 --retry-delay 2 "$url" || true)"
              if printf '%s' "$body" | grep -Fq "$marker"; then echo "$name PUBLIC: PASS"; return 0; fi
              echo "$name not ready ($i/30)"; sleep 10
            done
            echo "$name PUBLIC marker timeout"; return 1
          }
          wait_marker "$PRODUCT_URL" "$RELEASE_ID" PRODUCT
          wait_marker "$LP_URL" "$RELEASE_ID" LP
          wait_marker "$FLYER_HTML_URL" "$RELEASE_ID" FLYER
          wait_marker "$OFFICIAL_URL" "$RELEASE_ID" OFFICIAL_CUSTOM
          wait_marker "$OFFICIAL_GITHUB" "$RELEASE_ID" OFFICIAL_GITHUB

      - name: Verify SYSTEM FINAL LOCK and run 53-check API
        shell: bash
        run: |
          set -euo pipefail
          system_head="$(git ls-remote https://github.com/dpromstk2000-lab/dpro-green-rental-line.git refs/heads/main | awk '{print $1}')"
          test "$system_head" = "$SYSTEM_LOCK_HEAD"
          printf '%s\n' "$system_head" > human-review/raw/system-head.txt

          login="$(curl -fsS -H 'content-type: application/json' -d '{"facilityCode":"dpro_green_rental_demo","code":"1234"}' "$SYSTEM_API/api/admin/login")"
          printf '%s' "$login" > human-review/raw/admin-login.json
          admin_token="$(printf '%s' "$login" | jq -r '.data.sessionToken // empty')"
          test -n "$admin_token"
          curl -fsS -H "Authorization: Bearer $admin_token" "$SYSTEM_API/api/admin/system-check" > human-review/raw/system-check.json
          jq -e '.ok == true and (.data.failed // 999) == 0 and (.data.total // 0) >= 53' human-review/raw/system-check.json >/dev/null
          echo "SYSTEM 53-CHECK: PASS"

      - name: History preservation before snapshot
        shell: bash
        run: |
          set -euo pipefail
          member_login="$(curl -fsS -H 'content-type: application/json' -d '{"mode":"demo","facilityCode":"dpro_green_rental_demo","token":"GREEN-DEMO","customerNumber":"DEMO-GREEN-001"}' "$SYSTEM_API/api/member/login")"
          printf '%s' "$member_login" > human-review/raw/member-login-before.json
          member_token="$(printf '%s' "$member_login" | jq -r '.data.sessionToken // empty')"
          test -n "$member_token"
          curl -fsS -H "Authorization: Bearer $member_token" "$SYSTEM_API/api/member/overview" > human-review/raw/member-overview-before.json
          jq -e '.ok == true' human-review/raw/member-overview-before.json >/dev/null

      - name: Capture public HUMAN ACCEPTANCE screenshots and exact CTA contract
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/green-human-review.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'fs';
          const surfaces=[
            ['official',process.env.OFFICIAL_URL],
            ['product',process.env.PRODUCT_URL],
            ['lp',process.env.LP_URL],
            ['flyer',process.env.FLYER_HTML_URL]
          ];
          const widths=[390,768,1440];
          const browser=await chromium.launch({headless:true});
          const evidence={release_id:process.env.RELEASE_ID,surfaces:{},exact_cta:[]};
          for(const [name,url] of surfaces){
            evidence.surfaces[name]={url,widths:{}};
            for(const width of widths){
              const page=await browser.newPage({viewport:{width,height:1000},deviceScaleFactor:1});
              const resp=await page.goto(url,{waitUntil:'domcontentloaded',timeout:60000});
              if(!resp || !resp.ok()) throw new Error(`${name} ${url} HTTP ${resp?.status()}`);
              await page.waitForTimeout(1800);
              const release=await page.locator(`[data-release-id="${process.env.RELEASE_ID}"]`).count();
              if(!release) throw new Error(`${name} missing release marker`);
              const metrics=await page.evaluate(()=>({scrollWidth:document.documentElement.scrollWidth,clientWidth:document.documentElement.clientWidth,title:document.title}));
              if(metrics.scrollWidth>metrics.clientWidth+3) throw new Error(`${name} ${width}px horizontal overflow ${JSON.stringify(metrics)}`);
              await page.screenshot({path:`human-review/screens/${name}-${width}.png`,fullPage:true});
              evidence.surfaces[name].widths[width]={...metrics,status:resp.status()};
              if(width===1440){
                const rows=await page.locator('[data-product-code="GREEN"][data-cta-role]').evaluateAll(els=>els.map(el=>({role:el.getAttribute('data-cta-role'),href:el.href||null,text:(el.textContent||'').trim().replace(/\s+/g,' ')})));
                evidence.exact_cta.push(...rows.map(r=>({surface:name,...r})));
              }
              await page.close();
            }
          }
          fs.writeFileSync('human-review/evidence/BROWSER_VISUAL_QA.json',JSON.stringify(evidence,null,2));
          await browser.close();
          JS
          node /tmp/green-human-review.mjs

      - name: Download, render and decode final PDFs
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 --retry-delay 3 "$FLYER_PDF_URL" -o human-review/raw/flyer.pdf
          curl -fsSL --retry 5 --retry-delay 3 "$OPERATION_PDF_URL" -o human-review/raw/operation.pdf
          pdfinfo human-review/raw/flyer.pdf > human-review/raw/flyer-pdfinfo.txt
          pdfinfo human-review/raw/operation.pdf > human-review/raw/operation-pdfinfo.txt
          test "$(pdfinfo human-review/raw/flyer.pdf | awk '/^Pages:/{print $2}')" = "1"
          test "$(pdfinfo human-review/raw/operation.pdf | awk '/^Pages:/{print $2}')" = "1"
          pdftoppm -png -singlefile -r 180 human-review/raw/flyer.pdf human-review/pdf-renders/flyer >/dev/null 2>&1
          pdftoppm -png -singlefile -r 180 human-review/raw/operation.pdf human-review/pdf-renders/operation >/dev/null 2>&1
          (zbarimg --quiet --raw human-review/pdf-renders/flyer.png || true) | sort -u > human-review/raw/flyer-qr.txt
          (zbarimg --quiet --raw human-review/pdf-renders/operation.png || true) | sort -u > human-review/raw/operation-qr.txt
          test "$(grep -c '^http' human-review/raw/flyer-qr.txt || true)" -ge 3
          test "$(grep -c '^http' human-review/raw/operation-qr.txt || true)" -ge 4

      - name: History preservation after snapshot and hard-gate evidence
        shell: bash
        run: |
          set -euo pipefail
          sleep 3
          member_login="$(curl -fsS -H 'content-type: application/json' -d '{"mode":"demo","facilityCode":"dpro_green_rental_demo","token":"GREEN-DEMO","customerNumber":"DEMO-GREEN-001"}' "$SYSTEM_API/api/member/login")"
          member_token="$(printf '%s' "$member_login" | jq -r '.data.sessionToken // empty')"
          test -n "$member_token"
          curl -fsS -H "Authorization: Bearer $member_token" "$SYSTEM_API/api/member/overview" > human-review/raw/member-overview-after.json
          jq -e '.ok == true' human-review/raw/member-overview-after.json >/dev/null

          rm -rf /tmp/green-system-source
          git clone --depth 1 https://github.com/dpromstk2000-lab/dpro-green-rental-line.git /tmp/green-system-source >/dev/null 2>&1
          test "$(git -C /tmp/green-system-source rev-parse HEAD)" = "$SYSTEM_LOCK_HEAD"
          grep -Fq 'line: false' /tmp/green-system-source/contact-green-config.js
          grep -Fq 'No customer data is fetched and no write operation is enabled.' /tmp/green-system-source/contact-green.js
          if grep -RniE 'TRUNCATE|DROP TABLE|DELETE FROM[[:space:]]+(.*thread|.*message|.*issue)' /tmp/green-system-source --include='*.js' --include='*.sql' > human-review/raw/destructive-scan.txt; then
            echo "HISTORY QA FAIL: destructive history reset pattern found"; cat human-review/raw/destructive-scan.txt; exit 1
          fi

          python3 - <<'PY'
          from pathlib import Path
          import json
          before=json.loads(Path('human-review/raw/member-overview-before.json').read_text())
          after=json.loads(Path('human-review/raw/member-overview-after.json').read_text())
          b=(before.get('data') or {}).get('activeIssues') or []
          a=(after.get('data') or {}).get('activeIssues') or []
          def ident(x): return str(x.get('id') or x.get('issue_number') or x.get('issueNumber') or '')
          def ts(x): return x.get('created_at') or x.get('createdAt') or x.get('updated_at') or x.get('updatedAt') or ''
          bi=[ident(x) for x in b if ident(x)]; ai=[ident(x) for x in a if ident(x)]
          unexpected=[x for x in bi if x not in ai]
          hp={
            'schema':'DPRO-CHAT-CONTACT-HISTORY-PRESERVATION-EVIDENCE-R1',
            'system_code':'GREEN','assessed':True,'applicable':True,
            'pass': len(unexpected)==0 and len(a)>=len(b),
            'hp1_persistent_store':{'pass':True,'source':'member overview persistent issue history API','before_count':len(b),'oldest':min([ts(x) for x in b if ts(x)],default=None),'latest':max([ts(x) for x in b if ts(x)],default=None)},
            'hp2_identity_continuity':{'pass':len(unexpected)==0,'representative_ids_before':bi[:5],'representative_ids_after':ai[:5],'unexpected_missing':unexpected},
            'hp3_no_destructive_reset':{'pass':True,'release_scope':'OFFICIAL/PRODUCT only; SYSTEM/DB/Worker untouched','source_scan':'no TRUNCATE/DROP TABLE/DELETE FROM thread-message-issue pattern in locked SYSTEM source'},
            'hp4_upgrade_migration_preservation':{'pass':True,'system_migration':'NONE','system_head_before':'6e359937a28e32380e0c4b2e3cd5ca5fbcbbab59','system_head_after':'6e359937a28e32380e0c4b2e3cd5ca5fbcbbab59'},
            'hp5_stale_response_guard':{'pass':True,'current_line_contact':'PRE-LINE / read-only / no customer data fetched','note':'live LINE thread selection is disabled; 2026-09-21 inherited CONTACT audit records stale-response correction before live connection'},
            'hp6_before_after_count':{'pass':len(unexpected)==0 and len(a)>=len(b),'before':len(b),'after':len(a),'unexpected_decrease':max(0,len(b)-len(a))},
            'hp7_multi_device_consistency':{'status':'NOT_APPLICABLE','reason':'GREEN LINE CONTACT features.line=false in the locked release; customer thread unread sync is not live yet. Re-run HP-7 before enabling live LINE.'},
            'hp8_backup_export_policy':{'pass':True,'policy':'Do not assume automatic backups. Restore availability depends on the database plan. Before any future SYSTEM/DB/Worker migration or live LINE enablement, export counts + representative IDs/timestamps and retain the release evidence; if the plan lacks point-in-time restore, do not claim recoverability.'},
            'evidence_refs':['raw/member-overview-before.json','raw/member-overview-after.json','raw/system-check.json','raw/system-head.txt','START R2 AUDIT_INTEGRATION_SUMMARY.json finding 2026-09-21']
          }
          if not hp['pass']: raise SystemExit('HISTORY_PRESERVATION_HOLD '+repr(hp))
          Path('human-review/evidence/HISTORY_PRESERVATION_QA.json').write_text(json.dumps(hp,ensure_ascii=False,indent=2)+"\n",encoding='utf-8')
          PY

      - name: Cross-surface FACT, CTA and site-wide static checks
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL "$OFFICIAL_URL" -o human-review/raw/official.html
          curl -fsSL "$PRODUCT_URL" -o human-review/raw/product.html
          curl -fsSL "$LP_URL" -o human-review/raw/lp.html
          curl -fsSL https://dpro-shop.com/404.html -o human-review/raw/official-404.html
          curl -fsSL https://dpro-shop.com/sitemap.xml -o human-review/raw/official-sitemap.xml
          curl -fsSL https://dpromstk2000-lab.github.io/dpro-line-systems-site/sitemap.xml -o human-review/raw/product-sitemap.xml
          python3 - <<'PY'
          from pathlib import Path
          import json,re
          O=Path('human-review/raw/official.html').read_text(errors='ignore')
          P=Path('human-review/raw/product.html').read_text(errors='ignore')
          L=Path('human-review/raw/lp.html').read_text(errors='ignore')
          checks={
            'official_release_marker':'GREEN-PR-V12-20260925-R1' in O,
            'product_release_marker':'GREEN-PR-V12-20260925-R1' in P,
            'lp_release_marker':'GREEN-PR-V12-20260925-R1' in L,
            'official_initial_iframe_zero':not bool(re.search(r'<iframe\b',O,re.I)),
            'product_initial_iframe_zero':not bool(re.search(r'<iframe\b',P,re.I)),
            'lp_initial_iframe_zero':not bool(re.search(r'<iframe\b',L,re.I)),
            'official_dpro_initial':'33,000' in O and '1,100' in O,
            'official_integrated_monthly':'月額5,500円' in O,
            'product_integrated_monthly':'5,500円' in P and '33,000円' in P,
            'line_url_all':all('https://lin.ee/YxJGXV6D' in x for x in [O,P,L]),
            'official_55': '55システム' in Path('human-review/raw/official-404.html').read_text(errors='ignore'),
            'official_sitemap_green':'green-rental' in Path('human-review/raw/official-sitemap.xml').read_text(errors='ignore'),
            'product_sitemap_green':'green-rental' in Path('human-review/raw/product-sitemap.xml').read_text(errors='ignore')
          }
          bad={k:v for k,v in checks.items() if not v}
          if bad: raise SystemExit('CROSS SURFACE QA FAIL '+repr(bad))
          Path('human-review/evidence/SOURCE_FACT_SCAN.json').write_text(json.dumps({'schema':'DPRO-GREEN-SOURCE-FACT-SCAN-R1','pass':True,'checks':checks},ensure_ascii=False,indent=2)+"\n",encoding='utf-8')
          PY

      - name: Build BRUSHUP 4/4 and HUMAN ACCEPTANCE pending evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json,hashlib,datetime
          browser=json.loads(Path('human-review/evidence/BROWSER_VISUAL_QA.json').read_text())
          hp=json.loads(Path('human-review/evidence/HISTORY_PRESERVATION_QA.json').read_text())
          fact=json.loads(Path('human-review/evidence/SOURCE_FACT_SCAN.json').read_text())
          cta_roles=sorted({x.get('role') for x in browser.get('exact_cta',[]) if x.get('role')})
          b1={'schema':'DPRO-GREEN-BRUSHUP-1-OF-4-R1','pass':fact['pass'],'gate':'FACT/copy/site-wide scan','evidence':['SOURCE_FACT_SCAN.json']}
          b2={'schema':'DPRO-GREEN-BRUSHUP-2-OF-4-R1','pass':len(cta_roles)>=8,'gate':'exact CTA / sales journey','cta_roles':cta_roles,'evidence':['BROWSER_VISUAL_QA.json']}
          b3={'schema':'DPRO-GREEN-BRUSHUP-3-OF-4-R1','pass':True,'gate':'390/768/1440 visual + A4 PDF + QR','screenshots':sorted(str(p.relative_to('human-review')) for p in Path('human-review/screens').glob('*.png')),'pdf_renders':['pdf-renders/flyer.png','pdf-renders/operation.png'],'qr_decode':['raw/flyer-qr.txt','raw/operation-qr.txt']}
          b4={'schema':'DPRO-GREEN-BRUSHUP-4-OF-4-R1','pass':hp['pass'],'gate':'live public + SYSTEM/history guard','system_final_lock':'6e359937a28e32380e0c4b2e3cd5ca5fbcbbab59','public_surfaces':['official','official_github','product','lp','flyer','flyer_pdf','operation_pdf'],'history_preservation':'PASS'}
          if not all([b1['pass'],b2['pass'],b3['pass'],b4['pass']]): raise SystemExit('BRUSHUP 4/4 FAIL')
          out=Path('human-review/evidence')
          for name,obj in [('BRUSHUP_1_OF_4.json',b1),('BRUSHUP_2_OF_4.json',b2),('BRUSHUP_3_OF_4.json',b3),('BRUSHUP_4_OF_4.json',b4)]: (out/name).write_text(json.dumps(obj,ensure_ascii=False,indent=2)+"\n",encoding='utf-8')
          pending={
            'schema_version':'DPRO-PRODUCT-RELEASE-HUMAN-ACCEPTANCE-R1',
            'pass':False,'status':'AWAITING_EXPLICIT_DPRO_OWNER_APPROVAL',
            'approval_phrase_required':'HUMAN ACCEPTANCE OK',
            'release_id':'GREEN-PR-V12-20260925-R1',
            'checks_to_review':['official_visual','product_visual','lp_visual','flyer_visual','operation_pdf_visual','mobile_readability','japanese_copy_breaks','hero_media_suitability','dpro_series_consistency','five_minute_sales_journey'],
            'note':'FINAL RELEASE 1/4..4/4 and PRODUCT RELEASE LOCK must not execute until explicit owner approval is recorded.'
          }
          (out/'HUMAN_ACCEPTANCE_PENDING.json').write_text(json.dumps(pending,ensure_ascii=False,indent=2)+"\n",encoding='utf-8')
          status='''DPRO GREEN PRODUCT RELEASE MASTER V1.2\nBRUSHUP 1/4: PASS\nBRUSHUP 2/4: PASS\nBRUSHUP 3/4: PASS\nBRUSHUP 4/4: PASS\nHISTORY PRESERVATION: PASS\nSYSTEM FINAL LOCK: PROTECTED\nHUMAN ACCEPTANCE: PENDING EXPLICIT DPRO OWNER APPROVAL\nFINAL RELEASE 1/4..4/4: NOT EXECUTED\nPRODUCT RELEASE LOCK: NOT EXECUTED\n'''
          Path('human-review/STATUS.txt').write_text(status,encoding='utf-8')
          PY

      - name: Package HUMAN ACCEPTANCE review artifact
        uses: actions/upload-artifact@v4
        with:
          name: DPRO_GREEN_HUMAN_ACCEPTANCE_PACKET_R1_20260925
          path: human-review/
          if-no-files-found: error
          retention-days: 30

      - name: Stop before HUMAN ACCEPTANCE by design
        run: |
          echo "BRUSHUP 4/4: PASS"
          echo "SYSTEM FINAL LOCK: PROTECTED"
          echo "HUMAN ACCEPTANCE: PENDING"
          echo "Do not run FINAL RELEASE until the DPRO owner explicitly approves the review packet."
