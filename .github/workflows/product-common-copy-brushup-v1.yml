name: PRODUCT common customer copy brushup V1.1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/product-common-copy-brushup-v1.yml'

permissions:
  contents: write

jobs:
  brushup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Brush up common customer-facing pages
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import hashlib
          from collections import Counter

          TARGETS = [
              Path("index.html"),
              Path("systems.html"),
              Path("proposal.html"),
              Path("dpro-system.html"),
              Path("line.html"),
              Path("website.html"),
          ]
          DYNAMIC_PAGES = {
              Path("index.html"),
              Path("systems.html"),
              Path("proposal.html"),
          }
          PROTECTED = [
              Path("systems-data.js"),
              Path("systems/pet-care.html"),
              Path("product-v3.6.js"),
          ]

          for p in TARGETS + PROTECTED:
              if not p.exists():
                  raise SystemExit(f"Required file missing: {p}")

          protected_before = {
              str(p): hashlib.sha256(p.read_bytes()).hexdigest()
              for p in PROTECTED
          }

          def links(html):
              vals = []
              for attr in ("href", "src", "data-src", "action", "formaction"):
                  vals += re.findall(
                      rf'\b{attr}\s*=\s*["\']([^"\']+)["\']',
                      html,
                      flags=re.I,
                  )
              return Counter(vals)

          def prices(text):
              return Counter(re.findall(r'(?:\d{1,3}(?:,\d{3})+|\d+)円', text))

          def stash(html):
              saved = []
              pat = re.compile(
                  r'<!--.*?-->|<script\b.*?</script>|<style\b.*?</style>',
                  flags=re.S | re.I,
              )
              def repl(match):
                  token = f"___COMMON_STASH_{len(saved)}___"
                  saved.append(match.group(0))
                  return token
              return pat.sub(repl, html), saved

          def restore(html, saved):
              for i, value in enumerate(saved):
                  html = html.replace(f"___COMMON_STASH_{i}___", value)
              return html

