          GENERIC = [
              ("RED / PRODUCT SITE", "PRODUCT SITE"),
              ("RED / PRODUCT CATALOG", "SYSTEM CATALOG"),
              ("BLUE / DPRO SHOP OFFICIAL SITE", "DPRO SHOP"),
              ("BLUE / OFFICIAL SITE ↗", "DPRO SHOP ↗"),
              ("BLUE / OFFICIAL SITE", "DPRO SHOP"),
              ("BLUE OFFICIAL", "DPRO SHOP"),
              ("青のDPRO SHOP OFFICIAL SITE", "DPRO SHOP"),
              ("青のOFFICIAL SITE", "DPRO SHOP"),
              ("青のOFFICIAL", "DPRO SHOP"),
              ("青OFFICIAL", "DPRO SHOP"),
              ("OFFICIAL SITEで詳しく見る ↗", "DPRO SHOPで詳しく見る ↗"),
              ("OFFICIAL SYSTEM GUIDE ↗", "DPRO SHOPで詳しく見る ↗"),
              ("ONE MANAGEMENT HUB", "DPRO SYSTEM"),
              ("PRODUCT TOP", "トップ"),
              ("50 SYSTEMS", "システム一覧"),
              ("50 COMPLETED SYSTEMS", "50 業種別システム"),
              ("COMPLETED SYSTEMS", "業種別システム"),
              ("50 LIVE PRODUCTS", "SYSTEM CATALOG"),
              ("完成システム一覧", "業種別システム一覧"),
              ("50の完成システム", "50の業種別システム"),
              ("50の完成DPROシステム", "50の業種別DPROシステム"),
              ("業種別提案", "業種別の導入例"),
              ("DPRO SALESNAVI", "INDUSTRY GUIDE"),
              ("URL COPY", "ページ共有"),
              ("SYSTEM CODE", "業種名"),
          ]

          def clean_visible(value):
              for old, new in GENERIC:
                  value = value.replace(old, new)
              value = value.replace("OFFICIAL SITEが正式な案内場所です", "DPRO SHOPで詳しくご案内しています")
              value = value.replace("OFFICIAL SITE", "DPRO SHOP")
              value = value.replace("OFFICIALへ", "DPRO SHOPへ")
              value = value.replace("DPRO SHOP DPRO SHOP", "DPRO SHOP")
              value = re.sub(r"[ \t]{2,}", " ", value)
              return value

          dynamic_script_lines = [
              '<script id="dpro-common-customer-copy">',
              '(() => {',
              '  "use strict";',
              '  const setText = (selector, text) => {',
              '    document.querySelectorAll(selector).forEach((node) => {',
              '      if (node.textContent !== text) node.textContent = text;',
              '    });',
              '  };',
              '  const apply = () => {',
              '    setText(".p36-card-actions .is-official", "DPRO SHOPで詳しく ↗");',
              '    setText(".p36-card-resource .is-proposal-link", "導入例・資料を見る →");',
              '    setText(".p36-proposal-card__actions .is-primary", "詳しい紹介を見る ↗");',
              '    setText(".p36-proposal-card__actions [data-p36-copy-url]", "ページURLをコピー");',
              '    setText(".p36-proposal-card__foot > a:first-child", "商品ページを見る");',
              '    setText(".p36-proposal-card__foot .is-official", "DPRO SHOPで詳しく ↗");',
              '    document.querySelectorAll(".p36-vet-hp__actions .is-official").forEach((node) => {',
              '      if (node.textContent !== "DPRO SHOPで詳しく ↗") node.textContent = "DPRO SHOPで詳しく ↗";',
              '    });',
              '    const source = document.querySelector("[data-p36-proposal-source]");',
              '    if (source && !source.hidden) {',
              '      const strong = source.querySelector("strong");',
              '      const detail = source.querySelector("[data-p36-proposal-source-text]");',
              '      if (strong) strong.textContent = "選択した業種を表示しています。";',
              '      if (detail && /営業先|提案/.test(detail.textContent || "")) {',
              '        detail.textContent = "選択した業種に近い導入例を表示しています。";',
              '      }',
              '    }',
              '  };',
              '  apply();',
              '  const observer = new MutationObserver(apply);',
              '  observer.observe(document.documentElement, {subtree:true, childList:true});',
              '  window.setTimeout(() => observer.disconnect(), 10000);',
              '})();',
              '</script>',
          ]
          DYNAMIC_SCRIPT = "\n".join(dynamic_script_lines)

          def transform(path, before):
              work = before

              for old, new in RAW.get(path.name, []):
                  work = work.replace(old, new)

              body, saved = stash(work)
              body = re.sub(
                  r">([^<>]+)<",
                  lambda m: ">" + clean_visible(m.group(1)) + "<",
                  body,
              )
              work = restore(body, saved)

              def attr_repl(match):
                  return f'{match.group(1)}={match.group(2)}{clean_visible(match.group(3))}{match.group(2)}'

              work = re.sub(
                  r'\b(aria-label|title|data-title)\s*=\s*(["\'])(.*?)\2',
                  attr_repl,
                  work,
                  flags=re.I | re.S,
              )

              if path in DYNAMIC_PAGES and 'id="dpro-common-customer-copy"' not in work:
                  work = work.replace("</body>", DYNAMIC_SCRIPT + "\n</body>", 1)

              return work

          changed = []
          for path in TARGETS:
              before = path.read_text(encoding="utf-8")
              old_links = links(before)
              old_prices = prices(before)

              after = transform(path, before)

              if links(after) != old_links:
                  raise SystemExit(f"{path}: link target changed")
              if prices(after) != old_prices:
                  raise SystemExit(f"{path}: price text changed")

              if after != before:
                  path.write_text(after, encoding="utf-8")
                  changed.append(str(path))

          def customer_surface(html):
              s = re.sub(r"<!--.*?-->", " ", html, flags=re.S)
              s = re.sub(r"<script\b.*?</script>", " ", s, flags=re.S | re.I)
              s = re.sub(r"<style\b.*?</style>", " ", s, flags=re.S | re.I)
              meta = " ".join(re.findall(
                  r'<meta\b[^>]*content\s*=\s*["\']([^"\']*)["\'][^>]*>',
                  s,
                  flags=re.I | re.S,
              ))
              visible = re.sub(r"<[^>]+>", " ", s)
              return re.sub(r"\s+", " ", visible + " " + meta)

          banned = [
              "RED / PRODUCT SITE",
              "BLUE / OFFICIAL",
              "青OFFICIAL",
              "青のOFFICIAL",
              "DPRO SALESNAVI",
              "URL COPY",
              "SYSTEM CODE",
              "COMPLETED SYSTEMS",
              "ONE MANAGEMENT HUB",
              "営業先に合う提案",
          ]

          failures = []
          for path in TARGETS:
              raw = path.read_text(encoding="utf-8")
              surface = customer_surface(raw)
              remaining = [term for term in banned if term in surface]
              if remaining:
                  failures.append(f"{path}: customer-facing internal wording remains: {remaining}")
              if re.search(r"<br\s*/?>\s*<br\s*/?>", raw, flags=re.I):
                  failures.append(f"{path}: consecutive BR tags found")

          for p in PROTECTED:
              now = hashlib.sha256(p.read_bytes()).hexdigest()
              if now != protected_before[str(p)]:
                  failures.append(f"{p}: protected file changed")

          for p in DYNAMIC_PAGES:
              if 'id="dpro-common-customer-copy"' not in p.read_text(encoding="utf-8"):
                  failures.append(f"{p}: dynamic customer copy helper missing")

          if failures:
              print("VALIDATION FAIL")
              for failure in failures:
                  print(" -", failure)
              raise SystemExit(1)

          print("COMMON PAGE TARGETS:", len(TARGETS))
          print("CHANGED FILES:", len(changed))
          for p in changed:
              print("  CHANGED", p)
          print("PROTECTED: systems-data.js")
          print("PROTECTED: systems/pet-care.html")
          print("PROTECTED: product-v3.6.js")
          print("COMMON CUSTOMER COPY VALIDATION PASS V1.1")
          PY

      - name: Static QA
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          pages = [
              Path("index.html"),
              Path("systems.html"),
              Path("proposal.html"),
              Path("dpro-system.html"),
              Path("line.html"),
              Path("website.html"),
          ]

          for path in pages:
              html = path.read_text(encoding="utf-8")
              assert "<html" in html.lower(), f"{path}: html root missing"
              assert "</html>" in html.lower(), f"{path}: html close missing"

          assert "DPRO SHOP" in Path("index.html").read_text(encoding="utf-8")
          assert "業種別の導入例" in Path("proposal.html").read_text(encoding="utf-8")
          assert "かんたん絞り込み" in Path("systems.html").read_text(encoding="utf-8")
          print("STATIC QA PASS: 6 common pages")
          PY

      - name: Commit successful brushup and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git rm -f .github/workflows/product-common-copy-brushup-v1.yml
          git add index.html systems.html proposal.html dpro-system.html line.html website.html

          echo "Changed paths:"
          git diff --cached --name-only

          if git diff --cached --name-only | grep -E '^(systems/|systems-data\.js$|product-v3\.6\.js$)'; then
            echo "ERROR: protected path staged"
            exit 1
          fi

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Brush up PRODUCT common pages for customers V1.1"
          git push origin HEAD:main
