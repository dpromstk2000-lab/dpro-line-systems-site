name: STEP DPRO TUTORIAL GREEN R6 FINAL V1.1

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/step-dpro-tutorial-green-r6-final-v1.1.yml'

permissions:
  contents: write

env:
  PRODUCT_URL: https://dpromstk2000-lab.github.io/dpro-line-systems-site/systems/green-rental.html
  QUICK_URL: https://dpromstk2000-lab.github.io/dpro-line-systems-site/assets/pdfs/dpro-green-rental-tutorial-quick-start-v1.0.pdf
  DETAIL_URL: https://dpromstk2000-lab.github.io/dpro-line-systems-site/assets/pdfs/dpro-green-rental-tutorial-detailed-manual-v1.0.pdf
  GUIDE_URL: https://dpromstk2000-lab.github.io/dpro-green-rental-line/guide-center.html
  OWNER_URL: https://dpromstk2000-lab.github.io/dpro-green-rental-line/owner.html

concurrency:
  group: dpro-tutorial-green-r6-final
  cancel-in-progress: false

jobs:
  deploy-and-live-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Stage Quick PDF payload 1/3
        shell: bash
        run: |
          cat > /tmp/green-r6-quick.b64 <<'DPRO_B64'
          
          DPRO_B64

      - name: Stage Quick PDF payload 2/3
        shell: bash
        run: |
          cat >> /tmp/green-r6-quick.b64 <<'DPRO_B64'
          
          DPRO_B64

      - name: Stage Quick PDF payload 3/3
        shell: bash
        run: |
          cat >> /tmp/green-r6-quick.b64 <<'DPRO_B64'
          
          DPRO_B64

      - name: Stage Detailed PDF payload 1/4
        shell: bash
        run: |
          cat > /tmp/green-r6-detailed.b64 <<'DPRO_B64'
          
          DPRO_B64

      - name: Stage Detailed PDF payload 2/4
        shell: bash
        run: |
          cat >> /tmp/green-r6-detailed.b64 <<'DPRO_B64'
          
          DPRO_B64

      - name: Stage Detailed PDF payload 3/4
        shell: bash
        run: |
          cat >> /tmp/green-r6-detailed.b64 <<'DPRO_B64'
          
          DPRO_B64

      - name: Stage Detailed PDF payload 4/4
        shell: bash
        run: |
          cat >> /tmp/green-r6-detailed.b64 <<'DPRO_B64'
          
          DPRO_B64

      - name: Guard GREEN source, install locked PDFs, patch Product Site
        shell: python
        run: |
          from pathlib import Path
          import base64, hashlib, re, subprocess

          EXPECTED_PAGE_BLOB = "8c8348dc508ba9fffd08f2ca147158aa5d49a734"
          SELF = Path(".github/workflows/step-dpro-tutorial-green-r6-final-v1.1.yml")
          PAGE = Path("systems/green-rental.html")
          MIRROR = Path("systems/green-rental.html.txt")
          QUICK = Path("assets/pdfs/dpro-green-rental-tutorial-quick-start-v1.0.pdf")
          DETAIL = Path("assets/pdfs/dpro-green-rental-tutorial-detailed-manual-v1.0.pdf")
          QUICK_SHA = "d33d75f1f09d2155540c7610f941ca4f0204a680626731093dac6db58fdddf74"
          DETAIL_SHA = "5a819c6fec9f3fe06a432346b7ca05cef2049c877cbd784b6181752aa90bc5ea"
          CSS = '/* DPRO TUTORIAL GREEN R6 PRODUCT SITE START */\n.ps-tutorial-section{background:linear-gradient(145deg,#f3faf6 0%,#fff 58%,#f8f4ec 100%)}\n.ps-tutorial-shell{padding:clamp(1.2rem,3vw,2rem);border:1px solid #cfe3d9;border-radius:1.5rem;background:rgba(255,255,255,.92);box-shadow:var(--dpro-shadow-sm)}\n.ps-tutorial-intro{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(260px,.75fr);gap:1.4rem;align-items:end;margin-bottom:1.25rem}\n.ps-tutorial-intro h2{margin:0;color:var(--ps-deep);font-size:clamp(1.75rem,3.4vw,2.65rem);line-height:1.2;letter-spacing:-.035em}\n.ps-tutorial-intro p:last-child{margin:.7rem 0 0;color:var(--dpro-warm-gray-600)}\n.ps-tutorial-assurance{padding:1rem 1.1rem;border-radius:1rem;background:var(--ps-deep);color:#fff}\n.ps-tutorial-assurance strong{display:block;font-size:1.03rem}.ps-tutorial-assurance span{display:block;margin-top:.25rem;color:#cfe3da;font-size:.84rem}\n.ps-tutorial-path{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.9rem}\n.ps-tutorial-card{display:flex;min-width:0;flex-direction:column;padding:1.1rem;border:1px solid var(--ps-line);border-radius:1.05rem;background:#fff}\n.ps-tutorial-step{display:inline-flex;align-items:center;gap:.4rem;color:var(--dpro-green);font-size:.72rem;font-weight:900;letter-spacing:.1em}\n.ps-tutorial-card h3{margin:.5rem 0 .4rem;color:var(--ps-deep);font-size:1.08rem;line-height:1.4}\n.ps-tutorial-card p{margin:0;color:var(--dpro-warm-gray-600);font-size:.88rem}\n.ps-tutorial-note{display:inline-flex;align-items:center;margin-top:auto;padding-top:.9rem;color:var(--dpro-green);font-size:.78rem;font-weight:900}\n.ps-tutorial-links{display:grid;gap:.5rem;margin-top:auto;padding-top:.9rem}\n.ps-tutorial-link{display:flex;align-items:center;justify-content:space-between;gap:.7rem;min-height:44px;padding:.65rem .8rem;border:1px solid #bcdcca;border-radius:.75rem;background:#f7fcf9;color:var(--ps-deep);text-decoration:none;font-size:.8rem;font-weight:900}\n.ps-tutorial-link:hover{border-color:var(--dpro-green);background:var(--dpro-soft-green)}\n.ps-tutorial-link::after{content:"↗";flex:0 0 auto;color:var(--dpro-green);font-size:1rem}\n@media(max-width:900px){.ps-tutorial-intro{grid-template-columns:1fr}.ps-tutorial-path{grid-template-columns:1fr}}\n@media(max-width:640px){.ps-tutorial-shell{padding:1rem;border-radius:1.15rem}.ps-tutorial-intro{gap:.9rem}.ps-tutorial-card{padding:1rem}.ps-tutorial-link{font-size:.76rem}}\n/* DPRO TUTORIAL GREEN R6 PRODUCT SITE END */'
          SECTION = '<section aria-labelledby="tutorial-title" class="dpro-section ps-tutorial-section" data-dpro-tutorial-r6="1" id="tutorial-support"><div class="dpro-container"><div class="ps-tutorial-shell"><div class="ps-tutorial-intro"><div><p class="ps-kicker">AFTER CONTRACT SUPPORT</p><h2 id="tutorial-title">契約後も、「最初の10分」から迷わず使える。</h2><p>契約後すぐ始められるよう、「最初の10分 → 操作ガイド → 印刷マニュアル」の順で確認できる学習導線を用意しています。PC・スマホでいつでも見返せて、印刷して店舗・事務所に置くこともできます。</p></div><div class="ps-tutorial-assurance"><strong>導入前から、契約後の使い方まで見える安心感。</strong><span>分からない時に、聞く前に自分で確認できるサポートを用意しています。</span></div></div><div class="ps-tutorial-path"><article class="ps-tutorial-card"><span class="ps-tutorial-step">STEP 01 / FIRST 10 MINUTES</span><h3>まずは「最初の10分」</h3><p>今日の状況から、問い合わせ、顧客・設置場所、巡回予定、現場記録、作業報告・交換対応まで、最初に覚える流れを画面内で順番に確認します。</p><span class="ps-tutorial-note">7章・15カードの画面内ガイド</span></article><article class="ps-tutorial-card"><span class="ps-tutorial-step">STEP 02 / GUIDE CENTER</span><h3>迷ったら、操作ガイドで検索</h3><p>8カテゴリ・33記事とFAQから、必要な手順だけをPC・スマホで確認できます。</p><div class="ps-tutorial-links"><a class="ps-tutorial-link" href="https://dpromstk2000-lab.github.io/dpro-green-rental-line/guide-center.html" rel="noopener" target="_blank">Guide Centerを開く</a></div></article><article class="ps-tutorial-card"><span class="ps-tutorial-step">STEP 03 / PRINT MANUAL</span><h3>必要なら、印刷して手元に</h3><p>最初の10分用Quick Startと、全操作を確認できるDetailed Manualを用意。ブラウザで開いて、そのまま印刷できます。</p><div class="ps-tutorial-links"><a class="ps-tutorial-link" href="../assets/pdfs/dpro-green-rental-tutorial-quick-start-v1.0.pdf" rel="noopener" target="_blank">Quick Start｜最初の10分</a><a class="ps-tutorial-link" href="../assets/pdfs/dpro-green-rental-tutorial-detailed-manual-v1.0.pdf" rel="noopener" target="_blank">Detailed Manual｜詳しい操作</a></div></article></div></div></div></section>'
          FAQ_ANCHOR = '<section class="dpro-section ps-section-soft master-section" data-master-section="11" id="faq" aria-labelledby="faq-title">'

          for p in (PAGE, MIRROR):
              if not p.exists(): raise SystemExit(f"BLOCK: missing {p}")
              blob = subprocess.check_output(["git","hash-object",str(p)], text=True).strip()
              if blob != EXPECTED_PAGE_BLOB:
                  raise SystemExit(f"BLOCK: GREEN Product Site drift {p} expected={EXPECTED_PAGE_BLOB} actual={blob}")

          original = PAGE.read_text(encoding="utf-8")
          mirror_original = MIRROR.read_text(encoding="utf-8")
          if original != mirror_original: raise SystemExit("BLOCK: HTML/TXT mirror differ before R6")
          if original.count("</style></head>") != 1: raise SystemExit("BLOCK: style anchor count != 1")
          if original.count(FAQ_ANCHOR) != 1: raise SystemExit("BLOCK: FAQ anchor count != 1")
          if 'data-dpro-tutorial-r6="1"' in original: raise SystemExit("BLOCK: R6 section already present")

          baseline_required = [
              "観葉植物レンタル・グリーンレンタル",
              "LIVE DEMO 公開中",
              "月額合計 5,500円（税込）",
              "LINE公式運用</span><strong>3,300円</strong>",
              "ホームページ運用</span><strong>1,100円</strong>",
              "DPROシステム運用</span><strong>1,100円</strong>",
              "https://dpromstk2000-lab.github.io/dpro-green-rental-line/",
              "https://lin.ee/YxJGXV6D",
              "../lp-green-rental.html",
              "../flyer-green-rental.html",
              "../flyer-green-rental.pdf",
          ]
          for token in baseline_required:
              if token not in original: raise SystemExit(f"BLOCK: existing GREEN sales marker missing: {token}")

          QUICK.parent.mkdir(parents=True, exist_ok=True)
          q_payload = Path("/tmp/green-r6-quick.b64")
          d_payload = Path("/tmp/green-r6-detailed.b64")
          if not q_payload.exists() or not d_payload.exists(): raise SystemExit("BLOCK: staged PDF payload missing")
          QUICK.write_bytes(base64.b64decode(q_payload.read_text(encoding="ascii")))
          DETAIL.write_bytes(base64.b64decode(d_payload.read_text(encoding="ascii")))
          if hashlib.sha256(QUICK.read_bytes()).hexdigest() != QUICK_SHA: raise SystemExit("BLOCK: Quick SHA mismatch")
          if hashlib.sha256(DETAIL.read_bytes()).hexdigest() != DETAIL_SHA: raise SystemExit("BLOCK: Detailed SHA mismatch")

          patched = original.replace("</style></head>", CSS + "\n</style></head>", 1)
          patched = patched.replace(FAQ_ANCHOR, SECTION + FAQ_ANCHOR, 1)
          restored = patched.replace(CSS + "\n", "", 1).replace(SECTION, "", 1)
          if restored != original: raise SystemExit("BLOCK: additive-only identity proof failed")

          required_r6 = [
              "契約後すぐ始められる",
              "最初の10分 → 操作ガイド → 印刷マニュアル",
              "PC・スマホ",
              "店舗・事務所",
              "Guide Centerを開く",
              "../assets/pdfs/dpro-green-rental-tutorial-quick-start-v1.0.pdf",
              "../assets/pdfs/dpro-green-rental-tutorial-detailed-manual-v1.0.pdf",
              "https://dpromstk2000-lab.github.io/dpro-green-rental-line/guide-center.html",
          ]
          if patched.count('data-dpro-tutorial-r6="1"') != 1: raise SystemExit("BLOCK: R6 section count != 1")
          for token in required_r6:
              if token not in patched: raise SystemExit(f"BLOCK: R6 route/copy missing: {token}")

          forbidden = ["System Check","system-check","contact-green-system-check.html","demo_prepare","Worker/DB/API","CENTRAL","service_role"]
          bad = [x for x in forbidden if x in SECTION]
          if bad: raise SystemExit(f"BLOCK: internal wording in sales section: {bad}")
          if re.search(r"(?<!\d)0[789]0[- ]?\d{4}[- ]?\d{4}(?!\d)", SECTION):
              raise SystemExit("BLOCK: customer phone-like value in sales section")

          for token in baseline_required:
              if patched.count(token) != original.count(token):
                  raise SystemExit(f"BLOCK: existing sales marker count changed: {token}")

          PAGE.write_text(patched, encoding="utf-8", newline="")
          MIRROR.write_text(patched, encoding="utf-8", newline="")
          if PAGE.read_bytes() != MIRROR.read_bytes(): raise SystemExit("BLOCK: HTML/TXT mirror mismatch after R6")
          print("GREEN R6 pre-commit static QA: PASS")
          print("Quick SHA256:", QUICK_SHA)
          print("Detailed SHA256:", DETAIL_SHA)

      - name: Commit R6 Product Site and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add systems/green-rental.html systems/green-rental.html.txt             assets/pdfs/dpro-green-rental-tutorial-quick-start-v1.0.pdf             assets/pdfs/dpro-green-rental-tutorial-detailed-manual-v1.0.pdf
          git rm -f .github/workflows/step-dpro-tutorial-green-r6-final-v1.0.yml .github/workflows/step-dpro-tutorial-green-r6-final-v1.1.yml
          git commit -m "Add GREEN tutorial support to product site [run ${{ github.run_id }}]"
          git push
          echo "R6_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "R6_TREE=$(git rev-parse HEAD^{tree})" >> "$GITHUB_ENV"
          echo "R6_RUN_ID=${{ github.run_id }}" >> "$GITHUB_ENV"

      - name: Wait for GitHub Pages routes
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 40); do
            product=$(curl -fsSL --max-time 20 -H 'Cache-Control: no-cache' "${PRODUCT_URL}?r6=${R6_COMMIT}" || true)
            if [[ "$product" == *'data-dpro-tutorial-r6="1"'* ]] &&                curl -fsSI --max-time 20 "${QUICK_URL}?r6=${R6_COMMIT}" >/dev/null &&                curl -fsSI --max-time 20 "${DETAIL_URL}?r6=${R6_COMMIT}" >/dev/null; then
              echo "GitHub Pages R6 routes ready on attempt $attempt"
              break
            fi
            if [[ "$attempt" == "40" ]]; then echo "BLOCK: Pages did not converge" >&2; exit 1; fi
            sleep 10
          done

      - name: Install FINAL QA dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet pypdf playwright

      - name: Public content and PDF byte QA
        shell: python
        run: |
          import hashlib, json, os, subprocess, urllib.request
          from pathlib import Path
          from pypdf import PdfReader

          out=Path('/tmp/r6-live-evidence'); out.mkdir(parents=True, exist_ok=True)
          def get(url, binary=False):
              req=urllib.request.Request(url, headers={'Cache-Control':'no-cache','User-Agent':'DPRO-R6-QA'})
              with urllib.request.urlopen(req, timeout=30) as r: return r.read() if binary else r.read().decode('utf-8')
          product=get(os.environ['PRODUCT_URL']+'?r6='+os.environ['R6_COMMIT'])
          guide=get(os.environ['GUIDE_URL']+'?r6='+os.environ['R6_COMMIT'])
          owner=get(os.environ['OWNER_URL']+'?r6='+os.environ['R6_COMMIT'])
          canonical=json.loads(get('https://dpromstk2000-lab.github.io/dpro-green-rental-line/dpro-tutorial-content-green.json?r6='+os.environ['R6_COMMIT']))
          qbytes=get(os.environ['QUICK_URL']+'?r6='+os.environ['R6_COMMIT'], True)
          dbytes=get(os.environ['DETAIL_URL']+'?r6='+os.environ['R6_COMMIT'], True)
          qp=out/'quick-public.pdf'; dp=out/'detailed-public.pdf'; qp.write_bytes(qbytes); dp.write_bytes(dbytes)
          qsha=hashlib.sha256(qbytes).hexdigest(); dsha=hashlib.sha256(dbytes).hexdigest()
          if qsha != 'd33d75f1f09d2155540c7610f941ca4f0204a680626731093dac6db58fdddf74': raise SystemExit('BLOCK: public Quick SHA mismatch '+qsha)
          if dsha != '5a819c6fec9f3fe06a432346b7ca05cef2049c877cbd784b6181752aa90bc5ea': raise SystemExit('BLOCK: public Detailed SHA mismatch '+dsha)
          qr=PdfReader(str(qp)); dr=PdfReader(str(dp))
          if len(qr.pages)!=8 or len(dr.pages)!=18: raise SystemExit('BLOCK: PDF page count mismatch')
          for label, reader in [('quick',qr),('detail',dr)]:
              for i,p in enumerate(reader.pages):
                  w=float(p.mediabox.width); h=float(p.mediabox.height)
                  if not (594 < w < 597 and 840 < h < 843 and h>w): raise SystemExit(f'BLOCK: {label} page {i+1} not A4 portrait')
          product_tokens=['契約後すぐ始められる','最初の10分 → 操作ガイド → 印刷マニュアル','PC・スマホ','店舗・事務所','Guide Centerを開く','月額合計 5,500円（税込）','LINE公式運用</span><strong>3,300円</strong>','ホームページ運用</span><strong>1,100円</strong>','DPROシステム運用</span><strong>1,100円</strong>','LIVE DEMO','https://lin.ee/YxJGXV6D','../lp-green-rental.html','../flyer-green-rental.html','../flyer-green-rental.pdf']
          missing=[x for x in product_tokens if x not in product]
          if missing: raise SystemExit('BLOCK: public Product token missing '+repr(missing))
          if product.count('data-dpro-tutorial-r6="1"')!=1: raise SystemExit('BLOCK: public Product R6 section count')
          gc=canonical['guide_center']; f10=canonical['first10']
          if (len(f10['chapters']),len(f10['cards']),len(gc['categories']),len(gc['articles']),len(gc['faqs']))!=(7,15,8,33,12): raise SystemExit('BLOCK: runtime canonical counts')
          faq11=next(x for x in gc['faqs'] if x['id']=='green.faq.11')
          if faq11['q']!='日常操作以外の管理・検査画面が見える場合はどうしますか？' or faq11['a']!='日常チュートリアルの対象外です。操作せず、必要な場合はDPROサポートへ確認してください。': raise SystemExit('BLOCK: FAQ11 wording')
          customer_text=json.dumps({'first10':f10,'guide_center':gc},ensure_ascii=False)
          for bad in ['System Check','system-check','contact-green-system-check.html']:
              if bad in customer_text: raise SystemExit('BLOCK: customer-facing internal wording '+bad)
          result={'r6_commit':os.environ['R6_COMMIT'],'r6_tree':os.environ['R6_TREE'],'quick_sha256':qsha,'detailed_sha256':dsha,'quick_pages':8,'detailed_pages':18,'runtime_counts':{'first10_chapters':7,'first10_cards':15,'guide_categories':8,'guide_articles':33,'faq':12},'public_content_qa':'PASS'}
          (out/'R6_PUBLIC_BYTE_QA.json').write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(result,ensure_ascii=False,indent=2))

      - name: Actual public desktop/mobile browser QA
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, shutil
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          out=Path('/tmp/r6-live-evidence'); out.mkdir(parents=True, exist_ok=True)
          chrome=shutil.which('google-chrome') or shutil.which('chromium') or shutil.which('chromium-browser')
          if not chrome: raise SystemExit('BLOCK: system Chrome not found')
          results={}
          with sync_playwright() as p:
            browser=p.chromium.launch(headless=True, executable_path=chrome, args=['--no-sandbox','--disable-dev-shm-usage'])
            for name,vp in [('desktop',{'width':1440,'height':900}),('mobile390',{'width':390,'height':844})]:
              page=browser.new_page(viewport=vp)
              page_errors=[]; console_errors=[]
              page.on('pageerror',lambda exc,e=page_errors:e.append(str(exc)))
              page.on('console',lambda msg,e=console_errors:e.append(msg.text) if msg.type=='error' else None)
              resp=page.goto(os.environ['PRODUCT_URL']+'?r6='+os.environ['R6_COMMIT'],wait_until='networkidle',timeout=60000)
              if not resp or resp.status>=400: raise SystemExit(f'BLOCK: Product {name} status')
              sec=page.locator('[data-dpro-tutorial-r6="1"]')
              if sec.count()!=1 or not sec.is_visible(): raise SystemExit(f'BLOCK: Product R6 section not visible {name}')
              metrics=page.evaluate('''() => ({innerWidth:window.innerWidth,scrollWidth:document.documentElement.scrollWidth,overflow:document.documentElement.scrollWidth>window.innerWidth+1})''')
              if metrics['overflow']: raise SystemExit(f'BLOCK: Product horizontal overflow {name} {metrics}')
              hrefs=sec.locator('a').evaluate_all('(els)=>els.map(a=>a.href)')
              required=[os.environ['GUIDE_URL'],os.environ['QUICK_URL'],os.environ['DETAIL_URL']]
              if any(not any(h.startswith(r) for h in hrefs) for r in required): raise SystemExit(f'BLOCK: Product R6 links {name}')
              page.screenshot(path=str(out/f'R6_PRODUCT_SITE_{name.upper()}.png'),full_page=True)
              errors=page_errors+console_errors
              results['product_'+name]={'status':resp.status,'overflow':False,'section_visible':True,'errors':errors}
              if errors: raise SystemExit(f'BLOCK: Product browser errors {name} {errors}')
              page.close()
            # Guide Center desktop/mobile actual counts/render
            for name,vp in [('desktop',{'width':1440,'height':900}),('mobile390',{'width':390,'height':844})]:
              page=browser.new_page(viewport=vp)
              page_errors=[]; console_errors=[]; page.on('pageerror',lambda exc,e=page_errors:e.append(str(exc))); page.on('console',lambda msg,e=console_errors:e.append(msg.text) if msg.type=='error' else None)
              resp=page.goto(os.environ['GUIDE_URL']+'?r6='+os.environ['R6_COMMIT'],wait_until='networkidle',timeout=60000)
              page.wait_for_selector('.gc-article',timeout=20000)
              counts=page.evaluate('''() => ({articles:document.querySelectorAll('.gc-article').length,categories:document.querySelectorAll('#gc-categories [data-category]').length-1,faq:document.querySelectorAll('#gc-faq-list details').length,overflow:document.documentElement.scrollWidth>window.innerWidth+1,body:document.body.innerText})''')
              if (counts['categories'],counts['articles'],counts['faq'])!=(8,33,12): raise SystemExit(f'BLOCK: Guide counts {name} {counts}')
              if counts['overflow']: raise SystemExit(f'BLOCK: Guide overflow {name}')
              for bad in ['System Check','system-check','contact-green-system-check.html']:
                if bad in counts['body']: raise SystemExit(f'BLOCK: Guide visible internal wording {bad}')
              page.screenshot(path=str(out/f'R6_GUIDE_CENTER_{name.upper()}.png'),full_page=True)
              errors=page_errors+console_errors
              results['guide_'+name]={'status':resp.status,'overflow':False,'categories':8,'articles':33,'faq':12,'errors':errors}
              if errors: raise SystemExit(f'BLOCK: Guide browser errors {name} {errors}')
              page.close()
            # Owner First10 runtime: loading and opening menu must trigger no mutation requests.
            page=browser.new_page(viewport={'width':1440,'height':900})
            mutations=[]; page_errors=[]; console_errors=[]
            page.on('request',lambda req: mutations.append(req.method+' '+req.url) if req.method.upper() in ['POST','PUT','PATCH','DELETE'] else None)
            page.on('pageerror',lambda exc:page_errors.append(str(exc)))
            page.on('console',lambda msg:console_errors.append(msg.text) if msg.type=='error' else None)
            resp=page.goto(os.environ['OWNER_URL']+'?r6='+os.environ['R6_COMMIT'],wait_until='networkidle',timeout=60000)
            page.wait_for_selector('#dpro-guide-launcher',timeout=20000)
            api=page.evaluate('''() => ({start:typeof window.DPRO_TUTORIAL_GREEN?.start,resume:typeof window.DPRO_TUTORIAL_GREEN?.resume,replay:typeof window.DPRO_TUTORIAL_GREEN?.replay})''')
            if api!={'start':'function','resume':'function','replay':'function'}: raise SystemExit('BLOCK: First10 API missing '+repr(api))
            page.locator('#dpro-guide-launcher').click(); page.wait_for_timeout(300)
            if page.locator('#dpro-guide-menu').is_hidden(): raise SystemExit('BLOCK: First10 menu did not open')
            if mutations: raise SystemExit('BLOCK: tutorial menu caused mutation '+repr(mutations))
            page.screenshot(path=str(out/'R6_OWNER_FIRST10_DESKTOP.png'),full_page=True)
            errors=page_errors+console_errors
            results['owner_first10']={'status':resp.status,'api':api,'menu_open':True,'mutation_requests':mutations,'errors':errors}
            if errors: raise SystemExit('BLOCK: Owner browser errors '+repr(errors))
            browser.close()
          (out/'R6_BROWSER_QA.json').write_text(json.dumps(results,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(results,ensure_ascii=False,indent=2))
          PY

      - name: Upload FINAL LIVE QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DPRO_TUTORIAL_GREEN_R6_FINAL_LIVE_QA_${{ github.run_id }}
          path: /tmp/r6-live-evidence
          if-no-files-found: warn
          retention-days: 30
