name: DPRO LP Hero Typography Normalize V1.2

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/dpro-lp-hero-typography-normalize-v1-2.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dpro-lp-hero-typography-normalize-v1-2
  cancel-in-progress: false

jobs:
  normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout current Product Site
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Guard V1.1 diagnostic and protected state
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object systems-data.js)" = "e676cb5a559c3f89bdd9e86f3074756df8479dfa"
          test "$(git hash-object lp-hair.html)" = "baf040122e6c1086b2af77e4eb8eaf0f5bf8f352"
          test -f qa/lp-hero-typography-v1-1-diagnostic/AUDIT.json
          grep -Fq '"highPages": 16' qa/lp-hero-typography-v1-1-diagnostic/AUDIT.json
          grep -Fq 'DPRO LIVE DEMO ALL49 CENTRAL OVERRIDES START' systems-data.js
          grep -Fq 'flyerHtml: "flyer-medical.html"' systems-data.js
          echo "PASS: V1.1 diagnostics and protected Product state present"

      - name: Apply V1.2 base typography and residual phrase protection
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64,json,re

          base_style=base64.b64decode('').decode('utf-8')
          special=json.loads(base64.b64decode('').decode('utf-8'))
          phrase_map=json.loads(base64.b64decode('').decode('utf-8'))

          pages=sorted(Path('.').glob('lp-*.html'))
          if len(pages)!=50:
              raise SystemExit(f'BLOCKER expected 50 LPs, found {len(pages)}')

          h1_re=re.compile(r'(<h1\b[^>]*>)(.*?)(</h1>)',re.I|re.S)
          changed=[]

          for p in pages:
              if p.name=='lp-hair.html':
                  continue

              text=p.read_text(encoding='utf-8')
              if 'dpro-lp-hero-typography-normalize-v1-2' in text:
                  raise SystemExit(f'BLOCKER V1.2 already present {p.name}')

              m=h1_re.search(text)
              if not m:
                  raise SystemExit(f'BLOCKER no H1 in {p.name}')

              body=m.group(2)
              for phrase in phrase_map.get(p.name,[]):
                  if phrase not in body:
                      raise SystemExit(f'BLOCKER phrase {phrase!r} missing from H1 in {p.name}')
                  body=body.replace(
                      phrase,
                      f'<span class="dpro-h1-keep">{phrase}</span>',
                      1
                  )

              if body!=m.group(2):
                  text=text[:m.start(2)]+body+text[m.end(2):]

              insert=base_style + special.get(p.name,'')
              pos=text.lower().rfind('</head>')
              if pos<0:
                  raise SystemExit(f'BLOCKER </head> missing {p.name}')
              text=text[:pos]+insert+'\n'+text[pos:]
              p.write_text(text,encoding='utf-8',newline='\n')
              changed.append(p.name)

          if len(changed)!=49:
              raise SystemExit(f'BLOCKER expected 49 changed LPs, got {len(changed)}')

          print('PASS: V1.2 applied to 49 LPs; HAIR V1.3 preserved')
          print('PASS: diagnosed short Japanese words protected at build time')
          PY

      - name: Verify isolated scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test "$(git hash-object systems-data.js)" = "e676cb5a559c3f89bdd9e86f3074756df8479dfa"
          test "$(git hash-object lp-hair.html)" = "baf040122e6c1086b2af77e4eb8eaf0f5bf8f352"
          python3 - <<'PY'
          import subprocess,re
          changed=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          illegal={p for p in changed if not re.fullmatch(r'lp-[a-z0-9-]+\.html',p)}
          if illegal:
              raise SystemExit(f'BLOCKER non-LP changes: {sorted(illegal)}')
          if 'lp-hair.html' in changed:
              raise SystemExit('BLOCKER HAIR changed')
          if len(changed)!=49:
              raise SystemExit(f'BLOCKER changed LP count {len(changed)}')
          print('PASS: isolated 49-LP source scope')
          PY

      - name: Install Chromium and contact-sheet tools
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 --silent
          npx playwright install --with-deps chromium
          python3 -m pip install --quiet pillow

      - name: Create V1.2 semantic audit runner
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64
          Path('dpro-lp-hero-typography-audit-v12.js').write_bytes(
              base64.b64decode('')
          )
          PY
          node --check dpro-lp-hero-typography-audit-v12.js

      - name: Start local Product Site
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/dpro-http.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8765/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/dpro-http.log || true
          exit 1

      - name: Audit all 50 LPs and capture desktop heroes
        id: audit
        shell: bash
        continue-on-error: true
        run: |
          set -euo pipefail
          node dpro-lp-hero-typography-audit-v12.js

      - name: Build 5 visual contact sheets
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image,ImageOps,ImageDraw

          src=Path('qa/lp-hero-typography-v1-2/hero')
          dst=Path('qa/lp-hero-typography-v1-2/contact-sheets')
          dst.mkdir(parents=True,exist_ok=True)
          files=sorted(src.glob('*.png'))

          if len(files)!=50:
              raise SystemExit(f'BLOCKER expected 50 desktop hero screenshots, found {len(files)}')

          W,H,LABEL=520,350,30
          COLS,ROWS=2,5

          for group in range(5):
              canvas=Image.new('RGB',(COLS*W,ROWS*(H+LABEL)),'white')
              draw=ImageDraw.Draw(canvas)
              batch=files[group*10:(group+1)*10]
              for i,p in enumerate(batch):
                  im=Image.open(p).convert('RGB')
                  im=ImageOps.fit(
                      im,(W,H),
                      method=Image.Resampling.LANCZOS,
                      centering=(0.5,0.0)
                  )
                  x=(i%COLS)*W
                  y=(i//COLS)*(H+LABEL)
                  canvas.paste(im,(x,y))
                  draw.rectangle([x,y+H,x+W,y+H+LABEL],fill='white')
                  draw.text((x+8,y+H+7),p.stem,fill='black')
              canvas.save(
                  dst/f'LP_HERO_V12_CONTACT_{group+1}.jpg',
                  quality=80,
                  optimize=True
              )
          print('PASS: 5 contact sheets generated from all 50 LPs')
          PY

      - name: Commit only if V1.2 semantic gate passes
        if: steps.audit.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          rm -f dpro-lp-hero-typography-audit-v12.js
          rm -rf qa/lp-hero-typography-v1-2/hero
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lp-*.html
          git add qa/lp-hero-typography-v1-2/AUDIT.json
          git add qa/lp-hero-typography-v1-2/SUMMARY.md
          git add qa/lp-hero-typography-v1-2/contact-sheets/*.jpg
          git rm --ignore-unmatch ".github/workflows/dpro-lp-hero-typography-normalize-v1-2.yml"
          git commit -m "Finalize LP hero Japanese typography V1.2"
          git push origin HEAD:main

      - name: Publish V1.2 diagnostics only if residuals remain
        if: steps.audit.outcome != 'success'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/v12diag
          cp qa/lp-hero-typography-v1-2/AUDIT.json /tmp/v12diag/AUDIT.json
          cp qa/lp-hero-typography-v1-2/SUMMARY.md /tmp/v12diag/SUMMARY.md
          cp -r qa/lp-hero-typography-v1-2/contact-sheets /tmp/v12diag/contact-sheets

          git restore lp-*.html
          rm -f dpro-lp-hero-typography-audit-v12.js
          rm -rf qa/lp-hero-typography-v1-2

          mkdir -p qa/lp-hero-typography-v1-2-diagnostic
          cp /tmp/v12diag/AUDIT.json qa/lp-hero-typography-v1-2-diagnostic/AUDIT.json
          cp /tmp/v12diag/SUMMARY.md qa/lp-hero-typography-v1-2-diagnostic/SUMMARY.md
          cp -r /tmp/v12diag/contact-sheets qa/lp-hero-typography-v1-2-diagnostic/contact-sheets

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add qa/lp-hero-typography-v1-2-diagnostic
          git rm --ignore-unmatch ".github/workflows/dpro-lp-hero-typography-normalize-v1-2.yml"
          git commit -m "Publish LP hero typography V1.2 diagnostics"
          git push origin HEAD:main

      - name: Fail visibly if V1.2 still has residuals
        if: steps.audit.outcome != 'success'
        shell: bash
        run: |
          echo "BLOCKER: V1.2 residuals remain. Exact diagnostics and 5 visual contact sheets were published for CENTRAL inspection."
          exit 1
