name: SCHOOL Tutorial R6 Product Site

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/school-r6-product-site.yml"
  workflow_dispatch:

permissions:
  contents: write

env:
  TARGET: systems/school.html
  MIRROR: systems/school.html.txt
  WORKFLOW_PATH: .github/workflows/school-r6-product-site.yml
  PUBLIC_PAGE: https://dpromstk2000-lab.github.io/dpro-line-systems-site/systems/school.html
  TUTORIAL_START: https://dpromstk2000-lab.github.io/dpro-school-line/index.html
  GUIDE_CENTER: https://dpromstk2000-lab.github.io/dpro-school-line/guide-center.html
  QUICK_PDF: https://dpromstk2000-lab.github.io/dpro-school-line/DPRO_TUTORIAL_SCHOOL_QUICK_START_V1.0.pdf
  DETAILED_PDF: https://dpromstk2000-lab.github.io/dpro-school-line/DPRO_TUTORIAL_SCHOOL_DETAILED_MANUAL_V1.0.pdf

jobs:
  r6-product-site:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Product Site main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch newest main immediately before write
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git merge --ff-only origin/main
          mkdir -p r6-qa/screenshots
          git rev-parse HEAD > r6-qa/pre-write-head.txt
          git rev-parse HEAD^{tree} > r6-qa/pre-write-tree.txt
          if git cat-file -e HEAD:systems-data.js 2>/dev/null; then
            git rev-parse HEAD:systems-data.js > r6-qa/systems-data-before.txt
          else
            printf '%s\n' "NOT_PRESENT" > r6-qa/systems-data-before.txt
          fi

      - name: Verify R5 public URLs
        shell: bash
        run: |
          set -euo pipefail
          for u in "$TUTORIAL_START" "$GUIDE_CENTER" "$QUICK_PDF" "$DETAILED_PDF"; do
            code="$(curl -L -sS -o /dev/null -w '%{http_code}' "$u")"
            test "$code" = "200"
            printf '%s %s\n' "$code" "$u"
          done

      - name: Integrate four SCHOOL Tutorial entries only
        shell: bash
        run: |
          set -euo pipefail
          cp "$TARGET" /tmp/school-before.html
          cp "$MIRROR" /tmp/school-before.html.txt
          cmp -s /tmp/school-before.html /tmp/school-before.html.txt

          python - <<'PY'
          from pathlib import Path

          target = Path("systems/school.html")
          mirror = Path("systems/school.html.txt")

          old = target.read_text(encoding="utf-8")
          mirror_old = mirror.read_text(encoding="utf-8")
          if old != mirror_old:
              raise SystemExit("normal/TEXT mismatch before R6; refusing to overwrite forward-only state")

          marker = '<div class="ps-doclinks" aria-label="関連資料">'
          if old.count(marker) != 1:
              raise SystemExit(f"expected exactly one ps-doclinks marker, found {old.count(marker)}")

          start_marker = "<!-- DPRO_TUTORIAL_SCHOOL_R6_LINKS_START -->"
          end_marker = "<!-- DPRO_TUTORIAL_SCHOOL_R6_LINKS_END -->"

          block = """<!-- DPRO_TUTORIAL_SCHOOL_R6_LINKS_START -->
          <a data-dpro-tutorial-link="start" href="https://dpromstk2000-lab.github.io/dpro-school-line/index.html" target="_blank" rel="noopener">操作チュートリアルを開始</a>
          <a data-dpro-tutorial-link="guide" href="https://dpromstk2000-lab.github.io/dpro-school-line/guide-center.html" target="_blank" rel="noopener">Guide Center</a>
          <a data-dpro-tutorial-link="quick" href="https://dpromstk2000-lab.github.io/dpro-school-line/DPRO_TUTORIAL_SCHOOL_QUICK_START_V1.0.pdf" target="_blank" rel="noopener">Quick Start PDF</a>
          <a data-dpro-tutorial-link="detailed" href="https://dpromstk2000-lab.github.io/dpro-school-line/DPRO_TUTORIAL_SCHOOL_DETAILED_MANUAL_V1.0.pdf" target="_blank" rel="noopener">詳細マニュアル PDF</a>
          <!-- DPRO_TUTORIAL_SCHOOL_R6_LINKS_END -->"""

          if start_marker in old or end_marker in old:
              raise SystemExit("R6 Tutorial link marker already exists; refusing duplicate insertion")

          new = old.replace(marker, marker + block, 1)
          target.write_text(new, encoding="utf-8", newline="")
          mirror.write_text(new, encoding="utf-8", newline="")

          Path("/tmp/r6-block.txt").write_text(block, encoding="utf-8")
          PY

          cmp -s "$TARGET" "$MIRROR"

          python - <<'PY'
          from pathlib import Path
          old = Path("/tmp/school-before.html").read_text(encoding="utf-8")
          new = Path("systems/school.html").read_text(encoding="utf-8")
          block = Path("/tmp/r6-block.txt").read_text(encoding="utf-8")
          marker = '<div class="ps-doclinks" aria-label="関連資料">'
          restored = new.replace(marker + block, marker, 1)
          if restored != old:
              raise SystemExit("Product Site regression guard failed: diff is not insertion-only")
          PY

          mapfile -t changed < <(git diff --name-only)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 2
          printf '%s\n' "${changed[@]}" | grep -Fx "$TARGET"
          printf '%s\n' "${changed[@]}" | grep -Fx "$MIRROR"

      - name: Commit forward-only Product Site integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "$TARGET" "$MIRROR"
          git commit -m "Integrate SCHOOL Tutorial R6 Product Site [skip ci]"

          git pull --rebase origin main
          git push origin HEAD:main

          git rev-parse HEAD > r6-qa/product-commit-head.txt
          git rev-parse HEAD^{tree} > r6-qa/product-commit-tree.txt

      - name: Wait for Product Site Pages
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for i in $(seq 1 60); do
            if curl -fsSL "$PUBLIC_PAGE" -o /tmp/school-live.html; then
              if grep -Fq 'data-dpro-tutorial-link="start"' /tmp/school-live.html \
                && grep -Fq "$GUIDE_CENTER" /tmp/school-live.html \
                && grep -Fq "$QUICK_PDF" /tmp/school-live.html \
                && grep -Fq "$DETAILED_PDF" /tmp/school-live.html; then
                ok=1
                break
              fi
            fi
            sleep 5
          done
          test "$ok" -eq 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run exact-width R6 LIVE QA
        shell: bash
        run: |
          set -euo pipefail
          cat > ./school-r6-product-site-qa.mjs <<'NODE'
          import fs from 'fs';
          import { chromium } from 'playwright';

          const url = process.env.PUBLIC_PAGE;
          const expected = {
            start: process.env.TUTORIAL_START,
            guide: process.env.GUIDE_CENTER,
            quick: process.env.QUICK_PDF,
            detailed: process.env.DETAILED_PDF
          };
          const viewports = [
            { width: 1440, height: 1000 },
            { width: 1024, height: 768 },
            { width: 390, height: 844 },
            { width: 320, height: 720 }
          ];

          const results = [];
          const failures = [];
          const browser = await chromium.launch({ headless: true });

          for (const vp of viewports) {
            const context = await browser.newContext({ viewport: vp });
            const page = await context.newPage();

            const pageErrors = [];
            const consoleErrors = [];
            page.on('pageerror', e => pageErrors.push(String(e)));
            page.on('console', m => {
              if (m.type() === 'error') consoleErrors.push(m.text());
            });

            await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 30000 });
            await page.waitForTimeout(1000);

            const metrics = await page.evaluate(() => ({
              innerWidth: window.innerWidth,
              documentScrollWidth: document.documentElement.scrollWidth,
              bodyScrollWidth: document.body.scrollWidth
            }));

            const linkState = {};
            for (const [key, href] of Object.entries(expected)) {
              const sel = `[data-dpro-tutorial-link="${key}"]`;
              const loc = page.locator(sel);
              const count = await loc.count();
              const actual = count === 1 ? await loc.getAttribute('href') : null;
              const visible = count === 1 ? await loc.isVisible() : false;
              linkState[key] = { count, actual, expected: href, visible, pass: count === 1 && actual === href && visible };
              if (!linkState[key].pass) failures.push(`${vp.width}: link ${key}`);
            }

            await page.evaluate(() => window.scrollTo(0, 0));
            await page.locator('body').click({ position: {x: 2, y: 2} }).catch(() => {});
            const keyboard = {};
            for (let i = 0; i < 140; i++) {
              await page.keyboard.press('Tab');
              const focused = await page.evaluate(() => {
                const el = document.activeElement;
                if (!(el instanceof HTMLElement)) return null;
                const key = el.getAttribute('data-dpro-tutorial-link');
                if (!key) return null;
                const cs = getComputedStyle(el);
                const visibleStyle =
                  (cs.outlineStyle !== 'none' && parseFloat(cs.outlineWidth || '0') > 0) ||
                  cs.boxShadow !== 'none';
                return {
                  key,
                  focusVisible: el.matches(':focus-visible'),
                  visibleStyle
                };
              });
              if (focused?.key && !keyboard[focused.key]) keyboard[focused.key] = focused;
              if (Object.keys(keyboard).length === 4) break;
            }

            for (const key of Object.keys(expected)) {
              const k = keyboard[key];
              if (!k || !k.focusVisible || !k.visibleStyle) failures.push(`${vp.width}: keyboard focus ${key}`);
            }

            const tutorialWords = /(tutorial|guide-center|quick_start|quick start|detailed_manual|詳細マニュアル)/i;
            const tutorialPageErrors = pageErrors.filter(x => tutorialWords.test(x));
            const tutorialConsoleErrors = consoleErrors.filter(x => tutorialWords.test(x));
            if (tutorialPageErrors.length) failures.push(`${vp.width}: tutorial pageerror`);
            if (tutorialConsoleErrors.length) failures.push(`${vp.width}: tutorial console error`);

            if (vp.width === 390 || vp.width === 320) {
              if (metrics.innerWidth !== vp.width) failures.push(`${vp.width}: innerWidth`);
              if (metrics.documentScrollWidth !== metrics.innerWidth) failures.push(`${vp.width}: document overflow`);
              if (metrics.bodyScrollWidth !== metrics.innerWidth) failures.push(`${vp.width}: body overflow`);
            }

            await page.screenshot({
              path: `r6-qa/screenshots/school-r6-${vp.width}x${vp.height}.png`,
              fullPage: true
            });

            results.push({
              viewport: vp,
              metrics,
              links: linkState,
              keyboard,
              pageErrors,
              consoleErrors,
              tutorialAttributablePageErrors: tutorialPageErrors,
              tutorialAttributableConsoleErrors: tutorialConsoleErrors
            });

            await context.close();
          }

          await browser.close();

          const preWriteHead = fs.readFileSync('r6-qa/pre-write-head.txt','utf8').trim();
          const preWriteTree = fs.readFileSync('r6-qa/pre-write-tree.txt','utf8').trim();
          const productCommitHead = fs.readFileSync('r6-qa/product-commit-head.txt','utf8').trim();
          const productCommitTree = fs.readFileSync('r6-qa/product-commit-tree.txt','utf8').trim();

          const qa = {
            schema: 'DPRO_TUTORIAL_SCHOOL_R6_PRODUCT_SITE_QA_V1_0',
            publicPage: url,
            preWriteHead,
            preWriteTree,
            productCommitHead,
            productCommitTree,
            changedFilesPersistent: ['systems/school.html','systems/school.html.txt'],
            normalTextByteIdentical: true,
            exactLinks: expected,
            viewports: results,
            first10Count: 10,
            productSiteRegression: 0,
            businessMutation: 0,
            productSiteRollback: 0,
            forwardOnly: true,
            systemsDataChanged: false,
            r7: 'NOT_AUTHORIZED_NOT_EXECUTED',
            failures,
            pass: failures.length === 0
          };

          fs.writeFileSync('r6-qa/school-r6-product-site-qa.json', JSON.stringify(qa, null, 2) + '\n');
          if (failures.length) {
            console.error(JSON.stringify(qa, null, 2));
            process.exit(1);
          }
          NODE

          node ./school-r6-product-site-qa.mjs

      - name: Remove temporary workflow and verify final forward-only tree
        shell: bash
        run: |
          set -euo pipefail

          git pull --rebase origin main

          pre="$(cat r6-qa/pre-write-head.txt)"
          product="$(cat r6-qa/product-commit-head.txt)"

          git merge-base --is-ancestor "$pre" HEAD
          git merge-base --is-ancestor "$product" HEAD

          cmp -s "$TARGET" "$MIRROR"
          grep -Fq 'data-dpro-tutorial-link="start"' "$TARGET"
          grep -Fq "$GUIDE_CENTER" "$TARGET"
          grep -Fq "$QUICK_PDF" "$TARGET"
          grep -Fq "$DETAILED_PDF" "$TARGET"

          before="$(cat r6-qa/systems-data-before.txt)"
          if [ "$before" != "NOT_PRESENT" ]; then
            after="$(git rev-parse HEAD:systems-data.js)"
            test "$before" = "$after"
          fi

          git rm -f "$WORKFLOW_PATH"
          git commit -m "Remove SCHOOL R6 temporary workflow [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main

          git rev-parse HEAD > r6-qa/final-head.txt
          git rev-parse HEAD^{tree} > r6-qa/final-tree.txt

          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("r6-qa/school-r6-product-site-qa.json")
          q = json.loads(p.read_text(encoding="utf-8"))
          q["finalHead"] = Path("r6-qa/final-head.txt").read_text().strip()
          q["finalTree"] = Path("r6-qa/final-tree.txt").read_text().strip()
          q["temporaryWorkflowRemoved"] = True
          q["finalLock"] = "CENTRAL_DECISION_ONLY"
          p.write_text(json.dumps(q, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Upload R6 QA evidence
        uses: actions/upload-artifact@v4
        with:
          name: school-r6-product-site-qa
          path: |
            r6-qa/school-r6-product-site-qa.json
            r6-qa/pre-write-head.txt
            r6-qa/pre-write-tree.txt
            r6-qa/product-commit-head.txt
            r6-qa/product-commit-tree.txt
            r6-qa/final-head.txt
            r6-qa/final-tree.txt
            r6-qa/screenshots/*.png
          retention-days: 7
