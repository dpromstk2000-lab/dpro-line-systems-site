name: DPRO CHAT B Medical Product Copy Final

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dpro-chat-b-${{ github.repository }}
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Repository guard
        shell: bash
        run: |
          if [ "$GITHUB_REPOSITORY" != "dpromstk2000-lab/dpro-line-systems-site" ]; then
            echo "Wrong repository: expected dpromstk2000-lab/dpro-line-systems-site, got $GITHUB_REPOSITORY" >&2
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Finalize MEDICAL Product customer-facing copy
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path("systems/medical.html")
          if not p.exists():
              raise SystemExit("systems/medical.html not found")

          s = p.read_text(encoding="utf-8")
          before = s

          # Preserve critical runtime hook before any edit.
          runtime_hook = 'data-tutorial-r6="MEDICAL-R6-V1.0-20260830"'
          if runtime_hook not in s:
              raise SystemExit("MEDICAL R6 runtime hook missing before patch")

          replacements = [
              ("PRODUCT SITE / DPRO MEDICAL", "医療機関向け製品紹介"),
              ("30 SECOND LIVE EXPERIENCE", "30秒体験ガイド"),
              ("WHY DPRO MEDICAL", "DPRO MEDICALの特長"),
              ("PATIENT JOURNEY", "来院前から来院後まで"),
              ("LIVE DEMO / SALES ROUTE", "公開デモ"),
              ("5 CONNECTED SURFACES", "5つの連携画面"),
              ("6 MEDICAL 診療パターンS", "6つの診療パターン"),
              ("DESIGN & SECURITY", "設計と安全な運用"),
              ("Feature Flag + 診療パターン", "必要な機能を医院ごとに設定"),
              ("Server-side Security", "認証と権限管理"),
              ("PUBLIC DEMO", "公開デモ"),
              ("REAL CUSTOMER LIVE", "実医院での運用"),
              ("LIVE DEMO", "公開デモ"),
              ("公開LIVE DEMO", "公開デモ"),
              ("公開DEMO", "公開デモ"),
              ("DPRO MEDICAL LIVE DEMO", "DPRO MEDICAL 公開デモ"),
              ("GO LIVE", "運用開始"),
              ("Cloudflare Binding", "外部接続設定"),
              ("Supabase", "データ環境"),
              ("Worker", "接続処理"),
              ("LINE / LIFF", "LINE連携"),
              ("本番domain", "公開URL"),
              ("実URL E2E", "実際のURLと一連の操作"),
              ("tenant / clinic設定", "医院情報・運用設定"),
              ("tenant / clinic", "医院情報"),
              ("tenant・clinic・role・patient", "医院・役割・患者ごとの利用範囲"),
              ("本番DB書込み", "本番環境のデータ更新"),
              ("秘密鍵", "本番用の機密情報"),
              ("診療診療パターン", "診療パターン"),
              ("CORE", "共通基盤"),
          ]
          for old, new in replacements:
              s = s.replace(old, new)

          # Smooth wording after terminology replacement.
          s = s.replace("同じ共通基盤のルール", "共通基盤のルール")
          s = s.replace("別共通基盤", "別の基盤")
          s = s.replace(
              "実医院受注後に、医院情報、スタッフ、データ環境、外部接続設定、接続処理、LINE連携、公開URL、実際のURLと一連の操作、実端末を個別に検証して運用開始します。",
              "実医院受注後に、医院情報、スタッフ権限、LINE連携、実際のURLと端末を確認してから運用を開始します。"
          )
          s = s.replace(
              "患者認証とスタッフ認証を分離し、医院・役割・患者ごとの利用範囲をサーバー側で解決・検証する設計です。",
              "患者向けとスタッフ向けの認証を分け、役割に応じて利用できる画面と情報を適切に制御します。"
          )
          s = s.replace(
              "営業用の架空環境です。実在患者情報、本番環境のデータ更新、本番用の機密情報を使用しません。完成した公開デモは「実顧客本番稼働」を意味しません。",
              "架空の患者・医院情報を使った体験環境です。実在患者情報や本番環境のデータは使用しません。"
          )

          # Customer-facing labels for role cards.
          s = s.replace("<small>CLINIC ADMIN</small>", "<small>医院管理</small>")
          s = s.replace("<small>PUBLIC HP</small>", "<small>医院HP</small>")

          for forbidden in [
              "PRODUCT SITE",
              "CORE",
              "Feature Flag",
              "Server-side Security",
              "SALES ROUTE",
              "PUBLIC DEMO",
              "REAL CUSTOMER LIVE",
              "LIVE DEMO",
              "公開DEMO",
              "Supabase",
              "Cloudflare",
              "Worker",
              "LIFF",
              "tenant / clinic",
              "tenant・clinic",
              "GO LIVE",
          ]:
              if forbidden in s:
                  raise SystemExit(f"customer-facing/internal token remains: {forbidden}")

          for required in [
              "医療機関向け製品紹介",
              "DPRO MEDICALの特長",
              "公開デモ",
              "5つの連携画面",
              "6つの診療パターン",
              "設計と安全な運用",
              "必要な機能を医院ごとに設定",
              "認証と権限管理",
              "共通基盤",
          ]:
              if required not in s:
                  raise SystemExit(f"expected customer-facing wording missing: {required}")

          # Runtime and destinations must survive.
          if runtime_hook not in s:
              raise SystemExit("MEDICAL R6 runtime hook lost after patch")

          required_urls = [
              "https://dpromstk2000-lab.github.io/dpro-medical-standard/medical-public-demo.html",
              "https://dpro-shop.com/systems/medical",
              "../flyer-medical.html",
              "../systems.html",
          ]
          for url in required_urls:
              if url not in s:
                  raise SystemExit(f"required MEDICAL URL missing after patch: {url}")

          if s != before:
              p.write_text(s, encoding="utf-8")

          print("MEDICAL PRODUCT CUSTOMER COPY FINAL:", "CHANGED" if s != before else "ALREADY_OK")
          PY

      - name: Static customer copy and runtime QA
        shell: bash
        run: |
          for token in 'PRODUCT SITE' 'CORE' 'Feature Flag' 'Server-side Security' 'SALES ROUTE' 'PUBLIC DEMO' 'REAL CUSTOMER LIVE' 'LIVE DEMO' 'Supabase' 'Cloudflare' 'Worker' 'LIFF' 'GO LIVE'; do
            if grep -q "$token" systems/medical.html; then
              echo "Forbidden token remains: $token" >&2
              exit 1
            fi
          done
          grep -q 'data-tutorial-r6="MEDICAL-R6-V1.0-20260830"' systems/medical.html
          grep -q '医療機関向け製品紹介' systems/medical.html
          grep -q '必要な機能を医院ごとに設定' systems/medical.html
          grep -q '認証と権限管理' systems/medical.html
          grep -q 'https://dpromstk2000-lab.github.io/dpro-medical-standard/medical-public-demo.html' systems/medical.html
          grep -q 'https://dpro-shop.com/systems/medical' systems/medical.html
          echo 'MEDICAL PRODUCT customer copy/runtime QA: PASS'

      - name: Commit forward-only fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm --ignore-unmatch ".github/workflows/dpro-chat-b-medical-product-copy-final.yml"
          git add "systems/medical.html"
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Finalize CHAT B MEDICAL product customer copy"
          git push
