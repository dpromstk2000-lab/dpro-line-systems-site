          WF=".github/workflows/STEP-GYOSEI-TUTORIAL-R6-CENTRAL-FIX.yml"

          git fetch origin main
          git merge --ff-only origin/main
          git merge-base --is-ancestor "$R6_V11_POST_HEAD" HEAD

          git config user.name "dpro-tutorial-qa-bot"
          git config user.email "actions@users.noreply.github.com"

          test -f "$WF"
          git rm -f "$WF"
          git commit -m "Complete GYOSEI Batch09 R6 CENTRAL contract QA [skip ci]"
