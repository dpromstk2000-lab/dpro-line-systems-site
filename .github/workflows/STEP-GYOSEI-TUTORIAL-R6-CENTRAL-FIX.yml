name: DPRO GYOSEI Batch09 Tutorial R6 CENTRAL Contract Fix FINAL LIVE QA
# GYOSEI-R6-CENTRAL-CONTRACT-FIX-V1.1-20260829

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dpro-gyosei-tutorial-r6-central-fix
  cancel-in-progress: false

jobs:
  r6-central-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout newest Product Site main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch newest main and lock current R6 forward-only
        shell: bash
        run: |
          set -euo pipefail
          R6_RUN1_POST="e911894acee17d9744ce5b6068c8918f33334931"
          R6_RUN1_CLEANUP="06ae05b24ce30e04637b39867c92cb5f1f484bf8"

          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            git merge --ff-only origin/main
          fi

          git merge-base --is-ancestor "$R6_RUN1_POST" HEAD
          git merge-base --is-ancestor "$R6_RUN1_CLEANUP" HEAD

          PRE_HEAD="$(git rev-parse HEAD)"
          PRE_TREE="$(git rev-parse HEAD^{tree})"
          HTML_BLOB="$(git hash-object systems/gyosei.html)"
          MIRROR_BLOB="$(git hash-object systems/gyosei.html.txt)"

          test "$HTML_BLOB" = "$MIRROR_BLOB"
          cmp -s systems/gyosei.html systems/gyosei.html.txt

          grep -Fq '<!-- GYOSEI-R6-TUTORIAL-RESOURCES-V1.0-20260829 -->' systems/gyosei.html
          grep -Fq 'data-r6-resource="public-demo"' systems/gyosei.html
          grep -Fq 'data-r6-resource="tutorial" href="https://dpromstk2000-lab.github.io/dpro-gyosei-permit-line/tutorial.html"' systems/gyosei.html

          cp systems/gyosei.html "$RUNNER_TEMP/gyosei-before-v11.html"

          printf '%s\n' "$PRE_HEAD" > "$RUNNER_TEMP/pre-head-v11.txt"
          printf '%s\n' "$PRE_TREE" > "$RUNNER_TEMP/pre-tree-v11.txt"

          echo "R6_V11_PRE_HEAD=$PRE_HEAD" >> "$GITHUB_ENV"
          echo "R6_V11_PRE_TREE=$PRE_TREE" >> "$GITHUB_ENV"

      - name: Verify exact four CENTRAL resources before write
        shell: bash
        run: |
          set -euo pipefail
          urls=(
            'https://dpromstk2000-lab.github.io/dpro-gyosei-permit-line/tutorial.html?mode=start'
            'https://dpromstk2000-lab.github.io/dpro-gyosei-permit-line/demo-guide.html'
            'https://dpromstk2000-lab.github.io/dpro-gyosei-permit-line/manuals/DPRO_TUTORIAL_GYOSEI_QUICK_START_V1.0.pdf'
            'https://dpromstk2000-lab.github.io/dpro-gyosei-permit-line/manuals/DPRO_TUTORIAL_GYOSEI_DETAILED_MANUAL_V1.0.pdf'
          )
          for i in "${!urls[@]}"; do
            out="$RUNNER_TEMP/resource-$i"
            code="$(curl -L --retry 6 --retry-delay 3 --retry-all-errors -sS -o "$out" -w '%{http_code}' "${urls[$i]}")"
            test "$code" = "200"
            test -s "$out"
          done

          head -c 5 "$RUNNER_TEMP/resource-2" | grep -Fq '%PDF-'
          head -c 5 "$RUNNER_TEMP/resource-3" | grep -Fq '%PDF-'

          curl -L --retry 6 --retry-delay 3 --retry-all-errors -fsS \
            'https://dpromstk2000-lab.github.io/dpro-gyosei-permit-line/manuals/R5_MANUAL_QA_EVIDENCE.txt' \
            -o "$RUNNER_TEMP/r5-evidence.txt"

          grep -Fq 'R5_AUTOMATED_QA=PASS' "$RUNNER_TEMP/r5-evidence.txt"
          grep -Fq 'FIRST10_COUNT=10' "$RUNNER_TEMP/r5-evidence.txt"
          grep -Fq 'GUIDE_COUNT=10' "$RUNNER_TEMP/r5-evidence.txt"
          grep -Fq 'BUSINESS_MUTATION=0' "$RUNNER_TEMP/r5-evidence.txt"

      - name: Replace R6 block with exact four CENTRAL resources
        shell: python
        run: |
          from pathlib import Path

          html=Path("systems/gyosei.html")
          mirror=Path("systems/gyosei.html.txt")
          before=html.read_bytes()
          assert before == mirror.read_bytes()
          s=before.decode("utf-8")

          start="<!-- GYOSEI-R6-TUTORIAL-RESOURCES-V1.0-20260829 -->"
          end="<!-- /GYOSEI-R6-TUTORIAL-RESOURCES-V1.0-20260829 -->"
          assert s.count(start)==1
          assert s.count(end)==1

          block='''<!-- GYOSEI-R6-TUTORIAL-RESOURCES-V1.0-20260829 -->
          <section id="tutorial-manuals" class="dpro-section ps-section-soft r6-gyosei-resources" aria-labelledby="tutorial-manuals-title">
            <style>
              .r6-gyosei-resources .r6-resource-head{display:flex;flex-wrap:wrap;align-items:center;gap:.7rem}
              .r6-gyosei-resources .r6-demo-badge{display:inline-flex;align-items:center;min-height:30px;padding:.22rem .7rem;border-radius:999px;background:var(--dpro-green);color:#fff;font-size:.78rem;font-weight:900;letter-spacing:.05em}
              .r6-gyosei-resources .r6-resource-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1rem;margin-top:1rem}
              .r6-gyosei-resources .r6-resource-card{display:flex;flex-direction:column;min-width:0}
              .r6-gyosei-resources .r6-resource-card p{flex:1}
              .r6-gyosei-resources [data-r6-resource]:focus-visible{outline:3px solid #0b7a55;outline-offset:4px;box-shadow:0 0 0 4px rgba(11,122,85,.16)}
              .r6-gyosei-resources .r6-resource-note{margin:1rem 0 0;padding:1rem 1.1rem;border-left:4px solid var(--dpro-green);background:#fff;color:#395149}
              @media(max-width:640px){.r6-gyosei-resources .r6-resource-grid{grid-template-columns:1fr}.r6-gyosei-resources .ps-actions{display:block}.r6-gyosei-resources .ps-actions .dpro-button{width:100%}}
            </style>
            <div class="dpro-container">
              <div class="ps-section-heading">
                <div class="r6-resource-head">
                  <p class="ps-kicker">TUTORIAL &amp; MANUAL</p>
                  <span class="r6-demo-badge" data-r6-demo-label>Demo</span>
                </div>
                <h2 id="tutorial-manuals-title">操作ガイドと印刷マニュアル</h2>
                <p>First10全10項目、Guide Center、A4印刷マニュアルをここから確認できます。Tutorialは案内・移動・ハイライト専用で、相談・予約・案件・書類・タスク・設定などの業務データを変更しません。</p>
              </div>

              <div class="r6-resource-grid" data-r6-resource-grid>
                <article class="dpro-card ps-card-copy r6-resource-card" data-r6-card="tutorial-start">
                  <h3>Tutorial Start</h3>
                  <p>公開TutorialをSTEP 1から開始し、First10を画面ハイライト付きで確認します。</p>
                  <div class="ps-actions"><a class="dpro-button dpro-button--primary" data-r6-resource="tutorial-start" href="https://dpromstk2000-lab.github.io/dpro-gyosei-permit-line/tutorial.html?mode=start" target="_blank" rel="noopener">Tutorial Start</a></div>
                </article>

                <article class="dpro-card ps-card-copy r6-resource-card" data-r6-card="guide-center">
                  <h3>Guide Center</h3>
                  <p>First10全10項目とStart / Resume / Replayを同じTutorial状態で確認できます。</p>
                  <div class="ps-actions"><a class="dpro-button dpro-button--secondary" data-r6-resource="guide-center" href="https://dpromstk2000-lab.github.io/dpro-gyosei-permit-line/demo-guide.html" target="_blank" rel="noopener">Guide Centerを開く</a></div>
                </article>

                <article class="dpro-card ps-card-copy r6-resource-card" data-r6-card="quick-start-pdf">
                  <h3>Quick Start PDF</h3>
                  <p>A4縦1ページ。初回説明、Start / Resume / Replay、ドラッグ、キーボード、安全境界を短く確認できます。</p>
                  <div class="ps-actions"><a class="dpro-button dpro-button--secondary" data-r6-resource="quick-start-pdf" href="https://dpromstk2000-lab.github.io/dpro-gyosei-permit-line/manuals/DPRO_TUTORIAL_GYOSEI_QUICK_START_V1.0.pdf" target="_blank" rel="noopener">Quick Start PDF</a></div>
                </article>

                <article class="dpro-card ps-card-copy r6-resource-card" data-r6-card="detailed-manual-pdf">
                  <h3>Detailed Manual PDF</h3>
                  <p>A4縦6ページ。First10全10ステップ、Guide Center、Resume / Replay、操作方法、安全境界をまとめています。</p>
                  <div class="ps-actions"><a class="dpro-button dpro-button--secondary" data-r6-resource="detailed-manual-pdf" href="https://dpromstk2000-lab.github.io/dpro-gyosei-permit-line/manuals/DPRO_TUTORIAL_GYOSEI_DETAILED_MANUAL_V1.0.pdf" target="_blank" rel="noopener">Detailed Manual PDF</a></div>
                </article>
              </div>

              <p class="r6-resource-note">案内専用 / business mutation 0。Tutorial / Guide Centerは相談送信、予約登録、案件・書類・タスク更新、設定保存、DEMO PREPAREなどの業務操作を自動実行しません。</p>
            </div>
          </section>
          <!-- /GYOSEI-R6-TUTORIAL-RESOURCES-V1.0-20260829 -->'''

          a=s.index(start)
          b=s.index(end,a)+len(end)
          after=s[:a]+block+s[b:]
          html.write_bytes(after.encode("utf-8"))
          mirror.write_bytes(after.encode("utf-8"))

      - name: Static CENTRAL contract and target scope QA
        shell: python
        run: |
          import os, subprocess
          from pathlib import Path

          h=Path("systems/gyosei.html").read_bytes()
          t=Path("systems/gyosei.html.txt").read_bytes()
          assert h==t
          s=h.decode("utf-8")

          assert s.count('data-r6-resource="')==4
          assert s.count('data-r6-card="')==4
          assert 'data-r6-resource="public-demo"' not in s
          assert 'data-r6-resource="tutorial"' not in s

          exact={
            "tutorial-start":"https://dpromstk2000-lab.github.io/dpro-gyosei-permit-line/tutorial.html?mode=start",
            "guide-center":"https://dpromstk2000-lab.github.io/dpro-gyosei-permit-line/demo-guide.html",
            "quick-start-pdf":"https://dpromstk2000-lab.github.io/dpro-gyosei-permit-line/manuals/DPRO_TUTORIAL_GYOSEI_QUICK_START_V1.0.pdf",
            "detailed-manual-pdf":"https://dpromstk2000-lab.github.io/dpro-gyosei-permit-line/manuals/DPRO_TUTORIAL_GYOSEI_DETAILED_MANUAL_V1.0.pdf",
          }
          for k,u in exact.items():
            assert f'data-r6-resource="{k}" href="{u}"' in s

          changed=subprocess.check_output(["git","diff","--name-only"],text=True).splitlines()
          assert set(changed)=={"systems/gyosei.html","systems/gyosei.html.txt"},changed

          before=(Path(os.environ["RUNNER_TEMP"])/"gyosei-before-v11.html").read_text(encoding="utf-8")
          start="<!-- GYOSEI-R6-TUTORIAL-RESOURCES-V1.0-20260829 -->"
          end="<!-- /GYOSEI-R6-TUTORIAL-RESOURCES-V1.0-20260829 -->"
          def strip_block(x):
            a=x.index(start)
            b=x.index(end,a)+len(end)
            return x[:a]+x[b:]
          assert strip_block(s)==strip_block(before)

          assert "5,500円" in s
          assert 'href="https://lin.ee/YxJGXV6D"' in s
          assert 'id="live"' in s
          assert 'id="price"' in s
          assert "dpro-gyosei-permit-line/index.html?demo=1" in s
          assert 'data-system-code="GYOSEI"' in s

          print("EXACT_FOUR_RESOURCES=PASS")
          print("HTML_TEXT_BYTE_IDENTICAL=PASS")
          print("TARGET_SCOPE_ONLY=PASS")
          print("OUTSIDE_R6_BLOCK_BYTE_PRESERVED=PASS")

      - name: Commit CENTRAL contract fix forward-only
        shell: bash
        run: |
          set -euo pipefail
          PRE_HEAD="$R6_V11_PRE_HEAD"

          git fetch origin main
          test "$(git rev-parse origin/main)" = "$PRE_HEAD"

          git config user.name "dpro-tutorial-qa-bot"
          git config user.email "actions@users.noreply.github.com"

          git add systems/gyosei.html systems/gyosei.html.txt
          mapfile -t changed < <(git diff --cached --name-only | sort)
          test "${#changed[@]}" -eq 2
          test "${changed[0]}" = "systems/gyosei.html"
          test "${changed[1]}" = "systems/gyosei.html.txt"

          git commit -m "GYOSEI R6 align Product Site with CENTRAL exact-four contract [skip ci]"
          POST_HEAD="$(git rev-parse HEAD)"
          POST_TREE="$(git rev-parse HEAD^{tree})"
          git merge-base --is-ancestor "$PRE_HEAD" "$POST_HEAD"
          git push origin HEAD:main

          echo "R6_V11_POST_HEAD=$POST_HEAD" >> "$GITHUB_ENV"
          echo "R6_V11_POST_TREE=$POST_TREE" >> "$GITHUB_ENV"

      - name: Install Playwright
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Wait for corrected Product Site deployment
        shell: bash
        run: |
          set -euo pipefail
          PAGE='https://dpromstk2000-lab.github.io/dpro-line-systems-site/systems/gyosei.html'
          tmp="$(mktemp)"
          trap 'rm -f "$tmp"' EXIT
          ok=0
          for i in $(seq 1 72); do
            code="$(curl -L -sS -o "$tmp" -w '%{http_code}' "$PAGE?r6v11=${R6_V11_POST_HEAD}-$i" || true)"
            if [ "$code" = "200" ] \
               && grep -Fq 'data-r6-resource="tutorial-start"' "$tmp" \
               && ! grep -Fq 'data-r6-resource="public-demo"' "$tmp"; then
              ok=1
              echo "R6 V1.1 deployed on attempt $i"
              break
            fi
            sleep 5
          done
          test "$ok" = "1"

      - name: CENTRAL exact-four four-width LIVE QA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/gyosei-r6-v11-qa"
          cat > "$RUNNER_TEMP/gyosei-r6-v11-qa/r6_v11_qa.py" <<'PY'
          import os, json, itertools
          from pathlib import Path
          from playwright.sync_api import sync_playwright

          PAGE="https://dpromstk2000-lab.github.io/dpro-line-systems-site/systems/gyosei.html"
          RES={
            "tutorial-start":"https://dpromstk2000-lab.github.io/dpro-gyosei-permit-line/tutorial.html?mode=start",
            "guide-center":"https://dpromstk2000-lab.github.io/dpro-gyosei-permit-line/demo-guide.html",
            "quick-start-pdf":"https://dpromstk2000-lab.github.io/dpro-gyosei-permit-line/manuals/DPRO_TUTORIAL_GYOSEI_QUICK_START_V1.0.pdf",
            "detailed-manual-pdf":"https://dpromstk2000-lab.github.io/dpro-gyosei-permit-line/manuals/DPRO_TUTORIAL_GYOSEI_DETAILED_MANUAL_V1.0.pdf",
          }
          VIEWPORTS=[
            ("pc1440",1440,1000),
            ("tablet1024",1024,768),
            ("mobile390",390,844),
            ("mobile320",320,720),
          ]
          OUT=Path(os.environ["RUNNER_TEMP"])/"gyosei-r6-v11-qa"
          SHOTS=OUT/"screenshots"
          SHOTS.mkdir(parents=True,exist_ok=True)

          report={
            "system":"GYOSEI",
            "batch":"09",
            "stage":"R6",
            "contractFix":"V1.1",
            "productPage":PAGE,
            "preHead":os.environ["R6_V11_PRE_HEAD"],
            "preTree":os.environ["R6_V11_PRE_TREE"],
            "postHead":os.environ["R6_V11_POST_HEAD"],
            "postTree":os.environ["R6_V11_POST_TREE"],
            "r5Pass":True,
            "first10Count":10,
            "guideCount":10,
            "resources":RES,
            "resourceReachability":{},
            "viewports":[],
            "crossSystemEdit":0,
            "productRegression":0,
            "productSiteRollback":0,
            "businessMutation":0,
            "unsafeWriteRequestCount":0,
            "forwardOnly":"PASS",
            "ok":False
          }

          with sync_playwright() as pw:
            browser=pw.chromium.launch(headless=True)
            req=pw.request.new_context(extra_http_headers={"Cache-Control":"no-cache"})
            for k,u in RES.items():
              r=req.get(u,timeout=30000)
              body=r.body()
              is_pdf=k.endswith("-pdf")
              magic=(not is_pdf) or body.startswith(b"%PDF-")
              ok=r.status==200 and len(body)>0 and magic
              report["resourceReachability"][k]={
                "status":r.status,
                "bytes":len(body),
                "pdfMagic":magic if is_pdf else None,
                "ok":ok
              }
              assert ok,(k,r.status,len(body))
            req.dispose()

            for name,w,h in VIEWPORTS:
              ctx=browser.new_context(viewport={"width":w,"height":h})
              page=ctx.new_page()
              unsafe=[]
              perr=[]
              cerr=[]
              page.on("request",lambda r,a=unsafe: a.append({"method":r.method,"url":r.url}) if r.method not in ("GET","HEAD","OPTIONS") else None)
              page.on("pageerror",lambda e,a=perr: a.append(str(e)))
              page.on("console",lambda m,a=cerr: a.append(m.text) if m.type=="error" else None)

              resp=page.goto(f"{PAGE}?r6v11={report['postHead']}-{name}",wait_until="networkidle",timeout=45000)
              assert resp and resp.status==200

              section=page.locator("#tutorial-manuals")
              assert section.count()==1 and section.is_visible()
              assert page.locator("[data-r6-resource]").count()==4
              assert page.locator('[data-r6-resource="public-demo"]').count()==0

              metrics=page.evaluate('''()=>({
                innerWidth: window.innerWidth,
                documentElementScrollWidth: document.documentElement.scrollWidth,
                bodyScrollWidth: document.body.scrollWidth
              })''')
              positive_overflow=(
                metrics["documentElementScrollWidth"] > metrics["innerWidth"] + 1
                or metrics["bodyScrollWidth"] > metrics["innerWidth"] + 1
              )
              assert not positive_overflow,(name,metrics)

              links={}
              focus_visible={}
              clipped=[]
              for k,u in RES.items():
                loc=page.locator(f'[data-r6-resource="{k}"]')
                assert loc.count()==1 and loc.is_visible(),(name,k)
                assert loc.get_attribute("href")==u,(name,k,loc.get_attribute("href"),u)

                loc.focus()
                page.keyboard.press("Shift+Tab")
                page.keyboard.press("Tab")
                style=page.evaluate('''el=>{
                  const cs=getComputedStyle(el);
                  return {
                    active: document.activeElement===el,
                    focusVisible: el.matches(":focus-visible"),
                    outlineStyle: cs.outlineStyle,
                    outlineWidth: cs.outlineWidth,
                    boxShadow: cs.boxShadow
                  };
                }''',loc.element_handle())
                visible_focus=style["active"] and style["focusVisible"] and (
                  (style["outlineStyle"]!="none" and style["outlineWidth"]!="0px")
                  or style["boxShadow"]!="none"
                )
                assert visible_focus,(name,k,style)
                focus_visible[k]=style

                b=loc.bounding_box()
                assert b
                if b["x"] < -1 or b["x"]+b["width"] > w+1:
                  clipped.append(k)
                links[k]={"href":u,"visible":True}

              assert not clipped,(name,clipped)

              cards=page.locator("[data-r6-card]")
              assert cards.count()==4
              rects=[cards.nth(i).bounding_box() for i in range(cards.count())]
              overlap=[]
              for a,b in itertools.combinations(range(4),2):
                r1,r2=rects[a],rects[b]
                ox=max(0,min(r1["x"]+r1["width"],r2["x"]+r2["width"])-max(r1["x"],r2["x"]))
                oy=max(0,min(r1["y"]+r1["height"],r2["y"]+r2["height"])-max(r1["y"],r2["y"]))
                if ox*oy>1:
                  overlap.append([a,b])
              assert not overlap,(name,overlap)

              body=page.locator("body").inner_text()
              regression={
                "priceText":"5,500円" in body,
                "line":page.locator('a[href="https://lin.ee/YxJGXV6D"]').count()>0,
                "live":page.locator("#live").count()==1,
                "priceSection":page.locator("#price").count()==1,
                "demoSource":page.locator('[data-src*="dpro-gyosei-permit-line/index.html?demo=1"]').count()>0,
                "systemCode":page.locator('body[data-system-code="GYOSEI"]').count()==1,
              }
              assert all(regression.values()),(name,regression)
              assert not unsafe,(name,unsafe)
              assert not perr,(name,perr)
              assert not cerr,(name,cerr)

              shot=SHOTS/f"{name}.png"
              page.screenshot(path=str(shot),full_page=True)

              report["viewports"].append({
                "name":name,
                "width":w,
                "height":h,
                "status":resp.status,
                "resourceCount":4,
                "links":links,
                "focusVisible":focus_visible,
                "metrics":metrics,
                "positiveHorizontalOverflow":False,
                "clipped":[],
                "overlapPairs":[],
                "regression":regression,
                "unsafeWriteRequests":[],
                "pageErrors":[],
                "consoleErrors":[],
                "screenshot":str(shot),
                "ok":True
              })
              ctx.close()
            browser.close()

          mobiles={v["name"]:v for v in report["viewports"] if v["name"] in ("mobile390","mobile320")}
          assert set(mobiles)=={"mobile390","mobile320"}
          for v in mobiles.values():
            assert {"innerWidth","documentElementScrollWidth","bodyScrollWidth"} <= set(v["metrics"])
            assert v["positiveHorizontalOverflow"] is False

          report["unsafeWriteRequestCount"]=sum(len(v["unsafeWriteRequests"]) for v in report["viewports"])
          report["ok"]=(
            len(report["resources"])==4
            and all(x["ok"] for x in report["resourceReachability"].values())
            and len(report["viewports"])==4
            and all(v["ok"] for v in report["viewports"])
            and report["crossSystemEdit"]==0
            and report["productRegression"]==0
            and report["productSiteRollback"]==0
            and report["businessMutation"]==0
            and report["unsafeWriteRequestCount"]==0
            and report["forwardOnly"]=="PASS"
          )
          assert report["ok"],report
          (OUT/"r6-live-qa-v11.json").write_text(
            json.dumps(report,ensure_ascii=False,indent=2)+"\n",
            encoding="utf-8"
          )
          print(json.dumps(report,ensure_ascii=False,indent=2))
          PY

          python "$RUNNER_TEMP/gyosei-r6-v11-qa/r6_v11_qa.py"

      - name: Verify forward-only exact target diff
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git merge-base --is-ancestor "$R6_V11_POST_HEAD" origin/main
          git merge-base --is-ancestor "$R6_V11_PRE_HEAD" "$R6_V11_POST_HEAD"

          mapfile -t changed < <(git diff --name-only "$R6_V11_PRE_HEAD" "$R6_V11_POST_HEAD" | sort)
          test "${#changed[@]}" -eq 2
          test "${changed[0]}" = "systems/gyosei.html"
          test "${changed[1]}" = "systems/gyosei.html.txt"

          cmp -s systems/gyosei.html systems/gyosei.html.txt
          echo "PRODUCT_SITE_ROLLBACK=0"
          echo "CROSS_SYSTEM_EDIT=0"
          echo "FORWARD_ONLY=PASS"

      - name: Upload corrected R6 evidence
