          path: ${{ runner.temp }}/gyosei-r6-v11-qa/
          if-no-files-found: error
          retention-days: 30

      - name: Enforce CENTRAL R6 FULL PASS
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path(os.environ["RUNNER_TEMP"])/"gyosei-r6-v11-qa"/"r6-live-qa-v11.json"
          r=json.loads(p.read_text(encoding="utf-8"))

          assert r["ok"] is True
          assert len(r["resources"])==4
          assert r["first10Count"]==10
          assert r["guideCount"]==10
          assert len(r["viewports"])==4
          assert all(v["resourceCount"]==4 for v in r["viewports"])
          assert all(v["positiveHorizontalOverflow"] is False for v in r["viewports"])

          for name in ("mobile390","mobile320"):
            v=next(x for x in r["viewports"] if x["name"]==name)
            assert v["metrics"]["innerWidth"]==v["width"]
            assert v["metrics"]["documentElementScrollWidth"]<=v["metrics"]["innerWidth"]+1
            assert v["metrics"]["bodyScrollWidth"]<=v["metrics"]["innerWidth"]+1

          assert r["crossSystemEdit"]==0
          assert r["productRegression"]==0
          assert r["productSiteRollback"]==0
          assert r["businessMutation"]==0
          assert r["unsafeWriteRequestCount"]==0
          assert r["forwardOnly"]=="PASS"
          print("CENTRAL_R6_FULL_PASS=TRUE")
          PY

      - name: Cleanup transient R6 V1.1 workflow
