name: DPRO Clinic Shuttle V1.2 Operation PDF Masterfix R2F

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/clinic-shuttle-v12-operation-pdf-masterfix-r2f.yml"
      - ".github/workflows/clinic-shuttle-v12-operation-pdf-masterfix-r2f.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dpro-clinic-shuttle-v12-operation-pdf-masterfix-r2f
  cancel-in-progress: false

jobs:
  operation-pdf-masterfix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout PRODUCT
        uses: actions/checkout@v4
        with:
          fetch-depth: 6

      - name: Guard PRODUCT parent and SYSTEM FINAL LOCK
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "6a04230ec526d3ea589ffc42a5e777a355e95e46" || {
            echo "PRODUCT drift before R2F"; exit 1;
          }
          SYSTEM_HEAD="$(git ls-remote https://github.com/dpromstk2000-lab/dpro-clinic-shuttle-line.git refs/heads/main | awk '{print $1}')"
          test "$SYSTEM_HEAD" = "3fc09f4b5c6781d6038dc280de5c58752ce60b51" || {
            echo "SYSTEM FINAL LOCK drift: $SYSTEM_HEAD"; exit 1;
          }

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PDF build and QA dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright pymupdf numpy opencv-python-headless zxing-cpp pillow "qrcode[pil]"
          python -m playwright install --with-deps chromium

      - name: Preserve runner
        run: cp .github/workflows/clinic-shuttle-v12-operation-pdf-masterfix-r2f.py /tmp/clinic-shuttle-v12-r2f.py

      - name: Rebuild Quick Start and Detailed Manual to V1.2 master
        run: python /tmp/clinic-shuttle-v12-r2f.py build

      - name: Commit operation PDF masterfix and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            assets/clinic-shuttle-next/quick-start.html \
            assets/clinic-shuttle-next/detailed-manual.html \
            assets/clinic-shuttle-next/qr/guide.png \
            assets/clinic-shuttle-next/qr/system-check.png \
            DPRO_TUTORIAL_CLINIC_SHUTTLE_QUICK_START_V1.0.pdf \
            DPRO_TUTORIAL_CLINIC_SHUTTLE_DETAILED_MANUAL_V1.0.pdf
          git rm -f \
            .github/workflows/clinic-shuttle-v12-operation-pdf-masterfix-r2f.yml \
            .github/workflows/clinic-shuttle-v12-operation-pdf-masterfix-r2f.py
          git commit -m "Bring clinic shuttle operation PDFs to V1.2 master"
          FINAL_HEAD="$(git rev-parse HEAD)"
          echo "FINAL_PRODUCT_HEAD=$FINAL_HEAD" >> "$GITHUB_ENV"
          git push origin main

      - name: Verify final public PDFs
        run: python /tmp/clinic-shuttle-v12-r2f.py publicqa

      - name: Upload R2F evidence
        uses: actions/upload-artifact@v4
        with:
          name: clinic-shuttle-v12-operation-pdf-masterfix-r2f-evidence
          path: release-evidence-v12-operation-pdf/
          if-no-files-found: error
          retention-days: 30
