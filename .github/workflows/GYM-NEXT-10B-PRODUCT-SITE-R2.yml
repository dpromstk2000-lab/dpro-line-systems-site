name: STEP GYM-NEXT-10B-PRODUCT-SITE-R2 - Fix Catalog Card Count

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/GYM-NEXT-10B-PRODUCT-SITE-R2.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: gym-next-10b-product-site-r2-main
  cancel-in-progress: false

env:
  STEP_NAME: GYM-NEXT-10B-PRODUCT-SITE-R2
  WORKFLOW_FILE: .github/workflows/GYM-NEXT-10B-PRODUCT-SITE-R2.yml
  STALE_WORKFLOW_FILE_R1: .github/workflows/GYM-NEXT-10B-PRODUCT-SITE.yml
  PRODUCT_PAGE: systems/gym.html
  CATALOG_PAGE: systems.html
  COMPLETION_DIR: dpro-next/gym
  BACKUP_TAG: backup-product-site-before-gym-next-10b-20260726
  PRODUCT_SITE_BASE: https://dpromstk2000-lab.github.io/dpro-line-systems-site
  GYM_BASE: https://dpromstk2000-lab.github.io/liff-gym-demo
  GYM_LEDGER_RAW: https://raw.githubusercontent.com/dpromstk2000-lab/liff-gym-demo/main/dpro-next/gym/next-ledger.yml
  PDF_URL: https://dpromstk2000-lab.github.io/liff-gym-demo/deliverables/gym-next-10/DPRO_GYM_NEXT_operation_experience_sheet_20260726.pdf
  PNG_URL: https://dpromstk2000-lab.github.io/liff-gym-demo/deliverables/gym-next-10/DPRO_GYM_NEXT_operation_experience_sheet_20260726.png
  SHEET_HTML_URL: https://dpromstk2000-lab.github.io/liff-gym-demo/deliverables/gym-next-10/operation-sheet.html
  QR_REPORT_URL: https://dpromstk2000-lab.github.io/liff-gym-demo/deliverables/gym-next-10/operation-sheet-qr-check.json
  EXPECTED_PDF_SHA256: d5b87f30eb95a3bf95401862eca0fc0e15051cea45726b9c6c9ab66f84a35ea6
  EXPECTED_PNG_SHA256: f18baf929b20752c93ade8e9ae16b3d898345468af2f7cc91224823e7c306694
  EXPECTED_GYM_PAGE_BLOB: 30f08030028419217fd50c83e3133d711e66582f
  EXPECTED_CATALOG_BLOB: c88de8319d2df1b589f0b9ef6b3bd0fc73aaef28

jobs:
  publish-and-complete:
    name: Update gym product page catalog and final completion record
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout product site with complete history
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Configure Git identity
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "DPRO NEXT Actions"
          git config user.email "actions@users.noreply.github.com"

      - name: Confirm safe product-site upload and source completion
        shell: bash
        run: |
          set -euo pipefail
          test -f "${WORKFLOW_FILE}"
          test -f "${STALE_WORKFLOW_FILE_R1}"
          test -f "${PRODUCT_PAGE}"
          test -f "${CATALOG_PAGE}"

          [[ "${GITHUB_REPOSITORY}" == "dpromstk2000-lab/dpro-line-systems-site" ]] || {
            echo "::error::This YML must run in dpromstk2000-lab/dpro-line-systems-site."
            exit 1
          }

          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            UPLOAD_PARENT="$(git rev-parse "${GITHUB_SHA}^")"
            UNEXPECTED="$(
              git diff --name-only "${UPLOAD_PARENT}" "${GITHUB_SHA}" |
                grep -v -F -x "${WORKFLOW_FILE}" |
                sed '/^$/d' || true
            )"
            [[ -z "${UNEXPECTED}" ]] || {
              echo "::error::Upload commit must contain only ${WORKFLOW_FILE}"
              echo "${UNEXPECTED}"
              exit 1
            }
          else
            UPLOAD_PARENT="$(git rev-parse HEAD)"
          fi

          APPLICATION_BASE_SHA="${UPLOAD_PARENT}"
          for _ in $(seq 1 20); do
            CHANGED="$(
              git diff-tree --no-commit-id --name-only -r                 "${APPLICATION_BASE_SHA}" |
                sed '/^$/d' || true
            )"
            NON_WORKFLOW="$(
              printf '%s\n' "${CHANGED}" |
                grep -v -E '^\.github/workflows/GYM-NEXT-10B-PRODUCT-SITE(-R2)?\.yml$' |
                sed '/^$/d' || true
            )"
            if [[ -n "${CHANGED}" && -z "${NON_WORKFLOW}" ]]; then
              APPLICATION_BASE_SHA="$(
                git rev-parse "${APPLICATION_BASE_SHA}^"
              )"
            else
              break
            fi
          done

          echo "STEP_BASE_SHA=${APPLICATION_BASE_SHA}" >> "$GITHUB_ENV"
          echo "UPLOAD_PARENT_SHA=${UPLOAD_PARENT}" >> "$GITHUB_ENV"
          echo "RUN_URL=https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >> "$GITHUB_ENV"
          echo "FAILED_R1_RUN_URL=https://github.com/dpromstk2000-lab/dpro-line-systems-site/actions/runs/30183653796" >> "$GITHUB_ENV"

          mkdir -p /tmp/gym-next-10b
          curl --fail --location --silent --show-error \
            --retry 3 --retry-delay 2 --max-time 30 \
            -o /tmp/gym-next-10b/source-ledger.yml \
            "${GYM_LEDGER_RAW}?run=${GITHUB_RUN_ID}"

          CURRENT_STEP="$(
            sed -n 's/^current_step:[[:space:]]*//p' \
              /tmp/gym-next-10b/source-ledger.yml |
              head -n 1 | tr -d '"\r'
          )"
          NEXT_STEP="$(
            sed -n 's/^next_step:[[:space:]]*//p' \
              /tmp/gym-next-10b/source-ledger.yml |
              head -n 1 | tr -d '"\r'
          )"
          RESULT="$(
            sed -n 's/^result:[[:space:]]*//p' \
              /tmp/gym-next-10b/source-ledger.yml |
              head -n 1 | tr -d '"\r'
          )"

          [[ "${CURRENT_STEP}" == "GYM-NEXT-10A-COMPLETE" ]] || {
            echo "::error::Expected GYM-NEXT-10A-COMPLETE, got ${CURRENT_STEP}"
            exit 1
          }
          [[ "${NEXT_STEP}" == "GYM-NEXT-10B-PRODUCT-SITE" ]] || {
            echo "::error::Expected GYM-NEXT-10B-PRODUCT-SITE, got ${NEXT_STEP}"
            exit 1
          }
          [[ "${RESULT}" == "OK" ]] || {
            echo "::error::Source GYM-NEXT-10A is not OK."
            exit 1
          }

      - name: Protect product site before GYM-NEXT-10B
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force

          if git show-ref --tags --verify --quiet "refs/tags/${BACKUP_TAG}"; then
            EXISTING="$(git rev-list -n 1 "${BACKUP_TAG}")"
            [[ "${EXISTING}" == "${STEP_BASE_SHA}" ]] || {
              echo "::error::Backup tag points to another commit."
              exit 1
            }
          else
            git tag -a "${BACKUP_TAG}" "${STEP_BASE_SHA}" \
              -m "Product site before DPRO Gym NEXT-10B"
            git push origin "refs/tags/${BACKUP_TAG}"
          fi

      - name: Verify inspected product-site baselines
        shell: bash
        run: |
          set -euo pipefail

          check_blob() {
            local path="$1"
            local expected="$2"
            local actual
            actual="$(git hash-object "${path}")"
            [[ "${actual}" == "${expected}" ]] || {
              echo "::error::${path} differs from inspected baseline."
              echo "Expected: ${expected}"
              echo "Actual:   ${actual}"
              exit 1
            }
          }

          check_blob "${PRODUCT_PAGE}" "${EXPECTED_GYM_PAGE_BLOB}"
          check_blob "${CATALOG_PAGE}" "${EXPECTED_CATALOG_BLOB}"

          STYLE_BLOB="$(git hash-object styles.css)"
          SCRIPT_BLOB="$(git hash-object script.js)"
          echo "STYLE_BLOB=${STYLE_BLOB}" >> "$GITHUB_ENV"
          echo "SCRIPT_BLOB=${SCRIPT_BLOB}" >> "$GITHUB_ENV"

          grep -Fq 'v=gym-5-final' "${PRODUCT_PAGE}"
          grep -Fq '<h3>パーソナルジム</h3>' "${PRODUCT_PAGE}" || true
          if grep -Fq 'href="systems/gym.html"' "${CATALOG_PAGE}"; then
            echo "::error::Catalog already contains a gym card; inspect before replacing."
            exit 1
          fi
          grep -Fq '37 / 37 製品ページ公開済み' "${CATALOG_PAGE}"

      - name: Verify published operation-sheet source assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/gym-next-10b/assets

          curl --fail --location --silent --show-error \
            --retry 3 --retry-delay 2 --max-time 30 \
            -o /tmp/gym-next-10b/assets/sheet.pdf \
            "${PDF_URL}?verify=${GITHUB_RUN_ID}"

          curl --fail --location --silent --show-error \
            --retry 3 --retry-delay 2 --max-time 30 \
            -o /tmp/gym-next-10b/assets/sheet.png \
            "${PNG_URL}?verify=${GITHUB_RUN_ID}"

          curl --fail --location --silent --show-error \
            --retry 3 --retry-delay 2 --max-time 30 \
            -o /tmp/gym-next-10b/assets/qr-report.json \
            "${QR_REPORT_URL}?verify=${GITHUB_RUN_ID}"

          curl --fail --location --silent --show-error \
            --retry 3 --retry-delay 2 --max-time 30 \
            -o /tmp/gym-next-10b/assets/operation-sheet.html \
            "${SHEET_HTML_URL}?verify=${GITHUB_RUN_ID}"

          ACTUAL_PDF_SHA="$(
            sha256sum /tmp/gym-next-10b/assets/sheet.pdf |
              awk '{print $1}'
          )"
          ACTUAL_PNG_SHA="$(
            sha256sum /tmp/gym-next-10b/assets/sheet.png |
              awk '{print $1}'
          )"

          [[ "${ACTUAL_PDF_SHA}" == "${EXPECTED_PDF_SHA256}" ]] || {
            echo "::error::Published operation-sheet PDF SHA mismatch."
            exit 1
          }
          [[ "${ACTUAL_PNG_SHA}" == "${EXPECTED_PNG_SHA256}" ]] || {
            echo "::error::Published operation-sheet PNG SHA mismatch."
            exit 1
          }

          [[ "$(head -c 4 /tmp/gym-next-10b/assets/sheet.pdf)" == "%PDF" ]]
          PNG_SIGNATURE="$(
            od -An -t x1 -N8 /tmp/gym-next-10b/assets/sheet.png |
              tr -d ' \n'
          )"
          [[ "${PNG_SIGNATURE}" == "89504e470d0a1a0a" ]]

          python3 <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path("/tmp/gym-next-10b/assets/qr-report.json")
              .read_text(encoding="utf-8")
          )
          assert report.get("ok") is True, report
          assert report.get("workflow_revision") == "R7", report
          assert report.get("expected_count") == 6, report
          assert report.get("source_qr_decoded_count") == 6, report
          assert report.get("decoded_count") == 6, report
          assert report.get("exact_url_match_count") == 6, report

          html = Path(
              "/tmp/gym-next-10b/assets/operation-sheet.html"
          ).read_text(encoding="utf-8")
          assert "DPRO パーソナルジム LINE NEXT" in html
          assert html.count("class=\"qr\"") == 6
          PY

      - name: Apply DPRO NEXT product page and catalog updates
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path
          import json
          import os
          import re
          import textwrap

          product_path = Path("systems/gym.html")
          catalog_path = Path("systems.html")

          product = product_path.read_text(encoding="utf-8")
          catalog = catalog_path.read_text(encoding="utf-8")

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(
                      f"{label}: expected 1 match, found {count}"
                  )
              return text.replace(old, new, 1)

          # Product-page marker and current NEXT URLs.
          product = replace_once(
              product,
              "<!-- STEP GYM-WEB-1-R1 / MEMBER DEMO URL FIX / PRODUCT 30 / 20260717 -->",
              "<!-- STEP GYM-NEXT-10B / DPRO NEXT COMPLETE / 20260726 -->",
              "product marker",
          )
          product = product.replace(
              "&amp;v=gym-5-final",
              "&amp;v=gym-next-10",
          )
          product = product.replace(
              "?demo=1&amp;line_user_id=demo_gym_line_002&amp;v=gym-next-10",
              "?demo=1&amp;v=gym-next-10",
          )
          if "gym-5-final" in product:
              raise SystemExit("Old gym-5-final URL remains.")

          # Add product-page styles before the existing local style closes.
          style_marker = "@media(max-width:600px){.gym-value-grid{grid-template-columns:1fr}.gym-hero .product-hero-copy h1{font-size:2rem}}\n</style>"
          style_addition = textwrap.dedent(
              """
              .gym-next-proof{padding:72px 0;background:#eef3fa}
              .gym-next-proof-inner{width:min(1120px,calc(100% - 32px));margin:auto;display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:30px;align-items:center}
              .gym-next-proof-copy{padding:30px;border:1px solid #d6dfeb;border-radius:24px;background:#fff;box-shadow:0 14px 36px rgba(19,33,60,.08)}
              .gym-next-proof-copy .eyebrow{margin:0 0 8px;color:#c4315c}
              .gym-next-proof-copy h2{margin:0;color:#13213c;font-size:clamp(1.65rem,3vw,2.45rem);line-height:1.35}
              .gym-next-proof-copy>p{color:#617086;line-height:1.85}
              .gym-next-proof-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:22px 0}
              .gym-next-proof-list span{padding:11px 12px;border-radius:12px;background:#f2f6fb;color:#334766;font-size:.84rem;font-weight:800}
              .gym-next-proof-actions{display:flex;flex-wrap:wrap;gap:10px}
              .gym-next-sheet-preview{padding:16px;border:1px solid #d6dfeb;border-radius:24px;background:#fff;box-shadow:0 14px 36px rgba(19,33,60,.08)}
              .gym-next-sheet-preview img{display:block;width:100%;max-height:680px;object-fit:contain;border-radius:14px;background:#f7f9fc}
              .gym-next-complete-badge{display:inline-flex;margin:0 0 14px;padding:8px 12px;border-radius:999px;background:#13213c;color:#fff;font-size:.78rem;font-weight:900;letter-spacing:.06em}
              @media(max-width:860px){.gym-next-proof-inner{grid-template-columns:1fr}.gym-next-sheet-preview{order:-1}.gym-next-sheet-preview img{max-height:520px}}
              @media(max-width:560px){.gym-next-proof{padding:52px 0}.gym-next-proof-copy{padding:22px}.gym-next-proof-list{grid-template-columns:1fr}.gym-next-proof-actions .button{width:100%;text-align:center}}
              """
          ).strip()
          product = replace_once(
              product,
              style_marker,
              style_marker.replace(
                  "\n</style>",
                  f"\n{style_addition}\n</style>",
              ),
              "NEXT product styles",
          )

          # Hero and summary copy.
          product = replace_once(
              product,
              '<p class="eyebrow">PERSONAL GYM LINE SYSTEM</p>',
              '<p class="eyebrow">PERSONAL GYM LINE SYSTEM / DPRO NEXT COMPLETE</p>',
              "hero eyebrow",
          )
          product = replace_once(
              product,
              '<h2 class="headline-lines headline-fixed"><span>体験予約・会員・回数券・来店進行を、</span><span>LINEと店舗で一つに。</span></h2>',
              '<h2 class="headline-lines headline-fixed"><span>体験・入会・記録・継続フォローを、</span><span>LINEと店舗で一つに。</span></h2>',
              "hero headline",
          )
          product = replace_once(
              product,
              '<p>無料体験・カウンセリング予約から、会員マイページ、予約変更・キャンセル相談、回数券、来店・セッション進行、継続フォローまでをつなぐパーソナルジム専用システムです。</p>',
              '<p>無料体験、入会・プラン、会員マイページ、回数券、セッション記録、スタッフ受付、前回と同じ予約、期限別の継続フォローまでをつなぐDPRO NEXT完成版です。</p>',
              "hero description",
          )
          product = replace_once(
              product,
              '<div class="hero-actions"><a class="button button-primary" href="#experience">実画面を体験する</a><a class="button button-secondary" href="https://lin.ee/YxJGXV6D" target="_blank" rel="noopener">LINEでデモを見る</a></div>',
              '<div class="hero-actions"><a class="button button-primary" href="#experience">実画面を体験する</a><a class="button button-secondary" href="#operation-sheet">操作体験シート</a><a class="button button-secondary" href="https://lin.ee/YxJGXV6D" target="_blank" rel="noopener">LINEでデモを見る</a></div>',
              "hero actions",
          )
          product = replace_once(
              product,
              '<p class="gym-note">予約開始時刻は30分単位。電話番号はハイフン・全角・+81形式を正規化して既存会員を検索し、電話・店頭予約でも同じ会員情報を利用できます。</p>',
              '<p class="gym-note">30分枠・電話番号正規化・重複防止に加え、セッション完了時の回数減算、スタッフ権限分離、URL認証拒否、営業前統合system-checkまで検査済みです。</p>',
              "hero note",
          )

          product = replace_once(
              product,
              '<div class="section-heading reveal"><p class="eyebrow">UNDERSTAND IN 30 SECONDS</p><h2 class="headline-lines headline-fixed"><span>30秒で分かる、</span><span>パーソナルジムシステムの価値。</span></h2><p>予約、会員情報、回数券、来店進行、相談、継続フォローを同じ顧客情報へまとめます。</p></div>',
              '<div class="section-heading reveal"><p class="eyebrow">UNDERSTAND IN 30 SECONDS</p><h2 class="headline-lines headline-fixed"><span>30秒で分かる、</span><span>DPRO NEXT完成版の価値。</span></h2><p>体験予約、入会、プラン、回数券、セッション記録、来店進行、会員履歴、継続フォローを同じ顧客情報へまとめます。</p></div>',
              "summary heading",
          )

          # Add staff and system-check features.
          feature_six = '<article class="product-feature reveal"><span>06</span><h3>回数券・継続管理</h3><p>回数券の増減、有効期限、残り1回以下、継続相談、フォロー予定を管理できます。</p></article>'
          feature_add = (
              feature_six
              + '<article class="product-feature reveal"><span>07</span><h3>スタッフ権限分離</h3><p>スタッフコードで当日の受付・来店・開始・完了・セッション記録だけを安全に操作します。</p></article>'
              + '<article class="product-feature reveal"><span>08</span><h3>営業前system-check</h3><p>DB、認証、重複防止、役割分離、セキュリティ、応答性能を一括検査します。</p></article>'
          )
          product = replace_once(
              product,
              feature_six,
              feature_add,
              "NEXT feature cards",
          )

          product = replace_once(
              product,
              '<div class="section-heading section-heading-light reveal"><p class="eyebrow">LIVE PRODUCT EXPERIENCE</p><h2 class="headline-lines headline-fixed"><span>お客様LINEからPC・iPad受付まで、</span><span>本物の画面で確認。</span></h2><p>PC管理とiPad受付は営業デモURLで管理コード1234を自動設定し、実画面を表示します。</p></div>',
              '<div class="section-heading section-heading-light reveal"><p class="eyebrow">LIVE PRODUCT EXPERIENCE</p><h2 class="headline-lines headline-fixed"><span>お客様LINEからPC・iPad・スタッフまで、</span><span>本物の完成画面で確認。</span></h2><p>管理コード1234、スタッフコード5678。自動・一斉LINE送信は行わず、必要な文面を確認してコピーする安全設計です。</p></div>',
              "experience heading",
          )

          # Make the iPad copy reflect the role-separated NEXT implementation.
          product = replace_once(
              product,
              '<p>予約確定・来店・開始・完了を受付から更新し、回数券対象メニューは完了時に減算します。</p><ul><li>本日の予約と進行状況</li><li>会員検索・回数調整</li><li>相談・連絡の対応</li></ul>',
              '<p>スタッフ権限で来店・開始・完了を更新し、セッション記録と回数減算を重複なく確定します。</p><ul><li>本日の予約と進行状況</li><li>スタッフ専用API・権限分離</li><li>完了時だけ原子的に回数減算</li></ul>',
              "iPad NEXT copy",
          )

          # Insert operation-sheet proof section before operational value.
          operation_section = textwrap.dedent(
              """
              <section class="gym-next-proof" id="operation-sheet" data-dpro-next-step="GYM-NEXT-10B">
              <div class="gym-next-proof-inner">
              <div class="gym-next-proof-copy reveal">
              <span class="gym-next-complete-badge">GYM NEXT-10 COMPLETE</span>
              <p class="eyebrow">A4 OPERATION EXPERIENCE SHEET</p>
              <h2>6つの実画面を、<br>QR付き1枚資料で確認。</h2>
              <p>無料体験予約、会員マイページ、PC管理、iPad受付、スタッフ画面、営業前system-checkを実画面スクリーンショットで掲載しています。</p>
              <div class="gym-next-proof-list">
              <span>実画面 6画面</span>
              <span>QR読取 6 / 6</span>
              <span>URL完全一致 6 / 6</span>
              <span>A4縦・300dpi</span>
              <span>QRサイズ 23mm</span>
              <span>公開PDF SHA一致</span>
              </div>
              <div class="gym-next-proof-actions">
              <a class="button button-primary" href="https://dpromstk2000-lab.github.io/liff-gym-demo/deliverables/gym-next-10/DPRO_GYM_NEXT_operation_experience_sheet_20260726.pdf" target="_blank" rel="noopener">操作体験PDFを開く</a>
              <a class="button button-secondary" href="https://dpromstk2000-lab.github.io/liff-gym-demo/deliverables/gym-next-10/operation-sheet.html" target="_blank" rel="noopener">6画面をWebで見る</a>
              <a class="button button-secondary" href="https://dpromstk2000-lab.github.io/liff-gym-demo/system-check.html?demo=1&amp;v=gym-next-10" target="_blank" rel="noopener">system-checkを開く</a>
              </div>
              </div>
              <a class="gym-next-sheet-preview reveal" href="https://dpromstk2000-lab.github.io/liff-gym-demo/deliverables/gym-next-10/DPRO_GYM_NEXT_operation_experience_sheet_20260726.pdf" target="_blank" rel="noopener" aria-label="DPROパーソナルジム操作体験シートPDFを開く">
