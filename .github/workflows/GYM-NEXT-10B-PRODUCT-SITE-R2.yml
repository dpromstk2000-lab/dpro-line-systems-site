          assert catalog_card_count_after == (
              catalog_card_count_before + 1
          ), {
              "before": catalog_card_count_before,
              "after": catalog_card_count_after,
          }
          assert catalog_live_card_count_after == (
              catalog_live_card_count_before + 1
          ), {
              "live_before": catalog_live_card_count_before,
              "live_after": catalog_live_card_count_after,
          }
          assert "37 / 37" not in catalog
          assert "38 / 38 製品ページ公開済み" in catalog

          count_report = {
