          ruby -e "require 'yaml'; YAML.load_file('${COMPLETION_DIR}/GYM-NEXT-COMPLETE.yml', aliases: true)"

          git add \
            "${COMPLETION_DIR}/GYM-NEXT-COMPLETE.yml" \
