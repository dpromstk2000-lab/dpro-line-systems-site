          catalog_path.write_text(
              catalog,
              encoding="utf-8",
              newline="\n",
          )
          PY

      - name: Validate HTML IDs JavaScript links and change scope
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/gym-next-10b/scripts

          python3 <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import json
          import re

          class Parser(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.ids = []
                  self.links = []
                  self.iframes = []

              def handle_starttag(self, tag, attrs):
                  data = dict(attrs)
                  if data.get("id"):
                      self.ids.append(data["id"])
                  if tag == "a" and data.get("href"):
                      self.links.append(data["href"])
                  if tag == "iframe" and data.get("src"):
                      self.iframes.append(data["src"])

              def handle_startendtag(self, tag, attrs):
                  self.handle_starttag(tag, attrs)

          reports = {}
          for file_name in ["systems/gym.html", "systems.html"]:
              text = Path(file_name).read_text(encoding="utf-8")
              parser = Parser()
              parser.feed(text)

              duplicate_ids = sorted({
                  value
                  for value in parser.ids
                  if parser.ids.count(value) > 1
              })
              assert not duplicate_ids, {
                  "file": file_name,
                  "duplicate_ids": duplicate_ids,
              }

              assert not re.search(r"[ \t]+$", text, flags=re.M), file_name
              assert text.endswith("\n"), file_name
              assert not text.endswith("\n\n"), file_name

              reports[file_name] = {
                  "bytes": len(text.encode("utf-8")),
                  "id_count": len(parser.ids),
                  "duplicate_ids": duplicate_ids,
                  "link_count": len(parser.links),
                  "iframe_count": len(parser.iframes),
              }

          product = Path("systems/gym.html").read_text(encoding="utf-8")
          catalog = Path("systems.html").read_text(encoding="utf-8")

          required_product = [
              "GYM-NEXT-10B",
              "DPRO NEXT COMPLETE",
              "gym-next-10",
              "スタッフ権限分離",
              "営業前system-check",
              "QR読取 6 / 6",
              "URL完全一致 6 / 6",
              "DPRO_GYM_NEXT_operation_experience_sheet_20260726.pdf",
              "operation-sheet.html",
          ]
          for marker in required_product:
              assert marker in product, marker

          assert "gym-5-final" not in product
          assert catalog.count('href="systems/gym.html"') == 1
          assert catalog.count(
              'data-dpro-next-product="gym-next-10"'
          ) == 1
          assert catalog.count(
              '<span class="catalog-code">PG</span>'
          ) == 1

          card_report = json.loads(
              Path(
                  "/tmp/gym-next-10b/catalog-card-count.json"
              ).read_text(encoding="utf-8")
          )
          assert card_report.get("ok") is True, card_report
          assert card_report.get(
              "catalog_card_count_before"
          ) == 28, card_report
          assert card_report.get(
              "catalog_card_count_after"
          ) == 29, card_report
          assert card_report.get(
              "catalog_card_count_after"
          ) == (
              card_report.get("catalog_card_count_before") + 1
          ), card_report

          generic_card_count = len(re.findall(
              r'<a\b[^>]*class="[^"]*\bcatalog-card\b[^"]*"',
              catalog,
          ))
          assert generic_card_count == card_report.get(
              "catalog_card_count_after"
          ), {
              "html_count": generic_card_count,
              "report": card_report,
          }

          reports["catalog_card_counts"] = card_report
          assert "38 / 38 製品ページ公開済み" in catalog
          assert "37 / 37" not in catalog

          Path(
              "/tmp/gym-next-10b/html-validation.json"
          ).write_text(
              json.dumps(
                  reports,
                  ensure_ascii=False,
                  indent=2,
              ) + "\n",
              encoding="utf-8",
          )
          PY

          node --check script.js

          [[ "$(git hash-object styles.css)" == "${STYLE_BLOB}" ]] || {
            echo "::error::styles.css changed unexpectedly."
            exit 1
          }
          [[ "$(git hash-object script.js)" == "${SCRIPT_BLOB}" ]] || {
            echo "::error::script.js changed unexpectedly."
            exit 1
          }

          CHANGED="$(
            git diff --name-only |
              sort
          )"
          EXPECTED="$(
            printf '%s\n' "${CATALOG_PAGE}" "${PRODUCT_PAGE}" |
              sort
          )"
          [[ "${CHANGED}" == "${EXPECTED}" ]] || {
            echo "::error::Unexpected files changed."
            echo "Expected:"
            echo "${EXPECTED}"
            echo "Actual:"
            echo "${CHANGED}"
            exit 1
          }

          git diff --check

      - name: Commit product page and catalog update
        shell: bash
        run: |
          set -euo pipefail
          git add "${PRODUCT_PAGE}" "${CATALOG_PAGE}"
          git diff --cached --check
          git commit -m "Publish DPRO Gym NEXT-10B product site"

          PRODUCT_COMMIT_SHA="$(git rev-parse HEAD)"
          PRODUCT_PAGE_BLOB="$(git hash-object "${PRODUCT_PAGE}")"
          CATALOG_BLOB="$(git hash-object "${CATALOG_PAGE}")"

          echo "PRODUCT_COMMIT_SHA=${PRODUCT_COMMIT_SHA}" >> "$GITHUB_ENV"
          echo "PRODUCT_PAGE_BLOB=${PRODUCT_PAGE_BLOB}" >> "$GITHUB_ENV"
          echo "CATALOG_BLOB=${CATALOG_BLOB}" >> "$GITHUB_ENV"

          git push origin HEAD:main

      - name: Wait for GitHub Pages and verify published product site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/gym-next-10b/public

          for attempt in $(seq 1 24); do
            curl --fail --location --silent --show-error \
              --max-time 30 \
              -o /tmp/gym-next-10b/public/gym.html \
              "${PRODUCT_SITE_BASE}/systems/gym.html?publish=${GITHUB_RUN_ID}-${attempt}" || true

            if [[ -s /tmp/gym-next-10b/public/gym.html ]] &&
               grep -Fq 'data-dpro-next-step="GYM-NEXT-10B"' \
                 /tmp/gym-next-10b/public/gym.html &&
               grep -Fq 'GYM NEXT-10 COMPLETE' \
                 /tmp/gym-next-10b/public/gym.html; then
              break
            fi

            if [[ "${attempt}" == "24" ]]; then
              echo "::error::Published gym product page did not reach NEXT-10B."
              exit 1
            fi
            sleep 10
          done

          curl --fail --location --silent --show-error \
            --retry 3 --retry-delay 2 --max-time 30 \
            -o /tmp/gym-next-10b/public/systems.html \
            "${PRODUCT_SITE_BASE}/systems.html?publish=${GITHUB_RUN_ID}"

          grep -Fq 'href="systems/gym.html"' \
            /tmp/gym-next-10b/public/systems.html
          grep -Fq 'data-dpro-next-product="gym-next-10"' \
            /tmp/gym-next-10b/public/systems.html
          grep -Fq '38 / 38 製品ページ公開済み' \
            /tmp/gym-next-10b/public/systems.html
          grep -Fq 'DPRO NEXT完成版' \
            /tmp/gym-next-10b/public/systems.html

          grep -Fq "${PDF_URL}" \
            /tmp/gym-next-10b/public/gym.html
          grep -Fq "${SHEET_HTML_URL}" \
            /tmp/gym-next-10b/public/gym.html
          grep -Fq 'gym-next-10' \
            /tmp/gym-next-10b/public/gym.html

          if grep -Fq 'gym-5-final' \
               /tmp/gym-next-10b/public/gym.html; then
            echo "::error::Published product page still contains gym-5-final."
            exit 1
          fi

          PRODUCT_BYTES="$(
            wc -c < /tmp/gym-next-10b/public/gym.html |
              tr -d ' '
          )"
          CATALOG_BYTES="$(
            wc -c < /tmp/gym-next-10b/public/systems.html |
              tr -d ' '
          )"

          [[ "${PRODUCT_BYTES}" -le 120000 ]] || {
            echo "::error::Published gym.html exceeds 120KB."
            exit 1
          }
          [[ "${CATALOG_BYTES}" -le 300000 ]] || {
            echo "::error::Published systems.html exceeds 300KB."
            exit 1
          }

          echo "PRODUCT_BYTES=${PRODUCT_BYTES}" >> "$GITHUB_ENV"
          echo "CATALOG_BYTES=${CATALOG_BYTES}" >> "$GITHUB_ENV"

