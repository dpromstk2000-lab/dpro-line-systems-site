              <b class="catalog-card-cta">DPRO NEXT完成版を見る →</b>
              </div>
              </a>
              """
          )

          salon_anchor = '<a class="catalog-card reveal is-live" href="systems/salon.html">'
          if salon_anchor not in catalog:
