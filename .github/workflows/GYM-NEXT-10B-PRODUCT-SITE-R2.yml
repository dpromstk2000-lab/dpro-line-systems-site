              <iframe loading="lazy" src="https://dpromstk2000-lab.github.io/liff-gym-demo/dashboard.html?demo=1&amp;v=gym-next-10" title="DPROパーソナルジムLINE NEXT実画面プレビュー"></iframe>
              <span class="catalog-live-badge">GYM NEXT-10完成</span>
