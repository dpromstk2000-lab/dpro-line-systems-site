name: DENTAL Tutorial R6 LIVE Recheck

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/dental-r6-live-recheck.yml"

permissions:
  contents: write

concurrency:
  group: dental-tutorial-r6-live-recheck
  cancel-in-progress: false

jobs:
  live-recheck:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TARGET_HTML: systems/dental.html
      TARGET_TEXT: systems/dental.html.txt
      ORIGINAL_WORKFLOW: .github/workflows/dental-r6-product-site.yml
      RECHECK_WORKFLOW: .github/workflows/dental-r6-live-recheck.yml
      BODY_COMMIT: 0197eef1398515cd12fa97932564650e47c8ee5c
      BODY_TREE: b42c9915b5f60b32ff7346de938465118b78750b
      PRODUCT_URL: https://dpromstk2000-lab.github.io/dpro-line-systems-site/systems/dental.html
      TUTORIAL_URL: https://dpromstk2000-lab.github.io/DEGITAL-QR/tutorial.html
      GUIDE_URL: https://dpromstk2000-lab.github.io/DEGITAL-QR/guide-center.html
      QUICK_URL: https://dpromstk2000-lab.github.io/DEGITAL-QR/DPRO_TUTORIAL_DENTAL_QUICK_START_V1.0.pdf
      DETAIL_URL: https://dpromstk2000-lab.github.io/DEGITAL-QR/DPRO_TUTORIAL_DENTAL_DETAILED_MANUAL_V1.0.pdf
      R5_MANUAL_COMMIT: 298aed4226bf8cf89899285b7f9a0f9b6c705fa9
      R5_QA_RUN: "33228598841"

    steps:
      - name: Checkout newest Product Site main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Forward-only recheck preflight
        id: preflight
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa-r6/screenshots
          git fetch origin main

          local_head="$(git rev-parse HEAD)"
          remote_head="$(git rev-parse origin/main)"
          test "$local_head" = "$remote_head" || {
            echo "Product Site main advanced after recheck workflow upload. HOLD." >&2
            exit 1
          }

          upload_base="$(git rev-parse HEAD^)"
          upload_base_tree="$(git rev-parse "${upload_base}^{tree}")"
          mapfile -t upload_changed < <(git diff --name-only "$upload_base" HEAD)
          test "${#upload_changed[@]}" -eq 1
          test "${upload_changed[0]}" = "$RECHECK_WORKFLOW"

          git merge-base --is-ancestor "$BODY_COMMIT" "$upload_base" || {
            echo "DENTAL R6 body commit is not an ancestor of newest main. HOLD." >&2
            exit 1
          }

          test -s "$TARGET_HTML"
          test -s "$TARGET_TEXT"
          cmp -s "$TARGET_HTML" "$TARGET_TEXT"
          test -s "$ORIGINAL_WORKFLOW"
          test -s "$RECHECK_WORKFLOW"

          test "$(grep -c 'DPRO TUTORIAL DENTAL R6 CSS START' "$TARGET_HTML")" -eq 1
          test "$(grep -c 'DPRO TUTORIAL DENTAL R6 CSS END' "$TARGET_HTML")" -eq 1
          test "$(grep -c 'DPRO TUTORIAL DENTAL R6 SECTION START' "$TARGET_HTML")" -eq 1
          test "$(grep -c 'DPRO TUTORIAL DENTAL R6 SECTION END' "$TARGET_HTML")" -eq 1

          sha256sum "$TARGET_HTML" "$TARGET_TEXT" > qa-r6/target-sha256-pre-recheck.txt
          printf '%s\n' "$upload_base" > qa-r6/product-site-head-before-recheck.txt
          printf '%s\n' "$upload_base_tree" > qa-r6/product-site-tree-before-recheck.txt
          printf '%s\n' "$BODY_COMMIT" > qa-r6/dental-r6-body-commit.txt
          printf '%s\n' "$BODY_TREE" > qa-r6/dental-r6-body-tree.txt

      - name: Verify exact DENTAL R6 static state
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import os, json

          p=Path(os.environ["TARGET_HTML"])
          t=p.read_text(encoding="utf-8")
          expected={
            "tutorial":os.environ["TUTORIAL_URL"],
            "guide":os.environ["GUIDE_URL"],
            "quick":os.environ["QUICK_URL"],
            "detail":os.environ["DETAIL_URL"],
          }
          for key,url in expected.items():
            needle=f'data-r6-resource="{key}" href="{url}"'
            if t.count(needle)!=1:
              raise SystemExit(f"Exact R6 link mismatch: {key}")

          preserved=[
            "5,500円",
            "https://lin.ee/YxJGXV6D",
            "https://dpromstk2000-lab.github.io/DEGITAL-QR/hybrid.html?t=demo-dental-patient-001",
            "../lp-dental.html",
            "../flyer-dental.html",
            "../flyer-dental.pdf",
            "../systems-data.js",
            "../dpro-v3.js",
          ]
          for x in preserved:
            if x not in t:
              raise SystemExit(f"Preserved Product Site item missing: {x}")

          out={
            "target_files":[os.environ["TARGET_HTML"],os.environ["TARGET_TEXT"]],
            "mirrors_byte_identical":Path(os.environ["TARGET_HTML"]).read_bytes()==Path(os.environ["TARGET_TEXT"]).read_bytes(),
            "body_commit":os.environ["BODY_COMMIT"],
            "body_tree":os.environ["BODY_TREE"],
            "exact_links":expected,
            "preserved_items":preserved,
            "product_site_rollback":0,
            "business_mutation":0,
          }
          Path("qa-r6/static-recheck.json").write_text(
            json.dumps(out,ensure_ascii=False,indent=2),encoding="utf-8")
          PY

      - name: Install isolated Playwright
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/dental-r6-pw
          cd /tmp/dental-r6-pw
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run exact-width DENTAL R6 LIVE QA
        id: liveqa
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/dental-r6-pw/qa.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'node:fs';

          const PRODUCT=process.env.PRODUCT_URL;
          const expected={
            tutorial:process.env.TUTORIAL_URL,
            guide:process.env.GUIDE_URL,
            quick:process.env.QUICK_URL,
            detail:process.env.DETAIL_URL,
          };
          const specs=[
            {name:'desktop1440',width:1440,height:1000},
            {name:'tablet1024',width:1024,height:768},
            {name:'mobile390',width:390,height:844},
            {name:'mobile320',width:320,height:720},
          ];
          const report={
            schema:'DPRO_TUTORIAL_DENTAL_R6_PRODUCT_SITE_LIVE_RECHECK_V1_0',
            system:'DENTAL',
            stage:'R6',
            productUrl:PRODUCT,
            expectedLinks:expected,
            bodyCommit:process.env.BODY_COMMIT,
            bodyTree:process.env.BODY_TREE,
            recheckSourceHead:process.env.GITHUB_SHA||'',
            viewports:[],
            resourceStatus:{},
            unsafeWrites:[],
            failures:[],
            businessMutation:0,
            productSiteRegression:0,
            productSiteRollback:0,
            pass:false
          };

          fs.mkdirSync('qa-r6/screenshots',{recursive:true});
          const browser=await chromium.launch({headless:true});

          for(const spec of specs){
            const context=await browser.newContext({viewport:{width:spec.width,height:spec.height}});
            const page=await context.newPage();
            const row={...spec,pageErrors:[],consoleErrors:[],unsafeWrites:[],focus:{},failures:[]};
            const fail=(m)=>{row.failures.push(m);report.failures.push(`${spec.name}: ${m}`);};

            page.on('pageerror',e=>row.pageErrors.push(String(e?.stack||e?.message||e)));
            page.on('console',m=>{
              if(m.type()==='error'){
                const loc=m.location();
                row.consoleErrors.push({text:m.text(),url:loc?.url||'',line:loc?.lineNumber??null});
              }
            });
            page.on('request',req=>{
              if(!['GET','HEAD','OPTIONS'].includes(req.method())){
                const r={method:req.method(),url:req.url(),resourceType:req.resourceType()};
                row.unsafeWrites.push(r);
                report.unsafeWrites.push(r);
              }
            });

            await page.goto(`${PRODUCT}?dentalR6Recheck=${spec.name}-${Date.now()}`,{
              waitUntil:'domcontentloaded',timeout:60000
            });
            await page.waitForTimeout(1000);

            row.metrics=await page.evaluate(()=>({
              innerWidth,
              documentElementScrollWidth:document.documentElement.scrollWidth,
              bodyScrollWidth:document.body.scrollWidth,
              marker:document.documentElement.innerHTML.includes('DPRO TUTORIAL DENTAL R6 SECTION START'),
              r6Count:document.querySelectorAll('[data-r6-resource]').length,
              links:Object.fromEntries([...document.querySelectorAll('[data-r6-resource]')].map(a=>[a.dataset.r6Resource,a.href])),
              visible:Object.fromEntries([...document.querySelectorAll('[data-r6-resource]')].map(a=>{
                const r=a.getBoundingClientRect();
                const s=getComputedStyle(a);
                return [a.dataset.r6Resource,r.width>0&&r.height>0&&s.display!=='none'&&s.visibility!=='hidden'];
              })),
              masterSections:document.querySelectorAll('.master-section').length,
              functions:!!document.querySelector('#functions'),
              live:!!document.querySelector('#live'),
              price:!!document.querySelector('#price'),
              faq:!!document.querySelector('#faq'),
              finalCta:!!document.querySelector('#final-cta'),
              priceText:document.body.textContent.includes('5,500円'),
              lineCta:!!document.querySelector('a[href="https://lin.ee/YxJGXV6D"]'),
              liveDemo:!!document.querySelector('a[href="https://dpromstk2000-lab.github.io/DEGITAL-QR/hybrid.html?t=demo-dental-patient-001"]'),
              lp:!!document.querySelector('a[href="../lp-dental.html"]'),
              flyer:!!document.querySelector('a[href="../flyer-dental.html"]'),
              flyerPdf:!!document.querySelector('a[href="../flyer-dental.pdf"]'),
              systemsData:!!document.querySelector('script[src="../systems-data.js"]'),
              dproV3:!!document.querySelector('script[src="../dpro-v3.js"]'),
              duplicateIds:(()=>{
                const ids=[...document.querySelectorAll('[id]')].map(x=>x.id);
                return ids.length-new Set(ids).size;
              })(),
            }));

            if(row.metrics.innerWidth!==spec.width) fail(`innerWidth ${row.metrics.innerWidth} != ${spec.width}`);
            if(['mobile390','mobile320'].includes(spec.name)){
              if(row.metrics.documentElementScrollWidth>row.metrics.innerWidth)
                fail(`document overflow ${row.metrics.documentElementScrollWidth}>${row.metrics.innerWidth}`);
              if(row.metrics.bodyScrollWidth>row.metrics.innerWidth)
                fail(`body overflow ${row.metrics.bodyScrollWidth}>${row.metrics.innerWidth}`);
            }

            if(!row.metrics.marker||row.metrics.r6Count!==4)
              fail('R6 resource section missing or count != 4');

            for(const [k,u] of Object.entries(expected)){
              if(row.metrics.links[k]!==u) fail(`exact link mismatch ${k}`);
              if(row.metrics.visible[k]!==true) fail(`resource not visible ${k}`);
            }

            const regKeys=['functions','live','price','faq','finalCta','priceText','lineCta','liveDemo','lp','flyer','flyerPdf','systemsData','dproV3'];
            if(row.metrics.masterSections!==12)
              fail(`master section regression ${row.metrics.masterSections} != 12`);
            for(const k of regKeys){
              if(row.metrics[k]!==true) fail(`Product Site regression invariant failed: ${k}`);
            }
            if(row.metrics.duplicateIds!==0) fail(`duplicate IDs ${row.metrics.duplicateIds}`);

            await page.evaluate(()=>document.activeElement?.blur());
            const found={};
            for(let i=0;i<140&&Object.keys(found).length<4;i++){
              await page.keyboard.press('Tab');
              const state=await page.evaluate(()=>{
                const e=document.activeElement;
                const key=e?.dataset?.r6Resource||'';
                if(!key)return null;
                const s=getComputedStyle(e),r=e.getBoundingClientRect();
                return {
                  key,
                  outlineStyle:s.outlineStyle,
                  outlineWidth:parseFloat(s.outlineWidth||'0'),
                  width:r.width,
                  height:r.height
                };
              });
              if(state?.key&&!found[state.key]) found[state.key]=state;
            }
            row.focus=found;
            for(const k of Object.keys(expected)){
              const f=found[k];
              if(!f||f.outlineStyle==='none'||!(f.outlineWidth>0)||!(f.width>0&&f.height>0))
                fail(`keyboard focus not visibly proven: ${k}`);
            }

            if(row.pageErrors.length) fail(`pageerror ${row.pageErrors.join(' | ')}`);
            if(row.consoleErrors.length) fail(`console error ${row.consoleErrors.map(x=>x.text).join(' | ')}`);
            if(row.unsafeWrites.length) fail(`unsafe writes ${row.unsafeWrites.length}`);

            await page.screenshot({
              path:`qa-r6/screenshots/${spec.name}.png`,
              fullPage:true
            });

            row.pass=row.failures.length===0;
            report.viewports.push(row);
            await context.close();
          }

          await browser.close();

          for(const [name,url] of Object.entries(expected)){
            const r=await fetch(url,{method:'GET',redirect:'follow'});
            report.resourceStatus[name]={url,status:r.status,ok:r.ok};
            if(!r.ok) report.failures.push(`resource ${name} HTTP ${r.status}`);
          }

          report.businessMutation=report.unsafeWrites.length;
          report.productSiteRegression=report.failures.some(x=>
            x.includes('Product Site regression')||
            x.includes('master section regression')||
            x.includes('duplicate IDs'))?1:0;
          report.pass=
            report.failures.length===0 &&
            report.businessMutation===0 &&
            report.productSiteRegression===0 &&
            report.productSiteRollback===0 &&
            report.viewports.every(v=>v.pass);
          report.completedAt=new Date().toISOString();

          fs.writeFileSync('qa-r6/dental-r6-live-qa.json',JSON.stringify(report,null,2));
          console.log(JSON.stringify({
            pass:report.pass,
            viewports:report.viewports.map(v=>({
              name:v.name,
              pass:v.pass,
              width:v.metrics?.innerWidth,
              doc:v.metrics?.documentElementScrollWidth,
              body:v.metrics?.bodyScrollWidth,
              focus:Object.keys(v.focus||{}),
              pageErrors:v.pageErrors.length,
              consoleErrors:v.consoleErrors.length,
              unsafeWrites:v.unsafeWrites.length
            })),
            resources:report.resourceStatus,
            businessMutation:report.businessMutation,
            productSiteRegression:report.productSiteRegression,
            productSiteRollback:report.productSiteRollback,
            failures:report.failures
          },null,2));
          if(!report.pass)process.exit(1);
          JS

          cd /tmp/dental-r6-pw
          node qa.mjs
          cp qa-r6/dental-r6-live-qa.json "$GITHUB_WORKSPACE/qa-r6/dental-r6-live-qa.json"
          cp -R qa-r6/screenshots/. "$GITHUB_WORKSPACE/qa-r6/screenshots/"

      - name: Remove temporary DENTAL R6 workflows forward-only
        id: cleanup
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main

          git checkout -B dental-r6-cleanup origin/main
          git merge-base --is-ancestor "$BODY_COMMIT" HEAD || {
            echo "DENTAL R6 body commit no longer ancestor of current main. HOLD." >&2
            exit 1
          }

          test -s "$TARGET_HTML"
          test -s "$TARGET_TEXT"
          cmp -s "$TARGET_HTML" "$TARGET_TEXT"
          grep -q 'DPRO TUTORIAL DENTAL R6 SECTION START' "$TARGET_HTML"
          test -e "$ORIGINAL_WORKFLOW"
          test -e "$RECHECK_WORKFLOW"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm "$ORIGINAL_WORKFLOW" "$RECHECK_WORKFLOW"
          git commit -m "Clean up DENTAL R6 QA workflows [skip ci]"
          git push origin HEAD:main

          cleanup_commit="$(git rev-parse HEAD)"
          cleanup_tree="$(git rev-parse HEAD^{tree})"
          printf '%s\n' "$cleanup_commit" > qa-r6/cleanup-commit.txt
          printf '%s\n' "$cleanup_tree" > qa-r6/cleanup-tree.txt
          echo "cleanup_commit=$cleanup_commit" >> "$GITHUB_OUTPUT"
          echo "cleanup_tree=$cleanup_tree" >> "$GITHUB_OUTPUT"

      - name: Verify final forward-only Product Site state
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          final_head="$(git rev-parse origin/main)"
          final_tree="$(git rev-parse origin/main^{tree})"

          git merge-base --is-ancestor "$BODY_COMMIT" "$final_head" || {
            echo "Final main does not contain DENTAL R6 body commit. HOLD." >&2
            exit 1
          }
          git merge-base --is-ancestor "${{ steps.cleanup.outputs.cleanup_commit }}" "$final_head" || {
            echo "Final main does not contain DENTAL cleanup commit. HOLD." >&2
            exit 1
          }

          git show "origin/main:$TARGET_HTML" > /tmp/final-dental.html
          git show "origin/main:$TARGET_TEXT" > /tmp/final-dental.html.txt
          cmp -s /tmp/final-dental.html /tmp/final-dental.html.txt
          grep -q 'DPRO TUTORIAL DENTAL R6 SECTION START' /tmp/final-dental.html

          if git cat-file -e "origin/main:$ORIGINAL_WORKFLOW" 2>/dev/null; then
            echo "Original DENTAL R6 workflow still exists. HOLD." >&2
            exit 1
          fi
          if git cat-file -e "origin/main:$RECHECK_WORKFLOW" 2>/dev/null; then
            echo "DENTAL R6 recheck workflow still exists. HOLD." >&2
            exit 1
          fi

          printf '%s\n' "$final_head" > qa-r6/final-product-site-head.txt
          printf '%s\n' "$final_tree" > qa-r6/final-product-site-tree.txt
          sha256sum /tmp/final-dental.html /tmp/final-dental.html.txt > qa-r6/final-target-sha256.txt

          cat > qa-r6/final-status.txt <<EOF
          R4_CENTRAL=ACCEPTED
          R5=PASS
          R6=PASS
          FIRST10_COUNT=10
          BUSINESS_MUTATION=0
          PRODUCT_SITE_ROLLBACK=0
          FORWARD_ONLY=PASS
          R7=NOT_AUTHORIZED_NOT_EXECUTED
          FINAL_LOCK=CENTRAL_DECISION_ONLY
          BODY_COMMIT=$BODY_COMMIT
          CLEANUP_COMMIT=${{ steps.cleanup.outputs.cleanup_commit }}
          FINAL_PRODUCT_SITE_HEAD=$final_head
          FINAL_PRODUCT_SITE_TREE=$final_tree
          EOF

      - name: Upload DENTAL R6 final QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dental-r6-live-recheck-qa
          path: qa-r6/
          if-no-files-found: warn
          retention-days: 90
