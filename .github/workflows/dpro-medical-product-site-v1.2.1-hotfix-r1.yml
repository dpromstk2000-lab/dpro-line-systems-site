name: DPRO MEDICAL PRODUCT SITE V1.2.1 HOTFIX R1

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/dpro-medical-product-site-v1.2.1-hotfix-r1.yml"

permissions:
  contents: write

jobs:
  hotfix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply V1.2.1 hotfix R1
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64
          import re

          systems_js = base64.b64decode("").decode("utf-8")
          guard_js = base64.b64decode("").decode("utf-8")

          Path("systems-data.js").write_text(systems_js, encoding="utf-8")

          for filename in ("index.html", "systems.html"):
              p = Path(filename)
              text = p.read_text(encoding="utf-8")
              text = re.sub(
                  r'systems-data\.js\?v=[^"\']+',
                  'systems-data.js?v=20260818-medical-v121-r1',
                  text
              )
              text = re.sub(
                  r'product-v3\.6\.js\?v=[^"\']+',
                  'product-v3.6.js?v=3.6.8-medical-v121-r1',
                  text
              )
              p.write_text(text, encoding="utf-8")

          medical = Path("systems/medical.html")
          text = medical.read_text(encoding="utf-8")
          base_rule = '.btn{display:inline-flex;min-height:52px;align-items:center;justify-content:center;padding:0 18px;border-radius:13px;text-decoration:none;font-weight:950;border:1px solid var(--line);background:#fff;box-shadow:0 4px 16px rgba(25,58,82,.05)}'
          fixed_rule = '.btn{display:inline-flex;min-height:52px;align-items:center;justify-content:center;padding:0 18px;border-radius:13px;text-decoration:none;font-weight:950;border:1px solid var(--line);background:#fff;color:var(--ink);box-shadow:0 4px 16px rgba(25,58,82,.05)}'
          if base_rule in text:
              text = text.replace(base_rule, fixed_rule, 1)
          elif fixed_rule not in text:
              raise SystemExit("QA FAILED: DPRO MEDICAL button CSS rule not found")

          text = text.replace(
              "DPRO MEDICAL / PRODUCT SITE V1.2 / PUBLIC DEMO SALES FINAL V1.1",
              "DPRO MEDICAL / PRODUCT SITE V1.2.1 / PUBLIC DEMO SALES FINAL V1.1"
          )
          medical.write_text(text, encoding="utf-8")

          product = Path("product-v3.6.js")
          ptext = product.read_text(encoding="utf-8")
          marker = "DPRO PRODUCT 51 SEO GUARD V1.2.1"
          if marker not in ptext:
              if not ptext.endswith("\n"):
                  ptext += "\n"
              ptext += guard_js
              product.write_text(ptext, encoding="utf-8")

          # Remove the invalid previous workflow after this corrected one succeeds.
          broken = Path(".github/workflows/dpro-medical-product-site-v1.2.1-hotfix.yml")
          if broken.exists():
              broken.unlink()

          # QA
          systems_text = Path("systems-data.js").read_text(encoding="utf-8")
          index_text = Path("index.html").read_text(encoding="utf-8")
          catalog_text = Path("systems.html").read_text(encoding="utf-8")
          medical_text = medical.read_text(encoding="utf-8")
          product_text = product.read_text(encoding="utf-8")

          assert "window.__DPRO_MEDICAL_51_BOOT__" in systems_text
          assert 'systems-data.js?v=20260818-medical-v121-r1' in index_text
          assert 'systems-data.js?v=20260818-medical-v121-r1' in catalog_text
          assert 'product-v3.6.js?v=3.6.8-medical-v121-r1' in index_text
          assert 'product-v3.6.js?v=3.6.8-medical-v121-r1' in catalog_text
          assert "color:var(--ink)" in medical_text
          assert "PRODUCT SITE V1.2.1" in medical_text
          assert marker in product_text
          assert not broken.exists()

          print("QA PASS: DPRO MEDICAL PRODUCT SITE V1.2.1 HOTFIX R1")
          PY

      - name: Commit corrected hotfix
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "DPRO MEDICAL PRODUCT SITE V1.2.1 hotfix R1"
          git push
