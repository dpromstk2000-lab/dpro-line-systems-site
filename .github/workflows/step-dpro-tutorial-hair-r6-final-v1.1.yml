name: STEP DPRO TUTORIAL HAIR R6 FINAL V1.1

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/step-dpro-tutorial-hair-r6-final-v1.1.yml'

permissions:
  contents: write

concurrency:
  group: dpro-tutorial-hair-r6-final
  cancel-in-progress: false

jobs:
  deploy-and-live-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard source, copy locked PDFs, patch Product Site
        shell: python
        run: |
          from pathlib import Path
          import hashlib, re, shutil, subprocess

          CENTRAL_BASE = "a4b61b06481ddc724c6bf25520548539653024a7"
          EXPECTED_PAGE_BLOB = "3536ee175b1baedf58626972c6ecb7046518b9d6"
          OLD_WORKFLOW = ".github/workflows/step-dpro-tutorial-hair-r6-final.yml"
          NEW_WORKFLOW = ".github/workflows/step-dpro-tutorial-hair-r6-final-v1.1.yml"
          TMP_QUICK = Path(".github/workflows/r6-payload-hair-quick-start-v1.0.pdf")
          TMP_DETAIL = Path(".github/workflows/r6-payload-hair-detailed-manual-v1.0.pdf")
          PAGE = Path("systems/hair-salon.html")
          MIRROR = Path("systems/hair-salon.html.txt")
          QUICK = Path("assets/pdfs/dpro-hair-tutorial-quick-start-v1.0.pdf")
          DETAIL = Path("assets/pdfs/dpro-hair-tutorial-detailed-manual-v1.0.pdf")
          QUICK_SHA = "d99a5a5371ab127fd779bdbb4173a3c211b8970f11c5a137440e3613e263b3e8"
          DETAIL_SHA = "5b9696ae33f2d9f2b6d1ffe7bc88b3d26a88fdfa360fb0a0233b43f48b43f5b3"
          CSS = '/* DPRO TUTORIAL HAIR R6 PRODUCT SITE START */\n.ps-tutorial-section{background:linear-gradient(145deg,#f3faf6 0%,#fff 58%,#f8f4ec 100%)}\n.ps-tutorial-shell{padding:clamp(1.2rem,3vw,2rem);border:1px solid #cfe3d9;border-radius:1.5rem;background:rgba(255,255,255,.92);box-shadow:var(--dpro-shadow-sm)}\n.ps-tutorial-intro{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(260px,.75fr);gap:1.4rem;align-items:end;margin-bottom:1.25rem}\n.ps-tutorial-intro h2{margin:0;color:var(--ps-deep);font-size:clamp(1.75rem,3.4vw,2.65rem);line-height:1.2;letter-spacing:-.035em}\n.ps-tutorial-intro p:last-child{margin:.7rem 0 0;color:var(--dpro-warm-gray-600)}\n.ps-tutorial-assurance{padding:1rem 1.1rem;border-radius:1rem;background:var(--ps-deep);color:#fff}\n.ps-tutorial-assurance strong{display:block;font-size:1.03rem}.ps-tutorial-assurance span{display:block;margin-top:.25rem;color:#cfe3da;font-size:.84rem}\n.ps-tutorial-path{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.9rem}\n.ps-tutorial-card{display:flex;min-width:0;flex-direction:column;padding:1.1rem;border:1px solid var(--ps-line);border-radius:1.05rem;background:#fff}\n.ps-tutorial-step{display:inline-flex;align-items:center;gap:.4rem;color:var(--dpro-green);font-size:.72rem;font-weight:900;letter-spacing:.1em}\n.ps-tutorial-card h3{margin:.5rem 0 .4rem;color:var(--ps-deep);font-size:1.08rem;line-height:1.4}\n.ps-tutorial-card p{margin:0;color:var(--dpro-warm-gray-600);font-size:.88rem}\n.ps-tutorial-note{display:inline-flex;align-items:center;margin-top:auto;padding-top:.9rem;color:var(--dpro-green);font-size:.78rem;font-weight:900}\n.ps-tutorial-links{display:grid;gap:.5rem;margin-top:auto;padding-top:.9rem}\n.ps-tutorial-link{display:flex;align-items:center;justify-content:space-between;gap:.7rem;min-height:44px;padding:.65rem .8rem;border:1px solid #bcdcca;border-radius:.75rem;background:#f7fcf9;color:var(--ps-deep);text-decoration:none;font-size:.8rem;font-weight:900}\n.ps-tutorial-link:hover{border-color:var(--dpro-green);background:var(--dpro-soft-green)}\n.ps-tutorial-link::after{content:"↗";flex:0 0 auto;color:var(--dpro-green);font-size:1rem}\n@media(max-width:900px){.ps-tutorial-intro{grid-template-columns:1fr}.ps-tutorial-path{grid-template-columns:1fr}}\n@media(max-width:640px){.ps-tutorial-shell{padding:1rem;border-radius:1.15rem}.ps-tutorial-intro{gap:.9rem}.ps-tutorial-card{padding:1rem}.ps-tutorial-link{font-size:.76rem}}\n/* DPRO TUTORIAL HAIR R6 PRODUCT SITE END */'
          SECTION = '<section aria-labelledby="tutorial-title" class="dpro-section ps-tutorial-section" data-dpro-tutorial-r6="1" id="tutorial-support"><div class="dpro-container"><div class="ps-tutorial-shell"><div class="ps-tutorial-intro"><div><p class="ps-kicker">AFTER CONTRACT SUPPORT</p><h2 id="tutorial-title">契約後も、「最初の10分」から迷わず使える。</h2><p>導入前に実画面を確認し、契約後は「最初の10分 → 操作ガイド → 印刷マニュアル」の順で確認。店舗オーナーがPC・スマホでいつでも見返せて、必要なページは印刷して手元に置けます。</p></div><div class="ps-tutorial-assurance"><strong>導入前から、契約後の使い方まで見える安心感。</strong><span>分からない時に、聞く前に自分で確認できる学習導線を用意しています。</span></div></div><div class="ps-tutorial-path"><article class="ps-tutorial-card"><span class="ps-tutorial-step">STEP 01 / FIRST 10 MINUTES</span><h3>まずは「最初の10分」</h3><p>Owner PCの画面内チュートリアルで、今日の確認・予約・顧客・カルテ・再来店フォローまで、最初に覚える操作を順番に確認します。</p><span class="ps-tutorial-note">初回操作を画面内で案内</span></article><article class="ps-tutorial-card"><span class="ps-tutorial-step">STEP 02 / ONLINE GUIDE</span><h3>迷ったら、操作ガイドで検索</h3><p>操作記事とFAQを検索して、必要な手順だけをPC・スマホからいつでも確認できます。</p><div class="ps-tutorial-links"><a class="ps-tutorial-link" href="https://dpromstk2000-lab.github.io/dpro-hair-salon-line/guide-center.html" rel="noopener" target="_blank">オンライン操作ガイドを開く</a></div></article><article class="ps-tutorial-card"><span class="ps-tutorial-step">STEP 03 / PRINT MANUAL</span><h3>必要なら、印刷して手元に</h3><p>最初に使う短いマニュアルと、詳しい操作マニュアルを用意。ブラウザで開いて、そのまま印刷できます。</p><div class="ps-tutorial-links"><a class="ps-tutorial-link" href="../assets/pdfs/dpro-hair-tutorial-quick-start-v1.0.pdf" rel="noopener" target="_blank">Quick Start｜最初に使う10ページ</a><a class="ps-tutorial-link" href="../assets/pdfs/dpro-hair-tutorial-detailed-manual-v1.0.pdf" rel="noopener" target="_blank">Detailed Manual｜詳しい操作25ページ</a></div></article></div></div></div></section>'
          FAQ_ANCHOR = '<section aria-labelledby="faq-title" class="dpro-section ps-section-soft master-section" data-master-section="11" id="faq">'

          subprocess.run(["git","merge-base","--is-ancestor",CENTRAL_BASE,"HEAD"], check=True)
          changed = set(filter(None, subprocess.check_output(
              ["git","diff","--name-only",f"{CENTRAL_BASE}..HEAD"], text=True
          ).splitlines()))
          allowed_pre = {
              "systems/CREATE_SALON_DROP_FILE.cmd",
              "systems/CREATE_SALON_DROP_FILE.ps1",
              OLD_WORKFLOW,
              NEW_WORKFLOW,
              str(TMP_QUICK),
              str(TMP_DETAIL),
          }
          unexpected = changed - allowed_pre
          if unexpected:
              raise SystemExit(f"BLOCK: unexpected Product Site drift: {sorted(unexpected)}")

          for p in (PAGE, MIRROR):
              if not p.exists():
                  raise SystemExit(f"BLOCK: missing {p}")
              blob = subprocess.check_output(["git","hash-object",str(p)], text=True).strip()
              if blob != EXPECTED_PAGE_BLOB:
                  raise SystemExit(f"BLOCK: {p} blob drift expected={EXPECTED_PAGE_BLOB} actual={blob}")

          for src, expected in ((TMP_QUICK,QUICK_SHA),(TMP_DETAIL,DETAIL_SHA)):
              if not src.exists():
                  raise SystemExit(f"BLOCK: missing locked payload {src}")
              actual = hashlib.sha256(src.read_bytes()).hexdigest()
              if actual != expected:
                  raise SystemExit(f"BLOCK: payload SHA mismatch {src} actual={actual}")

          original = PAGE.read_text(encoding="utf-8")
          mirror_original = MIRROR.read_text(encoding="utf-8")
          if original != mirror_original:
              raise SystemExit("BLOCK: HTML/TXT mirror differ before R6")
          if original.count("</style></head>") != 1:
              raise SystemExit("BLOCK: style insertion anchor count != 1")
          if original.count(FAQ_ANCHOR) != 1:
              raise SystemExit("BLOCK: FAQ insertion anchor count != 1")
          if 'data-dpro-tutorial-r6="1"' in original:
              raise SystemExit("BLOCK: R6 section already present")

          baseline_required = [
              "3つまとめて、月額5,500円（税込）。",
              "LINE公式運用</span><strong>3,300円</strong>",
              "ホームページ運用</span><strong>1,100円</strong>",
              "DPROシステム運用</span><strong>1,100円</strong>",
              "https://dpromstk2000-lab.github.io/dpro-hair-salon-line/demo-guide.html",
              "https://lin.ee/YxJGXV6D",
              "../lp-hair.html",
              "../flyer-hair.html",
              "../flyer-hair.pdf",
          ]
          for token in baseline_required:
              if token not in original:
                  raise SystemExit(f"BLOCK: existing sales marker missing: {token}")

          QUICK.parent.mkdir(parents=True, exist_ok=True)
          shutil.copyfile(TMP_QUICK, QUICK)
          shutil.copyfile(TMP_DETAIL, DETAIL)
          if hashlib.sha256(QUICK.read_bytes()).hexdigest() != QUICK_SHA:
              raise SystemExit("BLOCK: Quick copied SHA mismatch")
          if hashlib.sha256(DETAIL.read_bytes()).hexdigest() != DETAIL_SHA:
              raise SystemExit("BLOCK: Detailed copied SHA mismatch")

          patched = original.replace("</style></head>", CSS + "\n</style></head>", 1)
          patched = patched.replace(FAQ_ANCHOR, SECTION + FAQ_ANCHOR, 1)

          restored = patched.replace(CSS + "\n", "", 1).replace(SECTION, "", 1)
          if restored != original:
              raise SystemExit("BLOCK: additive-only identity proof failed")

          required_r6 = [
              "最初の10分 → 操作ガイド → 印刷マニュアル",
              "PC・スマホ",
              "Quick Start｜最初に使う10ページ",
              "Detailed Manual｜詳しい操作25ページ",
              "../assets/pdfs/dpro-hair-tutorial-quick-start-v1.0.pdf",
              "../assets/pdfs/dpro-hair-tutorial-detailed-manual-v1.0.pdf",
              "https://dpromstk2000-lab.github.io/dpro-hair-salon-line/guide-center.html",
          ]
          if patched.count('data-dpro-tutorial-r6="1"') != 1:
              raise SystemExit("BLOCK: R6 section count != 1")
          for token in required_r6:
              if token not in patched:
                  raise SystemExit(f"BLOCK: R6 route/copy missing: {token}")

          forbidden = ["system-check","demo_prepare","Worker/DB/API","CENTRAL","service_role"]
          bad = [x for x in forbidden if x in SECTION]
          if bad:
              raise SystemExit(f"BLOCK: internal support wording exposed: {bad}")
          if re.search(r"(?<!\d)0[789]0[- ]?\d{4}[- ]?\d{4}(?!\d)", SECTION):
              raise SystemExit("BLOCK: customer phone-like value in R6 section")

          for token in baseline_required:
              if patched.count(token) != original.count(token):
                  raise SystemExit(f"BLOCK: existing sales marker count changed: {token}")

          PAGE.write_text(patched, encoding="utf-8", newline="")
          MIRROR.write_text(patched, encoding="utf-8", newline="")
          if PAGE.read_bytes() != MIRROR.read_bytes():
              raise SystemExit("BLOCK: HTML/TXT mirror mismatch after R6")

          print("R6 V1.1 pre-commit static QA: PASS")
          print("Quick SHA256:", QUICK_SHA)
          print("Detailed SHA256:", DETAIL_SHA)

      - name: Commit R6 Product Site and clean temporary upload files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add             systems/hair-salon.html             systems/hair-salon.html.txt             assets/pdfs/dpro-hair-tutorial-quick-start-v1.0.pdf             assets/pdfs/dpro-hair-tutorial-detailed-manual-v1.0.pdf

          git rm -f             ".github/workflows/step-dpro-tutorial-hair-r6-final.yml"             ".github/workflows/step-dpro-tutorial-hair-r6-final-v1.1.yml"             ".github/workflows/r6-payload-hair-quick-start-v1.0.pdf"             ".github/workflows/r6-payload-hair-detailed-manual-v1.0.pdf"

          git commit -m "Add HAIR tutorial support to product site [run ${GITHUB_RUN_ID}]"
          git push
          echo "R6_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "R6_TREE=$(git rev-parse HEAD^{tree})" >> "$GITHUB_ENV"
          echo "R6_RUN_ID=${GITHUB_RUN_ID}" >> "$GITHUB_ENV"

      - name: Wait for GitHub Pages and verify live routes
        shell: bash
        run: |
          set -euo pipefail
          PRODUCT_URL="https://dpromstk2000-lab.github.io/dpro-line-systems-site/systems/hair-salon.html"
          QUICK_URL="https://dpromstk2000-lab.github.io/dpro-line-systems-site/assets/pdfs/dpro-hair-tutorial-quick-start-v1.0.pdf"
          DETAIL_URL="https://dpromstk2000-lab.github.io/dpro-line-systems-site/assets/pdfs/dpro-hair-tutorial-detailed-manual-v1.0.pdf"
          GUIDE_URL="https://dpromstk2000-lab.github.io/dpro-hair-salon-line/guide-center.html"

          ok=0
          for i in $(seq 1 40); do
            code=$(curl -L -sS -H 'Cache-Control: no-cache' -o /tmp/r6-live-product.html -w '%{http_code}' "${PRODUCT_URL}?r6=${R6_COMMIT}" || true)
            if [ "$code" = "200" ] && grep -Fq 'data-dpro-tutorial-r6="1"' /tmp/r6-live-product.html; then
              ok=1
              break
            fi
            sleep 10
          done
          [ "$ok" = "1" ] || { echo "BLOCK: Product Site Pages did not reflect R6"; exit 1; }

          grep -Fq '3つまとめて、月額5,500円（税込）。' /tmp/r6-live-product.html
          grep -Fq 'https://dpromstk2000-lab.github.io/dpro-hair-salon-line/demo-guide.html' /tmp/r6-live-product.html
          grep -Fq 'https://lin.ee/YxJGXV6D' /tmp/r6-live-product.html

          quick_code=$(curl -L -sS -H 'Cache-Control: no-cache' -o /tmp/r6-quick.pdf -w '%{http_code}' "${QUICK_URL}?r6=${R6_COMMIT}")
          detail_code=$(curl -L -sS -H 'Cache-Control: no-cache' -o /tmp/r6-detail.pdf -w '%{http_code}' "${DETAIL_URL}?r6=${R6_COMMIT}")
          guide_code=$(curl -L -sS -H 'Cache-Control: no-cache' -o /tmp/r6-guide.html -w '%{http_code}' "${GUIDE_URL}?r6=${R6_COMMIT}")
          [ "$quick_code" = "200" ]
          [ "$detail_code" = "200" ]
          [ "$guide_code" = "200" ]

          echo "d99a5a5371ab127fd779bdbb4173a3c211b8970f11c5a137440e3613e263b3e8  /tmp/r6-quick.pdf" | sha256sum -c -
          echo "5b9696ae33f2d9f2b6d1ffe7bc88b3d26a88fdfa360fb0a0233b43f48b43f5b3  /tmp/r6-detail.pdf" | sha256sum -c -

          {
            echo "DPRO TUTORIAL HAIR R6 LIVE QA CI"
            echo "R6_RUN_ID=${R6_RUN_ID}"
            echo "R6_COMMIT=${R6_COMMIT}"
            echo "R6_TREE=${R6_TREE}"
            echo "PRODUCT_HTTP=200"
            echo "PRODUCT_R6_MARKER=PASS"
            echo "EXISTING_PRICE=PASS"
            echo "EXISTING_LIVE_DEMO=PASS"
            echo "EXISTING_LINE_CTA=PASS"
            echo "QUICK_PDF_HTTP=${quick_code}"
            echo "QUICK_PDF_SHA256=PASS"
            echo "DETAILED_PDF_HTTP=${detail_code}"
            echo "DETAILED_PDF_SHA256=PASS"
            echo "GUIDE_CENTER_HTTP=${guide_code}"
          } > /tmp/r6-live-qa-ci.txt

      - name: Verify live PDF page geometry
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet pymupdf
          python - <<'PY'
          import fitz, json
          checks = [
              ("/tmp/r6-quick.pdf", 10, "/tmp/r6-quick-pdf-page1.png"),
              ("/tmp/r6-detail.pdf", 25, "/tmp/r6-detailed-pdf-page1.png"),
          ]
          result = {}
          for path, expected_pages, out_png in checks:
              doc = fitz.open(path)
              assert doc.page_count == expected_pages, (path, doc.page_count)
              dims = {(round(p.rect.width,2), round(p.rect.height,2)) for p in doc}
              assert dims == {(594.96, 841.92)}, (path, dims)
              pix = doc[0].get_pixmap(matrix=fitz.Matrix(1.5,1.5), alpha=False)
              pix.save(out_png)
              result[path] = {"pages":doc.page_count,"a4_portrait":True,"dims":list(dims)[0]}
          open("/tmp/r6-live-pdf-qa.json","w",encoding="utf-8").write(json.dumps(result,ensure_ascii=False,indent=2))
          print("Live PDF geometry: PASS")
          PY

      - name: Browser LIVE QA and screenshots
        shell: bash
        run: |
          set -euo pipefail
          CHROME=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)
          [ -n "$CHROME" ] || { echo "BLOCK: Chrome/Chromium not found"; exit 1; }
          mkdir -p /tmp/r6node
          npm install --prefix /tmp/r6node --no-save --silent puppeteer-core@24.16.0
          export NODE_PATH=/tmp/r6node/node_modules
          export CHROME
          export PRODUCT_URL="https://dpromstk2000-lab.github.io/dpro-line-systems-site/systems/hair-salon.html?r6=${R6_COMMIT}"
          export GUIDE_URL="https://dpromstk2000-lab.github.io/dpro-hair-salon-line/guide-center.html?r6=${R6_COMMIT}"
          cat > /tmp/r6-browser-qa.js <<'NODE'
          const fs = require('fs');
          const puppeteer = require('puppeteer-core');

          (async () => {
            const browser = await puppeteer.launch({
              headless: true,
              executablePath: process.env.CHROME,
              args: ['--no-sandbox','--disable-dev-shm-usage']
            });
            const results = {product: {}, guide: {}};

            async function productCheck(name, viewport, screenshot) {
              const page = await browser.newPage();
              await page.setViewport(viewport);
              const errors = [];
              page.on('pageerror', e => errors.push(String(e)));
              const resp = await page.goto(process.env.PRODUCT_URL, {waitUntil:'networkidle2', timeout:60000});
              if (!resp || resp.status() !== 200) throw new Error(`product HTTP ${resp && resp.status()}`);
              await page.waitForSelector('#tutorial-support', {visible:true, timeout:20000});
              const data = await page.evaluate(() => {
                const sec = document.querySelector('#tutorial-support');
                const box = sec.getBoundingClientRect();
                const text = sec.innerText;
                const hrefs = Array.from(sec.querySelectorAll('a')).map(a=>a.href);
                return {
                  visible: box.width > 0 && box.height > 0,
                  horizontalOverflow: Math.max(0, document.documentElement.scrollWidth - document.documentElement.clientWidth),
                  title: document.querySelector('#tutorial-title')?.textContent || '',
                  hasPath: text.includes('最初の10分 → 操作ガイド → 印刷マニュアル'),
                  hasPcMobile: text.includes('PC・スマホ'),
                  hasQuick: hrefs.some(x=>x.includes('dpro-hair-tutorial-quick-start-v1.0.pdf')),
                  hasDetailed: hrefs.some(x=>x.includes('dpro-hair-tutorial-detailed-manual-v1.0.pdf')),
                  hasGuide: hrefs.some(x=>x.includes('/dpro-hair-salon-line/guide-center.html')),
                  price: document.body.innerText.includes('月額5,500円（税込）'),
                  demo: document.documentElement.innerHTML.includes('dpro-hair-salon-line/demo-guide.html'),
                  lineCta: document.documentElement.innerHTML.includes('https://lin.ee/YxJGXV6D'),
                  internalSupport: /system-check|demo_prepare|Worker\/DB\/API|CENTRAL/.test(text)
                };
              });
              if (!data.visible || data.horizontalOverflow !== 0 || !data.hasPath || !data.hasPcMobile ||
                  !data.hasQuick || !data.hasDetailed || !data.hasGuide ||
                  !data.price || !data.demo || !data.lineCta || data.internalSupport) {
                throw new Error(`product browser QA failed: ${JSON.stringify(data)}`);
              }
              const sec = await page.$('#tutorial-support');
              await sec.screenshot({path:screenshot});
              data.consolePageErrors = errors;
              results.product[name] = data;
              await page.close();
            }

            await productCheck('desktop', {width:1440,height:1000,deviceScaleFactor:1}, '/tmp/r6-product-desktop.png');
            await productCheck('mobile', {width:390,height:844,deviceScaleFactor:1,isMobile:true,hasTouch:true}, '/tmp/r6-product-mobile.png');

            const guide = await browser.newPage();
            await guide.setViewport({width:1440,height:900});
            const guideErrors = [];
            guide.on('pageerror', e => guideErrors.push(String(e)));
            const gres = await guide.goto(process.env.GUIDE_URL, {waitUntil:'networkidle2',timeout:60000});
            if (!gres || gres.status() !== 200) throw new Error(`guide HTTP ${gres && gres.status()}`);
            await guide.waitForFunction(() => document.documentElement.dataset.guideReady === 'true', {timeout:30000});
            const gdata = await guide.evaluate(() => ({
              ready: document.documentElement.dataset.guideReady,
              categories: document.querySelector('#categoryCount')?.textContent || '',
              articles: document.querySelector('#articleCount')?.textContent || '',
              faqs: document.querySelector('#faqCount')?.textContent || '',
              horizontalOverflow: Math.max(0, document.documentElement.scrollWidth - document.documentElement.clientWidth)
            }));
            if (gdata.ready !== 'true' || gdata.categories !== '8' || gdata.articles !== '34' || gdata.faqs !== '14' || gdata.horizontalOverflow !== 0) {
              throw new Error(`guide browser QA failed: ${JSON.stringify(gdata)}`);
            }
            gdata.consolePageErrors = guideErrors;
            results.guide = gdata;
            await guide.screenshot({path:'/tmp/r6-guide-center.png',fullPage:false});
            await guide.close();

            fs.writeFileSync('/tmp/r6-live-browser-qa.json', JSON.stringify(results,null,2));
            await browser.close();
          })().catch(err => { console.error(err); process.exit(1); });
          NODE
          node /tmp/r6-browser-qa.js
          echo "Browser LIVE QA: PASS"

      - name: Final live evidence summary
        shell: bash
        run: |
          set -euo pipefail
          {
            cat /tmp/r6-live-qa-ci.txt
            echo "QUICK_PDF_PAGES=10"
            echo "QUICK_PDF_A4=PASS"
            echo "DETAILED_PDF_PAGES=25"
            echo "DETAILED_PDF_A4=PASS"
            echo "PRODUCT_DESKTOP_RENDER=PASS"
            echo "PRODUCT_MOBILE_RENDER=PASS"
            echo "HORIZONTAL_OVERFLOW=0"
            echo "GUIDE_CENTER_RENDER=PASS"
