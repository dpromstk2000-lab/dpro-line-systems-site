name: Add SODAN system to product site

on:
  push:
    paths:
      - ".github/workflows/sodan-site-update.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-site:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Add consultation support system
        shell: bash
        run: |
          python - <<'PYCODE'
          from pathlib import Path
          import base64

          script_path = Path("script.js")
          product_path = Path("systems/sodan.html")

          if not script_path.exists():
              raise SystemExit("script.js が見つかりません。処理を停止しました。")

          script = script_path.read_text(encoding="utf-8")

          # 44システム版から45システム版へ更新。すでに45なら再変更しません。
          script = script.replace(
              "// STEP SITE-HAISHOKU-1 / 44 PRODUCTS / PRESERVE ALL 43 PRODUCTS / 20260730",
              "// STEP SITE-SODAN-1 / 45 PRODUCTS / PRESERVE ALL 44 PRODUCTS / 20260731"
          )
          script = script.replace("const productCount = 44;", "const productCount = 45;")

          # トップページのカテゴリ説明へ追加。
          description_line = '  appendDescription("教育・生活サービス", "相談支援事業所");'
          if description_line not in script:
              marker = '  appendDescription("教育・生活サービス", "高齢者配食サービス");'
              if marker not in script:
                  raise SystemExit("カテゴリ説明の挿入位置が見つかりません。既存サイトを変更せず停止しました。")
              script = script.replace(marker, marker + "\n" + description_line, 1)

          # カテゴリ絞り込み対象へ追加。
          category_marker = '      "就労継続支援B型",'
          category_pair = category_marker + '\n      "相談支援事業所",'
          if category_pair not in script:
              if category_marker not in script:
                  raise SystemExit("カテゴリ一覧の挿入位置が見つかりません。既存サイトを変更せず停止しました。")
              script = script.replace(category_marker, category_pair, 1)

          # 製品一覧へ相談支援事業所カードを追加。
          if '"systems/sodan.html"' not in script:
              product_entry = (
                  ",\n"
                  "    [\n"
                  "      \"systems/sodan.html\",\n"
                  "      \"SD\",\n"
                  "      \"catalog-live-sodan\",\n"
                  "      \"相談支援事業所実画面プレビュー\",\n"
                  "      \"https://dpromstk2000-lab.github.io/dpro-sodan-line/owner.html?v=SODAN-13-R1\",\n"
                  "      \"教育・生活サービス\",\n"
                  "      \"相談支援事業所\",\n"
                  "      \"初回相談・案件・計画・書類提出・モニタリング・本人家族連携。\"\n"
                  "    ]"
              )
              final_marker = (
                  "    [\n"
                  "      \"systems/senior-meal-delivery.html\",\n"
                  "      \"SM\","
              )
              start = script.find(final_marker)
              if start < 0:
                  raise SystemExit("製品カードの挿入位置が見つかりません。既存サイトを変更せず停止しました。")
              end = script.find("\n    ]\n  ];", start)
              if end < 0:
                  raise SystemExit("products配列の終端が見つかりません。既存サイトを変更せず停止しました。")
              insert_at = end + len("\n    ]")
              script = script[:insert_at] + product_entry + script[insert_at:]

          # 相談支援事業所の製品ページを作成。
          html_b64 = ""
          product_path.parent.mkdir(parents=True, exist_ok=True)
          product_path.write_bytes(base64.b64decode(html_b64))
          script_path.write_text(script, encoding="utf-8", newline="\n")

          # 自動検査。
          checks = {
              "45システム件数": "const productCount = 45;" in script,
              "相談支援事業所カード": '"systems/sodan.html"' in script,
              "カテゴリ説明": description_line in script,
              "カテゴリ絞り込み": category_pair in script,
              "製品ページ": product_path.exists() and product_path.stat().st_size > 10000,
          }
          failed = [name for name, ok in checks.items() if not ok]
          if failed:
              raise SystemExit("自動検査失敗: " + ", ".join(failed))

          print("自動検査合格:")
          for name in checks:
              print("- " + name)
          PYCODE

      - name: Commit site update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add script.js systems/sodan.html
          if git diff --cached --quiet; then
            echo "更新対象はすでに反映済みです。"
          else
            git commit -m "Add consultation support system as product 45"
            git push origin main
          fi

      - name: Remove temporary workflow
        if: always()
        shell: bash
        run: |
          git pull --rebase origin main
          rm -f .github/workflows/sodan-site-update.yml
          git add -A
          if git diff --cached --quiet; then
            echo "一時ワークフローはすでに削除済みです。"
          else
            git commit -m "Remove temporary SODAN site update workflow"
            git push origin main
          fi
