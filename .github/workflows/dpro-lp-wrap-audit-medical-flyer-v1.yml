name: DPRO LP Wrap Audit + MEDICAL Flyer V1.0

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/dpro-lp-wrap-audit-medical-flyer-v1.yml"
  workflow_dispatch:

permissions:
  contents: write

env:
  EXPECTED_SYSTEMS_DATA: "1388eb84fe70b15a9ee365b990662ee48b725cf2"
  EXPECTED_MEDICAL_PAGE: "f92fef4ac522df27b9683d916f30ae2aece89e80"
  EXPECTED_HAIR_V13: "baf040122e6c1086b2af77e4eb8eaf0f5bf8f352"

jobs:
  deploy_medical:
    name: Deploy MEDICAL flyer
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Guard locked sources
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object systems-data.js)" = "$EXPECTED_SYSTEMS_DATA" || { echo 'BLOCKER: systems-data.js baseline changed'; exit 1; }
          test "$(git hash-object systems/medical.html)" = "$EXPECTED_MEDICAL_PAGE" || { echo 'BLOCKER: systems/medical.html baseline changed'; exit 1; }
          test "$(git hash-object lp-hair.html)" = "$EXPECTED_HAIR_V13" || { echo 'BLOCKER: HAIR V1.3 baseline changed'; exit 1; }
          test ! -e flyer-medical.html || { echo 'BLOCKER: flyer-medical.html already exists'; exit 1; }
          test ! -e flyer-medical.pdf || { echo 'BLOCKER: flyer-medical.pdf already exists'; exit 1; }
      - name: Install approved MEDICAL flyer V1.1
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64
          Path('flyer-medical.html').write_bytes(base64.b64decode(''))
          Path('flyer-medical.pdf').write_bytes(base64.b64decode(''))
          if Path('flyer-medical.html').stat().st_size < 10000: raise SystemExit('flyer HTML too small')
          if Path('flyer-medical.pdf').stat().st_size < 100000: raise SystemExit('flyer PDF too small')
          PY
      - name: Bind MEDICAL flyer to Product Site
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          data=Path('systems-data.js'); s=data.read_text(encoding='utf-8')
          if s.count('flyerHtml: "",') != 1 or s.count('flyerPdf: "",') != 1: raise SystemExit('BLOCKER: MEDICAL empty flyer fields not unique')
          s=s.replace('flyerHtml: "",','flyerHtml: "flyer-medical.html",',1).replace('flyerPdf: "",','flyerPdf: "flyer-medical.pdf",',1); data.write_text(s,encoding='utf-8')
          p=Path('systems/medical.html'); m=p.read_text(encoding='utf-8')
          hero='<a class="btn primary" href="https://dpromstk2000-lab.github.io/dpro-medical-standard/medical-public-demo.html" target="_blank" rel="noopener">30秒LIVE DEMOを体験 ↗</a>'
          if m.count(hero)!=1: raise SystemExit('BLOCKER: MEDICAL hero anchor not unique')
          m=m.replace(hero,hero+'\n<a class="btn" href="../flyer-medical.html" target="_blank" rel="noopener">A4営業チラシを見る ↗</a>',1)
          final='<a class="btn primary" href="https://dpromstk2000-lab.github.io/dpro-medical-standard/medical-public-demo.html" target="_blank" rel="noopener">LIVE DEMOを開く ↗</a><a class="btn" href="https://dpro-shop.com/systems/medical" target="_blank" rel="noopener">導入を確認 ↗</a>'
          if m.count(final)!=1: raise SystemExit('BLOCKER: MEDICAL final CTA anchors not unique')
          m=m.replace(final,'<a class="btn primary" href="https://dpromstk2000-lab.github.io/dpro-medical-standard/medical-public-demo.html" target="_blank" rel="noopener">LIVE DEMOを開く ↗</a><a class="btn" href="../flyer-medical.pdf" target="_blank" rel="noopener">A4チラシPDF ↗</a><a class="btn" href="https://dpro-shop.com/systems/medical" target="_blank" rel="noopener">導入を確認 ↗</a>',1); p.write_text(m,encoding='utf-8')
          PY
      - name: Product safety QA
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          changed=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          expected={'flyer-medical.html','flyer-medical.pdf','systems-data.js','systems/medical.html'}
          if changed != expected: raise SystemExit(f'BLOCKER unexpected diff: {sorted(changed)}')
          now=Path('systems-data.js').read_text(encoding='utf-8'); old=subprocess.check_output(['git','show','HEAD:systems-data.js'],text=True)
          restored=now.replace('flyerHtml: "flyer-medical.html",','flyerHtml: "",',1).replace('flyerPdf: "flyer-medical.pdf",','flyerPdf: "",',1)
          if restored != old: raise SystemExit('BLOCKER: systems-data.js changed beyond MEDICAL flyer fields')
          if now.count('DPRO LIVE DEMO ALL49 CENTRAL OVERRIDES START')!=1 or now.count('DPRO LIVE DEMO ALL49 CENTRAL OVERRIDES END')!=1: raise SystemExit('BLOCKER: ALL49 override block marker changed')
          med=Path('systems/medical.html').read_text(encoding='utf-8')
          for required in ['../flyer-medical.html','../flyer-medical.pdf','medical-public-demo.html']:
              if required not in med: raise SystemExit(f'BLOCKER missing MEDICAL binding: {required}')
          hair_hash=subprocess.check_output(['git','hash-object','lp-hair.html'],text=True).strip()
          if hair_hash != 'baf040122e6c1086b2af77e4eb8eaf0f5bf8f352': raise SystemExit('BLOCKER: HAIR V1.3 changed')
          print('PASS: MEDICAL flyer bound; ALL49 routing and HAIR V1.3 preserved')
          PY
      - name: Commit MEDICAL flyer integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flyer-medical.html flyer-medical.pdf systems-data.js systems/medical.html
          git rm --ignore-unmatch ".github/workflows/dpro-lp-wrap-audit-medical-flyer-v1.yml"
          git commit -m "Add DPRO MEDICAL flyer V1.1 to Product Site"
          git push origin HEAD:main

  audit_lp_wrap:
    name: Audit all LP wrapping
    needs: deploy_medical
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout updated main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Install Playwright
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 --silent
          npx playwright install --with-deps chromium
      - name: Create audit runner
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64
          Path('/tmp/lp-wrap-audit.js').write_bytes(base64.b64decode(''))
          PY
          node --check /tmp/lp-wrap-audit.js
      - name: Start local Product Site
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/dpro-http.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8765/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/dpro-http.log || true
          exit 1
      - name: Run desktop laptop mobile audit
        shell: bash
        run: |
          set -euo pipefail
          node /tmp/lp-wrap-audit.js
          cat lp-wrap-audit-output/LP_WRAP_AUDIT_V1.0.md
      - name: Upload audit report and flagged screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DPRO_LP_WRAP_AUDIT_V1.0_${{ github.run_id }}
          path: lp-wrap-audit-output/
          if-no-files-found: error
          retention-days: 14
