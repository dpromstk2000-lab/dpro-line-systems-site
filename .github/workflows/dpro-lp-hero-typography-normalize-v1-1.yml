name: DPRO LP Hero Typography Normalize V1.1

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/dpro-lp-hero-typography-normalize-v1-1.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dpro-lp-hero-typography-normalize-v1-1
  cancel-in-progress: false

jobs:
  normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout current Product Site
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Guard protected state
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object systems-data.js)" = "e676cb5a559c3f89bdd9e86f3074756df8479dfa"
          test "$(git hash-object lp-hair.html)" = "baf040122e6c1086b2af77e4eb8eaf0f5bf8f352"
          grep -Fq 'HIGH pages: 0' qa/lp-native-wrap-final-v1.1/SUMMARY.md
          grep -Fq 'DPRO LIVE DEMO ALL49 CENTRAL OVERRIDES START' systems-data.js
          grep -Fq 'flyerHtml: "flyer-medical.html"' systems-data.js
          echo "PASS: protected state present"

      - name: Apply screenshot-driven H1 normalization to 49 LPs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64
          style=base64.b64decode('').decode('utf-8')
          pages=sorted(Path('.').glob('lp-*.html'))
          if len(pages)!=50: raise SystemExit(f'BLOCKER expected 50 LPs, found {len(pages)}')
          changed=[]
          for p in pages:
              if p.name=='lp-hair.html':
                  continue
              text=p.read_text(encoding='utf-8')
              if 'dpro-lp-hero-typography-normalize-v1-1' in text:
                  raise SystemExit(f'BLOCKER already normalized {p.name}')
              pos=text.lower().rfind('</head>')
              if pos<0: raise SystemExit(f'BLOCKER </head> missing {p.name}')
              text=text[:pos]+style+'\n'+text[pos:]
              p.write_text(text,encoding='utf-8',newline='\n')
              changed.append(p.name)
          if len(changed)!=49: raise SystemExit(f'BLOCKER expected 49 changes, got {len(changed)}')
          print('PASS: 49 LPs normalized; HAIR V1.3 preserved')
          PY

      - name: Verify isolated scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test "$(git hash-object systems-data.js)" = "e676cb5a559c3f89bdd9e86f3074756df8479dfa"
          test "$(git hash-object lp-hair.html)" = "baf040122e6c1086b2af77e4eb8eaf0f5bf8f352"
          python3 - <<'PY'
          import subprocess,re
          changed=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          illegal={p for p in changed if not re.fullmatch(r'lp-[a-z0-9-]+\.html',p)}
          if illegal: raise SystemExit(f'BLOCKER non-LP changes: {sorted(illegal)}')
          if 'lp-hair.html' in changed: raise SystemExit('BLOCKER HAIR changed')
          if len(changed)!=49: raise SystemExit(f'BLOCKER changed LP count {len(changed)}')
          print('PASS isolated 49-LP scope')
          PY

      - name: Install Chromium QA
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 --silent
          npx playwright install --with-deps chromium

      - name: Create semantic line-break audit runner
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64
          Path('dpro-lp-hero-typography-audit-v11.js').write_bytes(base64.b64decode(''))
          PY
          node --check dpro-lp-hero-typography-audit-v11.js

      - name: Start local Product Site
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/dpro-http.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8765/ >/dev/null && exit 0; sleep 1; done
          exit 1

      - name: Audit all 50 LPs semantically
        id: audit
        shell: bash
        continue-on-error: true
        run: |
          set -euo pipefail
          node dpro-lp-hero-typography-audit-v11.js

      - name: Commit successful visual state
        if: steps.audit.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          rm -f dpro-lp-hero-typography-audit-v11.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lp-*.html qa/lp-hero-typography-v1-1/AUDIT.json qa/lp-hero-typography-v1-1/SUMMARY.md
          git rm --ignore-unmatch ".github/workflows/dpro-lp-hero-typography-normalize-v1.yml"
          git rm --ignore-unmatch ".github/workflows/dpro-lp-hero-typography-normalize-v1-1.yml"
          git commit -m "Normalize LP hero Japanese line breaks V1.1"
          git push origin HEAD:main

      - name: Publish diagnostics only if visual gate fails
        if: steps.audit.outcome != 'success'
        shell: bash
        run: |
          set -euo pipefail
          cp qa/lp-hero-typography-v1-1/AUDIT.json /tmp/AUDIT.json
          cp qa/lp-hero-typography-v1-1/SUMMARY.md /tmp/SUMMARY.md
          git restore lp-*.html
          rm -f dpro-lp-hero-typography-audit-v11.js
          mkdir -p qa/lp-hero-typography-v1-1-diagnostic
          cp /tmp/AUDIT.json qa/lp-hero-typography-v1-1-diagnostic/AUDIT.json
          cp /tmp/SUMMARY.md qa/lp-hero-typography-v1-1-diagnostic/SUMMARY.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add qa/lp-hero-typography-v1-1-diagnostic/AUDIT.json qa/lp-hero-typography-v1-1-diagnostic/SUMMARY.md
          git rm --ignore-unmatch ".github/workflows/dpro-lp-hero-typography-normalize-v1.yml"
          git rm --ignore-unmatch ".github/workflows/dpro-lp-hero-typography-normalize-v1-1.yml"
          git commit -m "Publish LP hero typography V1.1 diagnostics"
          git push origin HEAD:main

      - name: Fail visibly if semantic issues remain
        if: steps.audit.outcome != 'success'
        shell: bash
        run: |
          echo "BLOCKER: semantic Japanese line-break issues remain; diagnostics published for CENTRAL."
          exit 1
