name: PRODUCT Japanese mobile wrap fix V1.2R1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/product-japanese-wrap-fix-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: product-japanese-wrap-fix-v12r1
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout PRODUCT
        uses: actions/checkout@v4
        with:
          fetch-depth: 20

      - name: Prepare locked V1.1 audit and runtime sources
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          workflow='.github/workflows/product-japanese-wrap-fix-v1.yml'
          commits=subprocess.check_output(
            ['git','log','-n','20','--format=%H','--',workflow],text=True
          ).splitlines()
          source=None
          source_sha=None
          for sha in commits:
            try:
              candidate=subprocess.check_output(
                ['git','show',f'{sha}:{workflow}'],text=True
              )
            except subprocess.CalledProcessError:
              continue
            if (
              candidate.startswith('name: PRODUCT Japanese mobile wrap fix V1.1\n') and
              "cat > product-wrap-audit.js <<'NODE'" in candidate and
              "cat > japanese-wrap-v1.js <<'JS'" in candidate
            ):
              source=candidate
              source_sha=sha
              break
          if source is None:
            raise SystemExit('Locked V1.1 workflow source not found in recent history')

          def heredoc(target,marker):
            lines=source.splitlines()
            start=next(
              (i for i,line in enumerate(lines)
               if line.strip()==f"cat > {target} <<'{marker}'"),None
            )
            if start is None:
              raise SystemExit(f'{target}: V1.1 source block not found')
            end=next(
              (i for i in range(start+1,len(lines)) if lines[i].strip()==marker),None
            )
            if end is None:
              raise SystemExit(f'{target}: V1.1 source terminator not found')
            body=[]
            for line in lines[start+1:end]:
              body.append(line[10:] if line.startswith('          ') else line)
            return '\n'.join(body)+'\n'

          Path('/tmp/product-wrap-targets.json').write_text(
            heredoc('/tmp/product-wrap-targets.json','JSON'),encoding='utf-8'
          )
          Path('product-wrap-audit.js').write_text(
            heredoc('product-wrap-audit.js','NODE'),encoding='utf-8'
          )
          Path('/tmp/japanese-wrap-v11-base.css').write_text(
            heredoc('japanese-wrap-v1.css','CSS'),encoding='utf-8'
          )
          Path('/tmp/japanese-wrap-v11-base.js').write_text(
            heredoc('japanese-wrap-v1.js','JS'),encoding='utf-8'
          )
          print('LOCKED_V11_SOURCE',source_sha)
          print('AUDIT_TARGETS',len(__import__('json').loads(
            Path('/tmp/product-wrap-targets.json').read_text(encoding='utf-8')
          )))
          PY

      - name: Install Playwright
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 --silent
          npx playwright install --with-deps chromium
          node -e "console.log('PLAYWRIGHT_RESOLVE=' + require.resolve('playwright'))"
          node --check product-wrap-audit.js

      - name: Start local PRODUCT server
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/product-http.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8765/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/product-http.log || true
          exit 1

      - name: Baseline 390px audit
        shell: bash
        run: |
          set -euo pipefail
          AUDIT_BASE='http://127.0.0.1:8765/' \
            AUDIT_OUT='/tmp/product-wrap-before.json' node product-wrap-audit.js

      - name: Apply V1.2 final residual HIGH fix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json,re

          current_css=Path('japanese-wrap-v1.css').read_text(encoding='utf-8')
          current_js=Path('japanese-wrap-v1.js').read_text(encoding='utf-8')
          if not re.search(r'DPRO PRODUCT JAPANESE MOBILE WRAP (V1\.0R9|V1\.1|V1\.2)',current_css):
            raise SystemExit('Unexpected CSS baseline marker')
          if not re.search(r"window\.__DPRO_PRODUCT_JP_WRAP_V1__='(R9|V1\.1|V1\.2)'",current_js):
            raise SystemExit('Unexpected JS baseline marker')

          css=Path('/tmp/japanese-wrap-v11-base.css').read_text(encoding='utf-8')
          js=Path('/tmp/japanese-wrap-v11-base.js').read_text(encoding='utf-8')

          css=css.replace(
            'DPRO PRODUCT JAPANESE MOBILE WRAP V1.1',
            'DPRO PRODUCT JAPANESE MOBILE WRAP V1.2'
          ).replace(
            '/* V1.1: PRODUCT top CTA had its mobile grid reset later by product-v3.6.css. */',
            '/* V1.2: preserve the V1.1 PRODUCT top CTA mobile grid correction. */'
          )

          old_rule=(
            "{text:'「機能を追加する」か。 「業務の流れを設計する」か。',"
            "keep:['する」か。']}"
          )
          new_rule=(
            "{text:'「機能を追加する」か。 「業務の流れを設計する」か。',"
            "keep:['する」か。','設計する」か。']}"
          )
          if js.count(old_rule)!=1:
            raise SystemExit(f'Expected one locked compare rule, got {js.count(old_rule)}')
          js=js.replace(old_rule,new_rule,1).replace('V1.1','V1.2')

          if css.count('DPRO PRODUCT JAPANESE MOBILE WRAP V1.2')!=1:
            raise SystemExit('V1.2 CSS marker mismatch')
          if js.count("window.__DPRO_PRODUCT_JP_WRAP_V1__='V1.2'")!=1:
            raise SystemExit('V1.2 JS marker mismatch')
          if js.count("keep:['する」か。','設計する」か。']")!=1:
            raise SystemExit('V1.2 final compare protection missing')

          Path('japanese-wrap-v1.css').write_text(css,encoding='utf-8')
          Path('japanese-wrap-v1.js').write_text(js,encoding='utf-8')

          residual=[
            'compare-repitte.html','index.html','lp-btype.html','lp-car.html',
            'lp-chosashi.html','lp-cosmetics.html','lp-gyosei.html',
            'lp-haishoku.html','lp-homecare.html'
          ]
          changed=[]
          css_re=re.compile(r'japanese-wrap-v1\.css\?v=(?:1\.0|1\.1|1\.2)')
          js_re=re.compile(r'japanese-wrap-v1\.js\?v=(?:1\.0|1\.1|1\.2)')
          def body(source):
            m=re.search(r'<body\b[^>]*>.*',source,flags=re.I|re.S)
            if not m:raise SystemExit('BODY not found')
            return m.group(0)
          for name in residual:
            p=Path(name)
            if not p.is_file():raise SystemExit(f'{name}: missing')
            before=p.read_text(encoding='utf-8')
            before_body=body(before)
            if len(css_re.findall(before))!=1 or len(js_re.findall(before))!=1:
              raise SystemExit(f'{name}: expected one supported runtime reference pair')
            after=css_re.sub('japanese-wrap-v1.css?v=1.2',before,count=1)
            after=js_re.sub('japanese-wrap-v1.js?v=1.2',after,count=1)
            if body(after)!=before_body:
              raise SystemExit(f'{name}: BODY HTML changed unexpectedly')
            if after!=before:
              p.write_text(after,encoding='utf-8')
              changed.append(name)
          Path('/tmp/product-v12-residual.json').write_text(
            json.dumps({
              'version':'V1.2',
              'targets':residual,
              'changed':changed,
              'final_high_target':'compare-repitte.html',
              'final_keep':['する」か。','設計する」か。']
            },ensure_ascii=False,indent=2),encoding='utf-8'
          )
          print('V1.2 residual targets:',len(residual),'asset refs changed:',len(changed))
          PY

      - name: Runtime syntax QA
        shell: bash
        run: |
          set -euo pipefail
          node --check japanese-wrap-v1.js
          grep -F 'DPRO PRODUCT JAPANESE MOBILE WRAP V1.2' japanese-wrap-v1.css
          grep -F "window.__DPRO_PRODUCT_JP_WRAP_V1__='V1.2'" japanese-wrap-v1.js
          grep -F "keep:['する」か。','設計する」か。']" japanese-wrap-v1.js

      - name: Post-fix 390px audit
        shell: bash
        run: |
          set -euo pipefail
          AUDIT_BASE='http://127.0.0.1:8765/' \
            AUDIT_OUT='/tmp/product-wrap-after.json' node product-wrap-audit.js

      - name: V1.2 zero-HIGH gate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json
          before=json.loads(Path('/tmp/product-wrap-before.json').read_text(encoding='utf-8'))
          after=json.loads(Path('/tmp/product-wrap-after.json').read_text(encoding='utf-8'))
          b=before['summary'];a=after['summary']
          remaining=[
            {'path':x['path'],'high':x['high'],'issues':x['issues']}
            for x in after['results'] if x.get('high')
          ]
          result={'before':b,'after':a,'remaining_high':remaining}
          Path('/tmp/product-wrap-v12-comparison.json').write_text(
            json.dumps(result,ensure_ascii=False,indent=2),encoding='utf-8'
          )
          print(json.dumps(result,ensure_ascii=False,indent=2))
          if b['pages']!=58 or a['pages']!=58:
            raise SystemExit(f"Expected 58 pages, got {b['pages']} -> {a['pages']}")
          if b['loadErrors'] or a['loadErrors']:
            raise SystemExit('Page load error detected')
          if a['high']!=0:
            raise SystemExit(f"V1.2 HIGH must be zero, got {a['high']}")
          if a['overflowPages']>b['overflowPages']:
            raise SystemExit(
              f"Horizontal overflow worsened: {b['overflowPages']} -> {a['overflowPages']}"
            )
          if b['high']>0 and a['issueElements']>=b['issueElements']:
            raise SystemExit(
              f"Total wrap issues did not improve: {b['issueElements']} -> {a['issueElements']}"
            )
          if b['high']==0 and a['issueElements']>b['issueElements']:
            raise SystemExit(
              f"Total wrap issues worsened: {b['issueElements']} -> {a['issueElements']}"
            )
          print('PRODUCT V1.2 ZERO-HIGH GATE PASS')
          PY

      - name: Static safety QA
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          import json,re,subprocess
          residual=json.loads(
            Path('/tmp/product-v12-residual.json').read_text(encoding='utf-8')
          )['targets']
          allowed=set(residual)|{'japanese-wrap-v1.css','japanese-wrap-v1.js'}
          tracked=set(
            subprocess.check_output(['git','diff','--name-only'],text=True).splitlines()
          )
          if not tracked.issubset(allowed):
            raise SystemExit(f'Unexpected changed files: {sorted(tracked-allowed)}')
          if tracked and not {'japanese-wrap-v1.css','japanese-wrap-v1.js'}.issubset(tracked):
            raise SystemExit('Runtime CSS/JS change missing')
          def body(source):
            m=re.search(r'<body\b[^>]*>.*',source,flags=re.I|re.S)
            if not m:raise SystemExit('BODY not found')
            return m.group(0)
          for name in residual:
            now=Path(name).read_text(encoding='utf-8')
            old=subprocess.check_output(['git','show',f'HEAD:{name}'],text=True)
            if body(now)!=body(old):raise SystemExit(f'{name}: BODY changed')
            if now.count('japanese-wrap-v1.css?v=1.2')!=1:
              raise SystemExit(f'{name}: CSS cache-bust missing')
            if now.count('japanese-wrap-v1.js?v=1.2')!=1:
              raise SystemExit(f'{name}: JS cache-bust missing')
          css=Path('japanese-wrap-v1.css').read_text(encoding='utf-8')
          js=Path('japanese-wrap-v1.js').read_text(encoding='utf-8')
          if 'DPRO PRODUCT JAPANESE MOBILE WRAP V1.2' not in css:
            raise SystemExit('V1.2 CSS marker missing')
          if "window.__DPRO_PRODUCT_JP_WRAP_V1__='V1.2'" not in js:
            raise SystemExit('V1.2 JS marker missing')
          if "keep:['する」か。','設計する」か。']" not in js:
            raise SystemExit('V1.2 final compare protection missing')
          print('PRODUCT V1.2 STATIC SAFETY QA PASS',sorted(tracked))
          PY

      - name: Commit PRODUCT V1.2
        shell: bash
        run: |
          set -euo pipefail
          targets=(
            japanese-wrap-v1.css japanese-wrap-v1.js compare-repitte.html index.html
            lp-btype.html lp-car.html lp-chosashi.html lp-cosmetics.html
            lp-gyosei.html lp-haishoku.html lp-homecare.html
          )
          if git diff --quiet -- "${targets[@]}"; then
            echo 'V1.2 already applied; commit skipped.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "${targets[@]}"
          git commit -m 'Fix PRODUCT final Japanese wrap HIGH V1.2'
          git push origin HEAD:main

      - name: Wait for PRODUCT Pages V1.2 propagation
        shell: bash
        run: |
          set -euo pipefail
          CSS_URL="https://dpromstk2000-lab.github.io/dpro-line-systems-site/japanese-wrap-v1.css?run=${GITHUB_RUN_ID}"
          JS_URL="https://dpromstk2000-lab.github.io/dpro-line-systems-site/japanese-wrap-v1.js?run=${GITHUB_RUN_ID}"
          ready=0
          for i in $(seq 1 72); do
            css="$(curl -fsSL "$CSS_URL" 2>/dev/null || true)"
            js="$(curl -fsSL "$JS_URL" 2>/dev/null || true)"
            if printf '%s' "$css" | grep -q 'DPRO PRODUCT JAPANESE MOBILE WRAP V1.2' && \
               printf '%s' "$js" | grep -q "window.__DPRO_PRODUCT_JP_WRAP_V1__='V1.2'"; then
              ready=1
              break
            fi
            sleep 5
          done
          if [ "$ready" != '1' ]; then
            echo 'PRODUCT Pages V1.2 propagation timed out.'
            exit 1
          fi

      - name: Public full-58 audit
        shell: bash
        run: |
          set -euo pipefail
          AUDIT_BASE='https://dpromstk2000-lab.github.io/dpro-line-systems-site/' \
            AUDIT_OUT='/tmp/product-wrap-public.json' node product-wrap-audit.js

      - name: Public V1.2 final gate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json
          before=json.loads(
            Path('/tmp/product-wrap-before.json').read_text(encoding='utf-8')
          )['summary']
          public=json.loads(
            Path('/tmp/product-wrap-public.json').read_text(encoding='utf-8')
          )
          summary=public['summary']
          remaining=[
            {'path':x['path'],'high':x['high'],'issues':x['issues']}
            for x in public['results'] if x.get('high')
          ]
          result={'public':summary,'remaining_high':remaining}
          Path('/tmp/product-wrap-v12-public-result.json').write_text(
            json.dumps(result,ensure_ascii=False,indent=2),encoding='utf-8'
          )
          print(json.dumps(result,ensure_ascii=False,indent=2))
          if summary['pages']!=58:
            raise SystemExit(f"Expected 58 public pages, got {summary['pages']}")
          if summary['loadErrors']!=0:
            raise SystemExit(f"Public load errors: {summary['loadErrors']}")
          if summary['high']!=0:
            raise SystemExit(f"Public HIGH must be zero, got {summary['high']}")
          if summary['overflowPages']>before['overflowPages']:
            raise SystemExit(
              f"Public overflow worsened: {before['overflowPages']} -> {summary['overflowPages']}"
            )
          print('PRODUCT V1.2 PUBLIC FINAL GATE PASS')
          PY

      - name: Build V1.2 audit artifact
        if: always()
        shell: bash
        run: |
          mkdir -p product-wrap-v12-audit
          cp /tmp/product-wrap-before.json product-wrap-v12-audit/before.json 2>/dev/null || true
          cp /tmp/product-wrap-after.json product-wrap-v12-audit/after.json 2>/dev/null || true
          cp /tmp/product-wrap-v12-comparison.json product-wrap-v12-audit/comparison.json 2>/dev/null || true
          cp /tmp/product-wrap-public.json product-wrap-v12-audit/public.json 2>/dev/null || true
          cp /tmp/product-wrap-v12-public-result.json product-wrap-v12-audit/public-result.json 2>/dev/null || true
          cp /tmp/product-v12-residual.json product-wrap-v12-audit/residual-targets.json 2>/dev/null || true

      - name: Upload PRODUCT V1.2 wrap audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: product-japanese-wrap-v12
          path: product-wrap-v12-audit/
          retention-days: 7
