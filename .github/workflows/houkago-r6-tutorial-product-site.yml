name: HOUKAGO Tutorial R6 Product Site

on:
  push:
    branches: [main]
    paths:
      - 'DPRO_TUTORIAL_HOUKAGO_QUICK_START_V1.0.pdf'
      - 'DPRO_TUTORIAL_HOUKAGO_DETAILED_MANUAL_V1.0.pdf'
      - 'DPRO_TUTORIAL_HOUKAGO_QUICK_START_COVER_V1.0.png'
      - 'DPRO_TUTORIAL_HOUKAGO_DETAILED_MANUAL_COVER_V1.0.png'
      - '.github/workflows/houkago-r6-tutorial-product-site.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Merge-forward Tutorial and manuals into HOUKAGO product page
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          targets = [
              Path('systems/houkago-dayservice.html'),
              Path('systems/houkago-dayservice.html.txt'),
          ]

          old = '<div class="ps-doclinks" aria-label="関連資料"><a href="../lp-houkago.html">詳しい紹介を見る</a><a href="../flyer-houkago.html">A4チラシを見る</a><a href="../flyer-houkago.pdf">PDF資料を開く</a></div>'
          new = '<div class="ps-doclinks" aria-label="関連資料"><a href="https://dpromstk2000-lab.github.io/dpro-houkago-dayservice-line/help.html" target="_blank" rel="noopener">操作ガイド / Help</a><a href="https://dpromstk2000-lab.github.io/dpro-houkago-dayservice-line/guide-center.html" target="_blank" rel="noopener">Guide Center</a><a href="../DPRO_TUTORIAL_HOUKAGO_QUICK_START_V1.0.pdf" target="_blank" rel="noopener">クイックスタート PDF</a><a href="../DPRO_TUTORIAL_HOUKAGO_DETAILED_MANUAL_V1.0.pdf" target="_blank" rel="noopener">詳細操作マニュアル PDF</a><a href="../lp-houkago.html">詳しい紹介を見る</a><a href="../flyer-houkago.html">A4チラシを見る</a><a href="../flyer-houkago.pdf">既存PDF資料を開く</a></div>'

          required_markers = [
              '月額合計 5,500円（税込）。',
              'LIVE PRODUCT EXPERIENCE',
              '保護者向け施設連絡',
              '6 FUNCTIONS',
              'DPRO LINE SYSTEMS / HOUKAGO',
          ]

          results = []
          for path in targets:
              if not path.exists():
                  raise SystemExit(f'MISSING target: {path}')
              text = path.read_text(encoding='utf-8')
              before = text
              if new in text:
                  # Repeat-safe when workflow is manually re-run.
                  print(f'ALREADY INTEGRATED: {path}')
              else:
                  if text.count(old) != 1:
                      raise SystemExit(f'SOURCE DRIFT: expected related-doc block exactly once in {path}')
                  text = text.replace(old, new, 1)
              for marker in required_markers:
                  if marker not in text:
                      raise SystemExit(f'REGRESSION: marker {marker!r} missing in {path}')
              if text.count('DPRO_TUTORIAL_HOUKAGO_QUICK_START_V1.0.pdf') != 1:
                  raise SystemExit(f'QUICK PDF link count invalid in {path}')
              if text.count('DPRO_TUTORIAL_HOUKAGO_DETAILED_MANUAL_V1.0.pdf') != 1:
                  raise SystemExit(f'DETAILED PDF link count invalid in {path}')
              if text.count('guide-center.html') != 1 or text.count('help.html') != 1:
                  raise SystemExit(f'Tutorial link count invalid in {path}')
              path.write_text(text, encoding='utf-8')
              results.append((path, before != text))

          a = targets[0].read_text(encoding='utf-8')
          b = targets[1].read_text(encoding='utf-8')
          if a != b:
              raise SystemExit('HTML / HTML.TXT mirror mismatch after integration')

          print('PASS - exact HOUKAGO product page merge-forward')
          print('PASS - existing price/LIVE/product markers retained')
          print('PASS - HTML mirror consistent')
          for path, changed in results:
              print(('CHANGED' if changed else 'UNCHANGED') + ' - ' + str(path))
          PY

      - name: Verify uploaded manuals exist
        shell: bash
        run: |
          test -s DPRO_TUTORIAL_HOUKAGO_QUICK_START_V1.0.pdf
          test -s DPRO_TUTORIAL_HOUKAGO_DETAILED_MANUAL_V1.0.pdf
          test -s DPRO_TUTORIAL_HOUKAGO_QUICK_START_COVER_V1.0.png
          test -s DPRO_TUTORIAL_HOUKAGO_DETAILED_MANUAL_COVER_V1.0.png
          git diff --check

      - name: Commit exact product-site integration and self-remove workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add systems/houkago-dayservice.html systems/houkago-dayservice.html.txt
          git rm --ignore-unmatch .github/workflows/houkago-r6-tutorial-product-site.yml
          if git diff --cached --quiet; then
            echo 'No text changes required.'
            exit 0
          fi
          git commit -m 'HOUKAGO Tutorial R6 product site manuals and guide links'
          git push origin main
