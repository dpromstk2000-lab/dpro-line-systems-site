name: DPRO TUTORIAL REFORM R6 PRODUCT SITE + LIVE QA

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/reform-r6-product-site-live-qa.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dpro-tutorial-product-site-r6
  cancel-in-progress: false

env:
  PRODUCT_URL: https://dpromstk2000-lab.github.io/dpro-line-systems-site/systems/reform.html
  SOURCE_BASE: https://dpromstk2000-lab.github.io/dpro-reform-line-liff
  GUIDE_URL: https://dpromstk2000-lab.github.io/dpro-reform-line-liff/guide-center.html
  DEMO_URL: https://dpromstk2000-lab.github.io/dpro-reform-line-liff/demo-guide.html
  QUICK_PDF_URL: https://dpromstk2000-lab.github.io/dpro-reform-line-liff/manuals/reform-quick-start.pdf
  QUICK_PNG_URL: https://dpromstk2000-lab.github.io/dpro-reform-line-liff/manuals/reform-quick-start.png
  DETAIL_PDF_URL: https://dpromstk2000-lab.github.io/dpro-reform-line-liff/manuals/reform-detailed-manual.pdf
  DETAIL_PNG_URL: https://dpromstk2000-lab.github.io/dpro-reform-line-liff/manuals/reform-detailed-manual.png
  R5_EVIDENCE_RAW: https://raw.githubusercontent.com/dpromstk2000-lab/dpro-reform-line-liff/main/tutorial-evidence/reform-r5/r5-manuals-qa.json
  R6_MARKER: DPRO_TUTORIAL_REFORM_PRODUCT_SITE_R6_20260828

jobs:
  apply-and-live-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout newest Product Site main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Resolve R6 source locks
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == "dpromstk2000-lab/dpro-line-systems-site" ]]
          echo "PRODUCT_BASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          test -f systems/reform.html
          test -f systems/reform.html.txt
          cmp -s systems/reform.html systems/reform.html.txt || {
            echo 'HOLD: REFORM html/txt mirror drift exists before R6.' >&2
            exit 1
          }
          echo "REFORM_BASE_BLOB=$(git hash-object systems/reform.html)" >> "$GITHUB_ENV"

      - name: Verify REFORM R5 PASS gate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/reform-r6
          curl --fail --location --silent --show-error --retry 5 --retry-delay 2 \
            "$R5_EVIDENCE_RAW?run=$GITHUB_RUN_ID" -o /tmp/reform-r6/r5.json
          python - <<'PY'
          import json
          p='/tmp/reform-r6/r5.json'
          e=json.load(open(p,encoding='utf-8'))
          assert e.get('schema')=='DPRO_TUTORIAL_REFORM_R5_MANUALS_QA_V1_0', e.get('schema')
          assert e.get('ok') is True
          assert e.get('errors')==[]
          assert e.get('mutations')==[]
          assert e.get('preflight',{}).get('ok') is True
          assert e.get('preflight',{}).get('qrPass') is True
          assert e.get('first10',{}).get('count')==10
          assert e.get('first10',{}).get('pass') is True
          runs=e.get('viewportRuns',[])
          assert [x.get('viewport') for x in runs]==['1440','1024','390','320']
          assert all(x.get('pass') is True for x in runs)
          assert all(x.get('documentElementScrollWidth',10**9)<=x.get('innerWidth',0) for x in runs)
          assert all(x.get('bodyScrollWidth',10**9)<=x.get('innerWidth',0) for x in runs)
          assert len(e.get('assetChecks',[]))==4 and all(x.get('pass') for x in e['assetChecks'])
          print('REFORM R5 gate: PASS / sourceSha='+str(e.get('sourceSha')))
          PY

      - name: Guard Product Site baseline
        shell: bash
        run: |
          set -euo pipefail
          for p in systems/reform.html systems/reform.html.txt; do
            grep -Fq '<body data-system-code="REFORM">' "$p"
            grep -Fq 'id="connected"' "$p"
            grep -Fq 'id="price"' "$p"
            grep -Fq 'https://lin.ee/YxJGXV6D' "$p"
            grep -Fq 'https://dpromstk2000-lab.github.io/dpro-reform-line-liff/owner.html?demo=1&amp;v=reform-10' "$p"
          done

      - name: Apply REFORM Tutorial and manuals section
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          paths=[Path('systems/reform.html'),Path('systems/reform.html.txt')]
          marker='DPRO_TUTORIAL_REFORM_PRODUCT_SITE_R6_20260828'
          css=r'''
          /* DPRO_TUTORIAL_REFORM_PRODUCT_SITE_R6_20260828 */
          .ps-tutorial-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.9rem}.ps-tutorial-card{min-width:0;overflow:hidden;padding:1.1rem;border:1px solid var(--ps-line);border-radius:1rem;background:#fff;box-shadow:var(--dpro-shadow-sm)}.ps-tutorial-card>span{display:block;color:var(--dpro-green);font-size:.7rem;font-weight:900;letter-spacing:.1em}.ps-tutorial-card h3{margin:.35rem 0;color:var(--ps-deep);font-size:1.02rem;line-height:1.4}.ps-tutorial-card p{margin:0;color:var(--dpro-warm-gray-600);font-size:.86rem}.ps-tutorial-card img{display:block;width:100%;height:148px;margin-top:.8rem;border:1px solid var(--ps-line);border-radius:.72rem;background:var(--ps-pale);object-fit:cover;object-position:top}.ps-tutorial-actions{display:flex;flex-wrap:wrap;gap:.45rem;margin-top:.85rem}.ps-tutorial-actions a{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:.55rem .75rem;border-radius:.72rem;background:var(--dpro-deep-green);color:#fff;text-decoration:none;font-size:.8rem;font-weight:900}.ps-tutorial-actions a.secondary{border:1px solid var(--ps-line);background:#fff;color:var(--ps-deep)}.ps-tutorial-actions a:focus-visible{outline:3px solid #f2b94b;outline-offset:3px}.ps-tutorial-note{margin:1rem 0 0;padding:.9rem 1rem;border-left:4px solid var(--dpro-green);background:#fff;color:#395149;font-size:.88rem}
          @media(max-width:980px){.ps-tutorial-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
          @media(max-width:640px){.ps-tutorial-grid{grid-template-columns:1fr}.ps-tutorial-actions{display:grid;grid-template-columns:1fr}.ps-tutorial-actions a{width:100%}.ps-tutorial-card img{height:auto;max-height:360px;object-fit:contain}}
          '''
          section=r'''<section class="dpro-section ps-section-soft" id="tutorial-guide" aria-labelledby="tutorial-guide-title" data-dpro-tutorial-r6="DPRO_TUTORIAL_REFORM_PRODUCT_SITE_R6_20260828"><div class="dpro-container"><div class="ps-section-heading"><p class="ps-kicker">TUTORIAL / PRINT MANUALS</p><h2 id="tutorial-guide-title">操作を見ながら確認。印刷して手元でも確認。</h2><p>STANDARD V1.1のFirst10、Guide Center、R5印刷マニュアルを、現在のREFORM公開デモへつながる導線としてまとめています。</p></div><div class="ps-tutorial-grid"><article class="ps-tutorial-card"><span>01 / FIRST10</span><h3>First10をStart / Resume / Replay</h3><p>Guide Centerから全10ステップを開始・再開・Replayできます。業務データは変更しません。</p><div class="ps-tutorial-actions"><a data-r6-link="guide" href="https://dpromstk2000-lab.github.io/dpro-reform-line-liff/guide-center.html" target="_blank" rel="noopener">Guide Centerを開く</a></div></article><article class="ps-tutorial-card"><span>02 / PUBLIC DEMO</span><h3>公開デモ画面一覧</h3><p>お客様・Member・Staff・Ownerの確認入口と推奨順を開きます。</p><div class="ps-tutorial-actions"><a data-r6-link="demo" href="https://dpromstk2000-lab.github.io/dpro-reform-line-liff/demo-guide.html" target="_blank" rel="noopener">公開デモを開く</a></div></article><article class="ps-tutorial-card"><span>03 / QUICK START</span><h3>Quick Start</h3><p>A4縦1ページ。初回説明と印刷に使える短い操作ガイドです。</p><a data-r6-image="quick" href="https://dpromstk2000-lab.github.io/dpro-reform-line-liff/manuals/reform-quick-start.png" target="_blank" rel="noopener"><img src="https://dpromstk2000-lab.github.io/dpro-reform-line-liff/manuals/reform-quick-start.png" alt="REFORM Quick Start プレビュー" loading="lazy"></a><div class="ps-tutorial-actions"><a data-r6-link="quick-pdf" href="https://dpromstk2000-lab.github.io/dpro-reform-line-liff/manuals/reform-quick-start.pdf" target="_blank" rel="noopener">PDFを開く</a><a class="secondary" data-r6-link="quick-png" href="https://dpromstk2000-lab.github.io/dpro-reform-line-liff/manuals/reform-quick-start.png" target="_blank" rel="noopener">PNGを開く</a></div></article><article class="ps-tutorial-card"><span>04 / DETAILED MANUAL</span><h3>Detailed Manual</h3><p>A4縦8ページ。First10と役割別画面を詳しく確認できます。</p><a data-r6-image="detail" href="https://dpromstk2000-lab.github.io/dpro-reform-line-liff/manuals/reform-detailed-manual.png" target="_blank" rel="noopener"><img src="https://dpromstk2000-lab.github.io/dpro-reform-line-liff/manuals/reform-detailed-manual.png" alt="REFORM Detailed Manual プレビュー" loading="lazy"></a><div class="ps-tutorial-actions"><a data-r6-link="detail-pdf" href="https://dpromstk2000-lab.github.io/dpro-reform-line-liff/manuals/reform-detailed-manual.pdf" target="_blank" rel="noopener">PDFを開く</a><a class="secondary" data-r6-link="detail-png" href="https://dpromstk2000-lab.github.io/dpro-reform-line-liff/manuals/reform-detailed-manual.png" target="_blank" rel="noopener">PNGを開く</a></div></article></div><p class="ps-tutorial-note"><strong>安全確認：</strong>First10 / Guide Center / マニュアル確認では、相談送信・写真アップロード・見積・契約・工事・タスク・進捗などの業務更新を実行しません。</p></div></section>'''
          anchor='<section class="dpro-section master-section" data-master-section="8" id="connected"'
          for p in paths:
              s=p.read_text(encoding='utf-8')
              if marker not in s:
                  if '</style>' not in s: raise SystemExit(f'{p}: </style> missing')
                  if anchor not in s: raise SystemExit(f'{p}: connected anchor missing')
                  s=s.replace('</style>',css+'\n</style>',1)
                  s=s.replace(anchor,section+anchor,1)
                  p.write_text(s,encoding='utf-8')
              final=p.read_text(encoding='utf-8')
              required=[marker,'id="tutorial-guide"','guide-center.html','demo-guide.html','manuals/reform-quick-start.pdf','manuals/reform-quick-start.png','manuals/reform-detailed-manual.pdf','manuals/reform-detailed-manual.png','https://lin.ee/YxJGXV6D','owner.html?demo=1&amp;v=reform-10','id="price"']
              for token in required:
                  if token not in final: raise SystemExit(f'{p}: required token missing: {token}')
          if paths[0].read_bytes()!=paths[1].read_bytes():
              raise SystemExit('REFORM html/txt mirror diverged during R6 patch')
          print('REFORM R6 Product Site patch: PASS')
          PY

      - name: Commit forward-only Product Site integration and self-remove workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/reform-r6-product-site-live-qa.yml
          changed="$(git status --porcelain | awk '{print $2}' | sort)"
          expected="$(printf '%s\n' '.github/workflows/reform-r6-product-site-live-qa.yml' 'systems/reform.html' 'systems/reform.html.txt')"
          printf 'Changed paths:\n%s\n' "$changed"
          test "$changed" = "$expected"
          cmp -s systems/reform.html systems/reform.html.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add systems/reform.html systems/reform.html.txt .github/workflows/reform-r6-product-site-live-qa.yml
          git commit -m 'REFORM R6 Product Site tutorial/manual integration'
          git push origin HEAD:main
          echo "R6_PRODUCT_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Wait for Product Site R6 publication
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            html="$(curl --fail --location --silent --show-error "$PRODUCT_URL?r6qa=${R6_PRODUCT_SHA}-${i}" || true)"
            if printf '%s' "$html" | grep -Fq "$R6_MARKER"; then
              echo 'REFORM R6 Product Site is public.'
              exit 0
            fi
            sleep 5
          done
          echo 'HOLD: Product Site Pages did not expose R6 marker.' >&2
          exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright
        shell: bash
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null

      - name: Run R6 Product Site + source LIVE QA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tutorial-evidence/reform-r6/screens
          cat > /tmp/reform-r6-qa.js <<'JS'
          const { chromium, request } = require('playwright');
          const fs=require('fs');
          const env=process.env;
          const urls={product:env.PRODUCT_URL,guide:env.GUIDE_URL,demo:env.DEMO_URL,quickPdf:env.QUICK_PDF_URL,quickPng:env.QUICK_PNG_URL,detailPdf:env.DETAIL_PDF_URL,detailPng:env.DETAIL_PNG_URL};
          const expectedLinks=[urls.guide,urls.demo,urls.quickPdf,urls.quickPng,urls.detailPdf,urls.detailPng];
          const widths=[['1440',1440,1000],['1024',1024,768],['390',390,844],['320',320,720]];
          const mutationMethods=new Set(['POST','PUT','PATCH','DELETE']);
          const ev={schema:'DPRO_TUTORIAL_REFORM_R6_PRODUCT_SITE_LIVE_QA_V1_0',productBaseSha:env.PRODUCT_BASE_SHA,productR6Sha:env.R6_PRODUCT_SHA,reformBaseBlob:env.REFORM_BASE_BLOB,startedAt:new Date().toISOString(),urls,http:{},viewports:[],guideCenter:{},keyboard:{},errors:[],mutations:[],businessMutation:0,backendChanges:0,r7:'NOT_AUTHORIZED',finalLockCandidate:false,ok:false};
          const assert=(c,m)=>{if(!c)throw new Error(m)};
          function attach(page,scope){
            page.on('pageerror',e=>ev.errors.push({scope,type:'pageerror',message:String(e)}));
            page.on('console',m=>{if(m.type()==='error')ev.errors.push({scope,type:'console',message:m.text()});});
            page.on('request',r=>{if(mutationMethods.has(r.method()))ev.mutations.push({scope,method:r.method(),url:r.url()});});
          }
          async function tabTo(page,selector,max=80){
            await page.locator('body').focus();
            for(let i=0;i<max;i++){
              await page.keyboard.press('Tab');
              if(await page.evaluate(sel=>document.activeElement?.matches(sel),selector))return true;
            }
            return false;
          }
          (async()=>{
            const browser=await chromium.launch({headless:true});
            try{
              const api=await request.newContext({extraHTTPHeaders:{'Cache-Control':'no-cache','Pragma':'no-cache'}});
              for(const [k,u] of Object.entries(urls)){
                const r=await api.get(u+`?r6qa=${Date.now()}-${k}`);
                ev.http[k]={status:r.status(),contentType:r.headers()['content-type']||'',pass:r.status()===200};
                assert(r.status()===200,`${k} HTTP ${r.status()}`);
              }
              await api.dispose();

              for(const [key,w,h] of widths){
                const ctx=await browser.newContext({viewport:{width:w,height:h}});
                const page=await ctx.newPage(); attach(page,`product-${key}`);
                const res=await page.goto(urls.product+`?r6qa=${env.R6_PRODUCT_SHA}-${key}`,{waitUntil:'domcontentloaded',timeout:60000});
                assert(res&&res.status()===200,`product ${key} HTTP`);
                await page.waitForSelector(`#tutorial-guide[data-dpro-tutorial-r6="${env.R6_MARKER}"]`,{timeout:30000});
                const previewImgs=page.locator('#tutorial-guide img');
                for(let i=0;i<await previewImgs.count();i++) await previewImgs.nth(i).scrollIntoViewIfNeeded();
                await page.waitForFunction(()=>[...document.querySelectorAll('#tutorial-guide img')].every(i=>i.complete&&i.naturalWidth>0),null,{timeout:20000});
                await page.locator('#tutorial-guide').scrollIntoViewIfNeeded();
                const m=await page.evaluate(()=>({innerWidth,doc:document.documentElement.scrollWidth,body:document.body?.scrollWidth||0,links:[...document.querySelectorAll('#tutorial-guide a')].map(a=>a.href),imgs:[...document.querySelectorAll('#tutorial-guide img')].map(i=>({complete:i.complete,w:i.naturalWidth,h:i.naturalHeight}))}));
                const pass=m.innerWidth===w&&m.doc<=m.innerWidth&&m.body<=m.innerWidth&&expectedLinks.every(u=>m.links.includes(u))&&m.imgs.length===2&&m.imgs.every(x=>x.complete&&x.w>0&&x.h>0);
                ev.viewports.push({viewport:key,...m,pass}); assert(pass,`product viewport ${key} failed`);
                await page.screenshot({path:`tutorial-evidence/reform-r6/screens/product-${key}.png`,fullPage:true});
                await ctx.close();
              }

              const gctx=await browser.newContext({viewport:{width:1440,height:1000}});
              const gp=await gctx.newPage();attach(gp,'guide-center');
              const gr=await gp.goto(urls.guide+`?r6qa=${Date.now()}`,{waitUntil:'domcontentloaded',timeout:60000});
              assert(gr&&gr.status()===200,'Guide Center HTTP');
              await gp.waitForSelector('#guideCenterReady[data-ready="1"]',{timeout:30000});
              const gm=await gp.evaluate(()=>({stepCount:window.DPRO_REFORM_TUTORIAL?.steps?.length||0,renderedCount:document.querySelectorAll('#gc-first10 .first10-item').length,start:!!document.querySelector('#gc-start'),resume:!!document.querySelector('#gc-resume'),replay:!!document.querySelector('#gc-replay'),doc:document.documentElement.scrollWidth,innerWidth}));
              gm.pass=gm.stepCount===10&&gm.renderedCount===10&&gm.start&&gm.resume&&gm.replay&&gm.doc<=gm.innerWidth;
              ev.guideCenter=gm;assert(gm.pass,'Guide Center First10/control check failed');
              await gctx.close();

              const kctx=await browser.newContext({viewport:{width:1440,height:1000}});
              const kp=await kctx.newPage();attach(kp,'keyboard');
              await kp.goto(urls.product+`?r6qa=keyboard-${Date.now()}`,{waitUntil:'domcontentloaded',timeout:60000});
              await kp.waitForSelector('#tutorial-guide');
              const focusGuide=await tabTo(kp,'#tutorial-guide a[data-r6-link="guide"]');
              ev.keyboard={guideLink:focusGuide,pass:focusGuide};assert(focusGuide,'keyboard focus did not reach Guide Center link');
              await kctx.close();

              assert(ev.errors.length===0,`attributable errors: ${ev.errors.length}`);
              assert(ev.mutations.length===0,`business mutations: ${ev.mutations.length}`);
              ev.businessMutation=0;ev.backendChanges=0;ev.finalLockCandidate=true;ev.ok=true;
            }catch(e){ev.errors.push({scope:'qa',type:'assertion',message:String(e?.stack||e)});ev.ok=false;ev.finalLockCandidate=false;}
            finally{await browser.close();ev.finishedAt=new Date().toISOString();fs.writeFileSync('tutorial-evidence/reform-r6/r6-product-site-live-qa.json',JSON.stringify(ev,null,2));}
            if(!ev.ok)process.exit(1);
          })();
          JS
          node /tmp/reform-r6-qa.js

      - name: Commit R6 LIVE QA evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f tutorial-evidence/reform-r6/r6-product-site-live-qa.json || exit 0
          mkdir -p /tmp/reform-r6-evidence
          cp -R tutorial-evidence/reform-r6/. /tmp/reform-r6-evidence/
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            rm -rf tutorial-evidence/reform-r6
            mkdir -p tutorial-evidence/reform-r6
            cp -R /tmp/reform-r6-evidence/. tutorial-evidence/reform-r6/
            git add tutorial-evidence/reform-r6
            git config user.name 'DPRO Tutorial QA'
            git config user.email 'actions@users.noreply.github.com'
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'REFORM Tutorial R6: publish Product Site LIVE QA evidence'
            if git push origin HEAD:main; then exit 0; fi
            sleep 4
          done
          echo 'Could not publish R6 evidence without force push' >&2
          exit 1

      - name: Upload R6 evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reform-r6-product-site-live-qa
          path: tutorial-evidence/reform-r6
          if-no-files-found: warn
