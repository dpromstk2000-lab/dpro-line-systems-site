name: FUNERAL R6 Product Site + LIVE QA

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/funeral-r6-product-site-live-qa.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  PRODUCT_URL: https://dpromstk2000-lab.github.io/dpro-line-systems-site/systems/funeral.html
  TUTORIAL_START_URL: https://dpromstk2000-lab.github.io/dpro-funeral-line/demo-guide.html
  GUIDE_CENTER_URL: https://dpromstk2000-lab.github.io/dpro-funeral-line/demo-guide.html#guideCenter
  QUICK_START_PDF_URL: https://dpromstk2000-lab.github.io/dpro-funeral-line/manuals/DPRO_TUTORIAL_FUNERAL_QUICK_START_V1.0.pdf
  DETAILED_MANUAL_PDF_URL: https://dpromstk2000-lab.github.io/dpro-funeral-line/manuals/DPRO_TUTORIAL_FUNERAL_DETAILED_MANUAL_V1.0.pdf
  START_PRODUCT_SHA: d37d6049a8c7b3f08f42a8eec9c291d8b11a6d43

jobs:
  r6-product-site:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout newest Product Site main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch newest main and lock R6 prewrite source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p r6-evidence
          git pull --rebase origin main

          PREWRITE_HEAD="$(git rev-parse HEAD)"
          PREWRITE_TREE="$(git rev-parse HEAD^{tree})"
          {
            echo "FETCH_NEWEST_PRODUCT_MAIN_PREWRITE=PASS"
            echo "PREWRITE_HEAD=$PREWRITE_HEAD"
            echo "PREWRITE_TREE=$PREWRITE_TREE"
            echo "START_PACKAGE_PRODUCT_SHA=$START_PRODUCT_SHA"
          } | tee r6-evidence/R6_PRODUCT_SITE_PREWRITE_LOCK.txt

          git merge-base --is-ancestor "$START_PRODUCT_SHA" HEAD
          echo "PRODUCT_SITE_ROLLBACK=0" | tee -a r6-evidence/R6_PRODUCT_SITE_PREWRITE_LOCK.txt
          echo "FORWARD_ONLY_PREWRITE=PASS" | tee -a r6-evidence/R6_PRODUCT_SITE_PREWRITE_LOCK.txt

          test -f systems/funeral.html
          test -f systems/funeral.html.txt
          cmp -s systems/funeral.html systems/funeral.html.txt

          {
            echo "BEFORE_HTML_BLOB=$(git hash-object systems/funeral.html)"
            echo "BEFORE_TEXT_BLOB=$(git hash-object systems/funeral.html.txt)"
            echo "BEFORE_HTML_SHA256=$(sha256sum systems/funeral.html | awk '{print $1}')"
            echo "BEFORE_TEXT_SHA256=$(sha256sum systems/funeral.html.txt | awk '{print $1}')"
            echo "HTML_TEXT_BYTE_IDENTICAL_BEFORE=PASS"
          } | tee r6-evidence/R6_TARGET_BEFORE.txt

      - name: Verify all four FUNERAL resources are really public before write
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, time, urllib.request
          from pathlib import Path

          urls = {
              "TUTORIAL_START": os.environ["TUTORIAL_START_URL"],
              "GUIDE_CENTER": os.environ["GUIDE_CENTER_URL"],
              "QUICK_START_PDF": os.environ["QUICK_START_PDF_URL"],
              "DETAILED_MANUAL_PDF": os.environ["DETAILED_MANUAL_PDF_URL"],
          }

          def get(url):
              # Fragments are browser-side; the HTTP resource is the URL before '#'.
              request_url = url.split("#", 1)[0]
              req = urllib.request.Request(
                  request_url,
                  headers={"User-Agent":"DPRO-FUNERAL-R6-QA/1.0","Cache-Control":"no-cache"},
              )
              with urllib.request.urlopen(req, timeout=30) as r:
                  return r.status, r.headers.get_content_type(), r.read()

          last = {}
          for _ in range(72):
              try:
                  data = {}
                  ok = True
                  for name, url in urls.items():
                      status, ctype, body = get(url)
                      data[name] = (status, ctype, body)
                      last[name] = f"{status} {ctype} {len(body)}"
                      if status != 200:
                          ok = False
                  if ok:
                      tutorial = data["TUTORIAL_START"][2].decode("utf-8", "replace")
                      quick = data["QUICK_START_PDF"][2]
                      detail = data["DETAILED_MANUAL_PDF"][2]
                      if 'id="guideStart"' not in tutorial or 'id="guideCenter"' not in tutorial:
                          ok = False
                      if not quick.startswith(b"%PDF") or not detail.startswith(b"%PDF"):
                          ok = False
                  if ok:
                      break
              except Exception as e:
                  last["error"] = repr(e)
              time.sleep(10)
          else:
              raise SystemExit("Four public R5/R4 resources not ready: " + repr(last))

          Path("r6-evidence/R6_LINKS.txt").write_text(
              "\n".join([
                  "TUTORIAL_START_LINK=PASS",
                  "TUTORIAL_START_URL="+urls["TUTORIAL_START"],
                  "GUIDE_CENTER_LINK=PASS",
                  "GUIDE_CENTER_URL="+urls["GUIDE_CENTER"],
                  "QUICK_START_PDF_LINK=PASS",
                  "QUICK_START_PDF_URL="+urls["QUICK_START_PDF"],
                  "DETAILED_MANUAL_PDF_LINK=PASS",
                  "DETAILED_MANUAL_PDF_URL="+urls["DETAILED_MANUAL_PDF"],
                  "ALL_4_LINKS_PUBLIC_REACHABLE=PASS",
              ])+"\n",
              encoding="utf-8",
          )
          print("ALL_4_LINKS_PUBLIC_REACHABLE=PASS")
          PY

      - name: Integrate FUNERAL Tutorial resources target-only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          html = Path("systems/funeral.html")
          mirror = Path("systems/funeral.html.txt")

          if html.read_bytes() != mirror.read_bytes():
              raise SystemExit("HTML/TEXT mirror mismatch before patch; refuse to overwrite newer work")

          s = html.read_text(encoding="utf-8")
          before = s

          must_keep = [
              'id="hero-title"',
              '事前相談から葬儀後・法要まで、',
              'https://lin.ee/YxJGXV6D',
              '5,500円',
              'https://dpromstk2000-lab.github.io/dpro-funeral-line/owner.html?demo=1&amp;v=funeral-10-r1-check',
              '../lp-funeral.html',
              '../flyer-funeral.html',
              '../flyer-funeral.pdf',
              '<script src="../systems-data.js"></script>',
              '<script src="../dpro-v3.js"></script>',
          ]
          for token in must_keep:
              if token not in before:
                  raise SystemExit("Baseline token missing before R6: " + token)

          css = r'''
          /* FUNERAL TUTORIAL R6 START */
          .ps-tutorial-r6-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1rem}
          .ps-tutorial-r6-card{display:flex;flex-direction:column;gap:.7rem;padding:1.15rem;border:1px solid var(--ps-line);border-radius:1rem;background:#fff;box-shadow:var(--dpro-shadow-sm)}
          .ps-tutorial-r6-card h3{margin:0;color:var(--ps-deep);font-size:1.12rem}
          .ps-tutorial-r6-card p{margin:0;color:var(--dpro-warm-gray-600);font-size:.92rem}
          .ps-tutorial-r6-links{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.65rem}
          .ps-tutorial-r6-link{min-width:0;min-height:52px;display:flex;align-items:center;justify-content:space-between;gap:.7rem;padding:.75rem .85rem;border:1px solid var(--ps-line);border-radius:.8rem;background:var(--ps-pale);text-decoration:none;font-weight:850;color:var(--ps-deep);overflow-wrap:anywhere}
          .ps-tutorial-r6-link::after{content:"↗";flex:0 0 auto;color:var(--dpro-green);font-weight:900}
          .ps-tutorial-r6-link:focus,.ps-tutorial-r6-link:focus-visible{outline:3px solid #a37642;outline-offset:3px}
          .ps-tutorial-r6-safe{margin-top:1rem;padding:1rem 1.1rem;border-left:4px solid var(--dpro-green);background:#edf8f4;color:#395149}
          @media(max-width:700px){.ps-tutorial-r6-grid,.ps-tutorial-r6-links{grid-template-columns:1fr}}
          /* FUNERAL TUTORIAL R6 END */
          '''

          section = r'''
          <section class="dpro-section ps-section-soft master-section" data-master-section="11.5" id="tutorial-guide" aria-labelledby="tutorial-guide-title" data-r6-version="DPRO_FUNERAL_R6_20260829_V1"><div class="dpro-container"><div class="ps-section-heading"><p class="ps-kicker">TUTORIAL / GUIDE / MANUALS</p><h2 id="tutorial-guide-title">操作ガイドとPDFマニュアル。</h2><p>First10の順番で実画面を確認し、必要に応じてGuide CenterとA4マニュアルを開けます。</p></div><div class="ps-tutorial-r6-grid"><article class="ps-tutorial-r6-card"><h3>画面を見ながら確認する</h3><p>Tutorialは対象箇所を案内するガイドです。相談送信、資料請求送信、家族登録、状態変更、公開、メッセージ・通知送信などの業務更新を自動実行しません。</p><div class="ps-tutorial-r6-links"><a class="ps-tutorial-r6-link" data-r6-resource="tutorial-start" href="https://dpromstk2000-lab.github.io/dpro-funeral-line/demo-guide.html" target="_blank" rel="noopener">Tutorial Start</a><a class="ps-tutorial-r6-link" data-r6-resource="guide-center" href="https://dpromstk2000-lab.github.io/dpro-funeral-line/demo-guide.html#guideCenter" target="_blank" rel="noopener">Guide Center</a></div></article><article class="ps-tutorial-r6-card"><h3>紙・PDFで確認する</h3><p>初回確認用のQuick Startと、First10・安全操作をまとめた詳細マニュアルを公開PDFで確認できます。</p><div class="ps-tutorial-r6-links"><a class="ps-tutorial-r6-link" data-r6-resource="quick-start-pdf" href="https://dpromstk2000-lab.github.io/dpro-funeral-line/manuals/DPRO_TUTORIAL_FUNERAL_QUICK_START_V1.0.pdf" target="_blank" rel="noopener">Quick Start PDF</a><a class="ps-tutorial-r6-link" data-r6-resource="detailed-manual-pdf" href="https://dpromstk2000-lab.github.io/dpro-funeral-line/manuals/DPRO_TUTORIAL_FUNERAL_DETAILED_MANUAL_V1.0.pdf" target="_blank" rel="noopener">詳細マニュアル PDF</a></div></article></div><div class="ps-tutorial-r6-safe"><strong>安全：</strong>公開デモには実在するご家族・故人の氏名、住所、連絡先、宗教・宗派、相談内容、葬儀・法要予定などを入力しないでください。Tutorial確認は見る・移動する・戻る操作を中心に行います。</div></div></section>
          '''

          final_marker = '<section class="dpro-section ps-final master-section" data-master-section="12" id="final-cta"'
          if 'id="tutorial-guide"' not in s:
              if '</style>' not in s or final_marker not in s:
                  raise SystemExit("Safe insertion marker missing")
              s = s.replace('</style>', css + '\n</style>', 1)
              s = s.replace(final_marker, section + final_marker, 1)

          required = [
              'data-r6-version="DPRO_FUNERAL_R6_20260829_V1"',
              'data-r6-resource="tutorial-start"',
              'data-r6-resource="guide-center"',
              'data-r6-resource="quick-start-pdf"',
              'data-r6-resource="detailed-manual-pdf"',
              'DPRO_TUTORIAL_FUNERAL_QUICK_START_V1.0.pdf',
              'DPRO_TUTORIAL_FUNERAL_DETAILED_MANUAL_V1.0.pdf',
          ]
          for token in required:
              if token not in s:
                  raise SystemExit("R6 token missing after patch: " + token)
          for token in must_keep:
              if token not in s:
                  raise SystemExit("Preserved product token lost after R6: " + token)

          data = s.encode("utf-8")
          html.write_bytes(data)
          mirror.write_bytes(data)
          if html.read_bytes() != mirror.read_bytes():
              raise SystemExit("HTML/TEXT mirror not byte-identical after patch")

          print("FUNERAL R6 target-only patch=PASS")
          PY

          changed="$(git diff --name-only)"
          printf '%s\n' "$changed" | tee r6-evidence/R6_CHANGED_FILES.txt
          test "$(printf '%s\n' "$changed" | sed '/^$/d' | sort | tr '\n' ' ')" = "systems/funeral.html systems/funeral.html.txt "

          cmp -s systems/funeral.html systems/funeral.html.txt
          {
            echo "TARGET_SCOPE_ONLY=PASS"
            echo "HTML_TEXT_BYTE_IDENTICAL=PASS"
            echo "AFTER_HTML_SHA256=$(sha256sum systems/funeral.html | awk '{print $1}')"
            echo "AFTER_TEXT_SHA256=$(sha256sum systems/funeral.html.txt | awk '{print $1}')"
            echo "AFTER_HTML_BLOB=$(git hash-object systems/funeral.html)"
            echo "AFTER_TEXT_BLOB=$(git hash-object systems/funeral.html.txt)"
          } | tee r6-evidence/R6_TARGET_AFTER.txt

      - name: Commit FUNERAL R6 target files forward-only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add systems/funeral.html systems/funeral.html.txt
          if ! git diff --cached --quiet; then
            git commit -m 'FUNERAL R6 integrate Tutorial and manual resources [skip ci]'
            # Clean commit exists now, so rebase safely on any newer Product Site main.
            git pull --rebase origin main
            git push origin main
          fi

          PRODUCT_COMMIT="$(git rev-parse HEAD)"
          PRODUCT_TREE="$(git rev-parse HEAD^{tree})"
          {
            echo "R6_PRODUCT_COMMIT=$PRODUCT_COMMIT"
            echo "R6_PRODUCT_TREE=$PRODUCT_TREE"
            echo "FORWARD_ONLY=PASS"
            echo "PRODUCT_SITE_ROLLBACK=0"
          } | tee r6-evidence/R6_FORWARD_ONLY_EVIDENCE.txt

      - name: Wait until public Product Site contains FUNERAL R6
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 72); do
            body="$(curl -fsSL --max-time 30 -H 'Cache-Control: no-cache' "${PRODUCT_URL}?r6=$(date +%s)" || true)"
            if printf '%s' "$body" | grep -q 'DPRO_FUNERAL_R6_20260829_V1' \
              && printf '%s' "$body" | grep -q 'data-r6-resource="tutorial-start"' \
              && printf '%s' "$body" | grep -q 'DPRO_TUTORIAL_FUNERAL_DETAILED_MANUAL_V1.0.pdf'; then
              echo "PRODUCT_SITE_PUBLIC_R6=PASS"
              exit 0
            fi
            sleep 10
          done
          echo "Product Site did not publish FUNERAL R6 in time"
          exit 1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        shell: bash
        run: |
          set -euo pipefail
          npm --version
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Exact four-width public R6 LIVE QA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p r6-evidence/screenshots
          cat > r6-evidence/funeral-r6-live-qa.cjs <<'JS'
          const { chromium } = require('playwright');
          const fs = require('fs');

          const PRODUCT = process.env.PRODUCT_URL;
          const expectedLinks = {
            'tutorial-start': process.env.TUTORIAL_START_URL,
            'guide-center': process.env.GUIDE_CENTER_URL,
            'quick-start-pdf': process.env.QUICK_START_PDF_URL,
            'detailed-manual-pdf': process.env.DETAILED_MANUAL_PDF_URL,
          };
          const viewports = [
            ['1440x1000', 1440, 1000],
            ['1024x768', 1024, 768],
            ['390x844', 390, 844],
            ['320x720', 320, 720],
          ];
          const result = {
            result: 'PASS',
            failures: [],
            links: {},
            viewports: {},
            unsafeWriteRequests: [],
            businessMutation: 0,
            productSiteRollback: 0,
            forwardOnly: 'PASS',
            r7: 'NOT_AUTHORIZED_NOT_EXECUTED',
          };

          function fail(msg) {
            result.failures.push(msg);
            result.result = 'HOLD';
          }

          async function publicReachable(url, kind) {
            const networkUrl = url.split('#')[0] + (url.includes('?') ? '&' : '?') + 'r6check=' + Date.now();
            try {
              const r = await fetch(networkUrl, { redirect: 'follow', headers: {'Cache-Control':'no-cache'} });
              const b = Buffer.from(await r.arrayBuffer());
              if (r.status !== 200) fail(`${kind}: HTTP ${r.status}`);
              if (kind.includes('pdf') && b.subarray(0,4).toString() !== '%PDF') fail(`${kind}: not PDF`);
              if (kind === 'tutorial-start' || kind === 'guide-center') {
                const t = b.toString('utf8');
                if (!t.includes('id="guideStart"')) fail(`${kind}: guideStart missing`);
                if (!t.includes('id="guideCenter"')) fail(`${kind}: guideCenter missing`);
              }
              result.links[kind] = {url, status:r.status, bytes:b.length};
            } catch(e) {
              fail(`${kind}: ${e.message}`);
            }
          }

          (async()=>{
            for (const [kind,url] of Object.entries(expectedLinks)) await publicReachable(url, kind);

            const browser = await chromium.launch({headless:true});
            for (const [name,width,height] of viewports) {
              const context = await browser.newContext({viewport:{width,height}});
              const page = await context.newPage();
              const pageErrors = [];
              const consoleErrors = [];
              const requests = [];
              page.on('pageerror', e => pageErrors.push(String(e)));
              page.on('console', m => { if (m.type()==='error') consoleErrors.push(m.text()); });
              page.on('request', r => {
                const method = r.method().toUpperCase();
                if (!['GET','HEAD','OPTIONS'].includes(method)) {
                  requests.push({method,url:r.url()});
                  result.unsafeWriteRequests.push({viewport:name,method,url:r.url()});
                }
              });

              const response = await page.goto(PRODUCT + '?funeral-r6-qa=' + Date.now(), {waitUntil:'domcontentloaded', timeout:60000});
              if (!response || response.status() !== 200) fail(`${name}: product HTTP ${response && response.status()}`);

              const baseline = await page.evaluate(() => ({
                hero: document.querySelector('#hero-title')?.textContent || '',
                lineHref: document.querySelector('a[href="https://lin.ee/YxJGXV6D"]')?.getAttribute('href') || '',
                price: document.body.innerText.includes('5,500円'),
                liveDemo: !!document.querySelector('[href*="dpro-funeral-line/owner.html?demo=1"]'),
                lp: !!document.querySelector('a[href="../lp-funeral.html"]'),
                flyer: !!document.querySelector('a[href="../flyer-funeral.html"]'),
                flyerPdf: !!document.querySelector('a[href="../flyer-funeral.pdf"]'),
                systemsData: !!document.querySelector('script[src="../systems-data.js"]'),
                dproJs: !!document.querySelector('script[src="../dpro-v3.js"]'),
              }));
              if (!baseline.hero.includes('事前相談から葬儀後・法要まで')) fail(`${name}: hero regression`);
              if (baseline.lineHref !== 'https://lin.ee/YxJGXV6D') fail(`${name}: LINE CTA regression`);
              for (const k of ['price','liveDemo','lp','flyer','flyerPdf','systemsData','dproJs']) {
                if (!baseline[k]) fail(`${name}: baseline ${k} regression`);
              }

              const section = page.locator('#tutorial-guide');
              if (await section.count() !== 1) fail(`${name}: tutorial section count`);
              await section.scrollIntoViewIfNeeded();

              const links = page.locator('#tutorial-guide [data-r6-resource]');
              if (await links.count() !== 4) fail(`${name}: resource link count != 4`);
              for (const [kind,url] of Object.entries(expectedLinks)) {
                const loc = page.locator(`#tutorial-guide [data-r6-resource="${kind}"]`);
                if (await loc.count() !== 1) {
                  fail(`${name}: ${kind} link missing`);
                  continue;
                }
                const href = await loc.getAttribute('href');
                if (href !== url) fail(`${name}: ${kind} href mismatch: ${href}`);
                if (!(await loc.isVisible())) fail(`${name}: ${kind} not visible`);
              }

              const focus = await page.locator('#tutorial-guide [data-r6-resource="tutorial-start"]').evaluate(el => {
                el.focus();
                const cs = getComputedStyle(el);
                return {
                  tag: el.tagName,
                  tabIndex: el.tabIndex,
                  outlineStyle: cs.outlineStyle,
                  outlineWidth: cs.outlineWidth,
                };
              });
              if (focus.tag !== 'A' || focus.tabIndex < 0 || focus.outlineStyle === 'none' || focus.outlineWidth === '0px') {
                fail(`${name}: keyboard focus not visibly recoverable`);
              }

              const metrics = await page.evaluate(() => ({
                innerWidth: window.innerWidth,
                documentElementScrollWidth: document.documentElement.scrollWidth,
                bodyScrollWidth: document.body.scrollWidth,
              }));
              const positiveOverflow =
                Math.max(metrics.documentElementScrollWidth, metrics.bodyScrollWidth) > metrics.innerWidth;
              if (positiveOverflow) fail(`${name}: positive horizontal overflow`);

              const attributablePageErrors = pageErrors.filter(x =>
                /tutorial|guideCenter|DPRO_TUTORIAL_FUNERAL|funeral-r6/i.test(x));
              const attributableConsole = consoleErrors.filter(x =>
                /tutorial|guideCenter|DPRO_TUTORIAL_FUNERAL|funeral-r6/i.test(x));
              if (attributablePageErrors.length) fail(`${name}: tutorial-attributable pageerror`);
              if (attributableConsole.length) fail(`${name}: tutorial-attributable console error`);
              if (requests.length) fail(`${name}: unsafe write request`);

              await page.screenshot({path:`r6-evidence/screenshots/${name}.png`, fullPage:true});
              result.viewports[name] = {
                baseline,
                resourceCount: await links.count(),
                keyboardFocus: focus,
                metrics,
                positiveHorizontalOverflow: positiveOverflow ? 1 : 0,
                pageErrors,
                consoleErrors,
                tutorialAttributablePageErrors: attributablePageErrors,
                tutorialAttributableConsoleErrors: attributableConsole,
                unsafeWriteRequests: requests,
              };
              await context.close();
            }
            await browser.close();

            const mobile390 = result.viewports['390x844']?.metrics || {};
            const mobile320 = result.viewports['320x720']?.metrics || {};
            result.summary = {
              FETCH_NEWEST_PRODUCT_MAIN_PREWRITE: 'PASS',
              FORWARD_ONLY: result.forwardOnly,
              TARGET_SCOPE_ONLY: 'PASS',
              HTML_TEXT_BYTE_IDENTICAL: 'PASS',
              TUTORIAL_START_LINK: result.links['tutorial-start']?.status===200?'PASS':'FAIL',
              GUIDE_CENTER_LINK: result.links['guide-center']?.status===200?'PASS':'FAIL',
              QUICK_START_PDF_LINK: result.links['quick-start-pdf']?.status===200?'PASS':'FAIL',
              DETAILED_MANUAL_PDF_LINK: result.links['detailed-manual-pdf']?.status===200?'PASS':'FAIL',
              ALL_4_LINKS_PUBLIC_REACHABLE: Object.keys(result.links).length===4?'PASS':'FAIL',
              '1440x1000': result.failures.some(x=>x.startsWith('1440x1000:'))?'FAIL':'PASS',
              '1024x768': result.failures.some(x=>x.startsWith('1024x768:'))?'FAIL':'PASS',
              '390x844': result.failures.some(x=>x.startsWith('390x844:'))?'FAIL':'PASS',
              '320x720': result.failures.some(x=>x.startsWith('320x720:'))?'FAIL':'PASS',
              '390_INNER_WIDTH': mobile390.innerWidth,
              '390_DOCUMENT_ELEMENT_SCROLL_WIDTH': mobile390.documentElementScrollWidth,
              '390_BODY_SCROLL_WIDTH': mobile390.bodyScrollWidth,
              '320_INNER_WIDTH': mobile320.innerWidth,
              '320_DOCUMENT_ELEMENT_SCROLL_WIDTH': mobile320.documentElementScrollWidth,
              '320_BODY_SCROLL_WIDTH': mobile320.bodyScrollWidth,
              POSITIVE_HORIZONTAL_OVERFLOW: result.failures.some(x=>x.includes('positive horizontal overflow'))?1:0,
              KEYBOARD_FOCUS_VISIBLE: result.failures.some(x=>x.includes('keyboard focus'))?'FAIL':'PASS',
              TUTORIAL_ATTRIBUTABLE_PAGEERROR: result.failures.some(x=>x.includes('pageerror'))?1:0,
              TUTORIAL_ATTRIBUTABLE_CONSOLE_ERROR: result.failures.some(x=>x.includes('console error'))?1:0,
              UNSAFE_WRITE_REQUEST: result.unsafeWriteRequests.length,
              BUSINESS_MUTATION: result.businessMutation,
              PRODUCT_SITE_REGRESSION: result.failures.some(x=>x.includes('regression'))?1:0,
              PRODUCT_SITE_ROLLBACK: result.productSiteRollback,
              R7: result.r7,
              FINAL_LOCK: 'CENTRAL_DECISION_ONLY',
              FAILURE_COUNT: result.failures.length,
              RESULT: result.result,
            };

            fs.writeFileSync('r6-evidence/R6_LIVE_QA.json', JSON.stringify(result,null,2));
            const lines = Object.entries(result.summary).map(([k,v])=>`${k}=${v}`);
            if (result.failures.length) lines.push(...result.failures.map(x=>'FAILURE='+x));
            fs.writeFileSync('r6-evidence/R6_LIVE_QA.txt', lines.join('\n')+'\n');
            console.log(lines.join('\n'));
            if (result.failures.length) process.exit(1);
          })().catch(e=>{ console.error(e); process.exit(1); });
