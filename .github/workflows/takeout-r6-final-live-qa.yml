name: TAKEOUT Tutorial R6 Final LIVE QA V1.2

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/takeout-r6-final-live-qa.yml"

permissions:
  contents: write

concurrency:
  group: takeout-tutorial-r6-final-live-qa
  cancel-in-progress: false

jobs:
  final-live-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PRODUCT_URL: https://dpromstk2000-lab.github.io/dpro-line-systems-site/systems/takeout.html
      WORKFLOW_PATH: .github/workflows/takeout-r6-final-live-qa.yml
      TARGET_HTML: systems/takeout.html
      TARGET_TEXT: systems/takeout.html.txt
      R6_INTEGRATION_HEAD: 6bae91af90c9a250c50cdfee55c9ba870741085f
      R6_INTEGRATION_TREE: e2c4c27cb0988a26f7b6545401defe6bbf0c6cb0
      TUTORIAL_URL: https://dpromstk2000-lab.github.io/dpro-takeout-line-liff/index.html?preview=1&tutorial=1
      GUIDE_URL: https://dpromstk2000-lab.github.io/dpro-takeout-line-liff/guide-center.html
      QUICK_URL: https://dpromstk2000-lab.github.io/dpro-takeout-line-liff/DPRO_TUTORIAL_TAKEOUT_QUICK_START_V1.0.pdf
      DETAIL_URL: https://dpromstk2000-lab.github.io/dpro-takeout-line-liff/DPRO_TUTORIAL_TAKEOUT_DETAILED_MANUAL_V1.0.pdf

    steps:
      - name: Checkout workflow upload commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify QA-only upload and newest forward-only TAKEOUT state
        id: base
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa-r6-final
          git fetch origin main

          upload_head="$(git rev-parse HEAD)"
          upload_parent="$(git rev-parse HEAD^)"
          newest_head="$(git rev-parse origin/main)"
          newest_tree="$(git rev-parse "origin/main^{tree}")"

          mapfile -t changed < <(git diff --name-only "$upload_parent" "$upload_head")
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = "$WORKFLOW_PATH"

          git merge-base --is-ancestor "$upload_head" "$newest_head"
          git merge-base --is-ancestor "$R6_INTEGRATION_HEAD" "$newest_head"

          git show "origin/main:$TARGET_HTML" > /tmp/takeout-current.html
          git show "origin/main:$TARGET_TEXT" > /tmp/takeout-current.txt
          git show "$R6_INTEGRATION_HEAD:$TARGET_HTML" > /tmp/takeout-r6.html
          git show "$R6_INTEGRATION_HEAD:$TARGET_TEXT" > /tmp/takeout-r6.txt

          test -s /tmp/takeout-current.html
          test -s /tmp/takeout-current.txt
          cmp -s /tmp/takeout-current.html /tmp/takeout-current.txt
          cmp -s /tmp/takeout-r6.html /tmp/takeout-current.html
          cmp -s /tmp/takeout-r6.txt /tmp/takeout-current.txt

          grep -q 'DPRO TUTORIAL TAKEOUT R6' /tmp/takeout-current.html
          grep -q 'data-r6-resource="tutorial"' /tmp/takeout-current.html
          grep -q 'data-r6-resource="guide"' /tmp/takeout-current.html
          grep -q 'data-r6-resource="quick"' /tmp/takeout-current.html
          grep -q 'data-r6-resource="detail"' /tmp/takeout-current.html

          integration_parent="$(git rev-parse "${R6_INTEGRATION_HEAD}^")"
          git diff --name-status "$integration_parent" "$R6_INTEGRATION_HEAD" > qa-r6-final/r6-integration-changed.txt
          test "$(wc -l < qa-r6-final/r6-integration-changed.txt)" -eq 3
          grep -q $'D\t.github/workflows/takeout-r6-product-site.yml' qa-r6-final/r6-integration-changed.txt
          grep -q $'M\tsystems/takeout.html' qa-r6-final/r6-integration-changed.txt
          grep -q $'M\tsystems/takeout.html.txt' qa-r6-final/r6-integration-changed.txt

          printf '%s\n' "$upload_head" > qa-r6-final/workflow-upload-head.txt
          printf '%s\n' "$upload_parent" > qa-r6-final/workflow-upload-parent.txt
          printf '%s\n' "$newest_head" > qa-r6-final/product-site-head-before-final-qa.txt
          printf '%s\n' "$newest_tree" > qa-r6-final/product-site-tree-before-final-qa.txt
          printf '%s\n' "$R6_INTEGRATION_HEAD" > qa-r6-final/r6-integration-head.txt
          printf '%s\n' "$R6_INTEGRATION_TREE" > qa-r6-final/r6-integration-tree.txt
          sha256sum /tmp/takeout-current.html /tmp/takeout-current.txt > qa-r6-final/target-sha256-before-final-qa.txt

      - name: Setup Node for final LIVE QA
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run TAKEOUT R6 exact-width LIVE QA V1.2
        shell: bash
        run: |
          set -euo pipefail

          cat > takeout-r6-final-live-qa.mjs <<'NODE'
          import { chromium } from 'playwright';
          import fs from 'node:fs';

          const productUrl = process.env.PRODUCT_URL;
          const expected = {
            tutorial: process.env.TUTORIAL_URL,
            guide: process.env.GUIDE_URL,
            quick: process.env.QUICK_URL,
            detail: process.env.DETAIL_URL
          };
          const viewports = [
            {name:'1440',width:1440,height:1000},
            {name:'1024',width:1024,height:768},
            {name:'390',width:390,height:844},
            {name:'320',width:320,height:720}
          ];

          const result = {
            schema:'DPRO_TUTORIAL_TAKEOUT_R6_FINAL_LIVE_QA_V1.2',
            productUrl,
            expected,
            integrationHead:process.env.R6_INTEGRATION_HEAD,
            integrationTree:process.env.R6_INTEGRATION_TREE,
            viewports:[],
            resourceChecks:{},
            businessMutationAttempts:[],
            failures:[],
            productSiteRollback:0,
            businessMutation:0,
            forwardOnly:true
          };

          const browser = await chromium.launch({headless:true});

          const requestContext = await browser.newContext();
          const requestPage = await requestContext.newPage();
          for (const [key,url] of Object.entries(expected)) {
            try {
              const resp = await requestPage.request.get(url,{timeout:30000});
              const ct = String(resp.headers()['content-type'] || '');
              const pdfExpected = key === 'quick' || key === 'detail';
              const ok = resp.status() === 200 && (!pdfExpected || ct.toLowerCase().includes('pdf'));
              result.resourceChecks[key] = {url,status:resp.status(),contentType:ct,ok};
              if (!ok) result.failures.push(`resource ${key}: status=${resp.status()} content-type=${ct}`);
            } catch (e) {
              result.resourceChecks[key] = {url,error:String(e),ok:false};
              result.failures.push(`resource ${key}: ${String(e)}`);
            }
          }
          await requestContext.close();

          for (const vp of viewports) {
            const context = await browser.newContext({viewport:{width:vp.width,height:vp.height}});
            const pageErrors = [];
            const consoleErrors = [];
            const unsafe = [];

            await context.route('**/*', async route => {
              const method = route.request().method();
              if (['POST','PUT','PATCH','DELETE'].includes(method)) {
                const rec = {viewport:vp.name,method,url:route.request().url()};
                unsafe.push(rec);
                result.businessMutationAttempts.push(rec);
                return route.abort('blockedbyclient');
              }
              return route.continue();
            });

            const page = await context.newPage();
            page.on('pageerror', e => pageErrors.push(String(e)));
            page.on('console', m => {
              if (m.type() === 'error') {
                consoleErrors.push({text:m.text(),location:m.location()});
              }
            });

            const resp = await page.goto(`${productUrl}?qa=${Date.now()}-${vp.name}`,{
              waitUntil:'networkidle',
              timeout:45000
            });
            if (!resp || resp.status() !== 200) {
              result.failures.push(`${vp.name}: product status ${resp?.status()}`);
            }

            const data = await page.evaluate(() => ({
              innerWidth: window.innerWidth,
              documentScrollWidth: document.documentElement.scrollWidth,
              bodyScrollWidth: document.body.scrollWidth,
              marker: document.documentElement.innerHTML.includes('DPRO TUTORIAL TAKEOUT R6'),
              links: [...document.querySelectorAll('[data-r6-resource]')].map(a => ({
                key:a.getAttribute('data-r6-resource'),
                href:a.href,
                text:(a.textContent||'').trim(),
                tabIndex:a.tabIndex
              })),
              pricing: (document.body.textContent||'').includes('5,500円'),
              lineCta: [...document.querySelectorAll('a')].some(a => a.href === 'https://lin.ee/YxJGXV6D'),
              demo: [...document.querySelectorAll('a')].some(a => a.href.includes('/dpro-takeout-line-liff/index.html?preview=1&v=takeout-18-check')),
              lp: [...document.querySelectorAll('a')].some(a => a.getAttribute('href') === '../lp-takeout.html'),
              flyerHtml: [...document.querySelectorAll('a')].some(a => a.getAttribute('href') === '../flyer-takeout.html'),
              flyerPdf: [...document.querySelectorAll('a')].some(a => a.getAttribute('href') === '../flyer-takeout.pdf'),
              systemsData: [...document.scripts].some(s => s.getAttribute('src') === '../systems-data.js'),
              sharedJs: [...document.scripts].some(s => s.getAttribute('src') === '../dpro-v3.js')
            }));

            if (!data.marker) result.failures.push(`${vp.name}: R6 marker missing`);

            const linkMap = Object.fromEntries(data.links.map(x => [x.key,x.href]));
            if (data.links.length !== 4) result.failures.push(`${vp.name}: resource link count ${data.links.length}`);
            for (const [key,url] of Object.entries(expected)) {
              if (linkMap[key] !== url) result.failures.push(`${vp.name}: ${key} link mismatch: ${linkMap[key]}`);
            }

            if (!data.pricing) result.failures.push(`${vp.name}: pricing regression`);
            if (!data.lineCta) result.failures.push(`${vp.name}: LINE CTA regression`);
            if (!data.demo) result.failures.push(`${vp.name}: DEMO regression`);
            if (!data.lp) result.failures.push(`${vp.name}: LP regression`);
            if (!data.flyerHtml) result.failures.push(`${vp.name}: flyer HTML regression`);
            if (!data.flyerPdf) result.failures.push(`${vp.name}: flyer PDF regression`);
            if (!data.systemsData || !data.sharedJs) result.failures.push(`${vp.name}: shared asset regression`);

            const overflow = {
              innerWidth:data.innerWidth,
              documentScrollWidth:data.documentScrollWidth,
              bodyScrollWidth:data.bodyScrollWidth,
              documentOverflow:Math.max(0,data.documentScrollWidth-data.innerWidth),
              bodyOverflow:Math.max(0,data.bodyScrollWidth-data.innerWidth)
            };
            if (vp.width <= 390 && (overflow.documentOverflow !== 0 || overflow.bodyOverflow !== 0)) {
              result.failures.push(`${vp.name}: mobile overflow`);
            }

            // V1.2 focus QA:
            // Avoid the old false-negative caused by assuming the R6 links must be
            // reached within an arbitrary 100 Tabs from the document start.
            // For each resource link, place a temporary starting focus on that link,
            // then use real keyboard traversal Shift+Tab -> Tab and prove that the
            // browser returns to the same link with :focus-visible and visible focus paint.
            const keyboardFocus = {};
            for (const key of Object.keys(expected)) {
              const link = page.locator(`[data-r6-resource="${key}"]`).first();
              const count = await link.count();
              if (count !== 1) {
                keyboardFocus[key] = {ok:false,reason:`locator count ${count}`};
                result.failures.push(`${vp.name}: ${key} keyboard locator count ${count}`);
                continue;
              }

              const visible = await link.isVisible();
              const tabbable = await link.evaluate(el =>
                el instanceof HTMLElement &&
                el.tabIndex >= 0 &&
                !el.hasAttribute('disabled') &&
                el.getAttribute('aria-disabled') !== 'true'
              );

              await link.scrollIntoViewIfNeeded();
              await link.focus();
              await page.keyboard.press('Shift+Tab');
              await page.keyboard.press('Tab');

              const rec = await page.evaluate((key) => {
                const a = document.activeElement;
                if (!(a instanceof HTMLElement)) {
                  return {key,active:false};
                }
                const r = a.getBoundingClientRect();
                const cs = getComputedStyle(a);
                const outlineWidth = parseFloat(cs.outlineWidth || '0') || 0;
                const focusPaint =
                  (cs.outlineStyle !== 'none' && outlineWidth > 0) ||
                  (cs.boxShadow && cs.boxShadow !== 'none');
                return {
                  key,
                  active:true,
                  activeKey:a.getAttribute('data-r6-resource'),
                  sameKey:a.getAttribute('data-r6-resource') === key,
                  focusVisible:a.matches(':focus-visible'),
                  focusPaint,
                  outlineStyle:cs.outlineStyle,
                  outlineWidth:cs.outlineWidth,
                  boxShadow:cs.boxShadow,
                  left:r.left,top:r.top,right:r.right,bottom:r.bottom,
                  width:r.width,height:r.height,
                  innerWidth:window.innerWidth,innerHeight:window.innerHeight,
                  inViewport:
                    r.width > 0 && r.height > 0 &&
                    r.left >= -1 && r.right <= window.innerWidth + 1 &&
                    r.top >= -1 && r.bottom <= window.innerHeight + 1
                };
              }, key);

              const ok =
                visible &&
                tabbable &&
                rec.active === true &&
                rec.sameKey === true &&
                rec.focusVisible === true &&
                rec.focusPaint === true &&
                rec.inViewport === true;

              keyboardFocus[key] = {visible,tabbable,...rec,ok};

              if (!ok) {
                result.failures.push(
                  `${vp.name}: ${key} keyboard focus fail ` +
                  `visible=${visible} tabbable=${tabbable} sameKey=${rec.sameKey} ` +
                  `focusVisible=${rec.focusVisible} focusPaint=${rec.focusPaint} inViewport=${rec.inViewport}`
                );
              }
            }

            const tutorialConsole = consoleErrors.filter(e =>
              String(e.location?.url || '').includes('/systems/takeout.html')
            );
            if (pageErrors.length) result.failures.push(`${vp.name}: pageerror ${pageErrors.join(' | ')}`);
            if (tutorialConsole.length) result.failures.push(`${vp.name}: Tutorial integration console error`);
            if (unsafe.length) result.failures.push(`${vp.name}: unsafe write attempts ${unsafe.length}`);

            await page.screenshot({
              path:`qa-r6-final/takeout-r6-${vp.name}.png`,
              fullPage:true
            });

            result.viewports.push({
              viewport:vp,
              data,
              overflow,
              keyboardFocus,
              pageErrors,
              consoleErrors,
              tutorialConsole,
              unsafe
            });

            await context.close();
          }

          await browser.close();

          if (result.businessMutationAttempts.length) {
            result.businessMutation = 'BLOCKED_UNSAFE_ATTEMPT_PRESENT';
          }

          result.pass =
            result.failures.length === 0 &&
            result.businessMutationAttempts.length === 0 &&
            result.businessMutation === 0 &&
            result.productSiteRollback === 0 &&
            result.forwardOnly === true;

          fs.writeFileSync(
            'qa-r6-final/takeout-r6-final-live-qa.json',
            JSON.stringify(result,null,2)
          );

          console.log(JSON.stringify({
            pass:result.pass,
            failures:result.failures,
            resourceChecks:result.resourceChecks,
            mobile390:result.viewports.find(v=>v.viewport.name==='390')?.overflow,
            mobile320:result.viewports.find(v=>v.viewport.name==='320')?.overflow,
            businessMutation:result.businessMutation,
            productSiteRollback:result.productSiteRollback,
            forwardOnly:result.forwardOnly
          },null,2));

          if (!result.pass) process.exit(1);
          NODE

          node takeout-r6-final-live-qa.mjs

      - name: Verify newest main still preserves TAKEOUT R6 exactly
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main

          current_head="$(git rev-parse origin/main)"
          current_tree="$(git rev-parse "origin/main^{tree}")"
          git merge-base --is-ancestor "$R6_INTEGRATION_HEAD" "$current_head"

          git show "origin/main:$TARGET_HTML" > /tmp/takeout-current-after.html
          git show "origin/main:$TARGET_TEXT" > /tmp/takeout-current-after.txt
          git show "$R6_INTEGRATION_HEAD:$TARGET_HTML" > /tmp/takeout-r6-after.html

          cmp -s /tmp/takeout-current-after.html /tmp/takeout-current-after.txt
          cmp -s /tmp/takeout-r6-after.html /tmp/takeout-current-after.html

          printf '%s\n' "$current_head" > qa-r6-final/product-site-head-after-final-qa-before-cleanup.txt
          printf '%s\n' "$current_tree" > qa-r6-final/product-site-tree-after-final-qa-before-cleanup.txt
          sha256sum /tmp/takeout-current-after.html /tmp/takeout-current-after.txt > qa-r6-final/target-sha256-after-final-qa.txt

      - name: Self-remove temporary final QA workflow forward-only
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          cp -a qa-r6-final /tmp/qa-r6-final-preserved

          pushed=0
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main

            current_head="$(git rev-parse HEAD)"
            git merge-base --is-ancestor "$R6_INTEGRATION_HEAD" "$current_head"

            git show "$R6_INTEGRATION_HEAD:$TARGET_HTML" > /tmp/r6-cleanup-source.html
            cmp -s /tmp/r6-cleanup-source.html "$TARGET_HTML"
            cmp -s "$TARGET_HTML" "$TARGET_TEXT"

            if [ ! -e "$WORKFLOW_PATH" ]; then
              cleanup_head="$(git rev-parse HEAD)"
              cleanup_tree="$(git rev-parse "HEAD^{tree}")"
              pushed=1
              break
            fi

            git rm "$WORKFLOW_PATH"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Remove TAKEOUT R6 final QA workflow after PASS [skip ci]"

            if git push origin HEAD:main; then
              cleanup_head="$(git rev-parse HEAD)"
              cleanup_tree="$(git rev-parse "HEAD^{tree}")"
              pushed=1
              break
            fi
          done

          test "$pushed" -eq 1

          rm -rf qa-r6-final
          cp -a /tmp/qa-r6-final-preserved qa-r6-final
          printf '%s\n' "$cleanup_head" > qa-r6-final/product-site-final-head-after-cleanup.txt
          printf '%s\n' "$cleanup_tree" > qa-r6-final/product-site-final-tree-after-cleanup.txt
          printf '%s\n' "WORKFLOW_REMOVED=PASS" > qa-r6-final/workflow-cleanup.txt

      - name: Upload TAKEOUT R6 final QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: takeout-r6-final-live-qa-evidence-v1-2
          path: qa-r6-final
          if-no-files-found: error
          retention-days: 30
