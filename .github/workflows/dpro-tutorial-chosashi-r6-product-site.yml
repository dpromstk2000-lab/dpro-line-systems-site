name: DPRO Tutorial CHOSASHI R6 Product Site + LIVE QA V1.0

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/dpro-tutorial-chosashi-r6-product-site.yml"

permissions:
  contents: write
  actions: read

concurrency:
  group: dpro-tutorial-chosashi-r6-product-site
  cancel-in-progress: true

env:
  PRODUCT_SITE_BASE_HEAD: 05e753e2b37a4cd5a8d112924c0fc2cbf3fd4dcc
  INDUSTRY_BASE_HEAD: 2c3694e9ef56da33206b97418794dc2aa0f10b97
  INDUSTRY_BASE_TREE: 9572fbedeed8ea9113781b2c53cbcb37c9d22bb3
  INDUSTRY_REPO: dpromstk2000-lab/dpro-chosashi-line-liff
  INDUSTRY_BASE: https://dpromstk2000-lab.github.io/dpro-chosashi-line-liff
  PRODUCT_PAGE: https://dpromstk2000-lab.github.io/dpro-line-systems-site/systems/chosashi.html
  QUICK_PDF: CHOSASHI_R5_QUICK_START.pdf
  DETAIL_PDF: CHOSASHI_R5_DETAILED_MANUAL.pdf
  QUICK_PNG: CHOSASHI_R5_QUICK_START_P01.png
  DETAIL_PNG: CHOSASHI_R5_DETAILED_MANUAL_P01.png
  QUICK_PDF_SHA256: 32730bdb26524c4bdf3cb633f1fb7d88770303263b193c5e2734e62c4ca5510f
  DETAIL_PDF_SHA256: ce7fe7c2b2a460c4ee3e2682ad15d74a26c84313a18a6a08aaaef49ff67d5bf4
  QUICK_PNG_SHA256: 165152011b25efa62cc998b474e1ba00efc8637ff0702b9e69fe4dffb60f5580
  DETAIL_PNG_SHA256: a47aa2560116fe43ca9d31245b3669750179d9d05d3ccb8cab7f53175cf18e22

jobs:
  r6-product-site-live-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout newest Product Site main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Record locks and enforce forward-only Product Site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa-r6
          git rev-parse HEAD | tee qa-r6/product-site-head-before.txt
          git rev-parse HEAD^{tree} | tee qa-r6/product-site-tree-before.txt
          git merge-base --is-ancestor "$PRODUCT_SITE_BASE_HEAD" HEAD
          printf 'FORWARD_ONLY=PASS\nBASE=%s\nCURRENT=%s\n' "$PRODUCT_SITE_BASE_HEAD" "$(git rev-parse HEAD)" > qa-r6/product-site-forward-lock.txt

      - name: Verify predecessor R6 preservation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          checks={
            'systems/cosmetics.html':[
              'DPRO_TUTORIAL_COSMETICS_R6',
              'dpro-cosmetics-line-liff/guide-center.html',
              'DPRO_TUTORIAL_COSMETICS_QUICK_START_V1.0.pdf',
              'DPRO_TUTORIAL_COSMETICS_DETAILED_MANUAL_V1.0.pdf',
            ],
            'systems/flower-shop.html':[
              'dpro-flower-line-liff/guide-center.html',
              'DPRO_TUTORIAL_FLOWER_QUICK_START_V1.0.pdf',
              'DPRO_TUTORIAL_FLOWER_DETAILED_MANUAL_V1.0.pdf',
            ],
            'systems/yakiniku.html':[
              'data-dpro-tutorial-r6="1"',
              'dpro-yakiniku-line-liff/guide-center.html',
              'DPRO_YAKINIKU_TUTORIAL_QUICK_START_R5_V1.0_20260827.pdf',
              'DPRO_YAKINIKU_TUTORIAL_DETAILED_MANUAL_R5_V1.0_20260827.pdf',
            ],
          }
          out=[]
          for path, needles in checks.items():
            text=Path(path).read_text(encoding='utf-8')
            missing=[n for n in needles if n not in text]
            if missing: raise SystemExit(f'{path}: predecessor R6 missing: {missing}')
            out.append(f'{path}: PASS')
          Path('qa-r6/predecessor-preservation-before.txt').write_text('\n'.join(out)+'\n',encoding='utf-8')
          PY

      - name: Verify CHOSASHI source continuity and locked R5 assets
        id: assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os,sys,urllib.request,urllib.error
          from pathlib import Path
          repo=os.environ['INDUSTRY_REPO']
          base=os.environ['INDUSTRY_BASE_HEAD']
          headers={'Accept':'application/vnd.github+json','User-Agent':'DPRO-R6-QA','Authorization':'Bearer '+os.environ['GH_TOKEN']}
          def get_json(url):
            req=urllib.request.Request(url,headers=headers)
            with urllib.request.urlopen(req,timeout=30) as r:return json.load(r)
          current=get_json(f'https://api.github.com/repos/{repo}/commits/main')
          head=current['sha']; tree=current['commit']['tree']['sha']
          Path('qa-r6/industry-head-before.txt').write_text(head+'\n',encoding='utf-8')
          Path('qa-r6/industry-tree-before.txt').write_text(tree+'\n',encoding='utf-8')
          core=['guide-center.html','tutorial.js','tutorial.css','index.html','member.html','owner.html','staff.html','owner-ipad.html','system-check.html','demo-guide.html','upload.html']
          continuity=[]
          for p in core:
            old=get_json(f'https://api.github.com/repos/{repo}/contents/{p}?ref={base}')['sha']
            new=get_json(f'https://api.github.com/repos/{repo}/contents/{p}?ref={head}')['sha']
            if old!=new: raise SystemExit(f'CHOSASHI source drift: {p}: {old} -> {new}')
            continuity.append(f'{p} {old} PASS')
          Path('qa-r6/industry-source-continuity.txt').write_text('\n'.join(continuity)+'\n',encoding='utf-8')
          if head!=base:
            cmp=get_json(f'https://api.github.com/repos/{repo}/compare/{base}...{head}')
            allowed={os.environ['QUICK_PDF'],os.environ['DETAIL_PDF'],os.environ['QUICK_PNG'],os.environ['DETAIL_PNG']}
            changed={f['filename'] for f in cmp.get('files',[])}
            extra=changed-allowed
            if extra: raise SystemExit('Industry forward diff contains non-R5-asset paths: '+','.join(sorted(extra)))
            Path('qa-r6/industry-forward-diff.txt').write_text('\n'.join(sorted(changed))+'\n',encoding='utf-8')
          assets=[
            (os.environ['QUICK_PDF'],os.environ['QUICK_PDF_SHA256']),
            (os.environ['DETAIL_PDF'],os.environ['DETAIL_PDF_SHA256']),
            (os.environ['QUICK_PNG'],os.environ['QUICK_PNG_SHA256']),
            (os.environ['DETAIL_PNG'],os.environ['DETAIL_PNG_SHA256']),
          ]
          missing=[]; lines=[]
          for name,expected in assets:
            url=f'https://raw.githubusercontent.com/{repo}/main/{name}'
            try:
              req=urllib.request.Request(url,headers={'User-Agent':'DPRO-R6-QA'})
              with urllib.request.urlopen(req,timeout=60) as r:data=r.read()
            except Exception:
              missing.append(name); continue
            got=hashlib.sha256(data).hexdigest()
            if got!=expected: raise SystemExit(f'R5 asset hash mismatch {name}: {got} != {expected}')
            lines.append(f'{got}  {name}')
          Path('qa-r6/r5-asset-sha256.txt').write_text('\n'.join(lines)+'\n',encoding='utf-8')
          ready=not missing
          Path('qa-r6/asset-gate.txt').write_text(('PASS\n' if ready else 'WAITING_FOR_LOCKED_R5_ASSETS\n')+'\n'.join(missing)+'\n',encoding='utf-8')
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as f:f.write('ready='+('true' if ready else 'false')+'\n')
          print('asset gate', 'PASS' if ready else 'WAITING', missing)
          PY

      - name: Stop safely until locked R5 assets are present
        if: steps.assets.outputs.ready != 'true'
        shell: bash
        run: |
          echo "R6_PUBLISH_READY_WAITING_FOR_LOCKED_R5_ASSETS" | tee qa-r6/R6_RESULT.txt
          echo "No Product Site content was changed." | tee -a qa-r6/R6_RESULT.txt

      - name: Patch CHOSASHI Product Site additively
        if: steps.assets.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('systems/chosashi.html')
          original=p.read_text(encoding='utf-8')
          if 'DPRO_TUTORIAL_CHOSASHI_R6' in original:
            print('CHOSASHI R6 section already present; idempotent validation only')
            raise SystemExit(0)
          css='''\n/* DPRO_TUTORIAL_CHOSASHI_R6 */\n.ps-tutorial-r6{background:linear-gradient(180deg,#f4faf7 0%,#fff 100%)}\n.ps-tutorial-r6__grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1rem}\n.ps-tutorial-r6__card{min-width:0;padding:1.15rem;border:1px solid var(--ps-line);border-radius:1rem;background:#fff}\n.ps-tutorial-r6__label{display:inline-block;margin-bottom:.45rem;color:var(--dpro-green);font-size:.72rem;font-weight:900;letter-spacing:.12em}\n.ps-tutorial-r6__card h3{margin:0 0 .5rem;color:var(--ps-deep);font-size:1.12rem;line-height:1.4}\n.ps-tutorial-r6__card p{margin:0;color:var(--dpro-warm-gray-600);font-size:.9rem}\n.ps-tutorial-r6__links{display:grid;gap:.5rem;margin-top:1rem}\n.ps-tutorial-r6__links a{display:flex;align-items:center;min-height:46px;padding:.7rem .85rem;border:1px solid var(--ps-line);border-radius:.7rem;background:#fff;color:var(--ps-deep);font-weight:800;text-decoration:none;overflow-wrap:anywhere}\n.ps-tutorial-r6__links a:focus-visible{outline:3px solid var(--dpro-green);outline-offset:3px}\n.ps-tutorial-r6__safe{margin-top:1rem;padding:.85rem 1rem;border-left:4px solid var(--dpro-green);border-radius:.55rem;background:#eef8f3;color:#36584c;font-size:.86rem}\n@media(max-width:720px){.ps-tutorial-r6__grid{grid-template-columns:1fr}}\n@media(max-width:390px){.ps-tutorial-r6__card{padding:1rem}.ps-tutorial-r6__links a{align-items:flex-start}}\n@media(max-width:320px){.ps-tutorial-r6__card h3,.ps-tutorial-r6__card p,.ps-tutorial-r6__safe{overflow-wrap:anywhere}}\n'''
          base='https://dpromstk2000-lab.github.io/dpro-chosashi-line-liff/'
          section=f'''<section class="dpro-section ps-tutorial-r6" id="tutorial" aria-labelledby="tutorial-title" data-dpro-tutorial-r6="1"><div class="dpro-container"><div class="ps-section-heading"><p class="ps-kicker">TUTORIAL &amp; PRINT MANUAL</p><h2 id="tutorial-title">見ながら試せるガイドと、印刷できるマニュアル。</h2><p>土地家屋調査士業務の相談受付・案件管理・現場・お客様マイページ・営業前確認を、First10と役割別Guide Centerで確認できます。Tutorialは相談送信や案件更新、資料提出、現場報告を自動実行しません。</p></div><div class="ps-tutorial-r6__grid"><article class="ps-tutorial-r6__card"><span class="ps-tutorial-r6__label">LIVE GUIDE / FIRST10</span><h3>Guide Center と First10</h3><p>最初から開始、途中からResume、Replayを選べます。相談者・管理者・現場・お客様の代表導線を10ステップで確認できます。</p><div class="ps-tutorial-r6__links"><a href="{base}guide-center.html" target="_blank" rel="noopener">Guide Centerを開く</a><a href="{base}index.html?demo=1&amp;tutorial=start" target="_blank" rel="noopener">First10を開始</a><a href="{base}index.html?demo=1&amp;tutorial=resume" target="_blank" rel="noopener">First10をResume</a><a href="{base}index.html?demo=1&amp;tutorial=replay" target="_blank" rel="noopener">First10をReplay</a></div></article><article class="ps-tutorial-r6__card"><span class="ps-tutorial-r6__label">A4 PRINT MANUALS / R5 CENTRAL ACCEPTED</span><h3>Quick Start と 詳細操作マニュアル</h3><p>R5 CENTRAL ACCEPTEDのA4縦PDFをそのまま公開します。Quick Startは4ページ、Detailed Manualは12ページです。</p><div class="ps-tutorial-r6__links"><a href="{base}CHOSASHI_R5_QUICK_START.pdf" target="_blank" rel="noopener">Quick Start PDFを開く</a><a href="{base}CHOSASHI_R5_DETAILED_MANUAL.pdf" target="_blank" rel="noopener">詳細操作マニュアルPDFを開く</a><a href="{base}CHOSASHI_R5_QUICK_START_P01.png" target="_blank" rel="noopener">Quick Start表紙PNG</a><a href="{base}CHOSASHI_R5_DETAILED_MANUAL_P01.png" target="_blank" rel="noopener">Detailed Manual表紙PNG</a></div></article></div><div class="ps-tutorial-r6__safe"><strong>安全：</strong> 公開デモでは実在する氏名・電話番号・住所・所有者名・近隣者情報を入力しないでください。Tutorial / Guide Center / マニュアルから、相談送信・案件更新・資料提出・連絡・現場進捗・報告・写真・位置情報・デモデータ準備を自動実行することはありません。</div></div></section>'''
          if '</style>' not in original: raise SystemExit('style close tag not found')
          patched=original.replace('</style>',css+'</style>',1)
          final_anchor='<section class="dpro-section ps-final master-section"'
          pos=patched.find(final_anchor)
          if pos<0:
            # forward-compatible fallback: insert immediately before </main>
            pos=patched.rfind('</main>')
          if pos<0: raise SystemExit('safe section insertion anchor not found')
          patched=patched[:pos]+section+patched[pos:]
          nav_old='<a href="#live">実画面</a><a href="#price">料金</a>'
          nav_new='<a href="#live">実画面</a><a href="#tutorial">ガイド</a><a href="#price">料金</a>'
          if nav_old in patched:
            patched=patched.replace(nav_old,nav_new,1)
          # Invariants: business/commercial content cannot be deleted or rewritten.
          for token in ['5,500円','https://lin.ee/YxJGXV6D']:
            if patched.count(token)!=original.count(token): raise SystemExit(f'critical token count changed: {token}')
          # Prove operation is additive only by reversing the exact additions.
          reconstructed=patched.replace(css,'',1).replace(section,'',1)
          if nav_new in reconstructed:
            reconstructed=reconstructed.replace(nav_new,nav_old,1)
          if reconstructed!=original: raise SystemExit('non-additive Product Site change detected')
          p.write_text(patched,encoding='utf-8')
          PY
          git diff --check
          changed="$(git diff --name-only)"
          test "$changed" = "systems/chosashi.html"
          grep -q 'DPRO_TUTORIAL_CHOSASHI_R6' systems/chosashi.html
          grep -q 'data-dpro-tutorial-r6="1"' systems/chosashi.html
          grep -q 'CHOSASHI_R5_QUICK_START.pdf' systems/chosashi.html
          grep -q 'CHOSASHI_R5_DETAILED_MANUAL.pdf' systems/chosashi.html
          git diff -- systems/chosashi.html > qa-r6/chosashi-product-site.patch

      - name: Commit CHOSASHI R6 Product Site
        if: steps.assets.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet; then
            git add systems/chosashi.html
            git commit -m "Publish CHOSASHI R6 Tutorial and manuals"
            git push origin main
          fi
          git rev-parse HEAD | tee qa-r6/product-site-head-final.txt
          git rev-parse HEAD^{tree} | tee qa-r6/product-site-tree-final.txt

      - name: Wait for Product Site and CHOSASHI public assets
        if: steps.assets.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa-r6/public
          ok=0
          for i in $(seq 1 60); do
            if curl -fsSL --retry 1 --connect-timeout 10 --max-time 30 "$PRODUCT_PAGE?qa=$(date +%s)-$i" -o qa-r6/public/chosashi-product.html; then
              if grep -q 'DPRO_TUTORIAL_CHOSASHI_R6' qa-r6/public/chosashi-product.html; then ok=1; break; fi
            fi
            sleep 10
          done
          test "$ok" = 1
          urls=(
            "$INDUSTRY_BASE/" "$INDUSTRY_BASE/demo-guide.html" "$INDUSTRY_BASE/guide-center.html" "$INDUSTRY_BASE/tutorial.js"
            "$INDUSTRY_BASE/index.html?demo=1&tutorial=start" "$INDUSTRY_BASE/index.html?demo=1&tutorial=resume" "$INDUSTRY_BASE/index.html?demo=1&tutorial=replay"
            "$INDUSTRY_BASE/member.html?demo=1" "$INDUSTRY_BASE/owner.html?demo=1" "$INDUSTRY_BASE/staff.html?demo=1" "$INDUSTRY_BASE/owner-ipad.html?demo=1" "$INDUSTRY_BASE/system-check.html?demo=1"
            "$INDUSTRY_BASE/$QUICK_PDF" "$INDUSTRY_BASE/$DETAIL_PDF" "$INDUSTRY_BASE/$QUICK_PNG" "$INDUSTRY_BASE/$DETAIL_PNG" "$PRODUCT_PAGE"
          )
          : > qa-r6/public/http.txt
          for u in "${urls[@]}"; do
            code=$(curl -L -sS -o /dev/null -w '%{http_code}' --connect-timeout 20 --max-time 60 "$u")
            echo "$code $u" | tee -a qa-r6/public/http.txt
            test "$code" = 200
          done

      - name: Public manual hash QA and Tutorial source QA
        if: steps.assets.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL "$INDUSTRY_BASE/$QUICK_PDF" -o "qa-r6/public/$QUICK_PDF"
          curl -fsSL "$INDUSTRY_BASE/$DETAIL_PDF" -o "qa-r6/public/$DETAIL_PDF"
          curl -fsSL "$INDUSTRY_BASE/$QUICK_PNG" -o "qa-r6/public/$QUICK_PNG"
          curl -fsSL "$INDUSTRY_BASE/$DETAIL_PNG" -o "qa-r6/public/$DETAIL_PNG"
          echo "$QUICK_PDF_SHA256  qa-r6/public/$QUICK_PDF" | sha256sum -c -
          echo "$DETAIL_PDF_SHA256  qa-r6/public/$DETAIL_PDF" | sha256sum -c -
          echo "$QUICK_PNG_SHA256  qa-r6/public/$QUICK_PNG" | sha256sum -c -
          echo "$DETAIL_PNG_SHA256  qa-r6/public/$DETAIL_PNG" | sha256sum -c -
          curl -fsSL "$INDUSTRY_BASE/guide-center.html" -o qa-r6/public/guide-center.html
          curl -fsSL "$INDUSTRY_BASE/tutorial.js" -o qa-r6/public/tutorial.js
          grep -q 'First10' qa-r6/public/guide-center.html
          grep -q 'CHOSASHI-TUTORIAL-V1.1' qa-r6/public/tutorial.js
          grep -q 'TOTAL=10' qa-r6/public/tutorial.js
          grep -q 'CHOSASHI_R5_QUICK_START.pdf' qa-r6/public/chosashi-product.html
          grep -q 'CHOSASHI_R5_DETAILED_MANUAL.pdf' qa-r6/public/chosashi-product.html
          cat > qa-r6/qr-continuity.txt <<EOF
          PASS: public PDF SHA256 exactly equals R5 CENTRAL ACCEPTED binary.
          Therefore the embedded QR payloads are byte-identical to R5 QR QA PASS (14/14) and were not altered by R6.
          EOF

      - name: Install browser QA runtime
        if: steps.assets.outputs.ready == 'true'
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check playwright==1.54.0
          python -m playwright install --with-deps chromium

      - name: Responsive LIVE QA 1440 1024 390 320
        if: steps.assets.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import asyncio,json,os
          from pathlib import Path
          from playwright.async_api import async_playwright
          product=os.environ['PRODUCT_PAGE']
          base=os.environ['INDUSTRY_BASE']
          viewports=[(1440,1000),(1024,768),(390,844),(320,720)]
          routes=[
            ('product',product),('guide',base+'/guide-center.html'),
            ('start',base+'/index.html?demo=1&tutorial=start'),
            ('resume',base+'/index.html?demo=1&tutorial=resume'),
            ('replay',base+'/index.html?demo=1&tutorial=replay'),
          ]
          async def main():
            rows=[]; mutations=[]; page_errors=[]
            async with async_playwright() as pw:
              browser=await pw.chromium.launch()
              for w,h in viewports:
                ctx=await browser.new_context(viewport={'width':w,'height':h})
                page=await ctx.new_page()
                page.on('request',lambda r: mutations.append({'method':r.method,'url':r.url,'viewport':f'{w}x{h}'}) if r.method in {'POST','PUT','PATCH','DELETE'} else None)
                page.on('pageerror',lambda e: page_errors.append({'error':str(e),'viewport':f'{w}x{h}'}))
                for label,url in routes:
                  resp=await page.goto(url,wait_until='domcontentloaded',timeout=60000)
                  await page.wait_for_timeout(1000)
                  if not resp or resp.status!=200: raise RuntimeError(f'{label} {w}x{h} HTTP {resp.status if resp else None}')
                  dims=await page.evaluate('({sw:document.documentElement.scrollWidth,iw:window.innerWidth})')
                  overflow=max(0,dims['sw']-dims['iw'])
                  if overflow: raise RuntimeError(f'{label} {w}x{h} horizontal overflow={overflow}')
                  if label=='product':
                    if await page.locator('[data-dpro-tutorial-r6="1"]').count()!=1: raise RuntimeError('Product Tutorial section missing')
                    for text in ['Guide Centerを開く','First10を開始','Quick Start PDFを開く','詳細操作マニュアルPDFを開く']:
                      if await page.get_by_text(text,exact=True).count()<1: raise RuntimeError(f'Product link missing: {text}')
                  rows.append({'route':label,'viewport':f'{w}x{h}','http':200,'overflow':overflow})
                await ctx.close()
              await browser.close()
            if mutations: raise RuntimeError('businessMutation != 0: '+json.dumps(mutations,ensure_ascii=False))
            if page_errors: raise RuntimeError('R6 attributable browser errors: '+json.dumps(page_errors,ensure_ascii=False))
            Path('qa-r6/browser-live-qa.json').write_text(json.dumps(rows,ensure_ascii=False,indent=2),encoding='utf-8')
            Path('qa-r6/business-mutation.txt').write_text('businessMutation=0\n',encoding='utf-8')
            Path('qa-r6/browser-errors.txt').write_text('R6 attributable errors=0\n',encoding='utf-8')
          asyncio.run(main())
          PY

      - name: Final predecessor and scope lock
        if: steps.assets.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          checks={
            'systems/cosmetics.html':['dpro-cosmetics-line-liff/guide-center.html','DPRO_TUTORIAL_COSMETICS_QUICK_START_V1.0.pdf'],
            'systems/flower-shop.html':['dpro-flower-line-liff/guide-center.html','DPRO_TUTORIAL_FLOWER_QUICK_START_V1.0.pdf'],
            'systems/yakiniku.html':['dpro-yakiniku-line-liff/guide-center.html','DPRO_YAKINIKU_TUTORIAL_QUICK_START_R5_V1.0_20260827.pdf'],
          }
          for p,needles in checks.items():
            text=Path(p).read_text(encoding='utf-8')
            for n in needles:
              if n not in text: raise SystemExit(f'predecessor regression: {p}: {n}')
          Path('qa-r6/predecessor-preservation-final.txt').write_text('COSMETICS PASS\nFLOWER PASS\nYAKINIKU PASS\n',encoding='utf-8')
          Path('qa-r6/backend-scope.txt').write_text('DB=UNCHANGED\nWorker=UNCHANGED\nAPI=UNCHANGED\nAuth=UNCHANGED\nRole=UNCHANGED\nPermission=UNCHANGED\nFeatureFlag=UNCHANGED\n',encoding='utf-8')
          PY
          test "$(git show --pretty='' --name-only HEAD | sed '/^$/d')" = "systems/chosashi.html" || {
            echo "Note: HEAD may be workflow creation commit on idempotent rerun; validating tracked R6 page directly."
          }

      - name: Wait for exact Product Site Pages final HEAD success
        if: steps.assets.outputs.ready == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,time,urllib.request
          final=open('qa-r6/product-site-head-final.txt',encoding='utf-8').read().strip()
          headers={'Accept':'application/vnd.github+json','Authorization':'Bearer '+os.environ['GH_TOKEN'],'User-Agent':'DPRO-R6-QA'}
          ok=False; seen=[]
          for _ in range(60):
            req=urllib.request.Request('https://api.github.com/repos/dpromstk2000-lab/dpro-line-systems-site/actions/runs?branch=main&per_page=30',headers=headers)
            with urllib.request.urlopen(req,timeout=30) as r:d=json.load(r)
            for run in d.get('workflow_runs',[]):
              if run.get('name')=='pages build and deployment' and run.get('head_sha')==final:
                seen.append({'id':run['id'],'status':run['status'],'conclusion':run.get('conclusion'),'url':run['html_url']})
                if run['status']=='completed' and run.get('conclusion')=='success': ok=True; break
            if ok: break
            time.sleep(10)
          open('qa-r6/pages-final-head.json','w',encoding='utf-8').write(json.dumps({'final_head':final,'success':ok,'seen':seen},ensure_ascii=False,indent=2))
          if not ok: raise SystemExit('No successful Product Site Pages deployment for exact final HEAD')
          PY

      - name: Write R6 FINAL LOCK result
        if: steps.assets.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cat > qa-r6/R6_RESULT.txt <<EOF
          DPRO TUTORIAL CHOSASHI R6 FINAL LOCK
          R5: PASS / CENTRAL ACCEPTED
          R6 Product Site integration: PASS
          Product Site: $PRODUCT_PAGE
          Guide Center: $INDUSTRY_BASE/guide-center.html
          First10 start: $INDUSTRY_BASE/index.html?demo=1&tutorial=start
          First10 resume: $INDUSTRY_BASE/index.html?demo=1&tutorial=resume
          First10 replay: $INDUSTRY_BASE/index.html?demo=1&tutorial=replay
          Quick Start PDF: $INDUSTRY_BASE/$QUICK_PDF
          Detailed Manual PDF: $INDUSTRY_BASE/$DETAIL_PDF
          1440: PASS
          1024: PASS
          390x844: PASS / horizontal overflow 0
          320x720: PASS / horizontal overflow 0
          COSMETICS preservation: PASS
          FLOWER preservation: PASS
          YAKINIKU preservation: PASS
          businessMutation: 0
          R6 attributable errors: 0
          source drift: 0
          DB/Worker/API/Auth/Role/Permission/Feature Flag Tutorial changes: 0
          Product Site final HEAD: $(cat qa-r6/product-site-head-final.txt)
          Product Site final TREE: $(cat qa-r6/product-site-tree-final.txt)
          CHOSASHI industry HEAD: $(cat qa-r6/industry-head-before.txt)
          CHOSASHI industry TREE: $(cat qa-r6/industry-tree-before.txt)
          R7: NOT STARTED
          EOF

      - name: Upload R6 QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DPRO_TUTORIAL_CHOSASHI_R6_QA_EVIDENCE
          path: qa-r6
          if-no-files-found: error
