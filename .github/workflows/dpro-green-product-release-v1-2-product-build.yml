-top:3mm;font-size:2mm;color:#6f8177}.foot b{color:#176342}</style></head><body><main class="page"><header class="head"><div><div class="brand">DPRO <span>GREEN</span></div><div class="kicker">OPERATION EXPERIENCE SHEET / V1.0</div><h1>実画面を見ながら、<br>最初の操作を確認。</h1><p>観葉植物レンタルの管理PC・巡回・お客様報告を、FINAL LOCK済みデモ画面で体験できます。</p></div><div class="badge">A4 / 実画面</div></header><section class="screen-grid"><article class="screen"><img src="screens/owner-dashboard.png"><strong>01 管理PC・全体ダッシュボード</strong></article><article class="screen"><img src="screens/owner-visits.png"><strong>02 巡回・訪問管理</strong></article><article class="screen"><img src="screens/owner-assets.png"><strong>03 植物・鉢台帳</strong></article><article class="screen"><img src="screens/member-reports.png"><strong>04 お客様・作業報告</strong></article></section><section class="steps"><div class="step"><b>STEP 01</b><strong>今日の状況を見る</strong><p>訪問予定・対応状況を確認。</p></div><div class="step"><b>STEP 02</b><strong>植物と設置先を見る</strong><p>植物・鉢・現在地を確認。</p></div><div class="step"><b>STEP 03</b><strong>巡回を記録する</strong><p>担当・順番・作業状態を更新。</p></div><div class="step"><b>STEP 04</b><strong>報告・交換へつなぐ</strong><p>写真報告と交換後の履歴へ。</p></div></section><section class="qrgrid"><div class="qr"><img src="qr/official.png"><strong>公式説明</strong><small>DPRO SHOP</small></div><div class="qr"><img src="qr/product.png"><strong>製品ページ</strong><small>PRODUCT SITE</small></div><div class="qr"><img src="qr/demo.png"><strong>LIVE DEMO</strong><small>実画面を操作</small></div><div class="qr"><img src="qr/line.png"><strong>LINE相談</strong><small>導入相談</small></div></section><footer class="foot"><span><b>DPRO GREEN</b> / 観葉植物レンタル・グリーンレンタル</span><span>2026-09-25 / PRODUCT RELEASE MASTER V1.2</span></footer></main></body></html>'''
