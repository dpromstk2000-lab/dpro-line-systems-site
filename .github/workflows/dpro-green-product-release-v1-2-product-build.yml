      - name: Render final flyer and operation PDFs
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/render-green-pdfs.mjs <<'JS'
          import { chromium } from 'playwright';
          import path from 'path';
          import { pathToFileURL } from 'url';
          const browser=await chromium.launch({headless:true});
          async function render(html,pdf,png){
            const page=await browser.newPage({viewport:{width:1100,height:1500},deviceScaleFactor:1});
            await page.goto(pathToFileURL(path.resolve(html)).href,{waitUntil:'load',timeout:60000});
            await page.emulateMedia({media:'print'});
            await page.pdf({path:pdf,format:'A4',printBackground:true,preferCSSPageSize:true,margin:{top:'0',right:'0',bottom:'0',left:'0'}});
            await page.emulateMedia({media:'screen'});
            await page.screenshot({path:png,fullPage:true});
            await page.close();
          }
          await render('flyer-green-rental.html','flyer-green-rental.pdf','assets/green-rental-next/flyer-final-screen.png');
          await render('assets/green-rental-next/operation-sheet.html','assets/green-rental-next/DPRO_GREEN_RENTAL_OPERATION_EXPERIENCE_SHEET_V1.0.pdf','assets/green-rental-next/DPRO_GREEN_RENTAL_OPERATION_EXPERIENCE_SHEET_V1.0.png');
          await browser.close();
          JS
          node /tmp/render-green-pdfs.mjs
          pdfinfo flyer-green-rental.pdf | grep -E '^Pages:|^Page size:'
          pdfinfo assets/green-rental-next/DPRO_GREEN_RENTAL_OPERATION_EXPERIENCE_SHEET_V1.0.pdf | grep -E '^Pages:|^Page size:'

