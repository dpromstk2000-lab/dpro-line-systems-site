name: Add GAKUDO to DPRO System Site

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: add-gakudo-to-dpro-system-site
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add GAKUDO and update counts
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, re, json

          def read(path): return Path(path).read_text(encoding="utf-8")
          def write(path, text): Path(path).write_text(text, encoding="utf-8")
          def require(cond, message):
              if not cond:
                  raise SystemExit(message)

          page = base64.b64decode("").decode("utf-8")
          Path("systems").mkdir(exist_ok=True)
          write("systems/gakudo.html", page)

          # Runtime catalog count and product card
          p = read("script.js")
          p = p.replace("STEP SITE-CAREPLAN-47 / 47 PRODUCTS / PRESERVE ALL 46 PRODUCTS / 20260801", "STEP SITE-GAKUDO-48 / 48 PRODUCTS / PRESERVE ALL 47 PRODUCTS / 20260802")
          p = p.replace("const productCount = 47;", "const productCount = 48;", 1)
          if '["教育・生活サービス", "学童保育・放課後児童クラブ"]' not in p:
              anchor = '["教育・生活サービス", "居宅介護支援・ケアマネ"],'
              require(anchor in p, "script.js: category description anchor not found")
              p = p.replace(anchor, anchor + '\n    ["教育・生活サービス", "学童保育・放課後児童クラブ"],', 1)
          if 'systems/gakudo.html' not in p:
              entry = '''    [
                "systems/gakudo.html",
                "GK",
                "catalog-live-gakudo",
                "学童保育・放課後児童クラブ実画面プレビュー",
                "https://dpromstk2000-lab.github.io/dpro-gakudo-line/owner.html?v=GAKUDO-10",
                "教育・生活サービス",
                "学童保育・放課後児童クラブ",
                "欠席・利用変更・お迎え連絡・入退室・長期休暇・日別定員・通知・安全警告。"
              ]
          '''
              start = p.find("  const products = [")
              require(start >= 0, "script.js: products array start not found")
              end = p.find("\n  ];", start)
              require(end >= 0, "script.js: products array end not found")
              before = p[:end].rstrip()
              comma = "" if before.endswith("[") else ","
              p = before + comma + "\n" + entry.rstrip() + p[end:]
          write("script.js", p)

          # Static/no-JS counts on product homepage/catalog
          for path in ["index.html", "systems.html"]:
              p = read(path)
              p = p.replace("38業種", "48業種")
              p = p.replace(">38</strong>", ">48</strong>")
              p = p.replace('class="orbit-core">38</div>', 'class="orbit-core">48</div>')
              p = p.replace("38システムをすべて見る", "48システムをすべて見る")
              p = p.replace("38 PRODUCTS", "48 PRODUCTS")
              write(path, p)

          checks = {
            "page": Path("systems/gakudo.html").exists(),
            "product_count": "const productCount = 48;" in read("script.js"),
            "product_entry": "systems/gakudo.html" in read("script.js"),
            "preview_url": "dpro-gakudo-line/owner.html?v=GAKUDO-10" in read("script.js"),
            "index_static_count": "48業種" in read("index.html"),
            "catalog_static_count": "48業種" in read("systems.html"),
          }
          failed = [k for k,v in checks.items() if not v]
          print(json.dumps({"ok": not failed, "checks": checks, "failed": failed}, ensure_ascii=False, indent=2))
          require(not failed, "Validation failed: " + ", ".join(failed))
          PY

      - name: Validate changed files
        shell: bash
        run: |
          set -euo pipefail
          test -s systems/gakudo.html
          grep -q 'dpro-gakudo-line' systems/gakudo.html
          grep -q 'GAKUDO-10' systems/gakudo.html
          git diff --check
          git status --short

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes required. GAKUDO is already present."
            exit 0
          fi
          git commit -m "Add GAKUDO as product 48"
          git push
