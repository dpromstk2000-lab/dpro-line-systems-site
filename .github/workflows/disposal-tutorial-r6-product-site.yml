name: DISPOSAL Tutorial R6 Product Site

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/disposal-tutorial-r6-product-site.yml'

permissions:
  contents: write

concurrency:
  group: disposal-tutorial-r6-product-site
  cancel-in-progress: false

jobs:
  integrate-and-live-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout newest Product Site main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Record prewrite source lock and target hashes
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          echo "PREWRITE_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "PREWRITE_TREE=$(git rev-parse HEAD^{tree})" >> "$GITHUB_ENV"
          test -s systems/disposal.html
          test -s systems/disposal.html.txt
          cmp -s systems/disposal.html systems/disposal.html.txt
          cp systems/disposal.html /tmp/disposal.pre.html
          sha256sum systems/disposal.html systems/disposal.html.txt | tee /tmp/prewrite_sha256.txt
          git hash-object systems/disposal.html | tee /tmp/prewrite_blob.txt

      - name: Verify all four R5 resources are already public
        shell: bash
        run: |
          set -euo pipefail
          TUTORIAL='https://dpromstk2000-lab.github.io/dpro-disposal-line-liff/owner.html?demo=1&tutorial=start'
          GUIDE='https://dpromstk2000-lab.github.io/dpro-disposal-line-liff/guide-center.html'
          QUICK='https://dpromstk2000-lab.github.io/dpro-disposal-line-liff/docs/DPRO_TUTORIAL_DISPOSAL_QUICK_START_V1.0.pdf'
          DETAIL='https://dpromstk2000-lab.github.io/dpro-disposal-line-liff/docs/DPRO_TUTORIAL_DISPOSAL_DETAILED_MANUAL_V1.0.pdf'
          curl -fsSL --retry 3 --max-time 30 "$TUTORIAL" -o /tmp/tutorial.html
          curl -fsSL --retry 3 --max-time 30 "$GUIDE" -o /tmp/guide.html
          curl -fsSL --retry 3 --max-time 30 "$QUICK" -o /tmp/quick.pdf
          curl -fsSL --retry 3 --max-time 30 "$DETAIL" -o /tmp/detail.pdf
          grep -q 'DPRO-TUTORIAL-DISPOSAL-B09-R3-V1.0-20260829' /tmp/tutorial.html || grep -q 'dpro-tutorial-r3.js' /tmp/tutorial.html
          grep -q 'DPRO-TUTORIAL-DISPOSAL-B09-R4-GUIDE-V1.0-20260829' /tmp/guide.html
          head -c 5 /tmp/quick.pdf | grep -q '%PDF-'
          head -c 5 /tmp/detail.pdf | grep -q '%PDF-'
          test "$(stat -c%s /tmp/quick.pdf)" -gt 10000
          test "$(stat -c%s /tmp/detail.pdf)" -gt 10000

      - name: Integrate exactly four verified Tutorial resources
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('systems/disposal.html')
          before = p.read_text(encoding='utf-8')
          old = '<div class="ps-doclinks" aria-label="関連資料"><a href="../lp-disposal.html">詳しい紹介を見る</a><a href="../flyer-disposal.html">A4チラシを見る</a><a href="../flyer-disposal.pdf">PDF資料を開く</a></div>'
          new = '<!-- DPRO-TUTORIAL-DISPOSAL-R6-PRODUCT-INTEGRATION-V1.0-20260829 --><div class="ps-doclinks" aria-label="関連資料"><a href="../lp-disposal.html">詳しい紹介を見る</a><a href="../flyer-disposal.html">A4チラシを見る</a><a href="../flyer-disposal.pdf">PDF資料を開く</a><a data-r6-resource="tutorial-start" href="https://dpromstk2000-lab.github.io/dpro-disposal-line-liff/owner.html?demo=1&amp;tutorial=start" target="_blank" rel="noopener">Tutorial Start</a><a data-r6-resource="guide-center" href="https://dpromstk2000-lab.github.io/dpro-disposal-line-liff/guide-center.html" target="_blank" rel="noopener">Guide Center</a><a data-r6-resource="quick-start" href="https://dpromstk2000-lab.github.io/dpro-disposal-line-liff/docs/DPRO_TUTORIAL_DISPOSAL_QUICK_START_V1.0.pdf" target="_blank" rel="noopener">Quick Start PDF</a><a data-r6-resource="detailed-manual" href="https://dpromstk2000-lab.github.io/dpro-disposal-line-liff/docs/DPRO_TUTORIAL_DISPOSAL_DETAILED_MANUAL_V1.0.pdf" target="_blank" rel="noopener">Detailed Manual PDF</a></div>'
          if before.count(old) != 1:
              raise SystemExit(f'expected exactly one target doclinks block, found {before.count(old)}')
          if 'DPRO-TUTORIAL-DISPOSAL-R6-PRODUCT-INTEGRATION' in before:
              raise SystemExit('R6 marker already exists; refusing duplicate integration')
          after = before.replace(old, new, 1)
          p.write_text(after, encoding='utf-8')
          Path('systems/disposal.html.txt').write_text(after, encoding='utf-8')
          # Strong regression guard: every byte outside the one accepted block is unchanged.
          expected = Path('/tmp/disposal.pre.html').read_text(encoding='utf-8').replace(old, new, 1)
          assert after == expected
          PY
          cmp -s systems/disposal.html systems/disposal.html.txt
          python - <<'PY'
          from pathlib import Path
          s=Path('systems/disposal.html').read_text(encoding='utf-8')
          checks={
            'tutorial':'https://dpromstk2000-lab.github.io/dpro-disposal-line-liff/owner.html?demo=1&amp;tutorial=start',
            'guide':'https://dpromstk2000-lab.github.io/dpro-disposal-line-liff/guide-center.html',
            'quick':'https://dpromstk2000-lab.github.io/dpro-disposal-line-liff/docs/DPRO_TUTORIAL_DISPOSAL_QUICK_START_V1.0.pdf',
            'detail':'https://dpromstk2000-lab.github.io/dpro-disposal-line-liff/docs/DPRO_TUTORIAL_DISPOSAL_DETAILED_MANUAL_V1.0.pdf',
          }
          for k,v in checks.items():
            assert s.count(v)==1, (k,s.count(v))
          # Existing protected product markers remain.
          for marker in ['5,500円','https://lin.ee/YxJGXV6D','../lp-disposal.html','../flyer-disposal.html','../flyer-disposal.pdf','systems-data.js','dpro-v3.js']:
            assert marker in s, marker
          print('R6 target-only static integration: PASS')
          PY
          CHANGED="$(git diff --name-only | sort)"
          printf '%s\n' "$CHANGED"
          test "$CHANGED" = $'systems/disposal.html\nsystems/disposal.html.txt'

      - name: Prepare Node and Playwright
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1

      - name: Commit target-only content and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/disposal-tutorial-r6-product-site.yml
          git add systems/disposal.html systems/disposal.html.txt .github/workflows/disposal-tutorial-r6-product-site.yml
          git diff --cached --quiet && { echo 'No R6 changes to commit'; exit 1; }
          git commit -m 'DISPOSAL Batch09 R6 Product Site Tutorial integration [skip ci]'
          FINAL_HEAD="$(git rev-parse HEAD)"
          FINAL_TREE="$(git rev-parse HEAD^{tree})"
          PARENT="$(git rev-parse HEAD^)"
          test "$PARENT" = "$PREWRITE_HEAD"
          echo "FINAL_HEAD=$FINAL_HEAD" >> "$GITHUB_ENV"
          echo "FINAL_TREE=$FINAL_TREE" >> "$GITHUB_ENV"
          git push origin HEAD:main
          REMOTE="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test "$REMOTE" = "$FINAL_HEAD"

      - name: Wait for public Product Site R6 deployment
        shell: bash
        run: |
          set -euo pipefail
          URL='https://dpromstk2000-lab.github.io/dpro-line-systems-site/systems/disposal.html'
          for i in $(seq 1 60); do
            BODY="$(curl -fsSL --max-time 20 "$URL?qa=${FINAL_HEAD}_$i" || true)"
            if printf '%s' "$BODY" | grep -q 'DPRO-TUTORIAL-DISPOSAL-R6-PRODUCT-INTEGRATION-V1.0-20260829'; then
              echo 'R6 Product Site is live.'
              exit 0
            fi
            sleep 5
          done
          echo 'R6 Product Site did not become live in time.' >&2
          exit 1

      - name: Run exact four-width public R6 LIVE QA
        shell: bash
        run: |
          set -euo pipefail
          cat > disposal-r6-qa.mjs <<'NODE'
          import fs from 'node:fs';
          import { chromium, request as requestApi } from 'playwright';
          const PAGE='https://dpromstk2000-lab.github.io/dpro-line-systems-site/systems/disposal.html?qa=r6live';
          const expected=[
            {key:'tutorial_start',selector:'[data-r6-resource="tutorial-start"]',url:'https://dpromstk2000-lab.github.io/dpro-disposal-line-liff/owner.html?demo=1&tutorial=start'},
            {key:'guide_center',selector:'[data-r6-resource="guide-center"]',url:'https://dpromstk2000-lab.github.io/dpro-disposal-line-liff/guide-center.html'},
            {key:'quick_start_pdf',selector:'[data-r6-resource="quick-start"]',url:'https://dpromstk2000-lab.github.io/dpro-disposal-line-liff/docs/DPRO_TUTORIAL_DISPOSAL_QUICK_START_V1.0.pdf'},
            {key:'detailed_manual_pdf',selector:'[data-r6-resource="detailed-manual"]',url:'https://dpromstk2000-lab.github.io/dpro-disposal-line-liff/docs/DPRO_TUTORIAL_DISPOSAL_DETAILED_MANUAL_V1.0.pdf'},
          ];
          const vps=[
            {name:'1440x1000',width:1440,height:1000},
            {name:'1024x768',width:1024,height:768},
            {name:'390x844',width:390,height:844},
            {name:'320x720',width:320,height:720},
          ];
          const browser=await chromium.launch({headless:true});
          const api=await requestApi.newContext();
          const report={version:'DISPOSAL-R6-LIVE-QA-V1.0-20260829',prewrite_head:process.env.PREWRITE_HEAD,prewrite_tree:process.env.PREWRITE_TREE,final_head:process.env.FINAL_HEAD,final_tree:process.env.FINAL_TREE,viewports:[],resources:{},gates:{},overall:'PASS'};
          for (const x of expected){
            const r=await api.get(x.url,{timeout:30000});
            report.resources[x.key]={url:x.url,status:r.status(),ok:r.ok()};
            if(!r.ok()) report.overall='FAIL';
          }
          await api.dispose();
          for(const vp of vps){
            const ctx=await browser.newContext({viewport:{width:vp.width,height:vp.height}});
            const p=await ctx.newPage();
            const pageErrors=[]; const consoleErrors=[]; const writeRequests=[];
            p.on('pageerror',e=>pageErrors.push(String(e.message||e)));
            p.on('console',m=>{if(m.type()==='error') consoleErrors.push(m.text())});
            p.on('request',r=>{if(['POST','PUT','PATCH','DELETE'].includes(r.method())) writeRequests.push({method:r.method(),url:r.url()})});
            const resp=await p.goto(PAGE,{waitUntil:'networkidle',timeout:60000});
            const metrics=await p.evaluate(()=>({innerWidth:window.innerWidth,documentElementScrollWidth:document.documentElement.scrollWidth,bodyScrollWidth:document.body.scrollWidth}));
            const links={};
            for(const x of expected){
              const loc=p.locator(x.selector);
              const count=await loc.count();
              const visible=count===1 && await loc.isVisible();
              const href=count===1 ? await loc.getAttribute('href') : null;
              links[x.key]={count,visible,href,exact:href===x.url};
            }
            // Keyboard-only focus: tab until each R6 link is reached, checking focus-visible styling.
            await p.evaluate(()=>{window.scrollTo(0,0); document.body.focus?.()});
            const focusSeen={};
            for(let i=0;i<120;i++){
              await p.keyboard.press('Tab');
              const state=await p.evaluate(()=>{
                const e=document.activeElement;
                if(!e) return null;
                const key=e.getAttribute?.('data-r6-resource');
                if(!key) return null;
                const s=getComputedStyle(e);
                return {key,outlineStyle:s.outlineStyle,outlineWidth:parseFloat(s.outlineWidth)||0,boxShadow:s.boxShadow};
              });
              if(state){
                const visibleFocus=(state.outlineStyle!=='none' && state.outlineWidth>=2) || (state.boxShadow && state.boxShadow!=='none');
                focusSeen[state.key]={visibleFocus,...state};
              }
              if(Object.keys(focusSeen).length===4) break;
            }
            const positiveOverflow=Math.max(0,metrics.documentElementScrollWidth-metrics.innerWidth,metrics.bodyScrollWidth-metrics.innerWidth);
            const regression=await p.evaluate(()=>({
              price:(document.body.innerText||'').includes('5,500円'),
              line:[...document.querySelectorAll('a')].some(a=>a.href==='https://lin.ee/YxJGXV6D'),
              live:!!document.querySelector('#live'),
              lp:[...document.querySelectorAll('a')].some(a=>a.getAttribute('href')==='../lp-disposal.html'),
              flyerHtml:[...document.querySelectorAll('a')].some(a=>a.getAttribute('href')==='../flyer-disposal.html'),
              flyerPdf:[...document.querySelectorAll('a')].some(a=>a.getAttribute('href')==='../flyer-disposal.pdf'),
            }));
            const checks={
              http200:resp?.status()===200,
              linksVisibleExact:Object.values(links).every(v=>v.count===1&&v.visible&&v.exact),
              keyboardFocusVisible:['tutorial-start','guide-center','quick-start','detailed-manual'].every(k=>focusSeen[k]?.visibleFocus),
              positiveOverflow0:positiveOverflow===0,
              pageError0:pageErrors.length===0,
              consoleError0:consoleErrors.length===0,
              unsafeWrite0:writeRequests.length===0,
              businessMutation0:writeRequests.length===0,
              regression0:Object.values(regression).every(Boolean),
            };
            const pass=Object.values(checks).every(Boolean);
            report.viewports.push({name:vp.name,width:vp.width,height:vp.height,metrics,positiveOverflow,links,focusSeen,regression,pageErrors,consoleErrors,writeRequests,checks,pass});
            if(!pass) report.overall='FAIL';
            await ctx.close();
          }
          await browser.close();
          const all=(fn)=>report.viewports.every(fn);
          report.gates={
            FETCH_NEWEST_PRODUCT_MAIN_PREWRITE:'PASS',
            FORWARD_ONLY:process.env.PREWRITE_HEAD && process.env.FINAL_HEAD ? 'PASS':'FAIL',
            TARGET_SCOPE_ONLY:'PASS',
            HTML_TEXT_BYTE_IDENTICAL:'PASS',
            TUTORIAL_START_LINK:report.resources.tutorial_start.ok&&all(v=>v.links.tutorial_start.exact&&v.links.tutorial_start.visible)?'PASS':'FAIL',
            GUIDE_CENTER_LINK:report.resources.guide_center.ok&&all(v=>v.links.guide_center.exact&&v.links.guide_center.visible)?'PASS':'FAIL',
            QUICK_START_PDF_LINK:report.resources.quick_start_pdf.ok&&all(v=>v.links.quick_start_pdf.exact&&v.links.quick_start_pdf.visible)?'PASS':'FAIL',
            DETAILED_MANUAL_PDF_LINK:report.resources.detailed_manual_pdf.ok&&all(v=>v.links.detailed_manual_pdf.exact&&v.links.detailed_manual_pdf.visible)?'PASS':'FAIL',
            ALL_4_LINKS_PUBLIC_REACHABLE:Object.values(report.resources).every(v=>v.ok)?'PASS':'FAIL',
            '1440x1000':report.viewports[0].pass?'PASS':'FAIL',
            '1024x768':report.viewports[1].pass?'PASS':'FAIL',
            '390x844':report.viewports[2].pass?'PASS':'FAIL',
            '320x720':report.viewports[3].pass?'PASS':'FAIL',
            '390_METRICS_RECORDED':report.viewports[2].metrics?'PASS':'FAIL',
            '320_METRICS_RECORDED':report.viewports[3].metrics?'PASS':'FAIL',
            POSITIVE_HORIZONTAL_OVERFLOW:all(v=>v.positiveOverflow===0)?0:'FAIL',
            KEYBOARD_FOCUS_VISIBLE:all(v=>v.checks.keyboardFocusVisible)?'PASS':'FAIL',
            TUTORIAL_ATTRIBUTABLE_PAGEERROR:all(v=>v.checks.pageError0)?0:'FAIL',
            TUTORIAL_ATTRIBUTABLE_CONSOLE_ERROR:all(v=>v.checks.consoleError0)?0:'FAIL',
            UNSAFE_WRITE_REQUEST:all(v=>v.checks.unsafeWrite0)?0:'FAIL',
            BUSINESS_MUTATION:all(v=>v.checks.businessMutation0)?0:'FAIL',
            PRODUCT_SITE_REGRESSION:all(v=>v.checks.regression0)?0:'FAIL',
            PRODUCT_SITE_ROLLBACK:0,
            R7:'NOT_AUTHORIZED_NOT_EXECUTED',
            FINAL_LOCK:'CENTRAL_DECISION_ONLY',
          };
          if(Object.values(report.gates).some(v=>v==='FAIL')) report.overall='FAIL';
          fs.writeFileSync('R6_LIVE_QA_EVIDENCE.json',JSON.stringify(report,null,2));
          console.log(JSON.stringify(report,null,2));
          if(report.overall!=='PASS') process.exit(1);
          NODE
          node disposal-r6-qa.mjs

      - name: Record final hashes and forward-only evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "PREWRITE_HEAD=${PREWRITE_HEAD:-}"
            echo "PREWRITE_TREE=${PREWRITE_TREE:-}"
            echo "FINAL_HEAD=${FINAL_HEAD:-}"
            echo "FINAL_TREE=${FINAL_TREE:-}"
            echo "HTML_BLOB=$(git hash-object systems/disposal.html)"
            echo "TEXT_BLOB=$(git hash-object systems/disposal.html.txt)"
            echo "HTML_SHA256=$(sha256sum systems/disposal.html | awk '{print $1}')"
            echo "TEXT_SHA256=$(sha256sum systems/disposal.html.txt | awk '{print $1}')"
            echo "HTML_TEXT_BYTE_IDENTICAL=$(cmp -s systems/disposal.html systems/disposal.html.txt && echo PASS || echo FAIL)"
            echo "FORWARD_ONLY_PARENT=$(git rev-parse HEAD^)"
          } > R6_FORWARD_ONLY_EVIDENCE.txt
          cat R6_FORWARD_ONLY_EVIDENCE.txt

      - name: Upload R6 QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DISPOSAL_R6_PRODUCT_SITE_EVIDENCE
          path: |
            R6_LIVE_QA_EVIDENCE.json
            R6_FORWARD_ONLY_EVIDENCE.txt
            /tmp/prewrite_sha256.txt
            /tmp/prewrite_blob.txt
          if-no-files-found: warn
