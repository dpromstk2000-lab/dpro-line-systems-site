name: DPRO Clinic Shuttle LP Photo Unify R12

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/clinic-shuttle-lp-photo-unify-r12.yml"
      - ".github/workflows/clinic-shuttle-lp-photo-unify-r12.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dpro-clinic-shuttle-lp-photo-unify-r12
  cancel-in-progress: false

jobs:
  lp-photo-unify-r12:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - name: Checkout PRODUCT
        uses: actions/checkout@v4
        with:
          fetch-depth: 4

      - name: Guard current PRODUCT SYSTEM FINAL LOCK and OFFICIAL
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "cba6245ec4fa22ed3f4fc725dde3dffe0519de0e" || {
            echo "PRODUCT parent drift"; exit 1;
          }
          SYSTEM_HEAD="$(git ls-remote https://github.com/dpromstk2000-lab/dpro-clinic-shuttle-line.git refs/heads/main | awk '{print $1}')"
          test "$SYSTEM_HEAD" = "3fc09f4b5c6781d6038dc280de5c58752ce60b51" || {
            echo "SYSTEM FINAL LOCK drift: $SYSTEM_HEAD"; exit 1;
          }
          OFFICIAL_HEAD="$(git ls-remote https://github.com/dpromstk2000-lab/dpro-shop-official-site.git refs/heads/main | awk '{print $1}')"
          test "$OFFICIAL_HEAD" = "b92a4d6444375aefc481db267d626c5a712164a5" || {
            echo "OFFICIAL head drift: $OFFICIAL_HEAD"; exit 1;
          }

      - name: Replace old LP hero with bright Japanese clinic image
        run: python .github/workflows/clinic-shuttle-lp-photo-unify-r12.py patch

      - name: Commit LP image unification
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lp-clinic-shuttle.html assets/clinic-shuttle-next/R12_LP_PHOTO_UNIFY_SOURCE.json
          git commit -m "Unify clinic shuttle LP with bright hero image"
          git push origin main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install browser QA
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Verify LP image unification on 390 768 1440
        run: python .github/workflows/clinic-shuttle-lp-photo-unify-r12.py publicqa

      - name: Commit R12 public QA evidence
        shell: bash
        run: |
          set -euo pipefail
          git add assets/clinic-shuttle-next
          git commit -m "Verify clinic shuttle LP image unification R12"
          git push origin main

      - name: Remove R12 one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin main
          git rm -f .github/workflows/clinic-shuttle-lp-photo-unify-r12.yml .github/workflows/clinic-shuttle-lp-photo-unify-r12.py
          git commit -m "Remove completed clinic shuttle LP image workflow"
          git push origin main
