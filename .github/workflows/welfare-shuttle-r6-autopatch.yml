name: DPRO WELFARE SHUTTLE R6 Product Site Auto Patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/welfare-shuttle-r6-autopatch.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-product-site:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Patch WELFARE_SHUTTLE product page safely
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          targets = [
              Path("systems/welfare-shuttle.html"),
              Path("systems/welfare-shuttle.html.txt"),
          ]
          required_manuals = [
              Path("DPRO_TUTORIAL_WELFARE_SHUTTLE_QUICK_START_V1.0.pdf"),
              Path("DPRO_TUTORIAL_WELFARE_SHUTTLE_DETAILED_MANUAL_V1.0.pdf"),
          ]
          old = '<div class="ps-doclinks" aria-label="関連資料"><a href="../lp-welfare-shuttle.html">詳しい紹介を見る</a><a href="../flyer-welfare-shuttle.html">A4チラシを見る</a><a href="../flyer-welfare-shuttle.pdf">PDF資料を開く</a></div>'
          new = '<div class="ps-doclinks" aria-label="関連資料"><a href="../lp-welfare-shuttle.html">詳しい紹介を見る</a><a href="../flyer-welfare-shuttle.html">A4チラシを見る</a><a href="../flyer-welfare-shuttle.pdf">PDF資料を開く</a><a href="../DPRO_TUTORIAL_WELFARE_SHUTTLE_QUICK_START_V1.0.pdf">操作ガイド（Quick Start）</a><a href="../DPRO_TUTORIAL_WELFARE_SHUTTLE_DETAILED_MANUAL_V1.0.pdf">詳細操作マニュアル</a></div>'

          for manual in required_manuals:
              if not manual.is_file():
                  raise SystemExit(f"Required manual is missing: {manual}")

          original = []
          for path in targets:
              if not path.is_file():
                  raise SystemExit(f"Target is missing: {path}")
              text = path.read_text(encoding="utf-8")
              original.append(text)
              if new in text:
                  continue
              count = text.count(old)
              if count != 1:
                  raise SystemExit(
                      f"Safety stop: expected exactly one old doclinks block in {path}, found {count}"
                  )
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          html = targets[0].read_text(encoding="utf-8")
          mirror = targets[1].read_text(encoding="utf-8")
          if html != mirror:
              raise SystemExit("Safety stop: welfare-shuttle.html and mirror are not identical")
          for required in [
              "DPRO_TUTORIAL_WELFARE_SHUTTLE_QUICK_START_V1.0.pdf",
              "DPRO_TUTORIAL_WELFARE_SHUTTLE_DETAILED_MANUAL_V1.0.pdf",
              "月額合計 5,500円（税込）",
              "https://dpromstk2000-lab.github.io/dpro-welfare-shuttle-line/?demo=1",
          ]:
              if required not in html:
                  raise SystemExit(f"Safety stop: required existing/new marker missing: {required}")
          print("R6 product-site patch QA: PASS")
          PY

      - name: Commit product page and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add systems/welfare-shuttle.html systems/welfare-shuttle.html.txt
          git rm .github/workflows/welfare-shuttle-r6-autopatch.yml
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "R6: publish WELFARE_SHUTTLE tutorial manuals"
          git push origin HEAD:main
