name: DPRO Clinic Shuttle V1.2 Product Fact Fix R2A

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/clinic-shuttle-v12-product-fact-fix-r2a.yml"
      - ".github/workflows/clinic-shuttle-v12-product-fact-fix-r2a.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dpro-clinic-shuttle-v12-product-fact-fix-r2a
  cancel-in-progress: false

jobs:
  product-fact-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout PRODUCT
        uses: actions/checkout@v4
        with:
          fetch-depth: 5

      - name: Guard PRODUCT parent and SYSTEM FINAL LOCK
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "357f01ca3d2d0596e57af8e893cc7e76eff5f3b1" || {
            echo "PRODUCT drift before R2A"; exit 1;
          }
          SYSTEM_HEAD="$(git ls-remote https://github.com/dpromstk2000-lab/dpro-clinic-shuttle-line.git refs/heads/main | awk '{print $1}')"
          test "$SYSTEM_HEAD" = "3fc09f4b5c6781d6038dc280de5c58752ce60b51" || {
            echo "SYSTEM FINAL LOCK drift: $SYSTEM_HEAD"; exit 1;
          }

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Preserve runner
        run: cp .github/workflows/clinic-shuttle-v12-product-fact-fix-r2a.py /tmp/clinic-shuttle-v12-r2a.py

      - name: Fix and scan PRODUCT semantic count
        run: python /tmp/clinic-shuttle-v12-r2a.py patch

      - name: Commit PRODUCT fact fix and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add product-v3.6.js
          git rm -f \
            .github/workflows/clinic-shuttle-v12-product-fact-fix-r2a.yml \
            .github/workflows/clinic-shuttle-v12-product-fact-fix-r2a.py
          git commit -m "Close clinic shuttle V1.2 PRODUCT count defect"
          FINAL_HEAD="$(git rev-parse HEAD)"
          echo "FINAL_PRODUCT_HEAD=$FINAL_HEAD" >> "$GITHUB_ENV"
          git push origin main

      - name: Install browser QA
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Verify Pages public count and SYSTEM protection
        run: python /tmp/clinic-shuttle-v12-r2a.py publicqa

      - name: Upload R2A evidence
        uses: actions/upload-artifact@v4
        with:
          name: clinic-shuttle-v12-product-fact-fix-r2a-evidence
          path: release-evidence-v12/
          if-no-files-found: error
          retention-days: 30
