name: DPRO DAYCARE Product Site Brushup R1

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Patch DAYCARE product site
        shell: bash
        env:
          PATCH_B64: ""
        run: |
          set -euo pipefail
          python -c 'import os,base64; exec(base64.b64decode(os.environ["PATCH_B64"]).decode("utf-8"))'

          grep -q 'DPRO DAYCARE PRODUCT SITE BRUSHUP R1 20261001' systems/dayservice.html
          grep -q '10 CORE FUNCTIONS' systems/dayservice.html
          grep -q 'EMERGENCY FAMILY CONTACT' systems/dayservice.html
          grep -q '自動段階配信' systems/dayservice.html
          cmp systems/dayservice.html systems/dayservice.html.txt
          echo "STATIC_QA=PASS"

      - name: Commit product site
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add systems/dayservice.html systems/dayservice.html.txt
          if git diff --cached --quiet; then
            echo "No source changes to commit."
          else
            git commit -m "DAYCARE product site brushup R1"
            git push origin HEAD:main
          fi

      - name: Summary
        shell: bash
        run: |
          {
            echo "## DPRO DAYCARE Product Site Brushup R1"
            echo ""
            echo "- Existing visual design: preserved"
            echo "- Hero: emergency communication positioning added"
            echo "- Core functions: 6 -> 10"
            echo "- Multiple families / contact priority: added"
            echo "- Emergency broadcast: added"
            echo "- Automatic staged escalation: added"
            echo "- Broadcast history UX: added"
            echo "- LIVE DEMO: FINAL LOCK DAYCARE content reflected"
            echo "- FAQ: emergency routing questions added"
            echo "- Pricing: unchanged"
            echo "- HTML/TEXT mirror: aligned"
          } >> "$GITHUB_STEP_SUMMARY"
