name: DPRO NAIL public demo guide V1.1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/dpro-nail-public-demo-v1_1.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Switch NAIL LIVE DEMO entry to demo guide
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("systems-data.js")
          text = path.read_text(encoding="utf-8")

          old = '"demoUrl": "https://dpromstk2000-lab.github.io/liff-nail-reserve/index.html"'
          new = '"demoUrl": "https://dpromstk2000-lab.github.io/liff-nail-reserve/demo-guide.html"'

          # Scope the replacement to the NAIL object only.
          marker = '"code": "NAIL"'
          start = text.find(marker)
          if start < 0:
              raise SystemExit("NAIL object not found in systems-data.js")

          end = text.find('\n  },', start)
          if end < 0:
              raise SystemExit("NAIL object end not found in systems-data.js")

          block = text[start:end]

          if new in block:
              print("NAIL demoUrl already points to demo-guide.html; no URL change needed.")
          elif old in block:
              block = block.replace(old, new, 1)
              text = text[:start] + block + text[end:]
              path.write_text(text, encoding="utf-8")
              print("Updated NAIL demoUrl in systems-data.js")
          else:
              raise SystemExit("Expected NAIL demoUrl not found; aborting without changing other systems.")

          # Verify no unrelated catalog URL was changed by this script.
          verify = path.read_text(encoding="utf-8")
          nstart = verify.find(marker)
          nend = verify.find('\n  },', nstart)
          nblock = verify[nstart:nend]
          if new not in nblock:
              raise SystemExit("Verification failed: NAIL demo-guide URL missing after patch")

          print("PASS: NAIL canonical LIVE DEMO entry is demo-guide.html")
          PY

      - name: Commit catalog update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet -- systems-data.js; then
            echo "systems-data.js already correct; nothing to commit."
          else
            git add systems-data.js
            git commit -m "Point NAIL LIVE DEMO to public demo guide"
            git push origin main
          fi

      - name: Remove one-shot workflow
        if: always()
        shell: bash
        run: |
          git fetch origin main
          git reset --hard origin/main

          if [ -f ".github/workflows/dpro-nail-public-demo-v1_1.yml" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git rm ".github/workflows/dpro-nail-public-demo-v1_1.yml"
            git commit -m "Remove one-shot NAIL demo guide patch V1.1"
            git push origin main
          else
            echo "One-shot workflow already removed."
          fi
