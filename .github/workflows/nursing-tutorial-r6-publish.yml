name: NURSING Tutorial R6 Publish

on:
  push:
    branches:
      - main
    paths:
      - 'NURSING_PRODUCT_SITE_TUTORIAL_MANUAL_SECTION.html'
      - '.github/workflows/nursing-tutorial-r6-publish.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply guarded NURSING R6 Product Site patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          page = Path("lp-homenursing.html")
          fragment_path = Path("NURSING_PRODUCT_SITE_TUTORIAL_MANUAL_SECTION.html")
          marker = "<!-- DPRO TUTORIAL NURSING R6 / merge-ready minimal section -->"

          if not page.exists():
              raise SystemExit("FAIL CLOSED: lp-homenursing.html not found")
          if not fragment_path.exists():
              raise SystemExit("FAIL CLOSED: fragment not found")

          source = page.read_text(encoding="utf-8")
          fragment = fragment_path.read_text(encoding="utf-8").strip()

          if marker in source:
              print("NURSING R6 section already present; no page mutation required")
          else:
              count = source.count("</main>")
              if count != 1:
                  raise SystemExit(f"FAIL CLOSED: expected exactly one </main>, found {count}")
              before, after = source.split("</main>", 1)
              updated = before.rstrip() + "\n\n" + fragment + "\n\n</main>" + after
              page.write_text(updated, encoding="utf-8")
              print("Inserted NURSING R6 section immediately before </main>")
          PY

      - name: Commit Product Site and remove one-shot files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add lp-homenursing.html
          git rm -f NURSING_PRODUCT_SITE_TUTORIAL_MANUAL_SECTION.html
          git rm -f .github/workflows/nursing-tutorial-r6-publish.yml

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Publish NURSING tutorial R6 manuals"
          git push
