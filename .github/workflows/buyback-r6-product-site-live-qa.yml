name: DPRO TUTORIAL BUYBACK R6 PRODUCT SITE + LIVE QA

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/buyback-r6-product-site-live-qa.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dpro-tutorial-product-site-r6
  cancel-in-progress: false

env:
  PRODUCT_URL: https://dpromstk2000-lab.github.io/dpro-line-systems-site/systems/buyback.html
  GUIDE_URL: https://dpromstk2000-lab.github.io/dpro-buyback-line/guide-center.html
  TUTORIAL_URL: https://dpromstk2000-lab.github.io/dpro-buyback-line/tutorial.html
  QUICK_PDF_URL: https://dpromstk2000-lab.github.io/dpro-buyback-line/DPRO_TUTORIAL_BUYBACK_QUICK_START_V1.0.pdf
  DETAIL_PDF_URL: https://dpromstk2000-lab.github.io/dpro-buyback-line/DPRO_TUTORIAL_BUYBACK_DETAILED_MANUAL_V1.0.pdf
  QUICK_PNG_URL: https://dpromstk2000-lab.github.io/dpro-buyback-line/DPRO_TUTORIAL_BUYBACK_QUICK_START_V1.0.png
  DETAIL_PNG_URL: https://dpromstk2000-lab.github.io/dpro-buyback-line/DPRO_TUTORIAL_BUYBACK_DETAILED_MANUAL_V1.0.png
  R6_MARKER: DPRO_TUTORIAL_BUYBACK_PRODUCT_SITE_R6_20260828

jobs:
  apply-and-live-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Product Site main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fast-forward to newest main immediately before R6 write
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git pull --ff-only origin main
          echo "PRODUCT_BASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "PRODUCT_BASE_TREE=$(git rev-parse HEAD^{tree})" >> "$GITHUB_ENV"
          test -f systems/buyback.html
          test -f systems/buyback.html.txt
          cmp -s systems/buyback.html systems/buyback.html.txt || {
            echo 'HOLD: BUYBACK html/txt mirror drift exists before R6.' >&2
            exit 1
          }
          echo "BUYBACK_BASE_BLOB=$(git hash-object systems/buyback.html)" >> "$GITHUB_ENV"

      - name: Verify published BUYBACK R5 assets and current Tutorial routes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa-evidence
          for url in "$GUIDE_URL" "$TUTORIAL_URL" "$QUICK_PDF_URL" "$DETAIL_PDF_URL" "$QUICK_PNG_URL" "$DETAIL_PNG_URL"; do
            code=$(curl --location --silent --show-error --retry 5 --retry-delay 2 -o /dev/null -w '%{http_code}' "$url")
            echo "$code $url"
            [[ "$code" == "200" ]]
          done

      - name: Guard BUYBACK Product Site baseline
        shell: bash
        run: |
          set -euo pipefail
          for p in systems/buyback.html systems/buyback.html.txt; do
            grep -Fq '<body data-system-code="BUYBACK">' "$p"
            grep -Fq 'id="connected"' "$p"
            grep -Fq 'id="price"' "$p"
            grep -Fq 'https://lin.ee/YxJGXV6D' "$p"
            grep -Fq 'https://dpromstk2000-lab.github.io/dpro-buyback-line/index.html?demo=1&amp;v=buyback-10' "$p"
            grep -Fq '写真査定' "$p"
            grep -Fq '複数商品管理' "$p"
            grep -Fq '商品別査定額' "$p"
            grep -Fq '売却回答' "$p"
            grep -Fq '担当・フォロー' "$p"
          done

      - name: Apply BUYBACK Tutorial and manuals section only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          targets=[Path('systems/buyback.html'),Path('systems/buyback.html.txt')]
          marker='DPRO_TUTORIAL_BUYBACK_PRODUCT_SITE_R6_20260828'
          css=f'''\n/* {marker} START */\n.ps-tutorial-grid{{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.9rem}}\n.ps-tutorial-card{{min-width:0;overflow:hidden;padding:1.05rem;border:1px solid var(--ps-line);border-radius:1rem;background:#fff;box-shadow:var(--dpro-shadow-sm)}}\n.ps-tutorial-card>span{{display:block;color:var(--dpro-green);font-size:.7rem;font-weight:900;letter-spacing:.1em}}\n.ps-tutorial-card h3{{margin:.35rem 0;color:var(--ps-deep);font-size:1.02rem;line-height:1.4}}\n.ps-tutorial-card p{{margin:0;color:var(--dpro-warm-gray-600);font-size:.86rem}}\n.ps-tutorial-card img{{display:block;width:100%;height:148px;margin-top:.8rem;border:1px solid var(--ps-line);border-radius:.72rem;background:var(--ps-pale);object-fit:cover;object-position:top}}\n.ps-tutorial-actions{{display:flex;flex-wrap:wrap;gap:.45rem;margin-top:.85rem}}\n.ps-tutorial-actions a{{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:.55rem .75rem;border-radius:.72rem;background:var(--dpro-deep-green);color:#fff;text-decoration:none;font-size:.8rem;font-weight:900}}\n.ps-tutorial-actions a.secondary{{border:1px solid var(--ps-line);background:#fff;color:var(--ps-deep)}}\n.ps-tutorial-actions a:focus,.ps-tutorial-actions a:focus-visible{{outline:3px solid #f2b94b;outline-offset:3px}}\n.ps-tutorial-note{{margin:1rem 0 0;padding:.9rem 1rem;border-left:4px solid var(--dpro-green);background:#fff;color:#395149;font-size:.88rem}}\n@media(max-width:980px){{.ps-tutorial-grid{{grid-template-columns:repeat(2,minmax(0,1fr))}}}}\n@media(max-width:640px){{.ps-tutorial-grid{{grid-template-columns:1fr}}.ps-tutorial-actions{{display:grid;grid-template-columns:1fr}}.ps-tutorial-actions a{{width:100%}}.ps-tutorial-card img{{height:auto;max-height:360px;object-fit:contain}}}}\n/* {marker} END */\n'''
          section=f'''<section class="dpro-section ps-section-soft" id="tutorial-guide" aria-labelledby="tutorial-guide-title" data-dpro-tutorial-r6="{marker}"><div class="dpro-container"><div class="ps-section-heading"><p class="ps-kicker">TUTORIAL / PRINT MANUALS</p><h2 id="tutorial-guide-title">操作を見ながら確認。印刷して手元でも確認。</h2><p>STANDARD V1.1のFirst10、Guide Center、R5印刷マニュアルを、現在のBUYBACK公開デモへつながる導線としてまとめています。</p></div><div class="ps-tutorial-grid"><article class="ps-tutorial-card"><span>01 / GUIDE CENTER</span><h3>10ステップの入口を確認</h3><p>First10の全体像を確認して、そのままTutorialを開始できます。</p><div class="ps-tutorial-actions"><a data-r6-link="guide" href="https://dpromstk2000-lab.github.io/dpro-buyback-line/guide-center.html" target="_blank" rel="noopener">Guide Center</a></div></article><article class="ps-tutorial-card"><span>02 / FIRST10</span><h3>First10を実画面で体験</h3><p>受付→査定結果→スタッフ査定→オーナー管理をexactly 10で確認します。</p><div class="ps-tutorial-actions"><a data-r6-link="tutorial" href="https://dpromstk2000-lab.github.io/dpro-buyback-line/tutorial.html" target="_blank" rel="noopener">Tutorialを開く</a></div></article><article class="ps-tutorial-card"><span>03 / QUICK START</span><h3>1枚で流れを確認</h3><p>A4クイックスタート。Guide CenterとTutorialのQRを実読取確認済みです。</p><img src="https://dpromstk2000-lab.github.io/dpro-buyback-line/DPRO_TUTORIAL_BUYBACK_QUICK_START_V1.0.png" alt="BUYBACK Quick Start プレビュー" loading="lazy"><div class="ps-tutorial-actions"><a data-r6-link="quick-pdf" href="https://dpromstk2000-lab.github.io/dpro-buyback-line/DPRO_TUTORIAL_BUYBACK_QUICK_START_V1.0.pdf" target="_blank" rel="noopener">Quick Start PDF</a></div></article><article class="ps-tutorial-card"><span>04 / DETAILED MANUAL</span><h3>手順を詳しく確認</h3><p>First10の安全ルールと画面を6ページで確認できる詳細マニュアルです。</p><img src="https://dpromstk2000-lab.github.io/dpro-buyback-line/DPRO_TUTORIAL_BUYBACK_DETAILED_MANUAL_V1.0.png" alt="BUYBACK Detailed Manual プレビュー" loading="lazy"><div class="ps-tutorial-actions"><a data-r6-link="detail-pdf" href="https://dpromstk2000-lab.github.io/dpro-buyback-line/DPRO_TUTORIAL_BUYBACK_DETAILED_MANUAL_V1.0.pdf" target="_blank" rel="noopener">Detailed Manual PDF</a></div></article></div><p class="ps-tutorial-note">Tutorialは操作場所と流れを確認するための導線です。送信・写真アップロード・査定保存・担当変更・タスク完了などの業務更新は行いません。</p></div></section>'''

          css_start=f'/* {marker} START */'
          css_end=f'/* {marker} END */'
          section_token=f'data-dpro-tutorial-r6="{marker}"'

          before=targets[0].read_text(encoding='utf-8')
          already=marker in before
          if already:
              if before.count(css_start)!=1 or before.count(css_end)!=1 or before.count(section_token)!=1:
                  raise SystemExit('HOLD: partial/duplicate BUYBACK R6 marker found')
              if targets[0].read_bytes()!=targets[1].read_bytes():
                  raise SystemExit('HOLD: mirror drift in already-patched R6 state')
              print('BUYBACK R6 section already present; idempotent PASS')
              raise SystemExit(0)

          if '</style>' not in before or '</main>' not in before:
              raise SystemExit('HOLD: safe BUYBACK insertion anchors missing')

          patched=before.replace('</style>',css+'\n</style>',1)
          final_anchor='<section class="dpro-section ps-final'
          if final_anchor in patched:
              patched=patched.replace(final_anchor,section+final_anchor,1)
          else:
              patched=patched.replace('</main>',section+'</main>',1)

          # Prove that removing only the inserted blocks reconstructs the exact baseline.
          stripped=patched.replace(css+'\n','',1).replace(section,'',1)
          if stripped!=before:
              raise SystemExit('HOLD: patch touched content outside BUYBACK Tutorial section')

          for p in targets:
              p.write_text(patched,encoding='utf-8')
          if targets[0].read_bytes()!=targets[1].read_bytes():
              raise SystemExit('HOLD: R6 patch did not keep html/txt byte-identical')

          required=[
              'id="tutorial-guide"',
              'guide-center.html',
              'tutorial.html',
              'DPRO_TUTORIAL_BUYBACK_QUICK_START_V1.0.pdf',
              'DPRO_TUTORIAL_BUYBACK_DETAILED_MANUAL_V1.0.pdf',
              'DPRO_TUTORIAL_BUYBACK_QUICK_START_V1.0.png',
              'DPRO_TUTORIAL_BUYBACK_DETAILED_MANUAL_V1.0.png'
          ]
          for token in required:
              if token not in patched:
                  raise SystemExit('HOLD: missing R6 token '+token)
          print('BUYBACK R6 page patch: PASS')
          PY

      - name: Verify Product Site regression guard and exact changed paths
        shell: bash
        run: |
          set -euo pipefail
          cmp -s systems/buyback.html systems/buyback.html.txt
          for p in systems/buyback.html systems/buyback.html.txt; do
            grep -Fq '<body data-system-code="BUYBACK">' "$p"
            grep -Fq 'id="connected"' "$p"
            grep -Fq 'id="price"' "$p"
            grep -Fq 'https://lin.ee/YxJGXV6D' "$p"
            grep -Fq 'https://dpromstk2000-lab.github.io/dpro-buyback-line/index.html?demo=1&amp;v=buyback-10' "$p"
            grep -Fq "${R6_MARKER}" "$p"
          done
          changed=$(git diff --name-only | sort)
          if [[ -n "$changed" ]]; then
            printf '%s\n' "$changed"
            [[ "$changed" == $'systems/buyback.html\nsystems/buyback.html.txt' ]]
          fi

      - name: Commit BUYBACK R6 Product Site integration when changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- systems/buyback.html systems/buyback.html.txt; then
            echo 'No BUYBACK page patch needed.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add systems/buyback.html systems/buyback.html.txt
            git commit -m 'BUYBACK R6 Product Site tutorial/manual integration'
            if ! git push origin HEAD:main; then
              echo 'Main advanced; rebasing forward-only onto newest main.'
              git fetch origin main
              git rebase origin/main || {
                echo 'HOLD: conflict while preserving newer Product Site main.' >&2
                git rebase --abort || true
                exit 1
              }
              git push origin HEAD:main
            fi
          fi
          echo "R6_PAGE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "R6_PAGE_TREE=$(git rev-parse HEAD^{tree})" >> "$GITHUB_ENV"

      - name: Install LIVE QA tools
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Playwright
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install requests playwright
          python -m playwright install --with-deps chromium

      - name: Wait for Pages and run exact-width R6 LIVE QA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa-evidence
          cat > "$RUNNER_TEMP/buyback_r6_live_qa.py" <<'PY'
          import json, os, time, requests
          from pathlib import Path
          from playwright.sync_api import sync_playwright

          PRODUCT=os.environ['PRODUCT_URL']
          GUIDE=os.environ['GUIDE_URL']
          TUTORIAL=os.environ['TUTORIAL_URL']
          QUICK_PDF=os.environ['QUICK_PDF_URL']
          DETAIL_PDF=os.environ['DETAIL_PDF_URL']
          QUICK_PNG=os.environ['QUICK_PNG_URL']
          DETAIL_PNG=os.environ['DETAIL_PNG_URL']
          MARKER=os.environ['R6_MARKER']
          widths=[(1440,1000),(1024,768),(390,844),(320,720)]

          session=requests.Session()
          session.headers['Cache-Control']='no-cache'
          deadline=time.time()+180
          product_text=''
          while time.time()<deadline:
              r=session.get(PRODUCT,params={'r6':str(time.time_ns())},timeout=20)
              if r.status_code==200 and MARKER in r.text:
                  product_text=r.text
                  break
              time.sleep(4)
          else:
              raise SystemExit('Pages did not publish BUYBACK R6 marker')

          urls={
              'product':PRODUCT,'guide':GUIDE,'tutorial':TUTORIAL,
              'quick_pdf':QUICK_PDF,'detail_pdf':DETAIL_PDF,
              'quick_png':QUICK_PNG,'detail_png':DETAIL_PNG,
          }
          routes=[]
          for name,url in urls.items():
              r=session.get(url,params={'qa':str(time.time_ns())},timeout=30,allow_redirects=True)
              ok=r.status_code==200
              if name.endswith('_pdf'):
                  ok=ok and (r.content[:4]==b'%PDF' or 'application/pdf' in r.headers.get('content-type',''))
              if name.endswith('_png'):
                  ok=ok and r.content[:8]==b'\x89PNG\r\n\x1a\n'
              routes.append({'name':name,'url':url,'status':r.status_code,'contentType':r.headers.get('content-type',''),'pass':ok})
          if not all(x['pass'] for x in routes):
              raise SystemExit('R6 route check failed: '+json.dumps(routes,ensure_ascii=False))

          results=[]
          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True)
              for w,h in widths:
                  page=browser.new_page(viewport={'width':w,'height':h})
                  page_errors=[]; console_errors=[]
                  page.on('pageerror',lambda e,arr=page_errors:arr.append(str(e)))
                  page.on('console',lambda m,arr=console_errors: arr.append(m.text) if m.type=='error' else None)
                  page.goto(PRODUCT+'?r6qa='+str(time.time_ns()),wait_until='networkidle',timeout=60000)
                  section=page.locator('#tutorial-guide')
                  section_visible=section.is_visible()
                  links={}
                  expected={
                      'guide':GUIDE,'tutorial':TUTORIAL,
                      'quick-pdf':QUICK_PDF,'detail-pdf':DETAIL_PDF,
                  }
                  for key,url in expected.items():
                      loc=page.locator(f'[data-r6-link="{key}"]')
                      links[key]=(loc.count()==1 and loc.get_attribute('href')==url and loc.is_visible())
                  overflow=(page.evaluate('document.documentElement.scrollWidth')<=w and page.evaluate('document.body.scrollWidth')<=w)
                  focus_pass=True
                  for key in expected:
                      loc=page.locator(f'[data-r6-link="{key}"]')
                      loc.focus()
                      focus_pass=focus_pass and loc.evaluate('el=>document.activeElement===el') and loc.evaluate("el=>getComputedStyle(el).outlineStyle!=='none' && parseFloat(getComputedStyle(el).outlineWidth||0)>0")
                  # Baseline regression smoke: original core sections/CTA/demo still exist and are visible/present.
                  baseline={
                      'hero':page.locator('#hero-title').count()==1,
                      'functions':page.locator('#functions').count()==1,
                      'live':page.locator('#live').count()==1,
                      'connected':page.locator('#connected').count()==1,
                      'price':page.locator('#price').count()==1,
                      'line':page.locator('a[href="https://lin.ee/YxJGXV6D"]').count()>=1,
                      'demo':page.locator('[data-src*="dpro-buyback-line/index.html?demo=1"]').count()>=1,
                  }
                  img_pass=True
                  for sel in ['img[alt="BUYBACK Quick Start プレビュー"]','img[alt="BUYBACK Detailed Manual プレビュー"]']:
                      loc=page.locator(sel)
                      if loc.count()!=1:
                          img_pass=False
                      else:
                          loc.scroll_into_view_if_needed()
                          page.wait_for_timeout(250)
                          img_pass=img_pass and loc.evaluate('img=>img.complete && img.naturalWidth>0')
                  shot=f'qa-evidence/r6-{w}.png'
                  page.screenshot(path=shot,full_page=True)
                  item={
                      'width':w,'height':h,
                      'innerWidth':page.evaluate('innerWidth'),
                      'documentElementScrollWidth':page.evaluate('document.documentElement.scrollWidth'),
                      'bodyScrollWidth':page.evaluate('document.body.scrollWidth'),
                      'sectionVisible':section_visible,'links':links,'overflow0':overflow,
                      'keyboardFocus':focus_pass,'previewsLoaded':img_pass,'baseline':baseline,
                      'pageErrors':page_errors,'consoleErrors':console_errors,
                  }
                  item['pass']=all([
                      section_visible,all(links.values()),overflow,focus_pass,img_pass,
                      all(baseline.values()),len(page_errors)==0,len(console_errors)==0
                  ])
                  results.append(item)
                  page.close()
              browser.close()

          evidence={
              'schema':'DPRO_TUTORIAL_BUYBACK_R6_PRODUCT_SITE_QA_V1_0',
              'productBaseSha':os.environ.get('PRODUCT_BASE_SHA'),
              'productBaseTree':os.environ.get('PRODUCT_BASE_TREE'),
              'buybackBaseBlob':os.environ.get('BUYBACK_BASE_BLOB'),
              'r6PageSha':os.environ.get('R6_PAGE_SHA'),
              'r6PageTree':os.environ.get('R6_PAGE_TREE'),
              'marker':MARKER,'routes':routes,'viewports':results,
              'businessMutations':[],
              'businessMutation0':True,
              'productSiteRollback0':True,
              'protectedBoundaries':'Product Site only; no industry Worker/DB/Supabase/Auth/Role/Permission/Feature Flag writes.',
          }
          evidence['overall']=all(x['pass'] for x in routes) and all(x['pass'] for x in results)
          Path('qa-evidence/r6-live-qa.json').write_text(json.dumps(evidence,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(evidence,ensure_ascii=False,indent=2))
          if not evidence['overall']:
              raise SystemExit('BUYBACK R6 LIVE QA failed')
          PY
          python "$RUNNER_TEMP/buyback_r6_live_qa.py"

      - name: Upload R6 QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: buyback-r6-live-qa-${{ env.R6_PAGE_SHA }}
          path: qa-evidence/
          if-no-files-found: error

      - name: Self-remove temporary R6 workflow after PASS
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout main
          git pull --ff-only origin main
          wf='.github/workflows/buyback-r6-product-site-live-qa.yml'
          if [[ -f "$wf" ]]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git rm "$wf"
            git commit -m 'Remove temporary BUYBACK R6 workflow after PASS'
            git push origin main
          fi
