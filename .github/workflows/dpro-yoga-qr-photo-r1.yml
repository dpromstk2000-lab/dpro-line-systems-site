name: DPRO YOGA QR PHOTO R1
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/dpro-yoga-qr-photo-r1.yml']
permissions:
  contents: write
concurrency:
  group: yoga-qr-photo-r1
  cancel-in-progress: false
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install QA tools
        run: |
          python -m pip install 'qrcode[pil]' playwright pymupdf zxing-cpp requests
          python -m playwright install --with-deps chromium
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
      - name: Repair YOGA photo QR and verify A4
        run: |
          python - <<'PY'
          import base64, html, io, json, pathlib, re
          import qrcode, requests, fitz, zxingcpp
          from PIL import Image
          from playwright.sync_api import sync_playwright
          root=pathlib.Path.cwd()
          path=root/'flyer-yoga.html'; pdf=root/'flyer-yoga.pdf'; qa=root/'yoga-qr-qa'; qa.mkdir(exist_ok=True)
          source=path.read_text(encoding='utf-8')
          url='https://dpromstk2000-lab.github.io/liff-yoga-reserve/owner.html?demo=1'
          old=url+'&v=yoga-next-10'
          assert 'DPRO ヨガ A4営業チラシ' in source and '5,500円' in source
          assert 'window.print()' in source and source.count('class="feature"')==6
          updated=source
          # Replace only the hero photo, not the page or any generated QR graphic.
          photo=''
          assert Image.open(io.BytesIO(base64.b64decode(photo))).format=='JPEG'
          rx=re.compile(r'(<figure class="hero-photo">\s*)<img\b[^>]*>')
          assert len(rx.findall(updated))==1
          updated=rx.sub(lambda m:m.group(1)+'<img alt="明るいヨガスタジオでポーズをとる日本人女性のイメージ（AI生成）" src="data:image/jpeg;base64,'+photo+'"/>',updated,count=1)
          updated=updated.replace('<!-- Industry photo: Cliff Booth / Pexels, free stock photo. Formal LP P1/P10 photos failed industry-match audit. -->','<!-- YOGA R1: AI-generated industry image, photo only. -->')
          # Keep demo mode explicit; omit only cache/version parameter.
          assert html.escape(old,quote=True) in updated or html.escape(url,quote=True) in updated
          updated=updated.replace(html.escape(old,quote=True),html.escape(url,quote=True))
          # URL text within the CTA is redundant; the actual anchor stays clickable.
          updated=updated.replace('<div class="url">'+url+'</div>','<div class="url">QRまたはクリックで開く</div>')
          expected={'LINEで相談 QRコード':'https://lin.ee/YxJGXV6D','DPRO SHOP QRコード':'https://dpro-shop.com/','ヨガ管理画面を体験 QRコード':url}
          modules={}
          for alt,target in expected.items():
              q=qrcode.QRCode(error_correction=qrcode.constants.ERROR_CORRECT_M,box_size=16,border=4)
              q.add_data(target);q.make(fit=True); img=q.make_image(fill_color='black',back_color='white').convert('RGB')
              decoded=zxingcpp.read_barcode(img);assert decoded and decoded.text==target,alt
              modules[alt]=q.modules_count
              b=io.BytesIO();img.save(b,format='PNG');uri='data:image/png;base64,'+base64.b64encode(b.getvalue()).decode('ascii')
              pattern=re.compile(r'<img\b[^>]*\balt="'+re.escape(alt)+r'"[^>]*>')
              assert len(pattern.findall(updated))==1,alt
              updated=pattern.sub(lambda _:f'<img alt="{alt}" src="{uri}"/>',updated,count=1)
          css="""
          /* YOGA_QR_PHOTO_R1_20261126: readable real QR, preserve A4 master. */
          .action-grid .action{height:27.5mm!important;min-height:27.5mm!important;grid-template-columns:22mm minmax(0,1fr)!important;gap:1.3mm!important;padding:1.3mm!important}
          .action-grid .action img{width:22mm!important;height:22mm!important;image-rendering:pixelated;background:#fff;display:block}
          .action-grid .action:last-child{grid-template-columns:24mm minmax(0,1fr)!important}
          .action-grid .action:last-child img{width:24mm!important;height:24mm!important}
          .action-grid .action h3{font-size:8px!important}
          .action-grid .action .url.official-master-url{font-size:2.7mm!important;letter-spacing:-.04em!important;padding:.8mm!important}
          .action-grid .action .url{font-size:5px!important}
          .eco{padding-top:3mm;padding-bottom:3mm}.eco-head{margin-bottom:2mm}.mitem{padding-top:.9mm;padding-bottom:.9mm}
          .hero-photo img{object-position:52% center}
          """
          if 'YOGA_QR_PHOTO_R1_20261126' not in updated:
              assert '</head>' in updated
              updated=updated.replace('</head>','<style>'+css+'</style></head>',1)
          assert '5,500円' in updated and updated.count('class="feature"')==6 and 'window.print()' in updated
          path.write_text(updated,encoding='utf-8')
          # Static asset verification and visual/print checks; no patient data or write API calls.
          with sync_playwright() as pw:
              browser=pw.chromium.launch(args=['--no-sandbox'])
              page=browser.new_page(viewport={'width':1440,'height':1250},device_scale_factor=3)
              page.goto(path.as_uri(),wait_until='load');page.evaluate('document.fonts.ready')
              for i,(alt,target) in enumerate(expected.items()):
                  img=page.get_by_alt_text(alt,exact=True)
                  assert img.evaluate('(e)=>e.complete && e.naturalWidth>0'),alt
                  assert img.locator('..').get_attribute('href')==target,alt
                  img.screenshot(path=str(qa/f'qr-{i}.png'))
                  assert target in {r.text for r in zxingcpp.read_barcodes(Image.open(qa/f'qr-{i}.png'))},alt
              assert page.locator('.hero-photo img').evaluate('(e)=>e.complete && e.naturalWidth>0')
              layout=page.evaluate("""() => {const rect=e=>e.getBoundingClientRect();const g=rect(document.querySelector('.action-grid')),f=rect(document.querySelector('.footer'));return {cardsBottom:g.bottom,footerTop:f.top,cards:[...document.querySelectorAll('.action-grid .action')].map(e=>{const a=rect(e),q=rect(e.querySelector('img'));return {qrFits:q.left>=a.left&&q.right<=a.right&&q.top>=a.top&&q.bottom<=a.bottom,contentFits:e.scrollWidth<=e.clientWidth+1&&e.scrollHeight<=e.clientHeight+1}})}}""")
              assert layout['cardsBottom']<=layout['footerTop']+1,layout
              assert all(c['qrFits'] and c['contentFits'] for c in layout['cards']),layout
              page.locator('.sheet').screenshot(path=str(qa/'screen.png'))
              want=set(expected.values())
              assert want <= {r.text for r in zxingcpp.read_barcodes(Image.open(qa/'screen.png'))},'full screen QR decode failed'
              page.pdf(path=str(pdf),prefer_css_page_size=True,print_background=True)
              browser.close()
          with fitz.open(pdf) as doc:
              assert len(doc)==1, f'Expected one A4 page: {len(doc)}'
              p=doc[0];assert abs(p.rect.width-595.28)<3 and abs(p.rect.height-841.89)<3
              p.get_pixmap(matrix=fitz.Matrix(3,3),alpha=False).save(str(qa/'print.png'))
          assert want <= {r.text for r in zxingcpp.read_barcodes(Image.open(qa/'print.png'))},'print QR decode failed'
          # Public GET only; report connectivity separately; never invoke admin or booking mutation.
          checks={}
          for name,endpoint in [('demo',url),('worker_health','https://yoga-liff-webhook.dpromstk2000.workers.dev/api/health')]:
              try:
                  r=requests.get(endpoint,timeout=25,headers={'User-Agent':'Mozilla/5.0 DPRO public QA'});checks[name]={'http':r.status_code,'ok':r.ok}
                  if name=='demo' and r.ok:
                      checks[name]['demo_source_verified']='IS_DEMO_OWNER' in r.text and 'yoga_demo' in r.text
                  if name=='worker_health' and r.ok:
                      d=r.json();checks[name]['json_ok']=d.get('ok') if isinstance(d,dict) else None
              except Exception as e: checks[name]={'ok':False,'error':type(e).__name__}
              if not checks[name]['ok']:print(f'::warning::Public {name} check did not pass: {checks[name]}')
          report={'qr_targets':expected,'modules':modules,'screen_qr':'PASS','print_qr':'PASS','a4_pages':1,'layout':layout,'public_get':checks,'photo':'AI-generated photo crop only','protected':'no Worker, DB, auth or system core edits'}
          (qa/'RESULT.json').write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(report,ensure_ascii=False,indent=2))
          PY
      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: YOGA-QR-PHOTO-R1-QA
          path: yoga-qr-qa/
          if-no-files-found: warn
      - name: Commit verified HTML and PDF only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- flyer-yoga.html flyer-yoga.pdf
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'YOGA: refine hero image and QR readability; regenerate verified A4 PDF'
          git push origin HEAD:main
