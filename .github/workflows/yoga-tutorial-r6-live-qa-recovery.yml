name: YOGA R6 LIVE QA Recovery + Final Lock Verification

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/yoga-tutorial-r6-live-qa-recovery.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: yoga-tutorial-r6-live-qa-recovery
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout newest Product Site main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify R6 source lock before LIVE QA
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main

          ACCEPTED_BASE='df230c8421ed8e2a27cb90e4820581ceaeee81c8'
          R6_COMMIT='16e51598501fcd2079b5a0d5bcf57dca4d4d261a'
          RECOVERY='.github/workflows/yoga-tutorial-r6-live-qa-recovery.yml'

          git merge-base --is-ancestor "$ACCEPTED_BASE" HEAD
          git merge-base --is-ancestor "$R6_COMMIT" HEAD

          test -s systems/yoga.html
          test -s systems/yoga.html.txt
          cmp -s systems/yoga.html systems/yoga.html.txt

          # Ensure current YOGA source is still exactly the R6 implementation.
          git show "$R6_COMMIT:systems/yoga.html" > /tmp/yoga-r6-lock.html
          git show "$R6_COMMIT:systems/yoga.html.txt" > /tmp/yoga-r6-lock.html.txt
          cmp -s systems/yoga.html /tmp/yoga-r6-lock.html
          cmp -s systems/yoga.html.txt /tmp/yoga-r6-lock.html.txt

          test "$(grep -o '<section class="dpro-section" data-yoga-tutorial-r6="1"' systems/yoga.html | wc -l)" -eq 1
          grep -q 'ヨガ・ピラティス' systems/yoga.html
          grep -q 'lp-yoga.html' systems/yoga.html
          grep -q 'https://dpromstk2000-lab.github.io/liff-yoga-reserve/guide-center.html' systems/yoga.html
          grep -q 'https://dpromstk2000-lab.github.io/liff-yoga-reserve/tutorial.html' systems/yoga.html
          grep -q 'DPRO_TUTORIAL_YOGA_QUICK_START_V1.0.pdf' systems/yoga.html
          grep -q 'DPRO_TUTORIAL_YOGA_DETAILED_MANUAL_V1.0.pdf' systems/yoga.html

          # The recovery upload itself must be the only file in its trigger commit.
          TRIGGER_PARENT=$(git rev-parse "${GITHUB_SHA}^")
          trigger_files=$(git diff --name-only "$TRIGGER_PARENT" "$GITHUB_SHA")
          printf '%s\n' "$trigger_files"
          test "$(printf '%s\n' "$trigger_files" | sed '/^$/d' | wc -l)" -eq 1
          printf '%s\n' "$trigger_files" | grep -qx "$RECOVERY"

          echo "ACCEPTED_BASE=$ACCEPTED_BASE" >> "$GITHUB_ENV"
          echo "R6_COMMIT=$R6_COMMIT" >> "$GITHUB_ENV"
          echo "RECOVERY_PATH=$RECOVERY" >> "$GITHUB_ENV"
          echo "QA_START_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

          echo 'R6 source lock / normal+TEXT identity / forward-only: PASS'

      - name: Verify exact R5 public assets
        shell: bash
        run: |
          set -euo pipefail
          INDUSTRY='https://dpromstk2000-lab.github.io/liff-yoga-reserve'
          urls=(
            "$INDUSTRY/guide-center.html"
            "$INDUSTRY/tutorial.html"
            "$INDUSTRY/DPRO_TUTORIAL_YOGA_QUICK_START_V1.0.pdf"
            "$INDUSTRY/DPRO_TUTORIAL_YOGA_DETAILED_MANUAL_V1.0.pdf"
            "$INDUSTRY/DPRO_TUTORIAL_YOGA_QUICK_START_V1.0.png"
            "$INDUSTRY/DPRO_TUTORIAL_YOGA_DETAILED_MANUAL_V1.0.png"
          )
          for u in "${urls[@]}"; do
            code=$(curl -L -sS -o /dev/null -w '%{http_code}' --retry 3 --connect-timeout 15 "$u")
            test "$code" -ge 200 -a "$code" -lt 400
            echo "$code $u"
          done

          mkdir -p .r6qa/assets
          curl -fsSL --retry 3 -o .r6qa/assets/quick.pdf \
            "$INDUSTRY/DPRO_TUTORIAL_YOGA_QUICK_START_V1.0.pdf"
          curl -fsSL --retry 3 -o .r6qa/assets/detail.pdf \
            "$INDUSTRY/DPRO_TUTORIAL_YOGA_DETAILED_MANUAL_V1.0.pdf"
          curl -fsSL --retry 3 -o .r6qa/assets/quick.png \
            "$INDUSTRY/DPRO_TUTORIAL_YOGA_QUICK_START_V1.0.png"
          curl -fsSL --retry 3 -o .r6qa/assets/detail.png \
            "$INDUSTRY/DPRO_TUTORIAL_YOGA_DETAILED_MANUAL_V1.0.png"

          printf '%s  %s\n' \
            '9b2160076f86bbab7f00b165b44f533857be6fe31f7b561234a101a74a7810b6' \
            '.r6qa/assets/quick.pdf' | sha256sum -c -
          printf '%s  %s\n' \
            '0d2cd13dfdc364d0f81d608c5dac920672422ff3c5ea9dee3d7787e0e9449689' \
            '.r6qa/assets/detail.pdf' | sha256sum -c -
          printf '%s  %s\n' \
            '5dd4c2637bdfb48b429b4aa4c18de1e732961c2f3adc844b2ebf19d9eb295fef' \
            '.r6qa/assets/quick.png' | sha256sum -c -
          printf '%s  %s\n' \
            'cd75352241a89f3db7f3e91bdff195ab2a3d287ef84c7fabc28b649213d1ff96' \
            '.r6qa/assets/detail.png' | sha256sum -c -

          echo 'R5 public URLs + exact hashes: PASS'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run R6 browser LIVE QA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .r6qa/screens
          cat > .r6qa/yoga-r6-recovery-qa.mjs <<'JS'
          import { chromium, request } from 'playwright';
          import fs from 'node:fs';

          const PRODUCT='https://dpromstk2000-lab.github.io/dpro-line-systems-site/systems/yoga.html';
          const GUIDE='https://dpromstk2000-lab.github.io/liff-yoga-reserve/guide-center.html';
          const FIRST10='https://dpromstk2000-lab.github.io/liff-yoga-reserve/tutorial.html';
          const QUICK='https://dpromstk2000-lab.github.io/liff-yoga-reserve/DPRO_TUTORIAL_YOGA_QUICK_START_V1.0.pdf';
          const DETAIL='https://dpromstk2000-lab.github.io/liff-yoga-reserve/DPRO_TUTORIAL_YOGA_DETAILED_MANUAL_V1.0.pdf';
          const QUICK_PNG='https://dpromstk2000-lab.github.io/liff-yoga-reserve/DPRO_TUTORIAL_YOGA_QUICK_START_V1.0.png';
          const DETAIL_PNG='https://dpromstk2000-lab.github.io/liff-yoga-reserve/DPRO_TUTORIAL_YOGA_DETAILED_MANUAL_V1.0.png';

          const report={
            checked_at:new Date().toISOString(),
            product:PRODUCT,
            accepted_base:process.env.ACCEPTED_BASE,
            r6_commit:process.env.R6_COMMIT,
            qa_start_head:process.env.QA_START_HEAD,
            http:{},
            results:[],
            business_mutation:0,
            overall:'RUNNING'
          };

          const save=()=>fs.writeFileSync(
            '.r6qa/yoga-r6-product-site-live-qa.json',
            JSON.stringify(report,null,2)
          );

          try{
            const api=await request.newContext();
            for(const u of [PRODUCT,GUIDE,FIRST10,QUICK,DETAIL,QUICK_PNG,DETAIL_PNG]){
              const r=await api.get(u,{timeout:60000});
              report.http[u]=r.status();
              if(r.status()>=400) throw new Error(`HTTP ${r.status()} ${u}`);
            }
            await api.dispose();
            save();

            const browser=await chromium.launch({headless:true});
            const allMutations=[];

            for(const [name,width,height] of [
              ['1440',1440,900],['1024',1024,768],['390',390,844],['320',320,720]
            ]){
              const result={
                name,width,height,status:null,overflow:null,
                rootCount:null,links:[],images:[],focus:null,
                preserved:null,errors:[],mutations:[],pass:false
              };
              report.results.push(result);
              save();

              const context=await browser.newContext({
                viewport:{width,height},
                deviceScaleFactor:1
              });
              const page=await context.newPage();

              page.on('console',m=>{
                if(m.type()==='error'){
                  result.errors.push({type:'console',text:m.text()});
                  save();
                }
              });
              page.on('pageerror',e=>{
                result.errors.push({type:'pageerror',text:String(e)});
                save();
              });
              page.on('request',r=>{
                const method=r.method().toUpperCase();
                if(!['GET','HEAD','OPTIONS'].includes(method)){
                  const x={width:name,method,url:r.url()};
                  result.mutations.push(x);
                  allMutations.push(x);
                  save();
                }
              });

              const resp=await page.goto(PRODUCT+`?r=${Date.now()}-${name}`,{
                waitUntil:'domcontentloaded',
                timeout:60000
              });
              result.status=resp?.status() ?? null;
              if(!resp || resp.status()>=400) throw new Error(`Product ${name} HTTP ${resp?.status()}`);

              const root=page.locator('section.dpro-section[data-yoga-tutorial-r6="1"]');
              await root.waitFor({state:'visible',timeout:20000});
              result.rootCount=await root.count();
              if(result.rootCount!==1) throw new Error(`R6 section count ${name}: ${result.rootCount}`);

              await root.scrollIntoViewIfNeeded();

              const imgs=root.locator('img');
              if(await imgs.count()!==2) throw new Error(`preview image count ${name}`);
              for(let i=0;i<2;i++){
                const im=imgs.nth(i);
                await im.scrollIntoViewIfNeeded();
                await im.evaluate(el=>{
                  if(el.complete && el.naturalWidth>=100) return true;
                  return new Promise((resolve,reject)=>{
                    const t=setTimeout(()=>reject(new Error('image timeout '+el.src)),15000);
                    el.addEventListener('load',()=>{clearTimeout(t);resolve(true)},{once:true});
                    el.addEventListener('error',()=>{clearTimeout(t);reject(new Error('image error '+el.src))},{once:true});
                  });
                });
              }

              await root.scrollIntoViewIfNeeded();
              await page.waitForTimeout(200);

              const data=await root.evaluate(el=>{
                const d=document.documentElement;
                return {
                  scrollWidth:d.scrollWidth,
                  clientWidth:d.clientWidth,
                  links:[...el.querySelectorAll('a[data-r6-link]')].map(a=>({
                    key:a.dataset.r6Link,
                    href:a.href,
                    text:(a.textContent||'').trim()
                  })),
                  imgs:[...el.querySelectorAll('img')].map(i=>({
                    src:i.src,
                    complete:i.complete,
                    naturalWidth:i.naturalWidth,
                    alt:i.alt
                  })),
                  preserved:{
                    yoga:(document.body.textContent||'').includes('ヨガ・ピラティス'),
                    lp:[...document.querySelectorAll('a')].some(
                      a=>(a.getAttribute('href')||'').includes('lp-yoga.html')
                    )
                  }
                };
              });

              result.overflow=Math.max(0,data.scrollWidth-data.clientWidth);
              result.links=data.links;
              result.images=data.imgs;
              result.preserved=data.preserved;
              save();

              const links=Object.fromEntries(data.links.map(x=>[x.key,x.href]));
              const expected={
                guide:GUIDE,
                first10:FIRST10,
                'quick-pdf':QUICK,
                'detail-pdf':DETAIL
              };
              for(const [k,v] of Object.entries(expected)){
                if(links[k]!==v) throw new Error(`link mismatch ${name} ${k}: ${links[k]} != ${v}`);
              }

              const srcs=new Set(data.imgs.map(x=>x.src));
              if(!srcs.has(QUICK_PNG)||!srcs.has(DETAIL_PNG)){
                throw new Error(`preview src mismatch ${name}`);
              }
              for(const im of data.imgs){
                if(!im.complete || im.naturalWidth<100 || !im.alt){
                  throw new Error(`preview invalid ${name}: ${JSON.stringify(im)}`);
                }
              }

              if(result.overflow!==0){
                throw new Error(`horizontal overflow ${name}: ${data.scrollWidth}/${data.clientWidth}`);
              }
              if(!data.preserved.yoga || !data.preserved.lp){
                throw new Error(`existing content regression ${name}: ${JSON.stringify(data.preserved)}`);
              }

              // Reach an R6 link through keyboard Tab, so :focus-visible is tested as keyboard focus.
              await page.evaluate(()=>document.activeElement?.blur());
              let focusedKey='';
              for(let i=0;i<80;i++){
                await page.keyboard.press('Tab');
                focusedKey=await page.evaluate(
                  ()=>document.activeElement?.getAttribute?.('data-r6-link')||''
                );
                if(focusedKey) break;
              }
              if(!focusedKey) throw new Error(`keyboard could not reach R6 links ${name}`);

              result.focus=await page.evaluate(()=>{
                const el=document.activeElement;
                const s=getComputedStyle(el);
                return {
                  key:el?.getAttribute?.('data-r6-link')||'',
                  active:!!el,
                  outlineStyle:s.outlineStyle,
                  outlineWidth:s.outlineWidth,
                  outlineColor:s.outlineColor
                };
              });
              save();

              if(!result.focus.active || result.focus.outlineStyle==='none' || result.focus.outlineWidth==='0px'){
                throw new Error(`focus not visible ${name}: ${JSON.stringify(result.focus)}`);
              }
              if(result.errors.length){
                throw new Error(`console/page errors ${name}: ${JSON.stringify(result.errors)}`);
              }
              if(result.mutations.length){
                throw new Error(`business mutation ${name}: ${JSON.stringify(result.mutations)}`);
              }

              await root.screenshot({path:`.r6qa/screens/product-r6-${name}.png`});
              result.pass=true;
              save();
              await context.close();
            }

            await browser.close();
            if(allMutations.length){
              throw new Error(`BUSINESS_MUTATION ${JSON.stringify(allMutations)}`);
            }

            report.business_mutation=0;
            report.overall='PASS';
            save();

            console.log('YOGA R6 LIVE QA PASS');
            console.log('VIEWPORTS: 1440 / 1024 / 390 / 320 PASS');
            console.log('OVERFLOW: 0 / 0 / 0 / 0');
            console.log('EXACT LINKS + PREVIEW IMAGES + KEYBOARD FOCUS: PASS');
            console.log('BUSINESS MUTATION = 0');
          }catch(err){
            report.overall='FAIL';
            report.failure=String(err?.stack||err);
            save();
            console.error('YOGA R6 LIVE QA FAIL',err);
            process.exitCode=1;
          }
          JS

          node .r6qa/yoga-r6-recovery-qa.mjs

      - name: Verify R6 integration commit boundary
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git merge-base --is-ancestor "$R6_COMMIT" origin/main

          own_files=$(git diff-tree --no-commit-id --name-only -r "$R6_COMMIT" | sort)
          printf '%s\n' "$own_files"
          test "$(printf '%s\n' "$own_files" | sed '/^$/d' | wc -l)" -eq 3
          printf '%s\n' "$own_files" | grep -qx '.github/workflows/yoga-tutorial-r6-product-site.yml'
          printf '%s\n' "$own_files" | grep -qx 'systems/yoga.html'
          printf '%s\n' "$own_files" | grep -qx 'systems/yoga.html.txt'

          git show origin/main:systems/yoga.html > /tmp/yoga-current.html
          git show origin/main:systems/yoga.html.txt > /tmp/yoga-current.html.txt
          cmp -s /tmp/yoga-current.html /tmp/yoga-current.html.txt
          cmp -s /tmp/yoga-current.html /tmp/yoga-r6-lock.html
          test "$(grep -o '<section class="dpro-section" data-yoga-tutorial-r6="1"' /tmp/yoga-current.html | wc -l)" -eq 1

          cat > .r6qa/R6_SOURCE_LOCK_EVIDENCE.txt <<EOF
          DPRO TUTORIAL BATCH-05 YOGA R6 SOURCE LOCK
          accepted_base=$ACCEPTED_BASE
          r6_product_site_commit=$R6_COMMIT
          qa_start_head=$QA_START_HEAD
          persistent_files=systems/yoga.html,systems/yoga.html.txt
          normal_text_identical=true
          current_content_equals_r6_commit=true
          r6_section_count=1
          business_mutation=0
          R7=NOT_AUTHORIZED
          EOF

          echo 'R6 integration commit boundary: PASS'

      - name: Remove recovery workflow from main after PASS
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          pushed=0
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main

            if ! git cat-file -e "HEAD:$RECOVERY_PATH" 2>/dev/null; then
              pushed=1
              break
            fi

            git rm "$RECOVERY_PATH"
            git commit -m 'Remove temporary YOGA R6 LIVE QA recovery workflow'

            if git push origin HEAD:main; then
              pushed=1
              break
            fi

            echo "cleanup push race; retry $attempt"
            sleep 3
          done
          test "$pushed" -eq 1

          git fetch origin main
          if git cat-file -e "origin/main:$RECOVERY_PATH" 2>/dev/null; then
            echo 'Recovery workflow still exists on main'
            exit 1
          fi

          git merge-base --is-ancestor "$R6_COMMIT" origin/main

          git show origin/main:systems/yoga.html > /tmp/yoga-final.html
          git show origin/main:systems/yoga.html.txt > /tmp/yoga-final.html.txt
          cmp -s /tmp/yoga-final.html /tmp/yoga-final.html.txt
          cmp -s /tmp/yoga-final.html /tmp/yoga-r6-lock.html

          FINAL_HEAD=$(git rev-parse origin/main)
          echo "FINAL_HEAD=$FINAL_HEAD" >> "$GITHUB_ENV"

          cat >> .r6qa/R6_SOURCE_LOCK_EVIDENCE.txt <<EOF
          final_main=$FINAL_HEAD
          recovery_workflow_present=false
          final_normal_text_identical=true
          final_content_equals_r6_commit=true
          final_lock_candidate=true
          EOF

          echo "Recovery cleanup PASS / final main $FINAL_HEAD"

      - name: Upload R6 final evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yoga-r6-final-evidence-${{ github.run_id }}
          path: |
            .r6qa/yoga-r6-product-site-live-qa.json
            .r6qa/R6_SOURCE_LOCK_EVIDENCE.txt
            .r6qa/screens/*.png
          if-no-files-found: warn
