name: DPRO SHAROUSHI Product Site Final

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/STEP-SHAROUSHI-PRODUCT-SITE-FINAL.yml'

permissions:
  contents: write

jobs:
  patch-product-site:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch SHAROUSHI LIVE DEMO URL
        shell: python
        run: |
          from pathlib import Path

          p = Path("systems/sharoushi.html")
          text = p.read_text(encoding="utf-8")

          old = "https://dpromstk2000-lab.github.io/dpro-consult-line/index.html?company_code=SR-COMPANY-001&amp;phone=090-9999-1111&amp;v=consult-15"
          new = "https://dpromstk2000-lab.github.io/dpro-consult-line/product-ready-demo/index.html"

          count = text.count(old)

          if count < 1:
              if new in text:
                  print("Already patched.")
              else:
                  raise SystemExit("OLD_URL_NOT_FOUND_AND_NEW_URL_MISSING")
          else:
              text = text.replace(old, new)
              p.write_text(text, encoding="utf-8")
              print({"replacements": count})

          verify = p.read_text(encoding="utf-8")

          if old in verify:
              raise SystemExit("OLD_URL_STILL_REMAINS")

          if new not in verify:
              raise SystemExit("NEW_SAFE_DEMO_URL_NOT_FOUND")

          print("PRODUCT_SITE_SAFE_DEMO=PASS")

      - name: Commit Product Site patch
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "dpro-product-ready-bot"
          git config user.email "actions@users.noreply.github.com"

          git add systems/sharoushi.html

          if git diff --cached --quiet; then
            echo "Product Site already current."
          else
            git commit -m "Switch SHAROUSHI Product Site to Product Ready safe demo"
            git push
          fi

      - name: Verify committed source
        shell: bash
        run: |
          set -euo pipefail

          NEW='https://dpromstk2000-lab.github.io/dpro-consult-line/product-ready-demo/index.html'
          OLD='https://dpromstk2000-lab.github.io/dpro-consult-line/index.html?company_code=SR-COMPANY-001'

          grep -F "$NEW" systems/sharoushi.html
          ! grep -F "$OLD" systems/sharoushi.html

          echo "COMMITTED_SOURCE_VERIFY=PASS"

      - name: Cleanup workflow
        shell: bash
        run: |
          set -euo pipefail

          git pull --rebase

          git config user.name "dpro-product-ready-bot"
          git config user.email "actions@users.noreply.github.com"

          git rm -f .github/workflows/STEP-SHAROUSHI-PRODUCT-SITE-FINAL.yml
          git commit -m "Complete SHAROUSHI Product Site final gate"
          git push
