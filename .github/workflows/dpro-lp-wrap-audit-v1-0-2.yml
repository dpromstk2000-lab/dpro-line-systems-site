name: DPRO LP Wrap Audit V1.0.2

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/dpro-lp-wrap-audit-v1-0-2.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dpro-lp-wrap-audit-v1-0-2
  cancel-in-progress: false

jobs:
  audit:
    name: Audit all LP wrapping V1.0.2
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout current Product Site
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Guard completed MEDICAL and HAIR state
        shell: bash
        run: |
          set -euo pipefail
          test -f flyer-medical.html || { echo 'BLOCKER: MEDICAL flyer HTML missing'; exit 1; }
          test -f flyer-medical.pdf || { echo 'BLOCKER: MEDICAL flyer PDF missing'; exit 1; }
          grep -Fq 'flyerHtml: "flyer-medical.html"' systems-data.js
          grep -Fq 'flyerPdf: "flyer-medical.pdf"' systems-data.js
          grep -Fq '../flyer-medical.html' systems/medical.html
          grep -Fq '../flyer-medical.pdf' systems/medical.html
          grep -Fq 'DPRO LP HAIR WRAP FIX V1.3 CENTRAL' lp-hair.html
          grep -Fq 'DPRO LIVE DEMO ALL49 CENTRAL OVERRIDES START' systems-data.js
          grep -Fq 'DPRO LIVE DEMO ALL49 CENTRAL OVERRIDES END' systems-data.js
          echo 'PASS: MEDICAL integration, HAIR V1.3, ALL49 override block present'

      - name: Install Playwright
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 --silent
          npx playwright install --with-deps chromium

      - name: Create robust audit runner
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64
          Path('/tmp/dpro-lp-wrap-audit-v102.js').write_bytes(base64.b64decode(''))
          PY
          node --check /tmp/dpro-lp-wrap-audit-v102.js

      - name: Start local Product Site
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/dpro-lp-http.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8765/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/dpro-lp-http.log || true
          exit 1

      - name: Render and audit every LP
        shell: bash
        run: |
          set -euo pipefail
          node /tmp/dpro-lp-wrap-audit-v102.js
          test -s qa/LP_WRAP_AUDIT_V1.0.2.json
          test -s qa/LP_WRAP_AUDIT_V1.0.2.md
          cat qa/LP_WRAP_AUDIT_V1.0.2.md

      - name: Validate report matrix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json
          p=Path('qa/LP_WRAP_AUDIT_V1.0.2.json')
          data=json.loads(p.read_text(encoding='utf-8'))
          s=data['summary']
          if s['pages'] < 40:
              raise SystemExit(f"BLOCKER: only {s['pages']} LP pages audited")
          if s['checks'] != s['pages']*3:
              raise SystemExit(f"BLOCKER: matrix incomplete {s['checks']} != {s['pages']*3}")
          if not s['hairIncluded']:
              raise SystemExit('BLOCKER: lp-hair.html missing from audit')
          print('PASS: complete desktop/laptop/mobile audit matrix')
          print(json.dumps(s,ensure_ascii=False,indent=2))
          PY

      - name: Publish CENTRAL-readable audit report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add qa/LP_WRAP_AUDIT_V1.0.2.json qa/LP_WRAP_AUDIT_V1.0.2.md
          git rm --ignore-unmatch ".github/workflows/dpro-lp-wrap-audit-v1-0-2.yml"
          git commit -m "Publish DPRO LP wrap audit V1.0.2"
          git push origin HEAD:main
