name: Finalize DPRO PRODUCT SITE Canonical 52 Runtime V1.6
on:
  push:
    paths:
      - .github/workflows/finalize-visit-ahaki-canonical-runtime-52.yml
permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Flatten canonical runtime and run regression QA
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, re, subprocess

          RUNTIME = Path('product-v3.6.js')
          DATA = Path('systems-data.js')
          current = RUNTIME.read_text(encoding='utf-8')
          data_before = DATA.read_bytes()
          data_sha_before = hashlib.sha256(data_before).hexdigest()

          # Read the exact stable core previously loaded at runtime, then canonicalize it in-source.
          stable_ref = 'f2953496b470370783c663de484d875376d83c81'
          core = subprocess.check_output(
              ['git','show',f'{stable_ref}:product-v3.6.js'],
              text=True
          )

          assert "DPRO LINE SYSTEMS 50製品" in core, 'expected legacy ItemList name not found'
          assert "numberOfItems: systems.length" in core, 'dynamic ItemList count contract missing'
          assert "const count = DATA().systems.length || 50;" in core, 'count contract changed unexpectedly'
          assert "SALESNAVI:'salesnavi'" in core, 'official slug map anchor missing'

          core = core.replace(
              "const count = DATA().systems.length || 50;",
              "const count = DATA().systems.length || 52;"
          )
          core = core.replace(
              "name:'DPRO LINE SYSTEMS 50製品'",
              "name:'DPRO LINE SYSTEMS 52製品'"
          )
          core = core.replace(
              "SHUTTLE:'shuttle', SALESNAVI:'salesnavi'",
              "SHUTTLE:'shuttle', SALESNAVI:'salesnavi', MEDICAL:'medical', VISIT_AHAKI:'visit-ahaki'"
          )

          # Keep the existing VET HP addon, but remove:
          # 1) old-core CDN loader
          # 2) runtime 50→51 SEO guard
          guard = '/* DPRO PRODUCT 51 SEO GUARD V1.2.1 */'
          assert guard in current, 'legacy SEO guard marker missing'
          addon = current.split(guard, 1)[0].rstrip() + '\n'

          addon = re.sub(
              r"^\s*const CORE\s*=\s*['\"][^'\"]+['\"];\s*\n",
              "",
              addon,
              count=1,
              flags=re.M
          )

          load_start = addon.find('  function loadCore(done){')
          styles_start = addon.find('  function addStyles(){')
          assert load_start >= 0 and styles_start > load_start, 'old core loader block not found'
          addon = addon[:load_start] + addon[styles_start:]

          old_boot = """  loadCore(() => {
            if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', runAddon,{once:true});
            else runAddon();
          });
          })();"""
          # Normalize whitespace to find actual source boot block robustly.
          boot_pattern = re.compile(
              r"\s*loadCore\(\(\)\s*=>\s*\{\s*"
              r"if\s*\(document\.readyState\s*===\s*'loading'\)\s*"
              r"document\.addEventListener\('DOMContentLoaded',\s*runAddon,\{once:true\}\);\s*"
              r"else\s*runAddon\(\);\s*"
              r"\}\);\s*\}\)\(\);\s*$",
              re.S
          )
          assert boot_pattern.search(addon), 'old addon boot block not found'
          addon = boot_pattern.sub(
              "\n  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', runAddon,{once:true});\n"
              "  else runAddon();\n"
              "})();\n",
              addon
          )

          canonical_header = """/* DPRO LINE SYSTEMS PRODUCT SITE — CANONICAL 52 RUNTIME
           * CANONICAL SOURCE: 52 products / 2026-09-03
           * Stable V3.6 core is flattened into this repository source.
           * No old core CDN loader and no runtime 50→51→52 SEO/count patch.
           */
          """
          final_runtime = canonical_header + core.rstrip() + '\n\n' + addon.lstrip()
          RUNTIME.write_text(final_runtime, encoding='utf-8')

          # Cache-bust the canonical runtime reference without changing page content.
          for p in Path('.').rglob('*.html'):
              if '.github' in p.parts:
                  continue
              s = p.read_text(encoding='utf-8')
              s = re.sub(
                  r'product-v3\.6\.js\?v=[^"]+',
                  'product-v3.6.js?v=20260903-canonical52-runtime',
                  s
              )
              p.write_text(s, encoding='utf-8')

          # Catalog data must remain byte-identical: existing 51 + #52 are untouched.
          data_after = DATA.read_bytes()
          assert data_after == data_before, 'systems-data.js changed unexpectedly'
          assert hashlib.sha256(data_after).hexdigest() == data_sha_before

          # Parse canonical catalog.
          node_read = r"""
          const fs=require('fs'),vm=require('vm');
          const ctx={console};ctx.window=ctx;vm.createContext(ctx);
          vm.runInContext(fs.readFileSync('systems-data.js','utf8'),ctx);
          process.stdout.write(JSON.stringify({
            count:ctx.DPROSystemsData.systems.length,
            codes:ctx.DPROSystemsData.systems.map(x=>x.code),
            visit:ctx.DPROSystemsData.getByCode('VISIT_AHAKI')
          }));
          """
          catalog = json.loads(subprocess.check_output(['node','-e',node_read], text=True))
          assert catalog['count'] == 52
          assert len(set(catalog['codes'])) == 52
          assert catalog['visit'] and catalog['visit']['systemPage'] == 'systems/visit-ahaki.html'

          runtime = RUNTIME.read_text(encoding='utf-8')
          assert "CANONICAL 52 RUNTIME" in runtime
          assert "DPRO LINE SYSTEMS 52製品" in runtime
          assert "numberOfItems: systems.length" in runtime
          assert "const count = DATA().systems.length || 52;" in runtime
          assert "VISIT_AHAKI:'visit-ahaki'" in runtime
          assert "MEDICAL:'medical'" in runtime
          assert "DPRO PRODUCT 51 SEO GUARD" not in runtime
          assert "replaceAll(\"DPRO LINE SYSTEMS 50製品\"" not in runtime
          assert "replaceAll(\"50システム\"" not in runtime
          assert "cdn.jsdelivr.net/gh/dpromstk2000-lab/dpro-line-systems-site@f2953496b470370783c663de484d875376d83c81/product-v3.6.js" not in runtime
          assert "function loadCore(done)" not in runtime
          assert "const CORE =" not in runtime

          # Core rendering contracts now derive directly from the canonical 52 catalog.
          assert "const DATA = () => window.DPROSystemsData" in runtime
          assert "document.querySelectorAll('[data-p36-count]')" in runtime
          assert "DATA().systems.filter(s => s.category === key).length" in runtime
          assert "const systems = DATA().systems || [];" in runtime
          assert "grid.innerHTML = systems.map" in runtime

          # Central pages must point to canonical runtime and already be source-52.
          idx = Path('index.html').read_text(encoding='utf-8')
          hub = Path('systems.html').read_text(encoding='utf-8')
          for name,s in [('index',idx),('systems',hub)]:
              assert 'product-v3.6.js?v=20260903-canonical52-runtime' in s, f'{name}: canonical runtime ref missing'
              assert '51製品' not in s
              assert '51システム' not in s
              assert not re.search(r'51(?=(?:の?業種|製品|システム|件))', s)
          assert '"numberOfItems":52' in hub
          assert re.search(r'data-p36-count[^>]*>52<', idx)
          assert re.search(r'data-p36-count[^>]*>52<', hub)

          # Syntax QA.
          subprocess.check_call(['node','--check','systems-data.js'])
          subprocess.check_call(['node','--check','product-v3.6.js'])

          print(
              'PRODUCT_CANONICAL_52_RUNTIME_QA=PASS '
              'catalog=52 old51_data_preserved=51/51 '
              'runtime_cdn_dependency=0 seo_guard_50_51=0 '
              'itemlist_name=52 numberOfItems=52 '
              'visit_official_slug=visit-ahaki'
          )
          PY

      - name: Commit canonical runtime
        shell: bash
        run: |
          rm -f .github/workflows/finalize-visit-ahaki-canonical-runtime-52.yml
          git config user.name "DPRO SYSTEM FACTORY"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Finalize DPRO PRODUCT SITE canonical 52 runtime"
          git push
