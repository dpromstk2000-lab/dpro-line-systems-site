name: HAIR Tutorial R6 Product Site Recheck

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/hair-r6-product-site-recheck.yml"

permissions:
  contents: write

concurrency:
  group: hair-tutorial-r6-product-site-recheck
  cancel-in-progress: false

jobs:
  r6-product-site-recheck:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TARGET_HTML: systems/hair-salon.html
      TARGET_TEXT: systems/hair-salon.html.txt
      WORKFLOW_PATH: .github/workflows/hair-r6-product-site-recheck.yml
      PRODUCT_URL: https://dpromstk2000-lab.github.io/dpro-line-systems-site/systems/hair-salon.html
      TUTORIAL_URL: https://dpromstk2000-lab.github.io/dpro-hair-salon-line/owner.html?tutorial=restart
      GUIDE_URL: https://dpromstk2000-lab.github.io/dpro-hair-salon-line/guide-center.html
      QUICK_URL: https://dpromstk2000-lab.github.io/dpro-hair-salon-line/DPRO_TUTORIAL_HAIR_QUICK_START_V1.0.pdf
      DETAIL_URL: https://dpromstk2000-lab.github.io/dpro-hair-salon-line/DPRO_TUTORIAL_HAIR_DETAILED_MANUAL_V1.0.pdf
      R6_INTEGRATION_HEAD: 3df99a866019bd8ad73c561c137008f19bd98856
      R6_INTEGRATION_TREE: f2e90754a0fc981f8d49fce19b5d359303e8d0c8
      R6_ORIGINAL_BASE: a23b4635c284d45e74f5497f28cc3e40289cbdc6
      R6_LIVE_MARKER: DPRO TUTORIAL HAIR R6 LINKSET V1.0-20260829

    steps:
      - name: Checkout newest Product Site main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify R6 integration is intact and upload is workflow-only
        id: preflight
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa-r6

          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" || {
            echo "Product Site main advanced after recheck workflow upload. HOLD." >&2
            exit 1
          }

          upload_base="$(git rev-parse HEAD^)"
          mapfile -t upload_changed < <(git diff --name-only "$upload_base" HEAD)
          test "${#upload_changed[@]}" -eq 1
          test "${upload_changed[0]}" = "$WORKFLOW_PATH"

          git merge-base --is-ancestor "$R6_INTEGRATION_HEAD" "$upload_base" || {
            echo "HAIR R6 integration is not an ancestor of current Product Site main. HOLD." >&2
            exit 1
          }

          git show "$R6_INTEGRATION_HEAD:$TARGET_HTML" > /tmp/hair-r6-integration.html
          git show "$upload_base:$TARGET_HTML" > /tmp/hair-r6-current.html
          git show "$upload_base:$TARGET_TEXT" > /tmp/hair-r6-current.txt

          cmp -s /tmp/hair-r6-integration.html /tmp/hair-r6-current.html
          cmp -s /tmp/hair-r6-current.html /tmp/hair-r6-current.txt

          grep -q "$R6_LIVE_MARKER" /tmp/hair-r6-current.html
          test "$(grep -o 'data-r6-resource="' /tmp/hair-r6-current.html | wc -l)" -eq 4
          grep -Fq "$TUTORIAL_URL" /tmp/hair-r6-current.html
          grep -Fq "$GUIDE_URL" /tmp/hair-r6-current.html
          grep -Fq "$QUICK_URL" /tmp/hair-r6-current.html
          grep -Fq "$DETAIL_URL" /tmp/hair-r6-current.html

          # Historical net R6 scope must be exactly the two HAIR target mirrors.
          git diff --name-status "$R6_ORIGINAL_BASE" "$R6_INTEGRATION_HEAD" > qa-r6/r6-net-changed-files.txt
          grep -q $'M\tsystems/hair-salon.html' qa-r6/r6-net-changed-files.txt
          grep -q $'M\tsystems/hair-salon.html.txt' qa-r6/r6-net-changed-files.txt
          test "$(wc -l < qa-r6/r6-net-changed-files.txt)" -eq 2

          sha256sum /tmp/hair-r6-current.html /tmp/hair-r6-current.txt > qa-r6/target-sha256-before-recheck.txt
          printf '%s\n' "$upload_base" > qa-r6/recheck-upload-base.txt
          printf '%s\n' "$R6_INTEGRATION_HEAD" > qa-r6/r6-integration-head.txt
          printf '%s\n' "$R6_INTEGRATION_TREE" > qa-r6/r6-integration-tree.txt

          echo "upload_base=$upload_base" >> "$GITHUB_OUTPUT"

      - name: Self-remove recheck workflow without touching Product Site
        id: cleanup
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" || {
            echo "Product Site main advanced before workflow cleanup. HOLD." >&2
            exit 1
          }

          git rm "$WORKFLOW_PATH"
          mapfile -t changed < <(git diff --cached --name-only)
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = "$WORKFLOW_PATH"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Remove HAIR R6 recheck workflow [skip ci]"
          cleanup_head="$(git rev-parse HEAD)"
          cleanup_tree="$(git rev-parse HEAD^{tree})"
          git push origin HEAD:main

          printf '%s\n' "$cleanup_head" > qa-r6/recheck-cleanup-head.txt
          printf '%s\n' "$cleanup_tree" > qa-r6/recheck-cleanup-tree.txt

          echo "cleanup_head=$cleanup_head" >> "$GITHUB_OUTPUT"
          echo "cleanup_tree=$cleanup_tree" >> "$GITHUB_OUTPUT"

      - name: Setup Node for exact-width LIVE QA
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run R6 exact-width LIVE QA from repository root
        shell: bash
        env:
          R6_CLEANUP_HEAD: ${{ steps.cleanup.outputs.cleanup_head }}
          R6_CLEANUP_TREE: ${{ steps.cleanup.outputs.cleanup_tree }}
        run: |
          set -euo pipefail

          # IMPORTANT: keep the script in repository root so Node resolves ./node_modules/playwright.
          cat > hair-r6-live-qa.mjs <<'NODE'
          import { chromium } from 'playwright';
          import fs from 'node:fs';

          const productUrl=process.env.PRODUCT_URL;
          const expected={
            tutorial:process.env.TUTORIAL_URL,
            guide:process.env.GUIDE_URL,
            quick:process.env.QUICK_URL,
            detail:process.env.DETAIL_URL
          };
          const marker=process.env.R6_LIVE_MARKER;
          const viewports=[
            {name:'1440x1000',width:1440,height:1000},
            {name:'1024x768',width:1024,height:768},
            {name:'390x844',width:390,height:844},
            {name:'320x720',width:320,height:720}
          ];

          const result={
            schema:'DPRO_TUTORIAL_HAIR_R6_PRODUCT_SITE_LIVE_QA_V1.1',
            productUrl,expected,marker,
            integrationHead:process.env.R6_INTEGRATION_HEAD,
            integrationTree:process.env.R6_INTEGRATION_TREE,
            originalBase:process.env.R6_ORIGINAL_BASE,
            cleanupHead:process.env.R6_CLEANUP_HEAD,
            cleanupTree:process.env.R6_CLEANUP_TREE,
            resourceChecks:{},viewports:[],
            businessMutationAttempts:[],failures:[],
            productSiteRollback:0,businessMutation:0,forwardOnly:true
          };

          const browser=await chromium.launch({headless:true});

          // Direct resource reachability checks.
          const resourceContext=await browser.newContext();
          const resourcePage=await resourceContext.newPage();
          for(const [key,url] of Object.entries(expected)){
            try{
              const resp=await resourcePage.request.get(url,{timeout:30000});
              const ct=String(resp.headers()['content-type']||'').toLowerCase();
              const isPdf=['quick','detail'].includes(key);
              const ok=resp.status()===200 && (!isPdf || ct.includes('pdf'));
              result.resourceChecks[key]={url,status:resp.status(),contentType:ct,ok};
              if(!ok) result.failures.push(`resource ${key}: status=${resp.status()} content-type=${ct}`);
            }catch(e){
              result.resourceChecks[key]={url,error:String(e),ok:false};
              result.failures.push(`resource ${key}: ${String(e)}`);
            }
          }
          await resourceContext.close();

          for(const vp of viewports){
            const context=await browser.newContext({viewport:{width:vp.width,height:vp.height}});
            const unsafe=[],pageErrors=[],consoleErrors=[];
            await context.route('**/*',async route=>{
              const method=route.request().method();
              if(['POST','PUT','PATCH','DELETE'].includes(method)){
                const rec={viewport:vp.name,method,url:route.request().url()};
                unsafe.push(rec);
                result.businessMutationAttempts.push(rec);
                return route.abort('blockedbyclient');
              }
              return route.continue();
            });

            const page=await context.newPage();
            page.on('pageerror',e=>pageErrors.push(String(e)));
            page.on('console',m=>{
              if(m.type()==='error') consoleErrors.push({text:m.text(),location:m.location()});
            });

            const resp=await page.goto(`${productUrl}?qa=${Date.now()}-${vp.width}`,{
              waitUntil:'networkidle',timeout:45000
            });
            if(!resp || resp.status()!==200){
              result.failures.push(`${vp.name}: product status ${resp?.status()}`);
            }

            const data=await page.evaluate((marker)=>({
              innerWidth:window.innerWidth,
              documentScrollWidth:document.documentElement.scrollWidth,
              bodyScrollWidth:document.body.scrollWidth,
              marker:document.documentElement.innerHTML.includes(marker),
              links:[...document.querySelectorAll('[data-r6-resource]')].map(a=>({
                key:a.getAttribute('data-r6-resource'),
                href:a.href,
                text:(a.textContent||'').trim()
              })),
              pricing:(document.body.textContent||'').includes('5,500円'),
              lineCta:[...document.querySelectorAll('a')].some(a=>a.href==='https://lin.ee/YxJGXV6D'),
              demo:[...document.querySelectorAll('a')].some(a=>a.href==='https://dpromstk2000-lab.github.io/dpro-hair-salon-line/demo-guide.html'),
              lp:[...document.querySelectorAll('a')].some(a=>a.getAttribute('href')==='../lp-hair.html'),
              flyerHtml:[...document.querySelectorAll('a')].some(a=>a.getAttribute('href')==='../flyer-hair.html'),
              flyerPdf:[...document.querySelectorAll('a')].some(a=>a.getAttribute('href')==='../flyer-hair.pdf'),
              systemsData:[...document.scripts].some(s=>s.getAttribute('src')==='../systems-data.js'),
              sharedJs:[...document.scripts].some(s=>s.getAttribute('src')==='../dpro-v3.js')
            }),marker);

            if(!data.marker) result.failures.push(`${vp.name}: R6 marker missing`);
            const map=Object.fromEntries(data.links.map(x=>[x.key,x.href]));
            for(const [key,url] of Object.entries(expected)){
              if(map[key]!==url) result.failures.push(`${vp.name}: ${key} link mismatch: ${map[key]}`);
            }
            if(data.links.length!==4) result.failures.push(`${vp.name}: resource link count ${data.links.length}`);
            if(!data.pricing) result.failures.push(`${vp.name}: pricing regression`);
            if(!data.lineCta) result.failures.push(`${vp.name}: LINE CTA regression`);
            if(!data.demo) result.failures.push(`${vp.name}: DEMO regression`);
            if(!data.lp) result.failures.push(`${vp.name}: LP regression`);
            if(!data.flyerHtml) result.failures.push(`${vp.name}: flyer HTML regression`);
            if(!data.flyerPdf) result.failures.push(`${vp.name}: flyer PDF regression`);
            if(!data.systemsData || !data.sharedJs) result.failures.push(`${vp.name}: shared asset regression`);

            const overflow={
              innerWidth:data.innerWidth,
              documentScrollWidth:data.documentScrollWidth,
              bodyScrollWidth:data.bodyScrollWidth,
              documentOverflow:Math.max(0,data.documentScrollWidth-data.innerWidth),
              bodyOverflow:Math.max(0,data.bodyScrollWidth-data.innerWidth)
            };
            if(vp.width<=390 && (overflow.documentOverflow!==0 || overflow.bodyOverflow!==0)){
              result.failures.push(`${vp.name}: mobile overflow`);
            }

            // Real Tab navigation: focus the tutorial section, then Tab to its first link.
            const section=page.locator('#tutorial-support');
            await section.scrollIntoViewIfNeeded();
            await page.evaluate(()=>{
              const s=document.querySelector('#tutorial-support');
              s.setAttribute('tabindex','-1');
              s.focus();
            });
            await page.keyboard.press('Tab');

            const focusRecord=await page.evaluate(()=>{
              const a=document.activeElement;
              if(!a || !a.matches?.('[data-r6-resource]')) return null;
              const r=a.getBoundingClientRect();
              const style=getComputedStyle(a);
              return {
                key:a.getAttribute('data-r6-resource'),
                left:r.left,top:r.top,right:r.right,bottom:r.bottom,
                width:r.width,height:r.height,
                innerWidth:window.innerWidth,innerHeight:window.innerHeight,
                focusVisible:a.matches(':focus-visible'),
                outlineStyle:style.outlineStyle,
                outlineWidth:style.outlineWidth
              };
            });
            const focusVisible=!!focusRecord &&
              focusRecord.key==='tutorial' &&
              focusRecord.width>0 && focusRecord.height>0 &&
              focusRecord.left>=-1 && focusRecord.right<=focusRecord.innerWidth+1 &&
              focusRecord.top>=-1 && focusRecord.bottom<=focusRecord.innerHeight+1 &&
              focusRecord.focusVisible &&
              focusRecord.outlineStyle!=='none' &&
              focusRecord.outlineWidth!=='0px';
            if(!focusVisible) result.failures.push(`${vp.name}: Tutorial Start keyboard focus not visibly outlined`);

            const tutorialConsole=consoleErrors.filter(e=>
              String(e.location?.url||'').includes('/systems/hair-salon.html')
            );
            if(pageErrors.length) result.failures.push(`${vp.name}: pageerror ${pageErrors.join(' | ')}`);
            if(tutorialConsole.length) result.failures.push(`${vp.name}: Tutorial integration console error`);
            if(unsafe.length) result.failures.push(`${vp.name}: unsafe write attempts ${unsafe.length}`);

            await page.screenshot({
              path:`qa-r6/hair-r6-${vp.width}.png`,
              fullPage:true
            });

            result.viewports.push({
              viewport:vp.name,data,overflow,focusVisible,focusRecord,
              pageErrors,consoleErrors,tutorialConsole,unsafe
            });
            await context.close();
          }

          await browser.close();

          if(result.businessMutationAttempts.length){
            result.businessMutation='BLOCKED_UNSAFE_ATTEMPT_PRESENT';
          }
          result.pass=
            result.failures.length===0 &&
            result.businessMutationAttempts.length===0 &&
            result.businessMutation===0 &&
            result.productSiteRollback===0;

          fs.writeFileSync('qa-r6/hair-r6-live-qa.json',JSON.stringify(result,null,2));
          console.log(JSON.stringify({
            pass:result.pass,
            failures:result.failures,
            resources:result.resourceChecks,
            businessMutation:result.businessMutation,
            productSiteRollback:result.productSiteRollback
          },null,2));

          if(!result.pass) process.exit(1);
          NODE

          node ./hair-r6-live-qa.mjs

      - name: Verify current main still preserves integrated HAIR target
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin main
          final_head="$(git rev-parse origin/main)"
          final_tree="$(git rev-parse "origin/main^{tree}")"

          git merge-base --is-ancestor "$R6_INTEGRATION_HEAD" "$final_head" || {
            echo "R6 integration is no longer an ancestor of current Product Site main." >&2
            exit 1
          }

          git show "$R6_INTEGRATION_HEAD:$TARGET_HTML" > /tmp/hair-r6-integration-final.html
          git show "origin/main:$TARGET_HTML" > /tmp/hair-r6-current-final.html
          git show "origin/main:$TARGET_TEXT" > /tmp/hair-r6-current-final.txt

          cmp -s /tmp/hair-r6-integration-final.html /tmp/hair-r6-current-final.html
          cmp -s /tmp/hair-r6-current-final.html /tmp/hair-r6-current-final.txt

          printf '%s\n' "$final_head" > qa-r6/product-site-final-head.txt
          printf '%s\n' "$final_tree" > qa-r6/product-site-final-tree.txt
          sha256sum /tmp/hair-r6-current-final.html /tmp/hair-r6-current-final.txt > qa-r6/target-sha256-after-recheck.txt

      - name: Upload R6 recheck evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hair-r6-product-site-recheck-evidence
          path: qa-r6
          if-no-files-found: error
