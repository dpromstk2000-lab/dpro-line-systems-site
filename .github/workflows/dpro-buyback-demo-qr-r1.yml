name: DPRO BUYBACK DEMO QR R1
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/dpro-buyback-demo-qr-r1.yml']
permissions:
  contents: write
concurrency:
  group: buyback-demo-qr-r1
  cancel-in-progress: false
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install QA tools
        run: |
          python -m pip install 'qrcode[pil]' playwright pymupdf zxing-cpp requests
          python -m playwright install --with-deps chromium
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
      - name: Repair QR and verify A4 print
        run: |
          python - <<'PY'
          import base64, io, json, pathlib, re, html
          import qrcode, requests, fitz, zxingcpp
          from PIL import Image
          from playwright.sync_api import sync_playwright
          root = pathlib.Path.cwd()
          path = root / 'flyer-buyback.html'
          pdf = root / 'flyer-buyback.pdf'
          qa = root / 'buyback-qr-qa'
          qa.mkdir(exist_ok=True)
          base = 'https://dpromstk2000-lab.github.io/dpro-buyback-line/'
          demo = base + 'index.html?demo=1'
          targets = {'LINE相談QR':'https://lin.ee/YxJGXV6D', 'DPRO SHOP公式サイトQR':'https://dpro-shop.com/', 'BUYBACK LIVE DEMO QR':demo}
          source = path.read_text(encoding='utf-8')
          product = (root/'systems/buyback.html').read_text(encoding='utf-8')
          assert demo in html.unescape(product), 'DEMO path not found in product page'
          assert 'BUYBACK / APPRAISAL' in source and '5,500円' in source
          updated = source
          old_href = demo + '&v=buyback-10'
          assert old_href in source or 'href="'+demo+'"' in source, 'Expected current DEMO link'
          updated = updated.replace(old_href, demo).replace(html.escape(old_href,quote=True),demo)
          old_qr = {}
          new_qr = {}
          def decode(img):
              return {r.text for r in zxingcpp.read_barcodes(img)}
          for i, (alt, url) in enumerate(targets.items(), 1):
              pat = re.compile(r'<img\b[^>]*\balt="'+re.escape(alt)+r'"[^>]*>')
              matches = list(pat.finditer(updated))
              assert len(matches)==1, (alt,len(matches))
              old = matches[0].group()
              src = re.search(r'src="data:image/[^;]+;base64,([^"]+)"',old)
              assert src, alt
              try:
                  old_qr[alt] = sorted(decode(Image.open(io.BytesIO(base64.b64decode(src.group(1))))))
              except Exception as e:
                  old_qr[alt] = [type(e).__name__]
              q = qrcode.QRCode(error_correction=qrcode.constants.ERROR_CORRECT_M, box_size=16, border=4)
              q.add_data(url); q.make(fit=True)
              img = q.make_image(fill_color='black',back_color='white').convert('RGB')
              assert decode(img)=={url}, alt
              img.save(qa/f'qr-{i}.png')
              buf=io.BytesIO(); img.save(buf,format='PNG')
              uri='data:image/png;base64,'+base64.b64encode(buf.getvalue()).decode('ascii')
              tag=f'<img src="{uri}" alt="{alt}" data-target="{html.escape(url,quote=True)}">'
              # Existing whole-card anchors are preserved; do not nest anchors.
              updated=updated[:matches[0].start()]+tag+updated[matches[0].end():]
              new_qr[alt]={'url':url,'modules':q.modules_count,'version':q.version,'quiet_zone_modules':4}
          if 'BUYBACK_DEMO_QR_R1' not in updated:
              css='''
          /* BUYBACK_DEMO_QR_R1: preserve hero and A4 master, improve scan contrast. */
          .action-card.demo{grid-template-columns:minmax(0,1fr) 25mm;gap:1.2mm}
          .action-card .action-qr{min-width:0}
          .action-card.site .site-url-label{font-size:1.45mm;line-height:1.25;letter-spacing:.04em;font-weight:900;color:#52766b;margin-top:1mm}
          .action-card.site h4{font-size:2.65mm;line-height:1.2}
          .action-card.site .site-url{max-width:100%;font-size:3.55mm!important;letter-spacing:-.04em!important;padding:.8mm .9mm!important}
          .action-qr img{width:20.5mm;height:20.5mm;padding:0;border:0;border-radius:0;background:#fff;image-rendering:pixelated;display:block}
          .action-card.demo .action-qr img{width:24mm;height:24mm;max-width:none;max-height:none}
          '''
              assert '</head>' in updated
              updated=updated.replace('</head>','<style>'+css+'</style>\n</head>',1)
              # Different icon for each actual workflow; no new feature claims.
              paths = [
                  '<rect x="3" y="5" width="18" height="15" rx="2"/><circle cx="9" cy="10" r="2"/><path d="m5 18 5-5 3 3 2-2 4 4"/>',
                  '<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>',
                  '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4M17 3v4M3 10h18m-12 5 2 2 4-4"/>',
                  '<circle cx="12" cy="12" r="9"/><path d="m8 6 4 5 4-5m-8 6h8m-8 3h8m-4-4v8"/>',
                  '<path d="M5 4h14v12H9l-4 4z"/><path d="m9 10 2 2 4-4"/>',
                  '<circle cx="9" cy="8" r="3"/><path d="M3 20v-2a6 6 0 0 1 12 0v2m1-8 2 2 4-4"/>',
              ]
              feature_pat = re.compile(r'(<div class="feature"><div class="icon"><svg[^>]*>)(.*?)(</svg></div>)',re.S)
              hits = list(feature_pat.finditer(updated))
              assert len(hits)==6, len(hits)
              for m, icon in reversed(list(zip(hits,paths))):
                  updated=updated[:m.start(2)]+icon+updated[m.end(2):]
              updated=updated.replace('写真査定から売却回答までの受付画面。','写真付き査定相談を体験。結果はお客様ページで確認。')
              updated=updated.replace('写真による概算から実物確認後の提示額まで、商品ごとに整理。','写真査定は概算。実物確認後の提示額まで商品ごとに整理。')
          # Existing hero and non-QR images must remain exactly the same.
          def other_images(s):
              return [m for m in re.findall(r'<img\b[^>]*>',s) if not any(f'alt="{a}"' in m for a in targets)]
          assert other_images(source)==other_images(updated)
          assert len(other_images(source))>=1
          assert 'window.print()' in updated
          path.write_text(updated,encoding='utf-8')
          expected=set(targets.values())
          with sync_playwright() as pw:
              browser=pw.chromium.launch(args=['--no-sandbox'])
              page=browser.new_page(viewport={'width':1440,'height':1200},device_scale_factor=2)
              page.goto(path.as_uri(),wait_until='load')
              page.evaluate('document.fonts.ready')
              assert page.locator('.feature-grid .feature').count()==6
              assert page.locator('.action-grid .action-card').count()==3
              for alt,url in targets.items():
                  qr=page.locator(f'img[alt="{alt}"]')
                  assert qr.evaluate('(e)=>e.complete && e.naturalWidth>0'),alt
                  assert qr.locator('xpath=ancestor::a[1]').get_attribute('href')==url,alt
              assert page.locator('.hero-photo img').evaluate('(e)=>e.complete && e.naturalWidth>0')
              page.locator('.sheet').screenshot(path=str(qa/'screen.png'))
              screen_decoded=decode(Image.open(qa/'screen.png'))
              assert expected<=screen_decoded, ('Screen QR',screen_decoded)
              def check_layout():
                  return page.evaluate('''() => {const r=s=>document.querySelector(s).getBoundingClientRect(); const grid=r('.action-grid'),f=r('.footer'),card=r('.action-card.demo'),qr=r('.action-card.demo img'),copy=r('.action-card.demo .action-copy'),url=r('.site-url'),site=r('.action-card.site'),siteQR=r('.action-card.site img');return {cardBottom:grid.bottom,footerTop:f.top,qrLeft:qr.left,qrRight:qr.right,cardLeft:card.left,cardRight:card.right,copyRight:copy.right,officialUrlRight:url.right,officialCardRight:site.right,officialQrLeft:siteQR.left}}''')
              def verify_layout(v):
                  assert v['cardBottom']<=v['footerTop']+1,v
                  assert v['qrLeft']>=v['cardLeft']-1 and v['qrRight']<=v['cardRight']+1,v
                  assert v['copyRight']<=v['qrLeft']+1,v
                  assert v['officialUrlRight']<=v['officialCardRight']+1 and v['officialUrlRight']<=v['officialQrLeft']+1,v
              layout=check_layout(); verify_layout(layout)
              page.emulate_media(media='print')
              print_layout=check_layout(); verify_layout(print_layout)
              page.pdf(path=str(pdf),prefer_css_page_size=True,print_background=True)
              browser.close()
          with fitz.open(pdf) as doc:
              assert len(doc)==1, f'A4 expected 1 page, got {len(doc)}'
              p=doc[0]; assert abs(p.rect.width-595.28)<3 and abs(p.rect.height-841.89)<3
              p.get_pixmap(matrix=fitz.Matrix(3,3),alpha=False).save(str(qa/'print.png'))
          printed=decode(Image.open(qa/'print.png'))
          assert expected<=printed, ('Printed QR',printed)
          # Non-mutating public GET checks only. Do not run DEMO prepare or create cases.
          checks={}
          api='https://cbknucemarcpbscirzyv.supabase.co/functions/v1/buyback-product-ready'
          endpoints={'customer_demo':demo,'owner':base+'owner.html?demo=1','member':base+'member.html?demo=1','staff':base+'staff.html?demo=1','ipad':base+'owner-ipad.html?demo=1','system_check':base+'system-check.html','health':api+'/api/product-ready/check','public_config':api+'/api/public/config?shop_code=dpro_buyback_demo','assessment_options':api+'/api/public/assessment-options?shop_code=dpro_buyback_demo','legacy_health':'https://dpro-buyback-line-api.dpromstk2000.workers.dev/api/health'}
          for key,url in endpoints.items():
              try:
                  response=requests.get(url,timeout=15)
                  item={'http':response.status_code,'ok':response.ok}
                  if key in {'health','public_config','assessment_options','legacy_health'} and response.ok:
                      data=response.json()
                      if isinstance(data,dict):
                          item['api_ok']=data.get('ok')
                          if data.get('ok') is False: item['ok']=False
                          if key=='health':
                              item['versions_aligned']=data.get('versions',{}).get('versionsAligned')
                              item['line_binding']=data.get('line',{}).get('tenantBinding')
                              item['demo_production_fallback']=data.get('security',{}).get('demoCodeProductionFallback')
                              if item['versions_aligned'] is False or item['demo_production_fallback'] is True: item['ok']=False
                  checks[key]=item
              except Exception as e:
                  checks[key]={'ok':False,'error':type(e).__name__}
              if not checks[key]['ok']: print(f'::warning::Public GET check {key}: {checks[key]}')
          report={'result':'FLYER_QA_PASS','old_qr_decoded':old_qr,'new_qr':new_qr,'screen_qr':sorted(screen_decoded),'print_qr':sorted(printed),'a4_pages':1,'screen_layout':layout,'print_layout':print_layout,'public_get':checks,'business_mutation':0,'note':'GET results do not establish authenticated business-operation QA.'}
          (qa/'RESULT.json').write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(report,ensure_ascii=False,indent=2))
          PY
      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BUYBACK-DEMO-QR-R1-QA
          path: buyback-qr-qa/
          if-no-files-found: warn
      - name: Commit only verified flyer and PDF
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- flyer-buyback.html flyer-buyback.pdf
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'BUYBACK: improve QR readability and refresh verified A4 PDF'
          git push origin HEAD:main
