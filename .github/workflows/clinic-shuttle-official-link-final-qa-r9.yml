name: DPRO Clinic Shuttle Official Link Final QA R9

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/clinic-shuttle-official-link-final-qa-r9.yml"
      - ".github/workflows/clinic-shuttle-official-link-final-qa-r9.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dpro-clinic-shuttle-official-link-final-qa-r9
  cancel-in-progress: false

jobs:
  official-link-final-qa-r9:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - name: Checkout PRODUCT
        uses: actions/checkout@v4
        with:
          fetch-depth: 4

      - name: Guard R8 PRODUCT SYSTEM FINAL LOCK and OFFICIAL
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "fd3d18716ad4cfb57121ed240d7c2dc9f61bbd76" || {
            echo "PRODUCT R8 parent drift"; exit 1;
          }
          grep -q "CLINIC_SHUTTLE:'clinic-shuttle'" product-v3.6.js
          SYSTEM_HEAD="$(git ls-remote https://github.com/dpromstk2000-lab/dpro-clinic-shuttle-line.git refs/heads/main | awk '{print $1}')"
          test "$SYSTEM_HEAD" = "3fc09f4b5c6781d6038dc280de5c58752ce60b51" || {
            echo "SYSTEM FINAL LOCK drift: $SYSTEM_HEAD"; exit 1;
          }
          OFFICIAL_HEAD="$(git ls-remote https://github.com/dpromstk2000-lab/dpro-shop-official-site.git refs/heads/main | awk '{print $1}')"
          test "$OFFICIAL_HEAD" = "b92a4d6444375aefc481db267d626c5a712164a5" || {
            echo "OFFICIAL head drift: $OFFICIAL_HEAD"; exit 1;
          }

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install browser QA
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Verify exact clinic shuttle official links
        run: python .github/workflows/clinic-shuttle-official-link-final-qa-r9.py

      - name: Commit R9 link evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/clinic-shuttle-next
          git commit -m "Verify clinic shuttle official links R9"
          git push origin main

      - name: Remove R8 and R9 one-shot workflows
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin main
          for f in \
            .github/workflows/clinic-shuttle-official-link-hotfix-r8.yml \
            .github/workflows/clinic-shuttle-official-link-hotfix-r8.py \
            .github/workflows/clinic-shuttle-official-link-final-qa-r9.yml \
            .github/workflows/clinic-shuttle-official-link-final-qa-r9.py; do
              test -e "$f" && git rm -f "$f" || true
          done
          git commit -m "Remove completed clinic shuttle link workflows"
          git push origin main
