name: DPRO MEDICAL TUTORIAL R6 PRODUCT SITE V1.0

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/dpro-medical-tutorial-r6-product-site-v1.yml"

permissions:
  contents: write

env:
  START_PRODUCT_HEAD: 05dc125591767190d8f4e59fedbfed22a28131ee
  PRODUCT_PUBLIC: https://dpromstk2000-lab.github.io/dpro-line-systems-site/systems/medical.html
  TUTORIAL_URL: https://dpromstk2000-lab.github.io/dpro-medical-standard/medical-public-demo.html#dpro-tutorial-launcher
  GUIDE_URL: https://dpromstk2000-lab.github.io/dpro-medical-standard/medical-public-demo.html#dpro-guide-launcher
  QUICK_URL: https://dpromstk2000-lab.github.io/dpro-medical-standard/DPRO_TUTORIAL_MEDICAL_QUICK_START_V1.0.pdf
  DETAIL_URL: https://dpromstk2000-lab.github.io/dpro-medical-standard/DPRO_TUTORIAL_MEDICAL_DETAILED_MANUAL_V1.0.pdf
  QUICK_SHA256: b1d353ed147332d913ae5eedf36b69f567d99cf51a3b561ca5151b992ce4bc4a
  DETAIL_SHA256: a125667589f4dd989827e8bcf3d2ff76f34422bf250073ac8b179075528bd306

jobs:
  r6-product-site:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout newest Product Site main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Canonical prewrite lock and protected boundary checks
        shell: bash
        run: |
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" || { echo "R6 HOLD: checkout is not newest main"; exit 1; }
          git merge-base --is-ancestor "$START_PRODUCT_HEAD" HEAD || { echo "R6 HOLD: START observed head is not ancestor of newest main"; exit 1; }
          test -f systems/medical.html
          test ! -e systems/medical.html.txt || { echo "R6 HOLD: matching .html.txt now exists; workflow was authorized for HTML-only target"; exit 1; }
          echo "PREWRITE_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "PREWRITE_TREE=$(git rev-parse HEAD^{tree})" >> "$GITHUB_ENV"
          echo "Newest Product Site main: $(git rev-parse HEAD) / $(git rev-parse HEAD^{tree})"
          git status --porcelain

      - name: Reverify all four R5 public resources before Product Site write
        shell: bash
        run: |
          curl -fL --retry 4 --retry-delay 3 -o /tmp/quick.pdf "$QUICK_URL"
          curl -fL --retry 4 --retry-delay 3 -o /tmp/detail.pdf "$DETAIL_URL"
          echo "$QUICK_SHA256  /tmp/quick.pdf" | sha256sum -c -
          echo "$DETAIL_SHA256  /tmp/detail.pdf" | sha256sum -c -
          curl -fL --retry 4 --retry-delay 3 -o /tmp/tutorial.html "$TUTORIAL_URL"
          test "$(wc -c < /tmp/tutorial.html)" -gt 5000 || { echo "R6 HOLD: Tutorial/Guide base page unexpectedly small"; exit 1; }
          head -c 4 /tmp/quick.pdf | grep -q '%PDF'
          head -c 4 /tmp/detail.pdf | grep -q '%PDF'
          echo "R5 public resource re-verification PASS"

      - name: Prepare exact R6 patch and QA scripts
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/r6_patch.py
          echo '' | base64 -d > /tmp/r6_qa.mjs
          echo '' | base64 -d > /tmp/r6_build_return.py
          python3 -m py_compile /tmp/r6_patch.py /tmp/r6_build_return.py
          node --check /tmp/r6_qa.mjs

      - name: Patch only systems medical page and run reverse-diff guard
        shell: bash
        run: |
          python3 /tmp/r6_patch.py
          git diff --check
          test "$(git diff --name-only | wc -l)" -eq 1
          test "$(git diff --name-only)" = "systems/medical.html"
          grep -q 'data-tutorial-r6="MEDICAL-R6-V1.0-20260830"' systems/medical.html
          test "$(grep -o 'data-r6-link=' systems/medical.html | wc -l)" -eq 4
          python3 - <<'PY2'
          from pathlib import Path
          pre=Path('/tmp/medical.pre.html').read_text(encoding='utf-8')
          post=Path('systems/medical.html').read_text(encoding='utf-8')
          for s in ['DPRO MEDICAL｜予約だけで終わらない医療機関向けDPROシステム','../flyer-medical.html','../flyer-medical.pdf','https://dpro-shop.com/systems/medical','../systems.html?category=medical_pet#catalog']:
              assert s in pre and s in post, s
          print('Product regression sentinels present before and after')
          PY2

      - name: Commit R6 Product Site integration forward-only
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add systems/medical.html
          git commit -m "Add MEDICAL Tutorial R6 resources to Product Site"
          git push origin main
          echo "R6_PRODUCT_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "R6_PRODUCT_TREE=$(git rev-parse HEAD^{tree})" >> "$GITHUB_ENV"
          git merge-base --is-ancestor "$PREWRITE_HEAD" HEAD
          test "$(git diff --name-only "$PREWRITE_HEAD"..HEAD | grep -v '^.github/workflows/dpro-medical-tutorial-r6-product-site-v1.yml$' | wc -l)" -eq 1
          test "$(git diff --name-only "$PREWRITE_HEAD"..HEAD | grep -v '^.github/workflows/dpro-medical-tutorial-r6-product-site-v1.yml$')" = "systems/medical.html"

      - name: Wait for exact R6 Product Site public LIVE
        shell: bash
        run: |
          ok=0
          for i in $(seq 1 48); do
            if curl -fsSL --retry 2 "$PRODUCT_PUBLIC?dpro_r6=$RANDOM$RANDOM" | grep -q 'MEDICAL-R6-V1.0-20260830'; then ok=1; break; fi
            sleep 10
          done
          test "$ok" -eq 1 || { echo "R6 HOLD: Product Site public marker did not become LIVE"; exit 1; }
          echo "R6 Product Site public marker LIVE"

      - name: Install Playwright Chromium
        shell: bash
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: R6 exact four-viewport public LIVE QA
        shell: bash
        run: |
          cp /tmp/r6_qa.mjs ./r6_qa.mjs
          node r6_qa.mjs
          python3 - <<'PY2'
          import json
          x=json.load(open('R6_LIVE_QA.json',encoding='utf-8'))
          assert x['pass'] is True
          assert len(x['views']) == 4
          assert x['businessMutation'] == 0
          assert x['productRegression'] == 0
          assert x['productRollback'] == 0
          for v in x['views']:
              assert v['pageErrors'] == []
              assert v['consoleErrors'] == []
              assert v['unsafeRequests'] == []
              assert v['businessMutation'] == 0
              assert v['productRegression'] == 0
              assert v['productRollback'] == 0
              if v['width'] in [390,320]:
                  assert v['positiveOverflow'] == 0
                  assert v['dims']['innerWidth'] == v['width']
                  assert v['dims']['documentElementScrollWidth'] == v['width']
                  assert v['dims']['bodyScrollWidth'] == v['width']
          print('R6 exact four-viewport LIVE QA PASS')
          PY2

      - name: Reverify public PDF hashes after R6 integration
        shell: bash
        run: |
          curl -fL --retry 4 --retry-delay 3 -o /tmp/quick-after.pdf "$QUICK_URL"
          curl -fL --retry 4 --retry-delay 3 -o /tmp/detail-after.pdf "$DETAIL_URL"
          echo "$QUICK_SHA256  /tmp/quick-after.pdf" | sha256sum -c -
          echo "$DETAIL_SHA256  /tmp/detail-after.pdf" | sha256sum -c -

      - name: Remove temporary R6 workflow after FULL PASS
        shell: bash
        run: |
          git rm .github/workflows/dpro-medical-tutorial-r6-product-site-v1.yml
          git commit -m "Remove temporary MEDICAL R6 workflow [skip ci]"
          git push origin main
          echo "FINAL_PRODUCT_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "FINAL_PRODUCT_TREE=$(git rev-parse HEAD^{tree})" >> "$GITHUB_ENV"
          git merge-base --is-ancestor "$R6_PRODUCT_HEAD" HEAD
          echo "Temporary R6 workflow removed after FULL PASS"

      - name: Build flat-root R6 CENTRAL RETURN
        shell: bash
        run: |
          python3 /tmp/r6_build_return.py
          test -f central_return/00_START_HERE.txt
          test -f central_return/STATUS.txt
          test -f central_return/SHA256.txt
          test "$(find central_return -mindepth 1 -maxdepth 1 -type d | wc -l)" -eq 0
          (cd central_return && sha256sum -c SHA256.txt)
          find central_return -maxdepth 1 -type f -printf '%f\n' | sort

      - name: Upload R6 CENTRAL RETURN artifact
        uses: actions/upload-artifact@v4
        with:
          name: DPRO_TUTORIAL_BATCH10_MEDICAL_R6_CENTRAL_RETURN_V1.0_20260830
          path: central_return/*
          if-no-files-found: error
          retention-days: 14

      - name: Upload R6 QA screenshots artifact
        uses: actions/upload-artifact@v4
        with:
          name: DPRO_TUTORIAL_BATCH10_MEDICAL_R6_QA_SCREENSHOTS_V1.0_20260830
          path: r6_screenshots/*.png
          if-no-files-found: error
          retention-days: 14
